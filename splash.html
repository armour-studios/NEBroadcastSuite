<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0b0c0f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-app-region: drag;
    color: #fff;
  }

  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 18px;
    padding-bottom: 28px;
  }

  .logo {
    width: 72px;
    height: 72px;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.88);
    animation: logo-in 0.55s cubic-bezier(.22,.68,0,1.4) 0.1s forwards,
               logo-breathe 3s ease-in-out 0.7s infinite;
  }

  @keyframes logo-in {
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes logo-breathe {
    0%, 100% { opacity: 0.88; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.035); }
  }

  .wordmark {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    opacity: 0;
    animation: fade-up 0.45s ease-out 0.35s forwards;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #c5c8d0;
  }

  .tag {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
  }

  /* ── Scanning bar at the bottom ──────────────────────────── */
  .bar-track {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: rgba(255,255,255,0.05);
    overflow: hidden;
  }

  .bar {
    height: 100%;
    width: 35%;
    background: linear-gradient(90deg, transparent, #4aa3ff 40%, #6caaff 60%, transparent);
    animation: scan 1.6s cubic-bezier(.4,0,.6,1) 0.5s infinite;
  }

  @keyframes scan {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(386%); }
  }

  /* ── Bottom brand line ───────────────────────────────────── */
  .brand {
    position: absolute;
    bottom: 14px;
    width: 100%;
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.18);
    opacity: 0;
    animation: fade-up 0.5s ease-out 0.6s forwards;
  }
</style>
</head>
<body>
  <div class="splash">
    <img src="assets/images/small.png" class="logo" alt="">
    <div class="wordmark">
      <div class="name">NE Broadcast Suite</div>
      <div class="tag">by Armour Studios</div>
    </div>
  </div>
  <div class="bar-track"><div class="bar"></div></div>
  <div class="brand">Loading&hellip;</div>
</body>
</html>
