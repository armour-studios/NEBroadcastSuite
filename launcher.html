<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NE Broadcast Suite</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0b0c0f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-app-region: drag;
    color: #fff;
  }
  button, input, a { -webkit-app-region: no-drag; }

  .close-btn {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    width: 26px; height: 26px; border-radius: 7px; border: none; cursor: pointer;
    background: transparent; color: rgba(255,255,255,.35); font-size: 15px; line-height: 1;
    -webkit-app-region: no-drag;
  }
  .close-btn:hover { background: rgba(255,255,255,.08); color: #fff; }

  .wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 12px 32px 44px; gap: 9px;   /* bottom pad clears the updates footer */
  }

  .logo {
    width: 46px; height: 46px; object-fit: contain;
    opacity: 0; transform: scale(0.88);
    animation: logo-in 0.55s cubic-bezier(.22,.68,0,1.4) 0.1s forwards;
  }
  body.is-loading .logo { animation: logo-in 0.55s cubic-bezier(.22,.68,0,1.4) 0.1s forwards,
                                     logo-breathe 3s ease-in-out 0.7s infinite; }
  @keyframes logo-in { to { opacity: 1; transform: scale(1); } }
  @keyframes logo-breathe { 0%, 100% { opacity: .88; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }

  .wordmark { display: flex; flex-direction: column; align-items: center; gap: 4px;
    opacity: 0; animation: fade-up 0.45s ease-out 0.3s forwards; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .name { font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #c5c8d0; }
  .tag  { font-size: 9px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.28); }

  /* ── Modes ── */
  .mode { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; margin-top: 4px; }
  body.is-boot     #mode-boot,
  body.is-login    #mode-login,
  body.is-contract #mode-contract,
  body.is-loading  #mode-loading { display: flex; }
  body.is-contract .wrap { justify-content: flex-start; padding-top: 18px; }
  body.is-contract .logo { width: 34px; height: 34px; }

  /* ── License agreement (first sign-in after approval) ── */
  .lic-head { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #c5c8d0; text-align: center; }
  .lic-box {
    width: 100%; flex: 1; min-height: 120px; overflow-y: auto; text-align: left;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.1); border-radius: 9px;
    padding: 12px 14px; font-size: 11px; line-height: 1.55; color: rgba(255,255,255,.72);
    -webkit-app-region: no-drag; user-select: text; -webkit-user-select: text;
  }
  .lic-box h3 { font-size: 11px; color: #fff; margin: 10px 0 4px; }
  .lic-box p { margin-bottom: 6px; }
  .lic-row { display: flex; gap: 6px; width: 100%; }
  .lic-row input {
    flex: 1; height: 34px; padding: 0 10px; border-radius: 7px; font-family: inherit; font-size: 12px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: #fff; outline: none;
  }
  .lic-row input:focus { border-color: rgba(88,101,242,.6); }
  .lic-accept {
    height: 34px; padding: 0 18px; border-radius: 7px; border: none; cursor: pointer;
    background: #5865f2; color: #fff; font-size: 12px; font-weight: 700; font-family: inherit;
  }
  .lic-accept:hover { background: #6a76f4; }
  .lic-accept:disabled { opacity: .55; cursor: default; }
  #mode-contract { flex: 1; min-height: 0; }

  .status-msg { font-size: 12px; color: rgba(255,255,255,.45); text-align: center; min-height: 16px; }

  .discord-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; height: 40px; border-radius: 9px; border: none; cursor: pointer;
    background: #5865f2; color: #fff; font-size: 13px; font-weight: 700; font-family: inherit;
    transition: background .15s;
  }
  .discord-btn:hover { background: #6a76f4; }
  .discord-btn:disabled { opacity: .55; cursor: default; }

  .email-toggle {
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 11px; color: rgba(255,255,255,.35); text-decoration: underline;
  }
  .email-toggle:hover { color: rgba(255,255,255,.6); }
  /* Discord and email are alternate views in the same slot — keeps the window short. */
  #view-discord { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .email-form { display: none; flex-direction: column; gap: 6px; width: 100%; }
  #mode-login.email-view #view-discord { display: none; }
  #mode-login.email-view .email-form { display: flex; }
  .email-form input {
    height: 32px; padding: 0 10px; border-radius: 7px; font-family: inherit; font-size: 12px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: #fff; outline: none;
  }
  .email-form input:focus { border-color: rgba(88,101,242,.6); }
  .email-btn {
    height: 32px; border-radius: 7px; border: 1px solid rgba(255,255,255,.14); cursor: pointer;
    background: rgba(255,255,255,.06); color: #fff; font-size: 12px; font-weight: 600; font-family: inherit;
  }
  .email-btn:hover { background: rgba(255,255,255,.1); }

  .note { font-size: 11px; line-height: 1.45; color: #f87171; text-align: center; min-height: 14px;
    max-height: 48px; overflow-y: auto; -webkit-app-region: no-drag; }
  .note a { color: #7dd3fc; text-decoration: underline; }
  .note.ok { color: #9ae6b4; }

  /* ── Footer: updates ── */
  .footer {
    position: absolute; bottom: 14px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .upd-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: rgba(255,255,255,.35);
  }
  .upd-btn:hover { color: rgba(255,255,255,.65); }
  .upd-btn:disabled { opacity: .5; cursor: default; }
  .upd-status { font-size: 10px; color: rgba(255,255,255,.3); min-height: 13px; }

  /* ── Scanning bar (boot + loading) ── */
  .bar-track {
    position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: rgba(255,255,255,.05); overflow: hidden; display: none;
  }
  body.is-boot .bar-track, body.is-loading .bar-track { display: block; }
  .bar {
    height: 100%; width: 35%;
    background: linear-gradient(90deg, transparent, #4aa3ff 40%, #6caaff 60%, transparent);
    animation: scan 1.6s cubic-bezier(.4,0,.6,1) 0.3s infinite;
  }
  @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(386%); } }
</style>
</head>
<body class="is-boot">
  <button class="close-btn" onclick="window.close()" title="Close">&#10005;</button>
  <div class="wrap">
    <img src="assets/images/small.png" class="logo" alt="">
    <div class="wordmark">
      <div class="name">NE Broadcast Suite</div>
      <div class="tag">by Armour Studios</div>
    </div>

    <!-- BOOT: waiting for the local server / checking the saved session -->
    <div class="mode" id="mode-boot">
      <div class="status-msg" id="boot-msg">Checking session&hellip;</div>
    </div>

    <!-- LOGIN: not authenticated — Discord view and email view share the same slot -->
    <div class="mode" id="mode-login">
      <div id="view-discord">
        <button class="discord-btn" id="btn-discord">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
          Sign in with Discord
        </button>
      </div>
      <form class="email-form" id="email-form">
        <input type="email" id="email" placeholder="Email (namelessesports.com account)" autocomplete="username">
        <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
        <button type="submit" class="email-btn">Sign in with email</button>
      </form>
      <!-- Email login parked for now — Discord only. Remove display:none to re-enable. -->
      <button class="email-toggle" id="email-toggle" style="display:none;">Use email instead</button>
      <div class="note" id="login-note"></div>
    </div>

    <!-- CONTRACT: approved, license not signed yet — review + e-sign right here -->
    <div class="mode" id="mode-contract">
      <div class="lic-head" id="lic-title">License Agreement</div>
      <div class="lic-box" id="lic-box"></div>
      <div class="lic-row">
        <input type="text" id="lic-name" placeholder="Type your full legal name to sign" autocomplete="name">
        <button class="lic-accept" id="lic-accept">Accept</button>
      </div>
      <div class="note" id="lic-note"></div>
      <button class="email-toggle" id="lic-back">Back to sign-in</button>
    </div>

    <!-- LOADING: authenticated — play the load animation, then launch the studio -->
    <div class="mode" id="mode-loading">
      <div class="status-msg" id="loading-msg">Loading your studio&hellip;</div>
    </div>
  </div>

  <div class="footer">
    <button class="upd-btn" id="btn-updates">
      <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
      Check for Updates
    </button>
    <div class="upd-status" id="upd-status"></div>
  </div>
  <div class="bar-track"><div class="bar"></div></div>

<script>
(function () {
  'use strict';
  var API = 'http://localhost:3000';
  // The load animation is now a WINDOW, not a sleep: show it for at least LOAD_MIN_MS so it does
  // not flash, then launch as soon as the studio reports it has painted, and give up waiting at
  // LOAD_MAX_MS. It used to be a flat 5s tacked onto every launch regardless of readiness.
  var LOAD_MIN_MS = 900;
  var LOAD_MAX_MS = 6000;
  var LOAD_POLL_MS = 150;
  var el = function (id) { return document.getElementById(id); };
  var mode = 'boot';
  var launched = false;
  var oauthInFlight = false;
  var lastSeenError = '';

  function setMode(m, msg) {
    mode = m;
    document.body.className = 'is-' + m;
    if (m === 'loading' && msg) el('loading-msg').textContent = msg;
    if (m === 'boot' && msg) el('boot-msg').textContent = msg;
  }

  // Backend denials point at the studio site — render the URL as a clickable link
  // (target=_blank routes through the window-open handler → system browser).
  function note(text, ok) {
    var n = el('login-note');
    n.className = 'note' + (ok ? ' ok' : '');
    var esc = String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    n.innerHTML = esc.replace(/https:\/\/[^\s<>"]*[^\s<>".,)!?]/g, function (url) {
      return '<a href="' + url + '" target="_blank" rel="noopener">' + url.replace(/^https:\/\//, '') + '</a>';
    });
  }

  function startLoadAndLaunch() {
    if (launched) return;
    launched = true;
    setMode('loading', 'Loading your studio…');
    var startedAt = Date.now();
    // Wait for the studio to paint (panelReady), bounded below by LOAD_MIN_MS and above by
    // LOAD_MAX_MS, then run the final auth gate below.
    (function waitForPanel() {
      var waited = Date.now() - startedAt;
      if (waited >= LOAD_MAX_MS) return finishLaunch();
      fetch(API + '/api/oauth/discord/status')
        .then(function (r) { return r.json(); })
        .then(function (s) {
          if (s && s.panelReady && waited >= LOAD_MIN_MS) return finishLaunch();
          setTimeout(waitForPanel, LOAD_POLL_MS);
        })
        .catch(function () { setTimeout(waitForPanel, LOAD_POLL_MS); });
    })();
  }

  function finishLaunch() {
    setTimeout(function () {
      // Final gate: the server re-validates cloud access shortly after boot — if this
      // user was revoked while the load animation played, bounce to login with the reason.
      fetch(API + '/api/oauth/discord/status')
        .then(function (r) { return r.json(); })
        .then(function (s) {
          if (s && !s.connected) {
            launched = false;
            oauthInFlight = false;
            var b = el('btn-discord'); if (b) b.disabled = false;
            setMode('login');
            if (s.lastError) note(s.lastError);
            lastSeenError = s.lastError || '';
            setTimeout(poll, 1200);
            return;
          }
          fetch(API + '/api/launcher/launch', { method: 'POST' }).catch(function () {});
        })
        .catch(function () {
          // Status check failed (server busy) — launch anyway; the in-app gate still guards.
          fetch(API + '/api/launcher/launch', { method: 'POST' }).catch(function () {});
        });
    }, 0);
  }

  // ── License agreement (approved, unsigned) — shown right in the launcher ──
  function resizeWin(w, h) {
    fetch(API + '/api/launcher/resize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ width: w, height: h })
    }).catch(function () {});
  }
  function enterContract() {
    if (mode === 'contract') return;
    fetch(API + '/api/cloud/contract')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.pending) return;
        var lic = d.license || {};
        el('lic-title').textContent = lic.title || 'License Agreement';
        var box = el('lic-box');
        box.textContent = '';
        if (lic.preamble) { var p = document.createElement('p'); p.textContent = lic.preamble; box.appendChild(p); }
        (lic.sections || []).forEach(function (sec) {
          var h = document.createElement('h3'); h.textContent = sec.title; box.appendChild(h);
          (sec.clauses || []).forEach(function (c) { var cp = document.createElement('p'); cp.textContent = c; box.appendChild(cp); });
        });
        el('lic-note').textContent = '';
        el('lic-name').value = '';
        oauthInFlight = false;
        var b = el('btn-discord'); if (b) b.disabled = false;
        resizeWin(640, 640);
        setMode('contract');
      })
      .catch(function () {});
  }
  el('lic-back').addEventListener('click', function () {
    resizeWin(440, 360);
    setMode('login');
    setTimeout(poll, 400);
  });
  el('lic-accept').addEventListener('click', function () {
    var name = (el('lic-name').value || '').trim();
    var noteEl = el('lic-note');
    if (name.length < 3) { noteEl.className = 'note'; noteEl.textContent = 'Type your full legal name to sign the agreement.'; return; }
    el('lic-accept').disabled = true;
    noteEl.className = 'note ok'; noteEl.textContent = 'Recording your signature…';
    fetch(API + '/api/cloud/contract/accept', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ signatureName: name })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        el('lic-accept').disabled = false;
        if (d && d.ok) {
          resizeWin(440, 360);
          startLoadAndLaunch();   // signed in — play the load animation and open the studio
        } else {
          noteEl.className = 'note';
          noteEl.textContent = (d && d.message) || 'Could not record the signature — try again.';
        }
      })
      .catch(function () {
        el('lic-accept').disabled = false;
        noteEl.className = 'note';
        noteEl.textContent = 'Could not reach the app server — try again.';
      });
  });

  // ── Session poll: waits for the local server to come up, then resolves auth ──
  var firstResolve = true;
  function poll() {
    if (launched || mode === 'contract') return;
    fetch(API + '/api/oauth/discord/status')
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (launched || mode === 'contract') return;
        if (s && s.connected) { startLoadAndLaunch(); return; }
        if (s && s.needsContract) { enterContract(); setTimeout(poll, 1200); return; }
        if (firstResolve) {
          firstResolve = false;
          setMode('login');
          if (s && s.lastError) note(s.lastError);
        } else if (oauthInFlight && s && s.lastError && s.lastError !== lastSeenError) {
          // The browser callback ran and failed — surface why.
          oauthInFlight = false;
          el('btn-discord').disabled = false;
          note(s.lastError);
        }
        lastSeenError = (s && s.lastError) || '';
        setTimeout(poll, 1200);
      })
      .catch(function () {
        // Server not up yet (it loads right after this window opens) — keep waiting.
        setTimeout(poll, 800);
      });
  }
  poll();

  // ── Discord sign-in: get the OAuth URL, open the system browser, wait for the callback ──
  el('btn-discord').addEventListener('click', function () {
    var btn = el('btn-discord');
    btn.disabled = true;
    note('');
    fetch(API + '/api/oauth/discord/init', { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.url) {
          lastSeenError = '';
          oauthInFlight = true;
          window.open(d.url);   // window-open handler in main.js sends this to the system browser
          note('Finish signing in in the browser window…', true);
        } else {
          btn.disabled = false;
          note((d && d.error) || 'Could not start Discord sign-in.');
        }
      })
      .catch(function () { btn.disabled = false; note('The app server is still starting — try again in a moment.'); });
  });

  // ── Email sign-in (same Nameless account database, over the WS bridge) ──
  el('email-toggle').addEventListener('click', function () {
    var box = el('mode-login');
    var emailView = box.classList.toggle('email-view');
    el('email-toggle').textContent = emailView ? 'Use Discord instead' : 'Use email instead';
  });

  var ws = null;
  function wsConnect() {
    try { ws = new WebSocket('ws://localhost:3001'); } catch (e) { ws = null; setTimeout(wsConnect, 1500); return; }
    ws.onmessage = function (ev) {
      var msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'cloud-email-login') {
        var d = msg.data || {};
        note(d.message || (d.ok ? 'Signed in.' : 'Login failed.'), !!d.ok);
        // Success → the status poll sees connected and starts the load animation.
      } else if (msg.type === 'update_status') {
        updStatus(msg.data || {});
      }
    };
    ws.onclose = function () { ws = null; if (!launched) setTimeout(wsConnect, 1500); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  wsConnect();

  el('email-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var email = (el('email').value || '').trim();
    var pass = el('pass').value || '';
    if (!email || !pass) { note('Enter your email and password.'); return; }
    if (!ws || ws.readyState !== 1) { note('The app server is still starting — try again in a moment.'); return; }
    note('Signing in…', true);
    ws.send(JSON.stringify({ type: 'cloud_email_login', data: { email: email, password: pass } }));
  });

  // ── Updates (electron-updater in the main process, driven over the WS bridge) ──
  function updStatus(s) {
    var btn = el('btn-updates'), out = el('upd-status');
    btn.disabled = s.state === 'checking' || s.state === 'downloading';
    switch (s.state) {
      case 'checking':    out.textContent = 'Checking for updates…'; break;
      case 'up-to-date':  out.textContent = "You're on the latest version" + (s.currentVersion ? ' (v' + s.currentVersion + ')' : '') + '.'; break;
      case 'available':   out.textContent = 'Update available: v' + s.version + ' — downloading…'; break;
      case 'downloading': out.textContent = 'Downloading… ' + (s.percent || 0) + '%'; break;
      case 'downloaded':  out.textContent = 'v' + s.version + ' ready — installs on next restart.'; break;
      case 'error':       out.textContent = 'Update error: ' + (s.message || 'unknown'); break;
      case 'dev':         out.textContent = 'Update checks run in packaged builds only.'; break;
      default:            out.textContent = '';
    }
  }
  el('btn-updates').addEventListener('click', function () {
    if (ws && ws.readyState === 1) {
      updStatus({ state: 'checking' });
      ws.send(JSON.stringify({ type: 'check_for_update' }));
    } else {
      el('upd-status').textContent = 'The app server is still starting — try again in a moment.';
    }
  });
})();
</script>
</body>
</html>
