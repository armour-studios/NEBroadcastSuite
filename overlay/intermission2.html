<!DOCTYPE html>
<!--
  intermission2.html — RLCS-style intermission overlay.
  Brand panel + "STARTING SOON" + giant outline countdown, vertically centered.
  Transparent — layer over b-roll in OBS.

  full_state bindings:
    breakScreen.visible / .title / .endsAt / .frozenSeconds
    eventName           — event title shown in brand panel
    brand.logo          — brand logo
    brand.color / brand.accent — accent colours

  URL params:
    ?label=NEXT MAP IN  override label text
    ?title=off          hide event title
    ?showTimer=0        hide countdown
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root { --accent: #e83a8b; --accent2: #8b5cf6; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Stage ── */
    #card {
      position: absolute; inset: 0;
      opacity: 0; transition: opacity .6s ease;
    }
    #card.show { opacity: 1; }

    #card::before {
      content: ''; position: absolute; inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.32) 0%, transparent 24%),
        linear-gradient(to top,    rgba(0,0,0,.24) 0%, transparent 14%);
      pointer-events: none;
    }

    /* ── Corner brackets ── */
    .corner { position: absolute; width: 110px; height: 110px; z-index: 2; }
    .corner-tl { top: 52px; left: 52px; }
    .corner-tr { top: 52px; right: 52px; transform: scaleX(-1); }
    .corner-bl { bottom: 52px; left: 52px; transform: scaleY(-1); }
    .corner-br { bottom: 52px; right: 52px; transform: scale(-1); }

    .arm-h, .arm-v { position: absolute; background: rgba(255,255,255,.3); }
    .arm-h { top: 0; left: 0; width: 110px; height: 2px; }
    .arm-v { top: 0; left: 0; width: 2px; height: 110px; }
    .arm-h::after {
      content: ''; position: absolute; top: -2px; left: 0;
      width: 32px; height: 6px; border-radius: 3px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.95) 40%, rgba(255,255,255,.95) 60%, transparent);
      filter: drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 12px var(--accent));
      animation: scanH 7s ease-in-out infinite;
    }
    @keyframes scanH {
      0%, 22%   { transform: translateX(-32px); opacity: 0; }
      28%       { opacity: 1; }
      60%       { transform: translateX(110px); opacity: 1; }
      66%, 100% { transform: translateX(110px); opacity: 0; }
    }
    .arm-v::after {
      content: ''; position: absolute; left: -2px; top: 0;
      width: 6px; height: 32px; border-radius: 3px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.95) 40%, rgba(255,255,255,.95) 60%, transparent);
      filter: drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 12px var(--accent));
      animation: scanV 7s ease-in-out infinite 3.5s;
    }
    @keyframes scanV {
      0%, 22%   { transform: translateY(-32px); opacity: 0; }
      28%       { opacity: 1; }
      60%       { transform: translateY(110px); opacity: 1; }
      66%, 100% { transform: translateY(110px); opacity: 0; }
    }

    /* ── Vertically centred group: brand panel + countdown ── */
    .im2-group {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; z-index: 2;
      transform: translateY(28px);
      transition: transform .9s cubic-bezier(.22,1,.36,1);
    }
    #card.show .im2-group { transform: translateY(0); }

    /* ── Brand panel: logo overlaps top edge ── */
    .brand-wrap {
      position: relative;
      padding-top: 52px; /* space for the logo's upper half */
      flex-shrink: 0;
    }
    .brand-logo {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 104px; height: 104px; object-fit: contain; display: block; z-index: 2;
      animation: logoPulse 3.5s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 6px 20px rgba(0,0,0,.7)) drop-shadow(0 0  0px var(--accent)); }
      50%       { filter: drop-shadow(0 6px 20px rgba(0,0,0,.7)) drop-shadow(0 0 32px var(--accent)); }
    }
    .brand-panel {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 66px 56px 32px;
      min-width: 420px; max-width: 720px; width: max-content;
      background: rgba(6, 8, 16, .90);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 32px 100px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.04);
    }
    .brand-panel::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 2px;
      background: linear-gradient(to right, transparent, var(--accent), var(--accent2), transparent);
      border-radius: 0 0 4px 4px;
      animation: barPulse 2.8s ease-in-out infinite;
    }
    @keyframes barPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .brand-title {
      font-size: 32px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase;
      color: #fff; text-align: center; line-height: 1.15;
      text-shadow: 0 2px 24px rgba(0,0,0,.8);
      white-space: normal; word-break: break-word; max-width: 640px;
    }
    .brand-title.hidden { display: none; }

    /* ── Countdown ── */
    .rl-countdown {
      /* stretch to full group width so text-align centers against 1920px */
      align-self: stretch;
      text-align: center;
      flex-shrink: 0;
    }
    .rl-countdown.hidden { display: none; }

    .rl-label {
      display: block;
      font-size: 24px; font-weight: 900; letter-spacing: .48em; text-transform: uppercase;
      color: var(--accent); line-height: 1; margin-bottom: 16px;
      text-shadow:
        0 3px 18px rgba(0,0,0,.95),
        0 0  50px color-mix(in srgb, var(--accent) 80%, transparent),
        0 0 100px color-mix(in srgb, var(--accent) 40%, transparent);
    }

    .rl-time-wrap { display: block; position: relative; }
    .rl-time-wrap::after {
      content: ''; position: absolute; inset: -30px;
      background: radial-gradient(ellipse 85% 65% at 50% 50%,
        color-mix(in srgb, var(--accent) 14%, transparent) 0%, transparent 70%);
      pointer-events: none; z-index: -1;
      animation: timerGlow 3.5s ease-in-out infinite;
    }
    @keyframes timerGlow { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }

    .rl-time {
      display: block;
      font-size: 640px; font-weight: 900; line-height: .88;
      -webkit-text-stroke: 4px rgba(255,255,255,.9);
      color: transparent; text-align: center; white-space: nowrap;
      text-shadow:
        0 0 120px color-mix(in srgb, var(--accent) 40%, transparent),
        0 0 260px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .rl-time.long-fmt { font-size: 400px; }

    /*
      Fixed-width digit slots: each digit is exactly 1ch (width of the '0' glyph).
      This means '1', '5', '9' etc. all occupy the same horizontal space,
      so the total rendered width never changes between ticks.
    */
    .rl-time .d {
      display: inline-block;
      width: 1ch; text-align: center;
    }
    .rl-time .c {
      display: inline-block;
      width: 0.44ch; text-align: center;
    }

    /* ── Progress bar ── */
    .rl-progress {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 4px; background: rgba(255,255,255,.07);
      overflow: hidden; z-index: 3;
    }
    .rl-progress.hidden { display: none; }
    .rl-progress-fill {
      height: 100%;
      background: linear-gradient(to right, var(--accent), var(--accent2), var(--accent));
      box-shadow: 0 0 14px var(--accent);
      transition: width .9s linear; width: 100%;
      position: absolute; left: 50%; transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div id="card">
    <div class="corner corner-tl"><span class="arm-h"></span><span class="arm-v"></span></div>
    <div class="corner corner-tr"><span class="arm-h"></span><span class="arm-v"></span></div>
    <div class="corner corner-bl"><span class="arm-h"></span><span class="arm-v"></span></div>
    <div class="corner corner-br"><span class="arm-h"></span><span class="arm-v"></span></div>

    <div class="im2-group">
      <!-- Brand panel: logo overlaps top edge -->
      <div class="brand-wrap">
        <img class="brand-logo" id="logo" src="" alt="">
        <div class="brand-panel">
          <div class="brand-title hidden" id="event-title"></div>
        </div>
      </div>

      <!-- Countdown -->
      <div class="rl-countdown hidden" id="countdown-wrap">
        <div class="rl-label" id="label">STARTING SOON</div>
        <div class="rl-time-wrap">
          <div class="rl-time" id="time">—</div>
        </div>
      </div>
    </div>

    <div class="rl-progress hidden" id="progress">
      <div class="rl-progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    const QP     = new URLSearchParams(location.search);
    const QLABEL = QP.get('label');
    const QTITLE = QP.get('title');
    const SHOW_TIMER = QP.get('showTimer') !== '0';
    const card = document.getElementById('card');

    function el(id) { return document.getElementById(id); }
    function fmtTime(sec) {
      sec = Math.max(0, Math.round(sec));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
      return m + ':' + String(s).padStart(2,'0');
    }

    let _endsAt = null, _frozen = null, _totalSec = null, _startedAt = null, _tickTimer = null;

    function startTick() { clearInterval(_tickTimer); _tickTimer = setInterval(tick, 250); }
    function tick() {
      if (_frozen != null) { setTime(fmtTime(_frozen)); updateProgress(_frozen); return; }
      if (!_endsAt) return;
      const rem = Math.max(0, (_endsAt - (typeof SceneBase !== 'undefined' ? SceneBase.now() : Date.now())) / 1000);
      setTime(fmtTime(rem));
      updateProgress(rem);
    }
    function setTime(str) {
      const t = el('time');
      /* Each digit gets a fixed-width span so the total rendered width never changes */
      t.innerHTML = str.split('').map(ch =>
        ch === ':' ? '<span class="c">:</span>' : '<span class="d">' + ch + '</span>'
      ).join('');
      t.classList.toggle('long-fmt', str.length > 5);
    }
    function updateProgress(remSec) {
      const prog = el('progress-fill');
      if (!prog || !_totalSec) return;
      prog.style.width = Math.min(100, Math.max(0, (remSec / _totalSec) * 100)) + '%';
    }

    function render(data) {
      data = data || {};
      const b = data.breakScreen || {};
      const visible = SceneBase.standalone || b.visible;
      card.classList.toggle('show', !!visible);
      if (!visible) return;

      const root = document.documentElement;
      const accent  = SceneBase.brandColor(data);
      const accent2 = SceneBase.brandAccent(data);
      if (accent)  root.style.setProperty('--accent',  accent);
      if (accent2) root.style.setProperty('--accent2', accent2);

      SceneBase.applyTeamLogo(el('logo'), (data.brand && data.brand.logo) || '', '');

      let titleText = '';
      if (QTITLE != null) { titleText = /^(off|none|hide|0)$/i.test(QTITLE.trim()) ? '' : QTITLE.trim(); }
      else { titleText = (data.eventName || '').toString().trim(); }
      el('event-title').textContent = titleText.toUpperCase();
      el('event-title').classList.toggle('hidden', !titleText);

      el('label').textContent = (QLABEL || b.title || 'STARTING SOON').toUpperCase();

      const hasEndsAt = !!b.endsAt, hasFrozen = b.frozenSeconds != null;
      const hasTimer  = SHOW_TIMER && (hasEndsAt || hasFrozen);
      el('countdown-wrap').classList.toggle('hidden', !hasTimer);
      el('progress').classList.toggle('hidden', !hasTimer);

      if (hasTimer) {
        _frozen = hasFrozen ? Math.max(0, Math.round(b.frozenSeconds)) : null;
        _endsAt = hasEndsAt ? b.endsAt : null;
        if (!_startedAt && _endsAt) {
          const remNow = (_endsAt - (typeof SceneBase !== 'undefined' ? SceneBase.now() : Date.now())) / 1000;
          if (remNow > 0 && !_totalSec) { _totalSec = remNow; _startedAt = Date.now(); }
        }
        if (!_tickTimer) startTick();
        tick();
      } else {
        clearInterval(_tickTimer); _tickTimer = null;
      }
    }

    if (location.protocol === 'file:') {
      render({
        breakScreen: { visible: true, title: 'NEXT MAP IN', endsAt: Date.now() + 14 * 60 * 1000 + 2 * 1000 },
        eventName: 'Summer Showdown 2024',
        brand: { color: '#e83a8b', accent: '#8b5cf6', logo: '' }
      });
    } else {
      SceneBase.connect(render);
    }
  </script>
</body>
</html>
