<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>RL Worlds HUD</title>
<link rel="stylesheet" href="/fonts.css">
<!--
  WORLDS Rocket League HUD (overlay/rl-worlds.html) — a separate RL layout ("Worlds HUD"). The Classic /
  React / Player HUDs are untouched; this file only reads the same :3001 bridge.

  LOGOS vs NAMES: live play shows the compact bug (logo tiles + scores + clock). During goal replays and
  the kickoff countdown, team-colour plates slide out from behind the logos carrying the TEAM name, and
  the header widens to "EVENT | ROUND". They slide back when the countdown ends (RoundStarted).

  COLOURS: sides use teams.*.color, which the server already resolves from the producer's colour mode
  (team / brand / game default). Chrome accents (header rule, partner tab, pips, transitions) use the
  active brand kit's colour. FONT: Settings "Overlay Font" > brand-kit font > Montserrat.

  KICKOFF HOLD: after a replay the live furniture (player name/stats + dial) stays off until the
  match clock actually ticks down — rl-hud's rule — so nothing pops back over the countdown.

  TRANSITIONS: overlay/replay-fx.js — the SHARED engine. Same timing as the React HUD (cover holds
  until RL actually cuts to the replay, outro on the "replay ending" cue) and the same three looks
  (slam / cinema / sweep). This layout defaults to 'sweep'; Match ▸ Teams overrides it; ?fx=<style>
  pins one per source. The board's in/out cover uses the same style via ReplayFX.cover().

  TICKER: the existing ticker scene (ticker.html) runs in a lane on the SAME bottom bar as the
  player stats (never a second bar), filling the dead space between them and the boost dial.

  POST-GAME BOARD: this layout does NOT draw its own. It frames rl-hud.html?only=scoreboard, so the
  producer's chosen stats-screen design (Default / Glass / Block / Radar / Compare) + its sponsors
  and background are the same board every other RL layout shows.

  Mode sources: goal_scored / view_change goal → replay; view_change hud → kickoff; rl_kickoff
  {countdown|live}; view_change scoreboard → board; clear_scoreboard / game_reset → back to the HUD.

  Preview: ?dev (cycles live → replay → kickoff → board) or ?dev=live|replay|kickoff|board to hold one.
  ?cam=1 draws a player-cam frame above the bottom-left bar (the camera itself is an OBS source).
-->
<style>
:root{
  --blue:#2f7bff; --orange:#e9a24a;
  --accent:#2f7bff;                          /* brand kit colour */
  --ink:#0c0f16; --ink-2:#161b26; --line:rgba(255,255,255,.08);
  --bar:#000000;          /* the top bug's bars + the sponsor rail read BLACK, not dark grey */
  --paper:#f4f6fa; --txt:#ffffff;
  --muted:#ffffff;        /* labels are WHITE — hierarchy comes from size/weight, not grey text */
  --spec:var(--blue);
  --font:var(--main-font,'Montserrat'),'Montserrat','Segoe UI',sans-serif;
  --label-font:'Montserrat','Segoe UI',sans-serif;   /* real bold at label sizes — see the note below */
  --plate-w:320px;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
/* TRACKING IS IN WHOLE PIXELS EVERYWHERE, never em: at broadcast label sizes (9–13px) an em value
   lands on a fraction (.14em of 11px = 1.54px), the glyph advances round differently along the run,
   and small caps come out looking unevenly spaced. Keep new labels on whole px too. */
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
/* Text rendering matches overlay/rl-hud.html exactly — that HUD's text is the reference the producer
   is happy with: grayscale antialiasing, and the Settings font applied as-is. */
body{position:relative;font-family:var(--font);color:var(--txt);-webkit-font-smoothing:antialiased;}
img{display:block;}
.hidden{display:none !important;}
.num{font-variant-numeric:tabular-nums;font-weight:800;}
.panel{background:linear-gradient(180deg,#141414,#000);}

.hud{transition:opacity .25s;}
body.on-board .hud{opacity:0;}

/* ══ TOP SCOREBUG ══════════════════════════════════════════════════════════════ */
.bug{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:inline-flex;flex-direction:column;padding-top:32px;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));animation:bugDrop .6s var(--ease) backwards;}
@keyframes bugDrop{from{opacity:0;transform:translateX(-50%) translateY(-24px);}}
/* The header is a centred bar ABOVE the row: min-width:100% keeps it at least as wide as the score
   row, and fitHeader() may widen it past that for a long event title (instead of shrinking the type
   into something thin and gappy). Absolute, so its own width never widens the bug itself. */
.hdr{position:absolute;top:0;left:50%;transform:translateX(-50%);min-width:100%;height:32px;
  display:flex;align-items:center;justify-content:center;padding:0 16px;
  background:var(--bar);overflow:hidden;}
.hd-text{display:flex;align-items:center;min-width:0;white-space:nowrap;font-weight:700;font-size:13px;
  letter-spacing:3px;text-transform:uppercase;line-height:1.25;}
.hdr.hd-empty{display:none;}
.hd-event{display:inline-block;overflow:hidden;max-width:0;opacity:0;transition:max-width .5s var(--ease),opacity .45s var(--ease);}
.names .hd-event{opacity:1;}
.sep{color:var(--muted);margin:0 .7em;}
.hd-round{flex:none;}
/* OVERTIME banner — sits ABOVE the header/score (reference-style top tab), sponsor logo + label */
.otbar{width:0;min-width:100%;height:26px;display:none;align-items:center;justify-content:center;gap:12px;
  padding:0 16px;overflow:hidden;background:var(--ot-bg,#d8212c);color:var(--ot-color,#fff);
  border-radius:5px 5px 0 0;animation:otDrop .45s var(--ease);}
.otbar.show{display:flex;}
.otbar img{max-height:16px;max-width:110px;object-fit:contain;}
.otbar img.hidden{display:none;}
.otbar .ot-lbl{font-weight:800;font-size:12px;letter-spacing:3px;text-transform:uppercase;line-height:1;}
@keyframes otDrop{from{opacity:0;transform:translateY(-100%);}}

.row{display:flex;align-items:flex-start;}
.pwrap{width:0;height:80px;overflow:hidden;display:flex;transition:width .55s var(--ease);}
.pwrap.blue{justify-content:flex-end;}
.names .pwrap{width:var(--plate-w);}
.plate{flex:none;width:var(--plate-w);height:80px;position:relative;display:flex;align-items:center;justify-content:center;
  padding:0 24px;overflow:hidden;transition:transform .55s var(--ease);
  box-shadow:inset 0 0 30px rgba(255,255,255,.34),inset 0 0 0 1px rgba(255,255,255,.2),inset 0 2px 0 rgba(255,255,255,.3);}
.plate.blue{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22)),var(--blue);transform:translateX(100%);}
.plate.orange{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22)),var(--orange);transform:translateX(-100%);}
.names .plate{transform:none;}
.plate::after{content:'';position:absolute;top:0;bottom:0;width:80px;left:-110px;transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);}
.names .plate::after{animation:sheen .9s .35s ease-out;}
@keyframes sheen{to{left:calc(100% + 40px);}}
.pname{font-weight:800;font-size:38px;line-height:1;text-transform:uppercase;white-space:nowrap;max-width:100%;overflow:hidden;
  letter-spacing:0;}

/* SQUARE logo tile: start.gg crests are square, so the tile is square and the crest fills it edge to
   edge (a hair of padding keeps it off the seams). A wide wordmark still fits inside uncropped —
   object-fit:contain never crops, it just letterboxes the odd shape. */
.lcol{flex:none;width:80px;display:flex;flex-direction:column;position:relative;z-index:2;}
.ltile{height:80px;display:flex;align-items:center;justify-content:center;background:var(--bar);overflow:hidden;}
.ltile img{width:100%;height:100%;object-fit:contain;padding:2px;}
.ltile img.punch{animation:punch .55s var(--ease);}
@keyframes punch{0%{transform:scale(.5);opacity:0;}65%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
.ltag{height:22px;display:flex;align-items:center;justify-content:center;background:var(--bar);font-family:var(--label-font);
  font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:var(--muted);}

.core{flex:none;display:flex;flex-direction:column;}
.scores{display:flex;height:80px;}
.sc{width:74px;display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1;
  box-shadow:inset 0 0 26px rgba(255,255,255,.34),inset 0 0 0 1px rgba(255,255,255,.18),inset 0 2px 0 rgba(255,255,255,.3);}
.sc.blue{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22)),var(--blue);}
.sc.orange{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22)),var(--orange);}
.sc.bump{animation:bump .7s var(--ease);}
@keyframes bump{35%{transform:scale(1.22);}}
.clock{width:160px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);
  font-size:44px;transition:background .3s,color .3s;}
.clock.ot{background:#d8212c;color:#fff;}
/* the pips span the FULL width of the scoreboard core — each side's set fills its half, so the
   segments stretch edge-to-edge with the centre diamond between them */
.pips{height:22px;display:flex;align-items:center;background:var(--bar);padding:0 10px;gap:6px;}
.pipset{display:flex;gap:5px;flex:1 1 0;min-width:0;}
.pipset.orange{flex-direction:row-reverse;}
.pip{flex:1 1 0;min-width:0;height:5px;background:rgba(255,255,255,.18);}
.pipset.blue .pip.on{background:var(--blue);} .pipset.orange .pip.on{background:var(--orange);}
/* centre mark on the series strip — the same box as a pip, just outlined instead of filled */
.pip-mid{flex:none;height:5px;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9);margin:0 7px;}

/* ══ SPONSORS ══════════════════════════════════════════════════════════════════
   Every placement from the brand kit shows here: title tab under the bug (OT slot in overtime),
   replay sponsor in the replay band, the title-sponsor roll-out off the player bar, and
   "Presented by" on the post-game board. A dark logo gets a light plate so it never disappears. */
img.logo-dark{background:#f4f6fa;padding:4px 10px;box-sizing:content-box;}
.tsp{align-self:center;display:flex;align-items:center;gap:12px;height:36px;padding:0 26px;background:var(--bar);
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,14px 100%);transition:background .3s;}
.tsp.hidden{display:none;}
.tsp img{max-height:24px;max-width:150px;object-fit:contain;}
.tsp .tsp-lbl{display:none;font-weight:800;font-size:13px;letter-spacing:3px;white-space:nowrap;}
/* GAME X OF X, sitting beside the title-sponsor logo at the bottom of the bug */
.tsp .tsp-game{font-family:var(--label-font);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.tsp .tsp-game:empty{display:none;}
.tsp.ot .tsp-game{display:none;}
.tsp.ot{background:var(--ot-bg,#d8212c);}
.tsp.ot .tsp-lbl{display:block;color:var(--ot-color,#fff);}

/* ══ TOP-CORNER BOOST CARDS ════════════════════════════════════════════════════ */
.corner{position:absolute;top:20px;display:flex;flex-direction:column;gap:5px;width:288px;
  transition:transform .45s var(--ease),opacity .35s;}
/* The rails clear the frame for a replay and through the kickoff countdown, and come back with the
   rest of the live furniture once play resumes (the kickoff hold releases on the first clock tick). */
.replay .corner.blue,.kickhold .corner.blue{transform:translateX(-112%);opacity:0;}
.replay .corner.orange,.kickhold .corner.orange{transform:translateX(112%);opacity:0;}
.replay #ptab,.kickhold #ptab{transform:translateX(-112%);opacity:0;}
.corner.blue{left:0;--tc:var(--blue);} .corner.orange{right:0;--tc:var(--orange);}
.bcard{position:relative;height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 18px;overflow:hidden;
  background:#000;
  /* top highlight + a faint always-visible boost TRACK along the bottom (so 0% still reads as a bar) */
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -4px 0 rgba(255,255,255,.06);
  transition:background .28s ease,box-shadow .28s ease;
  animation:slideL .5s var(--ease) backwards;}
.corner.orange .bcard{flex-direction:row-reverse;animation-name:slideR;}
/* cards size to the rail; the SPECTATED one reaches further in toward the centre of frame */
.bcard{width:100%;transition:width .3s var(--ease),background .28s ease,box-shadow .28s ease;}
.corner.blue .bcard{align-self:flex-start;} .corner.orange .bcard{align-self:flex-end;}
.bcard.spec{width:calc(100% + 34px);}
@keyframes slideL{from{transform:translateX(-100%);}} @keyframes slideR{from{transform:translateX(100%);}}
/* team-colour accent on the OUTER edge, so each card reads its side at a glance */
.bcard::after{content:'';position:absolute;top:0;bottom:0;width:4px;background:var(--tc);opacity:.85;}
.corner.blue .bcard::after{left:0;} .corner.orange .bcard::after{right:0;}
.bcard .bn{font-weight:700;font-size:16px;letter-spacing:0;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.corner.orange .bcard .bn{text-align:right;}
.bcard .bv{font-size:19px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;flex:none;min-width:26px;text-align:center;}
.corner.blue .bcard .bv{text-align:right;} .corner.orange .bcard .bv{text-align:left;}
/* boost fill along the bottom edge — team colour + sheen + soft glow (rides over the track) */
.bcard .bbar{position:absolute;left:0;bottom:0;height:4px;width:0;transition:width .25s linear;
  background:var(--tc);background-image:linear-gradient(90deg,rgba(255,255,255,.28),transparent 60%);box-shadow:0 0 8px var(--tc);}
.corner.orange .bbar{left:auto;right:0;background-image:linear-gradient(270deg,rgba(255,255,255,.28),transparent 60%);}
/* spectated player — clearly different: a rich TEAM-COLOUR gradient (not a faded grey wash),
   white text, glowing team-colour outer accent */
.bcard.spec{background:var(--tc);   /* flat team colour — the spectated player owns the rail */
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.5);}
.bcard.spec .bn,.bcard.spec .bv{font-weight:800;color:#fff;}
.bcard.spec::after{width:6px;opacity:1;box-shadow:0 0 16px var(--tc);}
.bcard.demo{opacity:.42;filter:grayscale(.5);}
/* event flash — the instant a player lands a goal/assist/save/shot/demo their whole bar snaps
   to full team colour with white text, and a clean white Rocket League icon pops (Worlds only) */
.bcard.evt{background:var(--tc) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 22px var(--tc);}
.bcard.evt .bn{color:#fff;}
/* the icon TAKES OVER the boost value's spot for the event, so nothing stacks */
.bcard.evt .bv{opacity:0;transition:opacity .1s;}
.bcard.evt::after{opacity:1;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.6);}
.bcard.evt .bbar{background:rgba(255,255,255,.92);box-shadow:0 0 10px rgba(255,255,255,.5);}
.bfx{position:absolute;top:50%;transform:translateY(-50%) scale(1);width:44px;height:44px;opacity:0;pointer-events:none;z-index:4;
  background-color:#fff;
  /* mask-mode:alpha (not the default 'luminance') is load-bearing: without it the mask reads the
     PNG's own brightness per pixel, so darker regions of the icon art render partially see-through
     instead of solid white — mask by SHAPE (alpha), not luminance, for a fully opaque white glyph. */
  mask-mode:alpha;-webkit-mask-mode:alpha;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;}
/* sit centred over the boost-value slot (blue value hugs the right, orange the left) */
.corner.blue .bfx{right:12px;} .corner.orange .bfx{left:12px;}
.bfx.goals{-webkit-mask-image:url(/assets/rl/solid/ball.png);mask-image:url(/assets/rl/solid/ball.png);}
.bfx.assists{-webkit-mask-image:url(/assets/rl/solid/assist.png);mask-image:url(/assets/rl/solid/assist.png);}
.bfx.saves{-webkit-mask-image:url(/assets/rl/solid/save.png);mask-image:url(/assets/rl/solid/save.png);}
.bfx.shots{-webkit-mask-image:url(/assets/rl/solid/shot.png);mask-image:url(/assets/rl/solid/shot.png);}
/* DEMO — a bomb with a lit fuse (the look of RL's own demo tag). Inline SVG rather than the flat
   demolition.png so it reads at this size and can carry its own animation. */
.bfx.demos{-webkit-mask-image:url(/assets/rl/solid/demolition.png);mask-image:url(/assets/rl/solid/demolition.png);}
.bfx.show{animation:bfxPop 1.6s cubic-bezier(.2,1.5,.35,1);}
/* DEMO CALLOUT — RLCS-style pairing across the whole card: who demoed, the bomb, who got demoed.
   Each name sits on its own TEAM's colour, so the card carries both. Only demos do this; every other
   event just pops its icon over the boost value. */
.dcall{position:absolute;inset:0;z-index:6;display:none;align-items:stretch;overflow:hidden;}
.dcall.show{display:flex;}
.dcall .dc-a,.dcall .dc-v{flex:1;min-width:0;display:flex;align-items:center;padding:0 12px;
  font-family:var(--label-font);font-weight:800;font-size:14px;text-transform:uppercase;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dcall .dc-a{justify-content:flex-end;background:var(--dc-a,var(--blue));}
.dcall .dc-v{justify-content:flex-start;background:var(--dc-v,var(--orange));}
.dcall .dc-ic{flex:none;width:46px;background:#000;position:relative;}
.dcall .dc-ic::after{content:'';position:absolute;inset:9px;background-color:#fff;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-image:url(/assets/rl/solid/demolition.png);mask-image:url(/assets/rl/solid/demolition.png);}
.dcall.show .dc-a{animation:dcInL .4s cubic-bezier(.2,.9,.3,1) both;}
.dcall.show .dc-v{animation:dcInR .4s cubic-bezier(.2,.9,.3,1) both;}
.dcall.show .dc-ic::after{animation:dcBomb 1.5s cubic-bezier(.2,1.3,.3,1) both;}
@keyframes dcInL{from{transform:translateX(-100%);}}
@keyframes dcInR{from{transform:translateX(100%);}}
@keyframes dcBomb{0%{opacity:0;transform:scale(.3) rotate(-30deg);}12%{opacity:1;transform:scale(1.35) rotate(8deg);}
  22%{transform:scale(1) rotate(-6deg);}30%{transform:scale(1.06) rotate(5deg);}38%{transform:scale(1) rotate(-3deg);}
  50%,86%{opacity:1;transform:scale(1) rotate(0);}100%{opacity:1;transform:scale(1);}}
.dcall.out{animation:dcOut .32s ease both;}
@keyframes dcOut{to{opacity:0;}}
/* the bomb lands, rattles on its fuse, then blows out bigger than the rest */
.bfx.demos.show{animation:bfxBomb 1.7s cubic-bezier(.2,1.2,.3,1);}
@keyframes bfxBomb{
  0%{opacity:0;transform:translateY(-50%) scale(.25) rotate(-34deg);}
  10%{opacity:1;transform:translateY(-50%) scale(1.5) rotate(10deg);}
  18%{transform:translateY(-50%) scale(1.02) rotate(-9deg);}
  25%{transform:translateY(-50%) scale(1.08) rotate(8deg);}
  32%{transform:translateY(-50%) scale(1) rotate(-6deg);}
  39%{transform:translateY(-50%) scale(1.05) rotate(5deg);}
  46%{transform:translateY(-50%) scale(1) rotate(-3deg);}
  53%{transform:translateY(-50%) scale(1.03) rotate(2deg);}
  62%,74%{opacity:1;transform:translateY(-50%) scale(1) rotate(0);}
  82%{opacity:1;transform:translateY(-50%) scale(1.35);}
  100%{opacity:0;transform:translateY(-50%) scale(2.1);}}
/* snaps in oversized and settles, holds solid WHITE for most of the beat, then lifts away */
@keyframes bfxPop{
  0%{opacity:0;transform:translateY(-50%) scale(.2) rotate(-25deg);}
  12%{opacity:1;transform:translateY(-50%) scale(1.55) rotate(6deg);}
  24%{opacity:1;transform:translateY(-50%) scale(.92) rotate(-2deg);}
  34%{opacity:1;transform:translateY(-50%) scale(1.08) rotate(0);}
  44%,78%{opacity:1;transform:translateY(-50%) scale(1);}
  100%{opacity:0;transform:translateY(-50%) scale(1.5);}}
/* white shock-ring behind the icon on the same beat */
.bcard .bfx-ring{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;z-index:3;opacity:0;
  border:3px solid #fff;pointer-events:none;transform:translateY(-50%) scale(.4);}
.corner.blue .bfx-ring{right:12px;} .corner.orange .bfx-ring{left:12px;}
.bfx-ring.show{animation:bfxRing .75s cubic-bezier(.2,.8,.3,1);}
.bfx-ring.demos{border-color:#ff7a3c;box-shadow:0 0 18px rgba(255,122,60,.55);}
.bfx-ring.demos.show{animation:bfxRing .8s cubic-bezier(.2,.8,.3,1) .55s;}
@keyframes bfxRing{0%{opacity:.95;transform:translateY(-50%) scale(.35);}
  100%{opacity:0;transform:translateY(-50%) scale(2.4);}}

/* ══ PARTNER BANNER ════════════════════════════════════════════════════════════
   A real 3D CUBE under the left boost cards: two full box faces (front + top) mounted on a
   preserve-3d cube. Advancing tumbles the cube a quarter-turn on its X axis so you see the box
   turn over its top edge with depth (not a flat card flip); the sponsor is swapped on the hidden
   face each turn (see renderPartners / rollPartner). Fixed 288px width, team colour on both edges. */
.ptab{position:absolute;left:0;width:288px;height:62px;perspective:820px;
  transition:transform .5s var(--ease),opacity .5s;}
.ptab.out{transform:translateX(-112%);opacity:0;}
.ptab-cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transform:translateZ(-31px) rotateX(0deg);will-change:transform;}
/* each face is a full box: dark glass, both team-colour edges, header strip + logo well */
.ptab-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;
  background:linear-gradient(180deg,rgba(18,18,18,.98),rgba(0,0,0,.99));
  box-shadow:0 14px 26px rgba(0,0,0,.5);}
.ptab-face::before,.ptab-face::after{content:'';position:absolute;top:0;bottom:0;width:4px;z-index:3;
  background:var(--blue);box-shadow:0 0 12px var(--blue);}
.ptab-face::after{left:0;} .ptab-face::before{right:0;}
.pf-front{transform:rotateX(0deg) translateZ(31px);}
.pf-top{transform:rotateX(90deg) translateZ(31px);}
/* header bar: accent tick + PARTNERS label — floats OVER the top of the box rather than taking
   flex space, so the logo below always centres on the FULL box height whether or not it's showing */
.ptab-hd{position:absolute;left:0;right:0;top:0;z-index:4;height:19px;display:flex;align-items:center;padding:0 12px 0 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.015));}
.ptab-hd.empty{display:none;}
.ptab-lbl{display:flex;align-items:center;gap:8px;font-family:var(--label-font);font-weight:800;font-size:9px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);line-height:1;}
.ptab-lbl::before{content:'';width:9px;height:2px;border-radius:1px;background:var(--blue);box-shadow:0 0 6px var(--blue);}
.ptab-lbl:empty{display:none;}
/* logo well — a faint lit backing; logos scale UP to fill it so small marks don't float. Spans the
   FULL face height (the header floats on top of it) so the logo is always centred on the whole box. */
.ptab-slot{position:absolute;inset:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:4px 14px;}
.ptab-slot::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 55% 50%,rgba(255,255,255,.07),transparent 72%);}
.ptab-logo{position:relative;z-index:2;width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;}
.ptab-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.ptab-logo span{font-weight:800;font-size:19px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}

/* ══ STATS SIDEBAR ═════════════════════════════════════════════════════════════
   An optional RLCS-style ranked panel on the right (series stats or league standings). Producer
   toggles it; rows come from state.worldsSidebar. Sits under the orange boost cards and pops in. */
.wsb{position:absolute;right:0;width:300px;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,rgba(20,20,20,.97),rgba(0,0,0,.98));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.5);
  transition:transform .5s var(--ease),opacity .5s;}
.wsb::after{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--orange);opacity:.85;}
.wsb.off{transform:translateX(112%);opacity:0;pointer-events:none;}
.wsb-hd{padding:11px 18px 9px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08);}
.wsb-title{font-weight:800;font-size:16px;letter-spacing:2px;text-transform:uppercase;line-height:1;}
.wsb-sub{margin-top:4px;font-family:var(--label-font);font-weight:700;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);line-height:1;}
.wsb-rows{display:flex;flex-direction:column;}
.wsb-row{display:flex;align-items:center;gap:12px;height:31px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.05);}
.wsb-row:nth-child(even){background:rgba(255,255,255,.02);}
.wsb-rk{flex:none;width:16px;text-align:center;font-weight:800;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.wsb-lg{flex:none;width:18px;height:18px;object-fit:contain;}
.wsb-nm{flex:1;min-width:0;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wsb-vl{flex:none;font-weight:800;font-size:14px;color:#fff;font-variant-numeric:tabular-nums;}

/* ══ BOTTOM-LEFT: spectated player ═════════════════════════════════════════════ */
.pl{position:absolute;left:0;right:236px;bottom:0;transition:transform .5s var(--ease),opacity .4s;}
/* with the ticker on, the bar runs the FULL width — the ticker lane reaches the right edge */
.has-ticker .pl{right:0;}
.pl.off,.replay .pl{transform:translateY(30px);opacity:0;}
.cam{width:280px;height:158px;border:3px solid var(--spec);border-bottom:none;display:none;}
.noplayer .cam{display:none !important;}
.cam-on .cam{display:block;}
.plrow{display:flex;align-items:stretch;height:52px;}   /* 52px = ticker.html's own bar height */
.noplayer .plname,.noplayer .plstats{display:none;}   /* ticker-only bar */
/* KICKOFF HOLD (ported from rl-hud): from the replay's end the live furniture stays OFF until the
   ball is actually touched, so it never pops back over the kickoff countdown. The ticker lane keeps
   running — only the player's own name/stats and the dial wait. */
.kickhold .plname,.kickhold .plstats{display:none;}
/* name hugs its text (no fixed 280px block leaving dead space beside a short name) */
.plname{display:flex;align-items:center;justify-content:center;padding:0 26px;min-width:150px;
  background:var(--spec);   /* FLAT team colour — no gradient across the name plate */
  font-weight:800;font-size:22px;text-transform:uppercase;white-space:nowrap;overflow:hidden;}
/* flat black panel with a thin team-colour rule along the bottom — no colour wash across the bar */
.plstats{display:flex;align-items:center;gap:26px;padding:0 24px;
  box-shadow:inset 0 -2px 0 var(--spec),inset 0 1px 0 rgba(255,255,255,.05);}
.plname{box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);}
.plstats div{display:flex;align-items:center;gap:9px;white-space:nowrap;}
/* white Rocket League glyph in front of each stat (icon + number + word, RLCS-style) — sized to
   read clearly on the spectated player's statcard, not a tiny bullet next to the number */
.plstats .sic{flex:none;width:22px;height:22px;background-color:#fff;
  mask-mode:alpha;-webkit-mask-mode:alpha;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;}
.plstats .sic.goals{-webkit-mask-image:url(/assets/rl/solid/ball.png);mask-image:url(/assets/rl/solid/ball.png);}
.plstats .sic.shots{-webkit-mask-image:url(/assets/rl/solid/shot.png);mask-image:url(/assets/rl/solid/shot.png);}
.plstats .sic.assists{-webkit-mask-image:url(/assets/rl/solid/assist.png);mask-image:url(/assets/rl/solid/assist.png);}
.plstats .sic.saves{-webkit-mask-image:url(/assets/rl/solid/save.png);mask-image:url(/assets/rl/solid/save.png);}
.plstats .sic.demos{-webkit-mask-image:url(/assets/rl/solid/demolition.png);mask-image:url(/assets/rl/solid/demolition.png);}
.plstats b{font-size:19px;line-height:1;}
/* spelled-out stat labels (GOALS / SHOTS / ASSISTS / SAVES / DEMOS) */
.plstats span{font-family:var(--label-font);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.plstats b.tick{animation:statTick .5s var(--ease);}
@keyframes statTick{35%{transform:scale(1.3);}}
/* title-sponsor lockup — a CHILD of the boost dial, so it is physically attached to it: it rolls out
   from BEHIND the disc (the disc paints over its right end) and is centred on the dial's axis. Being
   a child means it follows the dial wherever it sits (raised for the ticker, hidden with it, etc.). */
/* Rolls out along the BOTTOM of the dial (not across its middle). The end runs far enough under the
   disc that the DISC'S EDGE is what ends the pill — otherwise its own end stops short in the open
   next to the circle and reads as a clipped box. The disc reaches furthest left along the pill's TOP
   row (a circle is widest at its centre), so the right padding is sized to that row, and the end is
   fully rounded so no corner can poke out past the arc lower down. */
.pl-spon{position:absolute;right:88px;bottom:2px;height:54px;z-index:0;display:flex;align-items:center;gap:16px;
  padding:0 106px 0 26px;white-space:nowrap;overflow:hidden;border-radius:27px;
  background:linear-gradient(180deg,rgba(24,24,24,.98),rgba(0,0,0,.99));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05),0 12px 30px rgba(0,0,0,.58);
  transform:translateX(150px);opacity:0;pointer-events:none;
  transition:transform .6s var(--ease),opacity .35s;}
.pl-spon.out{transform:translateX(0);opacity:1;}
/* brand accent bar down the left inside the pill */
.pl-spon::before{content:'';position:absolute;left:16px;top:13px;bottom:13px;width:3px;border-radius:2px;z-index:2;
  background:var(--accent);box-shadow:0 0 10px var(--accent);}
/* one-time sheen that sweeps across as it rolls out */
.pl-spon::after{content:'';position:absolute;top:0;bottom:0;left:-90px;width:64px;transform:skewX(-18deg);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);opacity:0;}
.pl-spon.out::after{animation:plSheen 1s .5s ease-out;}
@keyframes plSheen{0%{left:-90px;opacity:1;}100%{left:calc(100% + 40px);opacity:0;}}
/* label chip, divided from the logo by a hairline */
.pl-spon span{position:relative;padding-left:14px;font-family:var(--label-font);font-weight:800;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.pl-spon span::after{content:'';position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:1px;height:22px;background:rgba(255,255,255,.16);}
.pl-spon img{max-height:30px;max-width:168px;object-fit:contain;}

/* ══ TICKER ════════════════════════════════════════════════════════════════════
   Not a new ticker and NOT a second bar: the EXISTING ticker scene (overlay/ticker.html) runs in a
   lane on the SAME bottom bar as the player stats, to the right of them. ticker.html draws its bar
   along the bottom of its own 1920x1080 page, so the frame is full-page, bottom-aligned inside the
   lane and clipped to it — the lane is exactly the ticker bar's height, so they line up. It keeps
   every source (manual / start.gg / NXGEN / competition), its sponsor slot, brand accent + speed. */
.tklane{flex:1 1 auto;min-width:0;position:relative;overflow:hidden;display:none;align-self:flex-end;height:55px;}   /* 55 = ticker.html's 52px bar + its 3px top rule */
.has-ticker .tklane{display:block;}
.tklane iframe{position:absolute;left:0;bottom:0;width:1920px;height:1080px;border:0;background:transparent;}

/* ══ BOTTOM-RIGHT: boost dial ══════════════════════════════════════════════════ */
.dial{position:absolute;right:32px;bottom:28px;width:180px;height:180px;
  transition:transform .5s var(--ease),opacity .4s,bottom .4s var(--ease);}
.has-ticker .dial{bottom:70px;}   /* lifted just clear of the full-width ticker bar */
.dial.off,.replay .dial,.kickhold .dial{transform:scale(.8);opacity:0;}
.dial svg{position:absolute;inset:0;z-index:2;}
.dial .disc{fill:#000000;}
.dial .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10;}
.dial .arc{fill:none;stroke:var(--spec);stroke-width:10;stroke-linecap:round;}
/* faint brand-logo watermark behind the boost number */
.dial-wm{z-index:3;position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:112px auto;
  opacity:.2;pointer-events:none;}
.dial .dv{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;font-size:58px;}
.dial .dl{z-index:4;position:absolute;left:0;right:0;bottom:36px;text-align:center;font-family:var(--label-font);font-weight:700;font-size:11px;letter-spacing:3px;color:var(--muted);}

/* ══ REPLAY LOWER THIRD ════════════════════════════════════════════════════════
   FLAT, not graded. Nothing here uses a gradient: solid black cells, one solid team-colour block
   carrying the crest, hairline rules between cells, and a solid colour bar under the slab. The only
   soft thing on screen is the small scrim behind it, so the bar stays legible over a bright arena
   without washing team colour across the picture. */
.rband{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;}
.rband .wash{position:absolute;left:0;right:0;bottom:0;height:220px;opacity:0;transition:opacity .35s ease;
  background:linear-gradient(0deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.34) 42%,rgba(0,0,0,0) 100%);}
.replay .rband .wash{opacity:1;}
.rband .edge{display:none;}
@keyframes blink{to{opacity:.15;}}

/* the slab: a row of flat cells, squared off, clipped in from the left */
.rslab{position:absolute;left:0;bottom:46px;display:flex;align-items:stretch;height:92px;max-width:1180px;
  background:linear-gradient(180deg,#161616 0%,#050505 62%,#000 100%);white-space:nowrap;
  box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
  clip-path:inset(0 100% 0 0);transition:clip-path .5s var(--ease);}
.replay .rslab{clip-path:inset(0 0 0 0);}
/* solid team-colour rule along the bottom — the one piece of colour that spans the bar */
.rslab::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rcol,var(--blue));}
/* cells rise in behind the wipe */
.replay .rslab > *{animation:rsCell .42s var(--ease) backwards;}
.replay .rslab > *:nth-child(2){animation-delay:.10s;}
.replay .rslab > *:nth-child(3){animation-delay:.18s;}
.replay .rslab > *:nth-child(4){animation-delay:.26s;}
@keyframes rsCell{from{opacity:0;transform:translateY(12px);}}

/* crest sits on a SOLID team-colour block — the badge of the bar */
.rs-crest{flex:none;width:104px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#000;box-shadow:inset -1px 0 0 rgba(255,255,255,.12);}
/* the crest fills the block (square crests go edge to edge; a wide mark still fits uncropped) */
.rs-crest img{width:100%;height:100%;object-fit:contain;padding:7px;}
/* who scored */
.rs-who{display:flex;flex-direction:column;justify-content:center;gap:9px;padding:0 34px;min-width:0;}
.rs-tag{display:flex;align-items:center;gap:11px;font-family:var(--label-font);font-weight:800;font-size:12px;
  letter-spacing:4px;text-transform:uppercase;color:var(--rcol,var(--blue));line-height:1;}
.rs-tag i{width:9px;height:9px;background:var(--rcol,var(--blue));animation:blink 1.2s ease-in-out infinite;}
.rs-tag em{font-style:normal;color:rgba(255,255,255,.45);}
.rs-name{font-weight:800;font-size:36px;line-height:1;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;}
.rs-sub{font-family:var(--label-font);font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);line-height:1;}
.rs-sub:empty{display:none;}
/* how hard — its own cell behind a hairline */
.rs-speed{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 30px;
  box-shadow:inset 1px 0 0 rgba(255,255,255,.14);}
.rs-speed b{font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;}
.rs-speed span{font-family:var(--label-font);font-weight:700;font-size:11px;letter-spacing:3px;color:var(--muted);}
.rs-speed.hidden{display:none;}
/* sponsor — flat panel, one shade off black so the placement still reads as its own block */
.rs-spon{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:0 38px;background:linear-gradient(180deg,#1b1b1b,#0a0a0a);box-shadow:inset 1px 0 0 rgba(255,255,255,.14);}
.rs-spon span{font-family:var(--label-font);font-weight:800;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.rs-spon img{max-height:36px;max-width:190px;object-fit:contain;}
.rs-spon.hidden{display:none;}

/* ══ REPLAY TRANSITIONS ════════════════════════════════════════════════════════
   Not here any more: the transition engine + all three looks (slam / cinema / sweep) live in the
   shared overlay/replay-fx.js, so every RL overlay runs the same timing and can use any style. This
   layout defaults to 'sweep'; the producer's Match ▸ Teams pick overrides it, and ?fx=<style> pins
   one per browser source. The engine mounts its own element. */

/* ══ POST-GAME SCOREBOARD ══════════════════════════════════════════════════════
   NOT a bespoke board: this frames the EXISTING post-game scoreboard (rl-hud.html?only=scoreboard),
   so the producer's stats-screen design (Default / Glass / Block / Radar / Compare), its sponsor
   slots and background all apply here exactly as they do on the other RL layouts. The Worlds HUD
   only adds its own sweep in and out of it. */
.board{position:absolute;inset:0;display:none;z-index:50;}
.board.show{display:block;}
.board iframe{width:1920px;height:1080px;border:0;display:block;background:transparent;}
</style>
</head>
<body>

<div class="hud">
  <!-- TOP SCOREBUG -->
  <div id="bug" class="bug">
    <div id="otbar" class="otbar"><img id="ot-logo" alt=""><span id="ot-lbl" class="ot-lbl">OVERTIME</span></div>
    <div id="hdr" class="hdr"><div id="hd-text" class="hd-text"><span id="hd-event" class="hd-event"></span><span id="hd-round" class="hd-round"></span></div></div>
    <div class="row">
      <div class="pwrap blue"><div class="plate blue"><span id="pn-blue" class="pname">BLUE</span></div></div>
      <div class="lcol blue"><div class="ltile"><img id="logo-blue" src="/assets/rl.png" alt=""></div><div id="tag-blue" class="ltag">BLUE</div></div>
      <div class="core">
        <div class="scores">
          <div id="score-blue" class="sc blue num">0</div>
          <div id="clock" class="clock num"><span id="timer">5:00</span></div>
          <div id="score-orange" class="sc orange num">0</div>
        </div>
        <div class="pips"><div id="pips-blue" class="pipset blue"></div><i id="pip-mid" class="pip-mid"></i><div id="pips-orange" class="pipset orange"></div></div>
      </div>
      <div class="lcol orange"><div class="ltile"><img id="logo-orange" src="/assets/rl.png" alt=""></div><div id="tag-orange" class="ltag">ORNG</div></div>
      <div class="pwrap orange"><div class="plate orange"><span id="pn-orange" class="pname">ORANGE</span></div></div>
    </div>
    <div id="tsp" class="tsp hidden"><span id="tsp-game" class="tsp-game"></span><span id="tsp-lbl" class="tsp-lbl">OVERTIME</span><img id="tsp-logo" alt=""></div>
  </div>

  <div id="corner-blue" class="corner blue"></div>
  <div id="corner-orange" class="corner orange"></div>
  <div id="ptab" class="ptab out">
    <div id="ptab-cube" class="ptab-cube">
      <div class="ptab-face pf-front">
        <div class="ptab-hd"><span class="ptab-lbl">Partners</span></div>
        <div class="ptab-slot"><div id="ptab-logo-a" class="ptab-logo"></div></div>
      </div>
      <div class="ptab-face pf-top">
        <div class="ptab-hd"><span class="ptab-lbl">Partners</span></div>
        <div class="ptab-slot"><div id="ptab-logo-b" class="ptab-logo"></div></div>
      </div>
    </div>
  </div>

  <!-- optional stats sidebar (series stats / league standings), RLCS-style pop-in on the right -->
  <div id="wsb" class="wsb off">
    <div class="wsb-hd"><div id="wsb-title" class="wsb-title">TOTAL GOALS</div><div id="wsb-sub" class="wsb-sub">ALL-TIME WORLDS</div></div>
    <div id="wsb-rows" class="wsb-rows"></div>
  </div>

  <div id="pl" class="pl off">
    <div class="cam"></div>
    <div class="plrow">
      <div id="pl-name" class="plname"></div>
      <div class="plstats panel">
        <div><i class="sic goals"></i><b id="st-goals" class="num">0</b><span>Goals</span></div>
        <div><i class="sic shots"></i><b id="st-shots" class="num">0</b><span>Shots</span></div>
        <div><i class="sic assists"></i><b id="st-assists" class="num">0</b><span>Assists</span></div>
        <div><i class="sic saves"></i><b id="st-saves" class="num">0</b><span>Saves</span></div>
        <div><i class="sic demos"></i><b id="st-demos" class="num">0</b><span>Demos</span></div>
      </div>
      <div id="tklane" class="tklane"><iframe id="tkf" title="Ticker" scrolling="no"></iframe></div>
    </div>
  </div>

  <!-- Boost dial. The title-sponsor lockup is a CHILD of it so the two are physically joined: it
       rolls out leftwards from behind the disc and always tracks the dial's position. -->
  <div id="dial" class="dial off">
    <div id="pl-spon" class="pl-spon panel"><span id="pl-spon-lbl">Presented by</span><img id="pl-spon-logo" alt=""></div>
    <svg viewBox="0 0 180 180">
      <circle class="disc" cx="90" cy="90" r="86"/>
      <circle class="track" cx="90" cy="90" r="70" pathLength="100" stroke-dasharray="75 100" transform="rotate(135 90 90)"/>
      <circle id="dial-arc" class="arc" cx="90" cy="90" r="70" pathLength="100" stroke-dasharray="0 100" transform="rotate(135 90 90)"/>
    </svg>
    <div id="dial-wm" class="dial-wm"></div>
    <div id="dial-val" class="dv num">0</div>
    <div class="dl">BOOST</div>
  </div>

  <div class="rband">
    <div class="wash"></div>
    <div class="rslab">
      <div class="rs-crest"><img id="r-logo" src="/assets/rl.png" alt=""></div>
      <div class="rs-who">
        <span class="rs-tag"><i></i><span class="rlbl">REPLAY</span><em>·</em><span id="r-kind">GOAL</span></span>
        <span id="r-team" class="rs-name">TEAM</span>
        <span id="r-assist" class="rs-sub"></span>
      </div>
      <div id="r-speed-cell" class="rs-speed"><b id="r-speed" class="num">0</b><span id="r-unit">MPH</span></div>
      <div id="r-spon" class="rs-spon hidden"><span id="r-spon-lbl">POWERED BY</span><img id="r-spon-logo" alt=""></div>
    </div>
    <div class="edge"></div>
  </div>
  </div>
</div>

<!-- POST-GAME SCOREBOARD -->
<div id="board" class="board"><iframe id="bd-frame" title="Post-game scoreboard" scrolling="no"></iframe></div>

<script src="/replay-fx.js"></script>
<script>
'use strict';
const el = id => document.getElementById(id);
const teamOf = p => (Number(p && p.team) === 1 ? 1 : 0);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const root = document.documentElement;
let BLUE = '#2f7bff', ORANGE = '#e9a24a', ACCENT = '#2f7bff';
let currentState = {};
function setText(id, v){ const e = el(id); if (e && e.textContent !== String(v ?? '')) e.textContent = (v ?? ''); }
function setImg(id, src){ const e = el(id); if (!e) return; const s = src || '/assets/rl.png'; if (e.getAttribute('src') !== s) e.src = s; }
function fit(id, max, min){
  const e = el(id); if (!e) return; e.style.fontSize = max + 'px';
  let s = max, g = 0; while (e.scrollWidth > e.clientWidth + 1 && s > min && g++ < 60) { s -= 1; e.style.fontSize = s + 'px'; }
}
if (/[?&]cam=1\b/.test(location.search)) document.body.classList.add('cam-on');

  cube.style.transition = 'none'; cube.style.transform = 'translateZ(-31px) rotateX(0deg)';
  fillLogo('ptab-logo-a', list[0]);
  fillLogo('ptab-logo-b', list[1 % list.length]);
  requestAnimationFrame(() => tab.classList.remove('out'));
  // hold each sponsor a good while — the turn is the accent, not the main event
  if (list.length > 1) _pTimer = setInterval(rollPartner, 14000);
}
const P_EASE = 'cubic-bezier(.34,.02,.2,1)';
// Advance the CUBE a real quarter-turn: the front box rotates over its top edge and the top face
// (already carrying the next sponsor) turns down into place, with visible depth — not a flat flip.
// When it lands, the front face is re-synced and the top face is loaded with the following sponsor.
function rollPartner(){
  const cube = el('ptab-cube'); if (!cube || _pRolling || _pList.length < 2) return;
  _pRolling = true;
  cube.style.transition = 'transform .8s ' + P_EASE;
  cube.style.transform = 'translateZ(-31px) rotateX(-90deg)';   // top face tumbles down to front
  setTimeout(() => {
    _pIdx = (_pIdx + 1) % _pList.length;
    // the top face is now at front; copy it onto the front face and snap the cube back to rest so
    // the next turn can reuse the same two faces (content is identical, so the snap is invisible)
    fillLogo('ptab-logo-a', _pList[_pIdx]);
    cube.style.transition = 'none'; cube.style.transform = 'translateZ(-31px) rotateX(0deg)'; void cube.offsetWidth;
    fillLogo('ptab-logo-b', _pList[(_pIdx + 1) % _pList.length]);   // prime the top face for next time
    _pRolling = false;
  }, 800);
}
function fillLogo(id, s){
  const box = el(id); if (!box) return;
  box.innerHTML = '';
  if (!s) return;
  if (s.logo) { const i = document.createElement('img'); i.src = s.logo; i.alt = s.name || ''; box.appendChild(i); }
  else { const t = document.createElement('span'); t.textContent = s.name; box.appendChild(t); }
}

/* ── KICKOFF HOLD ─────────────────────────────────────────────────────────────────
   Entered when a replay ends and at the kickoff countdown. Two things must BOTH be true to release:
     1. play has started — the match clock has ticked down at least once, and
     2. the camera is on a PLAYER — RL holds the ball/centre cam through the countdown and the first
        moment of play, and the cards/boost belong to a player, so they must not appear over it.
   Without (2) the furniture flashed up while we were still on the ball cam at kickoff. A long safety
   still exists so the HUD can never stay hidden if a player is never spectated. */
const KICK_SAFETY_MS = 15000;
let kickHold = false, kickHoldAt = 0, _prevGameTime = null, _kickSafety = null, _playLive = false;
function holdForKickoff(){
  if (kickHold) return;
  kickHold = true; kickHoldAt = Date.now(); _prevGameTime = null; _playLive = false;   // re-baseline both tests
  document.body.classList.add('kickhold');
  clearTimeout(_kickSafety); _kickSafety = setTimeout(releaseKickoffHold, KICK_SAFETY_MS);
}
function releaseKickoffHold(){
  clearTimeout(_kickSafety);
  if (!kickHold) return;
  kickHold = false; document.body.classList.remove('kickhold');
  // Never during a legitimate board reveal/hide sweep — that one shares ReplayFX's single cover
  // timer and depends on its own onMid firing (see showBoard/hideBoard); clearing here would cancel
  // it right along with any actually-stuck replay cover.
  if (!boardPending) ReplayFX.clear();   // rl-hud's hudShow safety: no cover may still be up once play has resumed
}
// every tick: has play actually started? (the clock ticking down = the ball was touched)
function kickoffHoldTick(game){
  const gt = (game && typeof game.time === 'number') ? game.time : null;
  if (kickHold && !_playLive) {
    if (gt != null && _prevGameTime != null && (game && game.isOT ? gt > _prevGameTime : gt < _prevGameTime)) _playLive = true;
  }
  _prevGameTime = gt;
}
// and the second half of the test: the camera has settled on a player
function kickoffHoldSpectate(sp){
  if (kickHold && _playLive && sp) releaseKickoffHold();
}

/* ── MODE: live (logos) / replay + kickoff (names) ────────────────────────────── */
let mode = 'live', _kickoffClock = null, _modeTimer = null;
function setMode(m){
  if (m === mode) return;
  const wasNames = mode !== 'live';
  mode = m; clearTimeout(_modeTimer);
  document.body.classList.toggle('names', m !== 'live');
  document.body.classList.toggle('replay', m === 'replay');
  sizeHeader();
  if (m === 'kickoff') { _kickoffClock = (currentState.game || {}).time; _modeTimer = setTimeout(() => setMode('live'), 12000); }
  if (m === 'replay') { _modeTimer = setTimeout(() => setMode('kickoff'), 20000); clearTimeout(_sponHide); el('pl-spon').classList.remove('out'); }
  if (m === 'live' && wasNames) ['logo-blue', 'logo-orange'].forEach(id => { const i = el(id); i.classList.remove('punch'); void i.offsetWidth; i.classList.add('punch'); });
}
function showGoalBand(goal){
  goal = goal || {};
  const side = Number(goal.team) === 1 ? 1 : 0, t = (currentState.teams || {})[side === 1 ? 'orange' : 'blue'] || {};
  root.style.setProperty('--rcol', side === 1 ? ORANGE : BLUE);
  setImg('r-logo', t.logo);
  // the slab leads with WHO scored; the team carries it when the feed has no scorer
  const scorer = String(goal.scorer || '').trim();
  setText('r-team', scorer || teamName(t, side));
  setText('r-kind', 'Goal');
  setText('r-assist', [scorer ? teamName(t, side) : '', goal.assisterName ? 'Assist · ' + goal.assisterName : '']
    .filter(Boolean).join('   ·   '));
  // a 0 kph goal is the feed not reporting one — drop the cell rather than printing a fake 0
  const sp = fmtSpeed(goal.speed), hasSpeed = (goal.speed || 0) > 0;
  setText('r-speed', sp.val); setText('r-unit', sp.lbl);
  el('r-speed-cell').classList.toggle('hidden', !hasSpeed);
}

/* ── replay transitions — the shared engine (overlay/replay-fx.js) ────────────
   This layout defaults to the panel 'sweep'; state.replay.style (Match ▸ Teams) overrides it and
   ?fx=slam|cinema|sweep pins one for a single browser source. All the timing — the hold on the
   cover until RL actually cuts to the replay, the outro on the "replay ending" cue, the safety
   nets — lives in the engine, shared with the other overlays. */
ReplayFX.init({ defaultStyle: 'sweep' });
const sweep = (o) => ReplayFX.cover(o);   // one-off covers (the post-game board in/out)

/* ── POST-GAME SCOREBOARD — the existing board, framed ────────────────────────
   Shows overlay/rl-hud.html?only=scoreboard, the same source the producer can already route to its
   own browser source, so every stats-screen design + sponsor slot is whatever they picked. It gets
   its own state from the bridge; we only sweep it in and out. */
let boardOn = false, boardPending = false, boardHiding = false, _boardSafety = null, _hideBoardDebounce = null;
function boardFrame(){
  const f = el('bd-frame');
  if (f && !f.getAttribute('src')) f.src = '/rl-hud.html?only=scoreboard';
  return f;
}
function showBoard(msgData, animate){
  if (currentState.rlScoreboardSeparate) return;   // producer routes the board to its own source
  // Guard re-entry: the game end sends BOTH view_change scoreboard (animated) AND a full_state with
  // view:scoreboard. Without this, the second call reset the in-flight cover and snapped the board in
  // over the still-animating wipe. boardPending blocks that until the transition completes.
  if (boardOn || boardPending) return;
  boardPending = true;
  ReplayFX.clear();                                // drop any frozen/in-flight replay cover cleanly
  ReplayFX.reset();                                // no replay transition may fire over the board
  clearTimeout(_boardSafety);
  const reveal = () => {
    if (!boardPending) return;                      // already revealed (onMid + the safety net below)
    boardFrame(); boardOn = true; boardPending = false;
    el('board').classList.add('show');
    document.body.classList.add('on-board'); setMode('live');
  };
  if (!animate) return reveal();
  const g = currentState.game || {}, sbd = currentState.scoreboard || {};
  const bs = sbd.blueScore ?? g.blueScore ?? 0, os = sbd.orangeScore ?? g.orangeScore ?? 0;
  const side = os > bs ? 1 : 0, t = (currentState.teams || {})[side ? 'orange' : 'blue'] || {};
  sweep({ side: side, logo: t.logo || (currentState.brand || {}).logo, text: '', dur: 1700, onMid: reveal });
  // SAFETY NET — this was the actual bug behind "no replay transitions are working": ReplayFX has
  // only ONE shared cover timer, so a goal replay (or the kickoff-hold's ReplayFX.clear()) landing
  // mid-animation here silently cancels this onMid before it fires. boardPending then never clears,
  // and worse, if the SAME thing happens in hideBoard() below, boardOn is left stuck true forever —
  // which makes dispatch()'s `if (!boardOn) ReplayFX.goal(...)` guards swallow every later goal for
  // the rest of the match. Never let reveal depend solely on that one external callback.
  _boardSafety = setTimeout(reveal, 2000);
}
function hideBoard(animate){
  boardPending = false;
  if (!boardOn) { document.body.classList.remove('on-board'); return; }
  // Guard re-entry — this was the actual bug behind "plays randomly during the scoreboard / between
  // games": unlike showBoard, this had NO in-flight guard. The live feed can (and does) re-send
  // view_change:hud more than once while the board is still legitimately up (e.g. it mirrors a raw
  // per-tick flag rather than only firing on change); boardOn stays true for the ~1.3s the sweep
  // takes to play, so every redundant message re-called sweep() and RESTARTED the stinger from
  // scratch. boardHiding blocks that until the current hide finishes.
  if (boardHiding) return;
  boardHiding = true;
  clearTimeout(_boardSafety);
  const out = () => {
    if (!boardOn) return;                           // already hidden
    boardOn = false; boardHiding = false; el('board').classList.remove('show'); document.body.classList.remove('on-board');
  };
  if (!animate) { boardHiding = false; return out(); }
  sweep({ color: ACCENT, logo: (currentState.brand || {}).logo, text: '', dur: 1300, onMid: out });
  _boardSafety = setTimeout(out, 1600);   // same safety net as showBoard, see above
}

/* ── dispatch ─────────────────────────────────────────────────────────────────── */
function dispatch(msg){
  if (!msg || !msg.type) return;
  const d = msg.data || {};
  switch (msg.type) {
    // Overlay code changed on disk — the server hashed it and told every overlay source. This
    // overlay is standalone (no scene-base.js), so it wasn't picking these up at all; a producer
    // had to manually clear the OBS browser source cache to see any edit. Reload only when the
    // changed file IS this page (or the server didn't say which files — an explicit "reload all").
    case 'reload_overlays': {
      const files = Array.isArray(msg.files)
        ? msg.files.map(f => String(f).replace(/\\/g, '/').toLowerCase().split('/').pop()).filter(Boolean)
        : null;
      const page = (location.pathname.split('/').pop() || '').toLowerCase();
      if (!files || !files.length || files.indexOf(page) !== -1) { try { location.reload(); } catch (e) {} }
      break;
    }
    case 'full_state':
      currentState = { ...currentState, ...d }; render(currentState);
      ReplayFX.setState(currentState);
      // same debounce as view_change 'hud' below — full_state's view is polled every tick, so a
      // momentary 'hud' blip here is just as capable of hiding the board on noise, silently this time.
      if (currentState.view === 'scoreboard') { clearTimeout(_hideBoardDebounce); if (!boardOn) showBoard(null, false); }
      else if (boardOn && currentState.view === 'hud' && !ReplayFX.busy()) { clearTimeout(_hideBoardDebounce); _hideBoardDebounce = setTimeout(() => hideBoard(false), 700); }
      // never fall back into replay mode while the board is up (that re-armed the sweeps)
      if (currentState.inReplay && mode !== 'replay' && !boardOn) { showGoalBand(currentState.currentGoal); setMode('replay'); }
      break;
    case 'state_update':
      currentState = { ...currentState, game: d.game, players: d.players, spectatedPlayer: d.spectatedPlayer };
      render(currentState);
      if (mode === 'kickoff' && _kickoffClock != null && d.game && d.game.time != null && d.game.time !== _kickoffClock) setMode('live');
      break;
    case 'goal_scored':
      showGoalBand(d.goal || { team: d.team });
      // reveal the team-name plates on the goal itself, RLCS-style; the engine owns the wipe
      document.body.classList.add('names'); sizeHeader();
      if (!boardOn) ReplayFX.goal(d.goal || { team: d.team });
      break;
    case 'replay_will_end': ReplayFX.replayWillEnd(); break;
    case 'view_change':
      if (d.view === 'goal') {
        showGoalBand(d.goal);
        if (!boardOn) ReplayFX.replayStart(d.goal || {});
        setMode('replay');
      } else if (d.view === 'hud') {
        if (mode === 'replay' && !boardOn) { ReplayFX.replayEnd(); setMode('kickoff'); holdForKickoff(); }
        else ReplayFX.reset();
        // Debounced, not immediate: the live feed can report 'hud' for a moment right after a match
        // ends — residual noise before the next kickoff, a game-reset race — even while the board is
        // legitimately still meant to be up. Firing hideBoard() on every one of those blips played a
        // full stinger sweep at random during the scoreboard hold. Only actually hide once 'hud' has
        // stuck for a beat; a follow-up 'scoreboard' message (below) cancels the pending hide.
        if (boardOn) { clearTimeout(_hideBoardDebounce); _hideBoardDebounce = setTimeout(() => hideBoard(true), 700); }
      } else if (d.view === 'scoreboard') {
        clearTimeout(_hideBoardDebounce);
        ReplayFX.replayEnd({ toScoreboard: true }); releaseKickoffHold();
        showBoard(d, true);
      }
      break;
    case 'clear_scoreboard': clearTimeout(_hideBoardDebounce); ReplayFX.reset(); hideBoard(true); break;
    case 'game_reset': clearTimeout(_hideBoardDebounce); ReplayFX.reset(); releaseKickoffHold(); hideBoard(true); _lastScore = { blue: null, orange: null }; break;
    case 'rl_kickoff':
      if (d.phase === 'countdown') { setMode('kickoff'); holdForKickoff(); }
      else if (d.phase === 'live') { ReplayFX.reset(); releaseKickoffHold(); setMode('live'); }
      break;
  }
}

/* ── WS bridge (:3001) — same token flow as rl-hud.html ───────────────────────── */
const HOST = (location.hostname && location.hostname !== 'localhost') ? location.hostname : '127.0.0.1';
const HTTP_BASE = 'http://' + HOST + ':3000', WS_URL = 'ws://' + HOST + ':3001';
let _wsToken = null;
async function connect(){
  if (!_wsToken) { try { _wsToken = (await (await fetch(HTTP_BASE + '/api/ws-token')).json()).token || ''; } catch (e) { _wsToken = ''; } }   // retried after a failed fetch
  const ws = new WebSocket(WS_URL + (_wsToken ? ('?token=' + encodeURIComponent(_wsToken)) : ''));
  ws.onopen = () => { try { ws.send(JSON.stringify({ type: 'register', role: 'overlay', page: location.pathname })); ws.send(JSON.stringify({ type: 'request_state' })); } catch (e) {} };
  ws.onmessage = ({ data }) => { let m; try { m = JSON.parse(data); } catch { return; }
    try { dispatch(m); } catch (e) { console.error('[rl-worlds] render error on ' + (m && m.type) + ':', e); } };
  ws.onclose = () => setTimeout(connect, 800);
  ws.onerror = () => { try { ws.close(); } catch {} };
}

/* ── dev preview ──────────────────────────────────────────────────────────────── */
const DEV = {
  teams: { blue: { name: 'Kinetic Vortex', tag: 'KV1', logo: '/assets/rl.png', color: '#2f7bff' }, orange: { name: 'Northwest Pioneers', tag: 'NWPO', logo: '/assets/rl.png', color: '#e9a24a' } },
  brand: { color: '#8b5cf6', sponsors: [{ name: 'Epic Games Store' }, { name: 'Partner Two' }],
    spots: { title: 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80"><rect x="4" y="14" width="40" height="52" fill="#fff"/><text x="58" y="56" font-family="Arial" font-weight="700" font-size="44" fill="#fff">sponsor</text></svg>') } },
  rlSponsorRoll: true,

    { name: 'Relay', team: 0, score: 300, goals: 0, shots: 2, assists: 2, saves: 3, demos: 2, boost: 88 },
    { name: 'Pioneer', team: 1, score: 590, goals: 2, shots: 6, assists: 0, saves: 2, demos: 1, boost: 25 },
    { name: 'Northstar', team: 1, score: 350, goals: 0, shots: 2, assists: 2, saves: 2, demos: 0, boost: 51 },
    { name: 'Westwind', team: 1, score: 220, goals: 0, shots: 1, assists: 0, saves: 4, demos: 1, boost: 12 },

    { rank: 1, name: 'Atomic', value: 111 }, { rank: 2, name: 'Kaydop', value: 109 }, { rank: 3, name: 'Turbopolsa', value: 108 },
    { rank: 4, name: 'GarrettG', value: 107 }, { rank: 5, name: 'Trk511', value: 100 }, { rank: 6, name: 'Exotiik', value: 98 },
    { rank: 7, name: 'JKnaps', value: 97 }, { rank: 8, name: 'Chicago', value: 92 }
  ] }
};
setTimeout(rollSponsorOut, 6500); setInterval(rollSponsorOut, SPON_EVERY_MS);
const devM = /[?&]dev\b/.test(location.search);
if (devM) {
  const fixed = (location.search.match(/[?&]dev=(\w+)/) || [])[1];
  currentState = DEV; render(DEV);
  showGoalBand({ team: 0, speed: 105 });
  const go = m => {
    if (m === 'board') { currentState.scoreboard = { players: DEV.players, blueScore: 3, orangeScore: 2, series: { blue: 3, orange: 2 } }; showBoard(null, !fixed); }   // frames the real board (needs the app running)
    else { hideBoard(false); setMode(m); clearTimeout(_modeTimer);
      if (m === 'replay' && !fixed) { ReplayFX.setState(currentState); ReplayFX.goal({ team: 0 }); ReplayFX.replayStart({ team: 0 }); } }
  };
  if (fixed) go(fixed);
  else { const seq = ['live', 'replay', 'kickoff', 'board']; let i = 0; setInterval(() => { i = (i + 1) % seq.length; go(seq[i]); }, 4500); }
  setInterval(() => { const p = DEV.players[0]; p.boost = (p.boost + 7) % 101; render(DEV); }, 400);
} else connect();
// Names are shrink-to-fit; re-measure once the web font has actually loaded (it's wider than the fallback).
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  _plateSig = ''; _hdSig = ''; if (currentState.teams) render(currentState);
});
