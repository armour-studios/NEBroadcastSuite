<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>RL Worlds HUD</title>
<link rel="stylesheet" href="/fonts.css">
<!--
  WORLDS Rocket League HUD (overlay/rl-worlds.html) — a separate RL layout ("Worlds HUD"). The Classic /
  React / Player HUDs are untouched; this file only reads the same :3001 bridge.

  LOGOS vs NAMES: live play shows the compact bug (logo tiles + scores + clock). During goal replays and
  the kickoff countdown, team-colour plates slide out from behind the logos carrying the TEAM name, and
  the header widens to "EVENT | ROUND". They slide back when the countdown ends (RoundStarted).

  COLOURS: sides use teams.*.color, which the server already resolves from the producer's colour mode
  (team / brand / game default). Chrome accents (header rule, partner tab, pips, transitions) use the
  active brand kit's colour. FONT: Settings "Overlay Font" > brand-kit font > Montserrat.

  TRANSITIONS: a panel sweep plays INTO each goal replay (team colour + replay-slot logo), OUT of it
  (brand colour + outro logo), and INTO / OUT OF the post-game scoreboard. Honours the producer's
  "replay transitions" toggle (rlReplayTransitions) for the replay sweeps.

  Mode sources: goal_scored / view_change goal → replay; view_change hud → kickoff; rl_kickoff
  {countdown|live}; view_change scoreboard → board; clear_scoreboard / game_reset → back to the HUD.

  Preview: ?dev (cycles live → replay → kickoff → board) or ?dev=live|replay|kickoff|board to hold one.
  ?cam=1 draws a player-cam frame above the bottom-left bar (the camera itself is an OBS source).
-->
<style>
:root{
  --blue:#2f7bff; --orange:#e9a24a;
  --accent:#2f7bff;                          /* brand kit colour */
  --ink:#0c0f16; --ink-2:#161b26; --line:rgba(255,255,255,.08);
  --paper:#f4f6fa; --txt:#ffffff; --muted:rgba(222,228,240,.6);
  --spec:var(--blue);
  --font:var(--main-font,'Montserrat'),'Montserrat','Segoe UI',sans-serif;
  --plate-w:320px;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
body{position:relative;font-family:var(--font);color:var(--txt);-webkit-font-smoothing:antialiased;}
img{display:block;}
.hidden{display:none !important;}
.num{font-variant-numeric:tabular-nums;font-weight:800;}
.panel{background:linear-gradient(180deg,var(--ink-2),var(--ink));}

.hud{transition:opacity .25s;}
body.on-board .hud{opacity:0;}

/* ══ TOP SCOREBUG ══════════════════════════════════════════════════════════════ */
.bug{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:inline-flex;flex-direction:column;
  box-shadow:0 12px 28px rgba(0,0,0,.45);animation:bugDrop .6s var(--ease) backwards;}
@keyframes bugDrop{from{opacity:0;transform:translateX(-50%) translateY(-24px);}}
/* width:0 + min-width:100% = always the row's width; never widens the bug itself */
.hdr{width:0;min-width:100%;height:28px;display:flex;align-items:center;justify-content:center;padding:0 16px;
  background:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);overflow:hidden;}
.hd-text{display:flex;align-items:center;min-width:0;white-space:nowrap;font-weight:700;font-size:13px;
  letter-spacing:.2em;text-transform:uppercase;line-height:1;}
.hd-event{display:inline-block;overflow:hidden;max-width:0;opacity:0;transition:max-width .6s var(--ease),opacity .35s;}
.names .hd-event{opacity:1;}
.sep{color:var(--muted);margin:0 .7em;}
.hd-round{flex:none;}

.row{display:flex;align-items:flex-start;}
.pwrap{width:0;height:80px;overflow:hidden;display:flex;transition:width .55s var(--ease);}
.pwrap.blue{justify-content:flex-end;}
.names .pwrap{width:var(--plate-w);}
.plate{flex:none;width:var(--plate-w);height:80px;position:relative;display:flex;align-items:center;justify-content:center;
  padding:0 24px;overflow:hidden;transition:transform .55s var(--ease);}
.plate.blue{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22)),var(--blue);transform:translateX(100%);}
.plate.orange{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22)),var(--orange);transform:translateX(-100%);}
.names .plate{transform:none;}
.plate::after{content:'';position:absolute;top:0;bottom:0;width:80px;left:-110px;transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);}
.names .plate::after{animation:sheen .9s .35s ease-out;}
@keyframes sheen{to{left:calc(100% + 40px);}}
.pname{font-weight:800;font-size:38px;line-height:1;text-transform:uppercase;white-space:nowrap;max-width:100%;overflow:hidden;
  letter-spacing:.01em;}

.lcol{flex:none;width:88px;display:flex;flex-direction:column;position:relative;z-index:2;}
.ltile{height:80px;display:flex;align-items:center;justify-content:center;background:var(--ink-2);}
.ltile img{width:60px;height:60px;object-fit:contain;}
.ltile img.punch{animation:punch .55s var(--ease);}
@keyframes punch{0%{transform:scale(.5);opacity:0;}65%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
.ltag{height:22px;display:flex;align-items:center;justify-content:center;background:var(--ink);
  font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;color:var(--muted);}

.core{flex:none;display:flex;flex-direction:column;}
.scores{display:flex;height:80px;}
.sc{width:74px;display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1;}
.sc.blue{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22)),var(--blue);}
.sc.orange{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22)),var(--orange);}
.sc.bump{animation:bump .7s var(--ease);}
@keyframes bump{35%{transform:scale(1.22);}}
.clock{width:160px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);
  font-size:44px;transition:background .3s,color .3s;}
.clock.ot{background:#d8212c;color:#fff;}
/* the pips span the FULL width of the scoreboard core — each side's set fills its half, so the
   segments stretch edge-to-edge with the centre diamond between them */
.pips{height:22px;display:flex;align-items:center;background:var(--ink);padding:0 10px;gap:6px;}
.pipset{display:flex;gap:5px;flex:1 1 0;min-width:0;}
.pipset.orange{flex-direction:row-reverse;}
.pip{flex:1 1 0;min-width:0;height:5px;background:rgba(255,255,255,.18);}
.pipset.blue .pip.on{background:var(--blue);} .pipset.orange .pip.on{background:var(--orange);}
.pip-mid{width:9px;height:9px;background:var(--accent);margin:0 9px;border-radius:1px;
  box-shadow:0 0 0 2px #fff,0 0 8px rgba(255,255,255,.5);}

/* ══ TOP-CORNER BOOST CARDS ════════════════════════════════════════════════════ */
.corner{position:absolute;top:20px;display:flex;flex-direction:column;gap:4px;width:280px;}
.corner.blue{left:0;} .corner.orange{right:0;}
.bcard{position:relative;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 3px;
  animation:slideL .5s var(--ease) backwards;}
.corner.orange .bcard{flex-direction:row-reverse;animation-name:slideR;}
@keyframes slideL{from{transform:translateX(-100%);}} @keyframes slideR{from{transform:translateX(100%);}}
.bcard .bn{font-weight:700;font-size:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;}
.bcard .bv{font-size:18px;}
.bcard .bbar{position:absolute;left:0;bottom:0;height:3px;width:0;transition:width .2s linear;}
.corner.orange .bbar{left:auto;right:0;}
.corner.blue .bbar{background:var(--blue);} .corner.orange .bbar{background:var(--orange);}
.bcard.spec::before{content:'';position:absolute;top:0;bottom:0;width:3px;background:var(--paper);}
.corner.blue .bcard.spec::before{right:0;} .corner.orange .bcard.spec::before{left:0;}
.bcard.demo{opacity:.4;}
/* event pop icon — flashes on the player's card the moment they get a goal/assist/save/shot/demo */
.bfx{position:absolute;top:50%;transform:translateY(-50%) scale(1);width:24px;height:24px;opacity:0;pointer-events:none;z-index:3;}
.corner.blue .bfx{right:14px;} .corner.orange .bfx{left:14px;}
.bfx svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 6px currentColor);}
.bfx.goals{color:var(--accent);} .bfx.assists{color:#4c9bff;} .bfx.saves{color:#3ad07a;} .bfx.shots{color:#ffd15a;} .bfx.demos{color:#ff5a3c;}
.bfx.show{animation:bfxPop 1.6s var(--ease);}
@keyframes bfxPop{0%{opacity:0;transform:translateY(-50%) scale(.35) rotate(-12deg);}
  16%{opacity:1;transform:translateY(-50%) scale(1.2) rotate(0);}28%{transform:translateY(-50%) scale(1);}
  72%{opacity:1;}100%{opacity:0;transform:translateY(-50%) scale(1);}}

/* ══ PARTNER TAB ═══════════════════════════════════════════════════════════════ */
.ptab{position:absolute;left:0;height:52px;min-width:220px;max-width:380px;display:flex;align-items:center;justify-content:center;
  padding:0 28px 0 22px;box-shadow:inset -4px 0 0 var(--accent);transition:transform .5s var(--ease),opacity .5s;}
.ptab.out{transform:translateX(-110%);opacity:0;}
.ptab span{font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
.ptab img{max-height:32px;max-width:300px;object-fit:contain;}

/* ══ BOTTOM-LEFT: spectated player ═════════════════════════════════════════════ */
.pl{position:absolute;left:0;bottom:0;transition:transform .5s var(--ease),opacity .4s;}
.pl.off,.replay .pl{transform:translateY(30px);opacity:0;}
.cam{width:280px;height:158px;border:3px solid var(--spec);border-bottom:none;display:none;}
.cam-on .cam{display:block;}
.plrow{display:flex;align-items:stretch;height:46px;}
/* name hugs its text (no fixed 280px block leaving dead space beside a short name) */
.plname{display:flex;align-items:center;justify-content:center;padding:0 26px;min-width:150px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.22)),var(--spec);
  font-weight:800;font-size:22px;text-transform:uppercase;white-space:nowrap;overflow:hidden;}
.plstats{display:flex;align-items:center;gap:26px;padding:0 24px;}
.plstats div{display:flex;align-items:baseline;gap:6px;white-space:nowrap;}
.plstats b{font-size:18px;}
.plstats span{font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}

/* ══ BOTTOM-RIGHT: boost dial ══════════════════════════════════════════════════ */
.dial{position:absolute;right:32px;bottom:28px;width:180px;height:180px;transition:transform .5s var(--ease),opacity .4s;}
.dial.off,.replay .dial{transform:scale(.8);opacity:0;}
.dial svg{position:absolute;inset:0;}
.dial .disc{fill:rgba(12,15,22,.9);}
.dial .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10;}
.dial .arc{fill:none;stroke:var(--spec);stroke-width:10;transition:stroke-dasharray .15s linear;}
.dial .dv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:58px;}
.dial .dl{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-weight:700;font-size:11px;letter-spacing:.24em;color:var(--muted);}

/* ══ REPLAY BAND ═══════════════════════════════════════════════════════════════ */
.rband{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;opacity:0;transform:translateY(100%);
  transition:transform .55s var(--ease),opacity .3s;}
.replay .rband{opacity:1;transform:none;}
/* cinematic wash: team-colour glow up from the floor, plus a darkening base for legibility */
.rband .wash{position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(6,8,13,.92) 0%,rgba(6,8,13,.4) 42%,transparent 100%),
             linear-gradient(0deg,var(--rcol,var(--blue)),transparent 62%);}
.rband .wash::after{content:'';position:absolute;inset:0;
  background:radial-gradient(120% 150% at 50% 100%,rgba(255,255,255,.06),transparent 55%);}
.rband .edge{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rcol,var(--blue));
  box-shadow:0 0 18px var(--rcol,var(--blue));}
/* REPLAY tags — pill with a pulsing live dot */
.rtag{position:absolute;bottom:34px;display:flex;align-items:center;gap:10px;height:42px;padding:0 22px;border-radius:8px;
  font-weight:800;font-size:18px;letter-spacing:.28em;background:linear-gradient(180deg,var(--ink-2),var(--ink));
  box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);}
.rtag.l{left:34px;} .rtag.r{right:34px;}
.rtag i{width:9px;height:9px;border-radius:50%;background:#ff2d3a;box-shadow:0 0 9px #ff2d3a;animation:blink 1.1s steps(2,start) infinite;}
@keyframes blink{to{visibility:hidden;}}
/* centre chip — rounded card, team-colour cap, scorer + assist + goal speed */
.rchip{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;align-items:center;gap:26px;
  height:56px;padding:0 30px;border-radius:10px;white-space:nowrap;
  background:linear-gradient(180deg,var(--ink-2),var(--ink));
  box-shadow:0 12px 30px rgba(0,0,0,.55),inset 0 3px 0 var(--rcol,var(--blue)),inset 0 1px 0 rgba(255,255,255,.06);}
.rchip .rs{display:flex;align-items:center;gap:12px;font-weight:800;font-size:24px;text-transform:uppercase;}
.rchip .rs img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}
.rchip .ras{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding-left:26px;position:relative;}
.rchip .ras::before{content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:1px;height:22px;background:rgba(255,255,255,.14);}
.rchip .ras:empty{display:none;}
.rchip .rsp{display:flex;align-items:baseline;gap:5px;font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--muted);
  padding-left:26px;position:relative;}
.rchip .rsp::before{content:'';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:1px;height:22px;background:rgba(255,255,255,.14);}
.rchip .rsp b{font-size:26px;color:#fff;letter-spacing:0;}

/* ══ PANEL SWEEP (replay in/out + scoreboard in/out) ═══════════════════════════ */
.sweep{position:absolute;inset:0;z-index:90;pointer-events:none;overflow:hidden;display:none;}
.sweep.play{display:block;}
.sweep i{position:absolute;top:-10%;bottom:-10%;left:-20%;right:-20%;transform:translateX(130%) skewX(-14deg);}
.sweep .s1{background:radial-gradient(70% 90% at 50% 50%,rgba(255,255,255,.12),rgba(0,0,0,.35)),var(--sw-col,var(--accent));}
.sweep .s2{background:var(--ink);}
.sweep .s3{background:var(--sw-col,var(--accent));opacity:.55;}
.sweep.play .s3{animation:sw var(--sw-dur,1.5s) cubic-bezier(.65,0,.35,1) both;}
.sweep.play .s2{animation:sw var(--sw-dur,1.5s) cubic-bezier(.65,0,.35,1) 60ms both;}
.sweep.play .s1{animation:sw var(--sw-dur,1.5s) cubic-bezier(.65,0,.35,1) 120ms both;}
@keyframes sw{0%{transform:translateX(130%) skewX(-14deg);}36%,64%{transform:translateX(0) skewX(-14deg);}100%{transform:translateX(-130%) skewX(-14deg);}}
.sw-skin{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;}
.sweep.play .sw-skin{animation:swC var(--sw-dur,1.5s) linear both;}
.sw-lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;}
.sweep.play .sw-lock{animation:swC var(--sw-dur,1.5s) linear both;}
@keyframes swC{0%,30%{opacity:0;}40%,60%{opacity:1;}70%,100%{opacity:0;}}
.sw-lock img{max-height:150px;max-width:620px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4));}
.sw-lock span{font-weight:800;font-size:64px;letter-spacing:.34em;text-transform:uppercase;padding-left:.34em;}
.sw-lock span:empty{display:none;}
.sweep.play .sw-lock img,.sweep.play .sw-lock span{animation:swPush var(--sw-dur,1.5s) var(--ease) both;}
@keyframes swPush{0%,32%{transform:scale(.92);}60%{transform:scale(1);}100%{transform:scale(1.04);}}

/* ══ POST-GAME SCOREBOARD ══════════════════════════════════════════════════════ */
.board{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:50;}
.board.show{display:flex;}
.bd-bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 20%,rgba(22,27,38,.94),rgba(8,10,15,.97));}
.bd-img{position:absolute;inset:0;background-size:cover;background-position:center;}
.bd-img::after{content:'';position:absolute;inset:0;background:rgba(8,10,15,.6);}
.bd{position:relative;width:1440px;display:flex;flex-direction:column;align-items:stretch;gap:26px;}
.bd > *{animation:bdIn .6s var(--ease) backwards;}
.bd > :nth-child(2){animation-delay:.08s;} .bd > :nth-child(3){animation-delay:.16s;}
.bd > :nth-child(4){animation-delay:.24s;} .bd > :nth-child(5){animation-delay:.32s;}
@keyframes bdIn{from{opacity:0;transform:translateY(18px);}}
.bd-top{display:flex;align-items:center;justify-content:center;gap:22px;height:56px;}
.bd-top img{max-height:56px;max-width:220px;object-fit:contain;}
.bd-title{display:flex;flex-direction:column;align-items:center;gap:6px;}
.bd-ev{font-weight:800;font-size:20px;letter-spacing:.22em;text-transform:uppercase;}
.bd-rd{font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);}
.bd-hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;height:150px;box-shadow:inset 0 -3px 0 var(--accent);}
.bd-team{display:flex;align-items:center;gap:26px;padding:0 34px;position:relative;overflow:hidden;background:var(--ink-2);}
.bd-team.b{flex-direction:row-reverse;}
.bd-team.win.a{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.25)),var(--blue);}
.bd-team.win.b{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.25)),var(--orange);}
.bd-team.lose{opacity:.72;}
.bd-team img{width:104px;height:104px;object-fit:contain;flex:none;}
.bd-tn{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
.bd-team.b .bd-tn{align-items:flex-end;}
.bd-name{font-weight:800;font-size:44px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;max-width:100%;}
.bd-chip{font-weight:800;font-size:12px;letter-spacing:.24em;padding:5px 10px;background:var(--paper);color:var(--ink);width:max-content;}
.bd-team:not(.win) .bd-chip{display:none;}
.bd-mid{display:flex;align-items:center;background:var(--ink);}
.bd-num{width:130px;text-align:center;font-size:92px;line-height:1;}
.bd-fin{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px;}
.bd-fin b{font-weight:800;font-size:18px;letter-spacing:.3em;padding-left:.3em;}
.bd-fin span{font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--muted);white-space:nowrap;}
.bd-stats{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.bd-stats.off{display:none;}
.tbl{background:rgba(12,15,22,.8);}
.tr{display:grid;grid-template-columns:1fr repeat(6,70px);align-items:center;height:48px;padding:0 20px;}
.tr+.tr{border-top:1px solid var(--line);}
.th{height:36px;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.tbl.a .th{box-shadow:inset 0 3px 0 var(--blue);} .tbl.b .th{box-shadow:inset 0 3px 0 var(--orange);}
.th div,.tr .c{text-align:center;}
.tr .n{font-weight:700;font-size:18px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px;}
.tr .c{font-size:19px;}
.tr .c.s{color:#fff;} .tr .c:not(.s){color:rgba(255,255,255,.82);}
.tr.mvp{background:rgba(255,255,255,.05);}
.mvp-tag{font-weight:800;font-size:10px;letter-spacing:.18em;padding:3px 7px;background:var(--accent);color:#fff;flex:none;}
.bd-rail{display:flex;align-items:center;justify-content:center;gap:40px;height:48px;}
.bd-rail span{font-weight:700;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);}
.bd-rail img{max-height:40px;max-width:160px;object-fit:contain;}
.bd-rail:empty{display:none;}
</style>
</head>
<body>

<div class="hud">
  <!-- TOP SCOREBUG -->
  <div id="bug" class="bug">
    <div id="hdr" class="hdr"><div id="hd-text" class="hd-text"><span id="hd-event" class="hd-event"></span><span id="hd-round" class="hd-round"></span></div></div>
    <div class="row">
      <div class="pwrap blue"><div class="plate blue"><span id="pn-blue" class="pname">BLUE</span></div></div>
      <div class="lcol blue"><div class="ltile"><img id="logo-blue" src="/assets/rl.png" alt=""></div><div id="tag-blue" class="ltag">BLUE</div></div>
      <div class="core">
        <div class="scores">
          <div id="score-blue" class="sc blue num">0</div>
          <div id="clock" class="clock num"><span id="timer">5:00</span></div>
          <div id="score-orange" class="sc orange num">0</div>
        </div>
        <div class="pips"><div id="pips-blue" class="pipset blue"></div><i class="pip-mid"></i><div id="pips-orange" class="pipset orange"></div></div>
      </div>

<script>
'use strict';
const el = id => document.getElementById(id);
const teamOf = p => (Number(p && p.team) === 1 ? 1 : 0);

const root = document.documentElement;

let currentState = {};
function setText(id, v){ const e = el(id); if (e && e.textContent !== String(v ?? '')) e.textContent = (v ?? ''); }

}
if (/[?&]cam=1\b/.test(location.search)) document.body.classList.add('cam-on');

function fmtTime(t){ if (t == null || isNaN(t)) return '0:00'; t = Math.max(0, Math.round(t)); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); }

  if (t && (t.tag || t.shortName || t.abbr)) return String(t.tag || t.shortName || t.abbr).toUpperCase();

  if (n.length <= 5) return n;

function renderPips(id, wins, bestOf){

/* ── theme: team colours (server-resolved colour mode) + brand accent + font ──── */

}

/* ── player-card event icons — flash on the meaningful events (shots fire too often to pop) ──── */
const EVT_KEYS = ['goals', 'assists', 'saves', 'demos'];
const EVT_ICON = {
  goals:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.6"/><path d="M12 6.4l1.7 3.1 3.4.5-2.5 2.4.6 3.4L12 15.7l-3.2 1.6.6-3.4-2.5-2.4 3.4-.5z" fill="currentColor" stroke="none"/></svg>',
  assists:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5h9V6l7 6-7 6v-4.5H3z"/></svg>',
  saves:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.5 8.9-8 11-4.5-2.1-8-6-8-11V5z"/></svg>',

  demos:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.6l2.3 5.4 5.7-1.3-3.5 4.6L22 13l-6.2.6 1.4 5.9-5.2-3.4-5.2 3.4L8.2 13.6 2 13l5.5-2.7L4 5.7l5.7 1.3z"/></svg>'
};
let _pstat = {};
function fireBcardIcon(card, k){
  const fx = card.children[3]; if (!fx) return;
  fx.innerHTML = EVT_ICON[k] || '';
  fx.className = 'bfx'; void fx.offsetWidth; fx.className = 'bfx show ' + k;
  clearTimeout(fx._t); fx._t = setTimeout(() => { fx.className = 'bfx'; }, 1650);

/* ── HUD render ───────────────────────────────────────────────────────────────── */
let _lastScore = { blue: null, orange: null }, _plateSig = '';
function render(data){
  applyTheme(data);
  const teams = data.teams || {}, game = data.game || {}, players = data.players || [];
  const tb = teams.blue || {}, to = teams.orange || {};

  const bs = game.blueScore ?? 0, os = game.orangeScore ?? 0;
  [['blue', bs], ['orange', os]].forEach(([side, v]) => {
    if (_lastScore[side] != null && v > _lastScore[side]) { const s = el('score-' + side); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
    _lastScore[side] = v; setText('score-' + side, v);

  el('clock').classList.toggle('ot', isOT);

  // using it first froze the timer — it stayed truthy across every state_update tick.
  const t = game.formattedTime || (game.time != null ? fmtTime(game.time) : '') || data.formattedTime || '0:00';

  const round = data.roundLabel ? String(data.roundLabel).trim() : '';

    }

function fillSep(id, parts, trailing){
  const e = el(id), sig = parts.join('') + (trailing ? '|t' : '');

function sepEl(){ const s = document.createElement('span'); s.className = 'sep'; s.textContent = '|'; return s; }

// Shrink the header text so a long event title never clips against the scorebug width.
function fitHeader(){
  const hdr = el('hdr'), txt = el('hd-text'); if (!hdr || !txt) return;
  let s = 13; txt.style.fontSize = s + 'px';
  let g = 0; while (hdr.scrollWidth > hdr.clientWidth + 1 && s > 8 && g++ < 24) { s -= 0.5; txt.style.fontSize = s + 'px'; }
}

/* ── partner tab ──────────────────────────────────────────────────────────────── */
let _pSig = '', _pIdx = 0, _pTimer = null, _pList = [];
function renderPartners(brand){
  const list = ((brand && (brand.railSponsors || brand.sponsors)) || []).filter(s => s && (s.logo || s.name));
  const sig = list.map(s => (s.name || '') + ':' + (s.logo || '').length).join('|');
  if (sig === _pSig) return;
  _pSig = sig; _pList = list; _pIdx = 0; clearInterval(_pTimer);
  const tab = el('ptab');
  if (!list.length) { tab.classList.add('out'); return; }

    tab.classList.add('out');
    setTimeout(() => { _pIdx = (_pIdx + 1) % _pList.length; showPartner(); }, 550);
  }, 9000);
}

  const s = _pList[_pIdx], tab = el('ptab'); if (!s) return;
  tab.innerHTML = '';
  if (s.logo) { const i = document.createElement('img'); i.src = s.logo; i.alt = s.name || ''; tab.appendChild(i); }
  else { const t = document.createElement('span'); t.textContent = s.name; tab.appendChild(t); }
  requestAnimationFrame(() => tab.classList.remove('out'));
}

/* ── MODE: live (logos) / replay + kickoff (names) ────────────────────────────── */
let mode = 'live', _kickoffClock = null, _modeTimer = null;
function setMode(m){
  if (m === mode) return;
  const wasNames = mode !== 'live';
  mode = m; clearTimeout(_modeTimer);
  document.body.classList.toggle('names', m !== 'live');
  document.body.classList.toggle('replay', m === 'replay');
  sizeHeader();
  if (m === 'kickoff') { _kickoffClock = (currentState.game || {}).time; _modeTimer = setTimeout(() => setMode('live'), 12000); }
  if (m === 'replay') _modeTimer = setTimeout(() => setMode('kickoff'), 20000);
  if (m === 'live' && wasNames) ['logo-blue', 'logo-orange'].forEach(id => { const i = el(id); i.classList.remove('punch'); void i.offsetWidth; i.classList.add('punch'); });
}
function showGoalBand(goal){
  goal = goal || {};
  const side = Number(goal.team) === 1 ? 1 : 0, t = (currentState.teams || {})[side === 1 ? 'orange' : 'blue'] || {};
  root.style.setProperty('--rcol', side === 1 ? ORANGE : BLUE);
  setImg('r-logo', t.logo);
  // lead with the SCORER (falls back to the team) + the assister, so the replay chip actually names
  // who scored rather than just the team colour
  setText('r-team', String(goal.scorer || teamName(t, side)));

/* ── PANEL SWEEP ──────────────────────────────────────────────────────────────── */
let _swTimer = null, _swMid = null;
function sweep(opts){
  const w = el('sweep'), dur = opts.dur || 1500;
  w.style.setProperty('--sw-dur', dur + 'ms');
  w.style.setProperty('--sw-col', opts.color || ACCENT);

  setText('sw-text', opts.text || '');

}
const replayCfg = () => currentState.replay || {};
const replayTransitionsOn = () => currentState.rlReplayTransitions !== false;
function sideColor(side){ return replayCfg().colorMode === 'mono' ? '#0c0f16' : (side === 1 ? ORANGE : BLUE); }

/* ── goal → replay cycle ──────────────────────────────────────────────────────── */
const GOAL_TO_REPLAY_MS = 1200, REPLAY_WILLEND_DELAY_MS = 1800, REPLAY_MAX_MS = 15000;
let goalActive = false, introDone = false, outroDone = false, goalSide = 0, introT = null, outroT = null, cycleT = null;
function goalEvent(side, goal){
  if (goalActive) return;
  goalActive = true; introDone = outroDone = false; goalSide = side;
  if (goal) showGoalBand(goal);

  clearTimeout(cycleT); cycleT = setTimeout(() => { playOutro(); goalActive = false; }, 25000);
}
function playIntro(){
  if (!goalActive || introDone) return; introDone = true; clearTimeout(introT);
  if (replayTransitionsOn()) {
    const rp = replayCfg(), brand = currentState.brand || {};
    sweep({ color: sideColor(goalSide), logo: rp.logo || brand.logo, text: rp.logo || brand.logo ? '' : (rp.label || 'REPLAY'), skin: rp.skin });
  }
  clearTimeout(outroT); outroT = setTimeout(playOutro, REPLAY_MAX_MS);   // safety net only
}
function playOutro(){
  if (!goalActive || outroDone) return; outroDone = true; clearTimeout(outroT);
  if (!replayTransitionsOn()) return;
  const rp = replayCfg(), brand = currentState.brand || {};
  sweep({ color: ACCENT, logo: rp.outroLogo || brand.logo, skin: rp.skin, dur: 1300 });
}

/* ── POST-GAME SCOREBOARD ─────────────────────────────────────────────────────── */
const SB_STATS = ['score','goals','assists','saves','shots','demos'], SB_LABELS = ['Score','Goals','Assists','Saves','Shots','Demos'];
let boardOn = false;
function boardData(msgData){
  const sbd = currentState.scoreboard;
  if (sbd && sbd.players && sbd.players.length) return { players: sbd.players, bs: sbd.blueScore, os: sbd.orangeScore, series: sbd.series || currentState.series };
  const pc = (msgData && msgData.playerCache) || currentState.playerCache || {};
  const g = currentState.game || {};
  return { players: Object.values(pc), bs: g.blueScore ?? 0, os: g.orangeScore ?? 0, series: (msgData && msgData.series) || currentState.series };
}
function renderBoard(d){
  const s = currentState, teams = s.teams || {}, brand = s.brand || {}, ad = s.scoreboardAd || {};
  const bs = d.bs ?? 0, os = d.os ?? 0, aWon = bs > os, bWon = os > bs;

  setText('bd-ev', s.eventName || '');
  setText('bd-rd', [s.roundLabel, s.gameLabel || ('GAME ' + ((s.game || {}).number ?? 1) + ' OF ' + (s.bestOf || 5))].filter(Boolean).join('  |  '));
  setText('bd-name-a', teamName(teams.blue, 0)); setText('bd-name-b', teamName(teams.orange, 1));
  setImg('bd-logo-a', (teams.blue || {}).logo); setImg('bd-logo-b', (teams.orange || {}).logo);
  setText('bd-num-a', bs); setText('bd-num-b', os);

  setText('bd-series', 'SERIES ' + (ser.blue ?? 0) + ' - ' + (ser.orange ?? 0));

  el('bd-b').className = 'bd-team b' + (bWon ? ' win' : aWon ? ' lose' : '');

  const ss = s.rlStatsScreen || {};
  el('bd-stats').classList.toggle('off', ss.showStats === false);
  const all = (d.players || []).filter(p => p && p.name);
  const mvp = [...all].sort((a, b) => (b.score || 0) - (a.score || 0))[0];
  [['tbl-a', 0], ['tbl-b', 1]].forEach(([id, num]) => {
    const list = all.filter(p => teamOf(p) === num).sort((a, b) => (b.score || 0) - (a.score || 0));
    let h = '<div class="tr th"><div></div>' + SB_LABELS.map(l => '<div>' + l + '</div>').join('') + '</div>';
    list.forEach(p => {
      const isMvp = mvp && p.name === mvp.name && (aWon || bWon);
      h += '<div class="tr' + (isMvp ? ' mvp' : '') + '"><div class="n"><span></span>' + (isMvp ? '<i class="mvp-tag">MVP</i>' : '') + '</div>' +
        SB_STATS.map(k => '<div class="c num' + (k === 'score' ? ' s' : '') + '">' + (Number(p[k]) || 0) + '</div>').join('') + '</div>';

    const lbl = brand.sponsorLabel == null ? 'PARTNERS' : String(brand.sponsorLabel).trim();
    if (lbl) { const sp = document.createElement('span'); sp.textContent = lbl; rail.appendChild(sp); }
    partners.forEach(x => { const i = document.createElement('img'); i.src = x.logo; i.alt = x.name || ''; rail.appendChild(i); });
  }
  const bg = ad.background || brand.scoreboardBg || null, bi = el('bd-img');
  if (bg) { bi.style.backgroundImage = 'url("' + bg + '")'; bi.classList.remove('hidden'); } else bi.classList.add('hidden');
  requestAnimationFrame(() => { fit('bd-name-a', 44, 22); fit('bd-name-b', 44, 22); });
}
function showBoard(msgData, animate){
  if (currentState.rlScoreboardSeparate) return;   // producer routes the board to its own source
  const d = boardData(msgData);
  const reveal = () => {
    renderBoard(d); boardOn = true;
    const b = el('board'); b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    document.body.classList.add('on-board'); setMode('live');
  };
  if (!animate) return reveal();
  const side = d.os > d.bs ? 1 : 0, t = (currentState.teams || {})[side ? 'orange' : 'blue'] || {};
  sweep({ color: side ? ORANGE : BLUE, logo: t.logo || (currentState.brand || {}).logo, dur: 1700, onMid: reveal });
}
function hideBoard(animate){
  if (!boardOn) { document.body.classList.remove('on-board'); return; }
  const out = () => { boardOn = false; el('board').classList.remove('show'); document.body.classList.remove('on-board'); };
  if (!animate) return out();
  sweep({ color: ACCENT, logo: (currentState.brand || {}).logo, dur: 1300, onMid: out });
}

/* ── dispatch ─────────────────────────────────────────────────────────────────── */
function dispatch(msg){
  if (!msg || !msg.type) return;
  const d = msg.data || {};
  switch (msg.type) {
    case 'full_state':
      currentState = { ...currentState, ...d }; render(currentState);
      if (currentState.view === 'scoreboard') { if (!boardOn) showBoard(null, false); }
      else if (boardOn && currentState.view === 'hud' && !goalActive) hideBoard(false);
      if (currentState.inReplay && mode !== 'replay') { showGoalBand(currentState.currentGoal); setMode('replay'); }
      break;
    case 'state_update':
      currentState = { ...currentState, game: d.game, players: d.players, spectatedPlayer: d.spectatedPlayer };
      render(currentState);
      if (mode === 'kickoff' && _kickoffClock != null && d.game && d.game.time != null && d.game.time !== _kickoffClock) setMode('live');
      break;
    case 'goal_scored': goalEvent(Number(d.team) === 1 ? 1 : 0, d.goal); break;
    case 'replay_will_end':
      if (goalActive && !outroDone) { clearTimeout(outroT); outroT = setTimeout(playOutro, REPLAY_WILLEND_DELAY_MS); }
      break;
    case 'view_change':
      if (d.view === 'goal') {
        const side = Number((d.goal || {}).team) === 1 ? 1 : 0;
        showGoalBand(d.goal);
        if (!goalActive) goalEvent(side, d.goal);
        playIntro(); setMode('replay');
      } else if (d.view === 'hud') {
        if (mode === 'replay') { playOutro(); setMode('kickoff'); }
        goalActive = false; clearTimeout(cycleT);
        if (boardOn) hideBoard(true);
      } else if (d.view === 'scoreboard') {
        clearTimeout(introT); clearTimeout(outroT); clearTimeout(cycleT); goalActive = false;
        showBoard(d, true);
      }
      break;
    case 'clear_scoreboard': hideBoard(true); break;
    case 'game_reset': hideBoard(true); _lastScore = { blue: null, orange: null }; break;
    case 'rl_kickoff':
      if (d.phase === 'countdown') setMode('kickoff');
      else if (d.phase === 'live') setMode('live');
      break;
  }
}

/* ── WS bridge (:3001) — same token flow as rl-hud.html ───────────────────────── */
const HOST = (location.hostname && location.hostname !== 'localhost') ? location.hostname : '127.0.0.1';
const HTTP_BASE = 'http://' + HOST + ':3000', WS_URL = 'ws://' + HOST + ':3001';
let _wsToken = null;
async function connect(){
  if (_wsToken == null) { try { _wsToken = (await (await fetch(HTTP_BASE + '/api/ws-token')).json()).token || ''; } catch (e) { _wsToken = ''; } }
  const ws = new WebSocket(WS_URL + (_wsToken ? ('?token=' + encodeURIComponent(_wsToken)) : ''));
  ws.onopen = () => { try { ws.send(JSON.stringify({ type: 'register', role: 'overlay', page: location.pathname })); ws.send(JSON.stringify({ type: 'request_state' })); } catch (e) {} };
  ws.onmessage = ({ data }) => { let m; try { m = JSON.parse(data); } catch { return; }
    try { dispatch(m); } catch (e) { console.error('[rl-worlds] render error on ' + (m && m.type) + ':', e); } };
  ws.onclose = () => setTimeout(connect, 800);
  ws.onerror = () => { try { ws.close(); } catch {} };
}
