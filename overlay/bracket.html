<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NE Broadcast Suite — Bracket</title>
<link rel="stylesheet" href="fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Default palette = the NE desk-scene (duorow) design language; the active brand
     kit overrides both accents at runtime via SceneBase.brandColor/brandAccent. */
  --accent:   #e83a8b;
  --accent-2: #8b5cf6;
  --ink:      #e8eaf0;
  --muted:    #8b93a8;
  --panel-1:  rgba(255,255,255,0.05);
  --panel-2:  rgba(255,255,255,0.015);
  --hair:     rgba(255,255,255,0.09);
  --line:     rgba(255,255,255,0.18);
  --disp:     'Rajdhani', sans-serif;
  --body:     'Inter', sans-serif;
}

html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--body); color: var(--ink); -webkit-font-smoothing: antialiased; }

.bk-stage { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 28px 52px 28px;
  opacity: 0; transform: scale(1.012); transition: opacity .55s ease, transform .55s ease; }
.bk-stage.show { opacity: 1; transform: scale(1); }


/* ── Header — absolute bottom-right (centered in butterfly mode) ── */
.bk-header { position: absolute; bottom: 28px; right: 52px; z-index: 10;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.bk-stage.butterfly .bk-header { right: auto; left: 50%; transform: translateX(-50%); align-items: center; }
.bk-stage.butterfly .bk-title { text-align: center; }
.bk-stage.butterfly .bk-eyebrow { text-align: center; }
.bk-stage.butterfly { padding-bottom: 88px; }
.bk-bar { display: none; }
.bk-head-text { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.bk-eyebrow { font-family: var(--disp); font-weight: 700; font-size: 12px; letter-spacing: .42em; text-transform: uppercase;
  color: var(--accent); text-align: right; }
.bk-title { font-family: var(--disp); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; color: #fff;
  text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 760px; }
.bk-subtitle { font-family: var(--body); font-weight: 600; font-size: 15px; color: rgba(255,255,255,.85); text-align: right;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 760px; }
.bk-subtitle:empty { display: none; }
.bk-head-right { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.bk-format { font-family: var(--disp); font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #04121f;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 999px; padding: 6px 14px; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.bk-phases { display: flex; gap: 6px; }
.bk-phase { font-family: var(--disp); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 999px; color: var(--muted); background: var(--panel-1); border: 1px solid var(--hair); }
.bk-phase.active { color: #fff; background: var(--accent); border-color: transparent; box-shadow: 0 4px 14px rgba(0,0,0,.35); }

/* ── Body / scale ── */
.bk-body { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
.bk-scale { transform-origin: center center; display: flex; flex-direction: column; align-items: stretch; gap: 12px; width: 1816px; }

/* ── Section (Winners / Losers) ── */
.bk-section { display: flex; flex-direction: column; align-items: center; width: 100%; }
.bk-section-label { display: none; }

/* Section pills — shown in the bottom-right header cluster */
.bk-section-pills { display: flex; gap: 6px; margin-top: 2px; }
.bk-spill { font-family: var(--disp); font-weight: 700; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.bk-spill.wb { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.bk-spill.lb { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 45%, transparent); background: color-mix(in srgb, var(--accent-2) 12%, transparent); }

/* Match cards; columns flex-fill the full canvas width — no dead side space. */
.bk-rounds { position: relative; display: flex; align-items: stretch; gap: 32px; width: 100%; }

/* ── Butterfly (full double-elim): WB left → GF center ← LB right ── */
.bk-scale.butterfly { flex-direction: row; height: 920px; }
.bk-scale.butterfly .bk-section { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bk-scale.butterfly .bk-section .bk-rounds { flex: 1; min-height: 0; }
.bk-scale.butterfly .bk-section.losers .bk-rounds { flex-direction: row-reverse; }

/* Grand Finals center column */
.bk-gf { flex: 0 0 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 10px; position: relative; }
.bk-gf::before, .bk-gf::after { content: ''; position: absolute; top: 15%; bottom: 15%; width: 1px; background: linear-gradient(180deg, transparent, rgba(255,214,107,.3) 40%, rgba(255,214,107,.3) 60%, transparent); }
.bk-gf::before { left: 0; } .bk-gf::after { right: 0; }
.bk-gf-label { font-family: var(--disp); font-weight: 800; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #ffd66b; text-align: center; white-space: nowrap; margin-bottom: 6px;
  text-shadow: 0 0 20px rgba(255,214,107,.5); }
.bk-gf .bk-match { width: 100%; border-color: rgba(255,214,107,.4); box-shadow: 0 0 0 1px rgba(255,214,107,.12), 0 6px 24px rgba(0,0,0,.55); }
.bk-connectors { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
.bk-connectors path { fill: none; stroke: rgba(255,255,255,.2); stroke-width: 1.5; stroke-linejoin: round; }
.bk-section.losers .bk-connectors path { stroke: color-mix(in srgb, var(--accent-2) 30%, transparent); }

/* ── Round column — flex-fill: columns always span edge to edge ── */
.bk-round { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; min-width: 0; }
.bk-round-name { font-family: var(--disp); font-weight: 700; font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
  color: #fff; text-align: center; margin-bottom: 10px; height: 16px; }
.bk-round.is-final .bk-round-name { color: rgba(255,214,107,.7); }
.bk-matches { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; flex: 1; min-height: 0; }

/* ── Match card ── */
.bk-match { position: relative; width: 100%; border-radius: 6px; overflow: hidden;
  border: 1px solid rgba(255,255,255,.08);
  background: linear-gradient(180deg, rgba(20,23,32,.97) 0%, rgba(12,14,20,.97) 100%);
  box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.bk-match.is-final { border-color: rgba(255,214,107,.4); box-shadow: 0 0 0 1px rgba(255,214,107,.15), 0 6px 24px rgba(0,0,0,.55); }
.bk-match.live { border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent), 0 4px 20px rgba(0,0,0,.5); }
.bk-match.upcoming { opacity: .72; }
.bk-match.upcoming .bk-score { color: rgba(255,255,255,.25); }
.bk-match.live::after { content: 'LIVE'; position: absolute; top: -9px; right: 8px; font-family: var(--disp); font-weight: 800;
  font-size: 10px; letter-spacing: .12em; color: #fff; background: #ff3b46; border-radius: 999px; padding: 2px 8px; box-shadow: 0 0 10px rgba(255,59,70,.55); }

/* ── Slot (one team row) ── */
.bk-slot { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 0; height: 50px; position: relative; }
.bk-slot + .bk-slot { border-top: 1px solid rgba(255,255,255,.06); }
.bk-slot-accent { width: 3px; align-self: stretch; flex-shrink: 0; background: transparent; }
.bk-logo { width: 28px; height: 28px; object-fit: contain; flex: 0 0 auto; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.bk-logo.logo-on-dark { filter: invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.bk-logo-ph { width: 28px; height: 28px; border-radius: 5px; flex: 0 0 auto; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
/* Abbrev badge — replaces logo in abbrev mode */
.bk-logo-badge { display: none; flex: 0 0 28px; width: 28px; height: 28px; border-radius: 5px; align-items: center; justify-content: center;
  font-family: var(--disp); font-weight: 900; color: #fff; text-align: center; letter-spacing: .02em; line-height: 1;
  background: color-mix(in srgb, var(--badge-col, #4a5568) 55%, rgba(0,0,0,.5));
  border: 1px solid color-mix(in srgb, var(--badge-col, #4a5568) 70%, transparent); }
.bk-name { font-family: var(--disp); font-weight: 600; font-size: 22px; color: #fff; letter-spacing: .01em;
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-name .bk-short { display: none; }
.bk-name .bk-full  { display: inline; }
/* Abbreviation mode: swap logo → badge, full name → short */
.bk-abbrev .bk-logo        { display: none; }
.bk-abbrev .bk-logo-ph     { display: none; }
.bk-abbrev .bk-logo-badge  { display: flex; }
.bk-abbrev .bk-name .bk-full  { display: none; }
.bk-abbrev .bk-name .bk-short { display: inline; font-size: 24px; font-weight: 800; letter-spacing: .03em; }
.bk-score { font-family: var(--disp); font-weight: 800; font-size: 22px; color: rgba(255,255,255,.6); min-width: 28px; text-align: center;
  font-variant-numeric: tabular-nums; }
.bk-slot.winner .bk-slot-accent { background: var(--accent); box-shadow: 2px 0 8px color-mix(in srgb, var(--accent) 50%, transparent); }
.bk-slot.winner { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent) 0%, transparent 70%); }
.bk-slot.winner .bk-name { color: #fff; font-weight: 700; }
/* Broadcast-style: the winning score reads as a filled chip so the result is legible at a glance. */
.bk-slot.winner .bk-score { color: #fff; background: color-mix(in srgb, var(--accent) 82%, #000); border-radius: 5px; padding: 3px 0; box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 40%, transparent); }
.bk-section.losers .bk-slot.winner .bk-score { background: color-mix(in srgb, var(--accent-2) 82%, #000); box-shadow: 0 2px 8px color-mix(in srgb, var(--accent-2) 40%, transparent); }
.bk-slot.loser .bk-name { color: rgba(118,125,140,.6); }
.bk-slot.loser .bk-logo { opacity: .4; }
.bk-slot.loser .bk-logo-badge { opacity: .45; }
.bk-slot.loser .bk-score { color: rgba(126,133,151,.4); }
.bk-section.losers .bk-slot.winner .bk-slot-accent { background: var(--accent-2); box-shadow: 2px 0 8px color-mix(in srgb, var(--accent-2) 50%, transparent); }
.bk-section.losers .bk-slot.winner { background: linear-gradient(90deg, color-mix(in srgb, var(--accent-2) 10%, transparent) 0%, transparent 70%); }
.bk-slot.focused { outline: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.bk-slot.focused .bk-slot-accent { background: var(--accent); }
.bk-slot.focused .bk-name { color: #fff; font-weight: 800; }
/* Team-run focus mode: the focused team's matches (their path through the bracket) stay lit
   and ringed; every other match recedes so the run reads instantly. Connectors fade with the
   matches so the lit boxes themselves trace the route. */
.bk-focus-mode .bk-match:not(.on-path) { opacity: .28; filter: saturate(.45); transition: opacity .35s ease; }
.bk-focus-mode .bk-match.on-path {
  opacity: 1; transition: opacity .35s ease;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 60%, transparent),
              0 0 22px color-mix(in srgb, var(--accent) 28%, transparent),
              0 6px 24px rgba(0,0,0,.55);
}
.bk-focus-mode .bk-connectors path { stroke: rgba(255,255,255,.09); }

/* ── Schedule (round-robin / swiss round-by-round pairings) — reuses .bk-round/.bk-match/.bk-slot ── */
.bk-schedule { width: 100%; }
.bk-schedule .bk-rounds { gap: 24px; }
/* Round headers become pills so pool-play reads as a SCHEDULE, not a bracket fragment */
.bk-schedule .bk-round-name { height: auto; margin-bottom: 14px; padding: 6px 0; color: #fff;
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border: 1px solid var(--hair); border-radius: 999px; position: relative; overflow: hidden; }
.bk-schedule .bk-round-name::after { content: ''; position: absolute; left: 18%; right: 18%; bottom: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.bk-schedule .bk-matches { justify-content: flex-start; gap: 14px; }
/* ── Cross-phase progression pills: where a slot came from / where the winner goes ── */
.bk-origin { font-size: 12px; line-height: 1; color: rgba(255,255,255,.5); padding: 4px 9px 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.bk-exit { font-size: 12px; line-height: 1; font-weight: 600; padding: 4px 9px 5px;
  color: color-mix(in srgb, var(--accent) 80%, #fff);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-exit::before { content: '\2192  '; opacity: .75; }
.bk-lad-note { text-align: center; font-family: var(--disp); font-size: 16px; font-weight: 600;
  color: color-mix(in srgb, var(--accent) 80%, #fff); letter-spacing: .05em; }
.bk-lad-note::before { content: '\2192  '; opacity: .75; }

/* ── Records ladder (swiss / round-robin default view): teams bucketed by W-L ── */
.bk-ladder { display: flex; align-items: flex-start; justify-content: center; gap: 22px; width: 100%; }
.bk-lad-bucket { flex: 1 1 0; min-width: 150px; max-width: 300px; display: flex; flex-direction: column; gap: 8px; }
.bk-lad-head { text-align: center; font-family: var(--disp); font-weight: 700; font-size: 22px;
  letter-spacing: .1em; color: #fff; padding: 8px 0; border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid var(--hair); position: relative; overflow: hidden; }
.bk-lad-head::after { content: ''; position: absolute; left: 16%; right: 16%; bottom: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.bk-lad-bucket.qualified .bk-lad-head { color: #6ff0a8; }
.bk-lad-bucket.qualified .bk-lad-head::after { background: linear-gradient(90deg, transparent, #6ff0a8, transparent); }
.bk-lad-bucket.eliminated .bk-lad-head { color: #f39191; }
.bk-lad-bucket.eliminated .bk-lad-head::after { background: linear-gradient(90deg, transparent, #f39191, transparent); }
.bk-lad-team { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 7px;
  background: linear-gradient(180deg, rgba(20,23,32,.97), rgba(12,14,20,.97));
  border: 1px solid rgba(255,255,255,.08); border-left: 3px solid var(--team-c, rgba(255,255,255,.14)); }
.bk-lad-bucket.eliminated .bk-lad-team { opacity: .62; }
.bk-lad-logo { width: 26px; height: 26px; object-fit: contain; flex: 0 0 auto; }
.bk-lad-logo.logo-on-dark { filter: invert(1); }
.bk-lad-name { font-family: var(--disp); font-weight: 600; font-size: 17px; color: #fff;
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-lad-team.focused { outline: 1px solid var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent); }
/* Dense rounds (>8 sets): two-column grid, double-width column */
.bk-schedule .bk-round.bk-dense { flex: 2; }
.bk-schedule .bk-round.bk-dense .bk-matches { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── Standings (round-robin / swiss) ── */
.bk-standings { align-self: center; width: 1100px; max-width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid var(--hair);
  background: linear-gradient(180deg, rgba(22,25,33,.96), rgba(13,15,21,.96)); box-shadow: 0 18px 44px rgba(0,0,0,.5); }
.bk-st-row { display: grid; grid-template-columns: 100px 1fr 100px 100px 150px; align-items: center; height: 64px; padding: 0 32px; position: relative; }
.bk-standings.enriched { width: 1320px; }
.bk-standings.enriched .bk-st-row { grid-template-columns: 100px 1fr 100px 100px 120px 150px 150px; }
/* Show Win/Loss OFF — drop the W/L + win% bar columns (League source toggle). */
.bk-standings.norecord .bk-st-row { grid-template-columns: 100px 1fr; }
.bk-standings.norecord.enriched .bk-st-row { grid-template-columns: 100px 1fr 120px 150px; }
.bk-st-row + .bk-st-row { border-top: 1px solid var(--hair); }
.bk-st-row:nth-child(odd):not(.bk-st-head) { background: rgba(255,255,255,.018); }
.bk-st-head { background: rgba(255,255,255,.06); height: 52px; }
.bk-st-head::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent 85%); }
.bk-st-head > div { font-family: var(--disp); font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #aeb6c4; }
.bk-st-grouplbl { display: block; font-size: 9px; font-weight: 700; letter-spacing: .14em; color: var(--muted); opacity: .75; margin-bottom: 1px; }
/* Medal accent bars on the podium rows — stronger placement signal than a tinted number alone */
.bk-st-row.r1::before, .bk-st-row.r2::before, .bk-st-row.r3::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.bk-st-row.r1::before { background: #ffd66b; box-shadow: 0 0 12px rgba(255,214,107,.4); }
.bk-st-row.r2::before { background: #cdd6e4; }
.bk-st-row.r3::before { background: #e0944a; }
.bk-st-rank { font-family: var(--disp); font-weight: 800; font-size: 24px; color: var(--muted); text-align: center; }
.bk-st-row.r1 .bk-st-rank { color: #ffd66b; } .bk-st-row.r2 .bk-st-rank { color: #cdd6e4; } .bk-st-row.r3 .bk-st-rank { color: #e0944a; }
.bk-st-team { display: flex; align-items: center; gap: 14px; min-width: 0; }
.bk-st-logo { width: 34px; height: 34px; object-fit: contain; flex: 0 0 auto; }
.bk-st-logo.logo-on-dark { filter: invert(1); }
.bk-st-name { font-family: var(--disp); font-weight: 700; font-size: 24px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-st-rec { font-family: var(--disp); font-weight: 800; font-size: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.bk-st-w { color: #5fe39a; } .bk-st-l { color: #f08a8a; }
.bk-st-extra { font-family: var(--disp); font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.bk-st-bar { height: 9px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
.bk-st-bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* ── Matrix (round robin / pool play head-to-head grid) ── */
.bk-matrix { align-self: center; max-width: 100%; border-radius: 16px; border: 1px solid var(--hair); padding: 24px;
  background: linear-gradient(180deg, rgba(22,25,33,.96), rgba(13,15,21,.96)); box-shadow: 0 18px 44px rgba(0,0,0,.5); }
.bk-mx-table { display: grid; gap: 4px; }
.bk-mx-cell { display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 7px;
  font-family: var(--disp); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.03); color: #fff; }
.bk-mx-corner { background: transparent; }
.bk-mx-head { background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04)); color: #e3e8f1;
  font-size: 14px; letter-spacing: .04em; padding: 0 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-bottom: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.bk-mx-rowhead { justify-content: flex-start; gap: 10px; padding-left: 14px; text-align: left;
  border-bottom: none; border-right: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.bk-mx-logo { width: 24px; height: 24px; object-fit: contain; flex: 0 0 auto; }
.bk-mx-logo.logo-on-dark { filter: invert(1); }
.bk-mx-diag { background: repeating-linear-gradient(45deg, rgba(255,255,255,.02), rgba(255,255,255,.02) 6px, transparent 6px, transparent 12px); }
.bk-mx-unplayed { color: rgba(255,255,255,.22); }
.bk-mx-played.win { color: #6ff0a4; background: rgba(95,227,154,.14); box-shadow: inset 0 0 0 1px rgba(95,227,154,.22); }
.bk-mx-played.loss { color: #f5a0a0; background: rgba(240,138,138,.09); box-shadow: inset 0 0 0 1px rgba(240,138,138,.16); }

/* ── Empty ── */
.bk-empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-family: var(--disp); font-weight: 600; font-size: 30px; letter-spacing: .06em; color: rgba(255,255,255,.85); text-transform: uppercase; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="bk-stage" class="bk-stage">
  <header class="bk-header">
    <div class="bk-section-pills" id="bk-section-pills"></div>
    <div class="bk-head-text">
      <div class="bk-eyebrow">Tournament Bracket</div>
      <div class="bk-title" id="bk-title"></div>
      <div class="bk-subtitle" id="bk-subtitle"></div>
    </div>
    <div class="bk-head-right">
      <div class="bk-phases" id="bk-phases"></div>
      <div class="bk-format" id="bk-format" style="display:none;"></div>
    </div>
  </header>
  <main class="bk-body"><div class="bk-scale" id="bk-scale"></div></main>
  <div class="bk-empty" id="bk-empty">No bracket loaded — load an event from the dashboard.</div>
</div>

<script src="scene-base.js"></script>
<script>
(function () {
  const SVGNS = 'http://www.w3.org/2000/svg';
  function el(id) { return document.getElementById(id); }
  let logoByName = {};
  let abbrevByName = {};
  let colorByName = {};
  let _sig = '';
  let _livePair = '';   // on-air teams (sorted, upper, '|'-joined) — drives the LIVE badge

  function logoFor(name) { return (name && logoByName[name.toLowerCase()]) || null; }
  function isDark(src) { try { return SceneBase.isDefaultGameLogo(src); } catch (e) { return false; } }

  function abbrev(name) {
    if (!name || name === 'TBD') return name;
    const s = name.trim();
    if (s.length <= 5) return s.toUpperCase();
    const words = s.split(/\s+/);
    if (words.length >= 2) return words.map(function(w) { return w[0]; }).join('').toUpperCase().slice(0, 5);
    return s.slice(0, 3).toUpperCase();
  }

  function fmtType(t) {
    return ({ SINGLE_ELIMINATION: 'Single Elimination', DOUBLE_ELIMINATION: 'Double Elimination',
      ROUND_ROBIN: 'Round Robin', SWISS: 'Swiss' })[t] || (t ? t.replace(/_/g, ' ') : '');
  }

  function buildSlot(slot) {
    const s = slot || { name: 'TBD', score: null, winner: false };
    const known = s.name && s.name !== 'TBD';
    const row = document.createElement('div');
    row.className = 'bk-slot' + (s.winner ? ' winner' : (known ? ' loser' : ''));
    const accent = document.createElement('div'); accent.className = 'bk-slot-accent'; row.appendChild(accent);
    const displayName = s.name || 'TBD';
    const shortName = abbrevByName[displayName.toLowerCase()] || abbrev(displayName);
    // Logo / placeholder (shown in normal mode)
    const logo = known ? logoFor(s.name) : null;
    if (logo) {
      const img = document.createElement('img');
      img.className = 'bk-logo' + (isDark(logo) ? ' logo-on-dark' : '');
      img.src = logo; img.onerror = function () { this.outerHTML = '<span class="bk-logo-ph"></span>'; };
      row.appendChild(img);
    } else {
      const ph = document.createElement('span'); ph.className = 'bk-logo-ph'; row.appendChild(ph);
    }
    // Abbrev badge (shown in abbrev mode instead of logo)
    const badge = document.createElement('span'); badge.className = 'bk-logo-badge';
    const badgeColor = known ? (colorByName[displayName.toLowerCase()] || null) : null;
    if (badgeColor) badge.style.setProperty('--badge-col', badgeColor);
    const badgeText = shortName.slice(0, 5);
    badge.style.fontSize = (badgeText.length <= 2 ? 13 : badgeText.length <= 3 ? 11 : badgeText.length <= 4 ? 9 : 8) + 'px';
    badge.textContent = badgeText;
    row.appendChild(badge);
    const name = document.createElement('div'); name.className = 'bk-name';
    name.innerHTML = '<span class="bk-full">' + displayName.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>'
                   + '<span class="bk-short">' + shortName.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
    const score = document.createElement('div'); score.className = 'bk-score';
    score.textContent = (s.score === null || s.score === undefined) ? '–' : s.score;
    row.appendChild(name); row.appendChild(score);
    return row;
  }

  function buildMatch(set, isFinal) {
    const m = document.createElement('div');
    const a = set.a || {}, b = set.b || {};
    const known = (a.name && a.name !== 'TBD') && (b.name && b.name !== 'TBD');
    const decided = a.winner || b.winner;
    // LIVE = this set's pair is the pair currently on the scoreboard (either order) and it
    // isn't decided yet. The old score-sum heuristic missed 0-0 sets and never turned off
    // when a partially-scored set was abandoned.
    const pair = known
      ? [String(a.name).trim().toUpperCase(), String(b.name).trim().toUpperCase()].sort().join('|')
      : '';
    const inPlay = known && !decided && !!_livePair && pair === _livePair;
    // start.gg state 1 = not started — render slightly muted so a pre-event bracket
    // clearly reads as "scheduled", not "results".
    const upcoming = set.state === 1 && !decided && !inPlay;
    m.className = 'bk-match' + (isFinal ? ' is-final' : '') + (inPlay ? ' live' : '') + (upcoming ? ' upcoming' : '');
    if (set.fromA) { const fa = document.createElement('div'); fa.className = 'bk-origin'; fa.textContent = set.fromA; m.appendChild(fa); }
    m.appendChild(buildSlot(a));
    m.appendChild(buildSlot(b));
    if (set.fromB) { const fb = document.createElement('div'); fb.className = 'bk-origin'; fb.textContent = set.fromB; m.appendChild(fb); }
    if (set.toNext) { const ex = document.createElement('div'); ex.className = 'bk-exit'; ex.textContent = set.toNext; m.appendChild(ex); }
    return m;
  }

  function buildColumn(round, isFinal) {
    const col = document.createElement('div');
    col.className = 'bk-round' + (isFinal ? ' is-final' : '');
    const name = document.createElement('div'); name.className = 'bk-round-name'; name.textContent = round.name || '';
    col.appendChild(name);
    const matches = document.createElement('div'); matches.className = 'bk-matches';
    (round.sets || []).forEach((set) => matches.appendChild(buildMatch(set, isFinal)));
    col.appendChild(matches);
    return col;
  }

  // Grand Finals center piece for butterfly layout.
  function buildGF(finals) {
    const wrap = document.createElement('div');
    wrap.className = 'bk-gf';
    const lbl = document.createElement('div'); lbl.className = 'bk-gf-label'; lbl.textContent = 'Grand Finals';
    wrap.appendChild(lbl);
    finals.forEach(function(round) {
      (round.sets || []).forEach(function(set) { wrap.appendChild(buildMatch(set, true)); });
    });
    return wrap;
  }

  // Section = label + a horizontal band of round columns + an SVG connector layer.
  function buildSection(label, rounds, finalsStart, sectionClass) {
    const section = document.createElement('div');
    section.className = 'bk-section' + (sectionClass ? ' ' + sectionClass : '');
    if (label) { const l = document.createElement('div'); l.className = 'bk-section-label'; l.textContent = label; section.appendChild(l); }
    const band = document.createElement('div'); band.className = 'bk-rounds';
    const svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('class', 'bk-connectors'); band.appendChild(svg);
    rounds.forEach((r, i) => band.appendChild(buildColumn(r, finalsStart != null && i >= finalsStart)));
    section.appendChild(band);
    return section;
  }

  // Elbow connectors between adjacent round columns of one .bk-rounds band.
  // In the reversed losers bracket the flex order is right-to-left, so connection
  // points swap: parent left-edge → child right-edge instead of parent right → child left.
  function drawConnectors(band) {
    const svg = band.querySelector('.bk-connectors'); if (!svg) return;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const base = band.getBoundingClientRect();
    if (!base.width) return;
    svg.setAttribute('width', base.width); svg.setAttribute('height', base.height);
    svg.setAttribute('viewBox', '0 0 ' + base.width + ' ' + base.height);
    const isRev = getComputedStyle(band).flexDirection === 'row-reverse';
    const cols = Array.prototype.slice.call(band.querySelectorAll('.bk-round'));
    for (let c = 1; c < cols.length; c++) {
      const parents = Array.prototype.slice.call(cols[c - 1].querySelectorAll('.bk-match'));
      const children = Array.prototype.slice.call(cols[c].querySelectorAll('.bk-match'));
      if (!parents.length || !children.length) continue;
      children.forEach((child, j) => {
        const cr = child.getBoundingClientRect();
        const cx = (isRev ? cr.right : cr.left) - base.left;
        const cy = cr.top - base.top + cr.height / 2;
        let feeders;
        if (parents.length >= children.length * 2 - 1) feeders = [parents[2 * j], parents[2 * j + 1]];
        else if (parents.length === children.length) feeders = [parents[j]];
        else feeders = [parents[Math.min(parents.length - 1, Math.round(j * parents.length / children.length))]];
        feeders.filter(Boolean).forEach((p) => {
          const pr = p.getBoundingClientRect();
          const px = (isRev ? pr.left : pr.right) - base.left;
          const py = pr.top - base.top + pr.height / 2;
          const midX = px + (cx - px) / 2;
          const path = document.createElementNS(SVGNS, 'path');
          path.setAttribute('d', 'M ' + px + ' ' + py + ' H ' + midX + ' V ' + cy + ' H ' + cx);
          svg.appendChild(path);
        });
      });
    }
  }

  function buildStandings(standings, showRecord) {
    const wrap = document.createElement('div'); wrap.className = 'bk-standings';
    // Round Robin/Swiss rows carry extra stat fields (Sets Played, Game Wins-Losses) that
    // Start.gg's own standings tables show — elimination-bracket rows never have them, so
    // this stays a plain W/L table there (zero visual change for the far more common case).
    const enriched = standings.some((s) => s.setsTotal != null);
    wrap.classList.toggle('enriched', enriched);
    wrap.classList.toggle('norecord', showRecord === false);
    // "SET" group label above W/L — start.gg's own terminology for a match (a Bo3/Bo5 is one
    // Set of individual Games), disambiguating the W/L pair from the Games column when present.
    const head = document.createElement('div'); head.className = 'bk-st-row bk-st-head';
    head.innerHTML = '<div class="bk-st-rank">#</div><div>Team</div>'
      + (showRecord === false ? '' : '<div style="text-align:center"><span class="bk-st-grouplbl">Set</span>W</div><div style="text-align:center"><span class="bk-st-grouplbl">Set</span>L</div>')
      + (enriched ? '<div style="text-align:center">Played</div><div style="text-align:center">Games</div>' : '')
      + (showRecord === false ? '' : '<div style="text-align:center">Win %</div>');
    wrap.appendChild(head);
    standings.forEach((s, i) => {
      const total = (s.wins || 0) + (s.losses || 0);
      const pct = total ? Math.round((s.wins / total) * 100) : 0;
      // played === false → the event hasn't produced a result for this team yet: no rank
      // number and no medal tint, so a pre-event table doesn't imply real placements.
      const noResult = s.played === false && total === 0;
      const row = document.createElement('div'); row.className = 'bk-st-row' + (!noResult && i < 3 ? ' r' + (i + 1) : '');
      const rank = document.createElement('div'); rank.className = 'bk-st-rank'; rank.textContent = noResult ? '–' : s.placement;
      const team = document.createElement('div'); team.className = 'bk-st-team';
      const logo = logoFor(s.name);
      if (logo) { const img = document.createElement('img'); img.className = 'bk-st-logo' + (isDark(logo) ? ' logo-on-dark' : ''); img.src = logo; img.onerror = function () { this.style.display = 'none'; }; team.appendChild(img); }
      const nm = document.createElement('div'); nm.className = 'bk-st-name'; nm.textContent = s.name; team.appendChild(nm);
      row.appendChild(rank); row.appendChild(team);
      if (showRecord !== false) {
        const w = document.createElement('div'); w.className = 'bk-st-rec bk-st-w'; w.textContent = s.wins;
        const l = document.createElement('div'); l.className = 'bk-st-rec bk-st-l'; l.textContent = s.losses;
        row.appendChild(w); row.appendChild(l);
      }
      if (enriched) {
        const played = document.createElement('div'); played.className = 'bk-st-extra';
        played.textContent = (s.setsPlayed || 0) + '/' + (s.setsTotal || 0);
        const games = document.createElement('div'); games.className = 'bk-st-extra';
        games.textContent = (s.gameWins || 0) + '-' + (s.gameLosses || 0);
        row.appendChild(played); row.appendChild(games);
      }
      if (showRecord !== false) {
        const bar = document.createElement('div'); bar.className = 'bk-st-bar'; bar.innerHTML = '<span style="width:' + pct + '%"></span>';
        row.appendChild(bar);
      }
      wrap.appendChild(row);
    });
    return wrap;
  }

  // Head-to-head grid for Round Robin pools — rows/columns are both team names, each
  // cell is that pairing's result. Matches how Start.gg itself presents Pool Play.
  function buildMatrix(matrix) {
    const teams = (matrix && matrix.teams) || [];
    const cells = (matrix && matrix.cells) || {};
    const wrap = document.createElement('div'); wrap.className = 'bk-matrix';
    const table = document.createElement('div'); table.className = 'bk-mx-table';
    table.style.gridTemplateColumns = '220px repeat(' + teams.length + ', minmax(64px, 1fr))';
    const corner = document.createElement('div'); corner.className = 'bk-mx-cell bk-mx-corner'; table.appendChild(corner);
    teams.forEach((t) => {
      const h = document.createElement('div'); h.className = 'bk-mx-cell bk-mx-head';
      const short = abbrevByName[t.name.toLowerCase()] || abbrev(t.name);
      h.textContent = short; h.title = t.name;
      table.appendChild(h);
    });
    teams.forEach((rowTeam) => {
      const rh = document.createElement('div'); rh.className = 'bk-mx-cell bk-mx-head bk-mx-rowhead';
      const logo = logoFor(rowTeam.name);
      if (logo) { const img = document.createElement('img'); img.className = 'bk-mx-logo' + (isDark(logo) ? ' logo-on-dark' : ''); img.src = logo; img.onerror = function () { this.style.display = 'none'; }; rh.appendChild(img); }
      const nm = document.createElement('span'); nm.textContent = rowTeam.name; rh.appendChild(nm);
      table.appendChild(rh);
      teams.forEach((colTeam) => {
        const cell = document.createElement('div'); cell.className = 'bk-mx-cell';
        if (colTeam.id === rowTeam.id) {
          cell.classList.add('bk-mx-diag');
        } else {
          const c = cells[rowTeam.id + '_' + colTeam.id];
          if (c && c.played) {
            cell.classList.add('bk-mx-played', c.winner === 'a' ? 'win' : (c.winner === 'b' ? 'loss' : ''));
            cell.textContent = (c.aScore == null ? '-' : c.aScore) + '-' + (c.bScore == null ? '-' : c.bScore);
          } else {
            cell.classList.add('bk-mx-unplayed');
            cell.textContent = '–';
          }
        }
        table.appendChild(cell);
      });
    });
    wrap.appendChild(table);
    return wrap;
  }

  // Manually-built schedules (Bracket Builder) don't stamp an explicit a.winner/b.winner flag the
  // way start.gg-derived sets do — infer one from the scores so buildMatch/buildSlot's win/live
  // styling (and the "LIVE" badge) still work correctly for those too.
  function withInferredWinners(schedule) {
    return (schedule || []).map((r) => ({
      ...r,
      sets: (r.sets || []).map((set) => {
        const a = set.a || {}, b = set.b || {};
        if (a.winner || b.winner) return set;   // already explicit
        const bothKnown = a.name && a.name !== 'TBD' && b.name && b.name !== 'TBD';
        const bothScored = a.score != null && b.score != null;
        if (bothKnown && bothScored && a.score !== b.score) {
          return { a: { ...a, winner: a.score > b.score }, b: { ...b, winner: b.score > a.score } };
        }
        return set;
      })
    }));
  }

  // Swiss / RR records ladder — teams bucketed by W-L record, best bucket left. Reads
  // STANDINGS (not sets), so it renders correctly from round 1 even though start.gg only
  // creates later swiss rounds once pairings exist. Undefeated buckets read as qualified-
  // green once a team can no longer be caught? No — colour is purely by record sign:
  // all-wins bucket green, all-losses bucket red, mixed neutral.
  function buildLadder(standings, advancesTo) {
    const wrap = document.createElement('div'); wrap.className = 'bk-ladder';
    const buckets = new Map();
    (standings || []).forEach((s) => {
      const w = s.wins || 0, l = s.losses || 0;
      if (s.played === false && !w && !l) return;   // pre-event rows: no bucket
      const key = w + '-' + l;
      if (!buckets.has(key)) buckets.set(key, { w, l, teams: [] });
      buckets.get(key).teams.push(s);
    });
    const ordered = [...buckets.values()].sort((a, b) => (b.w - b.l) - (a.w - a.l) || b.w - a.w);
    ordered.forEach((bk) => {
      const col = document.createElement('div');
      col.className = 'bk-lad-bucket' + (bk.l === 0 && bk.w > 0 ? ' qualified' : (bk.w === 0 && bk.l > 0 ? ' eliminated' : ''));
      const head = document.createElement('div'); head.className = 'bk-lad-head'; head.textContent = bk.w + ' – ' + bk.l;
      col.appendChild(head);
      bk.teams.forEach((s) => {
        const t = document.createElement('div'); t.className = 'bk-lad-team';
        const color = colorByName[(s.name || '').toLowerCase()];
        if (color) t.style.setProperty('--team-c', color);
        const logo = logoFor(s.name);
        if (logo) { const img = document.createElement('img'); img.className = 'bk-lad-logo' + (isDark(logo) ? ' logo-on-dark' : ''); img.src = logo; img.onerror = function () { this.style.display = 'none'; }; t.appendChild(img); }
        const nm = document.createElement('div'); nm.className = 'bk-lad-name bk-name'; nm.textContent = s.name || 'TBD';
        t.appendChild(nm);
        col.appendChild(t);
      });
      wrap.appendChild(col);
    });
    if (advancesTo) {
      const outer = document.createElement('div');
      outer.style.cssText = 'display:flex; flex-direction:column; gap:16px; width:100%;';
      const note = document.createElement('div');
      note.className = 'bk-lad-note';
      note.textContent = 'Qualifiers advance to ' + advancesTo;
      outer.appendChild(wrap); outer.appendChild(note);
      return outer;
    }
    return wrap;
  }

  // Round-robin / Swiss round-by-round pairings — reuses buildColumn (same {name,sets} shape
  // as the elimination rounds), just laid out as one flat row of columns with no connectors.
  function buildSchedule(schedule) {
    const wrap = document.createElement('div'); wrap.className = 'bk-schedule';
    const band = document.createElement('div'); band.className = 'bk-rounds';
    withInferredWinners(schedule).forEach((r) => {
      const col = buildColumn(r, false);
      // Big swiss rounds (RLCS-Open pools: a dozen+ sets per round) wrap into two columns
      // so one round doesn't become a skyscraper that scales the whole view unreadable.
      if ((r.sets || []).length > 8) col.classList.add('bk-dense');
      band.appendChild(col);
    });
    wrap.appendChild(band);
    return wrap;
  }

  // Scale the fixed-size bracket to FILL the 16:9 canvas: never overflow, but
  // upscale small brackets (cap 1.5×) so an 8-team and a 32-team event both frame
  // consistently instead of floating tiny in the middle.
  var MAX_FIT = 2.2;
  var ABBREV_THRESHOLD = 0.72; // switch to initials when bracket is scaled below this
  function fit(forceAbbrev) {
    const scaleEl = el('bk-scale'); const body = scaleEl.parentElement;
    scaleEl.style.transition = 'none';   // fit() measures + snaps; only the focus zoom animates
    scaleEl.style.transform = 'scale(1)';
    const cw = body.clientWidth, ch = body.clientHeight;
    const sw = scaleEl.scrollWidth, sh = scaleEl.scrollHeight;
    if (!sw || !sh) return;
    const s = Math.min(MAX_FIT, cw / sw, ch / sh);
    scaleEl.style.transform = 'scale(' + s + ')';
    scaleEl.classList.toggle('bk-abbrev', !!forceAbbrev || s < ABBREV_THRESHOLD);
  }

  // ── Team-run zoom: after fit(), magnify the focused team's branch so every opponent name
  // reads on screen — a camera move into their path. Animates on focus change / clear;
  // subsequent re-renders with the same focus re-apply the frame without re-animating.
  var _zoomSig = '', _lastZoomTransform = '';
  var ZOOM_EASE = 'transform .9s cubic-bezier(.22,.9,.24,1)';
  function zoomToPath(scaleEl, pathEls, sigKey) {
    var body = scaleEl.parentElement;
    if (!pathEls.length || !body) { zoomReset(scaleEl); return; }
    var u = null;
    pathEls.forEach(function(m) {
      var r = m.getBoundingClientRect();
      if (!u) u = { l: r.left, t: r.top, r: r.right, b: r.bottom };
      else { u.l = Math.min(u.l, r.left); u.t = Math.min(u.t, r.top); u.r = Math.max(u.r, r.right); u.b = Math.max(u.b, r.bottom); }
    });
    var bd = body.getBoundingClientRect();
    var el0 = scaleEl.getBoundingClientRect();
    // Degenerate geometry (hidden source, control-panel thumb, mid-layout race) — a zoom
    // computed from zero-size rects lands on scale(0) and blanks the scene. Keep fit()'s frame.
    if (bd.width < 80 || bd.height < 80 || el0.width < 10 || (u.r - u.l) < 4 || (u.b - u.t) < 4) { return; }
    var PAD = 46, MAX_ZOOM = 2.2;   // cap so a one-match run doesn't blow up past readable
    var k = Math.max(1, Math.min(MAX_ZOOM,
      (bd.width - PAD * 2) / Math.max(1, u.r - u.l),
      (bd.height - PAD * 2) / Math.max(1, u.b - u.t)));
    var s0 = el0.width / Math.max(1, scaleEl.offsetWidth);   // the scale fit() just applied
    // transform-origin is the element centre: scaling by k keeps the centre S fixed, then the
    // translate (applied after the scale, so in screen pixels) moves the path centre to the
    // viewport centre.
    var S  = { x: el0.left + el0.width / 2,  y: el0.top + el0.height / 2 };
    var Uc = { x: (u.l + u.r) / 2,           y: (u.t + u.b) / 2 };
    var Bc = { x: bd.left + bd.width / 2,    y: bd.top + bd.height / 2 };
    var tx = Bc.x - S.x - (Uc.x - S.x) * k;
    var ty = Bc.y - S.y - (Uc.y - S.y) * k;
    var target = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + (s0 * k).toFixed(4) + ')';
    scaleEl.style.transition = (sigKey !== _zoomSig) ? ZOOM_EASE : 'none';
    _zoomSig = sigKey;
    scaleEl.style.transform = target;
    _lastZoomTransform = target;
    scaleEl.dataset.zoomed = '1';
    // A big bracket fits abbreviated (short tags, no logos) — but zoomed in it may now be
    // comfortably readable, so swap the full names + logos back on. bk-abbrev only switches
    // what displays inside fixed-size slots, so the geometry measured above cannot shift.
    scaleEl.classList.toggle('bk-abbrev', (s0 * k) < ABBREV_THRESHOLD);
  }
  function zoomReset(scaleEl) {
    if (!scaleEl.dataset.zoomed) { _zoomSig = ''; return; }
    delete scaleEl.dataset.zoomed;
    _zoomSig = '';
    // fit() already snapped the transform home this frame (before paint) — replay from the
    // zoomed frame so clearing the focus animates back out instead of jumping.
    var home = scaleEl.style.transform;
    if (_lastZoomTransform) {
      scaleEl.style.transition = 'none';
      scaleEl.style.transform = _lastZoomTransform;
      void scaleEl.offsetWidth;   // commit the zoomed frame before animating home
      scaleEl.style.transition = ZOOM_EASE;
      scaleEl.style.transform = home;
    }
    _lastZoomTransform = '';
  }

  // ?show=1 — always render the live bracket (ignore the on-air visible flag, no demo fallback).
  // Used by the control-panel "Live bracket preview" so producers see the real loaded bracket off-air.
  const FORCE_SHOW = new URLSearchParams(location.search).get('show') === '1';

  // View mode is driven by control-panel state (state.bracket.view / .rounds) so one OBS source
  // updates live as the producer clicks Full / Upper / Lower / Finals stretch. A URL param
  // (?part=winners|losers|both, ?rounds=N) still overrides per-source if you want a fixed scene.
  const _BQ = new URLSearchParams(location.search);
  const URL_PART = _BQ.get('part');       // null unless overridden per source
  const URL_ROUNDS = _BQ.get('rounds');   // null unless overridden per source
  function render(data) {
    const b = data.bracket || {};
    const stage = el('bk-stage'), scaleEl = el('bk-scale'), emptyEl = el('bk-empty');
    stage.classList.add('show');

    const winners = b.winners || [], losers = b.losers || [], finals = b.finals || [], schedule = b.schedule || [];
    const matrix = (b.matrix && b.matrix.teams && b.matrix.teams.length) ? b.matrix : null;

    // Effective view: URL override > state-driven view — but NEVER a view this bracket has no
    // data for (a stale saved "matrix" on an elim bracket used to blank the whole overlay).
    let view = (URL_PART || b.view || 'both').toLowerCase();
    if (view === 'matrix' && !matrix) view = (winners.length || losers.length) ? 'both' : ((b.standings || []).length ? 'standings' : 'both');
    if (view === 'schedule' && !schedule.length) view = (winners.length || losers.length) ? 'both' : ((b.standings || []).length ? 'standings' : 'both');
    if ((view === 'losers' || view === 'lower') && !losers.length) view = 'both';
    const SHOW_W = view !== 'losers' && view !== 'lower';
    const SHOW_L = view !== 'winners' && view !== 'upper';
    let ROUNDS_N = 0;
    if (URL_ROUNDS != null) ROUNDS_N = Math.max(0, parseInt(URL_ROUNDS, 10) || 0);
    else if (view === 'finals') ROUNDS_N = Math.max(1, parseInt(b.rounds, 10) || 4);   // finals stretch
    const _lastN = (arr) => (ROUNDS_N > 0 && arr.length > ROUNDS_N) ? arr.slice(arr.length - ROUNDS_N) : arr;
    // Bracket's own standings table now reads the SAME source the standalone Standings scene
    // does (state.standings — League / start.gg-seed / Manual, whichever the producer picked
    // there) before falling back to the computed round-robin/swiss record table, so producers
    // only have to configure one standings source instead of two disconnected ones.
    const stState = data.standings || {};
    const standings = (stState.rows && stState.rows.length > 0) ? stState.rows : (b.standings || []);
    const phases = b.phases || [];
    const pools = b.pools || [];
    const isElim = winners.length || losers.length || finals.length;
    const hasData = isElim || schedule.length || standings.length || !!matrix;

    const focusTeam = (data.startgg && data.startgg.focusTeam) || '';
    // The on-air pair (Match — Teams / bracket "Go Live" / auto-follow): the set whose teams
    // are currently on the scoreboard gets the LIVE badge — a real signal, unlike scores.
    _livePair = [
      ((data.teams && data.teams.blue && data.teams.blue.name) || '').trim().toUpperCase(),
      ((data.teams && data.teams.orange && data.teams.orange.name) || '').trim().toUpperCase()
    ].filter(Boolean).sort().join('|');
    const sig = JSON.stringify({ t: b.title, sub: b.subtitle, sr: b.showRecord, ty: b.type, w: winners, l: losers, f: finals, sc: schedule, s: standings, mx: matrix,
      ph: phases.map((p) => p.id + p.name), ap: b.activePhaseId, pl: pools.map((p) => p.id + p.name), apl: b.activePoolId,
      lg: logoByName, vw: view, rn: ROUNDS_N, ft: focusTeam, lp: _livePair });
    if (sig === _sig) return;
    _sig = sig;

    document.documentElement.style.setProperty('--accent', SceneBase.brandColor(data));
    document.documentElement.style.setProperty('--accent-2', SceneBase.brandAccent(data));

    el('bk-title').textContent = (b.title || '').toUpperCase();
    el('bk-subtitle').textContent = b.subtitle || '';
    const fmt = el('bk-format'); const ft = fmtType(b.type);
    fmt.textContent = ft; fmt.style.display = (ft && hasData) ? '' : 'none';
    emptyEl.classList.toggle('hidden', !!hasData);

    const ph = el('bk-phases'); ph.innerHTML = '';
    if (phases.length > 1) phases.forEach((p) => {
      const t = document.createElement('div'); t.className = 'bk-phase' + (p.id === b.activePhaseId ? ' active' : '');
      t.textContent = p.name || 'Phase'; ph.appendChild(t);
    });

    scaleEl.innerHTML = '';
    const pillsEl = el('bk-section-pills'); if (pillsEl) pillsEl.innerHTML = '';
    if (isElim) {
      const isDouble = losers.length > 0;
      // Butterfly layout: only when showing both brackets with no round-trim applied.
      const butterfly = SHOW_W && SHOW_L && isDouble && ROUNDS_N === 0;
      // Full view (both brackets, no round-trim) is where team count is highest and start.gg
      // logos are sparsest — badge-abbreviated names read cleaner there than a mix of real
      // logos and empty placeholder boxes, regardless of how small the fitted scale ends up.
      // Partial views (upper/lower/finals-stretch only) have more room per team and keep the
      // normal scale-based logo/abbreviation behavior.
      const fullView = SHOW_W && SHOW_L && ROUNDS_N === 0;
      scaleEl.classList.toggle('butterfly', butterfly);
      scaleEl.classList.toggle('bk-abbrev', fullView);
      stage.classList.toggle('butterfly', butterfly);
      let rendered = false;

      if (butterfly) {
        // WB left (winners only — finals go to center GF piece)
        if (winners.length) {
          scaleEl.appendChild(buildSection('', winners, null, 'winners'));
          if (pillsEl) { const p = document.createElement('span'); p.className = 'bk-spill wb'; p.textContent = 'Winners Bracket'; pillsEl.appendChild(p); }
        }
        // GF center
        if (finals.length) scaleEl.appendChild(buildGF(finals));
        // LB right (reversed via CSS: losers[0] = LB R1 renders far-right, LB Finals near center)
        if (losers.length) {
          scaleEl.appendChild(buildSection('', losers, null, 'losers'));
          if (pillsEl) { const p = document.createElement('span'); p.className = 'bk-spill lb'; p.textContent = 'Losers Bracket'; pillsEl.appendChild(p); }
        }
        rendered = !!(winners.length || finals.length || losers.length);
      } else {
        // Stacked layout (single-elim, or partial views: upper/lower/finals)
        scaleEl.classList.remove('butterfly');
        if (SHOW_W) {
          let winnerCols = winners.concat(finals);
          let wFinalsStart = winners.length;
          if (ROUNDS_N > 0 && winnerCols.length > ROUNDS_N) {
            const cut = winnerCols.length - ROUNDS_N;
            winnerCols = winnerCols.slice(cut);
            wFinalsStart = Math.max(0, winners.length - cut);
          }
          if (winnerCols.length) {
            scaleEl.appendChild(buildSection(isDouble ? 'Winners Bracket' : '', winnerCols, wFinalsStart, 'winners'));
            if (pillsEl && isDouble) { const p = document.createElement('span'); p.className = 'bk-spill wb'; p.textContent = 'Winners Bracket'; pillsEl.appendChild(p); }
            rendered = true;
          }
        }
        if (SHOW_L && isDouble) {
          const loserCols = _lastN(losers);
          if (loserCols.length) {
            scaleEl.appendChild(buildSection('Losers Bracket', loserCols, null, 'losers'));
            if (pillsEl) { const p = document.createElement('span'); p.className = 'bk-spill lb'; p.textContent = 'Losers Bracket'; pillsEl.appendChild(p); }
            rendered = true;
          }
        }
      }
      emptyEl.classList.toggle('hidden', rendered);
    } else if (schedule.length || standings.length || matrix) {
      // Round-robin / Swiss: ?part=schedule (round-by-round pairings only), ?part=standings
      // (record table only), ?part=matrix (Round Robin head-to-head grid only — not offered
      // for Swiss, whose pairings aren't all-play-all); anything else (including the elim-only
      // 'both'/'winners'/'losers' values, which don't apply here) shows schedule+standings
      // stacked, same "both" spirit as elim brackets — matrix is only ever explicit, so an
      // existing single-pool/Swiss event's default view is completely unaffected.
      // ONE section at a time — an elim-only view value ('both' etc.) left over from a linked
      // platform import used to stack schedule + standings together, which read as several
      // overlays rendered on top of each other. Explicit views still show exactly what they say.
      let rrView = view;
      if (!['schedule', 'standings', 'matrix', 'ladder'].includes(rrView)) {
        // Default pool-play view = the records LADDER (teams bucketed by W-L) — reads
        // standings, so swiss renders fully even when only round 1's sets exist yet.
        rrView = standings.some((s) => (s.wins || 0) + (s.losses || 0) > 0) ? 'ladder'
               : (schedule.length ? 'schedule' : (standings.length ? 'standings' : 'matrix'));
      }
      const wantLadder = rrView === 'ladder' && standings.length > 0;
      const wantMatrix = !!matrix && rrView === 'matrix';
      const wantSchedule = schedule.length > 0 && rrView === 'schedule';
      const wantStandings = standings.length > 0 && rrView === 'standings';
      if (wantLadder) scaleEl.appendChild(buildLadder(standings, b.advancesTo));
      if (wantMatrix) scaleEl.appendChild(buildMatrix(matrix));
      if (wantSchedule) scaleEl.appendChild(buildSchedule(schedule));
      if (wantStandings) scaleEl.appendChild(buildStandings(standings, b.showRecord));
      emptyEl.classList.toggle('hidden', wantLadder || wantMatrix || wantSchedule || wantStandings);
    }

    // Connectors are computed in the wrapper's UNSCALED coordinate space, then fit()
    // scales the whole wrapper (SVG included) to the canvas — so draw at scale 1 first.
    requestAnimationFrame(() => {
      scaleEl.style.transform = 'scale(1)';
      // Connectors belong to ELIMINATION bands only (.bk-section wraps those). The schedule
      // view reuses .bk-rounds for its columns — drawing elbows between swiss/RR rounds
      // painted meaningless progression lines all over pool play.
      scaleEl.querySelectorAll('.bk-section .bk-rounds').forEach(drawConnectors);
      fit(isElim && SHOW_W && SHOW_L && ROUNDS_N === 0);
      if (focusTeam) {
        var fn = focusTeam.toLowerCase();
        // Team-run focus: light the team's slot in every match they appear in, mark those
        // matches on-path (everything else recedes — see .bk-focus-mode CSS), then ZOOM the
        // camera into the union of those matches so every opponent name reads on screen.
        scaleEl.classList.add('bk-focus-mode');
        scaleEl.querySelectorAll('.bk-name').forEach(function(nameEl) {
          var slot = nameEl.closest('.bk-slot');
          if (slot) slot.classList.toggle('focused', nameEl.textContent.toLowerCase().includes(fn));
        });
        var pathEls = [];
        scaleEl.querySelectorAll('.bk-match').forEach(function(m) {
          var onPath = Array.prototype.some.call(m.querySelectorAll('.bk-name'), function(n) {
            return n.textContent.toLowerCase().includes(fn);
          });
          m.classList.toggle('on-path', onPath);
          if (onPath) pathEls.push(m);
        });
        // Pool/ladder/schedule views have no .bk-match elements — zoom to the focused
        // slots/rows instead so the camera move works in every bracket view.
        if (!pathEls.length) pathEls = Array.prototype.slice.call(scaleEl.querySelectorAll('.bk-slot.focused, .bk-lad-team.focused'));
        zoomToPath(scaleEl, pathEls, fn + '|' + view + '|' + pathEls.length);
      } else {
        scaleEl.classList.remove('bk-focus-mode');
        scaleEl.querySelectorAll('.bk-slot.focused').forEach(function(s) { s.classList.remove('focused'); });
        scaleEl.querySelectorAll('.bk-match.on-path').forEach(function(m) { m.classList.remove('on-path'); });
        zoomReset(scaleEl);
      }
    });
  }

  function applyState(data) {
    let d = data;
    // In preview, the live full_state (which arrives right after the demo) has no
    // bracket — keep showing the sample instead of letting it blank the scene.
    if (SceneBase.preview) {
      const lb = data.bracket || {};
      // Must match render()'s own hasData check — a Round Robin/Swiss/League-sourced bracket has
      // real content in schedule/matrix, not winners/losers/finals, and was wrongly falling back
      // to the demo bracket here even though real pool-play data existed.
      const has = (lb.winners || []).length || (lb.losers || []).length || (lb.finals || []).length
        || (lb.standings || []).length || (lb.schedule || []).length || !!(lb.matrix && lb.matrix.teams && lb.matrix.teams.length);
      if (!has) {
        const demo = SceneBase.demoState();
        d = Object.assign({}, data, { bracket: demo.bracket,
          startgg: Object.assign({}, data.startgg, { logoMap: (demo.startgg && demo.startgg.logoMap) || {} }) });
      }
    }
    logoByName = {}; abbrevByName = {}; colorByName = {};
    const sgg = (d.startgg && d.startgg.logoMap) || {};
    Object.keys(sgg).forEach((k) => { if (sgg[k]) logoByName[k] = sgg[k]; });
    (d.savedTeams || []).forEach((t) => {
      if (!t || !t.name) return;
      const k = t.name.toLowerCase();
      if (t.logo)  logoByName[k]   = t.logo;
      if (t.abbr)  abbrevByName[k] = t.abbr.toUpperCase().slice(0, 6);
      if (t.color && /^#[0-9a-f]{3,8}$/i.test(t.color)) colorByName[k] = t.color;
    });
    // Fallback: logos carried on the bracket itself (manual builder teams that aren't in the
    // saved-teams library still get a logo). Saved-teams / start.gg take priority above.
    ((d.bracket && d.bracket.teams) || []).forEach((t) => {
      if (!t || !t.name) return;
      const k = t.name.toLowerCase();
      if (t.logo && !logoByName[k]) logoByName[k] = t.logo;
      if (t.abbr && !abbrevByName[k]) abbrevByName[k] = t.abbr.toUpperCase().slice(0, 6);
      if (t.color && !colorByName[k] && /^#[0-9a-f]{3,8}$/i.test(t.color)) colorByName[k] = t.color;
    });
    render(d);
  }

  SceneBase.connect((data) => { SceneBase.applySceneConfig('bracket', data); applyState(data); });
})();
</script>
</body>
</html>
