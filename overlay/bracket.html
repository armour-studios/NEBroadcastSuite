          teamName = teamName || (hitA ? a.name : o.name);
          total++;
          if ((hitA && a.winner) || (hitB && o.winner)) wins++;
          cells.push({ round: round.name || '', set: set });
        });
      });
      return cells;
    }
    function buildBand(label, cells, cls) {
      const band = document.createElement('div'); band.className = 'bk-run-band' + (cls ? ' ' + cls : '');
      const lbl = document.createElement('div'); lbl.className = 'bk-run-band-label'; lbl.textContent = label;
      band.appendChild(lbl);
      const row = document.createElement('div'); row.className = 'bk-run-row';
      cells.forEach(function (c, i) {
        if (i) { const sep = document.createElement('div'); sep.className = 'bk-run-arrow'; sep.textContent = '›'; row.appendChild(sep); }
        const cell = document.createElement('div'); cell.className = 'bk-run-cell';
        const rn = document.createElement('div'); rn.className = 'bk-round-name'; rn.textContent = c.round;
        cell.appendChild(rn);
        cell.appendChild(buildMatch(c.set, cls === 'gf'));
        row.appendChild(cell);
      });
      band.appendChild(row);
      return band;
    }
    const upper = collect(b.winners), lower = collect(b.losers), gf = collect(b.finals);
    if (!total) return null;   // team has no sets in this phase — fall back to the normal bracket
    // Bracket-shaped flow: upper + lower stacked on the LEFT, Grand Finals alone on the FAR
    // RIGHT (vertically centred) — the run reads left→right into GF like the real bracket.
    const main = document.createElement('div'); main.className = 'bk-run-main';
    const head = document.createElement('div'); head.className = 'bk-run-head';
    const tLogo = logoFor(teamName);
    head.innerHTML = (tLogo ? '<img class="bk-run-logo' + (isDark(tLogo) ? ' logo-on-dark' : '') + '" src="' + tLogo + '" alt="">' : '')
      + '<div><div class="bk-run-eyebrow">Tournament Run</div><div class="bk-run-team">' + escRun(teamName) + '</div></div>'
      + '<div class="bk-run-record">' + wins + 'W – ' + (total - wins) + 'L</div>';
    main.appendChild(head);
    const flow = document.createElement('div'); flow.className = 'bk-run-flow';
    const bandsCol = document.createElement('div'); bandsCol.className = 'bk-run-bands';
    if (upper.length) bandsCol.appendChild(buildBand('UPPER BRACKET', upper, ''));
    if (lower.length) bandsCol.appendChild(buildBand('LOWER BRACKET', lower, 'losers'));
    flow.appendChild(bandsCol);
    if (gf.length) {
      const sep = document.createElement('div'); sep.className = 'bk-run-arrow bk-run-arrow-gf'; sep.textContent = '›';
      flow.appendChild(sep);
      flow.appendChild(buildBand('GRAND FINALS', gf, 'gf'));
    }
    main.appendChild(flow);
    const wrap = document.createElement('div'); wrap.className = 'bk-run';
    wrap.appendChild(main);
    const panel = document.createElement('div'); panel.className = 'bk-run-stats';
    panel.innerHTML = '<div class="bk-run-band-label">Players</div><div id="bk-run-stats-rows"></div>';
    wrap.appendChild(panel);
    fillRunProfiles(teamName, data, panel.querySelector('#bk-run-stats-rows'));
    return wrap;
  }

  // `decided` = this match has a winner. Without it every non-winning team was marked '.loser',
  // so BOTH teams in a live or not-yet-played match rendered greyed out — the whole bracket read
  // as "everyone lost" until results came in, and the live match was the most obviously wrong.
  // A team is only dimmed once it has actually been beaten.
  function buildSlot(slot, decided) {
    const s = slot || { name: 'TBD', score: null, winner: false };
    const known = s.name && s.name !== 'TBD';
    const row = document.createElement('div');
    row.className = 'bk-slot' + (s.winner ? ' winner' : (decided && known ? ' loser' : ''));
    const accent = document.createElement('div'); accent.className = 'bk-slot-accent'; row.appendChild(accent);
    const displayName = s.name || 'TBD';
    const shortName = abbrevByName[displayName.toLowerCase()] || abbrev(displayName);
    // Logo, or a monogram standing in for one. The monogram uses the same abbreviation the badge
    // does, capped at two characters, tinted with the team's colour when we know it.
    // Letters/digits only — org names like "PAR | Scend" abbreviate to "P|", and a pipe or dash
    // as half the monogram reads as a glitch rather than initials.
    const phMono = known ? (shortName.replace(/[^\p{L}\p{N}]/gu, '') || shortName).slice(0, 2) : '';
    const phCol = known ? (colorByName[displayName.toLowerCase()] || null) : null;
    const phHtml = '<span class="bk-logo-ph"' + (phCol ? ' style="--ph-col:' + phCol + '"' : '') + '>'
                 + phMono.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>';
    const logo = known ? logoFor(s.name) : null;
    // Crest watermark behind the name. Added first so it paints under everything else in the row.
    if (logo) {
      const wm = document.createElement('div');
      wm.className = 'bk-slot-wm' + (isDark(logo) ? ' wm-on-dark' : '');
      wm.style.backgroundImage = 'url("' + String(logo).replace(/"/g, '&quot;') + '")';
      row.appendChild(wm);
    }
    if (logo) {
      const img = document.createElement('img');
      img.className = 'bk-logo' + (isDark(logo) ? ' logo-on-dark' : '');
      // A logo that fails to load falls back to the same monogram, not a bare box.
      img.src = logo; img.onerror = function () { this.outerHTML = phHtml; };
      row.appendChild(img);
    } else {
      const ph = document.createElement('span');
      ph.className = 'bk-logo-ph';
      if (phCol) ph.style.setProperty('--ph-col', phCol);
      ph.textContent = phMono;
      row.appendChild(ph);
    }
    // Abbrev badge (shown in abbrev mode instead of logo)
    const badge = document.createElement('span'); badge.className = 'bk-logo-badge';
    const badgeColor = known ? (colorByName[displayName.toLowerCase()] || null) : null;
    if (badgeColor) badge.style.setProperty('--badge-col', badgeColor);
    // The badge stands in for the LOGO, so it carries the 2-letter monogram — not the whole
    // abbreviation. It used to print the same string the name does ("FROST" in the tile beside
    // "FROST" in the name), which was both redundant and the reason names ellipsised to "F.." in
    // narrow losers columns: the duplicate tile was eating the width the name needed.
    const badgeText = phMono || shortName.slice(0, 2);
    badge.style.fontSize = (badgeText.length <= 2 ? 13 : 11) + 'px';
    badge.textContent = badgeText;
    row.appendChild(badge);
    const name = document.createElement('div'); name.className = 'bk-name';
    name.innerHTML = '<span class="bk-full">' + displayName.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>'
                   + '<span class="bk-short">' + shortName.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
    const score = document.createElement('div'); score.className = 'bk-score';
    score.textContent = (s.score === null || s.score === undefined) ? '–' : s.score;
    row.appendChild(name); row.appendChild(score);
    return row;
  }

  function buildMatch(set, isFinal) {
    const m = document.createElement('div');
    const a = set.a || {}, b = set.b || {};
    const known = (a.name && a.name !== 'TBD') && (b.name && b.name !== 'TBD');
    const decided = a.winner || b.winner;
    // LIVE = this set's pair is the pair currently on the scoreboard (either order) and it
    // isn't decided yet. The old score-sum heuristic missed 0-0 sets and never turned off
    // when a partially-scored set was abandoned.
    const pair = known
      ? [String(a.name).trim().toUpperCase(), String(b.name).trim().toUpperCase()].sort().join('|')
      : '';
    const inPlay = known && !decided && !!_livePair && pair === _livePair;
    // start.gg state 1 = not started — render slightly muted so a pre-event bracket
    // clearly reads as "scheduled", not "results".
    const upcoming = set.state === 1 && !decided && !inPlay;
    m.className = 'bk-match' + (isFinal ? ' is-final' : '') + (inPlay ? ' live' : '') + (upcoming ? ' upcoming' : '');
    if (set.fromA) { const fa = document.createElement('div'); fa.className = 'bk-origin'; fa.textContent = set.fromA; m.appendChild(fa); }
    m.appendChild(buildSlot(a, decided));
    m.appendChild(buildSlot(b, decided));
    if (set.fromB) { const fb = document.createElement('div'); fb.className = 'bk-origin'; fb.textContent = set.fromB; m.appendChild(fb); }
    if (set.toNext) { const ex = document.createElement('div'); ex.className = 'bk-exit'; ex.textContent = set.toNext; m.appendChild(ex); }
    if (!inPlay) return m;
    // Live match: wrap so the LIVE tag sits ABOVE the card (the card clips with overflow:hidden).
    // The wrapper is transparent to the layout — connectors/on-path/fit all query .bk-match by class.
    const wrap = document.createElement('div');
    wrap.className = 'bk-match-wrap';
    wrap.appendChild(m);
    const tag = document.createElement('div');
    tag.className = 'bk-live-tag';
    tag.textContent = 'LIVE';
    wrap.appendChild(tag);
    return wrap;
  }

  function buildColumn(round, isFinal) {
    const col = document.createElement('div');
    col.className = 'bk-round' + (isFinal ? ' is-final' : '');
    const name = document.createElement('div'); name.className = 'bk-round-name'; name.textContent = round.name || '';
    col.appendChild(name);
    const matches = document.createElement('div'); matches.className = 'bk-matches';
    (round.sets || []).forEach((set) => {
      const node = buildMatch(set, isFinal);
      // Identity + parent links travel with the DOM so both the row layout and the
      // connectors can follow the REAL bracket tree instead of guessing from indexes.
      if (set.id != null) node.dataset.sid = String(set.id);
      if ((set.prereq || []).length) node.dataset.prereq = set.prereq.join(',');
      matches.appendChild(node);
    });
    col.appendChild(matches);
    return col;
  }

  // start.gg mints set ids in bracket-draw order, so sorting a round by id reproduces exactly the
  // order start.gg's own bracket page shows. The server does this too, but doing it here as well
  // means the overlay is right even against bracket data that was imported by an older build.
  // Manual-builder sets carry no id at all — those rounds are left exactly as authored.
  function bkOrderBand(band) {
    return (band || []).map((r) => {
      const sets = r.sets || [];
      if (sets.length < 2 || !sets.every((s) => s && Number.isFinite(Number(s.id)))) return r;
      const sorted = sets.slice().sort((a, x) => Number(a.id) - Number(x.id));
      return Object.assign({}, r, { sets: sorted });
    });
  }

  // ── Tree-accurate vertical layout ────────────────────────────────────────────
  // Evenly spacing each column only works when every round is exactly half the previous
  // one. Real start.gg brackets aren't: byes make Round 1 a 2-set column feeding a 16-set
  // Round 2, and losers drop rounds stay the same width. Spacing those evenly put matches
  // nowhere near their feeders, which reads as teams sitting in the wrong branch.
  //
  // So: pick the widest round as the base grid (rows 0..n-1), carry rows FORWARD as the mean
  // of each set's feeder rows, and BACKWARD as the mean of the rows of the sets it feeds.
  // Every match then sits exactly where start.gg draws it.
  var BK_ROW_H = 62;   // px per bracket row at scale 1; fit() scales the result to the canvas

  function layoutRounds(rounds, colEls) {
    const idx = new Map();     // setId -> [roundIndex, setIndex]
    rounds.forEach((r, ri) => (r.sets || []).forEach((s, si) => { if (s.id != null) idx.set(String(s.id), [ri, si]); }));
    const rows = rounds.map((r) => new Array((r.sets || []).length).fill(null));

    let base = 0;
    rounds.forEach((r, ri) => { if ((r.sets || []).length > (rounds[base].sets || []).length) base = ri; });
    const span = (rounds[base].sets || []).length;
    if (!span) return;
    rows[base] = rounds[base].sets.map((s, i) => i);

    // Any row we couldn't derive (clipped feeders, partial data) gets spread evenly so the
    // column still reads top-to-bottom instead of collapsing onto row 0.
    const fillGaps = (arr) => {
      const n = arr.length;
      if (!n) return;
      if (arr.every((v) => v == null)) { for (let i = 0; i < n; i++) arr[i] = (i + 0.5) * span / n - 0.5; return; }
      for (let i = 0; i < n; i++) {
        if (arr[i] != null) continue;
        let p = i - 1; while (p >= 0 && arr[p] == null) p--;
        let q = i + 1; while (q < n && arr[q] == null) q++;
        if (p >= 0 && q < n) arr[i] = arr[p] + (arr[q] - arr[p]) * (i - p) / (q - p);
        else if (p >= 0) arr[i] = arr[p] + (i - p);
        else arr[i] = arr[q] - (q - i);
      }
    };

    // Two sets in one column can average to the SAME row when their feeders come from different
    // bands — a GSL group's Lower QF takes one feeder from the winners side and one from the lower
    // side, and both matches landed on the identical row and drew on top of each other. Real
    // elimination rounds are already >=1 apart, so for those this is a no-op.
    const separate = (arr) => {
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] != null && arr[i - 1] != null && arr[i] < arr[i - 1] + 1) arr[i] = arr[i - 1] + 1;
      }
    };
    const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    for (let ri = base + 1; ri < rounds.length; ri++) {
      rounds[ri].sets.forEach((s, i) => {
        const fr = (s.prereq || []).map((id) => idx.get(String(id)))
          .filter((p) => p && p[0] < ri && rows[p[0]][p[1]] != null).map((p) => rows[p[0]][p[1]]);
        rows[ri][i] = fr.length ? mean(fr) : null;
      });
      fillGaps(rows[ri]);
      separate(rows[ri]);
    }
    for (let ri = base - 1; ri >= 0; ri--) {
      const kids = new Map();
      for (let rj = ri + 1; rj < rounds.length; rj++) {
        rounds[rj].sets.forEach((s, i) => (s.prereq || []).forEach((p) => {
          if (rows[rj][i] == null) return;
          const k = String(p);
          if (!kids.has(k)) kids.set(k, []);
          kids.get(k).push(rows[rj][i]);
        }));
      }
      rounds[ri].sets.forEach((s, i) => {
        const c = s.id != null ? kids.get(String(s.id)) : null;
        rows[ri][i] = (c && c.length) ? mean(c) : null;
      });
      fillGaps(rows[ri]);
      separate(rows[ri]);
    }

    const lo = Math.min.apply(null, rows.map((r) => Math.min.apply(null, r.length ? r : [0])));
    const hi = Math.max.apply(null, rows.map((r) => Math.max.apply(null, r.length ? r : [0])));
    colEls.forEach((col, ri) => {
      const wrap = col.querySelector('.bk-matches');
      if (!wrap) return;
      wrap.classList.add('bk-matches-abs');
      wrap.dataset.bkRows = String(hi - lo + 1);
      Array.prototype.slice.call(wrap.children).forEach((node, i) => {
        const row = rows[ri][i];
        if (row != null) node.dataset.bkRow = String(row - lo);
      });
    });
  }

  // Rows are laid out in units; the pixel height of a unit can only be known once the cards are
  // in the document (a card grows with origin/exit pills, and the live card wears a LIVE tag).
  // One row height per SECTION so every column of a bracket stays on the same grid.
  function applyRowGeometry(root) {
    root.querySelectorAll('.bk-section').forEach((sec) => {
      const wraps = Array.prototype.slice.call(sec.querySelectorAll('.bk-matches-abs'));
      if (!wraps.length) return;
      let tallest = 0;
      sec.querySelectorAll('.bk-match').forEach((m) => { tallest = Math.max(tallest, m.offsetHeight); });
      const rowH = Math.max(BK_ROW_H, tallest + 10);
      wraps.forEach((wrap) => {
        const rows = Number(wrap.dataset.bkRows) || 1;
        wrap.style.height = (rows * rowH) + 'px';
        Array.prototype.slice.call(wrap.children).forEach((node) => {
          const row = Number(node.dataset.bkRow);
          if (Number.isFinite(row)) node.style.top = ((row + 0.5) * rowH) + 'px';
        });
      });
    });
  }

  // Grand Finals center piece for butterfly layout.
  function buildGF(finals) {
    const wrap = document.createElement('div');
    wrap.className = 'bk-gf';
    const lbl = document.createElement('div'); lbl.className = 'bk-gf-label'; lbl.textContent = 'Grand Finals';
    wrap.appendChild(lbl);
    finals.forEach(function(round) {
      (round.sets || []).forEach(function(set) { wrap.appendChild(buildMatch(set, true)); });
    });
    return wrap;
  }

  // Section = label + a horizontal band of round columns + an SVG connector layer.
  function buildSection(label, rounds, finalsStart, sectionClass) {
    const section = document.createElement('div');
    section.className = 'bk-section' + (sectionClass ? ' ' + sectionClass : '');
    if (label) { const l = document.createElement('div'); l.className = 'bk-section-label'; l.textContent = label; section.appendChild(l); }
    const band = document.createElement('div'); band.className = 'bk-rounds';
    const svg = document.createElementNS(SVGNS, 'svg'); svg.setAttribute('class', 'bk-connectors'); band.appendChild(svg);
    const cols = rounds.map((r, i) => buildColumn(r, finalsStart != null && i >= finalsStart));
    cols.forEach((c) => band.appendChild(c));
    layoutRounds(rounds, cols);
    section.appendChild(band);
    return section;
  }

  // Elbow connectors between adjacent round columns of one .bk-rounds band.
  // In the reversed losers bracket the flex order is right-to-left, so connection
  // points swap: parent left-edge → child right-edge instead of parent right → child left.
  function drawConnectors(band) {
    const svg = band.querySelector('.bk-connectors'); if (!svg) return;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const base = band.getBoundingClientRect();
    if (!base.width) return;
    svg.setAttribute('width', base.width); svg.setAttribute('height', base.height);
    svg.setAttribute('viewBox', '0 0 ' + base.width + ' ' + base.height);
    const isRev = getComputedStyle(band).flexDirection === 'row-reverse';
    const rectOf = (node) => (node.querySelector('.bk-match') || node).getBoundingClientRect();
    const elbow = (pr, cr) => {
      const px = (isRev ? pr.left : pr.right) - base.left;
      const py = pr.top - base.top + pr.height / 2;
      const cx = (isRev ? cr.right : cr.left) - base.left;
      const cy = cr.top - base.top + cr.height / 2;
      const midX = px + (cx - px) / 2;
      const path = document.createElementNS(SVGNS, 'path');
      path.setAttribute('d', 'M ' + px + ' ' + py + ' H ' + midX + ' V ' + cy + ' H ' + cx);
      svg.appendChild(path);
    };

    // Exact links: every set carries the ids of the sets that feed it, so draw the real tree.
    const byId = new Map();
    band.querySelectorAll('[data-sid]').forEach((n) => byId.set(n.dataset.sid, n));
    let drewExact = false;
    band.querySelectorAll('[data-prereq]').forEach((child) => {
      const cr = rectOf(child);
      child.dataset.prereq.split(',').forEach((pid) => {
        const p = byId.get(pid);
        if (!p || p === child) return;
        elbow(rectOf(p), cr);
        drewExact = true;
      });
    });
    if (drewExact) return;

    // Fallback (manual brackets with no set ids): pair adjacent columns by index.
    const cols = Array.prototype.slice.call(band.querySelectorAll('.bk-round'));
    for (let c = 1; c < cols.length; c++) {
      const parents = Array.prototype.slice.call(cols[c - 1].querySelectorAll('.bk-match'));
      const children = Array.prototype.slice.call(cols[c].querySelectorAll('.bk-match'));
      if (!parents.length || !children.length) continue;
      children.forEach((child, j) => {
        const cr = child.getBoundingClientRect();
        const cx = (isRev ? cr.right : cr.left) - base.left;
        const cy = cr.top - base.top + cr.height / 2;
        let feeders;
        if (parents.length >= children.length * 2 - 1) feeders = [parents[2 * j], parents[2 * j + 1]];
        else if (parents.length === children.length) feeders = [parents[j]];
        else feeders = [parents[Math.min(parents.length - 1, Math.round(j * parents.length / children.length))]];
        feeders.filter(Boolean).forEach((p) => {
          const pr = p.getBoundingClientRect();
          const px = (isRev ? pr.left : pr.right) - base.left;
          const py = pr.top - base.top + pr.height / 2;
          const midX = px + (cx - px) / 2;
          const path = document.createElementNS(SVGNS, 'path');
          path.setAttribute('d', 'M ' + px + ' ' + py + ' H ' + midX + ' V ' + cy + ' H ' + cx);
          svg.appendChild(path);
        });
      });
    }
  }

  function buildStandings(standings, showRecord) {
    const wrap = document.createElement('div'); wrap.className = 'bk-standings';
    // Round Robin/Swiss rows carry extra stat fields (Sets Played, Game Wins-Losses) that
    // Start.gg's own standings tables show — elimination-bracket rows never have them, so
    // this stays a plain W/L table there (zero visual change for the far more common case).
    const enriched = standings.some((s) => s.setsTotal != null);
    wrap.classList.toggle('enriched', enriched);
    wrap.classList.toggle('norecord', showRecord === false);
    // "SET" group label above W/L — start.gg's own terminology for a match (a Bo3/Bo5 is one
    // Set of individual Games), disambiguating the W/L pair from the Games column when present.
    const head = document.createElement('div'); head.className = 'bk-st-row bk-st-head';
    head.innerHTML = '<div class="bk-st-rank">#</div><div>Team</div>'
      + (showRecord === false ? '' : '<div style="text-align:center"><span class="bk-st-grouplbl">Set</span>W</div><div style="text-align:center"><span class="bk-st-grouplbl">Set</span>L</div>')
      + (enriched ? '<div style="text-align:center">Played</div><div style="text-align:center">Games</div>' : '')
      + (showRecord === false ? '' : '<div style="text-align:center">Win %</div>');
    wrap.appendChild(head);
    standings.forEach((s, i) => {
      const total = (s.wins || 0) + (s.losses || 0);
      const pct = total ? Math.round((s.wins / total) * 100) : 0;
      // played === false → the event hasn't produced a result for this team yet: no rank
      // number and no medal tint, so a pre-event table doesn't imply real placements.
      const noResult = s.played === false && total === 0;
      const row = document.createElement('div'); row.className = 'bk-st-row' + (!noResult && i < 3 ? ' r' + (i + 1) : '');
      const rank = document.createElement('div'); rank.className = 'bk-st-rank'; rank.textContent = noResult ? '–' : s.placement;
      const team = document.createElement('div'); team.className = 'bk-st-team';
      const logo = logoFor(s.name);
      if (logo) { const img = document.createElement('img'); img.className = 'bk-st-logo' + (isDark(logo) ? ' logo-on-dark' : ''); img.src = logo; img.onerror = function () { this.style.display = 'none'; }; team.appendChild(img); }
      const nm = document.createElement('div'); nm.className = 'bk-st-name'; nm.textContent = s.name; team.appendChild(nm);
      row.appendChild(rank); row.appendChild(team);
      if (showRecord !== false) {
        const w = document.createElement('div'); w.className = 'bk-st-rec bk-st-w'; w.textContent = s.wins;
        const l = document.createElement('div'); l.className = 'bk-st-rec bk-st-l'; l.textContent = s.losses;
        row.appendChild(w); row.appendChild(l);
      }
      if (enriched) {
        const played = document.createElement('div'); played.className = 'bk-st-extra';
        played.textContent = (s.setsPlayed || 0) + '/' + (s.setsTotal || 0);
        const games = document.createElement('div'); games.className = 'bk-st-extra';
        games.textContent = (s.gameWins || 0) + '-' + (s.gameLosses || 0);
        row.appendChild(played); row.appendChild(games);
      }
      if (showRecord !== false) {
        const bar = document.createElement('div'); bar.className = 'bk-st-bar'; bar.innerHTML = '<span style="width:' + pct + '%"></span>';
        row.appendChild(bar);
      }
      wrap.appendChild(row);
    });
    return wrap;
  }

  // Head-to-head grid for Round Robin pools — rows/columns are both team names, each
  // cell is that pairing's result. Matches how Start.gg itself presents Pool Play.
  function buildMatrix(matrix, compact) {
    const teams = (matrix && matrix.teams) || [];
    const cells = (matrix && matrix.cells) || {};
    const wrap = document.createElement('div'); wrap.className = 'bk-matrix';
    const table = document.createElement('div'); table.className = 'bk-mx-table';
    table.style.gridTemplateColumns = compact
      ? '74px repeat(' + teams.length + ', minmax(30px, 1fr))'
      : '220px repeat(' + teams.length + ', minmax(64px, 1fr))';
    const corner = document.createElement('div'); corner.className = 'bk-mx-cell bk-mx-corner'; table.appendChild(corner);
    teams.forEach((t) => {
      const h = document.createElement('div'); h.className = 'bk-mx-cell bk-mx-head';
      const short = abbrevByName[t.name.toLowerCase()] || abbrev(t.name);
      h.textContent = short; h.title = t.name;
      table.appendChild(h);
    });
    teams.forEach((rowTeam) => {
      const rh = document.createElement('div'); rh.className = 'bk-mx-cell bk-mx-head bk-mx-rowhead';
      const logo = logoFor(rowTeam.name);
      if (logo) { const img = document.createElement('img'); img.className = 'bk-mx-logo' + (isDark(logo) ? ' logo-on-dark' : ''); img.src = logo; img.onerror = function () { this.style.display = 'none'; }; rh.appendChild(img); }
      const nm = document.createElement('span');
      nm.textContent = compact ? (abbrevByName[rowTeam.name.toLowerCase()] || abbrev(rowTeam.name)) : rowTeam.name;
      rh.title = rowTeam.name;
      rh.appendChild(nm);
      table.appendChild(rh);
      teams.forEach((colTeam) => {
        const cell = document.createElement('div'); cell.className = 'bk-mx-cell';
        if (colTeam.id === rowTeam.id) {
          cell.classList.add('bk-mx-diag');
        } else {
          const c = cells[rowTeam.id + '_' + colTeam.id];
          if (c && c.played) {
            cell.classList.add('bk-mx-played', c.winner === 'a' ? 'win' : (c.winner === 'b' ? 'loss' : ''));
            cell.textContent = (c.aScore == null ? '-' : c.aScore) + '-' + (c.bScore == null ? '-' : c.bScore);
          } else {
            cell.classList.add('bk-mx-unplayed');
            cell.textContent = '–';
          }
        }
        table.appendChild(cell);
      });
    });
    wrap.appendChild(table);
    return wrap;
  }

  // Manually-built schedules (Bracket Builder) don't stamp an explicit a.winner/b.winner flag the
  // way start.gg-derived sets do — infer one from the scores so buildMatch/buildSlot's win/live
  // styling (and the "LIVE" badge) still work correctly for those too.
  function withInferredWinners(schedule) {
    return (schedule || []).map((r) => ({
      ...r,
      sets: (r.sets || []).map((set) => {
        const a = set.a || {}, b = set.b || {};
        if (a.winner || b.winner) return set;   // already explicit
        const bothKnown = a.name && a.name !== 'TBD' && b.name && b.name !== 'TBD';
        const bothScored = a.score != null && b.score != null;
        if (bothKnown && bothScored && a.score !== b.score) {
          return { a: { ...a, winner: a.score > b.score }, b: { ...b, winner: b.score > a.score } };
        }
        return set;
      })
    }));
  }

  // Swiss / RR records ladder — teams bucketed by W-L record, best bucket left. Reads
  // STANDINGS (not sets), so it renders correctly from round 1 even though start.gg only
  // creates later swiss rounds once pairings exist. Undefeated buckets read as qualified-
  // green once a team can no longer be caught? No — colour is purely by record sign:
  // all-wins bucket green, all-losses bucket red, mixed neutral.
  function buildLadder(standings, advancesTo) {
    const wrap = document.createElement('div'); wrap.className = 'bk-ladder';
    const buckets = new Map();
    (standings || []).forEach((s) => {
      const w = s.wins || 0, l = s.losses || 0;
      if (s.played === false && !w && !l) return;   // pre-event rows: no bucket
      const key = w + '-' + l;
      if (!buckets.has(key)) buckets.set(key, { w, l, teams: [] });
      buckets.get(key).teams.push(s);
    });
    const ordered = [...buckets.values()].sort((a, b) => (b.w - b.l) - (a.w - a.l) || b.w - a.w);
    ordered.forEach((bk) => {
      const col = document.createElement('div');
      col.className = 'bk-lad-bucket' + (bk.l === 0 && bk.w > 0 ? ' qualified' : (bk.w === 0 && bk.l > 0 ? ' eliminated' : ''));
      const head = document.createElement('div'); head.className = 'bk-lad-head'; head.textContent = bk.w + ' – ' + bk.l;
      col.appendChild(head);
      bk.teams.forEach((s) => {
        const t = document.createElement('div'); t.className = 'bk-lad-team';
        const color = colorByName[(s.name || '').toLowerCase()];
        if (color) t.style.setProperty('--team-c', color);
        const logo = logoFor(s.name);
        if (logo) { const img = document.createElement('img'); img.className = 'bk-lad-logo' + (isDark(logo) ? ' logo-on-dark' : ''); img.src = logo; img.onerror = function () { this.style.display = 'none'; }; t.appendChild(img); }
        const nm = document.createElement('div'); nm.className = 'bk-lad-name bk-name'; nm.textContent = s.name || 'TBD';
        t.appendChild(nm);
        col.appendChild(t);
      });
      wrap.appendChild(col);
    });
    if (advancesTo) {
      const outer = document.createElement('div');
      outer.style.cssText = 'display:flex; flex-direction:column; gap:16px; width:100%;';
      const note = document.createElement('div');
      note.className = 'bk-lad-note';
      note.textContent = 'Qualifiers advance to ' + advancesTo;
      outer.appendChild(wrap); outer.appendChild(note);
      return outer;
    }
    return wrap;
  }

  // Is this schedule a SWISS stage? The bracket TYPE cannot answer it: start.gg reports a
  // real-world swiss phase as CUSTOM_SCHEDULE (RLCS runs swiss that way, because start.gg's
  // native swiss is limited), so `type === 'SWISS'` was false for the very events this chart
  // exists to draw — and they fell through to a standings table instead.
  //
  // Shape answers it. In swiss, round 2 involves essentially EVERYONE again (you keep playing
  // after a loss); in any elimination flow round 2 involves about half the field. Measured on
  // real data: swiss 16 -> 16 teams (1.0), hybrid elimination 8 -> 4 (0.5).
  function looksSwiss(schedule, type) {
    const t = String(type || '').toUpperCase();
    if (t === 'SWISS') return true;
    if (t === 'ROUND_ROBIN' || t === 'SINGLE_ELIMINATION' || t === 'DOUBLE_ELIMINATION') return false;
    const rounds = (schedule || []).filter((r) => (r.sets || []).length);
    if (rounds.length < 2) return false;
    const teamsIn = (r) => {
      const s = new Set();
      (r.sets || []).forEach((x) => [x.a, x.b].forEach((sl) => {
        if (sl && sl.name && sl.name !== 'TBD') s.add(bkNorm(sl.name));
      }));
      return s.size;
    };
    const r1 = teamsIn(rounds[0]), r2 = teamsIn(rounds[1]);
    if (!r1 || !r2) return false;
    return (r2 / r1) >= 0.8;
  }

  // ── Swiss stage flow ───────────────────────────────────────────────────────
  // The broadcast-standard swiss chart: one column per round, and inside each column the
  // matches are grouped by the W-L record BOTH teams carried into that round (0-0, then
  // 1-0 / 0-1, then 2-0 / 1-1 / 0-2 …). Records are derived from the schedule itself rather
  // than the standings table so the buckets always agree with the matches drawn beside them.
  function swissFlow(schedule) {
    const rounds = withInferredWinners(schedule);
    const rec = new Map();   // normalised name → running record
    const recOf = (name) => {
      const k = bkNorm(name);
      if (!rec.has(k)) rec.set(k, { name, w: 0, l: 0 });
      return rec.get(k);
    };
    const named = (sl) => sl && sl.name && sl.name !== 'TBD';
    const cols = rounds.map((r) => {
      const groups = new Map();
      (r.sets || []).forEach((set) => {
        const a = set.a || {}, b = set.b || {};
        // True swiss pairs equal records. A hand-made pairing can cross buckets — name the
        // group after the better record so the set still lands somewhere instead of vanishing.
        const ra = named(a) ? recOf(a.name) : null;
        const rb = named(b) ? recOf(b.name) : null;
        const pick = !ra ? rb : !rb ? ra : ((ra.w - ra.l) >= (rb.w - rb.l) ? ra : rb);
        const w = pick ? pick.w : 0, l = pick ? pick.l : 0;
        const key = w + '-' + l;
        if (!groups.has(key)) groups.set(key, { w, l, sets: [] });
        groups.get(key).sets.push(set);
      });
      // Results are applied only AFTER this round is bucketed — a round must be grouped by the
      // records teams brought in, not the ones they leave with.
      (r.sets || []).forEach((set) => {
        const a = set.a || {}, b = set.b || {};
        if (!named(a) || !named(b)) return;
        if (a.winner) { recOf(a.name).w++; recOf(b.name).l++; }
        else if (b.winner) { recOf(b.name).w++; recOf(a.name).l++; }
      });
      return {
        name: r.name,
        buckets: [...groups.values()].sort((x, y) => (y.w - y.l) - (x.w - x.l) || y.w - x.w)
      };
    });
    return { cols, records: [...rec.values()], roundCount: rounds.length };
  }

  function buildSwissStage(schedule, advanceWins, eliminateLosses, advancesTo, noColor) {
    const flow = swissFlow(schedule);
    // Default thresholds follow the standard swiss shape: a best-of-(rounds) stage qualifies at
    // ceil((rounds+1)/2) wins and eliminates at the same number of losses (5 rounds → 3/3).
    const auto = Math.max(1, Math.ceil((flow.roundCount + 1) / 2));
    const adv = advanceWins > 0 ? advanceWins : auto;
    const elim = eliminateLosses > 0 ? eliminateLosses : auto;

    const wrap = document.createElement('div'); wrap.className = 'bk-swiss' + (noColor ? ' bk-nocolor' : '');
    const board = document.createElement('div'); board.className = 'bk-sw-board';

    flow.cols.forEach((col) => {
      // A round with no pairings yet (start.gg creates swiss sets lazily) would render as an
      // empty column with a header — drop it rather than pad the chart with nothing.
      if (!col.buckets.length) return;
      const c = document.createElement('div'); c.className = 'bk-sw-round';
      const nm = document.createElement('div'); nm.className = 'bk-sw-round-name'; nm.textContent = col.name || '';
      c.appendChild(nm);
      const bs = document.createElement('div'); bs.className = 'bk-sw-buckets';
      col.buckets.forEach((bk) => {
        // >= not ===: a bucket can sit past the line when a stage runs extra rounds or the
        // producer set the thresholds by hand, and those buckets are exactly the ones that most
        // need the colour. Everything not on a line is the amber mid-pack.
        // Colour by TRACK, the way broadcast swiss charts do it: the undefeated run is green,
        // anything already carrying elimination-range losses is red, the pack between them is
        // amber, and the opening 0-0 round is neutral because nothing is at stake in it yet.
        // Colouring by "exactly one win from the line" instead left almost everything unlit
        // until the final round and painted the whole early chart one flat colour.
        const onWinTrack = bk.l === 0 && bk.w > 0;
        const onElimTrack = bk.l >= elim - 1;
        const isDecider = bk.w >= adv - 1 && bk.l >= elim - 1;
        const b = document.createElement('div');
        b.className = 'bk-sw-bucket ' + (isDecider ? 'decider' : onElimTrack ? 'elim'
          : onWinTrack ? 'adv' : (bk.w === 0 && bk.l === 0) ? 'neutral' : 'mid');
        const head = document.createElement('div'); head.className = 'bk-sw-bhead';
        head.appendChild(document.createTextNode(bk.w + '\u2013' + bk.l));
        // Spell out what is actually at stake — the whole reason a swiss chart beats a table.
        // Exactly ON the line, not past it: a bucket that has already reached the qualify mark is
        // not playing "to qualify", and labelling it so is simply wrong.
        const winOut = bk.w === adv - 1, loseOut = bk.l === elim - 1;
        const note = winOut && loseOut ? 'ADVANCE / ELIMINATE' : winOut ? 'TO QUALIFY' : loseOut ? 'TO ELIMINATE' : '';
        if (note) { const n = document.createElement('span'); n.className = 'bk-sw-bnote'; n.textContent = note; head.appendChild(n); }
        b.appendChild(head);
        const ms = document.createElement('div'); ms.className = 'bk-sw-matches';
        bk.sets.forEach((set) => ms.appendChild(buildMatch(set, false)));
        b.appendChild(ms);
        bs.appendChild(b);
      });
      c.appendChild(bs);
      board.appendChild(c);
    });

    const outTeam = (t) => {
      const row = document.createElement('div'); row.className = 'bk-lad-team';
      const color = colorByName[(t.name || '').toLowerCase()];
      if (color) row.style.setProperty('--team-c', color);
      const logo = logoFor(t.name);
      if (logo) {
        const img = document.createElement('img'); img.className = 'bk-lad-logo' + (isDark(logo) ? ' logo-on-dark' : '');
        img.src = logo; img.onerror = function () { this.style.display = 'none'; };
        row.appendChild(img);
      }
      const nm = document.createElement('div'); nm.className = 'bk-lad-name bk-name'; nm.textContent = t.name || 'TBD';
      row.appendChild(nm);
      const rc = document.createElement('div'); rc.className = 'bk-sw-rec'; rc.textContent = t.w + '\u2013' + t.l;
      row.appendChild(rc);
      return row;
    };
    const qualified = flow.records.filter((t) => t.w >= adv).sort((a, b) => a.l - b.l || b.w - a.w);
    const eliminated = flow.records.filter((t) => t.l >= elim).sort((a, b) => b.w - a.w || a.l - b.l);
    if (qualified.length || eliminated.length) {
      const rail = document.createElement('div'); rail.className = 'bk-sw-outcome';
      [['qualified', 'Qualified', qualified], ['eliminated', 'Eliminated', eliminated]].forEach(([cls, label, list]) => {
        if (!list.length) return;
        const panel = document.createElement('div'); panel.className = 'bk-sw-out ' + cls;
        const h = document.createElement('div'); h.className = 'bk-sw-out-head';
        h.textContent = cls === 'qualified' && advancesTo ? label + ' \u2192 ' + advancesTo : label;
        panel.appendChild(h);
        list.forEach((t) => panel.appendChild(outTeam(t)));
        rail.appendChild(panel);
      });
      board.appendChild(rail);
    }
    wrap.appendChild(board);

    const legend = document.createElement('div'); legend.className = 'bk-sw-legend';
    legend.textContent = [
      flow.records.length ? flow.records.length + ' TEAMS' : '',
      adv + (adv === 1 ? ' WIN QUALIFIES' : ' WINS QUALIFY'),
      elim + (elim === 1 ? ' LOSS ELIMINATES' : ' LOSSES ELIMINATE')
    ].filter(Boolean).join(' \u00b7 ');
    wrap.appendChild(legend);
    return wrap;
  }

  // ── Group pairings (pre-show fixtures) ─────────────────────────────────────
  // Which matches belong on a fixtures card: the round that is ABOUT to be played. For each pool
  // that's its first round still holding an undecided set, falling back to its opening round once
  // everything is done (so the card still reads after the fact rather than going blank).
  function pairingRound(bands) {
    const rounds = [].concat.apply([], (bands || []).map((b) => b || []))
      .filter((r) => r && (r.sets || []).length);
    if (!rounds.length) return null;
    const undecided = (r) => (r.sets || []).some((s) => !(s.a && s.a.winner) && !(s.b && s.b.winner));
    return rounds.find(undecided) || rounds[0];
  }

  function buildPairings(groups) {
    const wrap = document.createElement('div');
    const n = groups.length;
    // Stack up to two groups in ONE column. Side by side they make a wide, short block that
    // fit() can barely magnify on a 16:9 canvas (~1.07x); stacked they are tall and narrow and
    // reach ~1.6x, which is also how the broadcast reference lays this card out.
    wrap.className = 'bk-pair cols-' + (n <= 2 ? 1 : n <= 6 ? 2 : 3);
    groups.forEach((g) => {
      const card = document.createElement('div'); card.className = 'bk-pg';
      // Group header bar only when there is MORE THAN ONE group (pools). A single elimination round
      // was just repeating the round name the main title already implies — dropped.
      if (n > 1) {
        const head = document.createElement('div'); head.className = 'bk-pg-head';
        head.appendChild(document.createTextNode((g.name || 'Group').toUpperCase()));
        if (g.roundName) {
          const w = document.createElement('span'); w.className = 'bk-pg-when';
          w.textContent = String(g.roundName).toUpperCase(); head.appendChild(w);
        }
        card.appendChild(head);
      }
      // Per-fixture stream assignment (channel + platform + live + scheduled time) from start.gg.
      const streamOf = (set) => {
        const a = bkNorm(set.a && set.a.name), b = bkNorm(set.b && set.b.name);
        if (!a || !b) return null;
        return pairStreamIdx[[a, b].sort().join('|')] || null;
      };
      const rows = document.createElement('div'); rows.className = 'bk-pg-rows';
      (g.sets || []).forEach((set) => {
        const si = streamOf(set);
        const rowWrap = document.createElement('div'); rowWrap.className = 'bk-pr-wrap';

        // Meta row above the fixture: LIVE badge + the scheduled start time. (The channel moved
        // into the centre box, under the VS.)
        const when = si ? fmtWhen(si.date, si.time) : '';
        if ((si && si.live) || when) {
          const meta = document.createElement('div'); meta.className = 'bk-pr-meta';
          if (si && si.live) {
            const badge = document.createElement('div'); badge.className = 'bk-pr-onair live';
            const dot = document.createElement('span'); dot.className = 'pdot'; badge.appendChild(dot);
            badge.appendChild(document.createTextNode('LIVE')); meta.appendChild(badge);
          }
          if (when) { const dt = document.createElement('span'); dt.className = 'bk-pr-when'; dt.textContent = when; meta.appendChild(dt); }
          rowWrap.appendChild(meta);
        }

        const row = document.createElement('div'); row.className = 'bk-pr';
        // One team side: colour wash (via --col-*-rgb) + logo/monogram + name.
        const side = (slot, sideCls) => {
          const nm = (slot && slot.name) || 'TBD';
          const known = nm && nm !== 'TBD';
          const el2 = document.createElement('div'); el2.className = 'bk-pr-side ' + sideCls;
          const rgb = known ? hexRgb(colorByName[nm.toLowerCase()]) : null;
          if (rgb) el2.style.setProperty(sideCls === 'a' ? '--col-a-rgb' : '--col-b-rgb', rgb);
          const logo = known ? logoFor(nm) : null;
          // Big faint team-logo watermark behind the side.
          if (logo) { const wm = document.createElement('div'); wm.className = 'bk-pr-wm'; wm.style.backgroundImage = `url("${logo}")`; el2.appendChild(wm); }
          let badge;
          if (logo) {
            badge = document.createElement('img'); badge.className = 'bk-pr-logo' + (isDark(logo) ? ' logo-on-dark' : '');
            badge.src = logo; badge.onerror = function () { this.style.visibility = 'hidden'; };
          } else {
            badge = document.createElement('span'); badge.className = 'bk-pr-ph';
            const short = abbrevByName[nm.toLowerCase()] || abbrev(nm);
            badge.textContent = known ? (short.replace(/[^\p{L}\p{N}]/gu, '') || short).slice(0, 2) : '';
            const col = known ? colorByName[nm.toLowerCase()] : null; if (col) badge.style.setProperty('--ph-col', col);
          }
          const name = document.createElement('span'); name.className = 'bk-pr-name'; name.textContent = nm;
          // Left: logo then name; right: name then logo (mirrored).
          if (sideCls === 'a') { el2.appendChild(badge); el2.appendChild(name); }
          else { el2.appendChild(name); el2.appendChild(badge); }
          return el2;
        };
        const center = document.createElement('div'); center.className = 'bk-pr-center';
        const vs = document.createElement('div'); vs.className = 'bk-pr-vs'; vs.textContent = 'VS'; center.appendChild(vs);
        // Channel + platform logo under the VS.
        if (si && si.stream) {
          const m = platMeta(si.platform, si.stream);
          const cs = document.createElement('div'); cs.className = 'bk-pr-cstream ' + m.cls;
          const ic = document.createElement('span'); ic.className = 'bk-pr-icon'; ic.innerHTML = m.icon; cs.appendChild(ic);
          const nm = document.createElement('span'); nm.className = 'bk-pr-chname'; nm.textContent = si.stream; cs.appendChild(nm);
          center.appendChild(cs);
        }
        row.appendChild(side(set.a, 'a')); row.appendChild(center); row.appendChild(side(set.b, 'b'));
        rowWrap.appendChild(row);
        rows.appendChild(rowWrap);
      });
      card.appendChild(rows);
      wrap.appendChild(card);
    });
    return wrap;
  }

  // ── GSL groups ─────────────────────────────────────────────────────────────
  // A GSL group is a 4-team double elim, always the same five matches. We read the shape off the
  // bracket arrays rather than trusting a phase NAME: "GSL Stage" is just what a TO happened to
  // call it, and plenty of GSL groups are named something else entirely.
  //   winners[0] = the two opening matches, winners[1] = Winners' Match,
  //   losers[0]  = Elimination Match,       finals[0]  = Decider.
  // GSL comes in two sizes and the 8-team one is what real events actually run (measured against
  // a live RLCS-shape event: 2 pools of 8, Winners QF 4 / Winners SF 2 / Losers R1 2 / Losers QF 2).
  // Hardcoding the 4-team shape meant those pools failed the test and fell back to an anonymous
  // generic bracket. So: accept any SMALL double-elim pool and name its rounds by position.
  //   4 teams: Opening Match x2 -> Winners' Match / Elimination Match -> Decider
  //   8 teams: Upper QF -> Upper SF -> (Upper Final) / Lower rounds -> Decider
  var GSL_MAX_TEAMS = 8;
  function gslShape(b) {
    const w = (b.winners || []).filter((r) => (r.sets || []).length);
    const l = (b.losers || []).filter((r) => (r.sets || []).length);
    const f = (b.finals || []).filter((r) => (r.sets || []).length);
    if (!w.length) return null;
    const names = new Set();
    let total = 0;
    w.concat(l, f).forEach((r) => (r.sets || []).forEach((s) => {
      total++;
      [s.a, s.b].forEach((x) => { if (x && x.name && x.name !== 'TBD') names.add(bkNorm(x.name)); });
    }));
    // A group is small by definition. Anything bigger is a real bracket and belongs on the
    // bracket path, where the tree layout and connectors do a better job than a group card.
    // 16 sets, not 14: a COMPLETE 8-team group is 13 (WQF 4 + WSF 2 + WF 1 + LR1 2 + LQF 2 +
    // LSF 1 + LF 1), which left almost no margin and would have rejected any group carrying a
    // tiebreak or reset. Team count is the real ceiling here; set count is only a sanity guard.
    if (names.size > GSL_MAX_TEAMS || total > 16) return null;
    const opening = (w[0].sets || []).length;
    if (opening < 2) return null;          // a single opening match is not a group
    const size = names.size >= 5 ? 8 : 4;
    // Round labels by POSITION within the band, so the same builder covers both sizes.
    const upperNames = size === 8
      ? ['Upper Quarterfinals', 'Upper Semifinals', 'Upper Final']
      : ['Opening Matches', "Winners' Match"];
    const lowerNames = size === 8
      ? ['Lower Round 1', 'Lower Quarterfinals', 'Lower Semifinals', 'Lower Final']
      : ['Elimination Match'];
    const band = (rounds, labels, cls) => rounds.map((r, i) => ({
      label: labels[i] || r.name || '', sets: r.sets || [], cls: cls,
    }));
    return {
      size,
      upper: band(w, upperNames, 'win'),
      lower: band(l, lowerNames, 'elim'),
      decider: band(f, ['Decider'], 'dec'),
    };
  }

  function winnerOf(set) {
    if (!set) return '';
    const a = set.a || {}, b = set.b || {};
    if (a.winner && a.name && a.name !== 'TBD') return a.name;
    if (b.winner && b.name && b.name !== 'TBD') return b.name;
    return '';
  }

  function buildGslGroup(name, shape, advancesTo) {
    const card = document.createElement('div'); card.className = 'bk-gg';
    const head = document.createElement('div'); head.className = 'bk-gg-head';
    // start.gg names pool groups with a bare identifier — "1", "2", "A". On its own in a header bar
    // that reads as a stray digit, so give it the noun unless the name already carries one.
    const raw = String(name || '').trim();
    const label = !raw ? 'GROUP'
      : /^[0-9A-Za-z]{1,3}$/.test(raw) ? ('GROUP ' + raw.toUpperCase())
      : raw.toUpperCase();
    head.appendChild(document.createTextNode(label));
    if (advancesTo) {
      const s = document.createElement('span'); s.className = 'bk-gg-sub';
      s.textContent = 'TOP 2 → ' + advancesTo.toUpperCase(); head.appendChild(s);
    }
    card.appendChild(head);

    const body = document.createElement('div'); body.className = 'bk-gg-body';
    // Lay the group out as a REAL BRACKET, not flex columns. The sets carry start.gg `prereq`
    // links (Winners SF[0] <- QF[0]+QF[1]), so the existing tree layout can put every match at the
    // row its feeders sit between and draw the connecting elbows — which is the whole reason a
    // bracket reads as a bracket. Hand-stacked columns left the short rounds floating with gaps
    // above and below that pointed at nothing, and looked like content was missing.
    const bands = shape.upper.concat(shape.lower, shape.decider).filter((c) => c.sets.length);
    const section = buildSection('', bands.map((c) => ({ name: c.label, sets: c.sets })), null, 'gsl');
    // Tint each round label by the band it belongs to (upper / lower / decider), which buildSection
    // has no concept of — it only knows a flat list of rounds.
    const colEls = section.querySelectorAll('.bk-round');
    bands.forEach((c, i) => { if (colEls[i] && c.cls) colEls[i].classList.add('bk-band-' + c.cls); });
    body.appendChild(section);

    // Advancing: 1st = winner of the last UPPER round, 2nd = winner of the decider (or of the
    // last lower round when the group has no separate decider). Both stay blank until that match
    // is actually decided — an advancing slot must never guess.
    const lastOf = (band) => { const r = band[band.length - 1]; return r && r.sets.length === 1 ? r.sets[0] : null; };
    const first = winnerOf(lastOf(shape.upper));
    const second = winnerOf(lastOf(shape.decider) || lastOf(shape.lower));
    const out = document.createElement('div'); out.className = 'bk-gg-out';
    const adv = document.createElement('div'); adv.className = 'bk-gg-adv'; adv.textContent = 'Advancing';
    out.appendChild(adv);
    [['1st', first], ['2nd', second]].forEach(([pos, team]) => {
      const row = document.createElement('div'); row.className = 'bk-gg-slot' + (team ? ' filled' : '');
      const p = document.createElement('span'); p.className = 'bk-gg-pos'; p.textContent = pos;
      const t = document.createElement('span'); t.className = 'bk-gg-team';
      t.textContent = team || 'TBD';
      row.appendChild(p); row.appendChild(t); out.appendChild(row);
    });
    // Everyone already knocked out, most-recent exit first (they placed highest of the eliminated).
    // Without this the rail was two TBD chips floating in a full-height column while eight teams'
    // worth of decided results had nowhere to show.
    const gone = [];
    const seenOut = {};
    shape.lower.slice().reverse().forEach((rd) => {
      (rd.sets || []).forEach((set) => {
        const a = set.a || {}, b = set.b || {};
        const loser = a.winner ? b : (b.winner ? a : null);
        if (!loser || !loser.name || loser.name === 'TBD') return;
        const k = bkNorm(loser.name);
        if (seenOut[k]) return;
        seenOut[k] = 1;
        gone.push(loser.name);
      });
    });
    if (gone.length) {
      const h = document.createElement('div'); h.className = 'bk-gg-adv out'; h.textContent = 'Eliminated';
      out.appendChild(h);
      gone.forEach((nm) => {
        const row = document.createElement('div'); row.className = 'bk-gg-slot gone';
        const t = document.createElement('span'); t.className = 'bk-gg-team'; t.textContent = nm;
        row.appendChild(t); out.appendChild(row);
      });
    }
    body.appendChild(out);
    card.appendChild(body);
    // Hero type is sized for a 3-column 4-team group. An 8-team group is 4-5 columns in the same
    // width, so it needs its own smaller step or every org name ellipsises ("The Immig...").
    if (body.querySelectorAll('.bk-round').length >= 4) card.classList.add('wide');
    return card;
  }

  // Every GSL-shaped pool of the phase, tiled. Falls back to the single active bracket when the
  // phase isn't split into pools (one group on air is a perfectly normal graphic).
  function buildGslStage(groups, advancesTo) {
    const wrap = document.createElement('div');
    const n = groups.length;
    wrap.className = 'bk-gsl cols-' + (n <= 1 ? 1 : n === 2 ? 2 : n <= 6 ? (n === 3 ? 3 : 2) : 4)
      + (n > 1 ? ' tiled' : '');
    groups.forEach((g) => wrap.appendChild(buildGslGroup(g.name, g.shape, g.advancesTo || advancesTo)));
    return wrap;
  }

  // ── Round-robin group board ────────────────────────────────────────────────
  // Standings + recent form on the left; head-to-head grid and the next fixtures on the
  // right. Form and goal difference are computed from the schedule so a manually-built
  // group (which carries no per-team stats) reads identically to an imported one.
  function buildGroupBoard(standings, schedule, matrix, showRecord, advanceCount) {
    const rounds = withInferredWinners(schedule);
    const form = new Map(), diff = new Map(), fixtures = [];
    const named = (sl) => sl && sl.name && sl.name !== 'TBD';
    const bump = (m, k, fn) => { const cur = m.get(k); fn(cur); };
    rounds.forEach((r) => {
      (r.sets || []).forEach((set) => {
        const a = set.a || {}, b = set.b || {};
        if (!named(a) || !named(b)) return;
        const ka = bkNorm(a.name), kb = bkNorm(b.name);
        [ka, kb].forEach((k) => { if (!form.has(k)) form.set(k, []); if (!diff.has(k)) diff.set(k, { f: 0, ag: 0 }); });
        if (!a.winner && !b.winner) { fixtures.push({ round: r.name, a: a.name, b: b.name, live: !!set._live }); return; }
        const as = Number(a.score) || 0, bs = Number(b.score) || 0;
        bump(diff, ka, (d) => { d.f += as; d.ag += bs; });
        bump(diff, kb, (d) => { d.f += bs; d.ag += as; });
        form.get(ka).push(a.winner ? 'w' : 'l');
        form.get(kb).push(b.winner ? 'w' : 'l');
      });
    });
    // "Round 3 of 5" = the first round still holding an undecided set (all done → the last one).
    const total = rounds.length;
    let current = rounds.findIndex((r) => (r.sets || []).some((set) => {
      const a = set.a || {}, b = set.b || {};
      return named(a) && named(b) && !a.winner && !b.winner;
    }));
    if (current < 0) current = total - 1;

    const wrap = document.createElement('div'); wrap.className = 'bk-group';
    const main = document.createElement('div'); main.className = 'bk-gp-main';
    const head = document.createElement('div'); head.className = 'bk-gp-head';
    const ht = document.createElement('span'); ht.textContent = 'Standings'; head.appendChild(ht);
    if (total) {
      const hr = document.createElement('span'); hr.className = 'bk-gp-round';
      hr.textContent = 'Round ' + (current + 1) + ' of ' + total;
      head.appendChild(hr);
    }
    main.appendChild(head);

    const rowCls = showRecord === false ? 'bk-gp-row norecord' : 'bk-gp-row';
    const hrow = document.createElement('div'); hrow.className = rowCls + ' head';
    const cols = showRecord === false ? ['#', 'Team', 'Diff', 'Form'] : ['#', 'Team', 'W', 'L', 'Diff', 'Form'];
    cols.forEach((c, i) => {
      const cell = document.createElement('div');
      if (i === 1) cell.className = 'bk-gp-team';
      cell.textContent = c;
      hrow.appendChild(cell);
    });
    main.appendChild(hrow);

    standings.forEach((st, i) => {
      const k = bkNorm(st.name);
      const row = document.createElement('div');
      const isCut = advanceCount > 0 && i === advanceCount - 1 && standings.length > advanceCount;
      row.className = rowCls + (advanceCount > 0 && i < advanceCount ? ' qual' : '') + (isCut ? ' cut' : '');

      const rank = document.createElement('div'); rank.className = 'bk-gp-rank';
      rank.textContent = st.placement != null ? st.placement : (i + 1);
      row.appendChild(rank);

      const team = document.createElement('div'); team.className = 'bk-gp-team';
      const color = colorByName[(st.name || '').toLowerCase()];
      if (color) team.style.setProperty('--team-c', color);
      const logo = logoFor(st.name);
      if (logo) {
        const img = document.createElement('img'); img.className = 'bk-gp-logo' + (isDark(logo) ? ' logo-on-dark' : '');
        img.src = logo; img.onerror = function () { this.style.display = 'none'; };
        team.appendChild(img);
      }
      const nm = document.createElement('div'); nm.className = 'bk-gp-name bk-name'; nm.textContent = st.name || 'TBD';
      team.appendChild(nm);
      row.appendChild(team);

      if (showRecord !== false) {
        const w = document.createElement('div'); w.className = 'bk-gp-num w'; w.textContent = st.wins || 0; row.appendChild(w);
        const l = document.createElement('div'); l.className = 'bk-gp-num l'; l.textContent = st.losses || 0; row.appendChild(l);
      }
      // Prefer the imported game-win totals; fall back to what the schedule's scores add up to.
      const d = diff.get(k) || { f: 0, ag: 0 };
      const dv = (st.gameWins != null && st.gameLosses != null) ? (st.gameWins - st.gameLosses) : (d.f - d.ag);
      const dEl = document.createElement('div');
      dEl.className = 'bk-gp-num diff ' + (dv > 0 ? 'pos' : dv < 0 ? 'neg' : '');
      dEl.textContent = (dv > 0 ? '+' : '') + dv;
      row.appendChild(dEl);

      const fEl = document.createElement('div'); fEl.className = 'bk-gp-form';
      const f = (form.get(k) || []).slice(-5);
      // Always five slots so the column reads as a consistent form guide, not a ragged edge.
      for (let n = 0; n < 5; n++) {
        const res = f[f.length - 5 + n];

    // phase has them, otherwise off whatever single band this phase carries.
    let pairGroups = [];
    if (!runMode && view === 'pairings') {
      const fromPools = pools.map((p) => {
        const r = pairingRound([p.schedule, p.winners, p.losers, p.finals]);
        return r ? { name: p.name, roundName: r.name, sets: r.sets } : null;
      }).filter(Boolean);
      if (fromPools.length) pairGroups = fromPools;
      else {
        const r = pairingRound([schedule, winners, losers, finals]);
        if (r) pairGroups = [{ name: (pools.find((p) => p.id === b.activePoolId) || {}).name || b.subtitle || 'Fixtures', roundName: r.name, sets: r.sets }];
      }
    }
    if (runMode) {
      // run view built above — none of the section/schedule/standings builders apply
    } else if (pairGroups.length) {
      scaleEl.classList.add('bk-fit-content');
      stage.classList.add('poolplay');
      scaleEl.appendChild(buildPairings(pairGroups));
      emptyEl.classList.add('hidden');
    } else if (gslGroups.length) {
      stage.classList.add('gsl');
      if (gslGroups.length === 1) scaleEl.classList.add('bk-fit-content');
      scaleEl.appendChild(buildGslStage(gslGroups, b.advancesTo));
      emptyEl.classList.add('hidden');
    } else if (isElim) {
      const isDouble = losers.length > 0;
      // Butterfly layout (WB left → GF centre ← LB right) only reads as a bracket when there IS a
      // whole bracket to mirror. A multi-stage day hands us a FRAGMENT — e.g. Day 2 of an RLCS-shape
      // event is one winners round, two losers rounds and no Grand Final. Mirroring that gave each
      // half flex:1 of the canvas, so a single-round winners column stretched to ~830px beside
      // ~400px losers columns, and the reversed losers half printed its rounds backwards (6 then 5).
      // Require a real spine: a Grand Final to sit in the centre and enough winners rounds to be
      // worth mirroring. Anything less falls through to the plain left→right stacked layout.
      const butterfly = SHOW_W && SHOW_L && isDouble && ROUNDS_N === 0
        && finals.length > 0 && winners.length >= 3;
      // Full view (both brackets, no round-trim) is where team count is highest and start.gg
      // logos are sparsest — badge-abbreviated names read cleaner there than a mix of real
      // logos and empty placeholder boxes, regardless of how small the fitted scale ends up.
      // Partial views (upper/lower/finals-stretch only) have more room per team and keep the
      // normal scale-based logo/abbreviation behavior.
      // ...and it is the same completeness test that decides badge-abbreviated names: a fragment has
      // room for real logos and full names, so forcing abbreviations there just threw away detail.
      const fullView = butterfly;
      _fullBoard = butterfly;
      scaleEl.classList.toggle('butterfly', butterfly);
      scaleEl.classList.toggle('bk-abbrev', fullView);
      // Fragments size to content so fit() can magnify them into the canvas; the full mirrored
      // board already spans it and stays on the fixed 1816px grid.
      scaleEl.classList.toggle('bk-fit-content', !butterfly);
      stage.classList.toggle('butterfly', butterfly);
      let rendered = false;

      if (butterfly) {
        // The two halves get flex-grow in proportion to how many ROUNDS they hold, not a flat 50/50.
        // A double elim is lopsided by construction — 4 winners rounds against 5 losers rounds — so
        // an even split made every losers column ~135px against ~177px for winners, and the losers
        // names ellipsised to "F.." while the winners' fitted. Proportional grow gives every column
        // on the board the same width, which is also just what a bracket is supposed to look like.
        const _wbN = winners.length, _lbN = losers.length;
        // WB left (winners only — finals go to center GF piece)
        if (winners.length) {
          const sec = buildSection('', winners, null, 'winners');
          sec.style.flexGrow = String(_wbN || 1);
          scaleEl.appendChild(sec);
          if (pillsEl) { const p = document.createElement('span'); p.className = 'bk-spill wb'; p.textContent = 'Winners Bracket'; pillsEl.appendChild(p); }
        }
        // GF center
        if (finals.length) scaleEl.appendChild(buildGF(finals));
        // LB right (reversed via CSS: losers[0] = LB R1 renders far-right, LB Finals near center)
        if (losers.length) {
          const sec = buildSection('', losers, null, 'losers');
          sec.style.flexGrow = String(_lbN || 1);
          scaleEl.appendChild(sec);
          if (pillsEl) { const p = document.createElement('span'); p.className = 'bk-spill lb'; p.textContent = 'Losers Bracket'; pillsEl.appendChild(p); }
        }
        rendered = !!(winners.length || finals.length || losers.length);
      } else {
        // Stacked layout (single-elim, or partial views: upper/lower/finals)
        scaleEl.classList.remove('butterfly');
        let _colCount = 0;
        if (SHOW_W) _colCount += Math.min(winners.length + finals.length, ROUNDS_N > 0 ? ROUNDS_N : Infinity);
        if (SHOW_L && isDouble) _colCount += _lastN(losers).length;
        // Both bands present and few enough columns to sit beside each other rather than stack.
        const duo = SHOW_W && SHOW_L && isDouble && winners.length + finals.length > 0
          && losers.length > 0 && _colCount <= 5;
        scaleEl.classList.toggle('bk-duo', duo);
        stage.classList.toggle('duo', duo);
        if (SHOW_W) {
          let winnerCols = winners.concat(finals);
          let wFinalsStart = winners.length;
          if (ROUNDS_N > 0 && winnerCols.length > ROUNDS_N) {
            const cut = winnerCols.length - ROUNDS_N;
            winnerCols = winnerCols.slice(cut);
            wFinalsStart = Math.max(0, winners.length - cut);
          }
          if (winnerCols.length) {
            scaleEl.appendChild(buildSection(isDouble ? 'Winners Bracket' : '', winnerCols, wFinalsStart, 'winners'));
            if (pillsEl && isDouble) { const p = document.createElement('span'); p.className = 'bk-spill wb'; p.textContent = 'Winners Bracket'; pillsEl.appendChild(p); }
            rendered = true;
          }
        }
        if (SHOW_L && isDouble) {
          const loserCols = _lastN(losers);
          if (loserCols.length) {
            scaleEl.appendChild(buildSection('Losers Bracket', loserCols, null, 'losers'));
            if (pillsEl) { const p = document.createElement('span'); p.className = 'bk-spill lb'; p.textContent = 'Losers Bracket'; pillsEl.appendChild(p); }
            rendered = true;
          }
        }
      }
      emptyEl.classList.toggle('hidden', rendered);
    } else if (schedule.length || standings.length || matrix) {
      // Round-robin / Swiss: ?part=schedule (round-by-round pairings only), ?part=standings
      // (record table only), ?part=matrix (Round Robin head-to-head grid only — not offered
      // for Swiss, whose pairings aren't all-play-all); anything else (including the elim-only
      // 'both'/'winners'/'losers' values, which don't apply here) shows schedule+standings
      // stacked, same "both" spirit as elim brackets — matrix is only ever explicit, so an
      // existing single-pool/Swiss event's default view is completely unaffected.
      // ONE section at a time — an elim-only view value ('both' etc.) left over from a linked
      // platform import used to stack schedule + standings together, which read as several
      // overlays rendered on top of each other. Explicit views still show exactly what they say.
      // Every pool-play board (swiss chart, group board, schedule flow, ladder, matrix) is sized by
      // its own content, not by the canvas — so let fit() magnify it to fill. Pinned to the fixed
      // 1816px wrapper they all rendered at scale 1 and sat in the middle of an empty screen.
      scaleEl.classList.add('bk-fit-content');
      stage.classList.add('poolplay');
      let rrView = view;
      const isSwiss = looksSwiss(schedule, b.type);
      if (!['schedule', 'standings', 'matrix', 'ladder', 'swiss', 'group'].includes(rrView)) {
        // Format-aware default. A Swiss phase gets the swiss stage flow and a Round Robin gets
        // the group board — the graphics built for those formats — falling back to the records
        // ladder (standings-driven, so it still renders when start.gg has only created round 1's
        // sets) and finally to whatever data does exist.
        // The group board earns its place only for a genuine ROUND ROBIN — it is built around an
        // all-play-all head-to-head grid. It used to be the catch-all for "not swiss", which is
        // how a Hybrid Elimination phase (a 4-2-2-1 knockout flow that start.gg also reports as
        // CUSTOM_SCHEDULE) ended up drawn as a standings table with no bracket anywhere on it.
        // A schedule that isn't swiss and isn't round robin is a round-by-round FLOW: draw it.
        const _rrType = String(b.type || '').toUpperCase();
        rrView = (isSwiss && schedule.length) ? 'swiss'
               : (_rrType === 'ROUND_ROBIN' && standings.length) ? 'group'
               : schedule.length ? 'schedule'
               : standings.some((s) => (s.wins || 0) + (s.losses || 0) > 0) ? 'ladder'
               : (standings.length ? 'standings' : 'matrix');
      }
      // An explicitly-picked view with no data behind it must degrade, never blank the overlay.
      if (rrView === 'swiss' && !schedule.length) rrView = standings.length ? 'ladder' : 'matrix';
      if (rrView === 'group' && !standings.length) rrView = schedule.length ? 'schedule' : 'matrix';
      const wantSwiss = rrView === 'swiss' && schedule.length > 0;
      const wantGroup = rrView === 'group' && standings.length > 0;
      const wantLadder = rrView === 'ladder' && standings.length > 0;
      const wantMatrix = !!matrix && rrView === 'matrix';
      const wantSchedule = schedule.length > 0 && rrView === 'schedule';
      const wantStandings = standings.length > 0 && rrView === 'standings';
      // Tier palette on by default; producer toggle, overridable per source with ?colors=0.
      const noColor = URL_COLORS != null ? /^(0|off|false|no)$/i.test(URL_COLORS) : (b.swissColors === false);
      if (wantSwiss) scaleEl.appendChild(buildSwissStage(schedule, swAdvance, swEliminate, b.advancesTo, noColor));
      if (wantGroup) scaleEl.appendChild(buildGroupBoard(standings, schedule, matrix, b.showRecord, swAdvance));
      if (wantLadder) scaleEl.appendChild(buildLadder(standings, b.advancesTo));
      if (wantMatrix) scaleEl.appendChild(buildMatrix(matrix));
      if (wantSchedule) scaleEl.appendChild(buildSchedule(schedule));
      if (wantStandings) scaleEl.appendChild(buildStandings(standings, b.showRecord));
      emptyEl.classList.toggle('hidden', wantSwiss || wantGroup || wantLadder || wantMatrix || wantSchedule || wantStandings);
    }

    // Connectors are computed in the wrapper's UNSCALED coordinate space, then fit()
    // scales the whole wrapper (SVG included) to the canvas — so draw at scale 1 first.
    requestAnimationFrame(() => {
      scaleEl.style.transform = 'scale(1)';
      // Connectors belong to ELIMINATION bands only (.bk-section wraps those). The schedule
      // view reuses .bk-rounds for its columns — drawing elbows between swiss/RR rounds
      // painted meaningless progression lines all over pool play.
      applyRowGeometry(scaleEl);   // cards are in the document now → real row height
      scaleEl.querySelectorAll('.bk-section .bk-rounds').forEach(drawConnectors);
      // Force initials only for the FULL mirrored board (where team count is highest and start.gg
      // logos are sparsest). This used to repeat the old full-view test inline, so a fragment kept
      // getting badge-abbreviated names even after the layout above decided it had room for real
      // ones — the two tests have to be the same test.
      fit(!runMode && _fullBoard);
      // Run mode IS the focus presentation — no dimming or camera zoom on top of it.
      if (focusTeam && !runMode) {
        var fn = bkNorm(focusTeam);
        var slotName = function (nameEl) {
          var full = nameEl.querySelector('.bk-full');
          return bkNorm(full ? full.textContent : nameEl.textContent);
        };
        // Team-run focus: light the team's slot in every match they appear in, mark those
        // matches on-path (everything else recedes — see .bk-focus-mode CSS), then ZOOM the
        // camera into the union of those matches so every opponent name reads on screen.
        scaleEl.classList.add('bk-focus-mode');
        scaleEl.querySelectorAll('.bk-name').forEach(function(nameEl) {
          var slot = nameEl.closest('.bk-slot');
          if (slot) slot.classList.toggle('focused', slotName(nameEl) === fn);
        });
        var pathEls = [];
        scaleEl.querySelectorAll('.bk-match').forEach(function(m) {
          var onPath = Array.prototype.some.call(m.querySelectorAll('.bk-name'), function(n) {
            return slotName(n) === fn;
          });
          m.classList.toggle('on-path', onPath);
          if (onPath) pathEls.push(m);
        });
        // Pool/ladder/schedule views have no .bk-match elements — zoom to the focused
        // slots/rows instead so the camera move works in every bracket view.
        if (!pathEls.length) pathEls = Array.prototype.slice.call(scaleEl.querySelectorAll('.bk-slot.focused, .bk-lad-team.focused'));
        zoomToPath(scaleEl, pathEls, fn + '|' + view + '|' + pathEls.length);
      } else {
        scaleEl.classList.remove('bk-focus-mode');
        scaleEl.querySelectorAll('.bk-slot.focused').forEach(function(s) { s.classList.remove('focused'); });
        scaleEl.querySelectorAll('.bk-match.on-path').forEach(function(m) { m.classList.remove('on-path'); });
        zoomReset(scaleEl);
      }
    });
  }

  function applyState(data) {
    let d = data;
    // In preview, the live full_state (which arrives right after the demo) has no
    // bracket — keep showing the sample instead of letting it blank the scene.
    if (SceneBase.preview) {
      const lb = data.bracket || {};
      // Must match render()'s own hasData check — a Round Robin/Swiss/League-sourced bracket has
      // real content in schedule/matrix, not winners/losers/finals, and was wrongly falling back
      // to the demo bracket here even though real pool-play data existed.
      const has = (lb.winners || []).length || (lb.losers || []).length || (lb.finals || []).length
        || (lb.standings || []).length || (lb.schedule || []).length || !!(lb.matrix && lb.matrix.teams && lb.matrix.teams.length);
      if (!has) {
        const demo = SceneBase.demoState();
        d = Object.assign({}, data, { bracket: demo.bracket,
          startgg: Object.assign({}, data.startgg, { logoMap: (demo.startgg && demo.startgg.logoMap) || {} }) });
      }
    }
    logoByName = {}; abbrevByName = {}; colorByName = {};
    const sgg = (d.startgg && d.startgg.logoMap) || {};
    Object.keys(sgg).forEach((k) => { if (sgg[k]) logoByName[k] = sgg[k]; });
    (d.savedTeams || []).forEach((t) => {
      if (!t || !t.name) return;
      const k = t.name.toLowerCase();
      if (t.logo)  logoByName[k]   = t.logo;
      if (t.abbr)  abbrevByName[k] = t.abbr.toUpperCase().slice(0, 6);
      if (t.color && /^#[0-9a-f]{3,8}$/i.test(t.color)) colorByName[k] = t.color;
    });
    // Fallback: logos carried on the bracket itself (manual builder teams that aren't in the
    // saved-teams library still get a logo). Saved-teams / start.gg take priority above.
    ((d.bracket && d.bracket.teams) || []).forEach((t) => {
      if (!t || !t.name) return;
      const k = t.name.toLowerCase();
      if (t.logo && !logoByName[k]) logoByName[k] = t.logo;
      if (t.abbr && !abbrevByName[k]) abbrevByName[k] = t.abbr.toUpperCase().slice(0, 6);
      if (t.color && !colorByName[k] && /^#[0-9a-f]{3,8}$/i.test(t.color)) colorByName[k] = t.color;
    });
    // Index the start.gg stream queue by team pair so the pairings card can label each fixture's
    // channel + live state. Prefer a live entry when a pair appears more than once.
    pairStreamIdx = {};
    ((d.startgg && d.startgg.queue) || []).forEach((q) => {
      if (!q) return;
      const a = bkNorm(q.teamA), b = bkNorm(q.teamB);
      if (!a || !b || a === 'tbd' || b === 'tbd') return;
      const key = [a, b].sort().join('|');
      const prev = pairStreamIdx[key];
      if (!prev || (q.live && !prev.live)) pairStreamIdx[key] = { stream: q.stream || '', platform: q.platform || '', live: !!q.live, date: q.date || '', time: q.time || '' };
    });
    _bkDateFmt = d.dateFormat === 'intl' ? 'intl' : 'us';
    render(d);
  }

  // Partner logos, bottom-RIGHT and bare — no plate behind them. The board already carries its
  // own frame, so a dark pill under it read as a second graphic; free-standing logos in the
  // corner read as a partner bug. Sponsors only: the desk lineup belongs on a scoreboard scene,
  // not over a bracket. Producers can still kill it per source with ?rail=0 / ?sponsors=0.
  if (typeof CasterRail !== 'undefined') {
    CasterRail.mount({ variant: 'chip', casters: false, bare: true, corner: 'br', bottom: 26, right: 52 });
  }

  SceneBase.connect((data) => {
    SceneBase.applySceneConfig('bracket', data);
    applyState(data);
    if (typeof CasterRail !== 'undefined') CasterRail.render(data);
  });
})();
</script>
</body>
</html>
