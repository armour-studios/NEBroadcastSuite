<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NE Broadcast Suite — Bracket</title>
<link rel="stylesheet" href="fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Default palette = the NE desk-scene (duorow) design language; the active brand
     kit overrides both accents at runtime via SceneBase.brandColor/brandAccent. */
  --accent:   #e83a8b;
  --accent-2: #8b5cf6;
  --ink:      #e8eaf0;
  --muted:    #8b93a8;
  --panel-1:  rgba(255,255,255,0.05);
  --panel-2:  rgba(255,255,255,0.015);
  --hair:     rgba(255,255,255,0.09);
  --line:     rgba(255,255,255,0.18);
  --disp:     'Rajdhani', sans-serif;
  --body:     'Inter', sans-serif;
}

html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--body); color: var(--ink); -webkit-font-smoothing: antialiased; }

.bk-stage { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 28px 52px 28px;
  opacity: 0; transform: scale(1.012); transition: opacity .55s ease, transform .55s ease; }
.bk-stage.show { opacity: 1; transform: scale(1); }


/* ── Header ────────────────────────────────────────────────────────────────────────────────
   Brand mark top-LEFT with the title beside it, the TITLE SPONSOR alone top-RIGHT, format +
   bracket pills between them — the arrangement every broadcast bracket uses. The far-right corner
   is the paid one, so the kit's own logo gives it up and leads the title instead. It used to be one absolutely-positioned
   cluster jammed into the bottom-right corner (eyebrow + title + subtitle + format pill + a row of
   phase chips), which is what read as "weird tags in the corner".
   In normal flow now, so .bk-body simply gets the height that's left — no more per-layout
   margin hacks to keep the board out from under the title. */
/* CENTRE-aligned, not top-aligned: the format/section pills were hanging off the top edge while
   the title sponsor beside them ran 76px tall, so the corner read as two unrelated graphics. One
   centre line through the brand mark, the title, the pills and the title sponsor. */
.bk-header { flex: 0 0 auto; display: flex; align-items: center; gap: 26px; margin-bottom: 16px; }
/* The title sponsor is the only thing in the top-right corner — no plate, no "TITLE PARTNER"
   label. It rides a touch bigger than the brand mark because it is the placement being sold. */
.bk-title-sponsor { flex: 0 0 auto; height: 76px; max-width: 260px; object-fit: contain;
  filter: drop-shadow(0 2px 10px rgba(0,0,0,.55)); }
.bk-head-text { flex: 1 1 auto; min-width: 0; }
.bk-bar { display: none; }
.bk-eyebrow { font-family: var(--disp); font-weight: 700; font-size: 12px; letter-spacing: .42em; text-transform: uppercase;
  color: var(--accent); text-align: left; }
.bk-title { font-family: var(--disp); font-weight: 700; font-size: 44px; line-height: 1.02; letter-spacing: .01em; text-transform: uppercase; color: #fff;
  text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 1180px; }
.bk-subtitle { font-family: var(--body); font-weight: 600; font-size: 16px; color: rgba(255,255,255,.8); text-align: left;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 1000px; margin-top: 2px; }
.bk-subtitle:empty { display: none; }
.bk-head-meta { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.bk-format { font-family: var(--disp); font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #04121f;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 999px; padding: 6px 14px; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.bk-brand-logo { flex: 0 0 auto; height: 64px; max-width: 200px; object-fit: contain;
  filter: drop-shadow(0 2px 10px rgba(0,0,0,.55)); }

/* Section pills — which bracket half is on screen. */
.bk-section-pills { display: flex; gap: 6px; }
/* A single-elimination board has no halves, so this row is empty — but an empty flex child still
   ate the column's row-gap, which pushed the format pill ~4px above the title sponsor's centre
   line. Nothing to show, nothing in the layout. */
.bk-section-pills:empty { display: none; }
.bk-spill { font-family: var(--disp); font-weight: 700; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.bk-spill.wb { color: var(--accent); border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.06); }
.bk-spill.lb { color: var(--accent-2); border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.06); }
@supports (color: color-mix(in srgb, red 50%, white)) {
  .bk-spill.wb { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .bk-spill.lb { border-color: color-mix(in srgb, var(--accent-2) 45%, transparent); background: color-mix(in srgb, var(--accent-2) 12%, transparent); }
}

/* ── Footer: phase chips are PRODUCER NAVIGATION, not broadcast furniture ──────────────────
   They shipped on every live board, which no real show does — you don't put your own stage
   switcher on the feed. Off by default; the in-app preview and ?chips=1 still show them. */
.bk-footer { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
.bk-phases { display: none; gap: 6px; padding-top: 10px; }
.bk-stage.show-chips .bk-phases { display: flex; }
.bk-phase { font-family: var(--disp); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  padding: 6px 12px; border-radius: 999px; color: var(--muted); background: var(--panel-1); border: 1px solid var(--hair); }
.bk-phase.active { color: var(--on-accent, #fff); background: var(--accent); border-color: transparent; box-shadow: 0 4px 14px rgba(0,0,0,.35); }

/* ── Body / scale ── */
.bk-body { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
.bk-scale { transform-origin: center center; display: flex; flex-direction: column; align-items: stretch; gap: 12px; width: 1816px; }
/* A fragment (a multi-stage day, an upper/lower-only view) has far fewer columns than the canvas
   is wide. Pinned at 1816px its scrollWidth always equalled the canvas, so fit() computed scale 1
   and the board sat marooned in the middle of an empty screen — MAX_FIT has allowed 2.2x the whole
   time and nothing could ever reach it. Sizing to content lets fit() magnify it to fill instead. */
/* No max-width. Clamping a shrink-to-fit wrapper makes scrollWidth report the CLAMP, so fit()
   computed scale 1 for content that was actually wider and the board bled off both edges. Let it
   size to its true content and let fit() scale it down — that is fit()'s whole job. */
.bk-scale.bk-fit-content { width: auto; align-self: center; }
.bk-scale.bk-fit-content .bk-section { width: auto; }
/* Columns need a definite width here: in a shrink-to-fit parent, flex:1 1 0 has no percentage to
   resolve against and collapses to min-content. Fixed width + fit()'s upscale is the whole trick. */
.bk-scale.bk-fit-content .bk-rounds { width: auto; }
.bk-scale.bk-fit-content .bk-round { flex: 0 0 300px; width: 300px; max-width: 300px; }
/* Two SHORT bands (a multi-stage day: one winners round beside two losers rounds) stack into a
   tall, narrow board — height-bound, so fit() can barely magnify it and the right third of the
   canvas stays empty. Side by side the same content is wide and short, and fit() takes it to
   ~1.8x instead of ~1.1x. Only for small fragments; a full board still stacks (or goes butterfly). */
.bk-scale.bk-duo { flex-direction: row; align-items: stretch; justify-content: center; gap: 40px; }
.bk-scale.bk-duo .bk-section { flex: 0 0 auto; width: auto; }
.bk-scale.bk-duo .bk-section + .bk-section { padding-left: 40px; border-left: 1px solid rgba(255,255,255,.08); }
/* Sections stretch to the tallest so every round label lines up along one top edge; the match
   block inside each column then centres in whatever height is left (auto margins), instead of the
   shorter band floating half a screen down with its label. */
.bk-scale.bk-duo .bk-section > .bk-rounds { flex: 1 1 auto; }
.bk-scale.bk-duo .bk-matches-abs { margin-top: auto; margin-bottom: auto; }

/* The event title / format pills live bottom-right over the board. Once fit() started magnifying
   a fragment to fill the canvas, the last losers match ran underneath them — so reserve the band.
   MARGIN, not padding: fit() sizes against body.clientHeight, which *includes* padding, so padding
   reserved the space without telling fit() about it and the board simply overflowed instead. */


/* ── Section (Winners / Losers) ── */
.bk-section { display: flex; flex-direction: column; align-items: center; width: 100%; }
.bk-section-label { display: none; }

/* Section pills — shown in the bottom-right header cluster */
.bk-section-pills { display: flex; gap: 6px; margin-top: 2px; }
.bk-spill { font-family: var(--disp); font-weight: 700; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.bk-spill.wb { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.bk-spill.lb { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 45%, transparent); background: color-mix(in srgb, var(--accent-2) 12%, transparent); }

/* Match cards; columns flex-fill the canvas width, but a short board (a two-round day of a
   multi-stage event) centres instead of stretching two cards across 1816px. */
.bk-rounds { position: relative; display: flex; align-items: stretch; justify-content: center; gap: 32px; width: 100%; }

/* ── Butterfly (full double-elim): WB left → GF center ← LB right ──
   Height is content-driven: applyRowGeometry() already gives every column in a section an exact
   pixel height, so pinning the box to 880px only ever added dead space under a short board. */
.bk-scale.butterfly { flex-direction: row; align-items: center; }
.bk-scale.butterfly .bk-section { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bk-scale.butterfly .bk-section .bk-rounds { flex: 1; min-height: 0; }
.bk-scale.butterfly .bk-section.losers .bk-rounds { flex-direction: row-reverse; }

/* Grand Finals center column */
.bk-gf { flex: 0 0 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 10px; position: relative; }
.bk-gf::before, .bk-gf::after { content: ''; position: absolute; top: 15%; bottom: 15%; width: 1px; background: linear-gradient(180deg, transparent, rgba(255,214,107,.3) 40%, rgba(255,214,107,.3) 60%, transparent); }
.bk-gf::before { left: 0; } .bk-gf::after { right: 0; }
.bk-gf-label { font-family: var(--disp); font-weight: 800; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #ffd66b; text-align: center; white-space: nowrap; margin-bottom: 6px;
  text-shadow: 0 0 20px rgba(255,214,107,.5); }
.bk-gf .bk-match { width: 100%; border-color: rgba(255,214,107,.4); box-shadow: 0 0 0 1px rgba(255,214,107,.12), 0 6px 24px rgba(0,0,0,.55); }
.bk-connectors { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
.bk-connectors path { fill: none; stroke: rgba(255,255,255,.2); stroke-width: 1.5; stroke-linejoin: round; }
.bk-section.losers .bk-connectors path { stroke: color-mix(in srgb, var(--accent-2) 30%, transparent); }

/* ── Round column — flex-fill: columns always span edge to edge ── */
/* max-width is the guard against a one-round view: a full 6-round bracket lands at ~275px a column
   and never reaches the cap, while a two-round day caps at 380px and centres rather than stretching
   a single match card to half the screen. */
.bk-round { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; max-width: 380px; }
.bk-round-name { font-family: var(--disp); font-weight: 700; font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
  color: #fff; text-align: center; margin-bottom: 10px; height: 16px; }
.bk-round.is-final .bk-round-name { color: rgba(255,214,107,.7); }
.bk-matches { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; flex: 1; min-height: 0; }
/* Tree-accurate layout: each match is placed at its real bracket row (see layoutRounds).
   Height is set inline; the whole board is then scaled to the canvas by fit(). */
.bk-matches.bk-matches-abs { display: block; position: relative; flex: 0 0 auto; gap: 0; }
.bk-matches.bk-matches-abs > * { position: absolute; left: 0; right: 0; transform: translateY(-50%); }

/* ── Match card ── */
.bk-match { position: relative; width: 100%; border-radius: 6px; overflow: hidden;
  border: 1px solid rgba(255,255,255,.08);
  background: linear-gradient(180deg, rgba(20,23,32,.97) 0%, rgba(12,14,20,.97) 100%);
  box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.bk-match.is-final { border-color: rgba(255,214,107,.4); box-shadow: 0 0 0 1px rgba(255,214,107,.15), 0 6px 24px rgba(0,0,0,.55); }
/* Live match — unmistakable red + white outline (box-shadow renders outside overflow:hidden, so it's
   never clipped) with a gentle pulse. The LIVE tag sits ABOVE the card via .bk-match-wrap. */
.bk-match.live { border-color: #ff3b46; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #ff3b46, 0 0 14px 2px rgba(255,59,70,.5), 0 4px 20px rgba(0,0,0,.5); animation: bkLivePulse 1.8s ease-in-out infinite; }
@keyframes bkLivePulse {
  0%, 100% { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #ff3b46, 0 0 10px 1px rgba(255,59,70,.4), 0 4px 20px rgba(0,0,0,.5); }
  50%      { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #ff3b46, 0 0 20px 4px rgba(255,59,70,.75), 0 4px 20px rgba(0,0,0,.5); }
}
.bk-match.upcoming { opacity: .72; }
.bk-match.upcoming .bk-score { color: rgba(255,255,255,.25); }
/* Wrapper only around a LIVE match so the tag can sit above the card (which clips with overflow:hidden). */
.bk-match-wrap { position: relative; width: 100%; }
.bk-live-tag { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); z-index: 3; white-space: nowrap;
  font-family: var(--disp); font-weight: 800; font-size: 10px; letter-spacing: .14em; color: #fff;
  background: #ff3b46; border: 1.5px solid #fff; border-radius: 999px; padding: 2px 11px;
  box-shadow: 0 2px 8px rgba(0,0,0,.55), 0 0 12px rgba(255,59,70,.6); }

/* ── Slot (one team row) ── */
.bk-slot { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 0; height: 50px; position: relative; overflow: hidden; }
/* Team crest watermark — an oversized logo bleeding off the right of the row, sitting behind the
   name at low opacity, masked so it fades out before it reaches the name. Decorative only:
   pointer-events off, skipped for TBD slots and whenever logos are hidden.
   FLUSH TO THE RIGHT EDGE (right:0, was 30px). Held clear of the score column it looked fine for a
   transparent PNG, but plenty of crests ship with their OWN background — a dark disc, a card — and
   that background then stopped 30px short and read as a rectangle randomly ending mid-row. Against
   the edge, the slot's own overflow:hidden clips it, so a backed logo bleeds off the row the way
   the design intends instead of terminating in mid-air. */
.bk-slot-wm { position: absolute; top: 50%; right: 0; transform: translateY(-50%);
  width: 84px; height: 84px; z-index: 0; pointer-events: none;
  background-repeat: no-repeat; background-position: center right; background-size: contain;
  /* Tuned against saturated crests: at .12 a brand-coloured logo read as a colour block fighting
     the name rather than a texture behind it. Partial desaturation does most of the calming, so
     the opacity can stay high enough to survive stream compression. */
  /* Producer-set, not a constant: --bk-wm carries state.bracket.watermarkOpacity (or ?watermark=N)
     as a 0-1 fraction. .07 stays the fallback so an older state renders exactly as before. */
  opacity: var(--bk-wm, .07); filter: grayscale(.4);
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 78%);
          mask-image: linear-gradient(90deg, transparent 0%, #000 78%); }
.bk-slot-wm.wm-on-dark { filter: invert(1) grayscale(.4); }
/* Everything else in the row rides above the watermark. */
.bk-slot > *:not(.bk-slot-wm) { position: relative; z-index: 1; }
/* Winner/loser keep their RELATIVE weighting (the crest lifts for the team that went through and
   recedes for the one that didn't) instead of being two more constants that ignore the setting. */
.bk-slot.winner .bk-slot-wm { opacity: calc(var(--bk-wm, .07) * 1.55); }
.bk-slot.loser  .bk-slot-wm { opacity: calc(var(--bk-wm, .07) * 0.55); }
/* Off with the logo toggle, and independently switchable. */
.bk-nologo .bk-slot-wm, .bk-nowm .bk-slot-wm { display: none !important; }
.bk-slot + .bk-slot { border-top: 1px solid rgba(255,255,255,.06); }
.bk-slot-accent { width: 3px; align-self: stretch; flex-shrink: 0; background: transparent; }
.bk-logo { width: 28px; height: 28px; object-fit: contain; flex: 0 0 auto; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.bk-logo.logo-on-dark { filter: invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
/* No-logo placeholder. It used to be an empty bordered box, which read as a broken image on air.
   Now it holds the team's monogram in their own colour and keeps the logo slot's width so names
   stay aligned down the column. An unknown (TBD) slot renders it blank — nothing to monogram. */
.bk-logo-ph { width: 28px; height: 28px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--disp); font-weight: 800; font-size: 13px; letter-spacing: .02em;
  color: var(--ph-col, rgba(255,255,255,.42)); text-transform: uppercase; }
/* Abbrev badge — replaces the logo in abbrev mode, and is the standing fallback for the many
   teams that never have a crest at all. It therefore has to render EVERYWHERE: OBS ships an
   older CEF than the panel does, and a color-mix() value containing var() still wins the cascade
   there before computing to unset, so a bare color-mix background left the badge invisible on the
   exact machines that matter. Literal neutral first (unconditional), team-tinted mix behind
   @supports — the same shape the swiss tier colours use below. */
.bk-logo-badge { display: none; flex: 0 0 28px; width: 28px; height: 28px; border-radius: 5px; align-items: center; justify-content: center;
  font-family: var(--disp); font-weight: 900; color: #fff; text-align: center; letter-spacing: .02em; line-height: 1;
  background: rgba(52,62,82,.92);
  border: 1px solid rgba(255,255,255,.22); }
@supports (color: color-mix(in srgb, red 50%, white)) {
  .bk-logo-badge {
    background: color-mix(in srgb, var(--badge-col, #4a5568) 55%, rgba(0,0,0,.5));
    border-color: color-mix(in srgb, var(--badge-col, #4a5568) 70%, transparent); }
}
.bk-name { font-family: var(--disp); font-weight: 600; font-size: 22px; color: #fff; letter-spacing: .01em;
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-name .bk-short { display: none; }
.bk-name .bk-full  { display: inline; }
/* Abbreviation mode: swap logo → badge, full name → short */
/* Hide logos (producer toggle / ?logos=0) — names only, and the slot reclaims the logo's space
   so the name gets the full card width instead of leaving an empty square. */
.bk-nologo .bk-logo,
.bk-nologo .bk-logo-ph,
.bk-nologo .bk-logo-badge,
.bk-nologo .bk-st-logo,
.bk-nologo .bk-mx-logo,
.bk-nologo .bk-lad-logo,
.bk-nologo .bk-run-logo { display: none !important; }
.bk-nologo .bk-slot { padding-left: 12px; }
.bk-abbrev .bk-logo        { display: none; }
.bk-abbrev .bk-logo-ph     { display: none; }
.bk-abbrev .bk-logo-badge  { display: flex; }
.bk-abbrev .bk-name .bk-full  { display: none; }
.bk-abbrev .bk-name .bk-short { display: inline; font-size: 24px; font-weight: 800; letter-spacing: .03em; }
/* Abbrev mode is used exactly where columns are narrowest (the full mirrored board), so claw back
   the padding the name needs: tighter gaps and a narrower score column. */
.bk-abbrev .bk-slot { gap: 7px; padding-right: 8px; }
.bk-abbrev .bk-score { min-width: 20px; }
.bk-abbrev .bk-logo-badge { flex-basis: 24px; width: 24px; height: 24px; }
/* 24px fitted a 3-letter abbreviation but not a 5-letter one ("EMBER" clipped to "EM..."), and
   the abbreviations are the whole point of this mode. 21px fits five characters in the narrowest
   column a full board produces. */
.bk-abbrev .bk-name .bk-short { font-size: 21px; }
.bk-score { font-family: var(--disp); font-weight: 800; font-size: 22px; color: rgba(255,255,255,.6); min-width: 28px; text-align: center;
  font-variant-numeric: tabular-nums; }
.bk-slot.winner .bk-slot-accent { background: var(--accent); box-shadow: 2px 0 8px color-mix(in srgb, var(--accent) 50%, transparent); }
.bk-slot.winner { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent) 0%, transparent 70%); }
.bk-slot.winner .bk-name { color: #fff; font-weight: 700; }
/* Broadcast-style: the winning score reads as a filled chip so the result is legible at a glance. */
.bk-slot.winner .bk-score { color: var(--on-accent, #fff); background: color-mix(in srgb, var(--accent) 82%, #000); border-radius: 5px; padding: 3px 0; box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 40%, transparent); }
.bk-section.losers .bk-slot.winner .bk-score { color: var(--on-accent-2, #fff); background: color-mix(in srgb, var(--accent-2) 82%, #000); box-shadow: 0 2px 8px color-mix(in srgb, var(--accent-2) 40%, transparent); }
/* Eliminated team: de-emphasised but still READABLE on a stream. The old rgba(118,125,140,.6)
   was ~2.4:1 against the card and unreadable once compressed — and because every undecided match
   used to get this class too, most of the bracket was rendered in it. */
.bk-slot.loser .bk-name { color: rgba(176,184,200,.82); }
.bk-slot.loser .bk-logo { opacity: .55; }
.bk-slot.loser .bk-logo-badge { opacity: .6; }
.bk-slot.loser .bk-score { color: rgba(176,184,200,.6); }
.bk-section.losers .bk-slot.winner .bk-slot-accent { background: var(--accent-2); box-shadow: 2px 0 8px color-mix(in srgb, var(--accent-2) 50%, transparent); }
.bk-section.losers .bk-slot.winner { background: linear-gradient(90deg, color-mix(in srgb, var(--accent-2) 10%, transparent) 0%, transparent 70%); }
.bk-slot.focused { outline: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.bk-slot.focused .bk-slot-accent { background: var(--accent); }
.bk-slot.focused .bk-name { color: #fff; font-weight: 800; }
/* Team-run focus mode: the focused team's matches (their path through the bracket) stay lit
   and ringed; every other match recedes so the run reads instantly. Connectors fade with the
   matches so the lit boxes themselves trace the route. */
.bk-focus-mode .bk-match:not(.on-path) { opacity: .28; filter: saturate(.45); transition: opacity .35s ease; }
.bk-focus-mode .bk-match.on-path {
  opacity: 1; transition: opacity .35s ease;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 60%, transparent),
              0 0 22px color-mix(in srgb, var(--accent) 28%, transparent),
              0 6px 24px rgba(0,0,0,.55);
}
.bk-focus-mode .bk-connectors path { stroke: rgba(255,255,255,.09); }

/* ── Team tournament run (focused team): upper/lower/GF flow with the players bar beneath.
      One flex layout of distinct regions — nothing overlaps anything else on canvas. ── */
/* Run mode stage: brand + event title (the absolute header) move to the TOP RIGHT, and the
   stage reserves a band up there so the scaled run content never slides underneath it. */
.bk-run { display: flex; flex-direction: column; align-items: stretch; gap: 28px; width: 1816px; }
.bk-run-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.bk-run-head { display: flex; align-items: center; gap: 18px; padding-bottom: 4px; }
.bk-run-logo { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 3px 10px rgba(0,0,0,.6)); }
.bk-run-logo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 3px 10px rgba(0,0,0,.6)); }
.bk-run-eyebrow { font-family: var(--disp); font-weight: 700; font-size: 12px; letter-spacing: .42em; text-transform: uppercase;
  color: var(--accent); }
@supports (color: color-mix(in srgb, red 50%, white)) {
  .bk-run-eyebrow { color: color-mix(in srgb, var(--accent) 75%, #fff); } }
.bk-run-team { font-family: var(--disp); font-weight: 700; font-size: 40px; line-height: 1.05; text-transform: uppercase; color: #fff; }
.bk-run-record { margin-left: auto; font-family: var(--disp); font-weight: 800; font-size: 26px; padding: 8px 18px; border-radius: 10px;
  color: #fff; background: color-mix(in srgb, var(--accent) 22%, rgba(0,0,0,.35));
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.bk-run-band-label { font-family: var(--disp); font-weight: 700; font-size: 13px; letter-spacing: .3em; text-transform: uppercase;
  color: rgba(255,255,255,.55); margin-bottom: 10px; }
.bk-run-band.losers .bk-run-band-label { color: var(--accent-2); }
@supports (color: color-mix(in srgb, red 50%, white)) {
  .bk-run-band.losers .bk-run-band-label { color: color-mix(in srgb, var(--accent-2) 70%, #fff); } }
.bk-run-band.gf .bk-run-band-label { color: rgba(255,214,107,.85); }
/* One line per band, always: wrapping put Winners Final on a second row under the earlier
   matches, which read out of order. Cells shrink evenly instead (names ellipsize); a run too
   long even at min width overflows the fixed 1816px wrap and fit() scales the whole view. */
.bk-run-row { display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; }
.bk-run-cell { display: flex; flex-direction: column; gap: 6px; flex: 1 1 0; min-width: 190px; max-width: 300px; }
.bk-run-cell .bk-round-name { height: auto; text-align: left; }
.bk-run-arrow { font-size: 30px; line-height: 1; color: rgba(255,255,255,.3); padding-top: 24px; }
/* Bracket-shaped flow: [upper band over lower band] › [GRAND FINALS] — GF always far right,
   vertically centred, so the run reads left→right into the finals like the real bracket. */
.bk-run-flow { display: flex; align-items: center; gap: 20px; }
.bk-run-bands { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
.bk-run-arrow-gf { padding-top: 0; font-size: 48px; color: rgba(255,214,107,.5); }
.bk-run-band.gf { flex: 0 0 300px; }
.bk-run-band.gf .bk-run-row { flex-direction: column; align-items: stretch; }
.bk-run-band.gf .bk-run-cell { flex: none; max-width: none; }   /* GF column keeps full-width cards */
.bk-run-band.gf .bk-run-arrow { display: none; }   /* GF + reset stack vertically, no separators */
/* Player profile cards (image · gamertag · real name · socials) — a centred bar under the run */
.bk-run-stats { flex: none; align-self: center; display: flex; flex-direction: column; gap: 12px; padding: 18px 26px;
  min-width: 720px; max-width: 1720px;
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; }
.bk-run-stats > .bk-run-band-label { text-align: center; margin-bottom: 0; }
#bk-run-stats-rows { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px; }
.bk-run-player { flex: 0 0 auto; min-width: 250px; display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-radius: 9px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); }
.bk-run-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex: 0 0 auto;
  border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); }
.bk-run-avatar-ph { display: flex; align-items: center; justify-content: center;
  font-family: var(--disp); font-weight: 800; font-size: 18px; color: rgba(255,255,255,.55); }
.bk-run-pmeta { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.bk-run-pname { font-weight: 700; font-size: 17px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-run-flag { width: 22px; height: 15px; border-radius: 2px; object-fit: cover; vertical-align: -2px; margin-right: 7px; }
.bk-run-socline { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
.bk-run-preal { font-size: 12px; color: rgba(255,255,255,.45); }
.bk-run-soc { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.6); white-space: nowrap; }
.bk-run-soc svg { flex: 0 0 auto; opacity: .8; }
.bk-run-stats-empty { font-size: 13px; color: rgba(255,255,255,.4); }

/* ── Schedule (round-robin / swiss round-by-round pairings) — reuses .bk-round/.bk-match/.bk-slot ── */
.bk-schedule { width: 100%; }
.bk-schedule .bk-rounds { gap: 24px; }
/* Round headers become pills so pool-play reads as a SCHEDULE, not a bracket fragment */
.bk-schedule .bk-round-name { height: auto; margin-bottom: 14px; padding: 6px 0; color: #fff;
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border: 1px solid var(--hair); border-radius: 999px; position: relative; overflow: hidden; }
.bk-schedule .bk-round-name::after { content: ''; position: absolute; left: 18%; right: 18%; bottom: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); }
/* Centre each round's matches: a knockout flow narrows (4 -> 2 -> 2 -> 1) and top-aligning every
   column hung the later rounds off the top edge with all the dead space beneath them. */
.bk-schedule .bk-matches { justify-content: center; gap: 14px; }
.bk-schedule .bk-round { max-width: 420px; }
/* ── Cross-phase progression pills: where a slot came from / where the winner goes ── */
.bk-origin { font-size: 12px; line-height: 1; color: rgba(255,255,255,.5); padding: 4px 9px 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.bk-exit { font-size: 12px; line-height: 1; font-weight: 600; padding: 4px 9px 5px;
  color: var(--accent);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@supports (color: color-mix(in srgb, red 50%, white)) {
  .bk-exit { color: color-mix(in srgb, var(--accent) 80%, #fff); } }
.bk-exit::before { content: '\2192  '; opacity: .75; }
.bk-lad-note { text-align: center; font-family: var(--disp); font-size: 16px; font-weight: 600;
  color: var(--accent); letter-spacing: .05em; }
@supports (color: color-mix(in srgb, red 50%, white)) {
  .bk-lad-note { color: color-mix(in srgb, var(--accent) 80%, #fff); } }
.bk-lad-note::before { content: '\2192  '; opacity: .75; }

/* ── Records ladder (swiss / round-robin default view): teams bucketed by W-L ── */
.bk-ladder { display: flex; align-items: flex-start; justify-content: center; gap: 22px; width: 100%; }
.bk-lad-bucket { flex: 1 1 0; min-width: 150px; max-width: 300px; display: flex; flex-direction: column; gap: 8px; }
.bk-lad-head { text-align: center; font-family: var(--disp); font-weight: 700; font-size: 22px;
  letter-spacing: .1em; color: #fff; padding: 8px 0; border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid var(--hair); position: relative; overflow: hidden; }
.bk-lad-head::after { content: ''; position: absolute; left: 16%; right: 16%; bottom: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.bk-lad-bucket.qualified .bk-lad-head { color: #6ff0a8; }
.bk-lad-bucket.qualified .bk-lad-head::after { background: linear-gradient(90deg, transparent, #6ff0a8, transparent); }
.bk-lad-bucket.eliminated .bk-lad-head { color: #f39191; }
.bk-lad-bucket.eliminated .bk-lad-head::after { background: linear-gradient(90deg, transparent, #f39191, transparent); }
.bk-lad-team { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 7px;
  background: linear-gradient(180deg, rgba(20,23,32,.97), rgba(12,14,20,.97));
  border: 1px solid rgba(255,255,255,.08); border-left: 3px solid var(--team-c, rgba(255,255,255,.14)); }
.bk-lad-bucket.eliminated .bk-lad-team { opacity: .62; }
.bk-lad-logo { width: 26px; height: 26px; object-fit: contain; flex: 0 0 auto; }
.bk-lad-logo.logo-on-dark { filter: invert(1); }
.bk-lad-name { font-family: var(--disp); font-weight: 600; font-size: 17px; color: #fff;
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-lad-team.focused { outline: 1px solid var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent); }
/* Dense rounds (>8 sets): two-column grid, double-width column */
.bk-schedule .bk-round.bk-dense { flex: 2; }
.bk-schedule .bk-round.bk-dense .bk-matches { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── Standings (round-robin / swiss) ── */
.bk-standings { align-self: center; width: 1100px; max-width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid var(--hair);
  background: linear-gradient(180deg, rgba(22,25,33,.96), rgba(13,15,21,.96)); box-shadow: 0 18px 44px rgba(0,0,0,.5); }
.bk-st-row { display: grid; grid-template-columns: 100px 1fr 100px 100px 150px; align-items: center; height: 64px; padding: 0 32px; position: relative; }
.bk-standings.enriched { width: 1320px; }
.bk-standings.enriched .bk-st-row { grid-template-columns: 100px 1fr 100px 100px 120px 150px 150px; }
/* Show Win/Loss OFF — drop the W/L + win% bar columns (League source toggle). */
.bk-standings.norecord .bk-st-row { grid-template-columns: 100px 1fr; }
.bk-standings.norecord.enriched .bk-st-row { grid-template-columns: 100px 1fr 120px 150px; }
.bk-st-row + .bk-st-row { border-top: 1px solid var(--hair); }
.bk-st-row:nth-child(odd):not(.bk-st-head) { background: rgba(255,255,255,.018); }
.bk-st-head { background: rgba(255,255,255,.06); height: 52px; }
.bk-st-head::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent 85%); }
.bk-st-head > div { font-family: var(--disp); font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #aeb6c4; }
.bk-st-grouplbl { display: block; font-size: 9px; font-weight: 700; letter-spacing: .14em; color: var(--muted); opacity: .75; margin-bottom: 1px; }
/* Medal accent bars on the podium rows — stronger placement signal than a tinted number alone */
.bk-st-row.r1::before, .bk-st-row.r2::before, .bk-st-row.r3::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.bk-st-row.r1::before { background: #ffd66b; box-shadow: 0 0 12px rgba(255,214,107,.4); }
.bk-st-row.r2::before { background: #cdd6e4; }
.bk-st-row.r3::before { background: #e0944a; }
.bk-st-rank { font-family: var(--disp); font-weight: 800; font-size: 24px; color: var(--muted); text-align: center; }
.bk-st-row.r1 .bk-st-rank { color: #ffd66b; } .bk-st-row.r2 .bk-st-rank { color: #cdd6e4; } .bk-st-row.r3 .bk-st-rank { color: #e0944a; }
.bk-st-team { display: flex; align-items: center; gap: 14px; min-width: 0; }
.bk-st-logo { width: 34px; height: 34px; object-fit: contain; flex: 0 0 auto; }
.bk-st-logo.logo-on-dark { filter: invert(1); }
.bk-st-name { font-family: var(--disp); font-weight: 700; font-size: 24px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-st-rec { font-family: var(--disp); font-weight: 800; font-size: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.bk-st-w { color: #5fe39a; } .bk-st-l { color: #f08a8a; }
.bk-st-extra { font-family: var(--disp); font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.bk-st-bar { height: 9px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
.bk-st-bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* ── Swiss stage flow (Worlds / RLCS / CS-Major style) ──────────────────────────────────────
   One column per round; inside it, matches grouped into a BOXED CARD per W-L bucket with a
   solid record bar on top. The bar carries the colour, because at broadcast distance a tinted
   outline pill reads as grey — every reference chart for this format uses a filled bar.
   Tiering follows what the round is actually worth to the teams in it, which is the only reason
   this chart beats a standings table:
       green  = win this and you are through
       red    = lose this and you are out
       white  = both (the decider bucket)
       amber  = the middle of the pack, still playing for position                            */
.bk-swiss { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
.bk-sw-board { display: flex; align-items: stretch; justify-content: center; gap: 18px; }
/* Round columns hold wildly different match counts (8 in round 1, 2 in round 5). Centring each
   column's buckets keeps the chart balanced instead of hanging the late rounds off the top edge. */
.bk-sw-round { display: flex; flex-direction: column; gap: 10px; min-width: 172px; }
.bk-sw-round > .bk-sw-buckets { margin-top: auto; margin-bottom: auto; }
/* The record bars label the groups, so the round name is a quiet index line above them — it used
   to be a 19px white heading competing with the bars it was introducing. */
.bk-sw-round-name { text-align: center; font-family: var(--disp); font-weight: 700; font-size: 12px;
  letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.5); padding-bottom: 6px; }
.bk-sw-buckets { display: flex; flex-direction: column; gap: 13px; }

.bk-sw-bucket { --bk-tier: #7f8ba3; --bk-tier-soft: rgba(127,139,163,.34);
  display: flex; flex-direction: column; border-radius: 7px; overflow: hidden;
  border: 1px solid var(--bk-tier-soft);
  background: linear-gradient(180deg, rgba(20,23,32,.96), rgba(12,14,20,.96));
  box-shadow: 0 6px 20px rgba(0,0,0,.45); }
.bk-sw-bhead { display: flex; align-items: baseline; justify-content: center; gap: 8px;
  font-family: var(--disp); font-weight: 800; font-size: 15px; letter-spacing: .16em;
  color: #08111c; background: var(--bk-tier); padding: 4px 10px; }
.bk-sw-bnote { font-size: 9px; font-weight: 800; letter-spacing: .09em; opacity: .78; }
.bk-sw-matches { display: flex; flex-direction: column; gap: 5px; padding: 6px; }
/* No progression pills on a swiss chart. In a bracket "Day 2: Double Elimination Bracket B3: 5th"
   tells you where a team came from; in swiss it is noise printed under EVERY match, it pushed the
   columns far wider than the canvas (which is what made the board bleed off the page), and the
   record bar above already says everything that matters about a pairing. */
.bk-swiss .bk-origin, .bk-swiss .bk-exit { display: none !important; }
/* Team CODES, not full names. A swiss chart is the densest board we draw — five round columns of
   stacked pairings — and the code is enough to follow a team across it. The monogram stand-in goes
   with them: it resolves to the same letters as the code ("GE" beside "GE"), so it would only eat
   width. A real crest still renders. */
.bk-swiss .bk-name .bk-full { display: none; }
.bk-swiss .bk-name .bk-short { display: inline; font-weight: 800; letter-spacing: .03em; }
.bk-swiss .bk-logo-ph { display: none; }
/* Cards sit INSIDE a bordered bucket — drop their own frame so the group reads as one object. */
.bk-sw-matches .bk-match { border-color: rgba(255,255,255,.06); border-radius: 4px; box-shadow: none; }
/* A round-1 column is 8 matches deep, so the 50px show-card slot has to come down or the chart
   runs off the canvas and fit() shrinks the whole board to compensate. */
.bk-sw-matches .bk-slot { height: 34px; gap: 8px; }
.bk-sw-matches .bk-slot-wm { display: none; }
.bk-sw-matches .bk-name { font-size: 17px; }
.bk-sw-matches .bk-name .bk-short { font-size: 18px; }
.bk-sw-matches .bk-score { font-size: 17px; min-width: 22px; }
.bk-sw-matches .bk-logo,
.bk-sw-matches .bk-logo-ph,
.bk-sw-matches .bk-logo-badge { width: 22px; height: 22px; flex-basis: 22px; font-size: 11px; }

/* Producer toggle (Bracket panel / ?colors=0): drop the green-amber-red-blue tiering and render
   every bucket in one neutral slate. Some brands don't want four accent colours on air, and on a
   monochrome package the tier palette fights the kit. Overrides sit AFTER the tier rules so a
   single class wins without touching them. */
.bk-swiss.bk-nocolor .bk-sw-bucket,
.bk-swiss.bk-nocolor .bk-sw-out { --bk-tier: #8a93a6 !important; --bk-tier-soft: rgba(138,147,166,.34) !important; }
.bk-sw-bucket.neutral { --bk-tier: #7fa6d8; --bk-tier-soft: rgba(127,166,216,.34); }
.bk-sw-bucket.adv     { --bk-tier: #5fe39a; --bk-tier-soft: rgba(95,227,154,.38); }
.bk-sw-bucket.mid     { --bk-tier: #f2c14e; --bk-tier-soft: rgba(242,193,78,.34); }
.bk-sw-bucket.elim    { --bk-tier: #f08a8a; --bk-tier-soft: rgba(240,138,138,.34); }
.bk-sw-bucket.decider { --bk-tier: #ffffff; --bk-tier-soft: rgba(255,255,255,.42); }

/* Outcome rail: who is through, who is out — same filled-bar language as the buckets. */
/* max-width matters as much as min: with only a floor the rail sized to its longest name, and one
   joke entrant ("Signature Plays from JERBEARRRRRR…") stretched it to ~565px — a third of the
   canvas, squeezing the round columns that are the actual chart. Capped, the name ellipsises. */
.bk-sw-outcome { display: flex; flex-direction: column; justify-content: center; gap: 14px;
  min-width: 240px; max-width: 340px; flex: 0 0 auto; }
.bk-sw-out .bk-lad-name { font-size: 16px; }
.bk-sw-out { --bk-tier: #7f8ba3; --bk-tier-soft: rgba(127,139,163,.34);
  display: flex; flex-direction: column; border-radius: 7px; overflow: hidden;
  border: 1px solid var(--bk-tier-soft);
  background: linear-gradient(180deg, rgba(22,25,33,.96), rgba(13,15,21,.96));
  box-shadow: 0 6px 20px rgba(0,0,0,.45); }
.bk-sw-out.qualified  { --bk-tier: #5fe39a; --bk-tier-soft: rgba(95,227,154,.38); }
.bk-sw-out.eliminated { --bk-tier: #f08a8a; --bk-tier-soft: rgba(240,138,138,.34); }
/* Tracking is tighter than the bucket bars': this head carries a destination ("QUALIFIED → DAY 4:
   GSL STAGE") and has to live inside the narrower rail. It may still wrap to two lines, which is
   fine — it is centred and reads as one label. */
.bk-sw-out-head { text-align: center; font-family: var(--disp); font-weight: 800; font-size: 12px;
  letter-spacing: .09em; line-height: 1.25; text-transform: uppercase; color: #08111c;
  background: var(--bk-tier); padding: 5px 10px; }
.bk-sw-out .bk-lad-team { margin: 0 6px; }
.bk-sw-out .bk-lad-team:first-of-type { margin-top: 6px; }
.bk-sw-out .bk-lad-team:last-child { margin-bottom: 6px; }
.bk-sw-out.eliminated .bk-lad-team { opacity: .62; }
.bk-sw-rec { margin-left: auto; font-family: var(--disp); font-weight: 700; font-size: 14px;
  font-variant-numeric: tabular-nums; color: rgba(255,255,255,.72); flex: 0 0 auto; }
.bk-sw-legend { font-family: var(--disp); font-weight: 600; font-size: 14px; letter-spacing: .16em;
  text-transform: uppercase; color: rgba(255,255,255,.55); }

/* ── Group pairings card ───────────────────────────────────────────────────────────────────
   The pre-show fixtures graphic: "GROUP A — these are today's matches". Not a bracket and not a
   schedule flow; one row per fixture, crest on each outer edge, names reading inward to a centred
   VS. Deliberately no scores and no progression — it goes up before a ball is kicked.            */
.bk-pair { display: grid; gap: 30px; width: 100%; justify-content: center; align-content: center; }
.bk-pair.cols-1 { grid-template-columns: minmax(0, 1120px); }
.bk-pair.cols-2 { grid-template-columns: repeat(2, minmax(0, 860px)); }
.bk-pair.cols-3 { grid-template-columns: repeat(3, minmax(0, 600px)); }

.bk-pg { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
/* Glossy brand-gradient header bar with a top sheen, rounded, lifted off the rows. */
.bk-pg-head { position: relative; display: flex; align-items: center; gap: 12px; overflow: hidden;
  font-family: var(--disp); font-weight: 800; font-size: 19px; letter-spacing: .24em;
  text-transform: uppercase; color: var(--on-accent, #fff);
  background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,0) 55%),
              linear-gradient(100deg, var(--accent) 0%, var(--accent-2) 100%);
  padding: 11px 20px; border-radius: 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 26px -10px rgba(0,0,0,.7); }
/* Thin bright rule along the very bottom of the header to seat it. */
.bk-pg-head::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: rgba(255,255,255,.4); }
.bk-pg-when { margin-left: auto; font-size: 12px; letter-spacing: .16em; font-weight: 800;
  background: rgba(0,0,0,.22); padding: 4px 12px; border-radius: 999px; }
.bk-pg-rows { display: flex; flex-direction: column; gap: 16px; }

/* Pairings adopt the SCHEDULE graphic's mini match-hud look: a meta row (LIVE / time / channel)
   above each fixture, then a rounded row with two team sides (colour wash + accent bar) reading
   into a dark VS centre. */
.bk-pr-wrap { display: flex; flex-direction: column; gap: 6px; }
.bk-pr-meta { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 20px; flex-wrap: wrap; }
.bk-pr-when { font-family: var(--disp); font-size: 14px; font-weight: 800; letter-spacing: .07em;
  color: rgba(255,255,255,.85); text-transform: uppercase; white-space: nowrap; line-height: 1; }
.bk-pr-onair { display: inline-flex; align-items: center; gap: 5px; background: #22e07a; color: #04130a;
  border-radius: 999px; padding: 3px 12px; font-family: var(--disp); font-size: 13px; font-weight: 800;
  letter-spacing: .1em; line-height: 1; text-transform: uppercase; }
.bk-pr-onair.live { background: #ff3b47; color: #fff; }
.bk-pr-onair .pdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  animation: bkLivePulse 1.4s ease-in-out infinite; }
/* Channel chip — platform glyph (brand-coloured) + channel name. */
.bk-pr-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 3px 11px; line-height: 1;
  font-family: var(--disp); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #e8eaf0; }
.bk-pr-chip .bk-pr-icon { width: 13px; height: 13px; flex: 0 0 auto; display: block; }
.bk-pr-chip .bk-pr-icon svg { width: 100%; height: 100%; display: block; }
.bk-pr-chip.plat-twitch  .bk-pr-icon { color: #a970ff; }
.bk-pr-chip.plat-youtube .bk-pr-icon { color: #ff4e45; }
.bk-pr-chip.plat-kick     .bk-pr-icon { color: #53fc18; }
.bk-pr-chip.plat-facebook .bk-pr-icon { color: #4c8bf5; }
.bk-pr-chip.plat-generic .bk-pr-icon { color: var(--accent-2); }
.bk-pr-chip .bk-pr-chname { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.bk-pr { position: relative; display: flex; align-items: stretch; height: 70px; border-radius: 11px;
  overflow: hidden; background: linear-gradient(180deg, rgba(24,27,34,.98), rgba(10,12,16,.99));
  box-shadow: 0 8px 28px rgba(0,0,0,.55); }
.bk-pr::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; z-index: 3;
  background: linear-gradient(90deg, transparent 4%, rgba(255,255,255,.28) 50%, transparent 96%); }
/* Team sides — colour wash bleeding in from the outer edge + a glowing accent bar along the bottom.
   Colour comes from --col-a-rgb / --col-b-rgb (R,G,B triples set inline; grey fallback). */
.bk-pr-side { flex: 1 1 0; min-width: 0; position: relative; display: flex; align-items: center; gap: 12px; overflow: hidden; }
.bk-pr-side.a { padding: 0 12px 0 16px; }
.bk-pr-side.b { padding: 0 16px 0 12px; justify-content: flex-end; }
/* Team colour → falls back to the BRAND accent (left) / accent-2 (right), never a stray grey. */
.bk-pr-side.a::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 55%; z-index: 1;
  background: linear-gradient(90deg, rgba(var(--col-a-rgb, var(--accent-rgb, 138,92,246)), .26), transparent); }
.bk-pr-side.b::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 55%; z-index: 1;
  background: linear-gradient(270deg, rgba(var(--col-b-rgb, var(--accent-2-rgb, 138,92,246)), .24), transparent); }
.bk-pr-side.a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; z-index: 2;
  background: linear-gradient(90deg, rgb(var(--col-a-rgb, var(--accent-rgb, 138,92,246))) 0%, rgba(var(--col-a-rgb, var(--accent-rgb, 138,92,246)), .4) 55%, transparent 100%);
  box-shadow: 0 0 12px rgba(var(--col-a-rgb, var(--accent-rgb, 138,92,246)), .55); }
.bk-pr-side.b::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; z-index: 2;
  background: linear-gradient(270deg, rgb(var(--col-b-rgb, var(--accent-2-rgb, 138,92,246))) 0%, rgba(var(--col-b-rgb, var(--accent-2-rgb, 138,92,246)), .4) 55%, transparent 100%);
  box-shadow: 0 0 12px rgba(var(--col-b-rgb, var(--accent-2-rgb, 138,92,246)), .55); }
/* Big, faint team-logo watermark behind each side. */
.bk-pr-wm { position: absolute; top: 50%; transform: translateY(-50%); width: 160px; height: 150%; z-index: 0;
  opacity: .10; pointer-events: none; background-repeat: no-repeat; background-size: contain; }
.bk-pr-side.a .bk-pr-wm { left: 8px; background-position: left center; }
.bk-pr-side.b .bk-pr-wm { right: 8px; background-position: right center; }
.bk-pr-logo, .bk-pr-ph { width: 52px; height: 52px; flex: 0 0 52px; position: relative; z-index: 1; }
.bk-pr-logo { object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.55)); }
.bk-pr-logo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.55)); }
.bk-pr-ph { display: flex; align-items: center; justify-content: center; font-family: var(--disp);
  font-weight: 800; font-size: 18px; color: var(--ph-col, rgba(255,255,255,.6)); }
.bk-pr-name { flex: 1 1 0; min-width: 0; position: relative; z-index: 1; font-family: var(--disp);
  font-size: 25px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; line-height: 1;
  color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-pr-side.b .bk-pr-name { text-align: right; }
.bk-pr-center { flex: 0 0 168px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px; position: relative; z-index: 2; background: rgba(6,8,12,.97);
  border-left: 1px solid rgba(255,255,255,.1); border-right: 1px solid rgba(255,255,255,.1); padding: 0 8px; }
.bk-pr-vs { font-family: var(--disp); font-size: 28px; font-weight: 900; letter-spacing: .1em; color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,.85); line-height: 1; }
/* Stream line under VS — platform glyph (brand-coloured) + channel name. */
.bk-pr-cstream { display: flex; align-items: center; justify-content: center; gap: 5px; max-width: 100%; line-height: 1;
  font-family: var(--disp); font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: rgba(255,255,255,.75); }
.bk-pr-cstream .bk-pr-icon { width: 14px; height: 14px; flex: 0 0 auto; display: block; }
.bk-pr-cstream .bk-pr-icon svg { width: 100%; height: 100%; display: block; }
.bk-pr-cstream.plat-twitch  .bk-pr-icon { color: #a970ff; }
.bk-pr-cstream.plat-youtube .bk-pr-icon { color: #ff4e45; }
.bk-pr-cstream.plat-kick     .bk-pr-icon { color: #53fc18; }
.bk-pr-cstream.plat-facebook .bk-pr-icon { color: #4c8bf5; }
.bk-pr-cstream.plat-generic  .bk-pr-icon { color: var(--accent-2); }
.bk-pr-cstream .bk-pr-chname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes bkLivePulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
/* Tighter rows for the multi-group (tiled) layouts. */
.bk-pair.cols-2 .bk-pr, .bk-pair.cols-3 .bk-pr { height: 60px; }
.bk-pair.cols-2 .bk-pr-name, .bk-pair.cols-3 .bk-pr-name { font-size: 19px; }
.bk-pair.cols-2 .bk-pr-logo, .bk-pair.cols-2 .bk-pr-ph,
.bk-pair.cols-3 .bk-pr-logo, .bk-pair.cols-3 .bk-pr-ph { width: 42px; height: 42px; flex-basis: 42px; }
.bk-pair.cols-2 .bk-pr-center, .bk-pair.cols-3 .bk-pr-center { flex-basis: 140px; }
.bk-pair.cols-2 .bk-pr-vs, .bk-pair.cols-3 .bk-pr-vs { font-size: 23px; }

/* ── GSL groups ────────────────────────────────────────────────────────────────────────────
   A GSL group is a 4-team double elim with a fixed, named shape, and naming the matches is the
   whole point — "Elimination Match" and "Decider" tell a viewer what is at stake in a way that
   "Losers Round 1" never does. One card per group, tiled, so a four-group stage reads as four
   groups instead of one merged mega-bracket (or one pool at a time, which is what it was).
       Opening 1 ─┐
                  ├─> Winners' Match ──────────> 1st, advances
       Opening 2 ─┘        │(loser drops)
                  ┌────────┘
       Elimination Match ──> Decider ─────────> 2nd, advances                                  */
/* Rows STRETCH to a definite height rather than sizing to content. Content-sized, four group
   cards came to ~600px of a 1000px canvas and fit() could not magnify them either (the grid is
   already as wide as the canvas, so it was width-bound at 1.02x) — the tiles just sat in the
   middle with empty bands above and below. Giving the grid the height and letting the cards fill
   it is the fix; a single group (cols-1) becomes the full-screen hero graphic. */
.bk-gsl { display: grid; gap: 20px; width: 100%;
  justify-content: center; align-content: center; }
/* Only the tiled grid gets a height floor — four small cards genuinely need to fill the frame.
   A single group is sized by its own content and centred instead of stretched hollow. */
.bk-gsl.tiled { min-height: 820px; align-content: stretch; }
/* Sized to content inside a shrink-to-fit wrapper so fit() can magnify a single group into
   the canvas; width:100% of an auto-width parent is circular and collapses the grid. */
.bk-scale.bk-fit-content .bk-gsl { width: auto; }
/* Same reserved lane the duo layout needs: the event title sits bottom-right over the board. */

/* Pool-play boards magnify to fill now, so they need the same lane kept clear for the title. */

/* One group = the hero graphic (a group on air). It gets the whole canvas and scales its type up,
   rather than sitting as a 900px card marooned in the middle with "Karmine C..." in it. */
.bk-gsl.cols-1 { grid-template-columns: minmax(0, 1560px); }
.bk-gsl.cols-1 .bk-gg-head { font-size: 21px; padding: 9px 20px; }
.bk-gsl.cols-1 .bk-gg-sub { font-size: 13px; }
.bk-gsl.cols-1 .bk-gg-body { gap: 28px; padding: 24px; }
.bk-gsl.cols-1 .bk-gg-col { gap: 22px; }
.bk-gsl.cols-1 .bk-gg-lbl { font-size: 13px; }
.bk-gsl.cols-1 .bk-gg .bk-slot { height: 74px; }
.bk-gsl.cols-1 .bk-gg .bk-name { font-size: 27px; }
.bk-gsl.cols-1 .bk-gg .bk-score { font-size: 27px; min-width: 34px; }
.bk-gsl.cols-1 .bk-gg .bk-logo,
.bk-gsl.cols-1 .bk-gg .bk-logo-ph { width: 38px; height: 38px; flex-basis: 38px; font-size: 16px; }
.bk-gsl.cols-1 .bk-gg-out { min-width: 260px; padding-left: 24px; gap: 14px; }
.bk-gsl.cols-1 .bk-gg-team { font-size: 22px; }
.bk-gsl.cols-1 .bk-gg-pos { font-size: 14px; }
.bk-gsl.cols-1 .bk-gg-slot { padding: 12px 14px; }
.bk-gsl.cols-1 .bk-gg-adv { font-size: 13px; }
/* 8-team group: more columns in the same width, so step the type down and top-align the columns.
   Centring each column independently made the round labels sit at four different heights, which
   reads as misalignment rather than as bracket flow (there are no connectors here to explain it). */
.bk-gsl.cols-1 .bk-gg.wide .bk-gg-col { justify-content: flex-start; }
.bk-gsl.cols-1 .bk-gg.wide .bk-gg-out { justify-content: flex-start; padding-top: 26px; }
.bk-gsl.cols-1 .bk-gg.wide .bk-gg-body { gap: 16px; padding: 20px; }
.bk-gsl.cols-1 .bk-gg.wide .bk-gg-ms { gap: 14px; }
.bk-gsl.cols-1 .bk-gg.wide .bk-slot { height: 72px; }
.bk-gsl.cols-1 .bk-gg.wide .bk-name { font-size: 20px; }
.bk-gsl.cols-1 .bk-gg.wide .bk-score { font-size: 20px; min-width: 26px; }
.bk-gsl.cols-1 .bk-gg.wide .bk-logo,
.bk-gsl.cols-1 .bk-gg.wide .bk-logo-ph { width: 28px; height: 28px; flex-basis: 28px; font-size: 13px; }
.bk-gsl.cols-1 .bk-gg.wide .bk-gg-out { min-width: 210px; }
.bk-gsl.cols-1 .bk-gg.wide .bk-gg-team { font-size: 18px; }
.bk-gsl.cols-2 { grid-template-columns: repeat(2, minmax(0, 880px)); }
.bk-gsl.cols-3 { grid-template-columns: repeat(3, minmax(0, 590px)); }
.bk-gsl.cols-4 { grid-template-columns: repeat(4, minmax(0, 440px)); }

.bk-gg { display: flex; flex-direction: column; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--hair);
  background: linear-gradient(180deg, rgba(20,23,32,.94), rgba(12,14,20,.94));
  box-shadow: 0 8px 26px rgba(0,0,0,.45); }
/* Filled header bar — the group label is the loudest thing on the card, as in every reference. */
.bk-gg-head { font-family: var(--disp); font-weight: 800; font-size: 15px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--on-accent, #fff); background: var(--accent);
  padding: 5px 14px; display: flex; align-items: baseline; gap: 10px; }
.bk-gg-sub { margin-left: auto; font-size: 10px; letter-spacing: .12em; opacity: .85; }
.bk-gg-body { display: flex; align-items: stretch; gap: 14px; padding: 12px; flex: 1 1 auto; min-height: 0; }
/* The group's bracket is a normal .bk-section, so it inherits the tree layout and the SVG connector
   layer. It just has to fill the card and let the outcome rail sit beside it. */
.bk-gg .bk-section { flex: 1 1 auto; min-width: 0; }
.bk-gg .bk-section .bk-rounds { gap: 18px; }
.bk-gg .bk-round-name { font-family: var(--disp); font-weight: 700; font-size: 11px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--muted); text-align: left; height: auto; margin-bottom: 12px; }
.bk-gg .bk-round.bk-band-win  .bk-round-name { color: #5fe39a; }
.bk-gg .bk-round.bk-band-elim .bk-round-name { color: #f08a8a; }
.bk-gg .bk-round.bk-band-dec  .bk-round-name { color: #f2c14e; }
.bk-gg .bk-connectors path { stroke: rgba(255,255,255,.22); }
.bk-gg-col { display: flex; flex-direction: column; justify-content: center; gap: 12px; flex: 1 1 0; min-width: 0; }
.bk-gg-cell { display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; min-height: 0; }
.bk-gg-ms { display: flex; flex-direction: column; gap: 8px; margin-top: auto; margin-bottom: auto; }
.bk-gg-lbl + .bk-match { margin-top: -2px; }
.bk-gg-lbl { font-family: var(--disp); font-weight: 700; font-size: 10px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--muted); }
.bk-gg-cell.win .bk-gg-lbl  { color: #5fe39a; }
.bk-gg-cell.elim .bk-gg-lbl { color: #f08a8a; }
.bk-gg-cell.dec .bk-gg-lbl  { color: #f2c14e; }
.bk-gg .bk-match { box-shadow: none; }
.bk-gg .bk-slot { height: 54px; }
.bk-gg .bk-name { font-size: 19px; }
.bk-gg .bk-score { font-size: 19px; min-width: 22px; }
.bk-gg .bk-logo, .bk-gg .bk-logo-ph, .bk-gg .bk-logo-badge { width: 26px; height: 26px; flex-basis: 26px; }
.bk-gg .bk-slot-wm { display: none; }
/* Progression pills off, exactly as on the swiss chart: "Day 3: Swiss Stage 1: 1st" printed
   above and below every card was louder than the scores, and the column headings already say
   which round each match is. The destination is stated once, in the group header. */
.bk-gg .bk-origin, .bk-gg .bk-exit { display: none !important; }
/* Tiled (more than one group on screen) each card is ~880px split across three match columns and
   the advancing rail, so a full org name has nowhere to go — "Karmine C..." helps nobody. Use the
   team CODE there. A single group on air (cols-1) is the hero graphic and keeps full names. */
.bk-gsl.tiled .bk-name .bk-full { display: none; }
.bk-gsl.tiled .bk-name .bk-short { display: inline; font-weight: 800; letter-spacing: .03em; }
.bk-gsl.tiled .bk-gg-team { font-size: 15px; }
/* Drop the monogram stand-in here: a 2-word org abbreviates to the SAME two letters the monogram
   shows, so the row read "TV TV". A real crest still renders; a team without one is just its code. */
.bk-gsl.tiled .bk-logo-ph { display: none; }
/* Who is through. Empty until the group resolves, so it never states an outcome it doesn't have. */
.bk-gg-out { display: flex; flex-direction: column; justify-content: center; gap: 8px;
  flex: 0 0 auto; min-width: 132px; padding-left: 14px; border-left: 1px solid var(--hair); }
.bk-gg-slot { display: flex; align-items: center; gap: 8px; border-radius: 5px; padding: 6px 9px;
  border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.03); }
.bk-gg-slot.filled { border-color: rgba(95,227,154,.45); background: rgba(95,227,154,.10); }
.bk-gg-pos { font-family: var(--disp); font-weight: 800; font-size: 11px; letter-spacing: .1em;
  color: #5fe39a; flex: 0 0 auto; }
.bk-gg-team { font-family: var(--disp); font-weight: 700; font-size: 16px; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-gg-slot:not(.filled) .bk-gg-team { color: var(--muted); font-weight: 600; }
.bk-gg-adv { font-family: var(--disp); font-weight: 700; font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); text-align: center; }
.bk-gg-adv.out { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); color: #f08a8a; }
.bk-gg-slot.gone { border-color: rgba(240,138,138,.22); background: rgba(240,138,138,.05); opacity: .72; }
.bk-gg-slot.gone .bk-gg-team { color: rgba(255,255,255,.7); font-weight: 600; }

/* ── Round-robin group board: standings + form on the left, head-to-head and the
      next fixtures on the right — one graphic instead of three separate views ── */
.bk-group { align-self: center; display: flex; align-items: flex-start; gap: 20px; max-width: 100%; }
.bk-gp-main, .bk-gp-card { border-radius: 16px; border: 1px solid var(--hair); overflow: hidden;
  background: linear-gradient(180deg, rgba(22,25,33,.96), rgba(13,15,21,.96)); box-shadow: 0 18px 44px rgba(0,0,0,.5); }
.bk-gp-main { min-width: 940px; }
.bk-gp-head, .bk-gp-card-head { display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 13px 22px; border-bottom: 1px solid var(--hair);
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  font-family: var(--disp); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #e3e8f1; }
.bk-gp-round { font-size: 13px; letter-spacing: .1em; color: var(--accent); }
.bk-gp-row { display: grid; grid-template-columns: 74px 1fr 78px 78px 100px 168px; align-items: center;
  padding: 0 18px; height: 60px; border-bottom: 1px solid rgba(255,255,255,.05); }
.bk-gp-row.norecord { grid-template-columns: 74px 1fr 100px 168px; }
.bk-gp-row:last-child { border-bottom: none; }
.bk-gp-row.head { height: 42px; font-family: var(--disp); font-weight: 700; font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.52); }
.bk-gp-row.head .bk-gp-team { padding-left: 0; }
/* The qualification line: teams above it are through if the group ended now. */
.bk-gp-row.cut { border-bottom: 2px solid rgba(111,240,168,.45); }
.bk-gp-row.qual .bk-gp-rank { color: #6ff0a8; }
.bk-gp-rank { font-family: var(--disp); font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums; color: #fff; }
.bk-gp-team { display: flex; align-items: center; gap: 12px; min-width: 0; padding-left: 2px;
  border-left: 3px solid var(--team-c, transparent); }
.bk-gp-logo { width: 32px; height: 32px; object-fit: contain; flex: 0 0 auto; }
.bk-gp-logo.logo-on-dark { filter: invert(1); }
.bk-gp-name { font-family: var(--disp); font-weight: 600; font-size: 21px; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-gp-num { font-family: var(--disp); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; color: #fff; }
.bk-gp-num.w { color: #6ff0a8; }
.bk-gp-num.l { color: rgba(255,255,255,.55); }
.bk-gp-num.diff.pos { color: #6ff0a8; }
.bk-gp-num.diff.neg { color: #f39191; }
.bk-gp-form { display: flex; align-items: center; gap: 6px; }
.bk-gp-dot { width: 20px; height: 20px; border-radius: 5px; flex: 0 0 auto;
  font-family: var(--disp); font-weight: 700; font-size: 11px; color: #0b0d12;
  display: flex; align-items: center; justify-content: center; }
.bk-gp-dot.w { background: #6ff0a8; }
.bk-gp-dot.l { background: #f08a8a; }
.bk-gp-dot.none { background: rgba(255,255,255,.09); }
.bk-gp-side { display: flex; flex-direction: column; gap: 20px; min-width: 300px; max-width: 460px; }
.bk-gp-card { display: flex; flex-direction: column; }
.bk-gp-card-body { padding: 14px; }
/* The full matrix renderer, shrunk to sit beside the table instead of owning the canvas. */
.bk-gp-h2h .bk-matrix { border: none; box-shadow: none; background: transparent; padding: 0; }
.bk-gp-h2h .bk-mx-cell { height: 34px; font-size: 13px; }
.bk-gp-h2h .bk-mx-head { font-size: 11px; }
.bk-gp-h2h .bk-mx-rowhead { padding-left: 8px; gap: 7px; justify-content: flex-start; }
.bk-gp-h2h .bk-mx-logo { width: 17px; height: 17px; }
.bk-gp-fix { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
  background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); margin-bottom: 7px; }
.bk-gp-fix:last-child { margin-bottom: 0; }
.bk-gp-fix.live { border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.07); }
.bk-gp-fix-rd { font-family: var(--disp); font-weight: 700; font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--accent); flex: 0 0 auto; min-width: 52px; }
.bk-gp-fix-teams { flex: 1; min-width: 0; font-family: var(--disp); font-weight: 600; font-size: 15px; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-gp-fix-vs { color: rgba(255,255,255,.4); font-weight: 400; padding: 0 4px; }
.bk-gp-fix-live { font-family: var(--disp); font-weight: 800; font-size: 10px; letter-spacing: .1em;
  color: #ff4d4d; flex: 0 0 auto; }
.bk-gp-empty { font-family: var(--disp); font-size: 14px; color: rgba(255,255,255,.4); padding: 4px 2px; }

/* ── Matrix (round robin / pool play head-to-head grid) ── */
.bk-matrix { align-self: center; max-width: 100%; border-radius: 16px; border: 1px solid var(--hair); padding: 24px;
  background: linear-gradient(180deg, rgba(22,25,33,.96), rgba(13,15,21,.96)); box-shadow: 0 18px 44px rgba(0,0,0,.5); }
.bk-mx-table { display: grid; gap: 4px; }
.bk-mx-cell { display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 7px;
  font-family: var(--disp); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.03); color: #fff; }
.bk-mx-corner { background: transparent; }
.bk-mx-head { background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04)); color: #e3e8f1;
  font-size: 14px; letter-spacing: .04em; padding: 0 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-bottom: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.bk-mx-rowhead { justify-content: flex-start; gap: 10px; padding-left: 14px; text-align: left;
  border-bottom: none; border-right: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.bk-mx-logo { width: 24px; height: 24px; object-fit: contain; flex: 0 0 auto; }
.bk-mx-logo.logo-on-dark { filter: invert(1); }
.bk-mx-diag { background: repeating-linear-gradient(45deg, rgba(255,255,255,.02), rgba(255,255,255,.02) 6px, transparent 6px, transparent 12px); }
.bk-mx-unplayed { color: rgba(255,255,255,.22); }
.bk-mx-played.win { color: #6ff0a4; background: rgba(95,227,154,.14); box-shadow: inset 0 0 0 1px rgba(95,227,154,.22); }
.bk-mx-played.loss { color: #f5a0a0; background: rgba(240,138,138,.09); box-shadow: inset 0 0 0 1px rgba(240,138,138,.16); }

/* ── Empty ── */
.bk-empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-family: var(--disp); font-weight: 600; font-size: 30px; letter-spacing: .06em; color: rgba(255,255,255,.85); text-transform: uppercase; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="bk-stage" class="bk-stage">
  <header class="bk-header">
    <img class="bk-brand-logo" id="bk-brand-logo" style="display:none;" alt="">
    <div class="bk-head-text">
      <div class="bk-eyebrow">Tournament Bracket</div>
      <div class="bk-title" id="bk-title"></div>
      <div class="bk-subtitle" id="bk-subtitle"></div>
    </div>
    <div class="bk-head-meta">
      <div class="bk-format" id="bk-format" style="display:none;"></div>
      <div class="bk-section-pills" id="bk-section-pills"></div>
    </div>
    <img class="bk-title-sponsor" id="bk-title-sponsor" style="display:none;" alt="">
  </header>
  <main class="bk-body"><div class="bk-scale" id="bk-scale"></div></main>
  <footer class="bk-footer">
    <div class="bk-phases" id="bk-phases"></div>
  </footer>
  <div class="bk-empty" id="bk-empty">No bracket loaded — load an event from the dashboard.</div>
</div>

<script src="scene-base.js"></script>
<script src="stream-platforms.js"></script>
<script src="caster-rail.js"></script>
<script>
(function () {
  const SVGNS = 'http://www.w3.org/2000/svg';
  function el(id) { return document.getElementById(id); }
  let logoByName = {};
  let abbrevByName = {};
  let colorByName = {};
  let _sig = '';
  let _livePair = '';   // on-air teams (sorted, upper, '|'-joined) — drives the LIVE badge
  // Per-match stream assignment from the start.gg stream queue: normalised team-pair -> {stream,
  // platform, live}. Lets the pairings card show which channel each fixture is on (multi-stream
  // events run matches across several channels at once) + a LIVE NOW badge.
  let pairStreamIdx = {};
  // Platform meta (CSS hook + inline SVG glyph) from start.gg's streamSource enum, via the SHARED
  // registry in stream-platforms.js — the desk rail badges the same channels, and two copies of
  // this list drift. It sniffs the channel name for the platforms start.gg doesn't model (Kick).
  function platMeta(p, name) {
    if (!window.StreamPlatforms) return { cls: 'plat-generic', icon: '' };
    return StreamPlatforms.meta(p, name);
  }
  // "R,G,B" triple from a #rrggbb, for the team-colour washes (rgba(var(--col-a-rgb),…)).
  function hexRgb(hex) {
    if (!hex || !/^#[0-9a-f]{6}$/i.test(hex)) return null;
    return parseInt(hex.substr(1, 2), 16) + ',' + parseInt(hex.substr(3, 2), 16) + ',' + parseInt(hex.substr(5, 2), 16);
  }
  const BK_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let _bkDateFmt = 'us';
  function fmtWhen(date, time) {
    const parts = [];
    const dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date || '');
    if (dm) { const mon = BK_MONTHS[+dm[2] - 1] || dm[2], day = +dm[3]; parts.push(_bkDateFmt === 'intl' ? (day + ' ' + mon) : (mon + ' ' + day)); }
    else if (date) parts.push(date);
    const tm = /^(\d{2}):(\d{2})/.exec(time || '');
    if (tm) { if (_bkDateFmt === 'intl') parts.push(tm[1] + ':' + tm[2]); else { let h = +tm[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; parts.push(h + ':' + tm[2] + ' ' + ap); } }
    else if (time) parts.push(time);
    return parts.join(' · ');
  }

  function logoFor(name) { return (name && logoByName[name.toLowerCase()]) || null; }
  function isDark(src) { try { return SceneBase.isDefaultGameLogo(src); } catch (e) { return false; } }

  // Fallback team code for teams with no explicit abbreviation in the vault (a saved `abbr` always
  // wins over this). Capped at FOUR characters: the old rule kept a 5-letter name whole while
  // cutting a 6-letter one to 3, so "FROST" and "PULSE" were the only codes too wide for a narrow
  // losers column and ellipsised to "FRO..." right beside a clean "AUR". Four is also what real
  // esports tickers use — three or four letters, never five.
  function abbrev(name) {
    if (!name || name === 'TBD') return name;
    const s = name.trim();
    if (s.length <= 4) return s.toUpperCase();
    const words = s.split(/\s+/);
    if (words.length >= 2) return words.map(function(w) { return w[0]; }).join('').toUpperCase().slice(0, 4);
    return s.slice(0, 3).toUpperCase();
  }

  function fmtType(t) {
    return ({ SINGLE_ELIMINATION: 'Single Elimination', DOUBLE_ELIMINATION: 'Double Elimination',
      ROUND_ROBIN: 'Round Robin', SWISS: 'Swiss' })[t] || (t ? t.replace(/_/g, ' ') : '');
  }

  // ── Team tournament run view ────────────────────────────────────────────────
  // When a team is focused, replace the whole bracket with THEIR run: an Upper Bracket band,
  // a Lower Bracket band and a Grand Finals band of match cards (reusing buildMatch so they
  // look exactly like the playoff bracket), plus a separate Player Stats column. Distinct
  // flex regions — nothing ever overlaps anything else on the canvas.
  function escRun(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  // Player PROFILE cards for the focused team's roster: image (start.gg profile picture when
  // the registry has one), gamertag, real name and social handles — no stats. Roster sources,
  // in preference order: the curated saved-teams library, then the event's imported start.gg
  // teams (startgg.eventTeams). Lookup is forgiving: exact → normalized → containment.
  const SOC_ICONS = {
    twitch: '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>',
    twitter: '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>'
  };
  function fillRunProfiles(teamName, data, rowsEl) {
    if (!rowsEl) return;
    const norm = function (s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ''); };
    const list = (data.savedTeams || []).concat((data.startgg && data.startgg.eventTeams) || []);
    const tn = teamName.toLowerCase(), tnn = norm(teamName);
    const named = list.filter(function (x) { return x && x.name; });
    const t = named.find(function (x) { return x.name.toLowerCase() === tn; })
      || named.find(function (x) { return norm(x.name) === tnn; })
      || named.find(function (x) { return x.name.length >= 3 && (tn.includes(x.name.toLowerCase()) || x.name.toLowerCase().includes(tn)); });
    if (!t) { rowsEl.innerHTML = '<div class="bk-run-stats-empty">' + escRun(teamName) + ' isn’t in Saved or Event teams — import the team to show the roster.</div>'; return; }
    const roster = Array.from(new Set((t.players || []).map((p) => p && (p.name || p.gamertag)).filter(Boolean))).slice(0, 6);
    if (!roster.length) { rowsEl.innerHTML = '<div class="bk-run-stats-empty">' + escRun(t.name) + ' has no players on its roster yet.</div>'; return; }
    const profiles = data.playerProfiles || {};
    // Legal/real names only when the producer enabled them — same intro.showRealName toggle
    // that gates the Team Intro card, so one setting controls it everywhere.
    const showReal = !!(data.intro && data.intro.showRealName);
    rowsEl.innerHTML = roster.map((n) => {
      const prof = profiles[n.toLowerCase()] || profiles[norm(n)] || {};
      const avatar = prof.image
        ? '<img class="bk-run-avatar" src="' + escRun(prof.image) + '" alt="">'
        : '<span class="bk-run-avatar bk-run-avatar-ph">' + escRun((n[0] || '?').toUpperCase()) + '</span>';
      // Country flag — same flagcdn source + countryCode field the Team Intro card uses.
      let cc = (prof.countryCode || '').toString().toUpperCase();
      if (!cc && /^[A-Za-z]{2}$/.test(prof.country || '')) cc = prof.country.toUpperCase();
      const flag = cc
        ? '<img class="bk-run-flag" src="https://flagcdn.com/w40/' + cc.toLowerCase() + '.png" alt="" onerror="this.style.display=\'none\'">'
        : '';
      const socials = ['twitch', 'twitter'].map(function (k) {
        const h = (prof[k] || '').toString().replace(/^@/, '');
        return h ? '<span class="bk-run-soc">' + SOC_ICONS[k] + escRun('@' + h) + '</span>' : '';
      }).join('');
      const real = (showReal && prof.realName) ? '<span class="bk-run-preal">' + escRun(prof.realName) + '</span>' : '';
      return '<div class="bk-run-player">' + avatar
        + '<div class="bk-run-pmeta"><span class="bk-run-pname">' + flag + escRun(n) + '</span>'
        + ((socials || real) ? '<span class="bk-run-socline">' + real + socials + '</span>' : '')
        + '</div></div>';
    }).join('');
  }
  // ── Focus-team name resolution ───────────────────────────────────────────────
  // "TARNISHED" used to substring-match every Tarnished Academy team, so a team's record
  // overlay merged six teams' runs into one. Resolve the typed text to ONE team first —
  // exact name wins over a prefix, prefix over a word match, word over a loose substring,
  // shortest name breaking ties — then match that team exactly everywhere.
  function bkNorm(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

  function bkNameScore(name, q) {
    const n = bkNorm(name);
    if (!n || !q) return -1;
    if (n === q) return 100;
    if (n.startsWith(q + ' ')) return 70;
    if ((' ' + n + ' ').indexOf(' ' + q + ' ') >= 0) return 50;
    if (n.indexOf(q) >= 0) return 30;
    return -1;
  }

  // Every team name that appears anywhere in this bracket.
  function bkAllNames(b) {
    const out = [];
    const push = (n) => { if (n && n !== 'TBD') out.push(n); };
    [].concat(b.winners || [], b.losers || [], b.finals || [], b.schedule || []).forEach((r) =>
      (r.sets || []).forEach((s) => { push(s.a && s.a.name); push(s.b && s.b.name); }));
    (b.standings || []).forEach((s) => push(s.name));
    (b.roster || []).forEach(push);
    ((b.matrix && b.matrix.teams) || []).forEach((t) => push(t.name));
    return out;
  }

  function bkResolveFocus(b, raw) {
    const q = bkNorm(raw);
    if (!q) return '';
    let best = '', bestScore = -1;
    bkAllNames(b).forEach((n) => {
      const sc = bkNameScore(n, q);
      if (sc < 0) return;
      if (sc > bestScore || (sc === bestScore && n.length < best.length)) { best = n; bestScore = sc; }
    });
    return best || raw;   // no candidate (data not loaded yet) → keep what the producer typed
  }

  function renderTeamRun(b, fn, data) {
    // Collect the team's sets per band, in round order (chronological within each bracket).
    let total = 0, wins = 0, teamName = '';
    function collect(rounds) {
      const cells = [];
      (rounds || []).forEach(function (round) {
        (round.sets || []).forEach(function (set) {
          const a = set.a || {}, o = set.b || {};
          // fn is an ALREADY-RESOLVED team name (see bkResolveFocus) — compare exactly, so
          // "Tarnished" no longer drags in "Tarnished Academy A/B/E".
          const hitA = a.name && a.name !== 'TBD' && bkNorm(a.name) === fn;
          const hitB = o.name && o.name !== 'TBD' && bkNorm(o.name) === fn;
          if (!hitA && !hitB) return;
