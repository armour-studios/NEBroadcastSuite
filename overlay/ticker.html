<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NE Broadcast Suite — Ticker</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --brand: #055fdb; --live: #22e06a; --main-font: 'Rajdhani', 'Montserrat', system-ui, sans-serif; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--main-font); }
  /* Live-scores / sponsor ticker. Brand-themed (accent = the active brand colour); the LIVE
     indicators stay green. Add as its own OBS source, or it's the Ticker preview in the panel. */
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; z-index: 25; display: flex; align-items: stretch; overflow: hidden;
    background: linear-gradient(90deg, rgba(9,17,28,.97) 0%, rgba(9,17,28,.93) 100%); border-top: 3px solid var(--brand); }
  .ticker.hidden { display: none; }
  /* LIVE badge (start.gg) — pulsing green circle + LIVE, pinned left, above the track */
  .ticker-live { flex-shrink: 0; display: none; align-items: center; gap: 11px; padding: 0 22px; position: relative; z-index: 2;
    background: var(--live); color: #04130a; font-weight: 700; font-size: 21px; letter-spacing: 3px; }
  .ticker.startgg .ticker-live { display: flex; }
  .tk-dot { width: 13px; height: 13px; border-radius: 50%; background: #04130a; animation: tk-pulse 1.2s ease-out infinite; }
  @keyframes tk-pulse { 0% { box-shadow: 0 0 0 0 rgba(4,19,10,.55); } 70% { box-shadow: 0 0 0 10px rgba(4,19,10,0); } 100% { box-shadow: 0 0 0 0 rgba(4,19,10,0); } }
  /* Sponsor logo — fixed on the left, next to LIVE */
  .ticker-sponsor { flex-shrink: 0; align-self: center; height: 34px; margin: 0 18px; object-fit: contain; display: none; position: relative; z-index: 2; }
  .ticker.has-sponsor .ticker-sponsor { display: block; }
  /* The scrolling lane is CLIPPED to its own box, which sits (via flex order) strictly to the right
     of the sponsor logo/LIVE badge — the marquee can never slide visually behind them, because
     nothing of it renders outside this mask no matter how far the animation's translateX travels. */
  .ticker-mask { flex: 1 1 auto; min-width: 0; height: 100%; overflow: hidden; position: relative; display: flex; align-items: center; }
  .ticker-track { display: inline-flex; align-items: center; white-space: nowrap; animation: ticker-scroll linear infinite;
    padding-left: 28px; position: relative; font-size: 23px; font-weight: 700; line-height: 1; }
  @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  /* Reveal wrapper — a one-shot slide-in played whenever the ticker's teams/messages change, so new
     content slides in instead of popping in place. Separate element from .ticker-track so its
     translateY reveal never collides with the track's continuous translateX scroll. */
  .ticker-reveal { display: inline-flex; align-items: center; height: 100%; will-change: transform, opacity; }
  .ticker-reveal.tk-in { animation: tickerReveal .5s cubic-bezier(.16,.84,.24,1) both; }
  @keyframes tickerReveal { from { opacity: 0; transform: translateY(70%); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .ticker-reveal.tk-in { animation: none; } }
  /* Match scoreline: [LIVE|FINAL] [logoA] TEAM A  s - s  TEAM B [logoB] */
  .tk-match { display: inline-flex; align-items: center; gap: 12px; }
  .tk-stat { display: inline-flex; align-items: center; gap: 7px; letter-spacing: 2px; border-radius: 4px; padding: 2px 8px; }
  .tk-live { color: #04130a; background: var(--live); }
  .tk-live .tk-stat-dot { width: 8px; height: 8px; border-radius: 50%; background: #04130a; animation: tk-pulse2 1.2s ease-out infinite; }
  @keyframes tk-pulse2 { 0% { box-shadow: 0 0 0 0 rgba(4,19,10,.5); } 70% { box-shadow: 0 0 0 6px rgba(4,19,10,0); } 100% { box-shadow: 0 0 0 0 rgba(4,19,10,0); } }
  .tk-final { color: #9aa3b0; border: 1px solid rgba(255,255,255,.22); }
  /* Upcoming fixture (live competition): NEXT + when it starts, in the brand colour */
  .tk-next { color: #fff; background: var(--brand); }
  .tk-when { color: #9aa3b0; letter-spacing: .06em; font-weight: 600; }
  .tk-comp { color: #fff; letter-spacing: .12em; opacity: .9; }
  .tk-logo { height: 28px; width: 28px; object-fit: contain; }
  .tk-team { color: #fff; text-transform: uppercase; letter-spacing: .02em; }
  .tk-score { color: var(--brand); text-transform: uppercase; padding: 0 4px; font-variant-numeric: tabular-nums; }
  .tk-sep { color: rgba(255,255,255,.25); padding: 0 28px; }
  /* Manual-message segment */
  .ticker-segment { color: #fff; text-transform: uppercase; letter-spacing: .02em; }
  /* ?embed=1 (in-builder preview): centre + enlarge */
  .tk-embed .ticker { bottom: auto; top: 50%; transform: translateY(-50%); height: 140px; }
  .tk-embed .ticker-live { font-size: 48px; padding: 0 46px; gap: 22px; }
  .tk-embed .tk-dot { width: 30px; height: 30px; }
  .tk-embed .ticker-sponsor { height: 92px; margin: 0 32px; }
  .tk-embed .tk-stat { font-size: 34px; padding: 6px 18px; gap: 14px; }
  .tk-embed .tk-live .tk-stat-dot { width: 18px; height: 18px; }
  .tk-embed .tk-logo { height: 82px; width: 82px; }
  .tk-embed .tk-team, .tk-embed .tk-score { font-size: 60px; }
  .tk-embed .tk-sep { font-size: 54px; padding: 0 58px; }
  .tk-embed .ticker-segment { font-size: 60px; }
  .tk-embed .tk-when, .tk-embed .tk-comp { font-size: 44px; }
  .tk-embed .ticker-track { padding-left: 56px; }
</style>
</head>
<body>
  <div id="ticker" class="ticker hidden">
    <img class="ticker-sponsor" id="ticker-sponsor" alt="">
    <div class="ticker-mask"><div id="ticker-reveal" class="ticker-reveal"><div id="ticker-track" class="ticker-track"></div></div></div>
  </div>
<script src="scene-base.js"></script>
<script>
(function () {
  function el(id) { return document.getElementById(id); }
  var EMBED = SceneBase.qp('embed') === '1';
  if (EMBED) document.documentElement.classList.add('tk-embed');
  var _sig = '';
  var _structSig = '';

  var DEMO_MATCHES = [
    { status: 'live', teamA: 'Sentinels', teamB: 'Cloud9', scoreA: 2, scoreB: 1, logoA: '', logoB: '' },
    { status: 'done', teamA: 'G2', teamB: 'NRG', scoreA: 3, scoreB: 0, logoA: '', logoB: '' }
  ];
  var DEMO_MSGS = ['Powered by ACME Energy', 'Follow @yourbrand on X', 'Next match starts at 8PM ET'];

  // A set with no reported game scores is not 0-0. Both platforms produce winner-only results
  // (start.gg reported-winner / DQ, NXGEN finals recorded with just a winnerId), and a live set has
  // no score until the first game lands — "0 - 0" claims a result that didn't happen. Same rules
  // the server's text feed uses (formatTickerFeed).
  function fmtScore(m) {
    var a = (typeof m.scoreA === 'number') ? m.scoreA : null;
    var b = (typeof m.scoreB === 'number') ? m.scoreB : null;
    if (m.dq) return m.winSide === 'a' ? 'W - DQ' : m.winSide === 'b' ? 'DQ - W' : 'DQ';
    if (a === null && b === null) {
      if (m.winSide) return m.winSide === 'a' ? 'W - L' : 'L - W';
      if (m.status === 'live') return 'vs';
    }
    return (a || 0) + ' - ' + (b || 0);
  }
  // "7:30 PM" today, "SAT 9/20 · 7:30 PM" on another day — for upcoming fixtures.
  var _dateFmt = 'us', _clock24 = false;
  function fmtWhen(m) {
    if (m.postponed) return 'POSTPONED';
    if (!m.date) return m.time || '';
    var d = new Date(m.date + 'T' + (m.time && /^\d{1,2}:\d{2}/.test(m.time) ? (m.time.length === 4 ? '0' + m.time : m.time) : '12:00'));
    if (isNaN(d.getTime())) return [m.date, m.time].filter(Boolean).join(' ');
    var t = '';
    if (m.time) {
      var h = d.getHours(), mi = ('0' + d.getMinutes()).slice(-2);
      t = _clock24 ? (('0' + h).slice(-2) + ':' + mi) : (((h % 12) || 12) + ':' + mi + (h < 12 ? ' AM' : ' PM'));
    }
    var now = new Date();
    if (d.toDateString() === now.toDateString()) return t || 'TODAY';
    var day = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][d.getDay()];
    var dm = _dateFmt === 'intl' ? (d.getDate() + '/' + (d.getMonth() + 1)) : ((d.getMonth() + 1) + '/' + d.getDate());
    return day + ' ' + dm + (t ? ' · ' + t : '');
  }
  function statusTag(m) {
    var s = document.createElement('span');
    if (m.status === 'upcoming') { s.className = 'tk-stat tk-next'; s.textContent = 'NEXT'; return s; }
    if (m.status === 'live') {
      s.className = 'tk-stat tk-live';
      var d = document.createElement('span'); d.className = 'tk-stat-dot'; s.appendChild(d);
      s.appendChild(document.createTextNode('LIVE'));
    } else {
      s.className = 'tk-stat tk-final'; s.textContent = 'FINAL';
    }
    return s;
  }
  function buildMatch(m) {
    var seg = document.createElement('span'); seg.className = 'tk-match';
    seg.appendChild(statusTag(m));
    if (m.logoA) { var la = document.createElement('img'); la.className = 'tk-logo'; la.src = m.logoA; la.onerror = function () { this.remove(); }; seg.appendChild(la); }
    var ta = document.createElement('span'); ta.className = 'tk-team'; ta.textContent = m.teamA; seg.appendChild(ta);
    var sc = document.createElement('span'); sc.className = 'tk-score'; sc.textContent = m.status === 'upcoming' ? 'vs' : fmtScore(m); seg.appendChild(sc);
    var tb = document.createElement('span'); tb.className = 'tk-team'; tb.textContent = m.teamB; seg.appendChild(tb);
    if (m.logoB) { var lb = document.createElement('img'); lb.className = 'tk-logo'; lb.src = m.logoB; lb.onerror = function () { this.remove(); }; seg.appendChild(lb); }
    if (m.status === 'upcoming') { var w = fmtWhen(m); if (w) { var wh = document.createElement('span'); wh.className = 'tk-when'; wh.textContent = w; seg.appendChild(wh); } }
    return seg;
  }

  function render(data) {
    var t = (data && data.ticker) || {};
    if (data && data.fontFamily) document.documentElement.style.fontFamily = "'" + data.fontFamily + "', 'Inter', system-ui, sans-serif";
    var bar = el('ticker'), track = el('ticker-track');
    var isStartgg = t.source === 'startgg';
    // NXGEN publishes its ticker feed in the SAME item shape start.gg does (server:
    // buildNxgenMatchFeed), so both platforms render through this one match-card path.
    var isNxgen = t.source === 'nxgen';
    // Live competition (a league — typed in, a Google Sheet, a JSON feed…): the server derives
    // data.compFeed from it. Live first, then what's next with its start time, then finals.
    var isComp = t.source === 'competition';
    var isMatches = isStartgg || isNxgen || isComp;
    _dateFmt = data && data.dateFormat === 'intl' ? 'intl' : 'us';
    _clock24 = !!(data && data.clock24h);
    var feed = (isNxgen ? (data && data.nxgen && data.nxgen.matchFeed) : (data && data.startgg && data.startgg.matchFeed)) || [];
    var matches = isMatches ? feed.filter(function (m) { return m && (m.status === 'live' || m.status === 'done'); }) : [];
    var compTitle = '';
    if (isComp) {
      var cf = (data && data.compFeed) || null;
      var opt = (data && data.competition && data.competition.ticker) || {};
      var logos = (cf && cf.logos) || {};
      var saved = {};
      ((data && data.savedTeams) || []).forEach(function (st) { if (st && st.name && st.logo) saved[st.name.toLowerCase()] = st.logo; });
      var withLogos = function (m) {
        return Object.assign({}, m, {
          logoA: logos[m.teamA] || saved[(m.teamA || '').toLowerCase()] || '',
          logoB: logos[m.teamB] || saved[(m.teamB || '').toLowerCase()] || ''
        });
      };
      matches = cf ? [].concat(
        opt.live === false ? [] : cf.live,
        opt.upcoming === false ? [] : cf.upcoming.slice(0, 4),
        opt.results === false ? [] : cf.results.slice(0, 5)
      ).slice(0, opt.max || 12).map(withLogos) : [];
      compTitle = cf ? (cf.name || '').toUpperCase() : '';
    }
    // Manual promo lines are shown in BOTH modes: they're the whole ticker in manual mode, and they
    // interleave between the live scores in start.gg mode so a short match feed (which otherwise
    // loops the same few teams over and over) reads with more variety.
    var messages = (t.messages || []).filter(Boolean);
    // Battle-royale standings ("1. TEAM  42 PTS") — built server-side into ticker.feed.
    if (t.source === 'br' && Array.isArray(t.feed) && t.feed.length) messages = t.feed.concat(messages);
    if (SceneBase.preview || EMBED) {
      if (isMatches && !matches.length) matches = DEMO_MATCHES;
      if (!messages.length) messages = DEMO_MSGS;
    }
    var sponsor = (data && data.brand && data.brand.spots && data.brand.spots.ticker) || t.sponsor || '';
    var count = isMatches ? matches.length : messages.length;
    bar.classList.remove('hidden');
    // class name is the LAYOUT (match cards), not the platform. The pinned LIVE badge only makes
    // sense when something is actually live — a league ticker between match days is all NEXT/FINAL.
    bar.classList.toggle('startgg', isMatches && (!isComp || matches.some(function (m) { return m.status === 'live'; })));
    bar.classList.toggle('has-sponsor', !!sponsor);
    document.documentElement.style.setProperty('--brand', SceneBase.brandAccent(data));
    var sp = el('ticker-sponsor'); if (sp && sponsor) sp.src = sponsor;

    var speed = (t.speed > 0) ? t.speed : 40;
    var sig = JSON.stringify({ s: isMatches, m: matches, x: messages, sp: sponsor, speed: speed, c: compTitle, f: _dateFmt, h: _clock24 });
    if (sig === _sig) return;
    _sig = sig;
    // Structure sig EXCLUDES the live score digits: the slide-in reveal fires when the set of
    // teams/messages changes (e.g. a match's full teams appear), not on every score tick.
    var structSig = JSON.stringify({ s: isMatches, m: matches.map(function (m) { return [m.status, m.teamA, m.teamB]; }), x: messages, sp: sponsor });
    var structChanged = structSig !== _structSig;
    _structSig = structSig;

    function addSep() { var sep = document.createElement('span'); sep.className = 'tk-sep'; track.appendChild(sep); }
    function addMsg(msg) { var span = document.createElement('span'); span.className = 'ticker-segment'; span.textContent = msg; track.appendChild(span); addSep(); }
    track.innerHTML = '';
    for (var copy = 0; copy < 2; copy++) {
      if (isMatches) {
        if (compTitle && matches.length) { var ct = document.createElement('span'); ct.className = 'tk-comp'; ct.textContent = compTitle; track.appendChild(ct); addSep(); }
        matches.forEach(function (m) { track.appendChild(buildMatch(m)); addSep(); });
        messages.forEach(addMsg);   // promo lines interleaved after the scores
      } else {
        messages.forEach(addMsg);
      }
    }
    track.style.animationDuration = speed + 's';

    // Slide the ticker text in when its teams/messages changed (restart the one-shot reveal via a
    // forced reflow), instead of letting the new content pop in place.
    var reveal = el('ticker-reveal');
    if (reveal && structChanged) { reveal.classList.remove('tk-in'); void reveal.offsetWidth; reveal.classList.add('tk-in'); }
  }
  SceneBase.connect(render);
})();
</script>
</body>
</html>
