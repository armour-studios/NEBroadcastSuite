<!DOCTYPE html>
<!--
  duorow.html — 2-caster desk scene (NE Broadcast Suite style).
  Driven by full_state on WS :3001 via SceneBase.connect().
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <style>
    :root {
      --duo-bg: #111318;
      --duo-surface: #1a1d24;
      --duo-surface2: #20242e;
      --duo-border: #2e3340;
      --duo-accent: #e83a8b;
      --duo-accent2: #8b5cf6;
      --duo-text: #e8eaf0;
      --duo-muted: #8b93a8;
      --team-a: #055fdb;
      --team-b: #e97139;
      /* 1920×1080 stage grid */
      --stage-w: 1920px;
      --stage-h: 1080px;
      --pad-x: 24px;
      --hud-h: 132px;
      --cam-gap: 16px;
      --cam-plate-h: 54px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: var(--stage-w); height: var(--stage-h);
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--duo-text);
      -webkit-font-smoothing: antialiased;
    }

    .duo-stage {
      display: flex;
      flex-direction: column;
      width: var(--stage-w);
      height: var(--stage-h);
      padding: 14px var(--pad-x) 16px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .duo-stage.show { opacity: 1; }

    /* Top bar — event name. (Removed from the overlay.) */
    .duo-eventbar { display: none; flex: 0 0 auto; text-align: center; padding: 2px 0 6px; }
    .duo-eventbar span {
      display: inline-block; padding: 7px 26px; border-radius: 9px;
      font-weight: 800; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: #fff;
      background: linear-gradient(135deg, var(--duo-accent), var(--duo-accent2));
      box-shadow: 0 8px 22px rgba(0,0,0,.42);
    }
    .duo-eventbar.is-empty { display: none; }

    /* Series meta bar — BEST OF X · GAME X (or a custom label) — sits below the VS scorebar. */
    .duo-bestof { flex: 0 0 auto; text-align: center; padding: 6px 0 4px; }
    .duo-bestof span {
      display: inline-block; padding: 8px 28px; border-radius: 9px;
      font-weight: 800; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--duo-text);
      background: var(--duo-surface); border: 1px solid var(--duo-border);
    }
    .duo-bestof b { color: var(--duo-accent); font-weight: 800; }

    .zone-hud {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .zone-cams {
      flex: 0 0 auto;
    }
    .zone-footer {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding-top: 18px;
    }

    /* Desk footer row: the centred identity bar, and nothing else. It used to be flanked by two
       desk-sponsor columns, which put a loose logo under each caster tile with no plate around it
       — it read as a floating watermark rather than as part of the graphic. Partner logos belong
       on the identity bar's PRESENTED BY plate (title sponsor) or on a scene that owns them. */
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      width: 100%;
      padding: 0 90px;
    }

    /* ── Entry animations (on .show) ───────────────────────────────── */
    .duo-stage:not(.show) .duo-eventbar,
    .duo-stage:not(.show) .match-hud,
    .duo-stage:not(.show) .cam-card,
    .duo-stage:not(.show) .identity-bar,
    .duo-stage:not(.show) .match-feed,
    .duo-stage:not(.show) .deck-strip,
    .duo-stage:not(.show) .duo-bestof {
      opacity: 0;
    }
    .duo-stage.show .duo-eventbar {
      animation: hudEnter .65s cubic-bezier(.16,.84,.24,1) forwards;
    }
    .duo-stage.show .match-hud {
      animation: hudEnter .7s cubic-bezier(.16,.84,.24,1) .08s forwards;
    }
    .duo-stage.show .duo-bestof {
      animation: hudEnter .65s cubic-bezier(.16,.84,.24,1) .04s forwards;
    }
    .duo-stage.show .cam-card:nth-child(1) {
      animation: camEnterL .75s cubic-bezier(.16,.84,.24,1) .12s forwards;
    }
    .duo-stage.show .cam-card:nth-child(2) {
      animation: camEnterR .75s cubic-bezier(.16,.84,.24,1) .22s forwards;
    }
    .duo-stage.show .identity-bar {
      animation: footerUp .65s cubic-bezier(.16,.84,.24,1) .32s forwards;
    }
    .duo-stage.show .match-feed {
      animation: stripUp .6s cubic-bezier(.16,.84,.24,1) .38s forwards;
    }
    .duo-stage.show .deck-strip {
      animation: stripUp .6s cubic-bezier(.16,.84,.24,1) .46s forwards;
    }
    @keyframes hudEnter {
      from { opacity: 0; transform: translateY(-32px) scale(.94); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes camEnterL {
      from { opacity: 0; transform: translateX(-48px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes camEnterR {
      from { opacity: 0; transform: translateX(48px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes footerUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes stripUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Esports score HUD — one continuous horizontal bar ──────────── */
    .match-hud {
      position: relative;
      display: flex;
      align-items: stretch;
      gap: 0;
      width: min(1620px, 100%);
      height: var(--hud-h);
      overflow: visible;
      background: linear-gradient(180deg, rgba(24,27,34,.98) 0%, rgba(10,12,16,.99) 100%);
      border-bottom: 1px solid rgba(255,255,255,.07);
      box-shadow: 0 12px 32px rgba(0,0,0,.55);
      filter: drop-shadow(0 12px 32px rgba(0,0,0,.55));
    }

    .match-hud::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 4%, rgba(255,255,255,.35) 50%, transparent 96%);
      z-index: 3;
      pointer-events: none;
    }

    .match-team {
      flex: 1 1 0;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      overflow: visible;
    }
    .match-team--a {
      padding: 0 10px 0 16px;
    }
    .match-team--b {
      padding: 0 16px 0 8px;
    }
    .match-team--a::before,
    .match-team--b::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 45%;
      pointer-events: none;
    }
    .match-team--a::before {
      left: 0;
      background: linear-gradient(90deg, color-mix(in srgb, var(--team-a) 22%, transparent), transparent);
    }
    .match-team--b::before {
      right: 0;
      width: 38%;
      background: linear-gradient(270deg, color-mix(in srgb, var(--team-b) 18%, transparent), transparent);
    }
    .match-team::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
    }
    .match-team--a::after {
      background: linear-gradient(90deg, var(--team-a) 0%, color-mix(in srgb, var(--team-a) 40%, transparent) 55%, transparent 100%);
      box-shadow: 0 0 14px color-mix(in srgb, var(--team-a) 50%, transparent);
    }
    .match-team--b::after {
      background: linear-gradient(270deg, var(--team-b) 0%, color-mix(in srgb, var(--team-b) 40%, transparent) 55%, transparent 100%);
      box-shadow: 0 0 14px color-mix(in srgb, var(--team-b) 50%, transparent);
    }

    .match-logo {
      width: 80px; height: 80px;
      object-fit: contain;
      flex: 0 0 80px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
    }
    .match-logo.logo-on-dark {
      filter: brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.5));
    }

    .match-name {
      flex: 1 1 0;
      min-width: 0;
      position: relative;
      z-index: 1;
      font-size: 32px;
      font-weight: 800;
      font-style: normal;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .match-team--a .match-name { color: #fff; text-shadow: 0 0 18px color-mix(in srgb, var(--team-a) 45%, transparent); }
    .match-team--b .match-name {
      color: #fff;
      text-align: right;
      text-shadow: 0 0 18px color-mix(in srgb, var(--team-b) 45%, transparent);
    }

    .match-score {
      flex: 0 0 auto;
      position: relative;
      z-index: 1;
      font-size: 60px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      min-width: 28px;
      text-align: center;
    }
    .match-team--a .match-score {
      color: var(--team-a);
      text-shadow: 0 0 22px color-mix(in srgb, var(--team-a) 60%, transparent);
    }
    .match-team--b .match-score {
      color: var(--team-b);
      text-shadow: 0 0 22px color-mix(in srgb, var(--team-b) 60%, transparent);
    }

    .match-center {
      flex: 0 0 148px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      position: relative;
      z-index: 2;
      background: rgba(6,8,12,.97);
      border-left: 1px solid rgba(255,255,255,.1);
      border-right: 1px solid rgba(255,255,255,.1);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.4);
    }

    .match-series-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--duo-muted);
      white-space: nowrap;
      line-height: 1;
      position: relative;
      z-index: 1;
    }
    .match-series-meta .meta-sep { opacity: 0.35; }
    .match-series-meta .meta-game { color: #d0d5e0; }
    /* series meta (BO x · GAME x) removed from the VS box */
    .match-series-meta { display: none; }

    .match-vs-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .match-vs {
      font-size: 52px;
      font-weight: 900;
      font-style: normal;
      letter-spacing: 0.08em;
      line-height: 1;
      position: relative;
      z-index: 1;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.85);
    }

    /* ── Twitch prediction face ─────────────────────────────────────── */
    /* The HUD holds two stacked faces: the scoreboard, and the live prediction.
       They crossfade in place so the bar reads as one object changing content. */
    .hud-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: stretch;
      transition: opacity .42s ease, transform .55s cubic-bezier(.16,.84,.24,1);
    }
    .hud-face--pred {
      opacity: 0;
      transform: translateY(18px) scale(.985);
      pointer-events: none;
      z-index: 2;
    }
    .match-hud.show-pred .hud-face--score {
      opacity: 0;
      transform: translateY(-18px) scale(.985);
    }
    .match-hud.show-pred .hud-face--pred {
      opacity: 1;
      transform: none;
    }

    .pred-side {
      flex: 1 1 0;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: visible;
    }
    .pred-side--a { padding: 0 10px 0 16px; }
    .pred-side--b { padding: 0 16px 0 8px; }
    /* Team wash — opacity on the layer instead of color-mix so it renders in every
       browser-source build (older CEF/Electron has no color-mix support). */
    .pred-side::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 45%;
      pointer-events: none;
      opacity: .26;
    }
    .pred-side--a::before {
      left: 0;
      background: linear-gradient(90deg, var(--team-a), transparent);
    }
    .pred-side--b::before {
      right: 0;
      width: 38%;
      background: linear-gradient(270deg, var(--team-b), transparent);
    }

    .pred-logo {
      width: 80px; height: 80px;
      object-fit: contain;
      flex: 0 0 80px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
    }
    .pred-logo.logo-on-dark {
      filter: brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.5));
    }

    .pred-name {
      flex: 1 1 0;
      min-width: 0;
      position: relative;
      z-index: 1;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pred-side--b .pred-name { text-align: right; }
    .pred-name { text-shadow: 0 1px 5px rgba(0,0,0,.85); }

    .pred-pct {
      flex: 0 0 auto;
      position: relative;
      z-index: 1;
      font-size: 56px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      min-width: 116px;
      text-align: center;
    }
    .pred-side--a .pred-pct { color: var(--team-a); }
    .pred-side--b .pred-pct { color: var(--team-b); }
    /* currentColor = the team colour, so the glow tracks it without color-mix */
    .pred-pct { text-shadow: 0 0 26px currentColor, 0 2px 5px rgba(0,0,0,.8); }
    /* Leading side reads a touch heavier */
    .pred-side.is-lead .pred-pct { transform: scale(1.06); }
    .pred-pct { transition: transform .5s cubic-bezier(.16,.84,.24,1); }

    .pred-center {
      flex: 0 0 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      z-index: 2;
      padding: 0 14px;
      background: rgba(6,8,12,.97);
      border-left: 1px solid rgba(145,70,255,.28);
      border-right: 1px solid rgba(145,70,255,.28);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.4), inset 0 0 40px rgba(145,70,255,.10);
    }
    .pred-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #b78bff;
    }
    .pred-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #9146ff;
      box-shadow: 0 0 8px #9146ff;
      animation: predDot 1.8s ease-in-out infinite;
    }
    @keyframes predDot {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px #9146ff; }
      50%      { opacity: .45; box-shadow: 0 0 16px #9146ff; }
    }
    .pred-question {
      font-size: 30px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.85);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pred-meta {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--duo-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .pred-meta.urgent { color: #f87171; }
    .pred-meta.result { color: #4ade80; }

    /* Vote split bar — replaces the per-side accent line on this face */
    .pred-split {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 6px;
      display: flex;
      z-index: 3;
      overflow: hidden;
    }
    .pred-fill {
      display: block;
      height: 100%;
      transition: width 1.1s cubic-bezier(.4,0,.2,1);
    }
    .pred-fill--a {
      width: 50%;
      /* dark→clear layer over the team colour = a gradient fill without color-mix */
      background: linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,0)) var(--team-a);
      box-shadow: 0 0 14px var(--team-a);
    }
    .pred-fill--b {
      flex: 1 1 auto;
      background: linear-gradient(270deg, rgba(0,0,0,.45), rgba(0,0,0,0)) var(--team-b);
      box-shadow: 0 0 14px var(--team-b);
    }

    /* Chrome shown only while a prediction is open: purple gradient wash + a
       travelling sheen (gradient, not an outline) so the bar pulls the eye. */
    .pred-chrome {
      position: absolute;
      /* stops 6px short of the bottom so the team accent / vote-split bar stays clean */
      inset: 0 0 6px 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity .5s ease;
      z-index: 4;
    }
    .match-hud.pred-live .pred-chrome { opacity: 1; }
    .pred-chrome::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(145,70,255,.20) 0%, transparent 34%),
        linear-gradient(0deg,   rgba(145,70,255,.16) 0%, transparent 26%);
      animation: predWash 2.8s ease-in-out infinite;
    }
    @keyframes predWash {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    .pred-sheen {
      position: absolute;
      top: -40%; bottom: -40%;
      left: 0;
      width: 26%;
      background: linear-gradient(105deg, transparent, rgba(200,160,255,.30) 45%, rgba(255,255,255,.42) 55%, transparent);
      transform: translateX(-160%) skewX(-14deg);
      animation: predSheen 3.6s cubic-bezier(.5,0,.5,1) infinite;
    }
    @keyframes predSheen {
      0%       { transform: translateX(-160%) skewX(-14deg); opacity: 0; }
      12%      { opacity: .9; }
      55%      { opacity: .9; }
      70%, 100% { transform: translateX(560%) skewX(-14deg); opacity: 0; }
    }
    /* Outer glow pulse on the whole bar (gradient shadow, no outline chase) */
    .match-hud.pred-live { animation: predGlow 2.8s ease-in-out infinite; }
    @keyframes predGlow {
      0%, 100% { box-shadow: 0 12px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(145,70,255,.22); }
      50%      { box-shadow: 0 12px 32px rgba(0,0,0,.55), 0 0 34px rgba(145,70,255,.38), 0 0 0 1px rgba(145,70,255,.45); }
    }

    /* ── Caster cams (16:9, max width for dual layout on 1920 canvas) ─ */
    .duo-cams {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--cam-gap);
      width: 100%;
    }

    .cam-card {
      flex: 1 1 0;
      width: calc((var(--stage-w) - 2 * var(--pad-x) - var(--cam-gap)) / 2);
      max-width: calc((var(--stage-w) - 2 * var(--pad-x) - var(--cam-gap)) / 2);
    }
    .duo-cams[data-count="3"] .cam-card {
      width: calc((var(--stage-w) - 2 * var(--pad-x) - 2 * var(--cam-gap)) / 3);
      max-width: calc((var(--stage-w) - 2 * var(--pad-x) - 2 * var(--cam-gap)) / 3);
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--duo-border);
      background: var(--duo-surface);
      box-shadow: 0 14px 40px rgba(0,0,0,.45);
    }

    .cam-card::before {
      content: '';
      display: block;
      height: 2px;
      flex: 0 0 auto;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14) 20%, rgba(255,255,255,.14) 80%, transparent);
    }

    .cam-hole {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      flex: 0 0 auto;
      background: #0d0f14;
      overflow: hidden;
    }
    /* ?cams=off + framing: punch the cam holes transparent so a separate OBS browser source
       (one per caster = its own audio fader) shows through behind the nameplate frame. */
    .duo-stage.frames-only .cam-hole { background: transparent; }
    .duo-stage.frames-only .cam-card { background: transparent; box-shadow: none; border-color: transparent; }
    .duo-stage.frames-only .cam-card::before { display: none; }
    .cam-hole iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    .cam-plate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: var(--cam-plate-h);
      flex: 0 0 var(--cam-plate-h);
      padding: 0 18px;
      background: linear-gradient(180deg, var(--duo-surface2), var(--duo-surface));
      border-top: 1px solid var(--duo-border);
    }

    .cam-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }

    .cam-handle {
      font-size: 15px;
      font-weight: 600;
      color: #9aa3b8;
      text-transform: none;
      letter-spacing: 0;
    }

    .cam-country { display: inline-flex; align-items: center; }
    .cam-flag {
      height: 20px;
      width: auto;
      display: block;
      border-radius: 3px;
      box-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
    .cam-handle::before {
      font-family: 'Font Awesome 6 Brands';
      font-weight: 400;
      margin-right: 6px;
    }
    .cam-handle.twitch::before { content: "\f1e8"; color: #9146ff; }
    .cam-handle.youtube::before { content: "\f167"; color: #ff0033; }
    .cam-handle.x-twitter::before { content: "\e61b"; color: #e8eaf0; }
    .cam-handle.instagram::before { content: "\f16d"; color: #e1306c; }
    .cam-handle.tiktok::before { content: "\e07b"; color: #25f4ee; }
    .cam-handle.discord::before { content: "\f392"; color: #5865f2; }
    .cam-handle.facebook::before { content: "\f09a"; color: #1877f2; }
    .cam-handle.kick::before { content: "K"; font-family: 'Inter', sans-serif; font-weight: 900; color: #53fc18; }
    .cam-handle.link::before { content: "\f0c1"; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: var(--duo-muted); }

    /* ── Footer zone ────────────────────────────────────────────────── */
    .footer-row {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: calc(var(--stage-w) - 2 * var(--pad-x));
    }

    .presented-by {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }
    .presented-by.is-empty { display: none; }
    .pb-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--duo-muted);
    }
    .pb-logo {
      height: 28px;
      max-width: 160px;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.35));
    }

    /* Event branding — sits as the left side of .identity-bar */
    .brand-strip {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-strip.is-empty { display: none; }

    /* Unified identity bar: event branding + title sponsor on one horizontal line */
    .identity-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 8px 22px;
      background: linear-gradient(180deg, rgba(20,23,30,.96), rgba(10,12,16,.98));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
      position: relative; overflow: hidden;
    }
    .identity-bar::before {
      content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
      pointer-events: none;
    }
    .identity-bar.is-empty { display: none; }
    /* Thin vertical divider between event and sponsor sides */
    .ib-mid-sep {
      width: 1px; height: 18px;
      background: rgba(255,255,255,.16);
      flex-shrink: 0;
      margin: 0 16px;
    }
    .brand-strip-logo {
      height: 38px;
      max-width: 140px;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.35));
    }
    .brand-strip-sep {
      width: 1px;
      height: 14px;
      background: rgba(255,255,255,.15);
    }
    .brand-strip-event {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d6dbe6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: min(78vw, 1100px);
    }

    .deck-strip {
      width: 100%;
      max-width: min(900px, calc(var(--stage-w) - 2 * var(--pad-x)));
      padding: 10px 28px;
      text-align: center;
      background: linear-gradient(90deg, transparent, rgba(14,16,22,.92) 12%, rgba(14,16,22,.92) 88%, transparent);
      border-top: 1px solid rgba(255,255,255,.06);
      border-bottom: 1px solid rgba(255,255,255,.06);
      position: relative;
    }
    .deck-strip::before,
    .deck-strip::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--duo-accent));
      opacity: .5;
    }
    .deck-strip::before { left: 12px; }
    .deck-strip::after  { right: 12px; transform: scaleX(-1); }
    .deck-strip-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #c8ced8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .deck-strip.is-empty { display: none; }

    .match-feed {
      width: 100%;
      max-width: calc(var(--stage-w) - 2 * var(--pad-x));
    }
    .match-feed.is-empty { display: none; }
    .match-feed-label {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--duo-muted);
      text-align: center;
      margin-bottom: 8px;
    }
    .match-feed-track {
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 4px 6px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .match-feed-track::-webkit-scrollbar { display: none; }
    .mf-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: rgba(12,14,18,.94);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #d0d5de;
      max-width: 340px;
    }
    .mf-chip.live {
      border-color: rgba(232,58,139,.45);
      box-shadow: 0 0 12px rgba(232,58,139,.15);
    }
    .mf-status {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      flex: 0 0 auto;
    }
    .mf-chip.live .mf-status {
      background: rgba(232,58,139,.2);
      color: #f9a8d4;
    }
    .mf-chip.done .mf-status {
      background: rgba(255,255,255,.06);
      color: var(--duo-muted);
    }
    .mf-chip.upcoming .mf-status {
      background: rgba(255,255,255,.04);
      color: #7a8296;
    }
    .mf-teams {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .mf-score {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #fff;
      flex: 0 0 auto;
    }

    /* Preview: visible cam placeholders */
    .preview .cam-hole {
      background: repeating-linear-gradient(
        45deg, #181b22, #181b22 16px, #20242e 16px, #20242e 32px
      );
    }
    .preview .cam-hole::after {
      content: 'CAM';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; letter-spacing: 0.3em;
      color: #4a5162;
    }
    .preview .cam-hole iframe { z-index: 1; position: relative; }
  </style>
</head>
<body>
  <div id="stage" class="duo-stage">

    <div class="duo-eventbar" id="duo-eventbar"><span id="duo-event"></span></div>

    <div class="zone-hud">
      <div class="duo-bestof" id="duo-bestof"><span id="duo-bestof-text"></span></div>
      <header class="match-hud" id="match-hud">
        <!-- Face A — the scoreboard (default) -->
        <div class="hud-face hud-face--score">
          <div class="match-team match-team--a">
            <img id="teamlogo1" class="match-logo" alt="">
            <span id="teamname1" class="match-name">BLUE</span>
            <span id="teamscore1" class="match-score">0</span>
          </div>
          <div class="match-center">
            <div class="match-series-meta">
              <span id="vs-bo">BO5</span>
              <span class="meta-sep">·</span>
              <span id="vs-game" class="meta-game">GAME 1</span>
            </div>
            <div class="match-vs-wrap">
              <span class="match-vs">VS</span>
            </div>
          </div>
          <div class="match-team match-team--b">
            <span id="teamscore2" class="match-score">0</span>
            <span id="teamname2" class="match-name">ORANGE</span>
            <img id="teamlogo2" class="match-logo" alt="">
          </div>
        </div>

        <!-- Face B — the live Twitch prediction (crossfades in over the scoreboard) -->
        <div class="hud-face hud-face--pred" id="hud-face-pred">
          <div class="pred-side pred-side--a" id="pred-side1">
            <img id="predlogo1" class="pred-logo" alt="">
            <span id="predname1" class="pred-name">BLUE</span>
            <span id="predpct1" class="pred-pct">50%</span>
          </div>
          <div class="pred-center">
            <span class="pred-kicker"><i class="pred-dot"></i>Twitch Prediction</span>
            <span id="pred-question" class="pred-question">Who will win?</span>
            <span id="pred-meta" class="pred-meta">Voting open</span>
          </div>
          <div class="pred-side pred-side--b" id="pred-side2">
            <span id="predpct2" class="pred-pct">50%</span>
            <span id="predname2" class="pred-name">ORANGE</span>
            <img id="predlogo2" class="pred-logo" alt="">
          </div>
          <div class="pred-split">
            <span class="pred-fill pred-fill--a" id="predfill1"></span>
            <span class="pred-fill pred-fill--b" id="predfill2"></span>
          </div>
        </div>

        <!-- Chrome: purple wash + travelling sheen while a prediction is open -->
        <div class="pred-chrome" aria-hidden="true"><span class="pred-sheen"></span></div>
      </header>
    </div>

    <div class="zone-cams">
      <main class="duo-cams" data-count="2"></main>
    </div>

    <div class="zone-footer">
      <div class="footer-row">
        <div class="identity-bar is-empty" id="identity-bar">
          <div class="brand-strip is-empty" id="brand-strip">
            <img id="brand-strip-logo" class="brand-strip-logo" alt="" style="display:none">
            <span class="brand-strip-sep" id="brand-strip-sep" style="display:none"></span>
            <span id="brand-strip-event" class="brand-strip-event"></span>
          </div>
          <span class="ib-mid-sep" id="ib-mid-sep" style="display:none"></span>
          <div class="presented-by is-empty" id="presented-by">
            <span class="pb-label" id="pb-label">PRESENTED BY</span>
            <img id="pb-logo" class="pb-logo" alt="" style="display:none">
          </div>
        </div>
      </div>
      <div class="deck-strip is-empty" id="deck-strip">
        <span id="tagline" class="deck-strip-text">Live</span>
      </div>
    </div>

  </div>

  <script src="scene-base.js"></script>
  <script>
    function el(id) { return document.getElementById(id); }

    function applyBrandTheme(data) {
      const root = document.documentElement;
      const color = SceneBase.brandColor(data);
      const accent2 = SceneBase.brandAccent(data);
      if (color) root.style.setProperty('--duo-accent', color);
      if (accent2) root.style.setProperty('--duo-accent2', accent2);
      if (data.fontFamily) {
        root.style.fontFamily = `'${data.fontFamily}', 'Inter', system-ui, sans-serif`;
      }
    }

    let _lastCamUrl = [];
    let _lastCamCount = 0;
    // ?cams=off — frames-only: don't embed the webcams here. Add each caster's cam URL as its
    // OWN OBS browser source (positioned over the boxes) so OBS controls per-caster audio/filters.
    const NO_CAMS = new URLSearchParams(location.search).get('cams') === 'off';
    // Frames-only mode → transparent cam holes so OBS cam sources frame in behind the nameplates.
    if (NO_CAMS) document.getElementById('stage')?.classList.add('frames-only');

    // Count how many slots (1–3) have an explicitly-assigned caster with content.
    // Falls back to minimum 2 so the layout never collapses.
    function activeCamCount(casters) {
      const list = (casters && Array.isArray(casters.list)) ? casters.list : [];
      let count = 0;
      for (let i = 1; i <= 2; i++) {
        const c = list.find(x => Number(x.slot) === i);
        if (c && (c.name || c.camUrl)) count = i;
      }
      return Math.max(2, count);
    }

    // Rebuild cam cards when the caster count changes. Resets iframe cache.
    function rebuildCamLayout(count) {
      if (count === _lastCamCount) return;
      _lastCamCount = count;
      _lastCamUrl = new Array(count).fill('');
      const cams = document.querySelector('.duo-cams');
      if (!cams) return;
      cams.setAttribute('data-count', count);
      cams.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const card = document.createElement('div');
        card.className = 'cam-card';
        card.innerHTML = `<div id="hole${i}" class="cam-hole"></div>
          <div class="cam-plate">
            <span id="staffname${i}" class="cam-name">—</span>
            <span id="socials${i}" class="cam-handle" style="display:none"></span>
            <span id="country${i}" class="cam-country" style="display:none"></span>
          </div>`;
        cams.appendChild(card);
      }
    }

    function renderCasters(casters) {
      if (NO_CAMS) return;
      const count = _lastCamCount || 2;
      const slots = SceneBase.castersBySlots(casters, count);
      for (let i = 0; i < count; i++) {
        const camUrl = ((slots[i] && slots[i].camUrl) || '').trim();
        if (camUrl === _lastCamUrl[i]) continue;   // per-slot: only the changed cam reloads
        _lastCamUrl[i] = camUrl;
        const hole = el('hole' + (i + 1));
        if (!hole) continue;
        hole.querySelectorAll('iframe').forEach(f => f.remove());
        if (camUrl) {
          const iframe = document.createElement('iframe');
          iframe.src = camUrl;
          // autoplay = video+audio play without a click; OBS browser source must have
          // "Control audio via OBS" enabled for the caster audio to reach the mix.
          iframe.setAttribute('allow', 'autoplay; encrypted-media; microphone; camera; fullscreen');
          iframe.referrerPolicy = 'no-referrer';
          hole.appendChild(iframe);
        }
      }
    }

    function renderCasterText(casters) {
      const count = _lastCamCount || 2;
      const slots = SceneBase.castersBySlots(casters, count);
      for (let i = 0; i < count; i++) {
        const c = slots[i] || {};
        const nameEl = el('staffname' + (i + 1));
        const socEl = el('socials' + (i + 1));
        if (!nameEl || !socEl) continue;
        nameEl.textContent = (c.name || '—').toString();
        const handle = SceneBase.formatCasterHandle(c);
        const social = (c.social || 'none').toString().toLowerCase();
        if (handle) {
          const cls = SceneBase.socialPlatformClass(social);
          socEl.className = 'cam-handle' + (cls ? ' ' + cls : '');
          socEl.textContent = handle;
          socEl.style.display = '';
        } else {
          socEl.style.display = 'none';
        }
        const ctryEl = el('country' + (i + 1));
        if (ctryEl) {
          const code = (c.country || '').toString().trim().toLowerCase();
          if (casters && casters.showCountry && code) {
            // Image flag (renders on Windows/OBS, unlike flag emoji). Local bundled SVG first,
            // flagcdn.com as the fallback until flags are downloaded.
            ctryEl.innerHTML = '<img class="cam-flag" alt="" src="/assets/flags/' + code + '.svg"'
              + ' onerror="this.onerror=null;this.src=\'https://flagcdn.com/' + code + '.svg\'">';
            ctryEl.style.display = '';
          } else { ctryEl.innerHTML = ''; ctryEl.style.display = 'none'; }
        }
      }
    }

    function renderPresentedBy(data) {
      // Title-sponsor plate: with a brand kit active this shows ONLY a sponsor tagged
      // "Title" — no title sponsor labeled, no plate (a scoreboard-tagged sponsor stays
      // on the in-game scoreboard where it belongs). No kit -> manual upload as before.
      const _pbBrand = data.brand || {};
      const slot = _pbBrand.id
        ? { label: (data.scoreboardAd || {}).label, logo: (_pbBrand.spots && _pbBrand.spots.title) || '' }
        : (data.scoreboardAd || {});
      const wrap = el('presented-by');
      const label = el('pb-label');
      const logo = el('pb-logo');
      if (slot.logo) {
        label.textContent = (slot.label || 'PRESENTED BY').toString().trim();
        logo.src = slot.logo;
        logo.style.display = '';
        wrap.classList.remove('is-empty');
      } else {
        logo.style.display = 'none';
        logo.removeAttribute('src');
        wrap.classList.add('is-empty');
      }
    }

    // Brand-logo + event-title strip above "Presented by" — identifies the org/event, sitting over
    // the sponsor call-out below it.
    function renderBrandStrip(data) {
      const brand = data.brand || {};
      const wrap = el('brand-strip');
      const logoEl = el('brand-strip-logo');
      const sepEl = el('brand-strip-sep');
      const evEl = el('brand-strip-event');
      const evName = (data.eventName || '').toString().trim();
      const hasLogo = !!brand.logo;
      if (hasLogo) { logoEl.src = brand.logo; logoEl.style.display = ''; } else { logoEl.style.display = 'none'; logoEl.removeAttribute('src'); }
      evEl.textContent = evName.toUpperCase();
      sepEl.style.display = (hasLogo && evName) ? '' : 'none';
      wrap.classList.toggle('is-empty', !hasLogo && !evName);
    }

    function syncIdentityBar() {
      const eventEmpty = el('brand-strip').classList.contains('is-empty');
      const sponsorEmpty = el('presented-by').classList.contains('is-empty');
      el('identity-bar').classList.toggle('is-empty', eventEmpty && sponsorEmpty);
      const sep = el('ib-mid-sep');
      if (sep) sep.style.display = (!eventEmpty && !sponsorEmpty) ? '' : 'none';
    }

    function renderDeckStrip(data) {
      const tag = ((data.casters && data.casters.lowerThird) || '').toString().trim();
      const strip = el('deck-strip');
      const tagEl = el('tagline');
      if (tag) {
        tagEl.textContent = tag;
        strip.classList.remove('is-empty');
      } else {
        tagEl.textContent = '';
        strip.classList.add('is-empty');
      }
    }

    function renderTeam(idx, t, side) {
      const logo = el('teamlogo' + idx);
      SceneBase.applyTeamLogo(logo, t.customLogo, t.logo);
      // Head-to-head games (Smash singles, the FGC titles) print the COMPETITOR here, with their
      // org on a second line — the team record on those is just the entrant. See SceneBase.
      SceneBase.applyNamePlate(el('teamname' + idx), t, side === 'b' ? 'ORANGE' : 'BLUE');
      el('teamscore' + idx).textContent = t.series != null ? t.series : 0;
      document.documentElement.style.setProperty(
        side === 'b' ? '--team-b' : '--team-a',
        t.color || (side === 'b' ? '#e97139' : '#055fdb')
      );
    }

    // ── Twitch prediction takeover ──────────────────────────────────────────
    // While a prediction is open the scorecard alternates between the scoreboard
    // face and a "who will win?" face carrying the live vote split. Producer rule:
    // gradients, never chasing outlines — the chrome is a wash + sheen sweep.
    const PRED_SHOW_MS = 8000;    // prediction face dwell
    const PRED_REST_MS = 14000;   // scoreboard dwell between prediction cards
    const PRED_RESULT_MS = 10000; // how long the result face stays up after RESOLVED
    let _predId = null;           // id of the prediction currently driving the bar
    let _predRetiredId = null;    // id whose result card already played out
    let _predResultShown = false;
    let _predSwapTimer = null;
    let _predResultTimer = null;
    let _predTickTimer = null;
    let _predLast = null;         // { pred, data } for the countdown ticker

    // The live prediction, or null when the bar should stay on the scoreboard.
    function activePrediction(data) {
      const p = (data.twitch && data.twitch.predictions) || {};
      const settings = p.settings || {};
      if (settings.overlayHidden) return null;   // producer force-hide
      const cur = p.current;
      if (!cur || !Array.isArray(cur.outcomes) || cur.outcomes.length < 2) return null;
      if (cur.id && cur.id === _predRetiredId) return null;
      const ends = cur.endsAt ? new Date(cur.endsAt).getTime() : 0;
      // A stale ACTIVE prediction (server restarted mid-window) never resolves — drop it.
      if (cur.state !== 'RESOLVED' && cur.state !== 'LOCKED' && ends && ends < Date.now()) return null;
      // A LOCKED prediction the streamer never resolved shouldn't cycle forever either.
      if (cur.state === 'LOCKED' && ends && Date.now() - ends > 5 * 60 * 1000) return null;
      return cur;
    }

    // Pair the two Twitch outcomes with the blue/orange sides by name, falling
    // back to outcome order when the titles don't resemble the team names.
    function predOutcomesBySide(pred, blue, orange) {
      const o0 = pred.outcomes[0] || {};
      const o1 = pred.outcomes[1] || {};
      const score = (title, name) => {
        const t = (title || '').toString().toLowerCase().trim();
        const n = (name || '').toString().toLowerCase().trim();
        if (!t || !n) return 0;
        if (t === n) return 2;
        return (t.includes(n) || n.includes(t)) ? 1 : 0;
      };
      // Match against the plate name too, so a prediction created as "ZAIN vs LIGHT" on a
      // head-to-head game still pairs with the right side.
      const sc = (title, team) => Math.max(score(title, team.name), score(title, team.soloName));
      const straight = sc(o0.title, blue) + sc(o1.title, orange);
      const swapped = sc(o1.title, blue) + sc(o0.title, orange);
      return swapped > straight ? [o1, o0] : [o0, o1];
    }

    function renderPredictionFace(pred, data) {
      const blue = SceneBase.teamSide(data, 'blue');
      const orange = SceneBase.teamSide(data, 'orange');
      const [oa, ob] = predOutcomesBySide(pred, blue, orange);

      SceneBase.applyTeamLogo(el('predlogo1'), blue.customLogo, blue.logo);
      SceneBase.applyTeamLogo(el('predlogo2'), orange.customLogo, orange.logo);
      // Same rule as the scoreboard face: on head-to-head games the side IS a player, so the
      // prediction card names the competitor rather than their entrant record.
      el('predname1').textContent = (blue.soloName || blue.name || oa.title || 'BLUE').toUpperCase();
      el('predname2').textContent = (orange.soloName || orange.name || ob.title || 'ORANGE').toUpperCase();

      const va = Number(oa.votes) || 0;
      const vb = Number(ob.votes) || 0;
      const total = va + vb;
      const pctA = total > 0 ? Math.round((va / total) * 100) : 50;
      const pctB = 100 - pctA;
      el('predpct1').textContent = pctA + '%';
      el('predpct2').textContent = pctB + '%';
      el('predfill1').style.width = pctA + '%';
      el('pred-side1').classList.toggle('is-lead', total > 0 && pctA > pctB);
      el('pred-side2').classList.toggle('is-lead', total > 0 && pctB > pctA);

      el('pred-question').textContent = (pred.title || 'Who will win?').toString();
      renderPredictionMeta(pred, [oa, ob]);
    }

    function renderPredictionMeta(pred, sides) {
      const meta = el('pred-meta');
      if (!meta) return;
      meta.className = 'pred-meta';
      if (pred.state === 'RESOLVED') {
        const win = pred.winningOutcomeId && sides.find(o => o.id === pred.winningOutcomeId);
        meta.classList.add('result');
        meta.textContent = win ? ('Result · ' + (win.title || '').toString().toUpperCase()) : 'Result';
        return;
      }
      if (pred.state === 'LOCKED') { meta.textContent = 'Votes locked'; return; }
      const rem = pred.endsAt ? Math.max(0, new Date(pred.endsAt).getTime() - Date.now()) : 0;
      if (!rem) { meta.textContent = 'Predict in chat'; return; }
      const m = Math.floor(rem / 60000);
      const s = Math.floor((rem % 60000) / 1000);
      if (rem < 30000) meta.classList.add('urgent');
      meta.textContent = 'Voting open · ' + m + ':' + String(s).padStart(2, '0');
    }

    // Alternate the two faces; `on` = prediction face showing.
    function predCycle(on) {
      clearTimeout(_predSwapTimer);
      const hud = el('match-hud');
      if (!hud) return;
      hud.classList.toggle('show-pred', on);
      _predSwapTimer = setTimeout(() => predCycle(!on), on ? PRED_SHOW_MS : PRED_REST_MS);
    }

    function predClear() {
      clearTimeout(_predSwapTimer); _predSwapTimer = null;
      clearTimeout(_predResultTimer); _predResultTimer = null;
      clearInterval(_predTickTimer); _predTickTimer = null;
      _predId = null;
      _predResultShown = false;
      _predLast = null;
      const hud = el('match-hud');
      if (hud) hud.classList.remove('show-pred', 'pred-live');
    }

    function renderPrediction(data) {
      const pred = activePrediction(data);
      const hud = el('match-hud');
      if (!hud) return;
      if (!pred) { if (_predId !== null) predClear(); return; }

      _predLast = { pred, data };
      hud.classList.add('pred-live');
      renderPredictionFace(pred, data);

      if (pred.id !== _predId) {
        // New prediction — punch straight to the prediction face, then start cycling.
        _predId = pred.id;
        _predResultShown = false;
        clearTimeout(_predResultTimer); _predResultTimer = null;
        predCycle(true);
        clearInterval(_predTickTimer);
        _predTickTimer = setInterval(() => {
          if (_predLast) renderPredictionMeta(_predLast.pred, predOutcomesBySide(
            _predLast.pred,
            SceneBase.teamSide(_predLast.data, 'blue'),
            SceneBase.teamSide(_predLast.data, 'orange')
          ));
        }, 1000);
      }

      // Result: hold the face on screen, then hand the bar back to the scoreboard.
      if (pred.state === 'RESOLVED' && !_predResultShown) {
        _predResultShown = true;
        clearTimeout(_predSwapTimer); _predSwapTimer = null;
        hud.classList.add('show-pred');
        _predResultTimer = setTimeout(() => {
          _predRetiredId = pred.id;
          predClear();
        }, PRED_RESULT_MS);
      }
    }

    function render(data) {
      data = data || {};
      applyBrandTheme(data);

      const casters = data.casters || {};
      el('stage').classList.toggle('show', SceneBase.casterStageVisible(casters));

      // Frames-only (separated OBS): lock to this layout's FIXED frame count (Duo = 2) so the
      // transparent holes line up exactly with the hardcoded OBS cam frames. (In combined mode the
      // layout can flex with the assigned-caster count.)
      rebuildCamLayout(NO_CAMS ? 2 : activeCamCount(casters));
      renderCasters(casters);
      renderCasterText(casters);

      const blue = SceneBase.teamSide(data, 'blue');
      const orange = SceneBase.teamSide(data, 'orange');
      renderTeam(1, blue, 'a');
      renderTeam(2, orange, 'b');

      const bo = data.bestOf || 5;
      const gameNum = (data.game && data.game.number != null) ? data.game.number : 1;
      el('vs-bo').textContent = 'BO' + bo;
      el('vs-game').textContent = 'GAME ' + gameNum;

      // Event bar is hidden via CSS; still populate it harmlessly.
      const evName = (data.eventName || '').toString().trim();
      el('duo-event').textContent = evName.toUpperCase();
      el('duo-eventbar').classList.toggle('is-empty', !evName);
      // Series meta bar: a custom label (e.g. "UPCOMING MATCH") overrides "BEST OF X · GAME X" when set.
      const gameLabel = (data.gameLabel || '').toString().trim();
      if (gameLabel) el('duo-bestof-text').textContent = gameLabel.toUpperCase();
      else el('duo-bestof-text').innerHTML = 'BEST OF <b>' + bo + '</b> &nbsp;·&nbsp; GAME <b>' + gameNum + '</b>';

      renderPresentedBy(data);
      renderBrandStrip(data);
      syncIdentityBar();
      renderDeckStrip(data);
      renderPrediction(data);
    }

    if (location.protocol === 'file:') {
      document.documentElement.classList.add('preview');
      render({
        casters: {
          visible: true,
          showCountry: true,
          lowerThird: 'Summer Showdown 2026 — Grand Final',
          list: [
            { id: 'c1', name: 'Jordan Reyes', handle: 'jreyescasts', camUrl: '', slot: 1, social: 'x', country: 'us' },
            { id: 'c2', name: 'Mia Tanaka', handle: 'miaplays', camUrl: '', slot: 2, social: 'twitch', country: 'jp' }
          ]
        },
        brand: {
          logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="90" height="34"><text x="4" y="25" font-size="22" fill="#e8eaf0" font-family="Arial" font-weight="bold">NE</text></svg>'),
          sponsors: [
            { name: 'Acme', logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="48"><text x="10" y="34" font-size="28" fill="#fff" font-family="Arial">ACME</text></svg>') },
            { name: 'Nova', logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="48"><text x="10" y="34" font-size="28" fill="#fff" font-family="Arial">NOVA</text></svg>') }
          ]
        },
        teams: {
          blue: { name: 'Velocity Gaming', color: '#3b82f6' },
          orange: { name: 'Team Apex Esports', color: '#f97316' }
        },
        game: { number: 2 },
        series: { blue: 1, orange: 0 },
        bestOf: 5,
        eventName: 'Summer Showdown 2026',
        scoreboardAd: {
          label: 'PRESENTED BY',
          logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40"><rect width="160" height="40" rx="4" fill="#1a1d24"/><text x="80" y="27" font-size="18" fill="#e8eaf0" text-anchor="middle" font-family="Arial" font-weight="bold">SPONSOR</text></svg>')
        },
        // Mock prediction so opening this file directly demos the scorecard takeover.
        twitch: {
          predictions: {
            current: {
              id: 'preview',
              title: 'Who takes Game 2?',
              state: 'ACTIVE',
              endsAt: new Date(Date.now() + 95 * 1000).toISOString(),
              outcomes: [
                { id: 'o1', title: 'Velocity Gaming', votes: 3300, users: 41 },
                { id: 'o2', title: 'Team Apex Esports', votes: 6700, users: 78 }
              ],
              winningOutcomeId: null
            }
          }
        },
        startgg: {
          matchFeed: [
            { setId: '1', round: 'Winners R2', teamA: 'Frost Esports', teamB: 'Ember Gaming', scoreA: 2, scoreB: 1, status: 'done' },
            { setId: '2', round: 'Winners R2', teamA: 'Nova Squad', teamB: 'Pulse FC', scoreA: 1, scoreB: 1, status: 'live' },
            { setId: '3', round: 'Losers R1', teamA: 'Team Apex', teamB: 'Velocity', scoreA: null, scoreB: null, status: 'upcoming' }
          ]
        }
      });
      el('stage').classList.add('show');
    } else {
      SceneBase.connect(data => render(data));
    }
  </script>
