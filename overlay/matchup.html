<!DOCTYPE html>
<!--
  matchup.html — pre-game matchup card
  Top bar: brand logo + event title.
  Two team halves: logo toward center (full opacity) + player roster below logo.
  Team names at bottom corners with dark scrim for readability.
  Dark center VS pillar.
  Driven by full_state: teams.blue/orange (name, color, logo, players, series), bestOf, eventName, roundLabel, brand.
  SMASH: the crest circle becomes the FIGHTER render — smash.<side>.character (the producer's pick
  in Match > Teams) first, then startggCharacters.<side> (start.gg's most-reported character for
  that entrant this event, a prior only — start.gg has no live "playing now" data).
  ?title=      override event label  ?title=off  hides it
  ?sponsors=0  hide the sponsor rail even if sponsors are configured
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root {
      --team-a: #22c55e;
      --team-b: #8b5cf6;
      --cw: 240px;
      --tb: 0px;      /* no top bar any more — halves centre on the full canvas */
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Stage ── */
    .mu-stage {
      position: absolute; inset: 0;
      display: grid;
      grid-template-columns: 1fr var(--cw) 1fr;
      opacity: 0; transition: opacity .55s ease;
    }
    .mu-stage.show { opacity: 1; }

    :root {
      --rail-h: 0px;
    }
    /* How much of the bottom of frame the rail covers, so the centre pillar's lit edges can run
       to the very top and stop cleanly ON the rail instead of being chopped off behind it. */
    .mu-stage.has-sponsors                  { --rail-h: 64px; }
    .mu-stage.has-eventline                 { --rail-h: 40px; }
    .mu-stage.has-sponsors.has-eventline    { --rail-h: 104px; }

    /* The card had a full-width TOP BAR (brand mark + event title) and a matching bottom rail.
       Both slabs are gone: the mark sits above the VS and the event name reads along the bottom
       under the sponsor rail, so the art is not boxed in top and bottom. */

    .mu-sponsors {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      height: 64px;
      background: rgba(5, 7, 14, .88);
      border-top: 1px solid rgba(255,255,255,.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; gap: 52px;
      padding: 0 60px;
    }
    .mu-sponsors.show { display: flex; }
    /* Brand mark, centred above the VS. */
    .mu-center-brand {
      max-width: 152px; max-height: 78px; object-fit: contain; margin-bottom: 20px;
      opacity: 0; transform: translateY(-8px);
      transition: opacity .6s ease .12s, transform .6s cubic-bezier(.16,.84,.24,1) .12s;
      filter: drop-shadow(0 4px 18px rgba(0,0,0,.7));
    }
    .mu-stage.show .mu-center-brand { opacity: 1; transform: none; }
    .mu-center-brand.is-hidden { display: none; }
    /* Event name along the very bottom, on its OWN line under the sponsor rail. The two used to
       share a single 104px plate, which read as one deep slab with two things floating in it.
       Split into two bands with a hairline between, the bottom reads as what it is: partners on
       one line, the event on the next, with a clear hierarchy between them. The event line is
       darker and shorter so it settles under the sponsor row rather than competing with it. */
    .mu-eventline {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 21;
      height: 40px; display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase;
      color: rgba(255,255,255,.66);
      background: rgba(3, 4, 9, .92);
      border-top: 1px solid rgba(255,255,255,.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-shadow: 0 2px 10px rgba(0,0,0,.85);
      opacity: 0; transition: opacity .6s ease .5s;
    }
    .mu-stage.show .mu-eventline { opacity: 1; }
    .mu-eventline.is-empty { display: none; }
    /* Two bands: the sponsor rail sits ON TOP of the event line rather than swallowing it. */
    .mu-stage.has-eventline .mu-sponsors { bottom: 40px; }
    .mu-stage.has-sponsors.has-eventline .mu-bottom { bottom: 104px; }
    .mu-stage.has-eventline:not(.has-sponsors) .mu-bottom { bottom: 40px; }
    .mu-sponsor-img {
      height: 34px; width: auto; max-width: 130px;
      object-fit: contain; opacity: .82;
      filter: drop-shadow(0 1px 6px rgba(0,0,0,.4));
    }
    /* push team name scrim up when sponsor rail is visible */
    .mu-stage.has-sponsors .mu-bottom { bottom: 64px; }

    /* ─────────────────────────────────────────────
       HALVES
    ───────────────────────────────────────────── */
    .mu-half {
      position: relative; overflow: hidden;
    }

    /* semi-transparent team color wash */
    .mu-half--a {
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--team-a) 62%, transparent) 0%,
        color-mix(in srgb, var(--team-a) 28%, transparent) 45%,
        transparent 85%
      );
    }
    .mu-half--b {
      background: linear-gradient(270deg,
        color-mix(in srgb, var(--team-b) 62%, transparent) 0%,
        color-mix(in srgb, var(--team-b) 28%, transparent) 45%,
        transparent 85%
      );
    }

    /* radial glow */
    .mu-half::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
    }
    .mu-half--a::before {
      background: radial-gradient(ellipse 65% 70% at 48% 52%, color-mix(in srgb, var(--team-a) 22%, transparent), transparent);
    }
    .mu-half--b::before {
      background: radial-gradient(ellipse 65% 70% at 52% 52%, color-mix(in srgb, var(--team-b) 22%, transparent), transparent);
    }

    /* ─────────────────────────────────────────────
       LOGO + PLAYERS (toward center, full opacity)
    ───────────────────────────────────────────── */
    .mu-logo-block {
      position: absolute;
      /* center horizontally in the column, vertically in the content area below topbar */
      top: calc(var(--tb) / 2 + 50%);
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center;
      gap: 18px; z-index: 5;
    }

    /* Large background watermark — same logo, larger, behind the foreground logo */
    .mu-logo-bg {
      position: absolute; top: 50%; left: 50%;
      width: 1080px; height: 1080px;
      object-fit: contain;
      opacity: 0;
      transition: opacity .9s ease .18s, transform .9s cubic-bezier(.16,.84,.24,1) .18s;
    }
    .mu-half--a .mu-logo-bg { transform: translate(-53%, -50%) scale(.84); }
    .mu-half--b .mu-logo-bg { transform: translate(-47%, -50%) scale(.84); }
    .mu-stage.show .mu-half--a .mu-logo-bg { opacity: .18; transform: translate(-53%, -50%) scale(1); }
    .mu-stage.show .mu-half--b .mu-logo-bg { opacity: .18; transform: translate(-47%, -50%) scale(1); }
    /* Character watermark: the same slot, but a fighter render is a FIGURE rather than a mark, so
       it wants to be bigger and stood on the floor of the half instead of centred on the crest. */
    .mu-logo-bg.is-fighter { object-fit: contain; object-position: bottom center; }
    .mu-half--a .mu-logo-bg.is-fighter { transform: translate(-52%, -44%) scale(1.02); }
    .mu-half--b .mu-logo-bg.is-fighter { transform: translate(-48%, -44%) scale(1.02); }
    /* The fighter render is scenery, not content — it sits behind the crest, the player names and
       the pips, all of which have to stay legible over it. Dropped from .22 -> .12 -> .07. */
    .mu-stage.show .mu-half--a .mu-logo-bg.is-fighter { opacity: .07; transform: translate(-52%, -44%) scale(1.22); }
    .mu-stage.show .mu-half--b .mu-logo-bg.is-fighter { opacity: .07; transform: translate(-48%, -44%) scale(1.22); }

    .mu-logo-fg {
      width: 300px; height: 300px;
      object-fit: contain;
      opacity: 0;
      transform: scale(.82);
      transition: opacity .7s ease .22s, transform .75s cubic-bezier(.16,.84,.24,1) .22s;
      filter: drop-shadow(0 6px 28px rgba(0,0,0,.75)) drop-shadow(0 2px 8px rgba(0,0,0,.5));
    }
    .mu-stage.show .mu-logo-fg {
      opacity: 1; transform: scale(1);
    }
    /* Default/monochrome game logo (e.g. the Rocket League mark) sits on a dark stage → render it
       white instead of black. Matches the treatment used across the other scenes. */
    .mu-logo-fg.logo-on-dark {
      filter: brightness(0) invert(1) drop-shadow(0 6px 28px rgba(0,0,0,.6)) drop-shadow(0 2px 8px rgba(0,0,0,.5));
    }
    .mu-logo-bg.logo-on-dark { filter: brightness(0) invert(1); }

    /* Abbreviation crest — shown in place of the logo when a team has no custom logo (instead of a
       default game logo). Same 300px footprint + entrance animation as the logo. */
    .mu-logo-abbr {
      width: 300px; height: 300px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit; font-weight: 900; font-size: 118px; line-height: 1;
      letter-spacing: .02em; text-transform: uppercase; color: #fff;
      background: radial-gradient(circle at 50% 34%, rgba(42,46,58,.96), rgba(13,15,21,.98));
      text-shadow: 0 4px 20px rgba(0,0,0,.9), 0 1px 4px rgba(0,0,0,.9);
      opacity: 0; transform: scale(.82);
      transition: opacity .7s ease .22s, transform .75s cubic-bezier(.16,.84,.24,1) .22s;
    }
    .mu-half--a .mu-logo-abbr { border: 6px solid var(--team-a);
      box-shadow: 0 0 40px -4px var(--team-a), inset 0 0 44px rgba(0,0,0,.5), 0 6px 28px rgba(0,0,0,.6); }
    .mu-half--b .mu-logo-abbr { border: 6px solid var(--team-b);
      box-shadow: 0 0 40px -4px var(--team-b), inset 0 0 44px rgba(0,0,0,.5), 0 6px 28px rgba(0,0,0,.6); }
    .mu-stage.show .mu-logo-abbr { opacity: 1; transform: scale(1); }

    /* Fighter portrait in the crest circle (Smash). Same 300px disc as the abbreviation fallback,
       with the render standing on the floor of it rather than centred, so the character reads as a
       figure on a plinth instead of a floating cut-out. */
    .mu-fighter {
      width: 300px; height: 300px; border-radius: 50%; overflow: hidden; position: relative;
      background: radial-gradient(circle at 50% 34%, rgba(42,46,58,.96), rgba(13,15,21,.98));
      opacity: 0; transform: scale(.82);
      transition: opacity .7s ease .22s, transform .75s cubic-bezier(.16,.84,.24,1) .22s;
    }
    .mu-half--a .mu-fighter { border: 6px solid var(--team-a);
      box-shadow: 0 0 40px -4px var(--team-a), inset 0 0 44px rgba(0,0,0,.5), 0 6px 28px rgba(0,0,0,.6); }
    .mu-half--b .mu-fighter { border: 6px solid var(--team-b);
      box-shadow: 0 0 40px -4px var(--team-b), inset 0 0 44px rgba(0,0,0,.5), 0 6px 28px rgba(0,0,0,.6); }
    .mu-stage.show .mu-fighter { opacity: 1; transform: scale(1); }
    .mu-fighter img {
      position: absolute; left: 50%; bottom: -6%; transform: translateX(-50%);
      height: 96%; width: auto; object-fit: contain;
      filter: drop-shadow(0 8px 22px rgba(0,0,0,.65));
    }


    /* Player name list */
    .mu-players {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      opacity: 0; transition: opacity .5s ease .6s;
    }
    .mu-stage.show .mu-players { opacity: 1; }

    .mu-player-real { font-size: 13px; font-weight: 500; letter-spacing: .04em;
      color: rgba(255,255,255,.55); text-transform: none; line-height: 1.1; margin-top: 1px; }
    .mu-player-custom { font-size: 12px; font-weight: 600; letter-spacing: .04em;
      color: rgba(255,255,255,.45); text-transform: none; font-style: italic; line-height: 1.1; margin-top: 1px; }
    .mu-player {
      font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
      color: #fff; line-height: 1.45;
      text-shadow: 0 2px 14px rgba(0,0,0,.95), 0 1px 4px rgba(0,0,0,.9);
      /* The row is only as wide as its widest line, so a real name longer than the gamertag
         (or vice versa) left-aligned both against that box instead of stacking centred.
         .mu-players centres the BOXES; this centres the text inside each one. */
      text-align: center;
    }

    /* ─────────────────────────────────────────────
       TEAM NAME (bottom corners, dark scrim)
    ───────────────────────────────────────────── */
    .mu-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 70px 58px 50px;
      /* dark gradient behind names for legibility */
      background: linear-gradient(to top,
        rgba(0,0,0,.78) 0%,
        rgba(0,0,0,.42) 50%,
        transparent 100%
      );
      z-index: 6;
    }
    .mu-bottom--b { text-align: right; }

    .mu-city {
      font-size: 18px; font-weight: 700;
      letter-spacing: .36em; text-transform: uppercase;
      color: #fff; line-height: 1; margin-bottom: 2px;
      text-shadow: 0 2px 14px rgba(0,0,0,.95), 0 1px 4px rgba(0,0,0,.9);
    }
    .mu-city.is-empty { display: none; }

    .mu-teamname {
      font-size: 88px; font-weight: 900;
      letter-spacing: .03em; text-transform: uppercase; line-height: .88;
      color: #fff;
    }
    .mu-half--a .mu-teamname {
      text-shadow:
        0 0 60px color-mix(in srgb, var(--team-a) 65%, transparent),
        0 4px 20px rgba(0,0,0,.95),
        0 1px 4px rgba(0,0,0,.9);
    }
    .mu-half--b .mu-teamname {
      text-shadow:
        0 0 60px color-mix(in srgb, var(--team-b) 65%, transparent),
        0 4px 20px rgba(0,0,0,.95),
        0 1px 4px rgba(0,0,0,.9);
    }

    .mu-stage.show .mu-bottom    { animation: slideUp .72s cubic-bezier(.16,.84,.24,1) .44s both; }
    .mu-stage.show .mu-bottom--b { animation: slideUp .72s cubic-bezier(.16,.84,.24,1) .54s both; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(36px); }
      to   { opacity: 1; transform: none; }
    }

    /* series pip row */
    .mu-pips { display: flex; gap: 6px; margin-top: 10px; }
    /* Side B fills from its OUTER edge inward, mirroring side A, so the two rows meet in the
       middle instead of both marching right. row-reverse flips the main axis, so flex-START is
       what now packs the row against the right-hand edge. */
    .mu-bottom--b .mu-pips { flex-direction: row-reverse; justify-content: flex-start; }
    .mu-pip {
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.22);
    }
    .mu-pip.won { background: #fff; border-color: #fff; }
    .mu-half--a .mu-pip.won { background: var(--team-a); border-color: var(--team-a); box-shadow: 0 0 8px var(--team-a); }
    .mu-half--b .mu-pip.won { background: var(--team-b); border-color: var(--team-b); box-shadow: 0 0 8px var(--team-b); }

    /* ─────────────────────────────────────────────
       CENTER PILLAR
    ───────────────────────────────────────────── */
    .mu-center {
      position: relative; z-index: 10;
      background: linear-gradient(180deg, rgba(6,8,16,.88) 0%, rgba(11,14,24,.92) 50%, rgba(6,8,16,.88) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;
      box-shadow:
        -40px 0 80px rgba(0,0,0,.55),
         40px 0 80px rgba(0,0,0,.55);
    }

    /* The lit edges run from the TOP OF FRAME down to the rail. The old 8% inset was sized around
       a full-width top bar that no longer exists, so it left a dead gap where the pillar had no
       lit edge at all. The gradient comes up quickly (lit by 14%) so the line reads as reaching
       the top rather than fading in halfway down. */
    .mu-center::before, .mu-center::after {
      content: ''; position: absolute; top: 0; bottom: var(--rail-h, 0px); width: 2px;
    }
    .mu-center::before {
      left: 0;
      background: linear-gradient(to bottom, transparent 0%, var(--team-a) 14%, var(--team-a) 50%, transparent 100%);
      box-shadow: 0 0 24px var(--team-a), 0 0 8px var(--team-a);
    }
    .mu-center::after {
      right: 0;
      background: linear-gradient(to bottom, transparent 0%, var(--team-b) 14%, var(--team-b) 50%, transparent 100%);
      box-shadow: 0 0 24px var(--team-b), 0 0 8px var(--team-b);
    }

    .mu-divider {
      width: 80px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.2), transparent);
      margin: 8px 0;
    }
    .mu-round {
      font-size: 11px; font-weight: 800; letter-spacing: .4em; text-transform: uppercase;
      color: rgba(255,255,255,.3); text-align: center; padding: 0 16px; line-height: 1.4;
    }
    .mu-round.is-empty { display: none; }

    .mu-vs-text {
      font-size: 160px; font-weight: 900; line-height: 1;
      letter-spacing: -.01em; color: #fff;
      text-shadow: 0 0 80px rgba(255,255,255,.08);
    }
    .mu-stage.show .mu-vs-text {
      animation: vsIn .85s cubic-bezier(.16,.84,.24,1) .05s both;
    }
    @keyframes vsIn {
      from { opacity: 0; transform: scale(.65); }
      to   { opacity: 1; transform: scale(1); }
    }

    .mu-score {
      display: flex; align-items: center; gap: 14px;
      font-size: 52px; font-weight: 900; line-height: 1;
    }
    .mu-score .sa { color: var(--team-a); }
    .mu-score .sb { color: var(--team-b); }
    .mu-score .sep { color: rgba(255,255,255,.25); font-size: 34px; }
    .mu-score.is-zero { display: none; }

    .mu-bo-label {
      font-size: 18px; font-weight: 800; letter-spacing: .35em; text-transform: uppercase;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="stage" class="mu-stage">

    <!-- Sponsor rail, and the event name directly under it. The card used to wear a full-width
         slab across the top carrying the brand mark + event; the mark now sits above the VS in the
         centre pillar and the event reads along the bottom, so neither long bar is needed. -->
    <div class="mu-sponsors" id="sponsors"></div>
    <div class="mu-eventline" id="tb-event"></div>

    <!-- ── Left: Team A ── -->
    <div class="mu-half mu-half--a">
      <img id="logo1bg" class="mu-logo-bg" alt="">
      <div class="mu-logo-block">
        <img id="logo1" class="mu-logo-fg" alt="">
        <div id="abbr1" class="mu-logo-abbr" style="display:none;"></div>
        <div id="fighter1" class="mu-fighter" style="display:none;"><img alt=""></div>
        <div id="players1" class="mu-players"></div>
      </div>
      <div class="mu-bottom">
        <div id="city1" class="mu-city is-empty"></div>
        <div id="name1" class="mu-teamname">BLUE</div>
        <div id="pips1" class="mu-pips"></div>
      </div>
    </div>

    <!-- ── Center pillar ── -->
    <div class="mu-center">
      <img class="mu-center-brand is-hidden" id="brand-logo" src="" alt="">
      <div id="round" class="mu-round is-empty"></div>
      <div class="mu-divider"></div>
      <div class="mu-vs-text">VS</div>
      <div class="mu-score is-zero" id="scorerow">
        <span class="sa" id="sa">0</span>
        <span class="sep">–</span>
        <span class="sb" id="sb">0</span>
      </div>
      <div class="mu-divider"></div>
      <div id="bo" class="mu-bo-label">BEST OF 5</div>
    </div>

    <!-- ── Right: Team B ── -->
    <div class="mu-half mu-half--b">
      <img id="logo2bg" class="mu-logo-bg" alt="">
      <div class="mu-logo-block">
        <img id="logo2" class="mu-logo-fg" alt="">
        <div id="abbr2" class="mu-logo-abbr" style="display:none;"></div>
        <div id="fighter2" class="mu-fighter" style="display:none;"><img alt=""></div>
        <div id="players2" class="mu-players"></div>
      </div>
      <div class="mu-bottom mu-bottom--b">
        <div id="city2" class="mu-city is-empty"></div>
        <div id="name2" class="mu-teamname">ORANGE</div>
        <div id="pips2" class="mu-pips"></div>
      </div>
    </div>

  </div>

  <script src="scene-base.js"></script>
  <script src="smash-fighters.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const QP = new URLSearchParams(location.search);

    function splitTeamName(name) {
      const parts = (name || '').trim().split(/\s+/);
      if (parts.length < 2) return { city: '', team: (name || '').toUpperCase() };
      return {
        city: parts.slice(0, -1).join(' ').toUpperCase(),
        team: parts[parts.length - 1].toUpperCase()
      };
    }

    // Team-name abbreviation (matches the social card: explicit abbr → initials → first 3 letters).
    function teamAbbr(team) {
      const name = ((team && team.name) || '').trim();
      if (!name) return '?';
      if (team && team.abbr) return String(team.abbr).toUpperCase().slice(0, 4);
      const words = name.split(/\s+/).filter(Boolean);
      if (words.length >= 2) return words.map((w) => w[0]).join('').toUpperCase().slice(0, 4);
      return name.slice(0, 3).toUpperCase();
    }

    // Fighter art belongs to Smash and ONLY Smash — same rule standings.html uses for the placement
    // board: the game must declare the 'stocks' feature. state.smash persists across events, so
    // without this gate a fighter picked during a Smash night reappears as the crest on the next
    // Rocket League matchup — and the Match > Teams Smash strip is hidden off Smash, so the producer
    // has no way to clear it.
    function isSmashGame(data) {
      const gameDef = (data.games || {})[data.activeGame] || {};
      return (gameDef.features || []).indexOf('stocks') >= 0;
    }
    // Which fighter to show for a side. The producer's pick in Match > Teams is authoritative —
    // they are watching the match. start.gg's reported character is only a PRIOR: selections exist
    // only once a game has been reported, so for the set about to be played it is really "what they
    // played earlier in this bracket", which a counterpick makes wrong. Manual therefore wins.
    function fighterFor(data, side) {
      if (typeof SmashFighters === 'undefined') return null;
      if (!isSmashGame(data)) return null;
      const manual = ((data.smash && data.smash[side] && data.smash[side].character) || '').trim();
      const reported = ((data.startggCharacters && data.startggCharacters[side]) || '').trim();
      return SmashFighters.resolve(manual || reported);
    }
    // Crest circle → fighter render when we know one, else the usual logo/abbreviation.
    // The crest disc plus the big low-opacity render behind it. No fighter NAME anywhere — the
    // art is the label.
    function setFighterCrest(n, f, bgImg) {
      const disc = el('fighter' + n);
      if (!disc) return false;
      if (!f) { disc.style.display = 'none'; return false; }
      const url = SmashFighters.renderUrl(f.slug);
      const img = disc.querySelector('img');
      if (img && img.getAttribute('src') !== url) img.src = url;
      disc.style.display = '';
      // Reuse the team-logo watermark slot for the character, scaled up on that side's half.
      if (bgImg) {
        if (bgImg.getAttribute('src') !== url) bgImg.src = url;
        bgImg.classList.remove('logo-on-dark');
        bgImg.classList.add('is-fighter');
        bgImg.style.display = '';
      }
      return true;
    }

    // Show the team logo, or fall back to the name abbreviation when there's no custom logo
    // (rather than a default game logo).
    function setTeamCrest(logoImg, bgImg, abbrEl, team) {
      const custom = ((team && team.customLogo) || '').trim();
      if (custom) {
        SceneBase.applyTeamLogo(bgImg, custom, team.logo);
        SceneBase.applyTeamLogo(logoImg, custom, team.logo);
        if (abbrEl) abbrEl.style.display = 'none';
      } else {
        if (logoImg) logoImg.style.display = 'none';
        if (bgImg) bgImg.style.display = 'none';
        if (abbrEl) { abbrEl.textContent = teamAbbr(team); abbrEl.style.display = ''; }
      }
    }

    function renderPips(container, won, needed) {
      container.innerHTML = '';
      for (let i = 0; i < (needed || 0); i++) {
        const d = document.createElement('div');
        d.className = 'mu-pip' + (i < (won || 0) ? ' won' : '');
        container.appendChild(d);
      }
    }

    // SINGLES: the roster is one player and the team name at the bottom of the half is already
    // that same person, so the line under the crest just says it twice. Only list a roster when
    // there is actually a squad to list.
    function renderPlayers(container, players, profiles, showRealName) {
      container.innerHTML = '';
      const roster = players || [];
      container.style.display = roster.length > 1 ? '' : 'none';
      if (roster.length <= 1) return;
      (players || []).slice(0, 6).forEach((p) => {
        const tag = (p.gamertag || p.gamerTag || p.name || '');
        if (!tag) return;
        const d = document.createElement('div');
        d.className = 'mu-player';
        d.textContent = tag.toUpperCase();
        // Real name IN ADDITION to the gamertag — from the player record or the
        // start.gg profile registry (keyed by trimmed-lowercase gamertag). Gated on the same
        // "Show real names" switch the Line-up and Bracket graphics use (intro.showRealName),
        // so turning it off clears the legal names everywhere at once.
        const prof = (profiles || {})[tag.trim().toLowerCase()] || {};
        const real = showRealName ? (p.realName || prof.realName || '').trim() : '';
        if (real) {
          const r = document.createElement('div');
          r.className = 'mu-player-real';
          r.textContent = real;
          d.appendChild(r);
        }
        const custom = (p.customField || '').toString().trim();
        if (custom) {
          const c = document.createElement('div');
          c.className = 'mu-player-custom';
          c.textContent = custom;
          d.appendChild(c);
        }
        container.appendChild(d);
      });
    }

    function render(data) {
      data = data || {};
      el('stage').classList.add('show');

      const blue   = SceneBase.teamSide(data, 'blue');
      const orange = SceneBase.teamSide(data, 'orange');
      const bo     = data.bestOf || 5;
      const winsNeeded = Math.ceil(bo / 2);

      // ── Brand mark (above the VS) + event line (under the sponsor rail) ──
      const brandLogo = (data.brand && data.brand.logo) ? data.brand.logo : '';
      const brandEl = el('brand-logo');
      SceneBase.applyTeamLogo(brandEl, brandLogo, '');
      brandEl.classList.toggle('is-hidden', !brandLogo);

      let titleText = '';
      const qt = QP.get('title');
      if (qt != null) { titleText = /^(off|none|hide|0)$/i.test(qt.trim()) ? '' : qt.trim(); }
      else { titleText = (data.eventName || '').toString().trim(); }
      const evLine = el('tb-event');
      evLine.textContent = titleText.toUpperCase();
      evLine.classList.toggle('is-empty', !titleText);
      el('stage').classList.toggle('has-eventline', !!titleText);

      // Round/stage label — shown only in the center pillar (above the VS); no longer duplicated
      // under the event title in the top bar.
      const roundText = (data.roundLabel || '').toString().trim();
      el('round').textContent = roundText.toUpperCase();
      el('round').classList.toggle('is-empty', !roundText);

      // ── Sponsor rail ── (?sponsors=0 to suppress)
      const sponsorsEl = el('sponsors');
      const showSponsors = QP.get('sponsors') !== '0';
      // RAIL placement only. This used to take brand.sponsors (everything), so a kit that had
      // carefully tagged its rail logos got the untagged pile instead — brand mark included.
      // The untagged list is still the fallback for a kit that tags nothing at all.
      const brandK = (data.brand || {});
      const anyTagged = (brandK.deskSponsors || []).length || (brandK.railSponsors || []).length
                      || (brandK.bannerSponsors || []).length;
      const sponsors = showSponsors
        ? ((brandK.railSponsors || []).length ? brandK.railSponsors
           : (anyTagged ? [] : (brandK.sponsors || []))).filter((s) => s && s.logo)
        : [];
      sponsorsEl.innerHTML = sponsors.map((s) =>
        `<img class="mu-sponsor-img" src="${s.logo}" alt="${(s.name || '').replace(/"/g, '')}">`
      ).join('');
      sponsorsEl.classList.toggle('show', sponsors.length > 0);
      el('stage').classList.toggle('has-sponsors', sponsors.length > 0);

      // ── Team A ──
      document.documentElement.style.setProperty('--team-a', blue.color || '#22c55e');
      // A known fighter replaces the crest entirely for that side.
      const f1 = fighterFor(data, 'blue');
      if (setFighterCrest('1', f1, el('logo1bg'))) {
        const e = el('logo1'); if (e) e.style.display = 'none';
        const a = el('abbr1'); if (a) a.style.display = 'none';
      } else { const bg = el('logo1bg'); if (bg) bg.classList.remove('is-fighter');
               setTeamCrest(el('logo1'), bg, el('abbr1'), blue); }
      const an = splitTeamName(blue.name);
      el('city1').textContent = an.city;
      el('city1').classList.toggle('is-empty', !an.city);
      el('name1').textContent = an.team;
      renderPips(el('pips1'), blue.series, winsNeeded);
      const showRealName = !!(data.intro && data.intro.showRealName);
      renderPlayers(el('players1'), blue.players, data.playerProfiles, showRealName);

      // ── Team B ──
      document.documentElement.style.setProperty('--team-b', orange.color || '#8b5cf6');
      const f2 = fighterFor(data, 'orange');
      if (setFighterCrest('2', f2, el('logo2bg'))) {
        const e = el('logo2'); if (e) e.style.display = 'none';
        const a = el('abbr2'); if (a) a.style.display = 'none';
      } else { const bg = el('logo2bg'); if (bg) bg.classList.remove('is-fighter');
               setTeamCrest(el('logo2'), bg, el('abbr2'), orange); }
      const bn = splitTeamName(orange.name);
      el('city2').textContent = bn.city;
      el('city2').classList.toggle('is-empty', !bn.city);
      el('name2').textContent = bn.team;
      renderPips(el('pips2'), orange.series, winsNeeded);
      renderPlayers(el('players2'), orange.players, data.playerProfiles, showRealName);

      // ── Center ──
      const sa = blue.series ?? 0;
      const sb = orange.series ?? 0;
      el('sa').textContent = sa;
      el('sb').textContent = sb;
      el('scorerow').classList.toggle('is-zero', sa === 0 && sb === 0);
      el('bo').textContent = 'BEST OF ' + bo;
    }

    if (location.protocol === 'file:') {
      render({
        teams: {
          blue: {
            name: 'Texas OpTic', color: '#22c55e', logo: '',
            players: [{ gamertag: 'iLLeY' }, { gamertag: 'Scump' }, { gamertag: 'Shotzzy' }, { gamertag: 'Dashy' }, { gamertag: 'Pred' }]
          },
          orange: {
            name: 'Toronto Ultra', color: '#7c3aed', logo: '',
            players: [{ gamertag: 'Insight' }, { gamertag: 'Cammy' }, { gamertag: 'Gwinn' }, { gamertag: 'CleanX' }, { gamertag: 'HyDra' }]
          }
        },
        series: { blue: 1, orange: 2 }, bestOf: 5,
        eventName: 'Summer Showdown 2024',
        roundLabel: 'Grand Final',
        brand: { logo: '' }
      });
    } else {
      SceneBase.connect((data) => { SceneBase.applySceneConfig('matchup', data); render(data); });
    }
  </script>
</body>
</html>
