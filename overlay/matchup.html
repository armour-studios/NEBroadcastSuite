<!DOCTYPE html>
<!--
  matchup.html — pre-game "tale of the tape": logo VS logo with team names, series
  score, and each team's roster (country flag, name, position, social). duorow design
  language; driven by full_state (teams[].players, series, eventName, playerProfiles).
  No baked background — the Scenes page sets fill colour + opacity per graphic.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --duo-surface: #1a1d24; --duo-surface2: #20242e; --duo-border: #2e3340;
      --duo-accent: #e83a8b; --duo-accent2: #8b5cf6; --duo-muted: #8b93a8;
      --team-a: #055fdb; --team-b: #e97139;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: 'Inter', system-ui, sans-serif; color: #e8eaf0; -webkit-font-smoothing: antialiased; }

    .mu-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      padding: 52px 70px 46px; opacity: 0; transition: opacity .4s ease; }
    .mu-stage.show { opacity: 1; }

    /* Header */
    .mu-header { flex: 0 0 auto; text-align: center; margin-bottom: 26px; }
    .mu-eyebrow { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .42em; text-transform: uppercase; color: var(--duo-accent); }
    .mu-title { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 700; font-size: 46px; letter-spacing: .02em; text-transform: uppercase; color: #fff; line-height: 1; margin-top: 2px; }
    .mu-title.is-empty { display: none; }

    /* Hero — logo VS logo */
    .mu-hero { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 220px 1fr; align-items: center; width: 100%;
      max-width: 1480px; margin-bottom: 30px; }
    .mu-side { display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; }
    .mu-stage.show .mu-side--a { animation: inL .7s cubic-bezier(.16,.84,.24,1) .1s both; }
    .mu-stage.show .mu-side--b { animation: inR .7s cubic-bezier(.16,.84,.24,1) .18s both; }
    @keyframes inL { from { opacity: 0; transform: translateX(-44px); } to { opacity: 1; transform: none; } }
    @keyframes inR { from { opacity: 0; transform: translateX(44px); } to { opacity: 1; transform: none; } }
    .mu-logo-wrap { width: 192px; height: 192px; border-radius: 26px; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 35%, var(--duo-surface2), #0c0e13); border: 1px solid var(--duo-border);
      box-shadow: 0 20px 50px rgba(0,0,0,.5); position: relative; }
    .mu-side--a .mu-logo-wrap { box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 0 2px color-mix(in srgb, var(--team-a) 45%, transparent); }
    .mu-side--b .mu-logo-wrap { box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 0 2px color-mix(in srgb, var(--team-b) 45%, transparent); }
    .mu-logo-wrap::before { content: ''; position: absolute; left: 14%; right: 14%; bottom: -3px; height: 3px; border-radius: 2px; }
    .mu-side--a .mu-logo-wrap::before { background: var(--team-a); box-shadow: 0 0 18px color-mix(in srgb, var(--team-a) 70%, transparent); }
    .mu-side--b .mu-logo-wrap::before { background: var(--team-b); box-shadow: 0 0 18px color-mix(in srgb, var(--team-b) 70%, transparent); }
    .mu-logo { width: 140px; height: 140px; object-fit: contain; filter: drop-shadow(0 6px 16px rgba(0,0,0,.5)); }
    .mu-logo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 6px 16px rgba(0,0,0,.5)); }
    .mu-name { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 700; font-size: 42px; text-transform: uppercase; color: #fff;
      text-align: center; line-height: .96; max-width: 540px; }
    .mu-side--a .mu-name { text-shadow: 0 0 22px color-mix(in srgb, var(--team-a) 45%, transparent); }
    .mu-side--b .mu-name { text-shadow: 0 0 22px color-mix(in srgb, var(--team-b) 45%, transparent); }
    .mu-tstat { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--duo-muted); }
    .mu-tstat b { color: #fff; font-size: 19px; }
    .mu-tstat.is-empty { display: none; }

    .mu-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .mu-vs { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center;
      font-family: 'Rajdhani','Inter',sans-serif; font-weight: 900; font-size: 46px; color: #fff;
      background: radial-gradient(circle at 50% 35%, var(--duo-surface2), #0b0d12); border: 2px solid var(--duo-accent);
      box-shadow: 0 0 0 6px rgba(8,10,14,.9), 0 14px 34px rgba(0,0,0,.6); }
    .mu-series { display: flex; align-items: center; gap: 12px; font-family: 'Rajdhani','Inter',sans-serif; font-weight: 900; font-size: 46px; line-height: 1; }
    .mu-series .sa { color: var(--team-a); } .mu-series .sb { color: var(--team-b); } .mu-series .sep { color: var(--duo-muted); font-size: 30px; }
    .mu-bo { font-size: 13px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--duo-muted); }

    /* Rosters */
    .mu-rosters { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 1fr 220px 1fr; align-content: start; align-items: stretch;
      width: 100%; max-width: 1480px; gap: 0 0; }
    /* Both columns stretch to the taller roster's height and centre their rows, so a
       3-vs-4 (or any uneven count) stays balanced around a shared midline. */
    .mu-roster { display: flex; flex-direction: column; justify-content: center; gap: 9px; opacity: 0; }
    .mu-stage.show .mu-roster--a { animation: inUp .6s cubic-bezier(.16,.84,.24,1) .3s both; }
    .mu-stage.show .mu-roster--b { animation: inUp .6s cubic-bezier(.16,.84,.24,1) .38s both; }
    @keyframes inUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    .mu-prow { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-radius: 10px;
      background: linear-gradient(180deg, var(--duo-surface2), var(--duo-surface)); border: 1px solid var(--duo-border); position: relative; }
    .mu-prow::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 10px 0 0 10px; }
    .mu-roster--a .mu-prow::before { background: var(--team-a); } .mu-roster--b .mu-prow::before { background: var(--team-b); }
    .mu-roster--b .mu-prow { flex-direction: row-reverse; text-align: right; }
    .mu-roster--b .mu-prow::before { left: auto; right: 0; border-radius: 0 10px 10px 0; }
    .mu-flag { font-size: 22px; line-height: 1; flex: 0 0 auto; width: 26px; text-align: center; }
    .mu-pid { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
    .mu-roster--b .mu-pid { align-items: flex-end; }
    .mu-pname { font-size: 26px; font-weight: 800; color: #eef1f7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
    .mu-psocial { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--duo-muted); }
    .mu-psocial.is-empty { display: none; }
    .mu-psocial i { font-size: 13px; }
    .mu-psocial i.fa-twitch { color: #9146ff; } .mu-psocial i.fa-x-twitter { color: #e8eaf0; } .mu-psocial i.fa-youtube { color: #ff0033; }
    .mu-rank { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; padding: 0 7px; border-radius: 5px;
      font-size: 14px; font-weight: 800; color: #fff; flex: 0 0 auto; }
    .mu-roster--a .mu-rank { background: linear-gradient(135deg, var(--team-a), color-mix(in srgb, var(--team-a) 55%, #000)); }
    .mu-roster--b .mu-rank { background: linear-gradient(135deg, var(--team-b), color-mix(in srgb, var(--team-b) 55%, #000)); }
    .mu-prole { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--duo-muted); flex: 0 0 auto; }
    .mu-prole.is-cap { color: #fff; background: linear-gradient(135deg, var(--duo-accent), var(--duo-accent2)); padding: 3px 8px; border-radius: 5px; }
    .mu-prole.is-sub { color: #f0b860; } .mu-prole.is-alt { color: var(--duo-muted); }
    .mu-empty { color: var(--duo-muted); font-size: 16px; padding: 14px; text-align: center; }
    .mu-mid-spacer { }
  </style>
</head>
<body>
  <div id="stage" class="mu-stage">
    <div class="mu-header">
      <div class="mu-eyebrow">Matchup</div>
      <div class="mu-title is-empty" id="title"></div>
    </div>
    <div class="mu-hero">
      <div class="mu-side mu-side--a">
        <div class="mu-logo-wrap"><img id="logo1" class="mu-logo" alt=""></div>
        <div id="name1" class="mu-name">BLUE</div>
        <div id="stat1" class="mu-tstat is-empty"></div>
      </div>
      <div class="mu-center">
        <div class="mu-vs">VS</div>
        <div class="mu-series"><span class="sa" id="sa">0</span><span class="sep">–</span><span class="sb" id="sb">0</span></div>
        <div class="mu-bo" id="bo">BEST OF 5</div>
      </div>
      <div class="mu-side mu-side--b">
        <div class="mu-logo-wrap"><img id="logo2" class="mu-logo" alt=""></div>
        <div id="name2" class="mu-name">ORANGE</div>
        <div id="stat2" class="mu-tstat is-empty"></div>
      </div>
    </div>
    <div class="mu-rosters">
      <div class="mu-roster mu-roster--a" id="roster1"></div>
      <div class="mu-mid-spacer"></div>
      <div class="mu-roster mu-roster--b" id="roster2"></div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const QP = new URLSearchParams(location.search);
    const QTITLE = QP.get('title');
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
    function flagEmoji(cc) { cc = (cc || '').toUpperCase(); if (!/^[A-Z]{2}$/.test(cc)) return ''; return String.fromCodePoint(...[...cc].map((c) => 0x1F1E6 + c.charCodeAt(0) - 65)); }
    function resolveTitle(data) {
      if (QTITLE != null) { const t = QTITLE.trim(); return /^(off|none|hide|0)$/i.test(t) ? '' : t; }
      return (data.eventName || '').toString().trim();
    }
    function profileFor(data, p) {
      const tag = (p.gamerTag || p.name || '').trim().toLowerCase();
      return (tag && data.playerProfiles && data.playerProfiles[tag]) || null;
    }
    function posClass(role) {
      const r = (role || '').toLowerCase();
      if (/cap|\(c\)|captain/.test(r)) return 'is-cap';
      if (/\bsub\b|substitute|6th|reserve/.test(r)) return 'is-sub';
      if (/\balt\b|alternate|standin|stand-in/.test(r)) return 'is-alt';
      return '';
    }
    function socialHtml(prof) {
      if (!prof) return '';
      if (prof.twitch) return `<span class="mu-psocial"><i class="fa-brands fa-twitch"></i>${esc(prof.twitch)}</span>`;
      if (prof.twitter) return `<span class="mu-psocial"><i class="fa-brands fa-x-twitter"></i>${esc(prof.twitter)}</span>`;
      return '';
    }

    function applyBrandTheme(data) {
      const root = document.documentElement;
      const color = SceneBase.brandColor(data), accent2 = SceneBase.brandAccent(data);
      if (color) root.style.setProperty('--duo-accent', color);
      if (accent2) root.style.setProperty('--duo-accent2', accent2);
      if (data.fontFamily) root.style.fontFamily = `'${data.fontFamily}', 'Inter', system-ui, sans-serif`;
    }

    function renderTeam(idx, t, side, data) {
      SceneBase.applyTeamLogo(el('logo' + idx), t.customLogo, t.logo);
      el('logo' + idx).classList.toggle('logo-on-dark', !!t.logoOnDark);
      el('name' + idx).textContent = (t.name || (side === 'b' ? 'ORANGE' : 'BLUE')).toUpperCase();
      document.documentElement.style.setProperty(side === 'b' ? '--team-b' : '--team-a', t.color || (side === 'b' ? '#e97139' : '#055fdb'));

      const players = (t.players || []).filter((p) => p && (p.name || p.gamerTag)).slice(0, 6);

      // Team stat: average 6mans ELO across linked profiles.
      const elos = players.map((p) => { const pr = profileFor(data, p); return pr && pr.sixmans && pr.sixmans.elo; }).filter((e) => e > 0);
      const avg = elos.length ? Math.round(elos.reduce((a, b) => a + b, 0) / elos.length) : null;
      const statEl = el('stat' + idx);
      statEl.innerHTML = avg ? `AVG ELO <b>${avg}</b>` : '';
      statEl.classList.toggle('is-empty', !avg);

      const wrap = el('roster' + idx); wrap.innerHTML = '';
      if (!players.length) { wrap.innerHTML = '<div class="mu-empty">Roster TBD</div>'; return; }
      players.forEach((p) => {
        const prof = profileFor(data, p) || {};
        const cc = prof.countryCode || '';
        const flag = flagEmoji(cc);
        const role = (p.role || '').toString().trim();
        const six = prof.sixmans || null;
        // Skip unranked players' rank badge (no "UNRANKED" chips).
        const isRanked = six && six.rank && !/unranked/i.test(six.rank);
        const rank = isRanked ? `<span class="mu-rank">${esc(six.rank)}</span>` : '';
        const social = socialHtml(prof);
        const roleHtml = role ? `<span class="mu-prole ${posClass(role)}">${esc(role)}</span>` : '';
        const row = document.createElement('div'); row.className = 'mu-prow';
        row.innerHTML =
          `<span class="mu-flag">${flag}</span>`
          + rank
          + `<span class="mu-pid"><span class="mu-pname">${esc(p.name || p.gamerTag)}</span>${social}</span>`
          + roleHtml;
        wrap.appendChild(row);
      });
    }

    function render(data) {
      data = data || {};
      applyBrandTheme(data);
      const casters = data.casters || {};
      el('stage').classList.add('show');
      const blue = SceneBase.teamSide(data, 'blue'), orange = SceneBase.teamSide(data, 'orange');
      renderTeam(1, blue, 'a', data); renderTeam(2, orange, 'b', data);
      el('sa').textContent = blue.series != null ? blue.series : 0;
      el('sb').textContent = orange.series != null ? orange.series : 0;
      el('bo').textContent = 'BEST OF ' + (data.bestOf || 5);
      const ttl = resolveTitle(data);
      el('title').textContent = ttl.toUpperCase(); el('title').classList.toggle('is-empty', !ttl);
    }

    if (location.protocol === 'file:') {
      document.documentElement.classList.add('preview');
      render({
        teams: {
          blue: { name: 'Velocity Gaming', color: '#3b82f6', players: [
            { name: 'Aqua', gamerTag: 'Aqua', role: 'Captain' }, { name: 'Nova', gamerTag: 'Nova' }, { name: 'Rhythm', gamerTag: 'Rhythm' }, { name: 'Surge', gamerTag: 'Surge', role: 'Sub' }] },
          orange: { name: 'Team Apex Esports', color: '#f97316', players: [
            { name: 'Blaze', gamerTag: 'Blaze', role: 'Captain' }, { name: 'Cinder', gamerTag: 'Cinder' }, { name: 'Ash', gamerTag: 'Ash', role: 'Sub' }] }
        },
        playerProfiles: {
          aqua: { sixmans: { rank: 'S', elo: 3120 }, countryCode: 'us', twitch: 'aquarl' },
          nova: { sixmans: { rank: 'A', elo: 2655 }, countryCode: 'ca', twitter: 'novaplays' },
          rhythm: { sixmans: { rank: 'B+', elo: 2210 }, countryCode: 'gb' },
          surge: { sixmans: { rank: 'C', elo: 1820 }, countryCode: 'au' },
          blaze: { sixmans: { rank: 'A', elo: 2740 }, countryCode: 'fr', twitch: 'blazegg' },
          cinder: { sixmans: { rank: 'B', elo: 2080 }, countryCode: 'de' },
          ash: { sixmans: { rank: 'C', elo: 1690 }, countryCode: 'se' }
        },
        series: { blue: 1, orange: 2 }, bestOf: 5, eventName: 'Summer Showdown — Grand Final',
        casters: { visible: true }, brand: { color: '#7c3aed', accent: '#22d3ee' }
      });
      el('stage').classList.add('show');
    } else { SceneBase.connect(render); }
  </script>
</body>
</html>
