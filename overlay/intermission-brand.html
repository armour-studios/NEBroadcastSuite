<!DOCTYPE html>
<!--
  intermission-brand.html — event branding overlay.
  Large centered logo + full event title on a glass card.
  Stack above intermission2.html in OBS.

  full_state bindings:
    breakScreen.visible — show / hide
    eventName           — event title
    brand.logo          — brand logo
    brand.color / brand.accent — accent colours

  URL params:
    ?always=1   stay visible regardless of breakScreen.visible
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root { --accent: #e83a8b; --accent2: #8b5cf6; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: flex-start; justify-content: center;
    }

    /* #card — fades + floats. .brand-wrap handles the entrance slide. */
    #card {
      margin-top: 52px;
      opacity: 0; transition: opacity .6s ease;
      pointer-events: none;
    }
    #card.show {
      opacity: 1;
      animation: cardFloat 6s ease-in-out 1s infinite;
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    /* Wrapper — relative anchor for the overlapping logo; slides in on show */
    .brand-wrap {
      position: relative;
      padding-top: 52px; /* space for the top half of the logo that floats above the panel */
      transform: translateY(-180px);
      transition: transform 1s cubic-bezier(.22,1,.36,1);
    }
    #card.show .brand-wrap { transform: translateY(0); }

    /* Logo — centered on the panel's top edge, half above */
    .brand-logo {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 104px; height: 104px; object-fit: contain; display: block;
      z-index: 2;
      animation: logoPulse 3.5s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 6px 20px rgba(0,0,0,.7)) drop-shadow(0 0 0px var(--accent)); }
      50%       { filter: drop-shadow(0 6px 20px rgba(0,0,0,.7)) drop-shadow(0 0 32px var(--accent)); }
    }

    /* Glass panel */
    .brand-panel {
      display: flex; flex-direction: column; align-items: center;
      padding: 68px 60px 36px; /* top clears logo's lower half + breathing room */
      min-width: 480px; max-width: 860px;
      background: rgba(6, 8, 16, .90);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 32px 100px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.04);
      position: relative; overflow: hidden;
    }

    /* Accent bar along the top edge */
    .brand-panel::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 2px;
      background: linear-gradient(to right, transparent, var(--accent), var(--accent2), transparent);
      border-radius: 0 0 4px 4px;
      animation: barPulse 2.8s ease-in-out infinite;
    }
    @keyframes barPulse {
      0%, 100% { opacity: .55; }
      50%       { opacity: 1; }
    }

    /* Full event title — no truncation */
    .brand-title {
      font-size: 38px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
      color: #fff; text-align: center; line-height: 1.15;
      text-shadow: 0 2px 24px rgba(0,0,0,.8);
      white-space: normal; word-break: break-word;
    }
    .brand-title.hidden { display: none; }
  </style>
</head>
<body>
  <div id="card">
    <div class="brand-wrap">
      <img class="brand-logo" id="logo" src="" alt="">
      <div class="brand-panel">
        <div class="brand-title hidden" id="event-title"></div>
      </div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    const QP     = new URLSearchParams(location.search);
    const ALWAYS = QP.get('always') === '1';
    const card   = document.getElementById('card');

    function el(id) { return document.getElementById(id); }

    function render(data) {
      data = data || {};
      const b = data.breakScreen || {};
      const visible = ALWAYS || SceneBase.standalone || b.visible;
      card.classList.toggle('show', !!visible);
      if (!visible) return;

      const root = document.documentElement;
      const accent = SceneBase.brandColor(data);
      const accent2 = SceneBase.brandAccent(data);
      if (accent) root.style.setProperty('--accent', accent);
      if (accent2) root.style.setProperty('--accent2', accent2);

      SceneBase.applyTeamLogo(el('logo'), (data.brand && data.brand.logo) || '', '');

      const titleText = (data.eventName || '').toString().trim().toUpperCase();
      const titleEl = el('event-title');
      titleEl.textContent = titleText;
      titleEl.classList.toggle('hidden', !titleText);
    }

    if (location.protocol === 'file:') {
      render({
        breakScreen: { visible: true },
        eventName: 'Summer Showdown 2024',
        brand: { color: '#e83a8b', accent: '#8b5cf6', logo: '' }
      });
    } else {
      SceneBase.connect(render);
    }
  </script>
</body>
</html>
