<!DOCTYPE html>
<html lang="en">
<!--
  NE Broadcast Suite map veto / map-set board — ported & generalised from EsportsDashBoard mapscreen.html.
  Driven by full_state.veto:
    { visible, title, maps: [{ name, mode, image, action:'ban'|'pick'|'decider', by:'a'|'b', winner:'a'|'b', score:{a,b} }] }
  Team a = full_state.teams.blue, team b = full_state.teams.orange (name + colour).
  Cards build dynamically (1–7 maps). Bans dim + strike; picks/wins carry a small hex team badge;
  completed maps show the badge + score.

  Header is ONE slim scorecard bar (hex team badge + tag either side of the running series record),
  Overwatch-World-Cup style, instead of a two-band plate — it was the single biggest source of
  "bulky" on this board.

  Per-map hero bans (only real for Overwatch, where hero bans are actually tracked per map) ride
  along on state.owMatch.bansByMap, indexed by PLAY order — not the veto array index, since the
  veto array also holds eliminated map-veto bans that were never played. Every 'pick'/'decider'
  entry counts as one played map in order; that running count is the index into bansByMap. Any
  other game (or an empty bansByMap entry) just renders no ban row — same silent-fallback pattern
  the rest of this board already uses for missing map art/logos.
-->
<head>
  <meta charset="UTF-8">
  <title>NE Broadcast Suite — Map Pool</title>
  <link rel="stylesheet" href="scene.css" />
  <style>
    /* #veto-stage (not body) is the centering container — position:absolute + flex fills the
       whole 1920x1080 canvas and centers its children as a block, so the title/row/footer
       cluster stays true-centered for any slot count (1-7 maps) instead of drifting off-centre
       from ad-hoc margin-top spacing on individual children. */
    body { position: relative; }
    #veto-stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px;
      padding-top: 130px;   /* clears the scorecard header bar */
      opacity: 0; transition: opacity 0.35s ease;
    }
    #veto-stage.show { opacity: 1; }

    /* ── Hexagon team badge ────────────────────────────────────────────────────
       Shared by the header bar and every map card. Outer element is clipped to a hex and filled
       with the team colour — that visible sliver around the (separately clipped, inset) inner
       element is the "ring". filter:drop-shadow (not box-shadow, which ignores clip-path) is what
       gives the whole badge a shadow that follows the hex outline instead of a phantom rectangle. */
    .hexbadge {
      --hex: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      position: relative; flex: 0 0 auto; box-sizing: border-box; padding: 3px;
      clip-path: var(--hex);
      background: linear-gradient(160deg, color-mix(in srgb, var(--tc, var(--accent)) 88%, #fff 12%),
        color-mix(in srgb, var(--tc, var(--accent)) 55%, #000 30%));
      filter: drop-shadow(0 5px 14px rgba(0,0,0,.5));
    }
    .hexbadge-in { width: 100%; height: 100%; clip-path: var(--hex); background: #0c0e13;
      display: grid; place-items: center; overflow: hidden; }
    .hexbadge-in img { width: 72%; height: 72%; object-fit: contain; }
    .hexbadge-in .init { font-family: 'Rajdhani', var(--main-font); font-weight: 700; color: #fff; letter-spacing: 0.02em; }
    .hexbadge.lg { width: 62px; height: 62px; }
    .hexbadge.lg .init { font-size: 1.3em; }
    .hexbadge.md { width: 54px; height: 54px; }
    .hexbadge.md .init { font-size: 1.05em; }

    /* ── Header bar — one slim scorecard: hex badge + tag flank the running series record,
       the veto title sits centred underneath it as a small caption. Team colours are pushed in
       as --team-a / --team-b by render() and drive the badge rings + name underline + base bar,
       so the bar reads as "this match" without needing a second band underneath it. */
    .veto-head {
      position: absolute; top: 26px; left: 50%; transform: translateX(-50%); z-index: 2;
      width: min(1100px, 90vw);
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 22px;
      padding: 14px 30px; border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, rgba(21,24,32,.95), rgba(9,11,15,.975));
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 16px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
      animation: veto-drop 0.6s backwards cubic-bezier(0,0,0,1);
      --team-a: var(--accent); --team-b: var(--accent);
    }
    .veto-head::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(90deg,  color-mix(in srgb, var(--team-a) 22%, transparent), transparent 34%),
        linear-gradient(270deg, color-mix(in srgb, var(--team-b) 22%, transparent), transparent 34%);
    }
    .veto-head::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: linear-gradient(90deg,
        var(--team-a), color-mix(in srgb, var(--team-a) 25%, transparent) 34%,
        rgba(255,255,255,.10) 50%,
        color-mix(in srgb, var(--team-b) 25%, transparent) 66%, var(--team-b));
    }
    @keyframes veto-drop { 0% { opacity: 0; transform: translate(-50%, -34px); } 100% { opacity: 1; transform: translate(-50%, 0); } }

    .vh-team { position: relative; z-index: 1; display: flex; align-items: center; gap: 16px; min-width: 0; }
    .vh-team.vh-b { justify-content: flex-end; }
    .vh-team.vh-a { --tc: var(--team-a); }
    .vh-team.vh-b { --tc: var(--team-b); }
    .vh-tag { position: relative; font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 1.7em; color: #fff;
      letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,.6); }
    .vh-tag::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px;
      background: var(--tc, var(--accent)); box-shadow: 0 0 10px color-mix(in srgb, var(--tc, var(--accent)) 55%, transparent); }
    .vh-tag:empty::after { display: none; }

    .vh-mid { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .vh-score { display: flex; align-items: center; gap: 14px; }
    .vh-w { font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 2.6em; line-height: 1; color: #fff;
      min-width: 40px; text-align: center; font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px color-mix(in srgb, currentColor 45%, transparent); }
    .vh-dash { font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 1.3em; color: rgba(255,255,255,.32); }
    .vh-title { font-family: 'Rajdhani', var(--main-font); font-weight: 600; font-size: 0.82em; color: #9aa2b1;
      letter-spacing: 0.28em; text-transform: uppercase; white-space: nowrap; max-width: 460px;
      overflow: hidden; text-overflow: ellipsis; }
    .vh-brand { height: 22px; max-width: 70px; object-fit: contain; margin-bottom: 2px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }

    .veto-row { display: flex; gap: 26px; justify-content: center; align-items: stretch; padding: 0 60px; max-width: 1920px; }

    .map-card {
      position: relative; width: 300px; height: 620px; border-radius: 6px; overflow: hidden;
      background: var(--scene-bg); border-bottom: 5px solid var(--accent);
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      animation: card-rise 0.6s backwards cubic-bezier(0,0,0,1);
    }
    @keyframes card-rise { 0% { opacity: 0; transform: translateY(60px); } 100% { opacity: 1; transform: translateY(0); } }
    .map-card .img { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .map-card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.08) 26%, rgba(0,0,0,.12) 55%, rgba(0,0,0,.82) 100%); }
    .map-card .mode { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-family: 'Rajdhani', var(--main-font); font-weight: 600; font-size: 1.05em; color: #c6cbd4; letter-spacing: 0.16em; }
    .map-card .mode.mode-icon { display: flex; align-items: center; justify-content: center; gap: 7px; }
    .map-card .mode.mode-icon img { height: 20px; width: 20px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
    .map-card .mode.mode-icon span { font-size: .8em; }
    /* Map name now sits right under the mode row (was floating mid-card) — that frees the card's
       vertical centre for the hex badge, same spot the reference board reserves for its flag. */
    .map-card .name { position: absolute; top: 42px; left: 0; right: 0; text-align: center; font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 1.5em; color: #fff; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.6); }

    /* Winner / picking-team hex badge, roughly where the reference board's flag sits. */
    .card-hex { position: absolute; top: 56%; left: 50%; transform: translate(-50%, -50%); z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .card-score { font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 1.15em; color: #fff;
      -webkit-text-stroke: 1.5px rgba(0,0,0,.55); paint-order: stroke fill; letter-spacing: 0.02em; }
    .card-decider { position: absolute; top: 56%; left: 50%; transform: translate(-50%, -50%); z-index: 1;
      padding: 7px 18px; border-radius: 8px; background: var(--accent); color: var(--on-accent, #fff);
      font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 1.05em; letter-spacing: 0.16em; }

    /* Completed map: image desaturates (result now reads from the hex badge + score, not a
       separate overlay block). */
    .map-card.completed .img { filter: grayscale(100%) brightness(.55); }

    .map-card.ban .img  { filter: grayscale(100%) brightness(0.4); }
    .map-card.ban { border-bottom-color: #444; }
    .map-card.ban .name { color: #888e97; text-decoration: line-through; text-decoration-thickness: 3px; }

    /* Per-map hero-ban strip — small circular portraits grouped by side, team-colour ring.
       Only ever populated for a game that actually tracks per-map hero bans (Overwatch today);
       every other game/empty map just never gets this element. */
    .ban-row { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1;
      display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
      padding: 12px 16px 14px; background: linear-gradient(0deg, rgba(0,0,0,.88), rgba(0,0,0,0) 100%); }
    .ban-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ban-group.side-b { align-items: flex-end; }
    .ban-lbl { font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: .68em; letter-spacing: 0.18em;
      color: rgba(255,255,255,.6); text-transform: uppercase; }
    .ban-chips { display: flex; gap: 6px; }
    .ban-chip { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #111;
      border: 2px solid var(--tc, rgba(255,255,255,.4)); box-shadow: 0 3px 8px rgba(0,0,0,.55); }
    .ban-chip img { width: 100%; height: 100%; object-fit: cover; }

    /* Sponsor rail — pinned bottom, active brand kit (desk placement first). */
    .veto-sponsors { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2;
      display: flex; align-items: center; gap: 28px; padding: 10px 32px; border-radius: 12px;
      background: linear-gradient(180deg, rgba(17,19,26,.72), rgba(10,12,16,.85)); border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 12px 32px rgba(0,0,0,.45); }
    .veto-sponsors.is-empty { display: none; }
    .veto-sponsors-lbl { font-family: 'Rajdhani', var(--main-font); font-size: 13px; font-weight: 700; letter-spacing: 0.24em;
      text-transform: uppercase; color: #7a8090; }
    .veto-sponsor { height: 42px; max-width: 160px; object-fit: contain; opacity: .92; filter: drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
  </style>
</head>
<body>
  <div id="veto-stage">
    <div class="veto-head">
      <div class="vh-team vh-a">
        <span class="hexbadge lg" id="vh-hex-a"><span class="hexbadge-in"></span></span>
        <span class="vh-tag" id="vh-tag-a"></span>
      </div>
      <div class="vh-mid">
        <img class="vh-brand" id="veto-brand" alt="" style="display:none;">
        <div class="vh-score">
          <span class="vh-w" id="vh-w-a">0</span>
          <span class="vh-dash">–</span>
          <span class="vh-w" id="vh-w-b">0</span>
        </div>
        <div class="vh-title" id="veto-title"></div>
      </div>
      <div class="vh-team vh-b">
        <span class="vh-tag" id="vh-tag-b"></span>
        <span class="hexbadge lg" id="vh-hex-b"><span class="hexbadge-in"></span></span>
      </div>
    </div>
    <div class="veto-row" id="veto-row"></div>
    <div class="veto-sponsors is-empty" id="veto-sponsors"></div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    const stage = document.getElementById('veto-stage');
    const titleEl = document.getElementById('veto-title');
    const rowEl   = document.getElementById('veto-row');
    let _sig = '';

    // Overwatch game-mode icons — m.mode carries the pool entry's type (Control/Hybrid/Escort/
    // Push/Flashpoint/Clash). Other games' mode strings (e.g. CS2) have no matching icon, so the
    // label just falls back to text, same as before.
    // Rocket League modes are chosen per map row (Standard/Hoops/Dropshot/Snow Day/Rumble/
    // Heatseeker/Spike Rush) and carry their own icon set. 'soccar' is kept as an alias of
    // 'standard' — same mode under its in-game file name, so older saved boards still get an icon.
    const MODE_IMG = {
      control: '/assets/overwatch/modes/Control.webp', hybrid: '/assets/overwatch/modes/Hybrid.webp',
      escort: '/assets/overwatch/modes/Escort.webp', push: '/assets/overwatch/modes/Push.webp',
      flashpoint: '/assets/overwatch/modes/Flashpoint.webp', clash: '/assets/overwatch/modes/Clash.webp',
      assault: '/assets/overwatch/modes/Assault.webp',
      standard: '/assets/rocket-league/modes/soccar.svg', soccar: '/assets/rocket-league/modes/soccar.svg',
      hoops: '/assets/rocket-league/modes/hoops.svg',
      dropshot: '/assets/rocket-league/modes/dropshot.svg', 'snow day': '/assets/rocket-league/modes/snow-day.svg',
      rumble: '/assets/rocket-league/modes/rumble.svg', heatseeker: '/assets/rocket-league/modes/heatseeker.svg',
      'spike rush': '/assets/rocket-league/modes/spike-rush.svg'
    };
    function buildModeEl(modeText) {
      const mode = document.createElement('div'); mode.className = 'mode';
      const icon = MODE_IMG[(modeText || '').toLowerCase().trim()];
      if (icon) {
        mode.classList.add('mode-icon');
        const img = document.createElement('img'); img.src = icon; img.alt = '';
        img.onerror = () => { img.remove(); mode.classList.remove('mode-icon'); mode.textContent = (modeText || '').toUpperCase(); };
        const span = document.createElement('span'); span.textContent = modeText.toUpperCase();
        mode.appendChild(img); mode.appendChild(span);
      } else {
        mode.textContent = (modeText || '').toUpperCase();
      }
      return mode;
    }

    // Short tag for the header/card hex badges — team's own Abbreviation (Match > Teams) first,
    // else derived initials, same rule rl-worlds.html's shortTag() uses.
    function shortTag(t) {
      if (t.abbr) return t.abbr.toUpperCase();
      const n = (t.name || '').toUpperCase().trim();
      if (!n) return '';
      if (n.length <= 5) return n;
      const w = n.split(/\s+/).filter(Boolean);
      return w.length > 1 ? w.map((x) => x[0]).join('').slice(0, 4) : n.slice(0, 4);
    }
    // Hex badges are small — cap the no-logo fallback text tighter than the header tag.
    function hexInitials(t) { return shortTag(t).slice(0, 3) || '?'; }

    function fillHex(el, t) {
      if (!el) return;
      const inner = el.querySelector('.hexbadge-in');
      el.style.setProperty('--tc', t.color || 'var(--accent)');
      inner.innerHTML = '';
      if (t.logo) {
        const img = document.createElement('img'); img.src = t.logo; img.alt = '';
        if (SceneBase.isDefaultGameLogo(t.logo)) img.style.filter = 'brightness(0) invert(1)';
        inner.appendChild(img);
      } else {
        const span = document.createElement('span'); span.className = 'init'; span.textContent = hexInitials(t);
        inner.appendChild(span);
      }
    }
    function buildHex(t, sizeClass) {
      const wrap = document.createElement('span'); wrap.className = 'hexbadge ' + sizeClass;
      const inner = document.createElement('span'); inner.className = 'hexbadge-in';
      wrap.appendChild(inner);
      fillHex(wrap, t);
      return wrap;
    }

    // Overwatch hero art — same slug/URL rule overlay/overwatch.html uses for the in-game HUD.
    function heroSlug(n) {
      return (n || '').toLowerCase().replace(/ö/g, 'o').replace(/ú/g, 'u').replace(/[.']/g, '')
        .replace(/:\s*/g, '-').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }
    function heroImgUrl(n) { const s = heroSlug(n); return s ? `/assets/overwatch/heroes/${s}.png` : ''; }
    function banNamesFrom(entrySide) {
      if (Array.isArray(entrySide)) return entrySide.map((x) => x && x.hero).filter(Boolean);
      if (entrySide && entrySide.hero) return [entrySide.hero];
      return [];
    }
    // playedIdx = this map's position among PLAYED maps only (pick/decider), which is what
    // owMatch.bansByMap is indexed by — see the file header comment.
    function heroBansFor(data, playedIdx) {
      if (playedIdx < 0 || (data.activeGame || '') !== 'overwatch') return null;
      const bansByMap = (data.owMatch && Array.isArray(data.owMatch.bansByMap)) ? data.owMatch.bansByMap : [];
      const entry = bansByMap[playedIdx] || {};
      const a = banNamesFrom(entry.a).slice(0, 2), b = banNamesFrom(entry.b).slice(0, 2);
      if (!a.length && !b.length) return null;
      return { a, b };
    }
    function buildBanRow(bans, blue, orange) {
      if (!bans) return null;
      const group = (heroes, team, side) => {
        if (!heroes.length) return null;
        const g = document.createElement('div'); g.className = 'ban-group side-' + side;
        const lbl = document.createElement('span'); lbl.className = 'ban-lbl';
        lbl.textContent = heroes.length > 1 ? 'BANS' : 'BAN';
        const chips = document.createElement('div'); chips.className = 'ban-chips';
        heroes.forEach((h) => {
          const chip = document.createElement('span'); chip.className = 'ban-chip';
          chip.style.setProperty('--tc', team.color || 'var(--accent)'); chip.title = h;
          const img = document.createElement('img'); img.src = heroImgUrl(h); img.alt = '';
          img.onerror = () => chip.remove();
          chip.appendChild(img); chips.appendChild(chip);
        });
        g.appendChild(lbl); g.appendChild(chips);
        return g;
      };
      const a = group(bans.a, blue, 'a'), b = group(bans.b, orange, 'b');
      if (!a && !b) return null;
      const row = document.createElement('div'); row.className = 'ban-row';
      row.appendChild(a || document.createElement('span'));
      row.appendChild(b || document.createElement('span'));
      return row;
    }

    function teamFor(by, data) {
      if (by === 'a') return SceneBase.teamSide(data, 'blue');
      if (by === 'b') return SceneBase.teamSide(data, 'orange');
      return null;
    }

    function render(data) {
      const v = data.veto || {};
      stage.classList.add('show');

      titleEl.textContent = (v.title || 'MAP POOL').toUpperCase();
      // Active brand kit's logo on the header bar (hidden when no kit is active).
      const brandEl = document.getElementById('veto-brand');
      if (brandEl) {
        const logo = SceneBase.brandLogo(data);
        if (logo) {
          if (brandEl.getAttribute('src') !== logo) brandEl.src = logo;
          brandEl.style.display = '';
        } else {
          brandEl.style.display = 'none';
        }
      }
      const maps = Array.isArray(v.maps) ? v.maps : [];
      const blue = SceneBase.teamSide(data, 'blue');
      const orange = SceneBase.teamSide(data, 'orange');
      // Running series record = maps each side has already won.
      const aWins = maps.filter((m) => m.winner === 'a').length;
      const bWins = maps.filter((m) => m.winner === 'b').length;
      // Sponsor rail — active brand kit, desk placement first (same rule as standings/intro).
      const brand = data.brand || {};
      const anyTagged = (brand.deskSponsors || []).length || (brand.railSponsors || []).length || (brand.bannerSponsors || []).length;
      const sponsors = ((brand.deskSponsors || []).length ? brand.deskSponsors : (anyTagged ? [] : (brand.sponsors || [])))
        .filter((s) => s && s.logo);

      // Rebuild only when the data changes (avoid restarting card animations each tick).
      const owBans = (data.activeGame === 'overwatch' && data.owMatch && data.owMatch.bansByMap) || [];
      const sig = JSON.stringify({ maps, t: v.title, ow: owBans,
        a: { n: blue.name, c: blue.color, l: (blue.logo || '').slice(0, 40), tag: blue.abbr, w: aWins },
        o: { n: orange.name, c: orange.color, l: (orange.logo || '').slice(0, 40), tag: orange.abbr, w: bWins },
        sp: sponsors.map((s) => s.logo.slice(0, 40)) });
      if (sig === _sig) return;
      _sig = sig;

      // ── Scorecard header (hex badge + tag flanking the series record) ──
      document.getElementById('vh-tag-a').textContent = shortTag(blue);
      document.getElementById('vh-tag-b').textContent = shortTag(orange);
      fillHex(document.getElementById('vh-hex-a'), blue);
      fillHex(document.getElementById('vh-hex-b'), orange);
      // Team colours drive the header's end washes, hex rings, tag underlines and base bar.
      // The decider badge is filled with the raw brand accent — measure its text against it.
      const accNow = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      if (accNow) document.documentElement.style.setProperty('--on-accent', SceneBase.onColor(accNow));
      const headEl = document.querySelector('.veto-head');
      if (headEl) {
        headEl.style.setProperty('--team-a', blue.color || 'var(--accent)');
        headEl.style.setProperty('--team-b', orange.color || 'var(--accent)');
      }
      const wa = document.getElementById('vh-w-a'), wb = document.getElementById('vh-w-b');
      if (wa) { wa.textContent = aWins; wa.style.color = blue.color || '#fff'; }
      if (wb) { wb.textContent = bWins; wb.style.color = orange.color || '#fff'; }

      // ── Sponsor rail ──
      const spEl = document.getElementById('veto-sponsors');
      if (spEl) {
        spEl.innerHTML = sponsors.length
          ? '<span class="veto-sponsors-lbl">Presented by</span>' + sponsors.map((s) => `<img class="veto-sponsor" src="${s.logo}" alt="">`).join('')
          : '';
        spEl.classList.toggle('is-empty', !sponsors.length);
      }

      // Scale card width to fit the row.
      const n = Math.max(1, maps.length);
      const w = Math.min(300, Math.floor((1920 - 120 - (n - 1) * 26) / n));

      // Played-map index per veto-row entry — only 'pick'/'decider' entries were actually played,
      // and only those line up with owMatch.bansByMap's play-order indexing (see file header).
      let playedIdx = -1;
      const playedIdxByMap = maps.map((m) => {
        if (m.action === 'pick' || m.action === 'decider') playedIdx += 1;
        return playedIdx;
      });

      rowEl.innerHTML = '';
      maps.forEach((m, i) => {
        const t = teamFor(m.by, data);
        const completed = (m.winner === 'a' || m.winner === 'b') || (m.score && (m.score.a || m.score.b));

        const card = document.createElement('div');
        card.className = 'map-card' + (m.action ? ' ' + m.action : '') + (completed ? ' completed' : '');
        card.style.width = w + 'px';
        card.style.animationDelay = (0.4 + i * 0.12) + 's';

        const img = document.createElement('div'); img.className = 'img';
        // Games without real map art yet (image:'' in the pool) still look intentional — a
        // subtle brand-tinted gradient instead of flat black. Completed maps grayscale via CSS
        // (.map-card.completed .img) regardless of which background this ends up being.
        if (m.image) img.style.backgroundImage = `url('${m.image}')`;
        else img.style.background = 'radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 22%, #14161c), #0a0b0f)';
        const shade = document.createElement('div'); shade.className = 'shade';
        const mode = buildModeEl(m.mode);
        const name = document.createElement('div'); name.className = 'name'; name.textContent = (m.name || 'TBA').toUpperCase();

        card.appendChild(img); card.appendChild(shade); card.appendChild(mode); card.appendChild(name);

        if (m.action === 'pick' && t) card.style.borderBottomColor = t.color;
        if (m.winner === 'a') card.style.borderBottomColor = blue.color;
        if (m.winner === 'b') card.style.borderBottomColor = orange.color;

        // Hex badge: the winner once the map's decided, else whoever picked it, else nothing
        // (a banned map, or a decider still waiting to be played).
        const hexTeam = completed ? (m.winner === 'a' ? blue : m.winner === 'b' ? orange : null)
          : (m.action === 'pick' ? t : null);
        if (hexTeam) {
          const wrap = document.createElement('div'); wrap.className = 'card-hex';
          wrap.appendChild(buildHex(hexTeam, 'md'));
          if (completed) {
            const a = (m.score && m.score.a) || 0, b = (m.score && m.score.b) || 0;
            const sc = document.createElement('div'); sc.className = 'card-score'; sc.textContent = `${a}–${b}`;
            wrap.appendChild(sc);
          }
          card.appendChild(wrap);
        } else if (m.action === 'decider' && !completed) {
          const dec = document.createElement('div'); dec.className = 'card-decider'; dec.textContent = 'DECIDER';
          card.appendChild(dec);
        }

        // Per-map hero bans (Overwatch only — see heroBansFor).
        const banRow = buildBanRow(heroBansFor(data, playedIdxByMap[i]), blue, orange);
        if (banRow) card.appendChild(banRow);

        rowEl.appendChild(card);
      });
    }
    SceneBase.connect((data) => { SceneBase.applySceneConfig('veto', data); render(data); });

    if (location.protocol === 'file:') {
      render({ teams: { blue: { name: 'FROST', color: '#3b82f6' }, orange: { name: 'EMBER', color: '#f97316' } },
        veto: { visible: true, title: 'Grand Final — Map Veto', maps: [
          { name: 'Mirage',   mode: 'CS2', action: 'ban',  by: 'a' },
          { name: 'Inferno',  mode: 'CS2', action: 'ban',  by: 'b' },
          { name: 'Nuke',     mode: 'CS2', action: 'pick', by: 'a', winner: 'a', score: { a: 13, b: 9 } },
          { name: 'Ancient',  mode: 'CS2', action: 'pick', by: 'b' },
          { name: 'Anubis',   mode: 'CS2', action: 'decider' }
        ] } });
    }
  </script>
</body>
</html>
