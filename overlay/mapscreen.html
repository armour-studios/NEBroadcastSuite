<!DOCTYPE html>
<html lang="en">
<!--
  NE Broadcast Suite map veto / map-set board — ported & generalised from EsportsDashBoard mapscreen.html.
  Driven by full_state.veto:
    { visible, title, maps: [{ name, mode, image, action:'ban'|'pick'|'decider', by:'a'|'b', winner:'a'|'b', score:{a,b} }] }
  Team a = full_state.teams.blue, team b = full_state.teams.orange (name + colour).
  Cards build dynamically (1–7 maps). Bans dim + strike; picks carry a team-tinted chip;
  completed maps show the score and tint to the winner.
-->
<head>
  <meta charset="UTF-8">
  <title>NE Broadcast Suite — Map Pool</title>
  <link rel="stylesheet" href="scene.css" />
  <style>
    /* #veto-stage (not body) is the centering container — position:absolute + flex fills the
       whole 1920x1080 canvas and centers its children as a block, so the title/row/footer
       cluster stays true-centered for any slot count (1-7 maps) instead of drifting off-centre
       from ad-hoc margin-top spacing on individual children. */
    body { position: relative; }
    #veto-stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px;
      padding-top: 200px;   /* clears the scorecard header plate */
      opacity: 0; transition: opacity 0.35s ease;
    }
    #veto-stage.show { opacity: 1; }

    /* ── Header plate ──────────────────────────────────────────────────────────
       Two stacked bands inside one plate: an event/title strip on top (brand logo +
       veto title) and the matchup scorecard below it. Team colours are pushed in as
       --team-a / --team-b by render() and drive the end washes, the name underlines
       and the base bar, so the header reads as "this match" at a glance rather than
       as a generic dark box. Fixed logo TILES (not free-floating <img>) keep a tall
       photo-ish logo and a wide banner logo the same visual weight. */
    .veto-head {
      position: absolute; top: 26px; left: 50%; transform: translateX(-50%); z-index: 2;
      width: min(1180px, 90vw);
      display: flex; flex-direction: column; align-items: stretch;
      border-radius: 16px; overflow: hidden;
      background: linear-gradient(180deg, rgba(21,24,32,.95), rgba(9,11,15,.975));
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
      animation: veto-drop 0.6s backwards cubic-bezier(0,0,0,1);
      --team-a: var(--accent); --team-b: var(--accent);
    }
    /* Team-colour wash bleeding in from each end of the plate. */
    .veto-head::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(90deg,  color-mix(in srgb, var(--team-a) 26%, transparent), transparent 30%),
        linear-gradient(270deg, color-mix(in srgb, var(--team-b) 26%, transparent), transparent 30%);
    }
    /* Base bar: solid team colour at each end, fading out toward the centre. */
    .veto-head::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
      background: linear-gradient(90deg,
        var(--team-a), color-mix(in srgb, var(--team-a) 25%, transparent) 34%,
        rgba(255,255,255,.10) 50%,
        color-mix(in srgb, var(--team-b) 25%, transparent) 66%, var(--team-b));
    }

    /* Event strip */
    .veto-head-top {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 11px 28px 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.012));
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .veto-brand { height: 30px; max-width: 96px; object-fit: contain; flex: 0 0 auto;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,.6)); }
    .veto-title { font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 1.15em; color: #e9edf4;
      letter-spacing: 0.30em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.6);
      white-space: nowrap; max-width: 950px; overflow: hidden; text-overflow: ellipsis; }

    /* Scorecard — each team's logo + name flanks the running series record (maps won so far).
       A 3-column grid with EQUAL team columns (1fr) keeps the score dead-centre and the two teams
       symmetric no matter how long/short each name is (a flex min-width let a long name push the
       score off-centre). */
    .veto-score { position: relative; z-index: 1;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 30px; padding: 16px 34px 18px; }
    /* space-between (not flex-end/-start) pushes each name to the outer edge of the plate and
       keeps the two logo tiles flanking the score, instead of leaving dead plate at both ends. */
    .vs-team { display: flex; align-items: center; gap: 18px; min-width: 0; justify-content: space-between; }
    .vs-team.vs-a { --tc: var(--team-a); }
    .vs-team.vs-b { --tc: var(--team-b); }
    /* Fixed-size tile: any logo aspect ratio lands in the same box, so the two sides stay level. */
    .vs-logo-tile { flex: 0 0 auto; width: 74px; height: 74px; display: grid; place-items: center;
      border-radius: 12px; background: rgba(255,255,255,.05);
      border: 1px solid color-mix(in srgb, var(--tc, #fff) 30%, rgba(255,255,255,.10));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 4px 14px rgba(0,0,0,.4); }
    .vs-logo-tile.is-empty { display: none; }
    .vs-logo { max-width: 60px; max-height: 60px; object-fit: contain; filter: drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
    .vs-logo.on-dark { filter: brightness(0) invert(1) drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
    .vs-name { position: relative; font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 1.95em; color: #fff;
      letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-bottom: 7px; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    .vs-name::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px;
      background: var(--tc, var(--accent)); box-shadow: 0 0 12px color-mix(in srgb, var(--tc, var(--accent)) 55%, transparent); }
    .vs-name:empty::after { display: none; }
    .vs-record { display: flex; align-items: center; gap: 14px; padding: 8px 24px; border-radius: 14px;
      background: linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.72));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 6px 18px rgba(0,0,0,.45); }
    .vs-record .vs-w { font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 2.9em; line-height: 1; color: #fff;
      min-width: 42px; text-align: center; font-variant-numeric: tabular-nums;
      text-shadow: 0 0 22px color-mix(in srgb, currentColor 45%, transparent); }
    .vs-record .vs-dash { font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 1.5em; color: rgba(255,255,255,.32); }
    @keyframes veto-drop { 0% { opacity: 0; transform: translate(-50%, -40px); } 100% { opacity: 1; transform: translate(-50%, 0); } }

    .veto-row { display: flex; gap: 26px; justify-content: center; align-items: stretch; padding: 0 60px; max-width: 1920px; }

    .map-card {
      position: relative; width: 300px; height: 620px; border-radius: 6px; overflow: hidden;
      background: var(--scene-bg); border-bottom: 7px solid var(--accent);
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      animation: card-rise 0.6s backwards cubic-bezier(0,0,0,1);
    }
    @keyframes card-rise { 0% { opacity: 0; transform: translateY(60px); } 100% { opacity: 1; transform: translateY(0); } }
    .map-card .img { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .map-card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.05) 30%, rgba(0,0,0,.15) 60%, rgba(0,0,0,.85) 100%); }
    .map-card .mode { position: absolute; top: 18px; left: 0; right: 0; text-align: center; font-family: 'Rajdhani', var(--main-font); font-weight: 600; font-size: 1.3em; color: #dfe4ea; letter-spacing: 0.18em; }
    .map-card .mode.mode-icon { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .map-card .mode.mode-icon img { height: 26px; width: 26px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
    .map-card .mode.mode-icon span { font-size: .82em; }
    .map-card .name { position: absolute; bottom: 96px; left: 0; right: 0; text-align: center; font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 2.3em; color: #fff; text-transform: uppercase; }
    .map-card .chip {
      /* Full-width ribbon across the bottom of the map card (was a floating centered pill). */
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 10px 12px; text-align: center;
      font-family: 'Rajdhani', var(--main-font); font-weight: 700;
      font-size: 1.25em; letter-spacing: 0.12em; color: var(--chip-fg, #fff); text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 -4px 18px rgba(0,0,0,.45);
    }
    /* Completed map: image desaturates, and the result (winning team's logo + score) sits as
       one block centered — both horizontally AND vertically — over the card, independent of
       where the map name/mode labels are. */
    .map-card.completed .img { filter: grayscale(100%) brightness(.55); }
    .map-card .result {
      position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .map-card .result-logo { width: 88px; height: 88px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(0,0,0,.65)); }
    .map-card .result-logo.on-dark { filter: brightness(0) invert(1) drop-shadow(0 8px 20px rgba(0,0,0,.65)); }
    .map-card .result-score { display: flex; align-items: center; gap: 12px; font-family: 'Rajdhani', var(--main-font); font-weight: 700; font-size: 2.8em; color: #fff; -webkit-text-stroke: 2px rgba(0,0,0,.6); paint-order: stroke fill; }
    .map-card .result-score .sep { font-weight: 700; font-size: .6em; color: rgba(255,255,255,.5); -webkit-text-stroke: 0; }

    .map-card.ban .img  { filter: grayscale(100%) brightness(0.45); }
    .map-card.ban { border-bottom-color: #555; }
    .map-card.ban .name { color: #9aa0a8; text-decoration: line-through; text-decoration-thickness: 4px; }
    .map-card.decider .chip { background: var(--accent); color: var(--on-accent, #fff); }

    /* Sponsor rail — pinned bottom, active brand kit (desk placement first). */
    .veto-sponsors { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2;
      display: flex; align-items: center; gap: 28px; padding: 10px 32px; border-radius: 12px;
      background: linear-gradient(180deg, rgba(17,19,26,.72), rgba(10,12,16,.85)); border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 12px 32px rgba(0,0,0,.45); }
    .veto-sponsors.is-empty { display: none; }
    .veto-sponsors-lbl { font-family: 'Rajdhani', var(--main-font); font-size: 13px; font-weight: 700; letter-spacing: 0.24em;
      text-transform: uppercase; color: #7a8090; }
    .veto-sponsor { height: 42px; max-width: 160px; object-fit: contain; opacity: .92; filter: drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
  </style>
</head>
<body>
  <div id="veto-stage">
    <div class="veto-head">
      <div class="veto-head-top">
        <img class="veto-brand" id="veto-brand" alt="" style="display:none;">
        <div class="veto-title" id="veto-title">MAP POOL</div>
      </div>
      <div class="veto-score" id="veto-score">
        <div class="vs-team vs-a">
          <span class="vs-name" id="vs-name-a"></span>
          <span class="vs-logo-tile is-empty" id="vs-tile-a"><img class="vs-logo" id="vs-logo-a" alt=""></span>
        </div>
        <div class="vs-record">
          <span class="vs-w" id="vs-w-a">0</span>
          <span class="vs-dash">–</span>
          <span class="vs-w" id="vs-w-b">0</span>
        </div>
        <div class="vs-team vs-b">
          <span class="vs-logo-tile is-empty" id="vs-tile-b"><img class="vs-logo" id="vs-logo-b" alt=""></span>
          <span class="vs-name" id="vs-name-b"></span>
        </div>
      </div>
    </div>
    <div class="veto-row" id="veto-row"></div>
    <div class="veto-sponsors is-empty" id="veto-sponsors"></div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    const stage = document.getElementById('veto-stage');
    const titleEl = document.getElementById('veto-title');
    const rowEl   = document.getElementById('veto-row');
    let _sig = '';

    // Overwatch game-mode icons — m.mode carries the pool entry's type (Control/Hybrid/Escort/
    // Push/Flashpoint/Clash). Other games' mode strings (e.g. CS2) have no matching icon, so the
    // label just falls back to text, same as before.
    // Rocket League modes are chosen per map row (Standard/Hoops/Dropshot/Snow Day/Rumble/
    // Heatseeker/Spike Rush) and carry their own icon set. 'soccar' is kept as an alias of
    // 'standard' — same mode under its in-game file name, so older saved boards still get an icon.
    const MODE_IMG = {
      control: '/assets/overwatch/modes/Control.webp', hybrid: '/assets/overwatch/modes/Hybrid.webp',
      escort: '/assets/overwatch/modes/Escort.webp', push: '/assets/overwatch/modes/Push.webp',
      flashpoint: '/assets/overwatch/modes/Flashpoint.webp', clash: '/assets/overwatch/modes/Clash.webp',
      assault: '/assets/overwatch/modes/Assault.webp',
      standard: '/assets/rocket-league/modes/soccar.svg', soccar: '/assets/rocket-league/modes/soccar.svg',
      hoops: '/assets/rocket-league/modes/hoops.svg',
      dropshot: '/assets/rocket-league/modes/dropshot.svg', 'snow day': '/assets/rocket-league/modes/snow-day.svg',
      rumble: '/assets/rocket-league/modes/rumble.svg', heatseeker: '/assets/rocket-league/modes/heatseeker.svg',
      'spike rush': '/assets/rocket-league/modes/spike-rush.svg'
    };
    function buildModeEl(modeText) {
      const mode = document.createElement('div'); mode.className = 'mode';
      const icon = MODE_IMG[(modeText || '').toLowerCase().trim()];
      if (icon) {
        mode.classList.add('mode-icon');
        const img = document.createElement('img'); img.src = icon; img.alt = '';
        img.onerror = () => { img.remove(); mode.classList.remove('mode-icon'); mode.textContent = (modeText || '').toUpperCase(); };
        const span = document.createElement('span'); span.textContent = modeText.toUpperCase();
        mode.appendChild(img); mode.appendChild(span);
      } else {
        mode.textContent = (modeText || '').toUpperCase();
      }
      return mode;
    }

    function teamFor(by, data) {
      if (by === 'a') return SceneBase.teamSide(data, 'blue');
      if (by === 'b') return SceneBase.teamSide(data, 'orange');
      return null;
    }
    function chipText(m, data) {
      if (m.action === 'decider') return 'DECIDER';
      const t = teamFor(m.by, data);
      const who = t ? t.name : '';
      // Per-game vocabulary: veto.banWord is 'Strike' for Smash, 'Ban' everywhere else
      // (backend/veto.js VETO_META). Hardcoding "BAN" mislabelled every Smash stage strike.
      const banWord = String(((data.veto || {}).banWord) || 'Ban').toUpperCase();
      if (m.action === 'ban')  return who ? `${who} ${banWord}` : banWord;
      if (m.action === 'pick') return who ? `${who} PICK` : 'PICK';
      return '';
    }

    function render(data) {
      const v = data.veto || {};
      stage.classList.add('show');

      titleEl.textContent = (v.title || 'MAP POOL').toUpperCase();
      // Active brand kit's logo on the header plate (hidden when no kit is active).
      const brandEl = document.getElementById('veto-brand');
      if (brandEl) {
        const logo = SceneBase.brandLogo(data);
        if (logo) {
          if (brandEl.getAttribute('src') !== logo) brandEl.src = logo;
          brandEl.style.display = '';
        } else {
          brandEl.style.display = 'none';
        }
      }
      const maps = Array.isArray(v.maps) ? v.maps : [];
      const blue = SceneBase.teamSide(data, 'blue');
      const orange = SceneBase.teamSide(data, 'orange');
      // Running series record = maps each side has already won.
      const aWins = maps.filter((m) => m.winner === 'a').length;
      const bWins = maps.filter((m) => m.winner === 'b').length;
      // Sponsor rail — active brand kit, desk placement first (same rule as standings/intro).
      const brand = data.brand || {};
      const anyTagged = (brand.deskSponsors || []).length || (brand.railSponsors || []).length || (brand.bannerSponsors || []).length;
      const sponsors = ((brand.deskSponsors || []).length ? brand.deskSponsors : (anyTagged ? [] : (brand.sponsors || [])))
        .filter((s) => s && s.logo);

      // Rebuild only when the data changes (avoid restarting card animations each tick).
      const sig = JSON.stringify({ maps, t: v.title,
        a: { n: blue.name, c: blue.color, l: (blue.logo || '').slice(0, 40), w: aWins },
        o: { n: orange.name, c: orange.color, l: (orange.logo || '').slice(0, 40), w: bWins },
        sp: sponsors.map((s) => s.logo.slice(0, 40)) });
      if (sig === _sig) return;
      _sig = sig;

      // ── Scorecard header (team logo + name flanking the series record) ──
      const setName = (id, t) => { const e = document.getElementById(id); if (e) e.textContent = (t.name || '').toUpperCase(); };
      // The tile (not the <img>) is what hides when a team has no logo, so an empty
      // frame never sits next to the name.
      const setLogo = (id, tileId, t) => {
        const e = document.getElementById(id), tile = document.getElementById(tileId); if (!e || !tile) return;
        if (t.logo) {
          if (e.getAttribute('src') !== t.logo) e.src = t.logo;
          e.classList.toggle('on-dark', SceneBase.isDefaultGameLogo(t.logo));
          tile.classList.remove('is-empty');
        } else { e.removeAttribute('src'); tile.classList.add('is-empty'); }
      };
      setName('vs-name-a', blue); setName('vs-name-b', orange);
      setLogo('vs-logo-a', 'vs-tile-a', blue); setLogo('vs-logo-b', 'vs-tile-b', orange);
      // Team colours drive the header's end washes, name underlines, logo-tile frames and base bar.
      // The decider chip is filled with the raw brand accent — measure its text against it.
      const accNow = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      if (accNow) document.documentElement.style.setProperty('--on-accent', SceneBase.onColor(accNow));
      const headEl = document.querySelector('.veto-head');
      if (headEl) {
        headEl.style.setProperty('--team-a', blue.color || 'var(--accent)');
        headEl.style.setProperty('--team-b', orange.color || 'var(--accent)');
      }
      const wa = document.getElementById('vs-w-a'), wb = document.getElementById('vs-w-b');
      if (wa) { wa.textContent = aWins; wa.style.color = blue.color || '#fff'; }
      if (wb) { wb.textContent = bWins; wb.style.color = orange.color || '#fff'; }

      // ── Sponsor rail ──
      const spEl = document.getElementById('veto-sponsors');
      if (spEl) {
        spEl.innerHTML = sponsors.length
          ? '<span class="veto-sponsors-lbl">Presented by</span>' + sponsors.map((s) => `<img class="veto-sponsor" src="${s.logo}" alt="">`).join('')
          : '';
        spEl.classList.toggle('is-empty', !sponsors.length);
      }

      // Scale card width to fit the row.
      const n = Math.max(1, maps.length);
      const w = Math.min(300, Math.floor((1920 - 120 - (n - 1) * 26) / n));

      rowEl.innerHTML = '';
      maps.forEach((m, i) => {
        const t = teamFor(m.by, data);
        const completed = (m.winner === 'a' || m.winner === 'b') || (m.score && (m.score.a || m.score.b));

        const card = document.createElement('div');
        card.className = 'map-card' + (m.action ? ' ' + m.action : '') + (completed ? ' completed' : '');
        card.style.width = w + 'px';
        card.style.animationDelay = (0.4 + i * 0.12) + 's';

        const img = document.createElement('div'); img.className = 'img';
        // Games without real map art yet (image:'' in the pool) still look intentional — a
        // subtle brand-tinted gradient instead of flat black. Completed maps grayscale via CSS
        // (.map-card.completed .img) regardless of which background this ends up being.
        if (m.image) img.style.backgroundImage = `url('${m.image}')`;
        else img.style.background = 'radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent) 22%, #14161c), #0a0b0f)';
        const shade = document.createElement('div'); shade.className = 'shade';
        const mode = buildModeEl(m.mode);
        const name = document.createElement('div'); name.className = 'name'; name.textContent = (m.name || 'TBA').toUpperCase();

        card.appendChild(img); card.appendChild(shade); card.appendChild(mode); card.appendChild(name);

        if (m.action === 'pick' && t) card.style.borderBottomColor = t.color;
        if (m.winner === 'a') card.style.borderBottomColor = blue.color;
        if (m.winner === 'b') card.style.borderBottomColor = orange.color;

        if (completed) {
          // One centered block: the WINNING team's logo above the score. No logo shown for a
          // draw/no-winner-yet score (score still displays either way).
          const result = document.createElement('div'); result.className = 'result';
          const winnerTeam = m.winner === 'a' ? blue : m.winner === 'b' ? orange : null;
          if (winnerTeam && winnerTeam.logo) {
            const logo = document.createElement('img'); logo.className = 'result-logo'; logo.src = winnerTeam.logo;
            if (SceneBase.isDefaultGameLogo(winnerTeam.logo)) logo.classList.add('on-dark');
            result.appendChild(logo);
          }
          const a = (m.score && m.score.a) || 0, b = (m.score && m.score.b) || 0;
          const sc = document.createElement('div'); sc.className = 'result-score';
          sc.innerHTML = `<span>${a}</span><span class="sep">–</span><span>${b}</span>`;
          result.appendChild(sc);
          card.appendChild(result);
        } else {
          const chip = document.createElement('div'); chip.className = 'chip';
          chip.textContent = chipText(m, data);
          // The chip is filled with the TEAM's own colour, so its text has to be measured against
          // that colour — a team on white or bright yellow had an invisible chip label.
          if (m.action === 'pick' && t) {
            chip.style.background = t.color;
            chip.style.setProperty('--chip-fg', SceneBase.onColor(t.color));
          }
          else if (m.action === 'ban') chip.style.background = '#444';
          if (!chip.textContent) chip.style.display = 'none';
          card.appendChild(chip);
        }
        rowEl.appendChild(card);
      });
    }
    SceneBase.connect((data) => { SceneBase.applySceneConfig('veto', data); render(data); });

    if (location.protocol === 'file:') {
      render({ teams: { blue: { name: 'FROST', color: '#3b82f6' }, orange: { name: 'EMBER', color: '#f97316' } },
        veto: { visible: true, title: 'Grand Final — Map Veto', maps: [
          { name: 'Mirage',   mode: 'CS2', action: 'ban',  by: 'a' },
          { name: 'Inferno',  mode: 'CS2', action: 'ban',  by: 'b' },
