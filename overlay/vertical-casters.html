<!DOCTYPE html>
<!--
  vertical-casters.html — 9:16 (1080x1920) caster desk for TikTok & YouTube Shorts.
  A VERTICAL COMPANION to duorow.html / triorow.html / casters.html, not a replacement:
  same caster slots, same scorebar data, same brand kit — restacked as a portrait column
  and kept clear of the phone UI.

  Set the OBS browser source to 1080 x 1920.

  Unlike vertical.html (which reserves a 16:9 gameplay window), this scene gives the whole
  frame to the talent — for desk segments, pre/post show and reaction clips.

  URL params:
    ?count=1|2|3     how many caster cams (default 2)
    ?cams=off        transparent cam holes — position separate OBS sources behind them
                     (add &guide=1 to print each hole's exact rectangle)
    ?score=off       hide the top scorebar
    ?safe=0          use the full 1080x1920 frame (default: keep clear of phone UI)
    ?guides=1        outline the safe area while you position the source
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <style>
    :root {
      --duo-surface: #1a1d24; --duo-surface2: #20242e; --duo-border: #2e3340;
      --duo-accent: #e83a8b; --duo-accent2: #8b5cf6; --duo-muted: #8b93a8;
      --team-a: #055fdb; --team-b: #e97139;
      /* Safe area — TikTok/Shorts paint their UI over the top strip and the bottom
         caption block, so the column sits inside these insets by default. */
      --pad-top: 120px; --pad-bottom: 330px; --pad-x: 34px; --gap: 20px;
    }
    .no-safe { --pad-top: 30px; --pad-bottom: 30px; --pad-x: 26px; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden; background: transparent;
      font-family: 'Inter', system-ui, sans-serif; color: #e8eaf0; -webkit-font-smoothing: antialiased;
    }

    .v-stage {
      /* Pinned to the 1080x1920 page, not the viewport, so the layout holds even when the
         source is previewed in a shorter window. */
      position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; z-index: 2;
      display: flex; flex-direction: column; gap: var(--gap);
      padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
      opacity: 0; transition: opacity .4s ease;
    }
    .v-stage.show { opacity: 1; }

    /* Safe-area guide (?guides=1) */
    .v-guide { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; z-index: 9; display: none; pointer-events: none; }
    .guides .v-guide { display: block; }
    .v-guide i {
      position: absolute; left: var(--pad-x); right: var(--pad-x); top: var(--pad-top); bottom: var(--pad-bottom);
      border: 2px dashed rgba(255,47,214,.85); border-radius: 18px;
    }
    .v-guide span {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--pad-bottom) + 12px);
      font: 800 22px/1 ui-monospace, monospace; letter-spacing: .12em; color: #ff7fe6;
      background: rgba(0,0,0,.7); padding: 6px 12px; border-radius: 6px;
    }

    /* ── Top scorebar ── */
    .match-hud {
      position: relative; display: flex; align-items: stretch; flex: 0 0 138px; height: 138px;
      border-radius: 16px; overflow: hidden;
      background: linear-gradient(180deg, rgba(24,27,34,.98), rgba(10,12,16,.99));
      border: 1px solid rgba(255,255,255,.07); box-shadow: 0 14px 36px rgba(0,0,0,.55);
    }
    .match-hud.hidden { display: none; }
    .match-hud::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; z-index: 3;
      background: linear-gradient(90deg, transparent 4%, rgba(255,255,255,.35) 50%, transparent 96%);
    }
    .match-team { flex: 1 1 0; min-width: 0; position: relative; display: flex; align-items: center; gap: 10px; }
    .match-team--a { padding: 0 10px 0 20px; } .match-team--b { padding: 0 20px 0 10px; }
    .match-team::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; }
    .match-team--a::after { background: linear-gradient(90deg, var(--team-a), transparent 70%); }
    .match-team--b::after { background: linear-gradient(270deg, var(--team-b), transparent 70%); }
    .match-logo { width: 80px; height: 80px; object-fit: contain; flex: 0 0 80px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
    .match-logo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
    .match-name {
      flex: 1 1 0; min-width: 0; font-size: 30px; font-weight: 800; letter-spacing: .03em;
      text-transform: uppercase; line-height: 1; color: #fff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .match-team--b .match-name { text-align: right; }
    .match-score { flex: 0 0 auto; font-size: 54px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 32px; text-align: center; }
    .match-team--a .match-score { color: var(--team-a); } .match-team--b .match-score { color: var(--team-b); }
    .match-center {
      flex: 0 0 128px; display: flex; align-items: center; justify-content: center;
      background: rgba(6,8,12,.97);
      border-left: 1px solid rgba(255,255,255,.1); border-right: 1px solid rgba(255,255,255,.1);
    }
    .match-vs { font-size: 44px; font-weight: 900; letter-spacing: .08em; color: #fff; }

    /* ── Caster column ── */
    .v-cams { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
    .cam-card {
      flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
      border-radius: 18px; overflow: hidden; border: 1px solid var(--duo-border);
      background: var(--duo-surface); box-shadow: 0 18px 46px rgba(0,0,0,.5);
    }
    .cam-card::before {
      content: ''; display: block; height: 4px; flex: 0 0 auto;
      background: linear-gradient(90deg, transparent, var(--duo-accent) 30%, var(--duo-accent2) 70%, transparent);
    }
    .cam-hole { position: relative; width: 100%; flex: 1 1 auto; min-height: 0; background: #0d0f14; overflow: hidden; }
    /* Wide cam box on a portrait canvas: keep the iframe 16:9 and size it to COVER the
       hole (crop the sides) so the caster fills the frame instead of letterboxing. */
    .cam-hole iframe {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: auto; height: auto; min-width: 100%; min-height: 100%;
      aspect-ratio: 16 / 9; border: 0;
    }
    /* ?cams=off framing: transparent holes so per-caster OBS sources show through. */
    .v-stage.frames-only .cam-hole { background: transparent; }

    .cam-plate {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      height: 76px; flex: 0 0 76px; padding: 0 22px;
      background: linear-gradient(180deg, var(--duo-surface2), var(--duo-surface));
      border-top: 1px solid var(--duo-border);
    }
    .cam-name { font-size: 32px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cam-country { display: inline-flex; align-items: center; }
    .cam-flag { height: 26px; width: auto; display: block; border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.45); }
    .cam-handle { font-size: 22px; font-weight: 600; color: #9aa3b8; white-space: nowrap; }
    .cam-handle::before { font-family: 'Font Awesome 6 Brands'; font-weight: 400; margin-right: 8px; }
    .cam-handle.twitch::before { content: "\f1e8"; color: #9146ff; } .cam-handle.youtube::before { content: "\f167"; color: #ff0033; }
    .cam-handle.x-twitter::before { content: "\e61b"; color: #e8eaf0; } .cam-handle.instagram::before { content: "\f16d"; color: #e1306c; }
    .cam-handle.tiktok::before { content: "\e07b"; color: #25f4ee; } .cam-handle.discord::before { content: "\f392"; color: #5865f2; }
    .cam-handle.facebook::before { content: "\f09a"; color: #1877f2; }
    .cam-handle.kick::before { content: "K"; font-family: 'Inter', sans-serif; font-weight: 900; color: #53fc18; }
    .cam-handle.link::before { content: "\f0c1"; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: var(--duo-muted); }

    /* ── Footer ── */
    .v-footer { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .deck-strip {
      width: 100%; padding: 15px 30px; text-align: center; position: relative;
      background: linear-gradient(90deg, transparent, rgba(14,16,22,.94) 10%, rgba(14,16,22,.94) 90%, transparent);
      border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .deck-strip.is-empty { display: none; }
    .deck-strip-text { font-size: 22px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #c8ced8; white-space: nowrap; }
    .presented-by {
      display: inline-flex; align-items: center; gap: 16px; padding: 11px 30px; border-radius: 11px;
      background: linear-gradient(180deg, rgba(20,23,30,.96), rgba(10,12,16,.98));
      border: 1px solid rgba(255,255,255,.08); box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .presented-by.is-empty { display: none; }
    .pb-label { font-size: 14px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--duo-muted); white-space: nowrap; }
    .pb-logo { height: 42px; max-width: 300px; object-fit: contain; }

    /* file:// preview stand-ins */
    .preview .cam-hole { background: repeating-linear-gradient(45deg, #181b22, #181b22 18px, #20242e 18px, #20242e 36px); }
    .preview .cam-hole::after {
      content: 'CAM'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800; letter-spacing: .3em; color: #4a5162;
    }
    .preview .cam-hole iframe { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="v-guide"><i></i><span>SAFE AREA</span></div>

  <div id="stage" class="v-stage">
    <header class="match-hud" id="match-hud">
      <div class="match-team match-team--a"><img id="teamlogo1" class="match-logo" alt=""><span id="teamname1" class="match-name">BLUE</span><span id="teamscore1" class="match-score">0</span></div>
      <div class="match-center"><span class="match-vs">VS</span></div>
      <div class="match-team match-team--b"><span id="teamscore2" class="match-score">0</span><span id="teamname2" class="match-name">ORANGE</span><img id="teamlogo2" class="match-logo" alt=""></div>
    </header>

    <div class="v-cams" id="cams"></div>

    <div class="v-footer">
      <div class="deck-strip is-empty" id="deck-strip"><span id="tagline" class="deck-strip-text">Live</span></div>
      <div class="presented-by is-empty" id="presented-by">
        <span class="pb-label" id="pb-label">PRESENTED BY</span>
        <img id="pb-logo" class="pb-logo" alt="" style="display:none">
      </div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    const QP = new URLSearchParams(location.search);
    const CAM_COUNT = Math.max(1, Math.min(3, parseInt(QP.get('count') || '2', 10) || 2));
    const NO_CAMS   = QP.get('cams') === 'off';
    const SHOW_SCORE = !/^(off|none|hide|0)$/i.test((QP.get('score') || '').trim());
    const root = document.documentElement;
    if (QP.get('safe') === '0')   root.classList.add('no-safe');
    if (QP.get('guides') === '1') root.classList.add('guides');

    function el(id) { return document.getElementById(id); }
    const stage = el('stage');
    if (NO_CAMS) stage.classList.add('frames-only');
    if (!SHOW_SCORE) el('match-hud').classList.add('hidden');
    let _lastCamUrl = new Array(CAM_COUNT).fill(null);

    function applyBrandTheme(data) {
      const color = SceneBase.brandColor(data), accent2 = SceneBase.brandAccent(data);
      if (color)   root.style.setProperty('--duo-accent', color);
      if (accent2) root.style.setProperty('--duo-accent2', accent2);
      if (data.fontFamily) root.style.fontFamily = `'${data.fontFamily}', 'Inter', system-ui, sans-serif`;
    }
    function buildCams() {
      const cams = el('cams'); cams.innerHTML = '';
      for (let i = 1; i <= CAM_COUNT; i++) {
        const card = document.createElement('div'); card.className = 'cam-card';
        card.innerHTML = `<div id="hole${i}" class="cam-hole"></div>`
          + `<div class="cam-plate">`
          + `<span id="staffname${i}" class="cam-name">—</span>`
          + `<span id="socials${i}" class="cam-handle" style="display:none"></span>`
          + `<span id="country${i}" class="cam-country" style="display:none"></span>`
          + `</div>`;
        cams.appendChild(card);
      }
    }
    function renderCasters(casters) {
      if (NO_CAMS) return;
      const slots = SceneBase.castersBySlots(casters, CAM_COUNT);
      for (let i = 0; i < CAM_COUNT; i++) {
        const camUrl = ((slots[i] && slots[i].camUrl) || '').trim();
        if (camUrl === _lastCamUrl[i]) continue;            // don't reload a live feed on every state push
        _lastCamUrl[i] = camUrl;
        const hole = el('hole' + (i + 1)); if (!hole) continue;
        hole.querySelectorAll('iframe').forEach(f => f.remove());
        if (camUrl) {
          const f = document.createElement('iframe');
          f.src = camUrl;
          f.setAttribute('allow', 'autoplay; encrypted-media; microphone; camera; fullscreen');
          f.referrerPolicy = 'no-referrer';
          hole.appendChild(f);
        }
      }
    }
    function renderCasterText(casters) {
      const slots = SceneBase.castersBySlots(casters, CAM_COUNT);
      for (let i = 0; i < CAM_COUNT; i++) {
        const c = slots[i] || {};
        const nameEl = el('staffname' + (i + 1)), socEl = el('socials' + (i + 1)), ctryEl = el('country' + (i + 1));
        if (!nameEl || !socEl) continue;
        nameEl.textContent = (c.name || '—').toString();
        const handle = SceneBase.formatCasterHandle(c), social = (c.social || 'none').toString().toLowerCase();
        if (handle) { socEl.className = 'cam-handle ' + SceneBase.socialPlatformClass(social); socEl.textContent = handle; socEl.style.display = ''; }
        else socEl.style.display = 'none';
        if (ctryEl) {
          // Image flag (renders on Windows/OBS, unlike flag emoji): bundled SVG, CDN fallback.
          const code = (c.country || '').toString().trim().toLowerCase();
          if (casters && casters.showCountry && code) {
            ctryEl.innerHTML = '<img class="cam-flag" alt="" src="/assets/flags/' + code + '.svg"'
              + ' onerror="this.onerror=null;this.src=\'https://flagcdn.com/' + code + '.svg\'">';
            ctryEl.style.display = '';
          } else { ctryEl.innerHTML = ''; ctryEl.style.display = 'none'; }
        }
      }
    }
    function renderTeam(idx, t, side) {
      SceneBase.applyTeamLogo(el('teamlogo' + idx), t.customLogo, t.logo);
      // Head-to-head games (Smash singles, the FGC titles) print the COMPETITOR here, with their
      // org on a second line — the team record on those is just the entrant. See SceneBase.
      SceneBase.applyNamePlate(el('teamname' + idx), t, side === 'b' ? 'ORANGE' : 'BLUE');
      el('teamscore' + idx).textContent = t.series != null ? t.series : 0;
      root.style.setProperty(side === 'b' ? '--team-b' : '--team-a', t.color || (side === 'b' ? '#e97139' : '#055fdb'));
    }
    function renderPresentedBy(data) {
      // Title-sponsor plate: with a brand kit active this shows ONLY a sponsor tagged
      // "Title"; no kit -> the manually uploaded scoreboard ad, same as the other desks.
      const brand = data.brand || {};
      const slot = brand.id
        ? { label: (data.scoreboardAd || {}).label, logo: (brand.spots && brand.spots.title) || '' }
        : (data.scoreboardAd || {});
      const wrap = el('presented-by');
      if (slot.logo) {
        el('pb-label').textContent = (slot.label || 'PRESENTED BY').toString().trim();
        const logo = el('pb-logo'); logo.src = slot.logo; logo.style.display = '';
        wrap.classList.remove('is-empty');
      } else {
        el('pb-logo').style.display = 'none'; el('pb-logo').removeAttribute('src');
        wrap.classList.add('is-empty');
      }
    }
    function renderDeckStrip(data) {
      const tag = ((data.casters && data.casters.lowerThird) || data.eventName || '').toString().trim();
      const strip = el('deck-strip'), tagEl = el('tagline');
      if (tag) { tagEl.textContent = tag; strip.classList.remove('is-empty'); }
      else { tagEl.textContent = ''; strip.classList.add('is-empty'); }
    }
    function render(data) {
      data = data || {};
      applyBrandTheme(data);
      const casters = data.casters || {};
      stage.classList.toggle('show', SceneBase.casterStageVisible(casters));
      renderCasters(casters); renderCasterText(casters);
      renderTeam(1, SceneBase.teamSide(data, 'blue'), 'a');
      renderTeam(2, SceneBase.teamSide(data, 'orange'), 'b');
      renderPresentedBy(data); renderDeckStrip(data);
    }

    buildCams();
    if (location.protocol === 'file:') {
      root.classList.add('preview');
      render({
        casters: { visible: true, showCountry: true, lowerThird: 'Grand Final — Best of 5', list: [
          { id: 'c1', name: 'Jordan', handle: 'jreyescasts', slot: 1, social: 'x', country: 'us' },
          { id: 'c2', name: 'Mia', handle: 'miaplays', slot: 2, social: 'twitch', country: 'jp' },
          { id: 'c3', name: 'Sam', handle: 'samok', slot: 3, social: 'youtube', country: 'gb' } ] },
        teams: { blue: { name: 'Velocity', color: '#3b82f6' }, orange: { name: 'Apex', color: '#f97316' } },
        series: { blue: 2, orange: 1 },
        scoreboardAd: { label: 'PRESENTED BY', logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="46"><rect width="200" height="46" rx="5" fill="#1a1d24"/><text x="100" y="31" font-size="21" fill="#e8eaf0" text-anchor="middle" font-family="Arial" font-weight="bold">SPONSOR</text></svg>') }
      });
      stage.classList.add('show');
    } else {
      SceneBase.connect(render);
    }
  </script>
</body>
</html>
