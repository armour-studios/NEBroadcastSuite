<!DOCTYPE html>
<!--
  quaddesk-noscore.html — 4-person panel with NO match scorebar and NO "presented by" plate:
  a 2x2 grid of framed caster cams + a lower-third footer. Casters slots 1-4. Same design
  language as quaddesk.html (which is untouched); built for podcasts and panels, so nothing
  here reads teams/series or the sponsor slot.
  The cams take the space the scorebar used to hold, so every frame is bigger.
  ?cams=off  frames-only (composite each cam as its own OBS source over the holes)
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <style>
    :root {
      --duo-surface: #1a1d24; --duo-surface2: #20242e; --duo-border: #2e3340;
      --duo-accent: #e83a8b; --duo-accent2: #8b5cf6; --duo-muted: #8b93a8;
      --team-a: #055fdb; --team-b: #e97139;
      --stage-w: 1920px; --stage-h: 1080px; --pad-x: 24px; --cam-gap: 16px; --cam-plate-h: 46px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: var(--stage-w); height: var(--stage-h); overflow: hidden; background: transparent; font-family: 'Inter', system-ui, sans-serif; color: #e8eaf0; -webkit-font-smoothing: antialiased; }
    .duo-stage { display: flex; flex-direction: column; width: var(--stage-w); height: var(--stage-h); padding: 14px var(--pad-x) 26px; opacity: 0; transition: opacity .35s ease; }
    .duo-stage.show { opacity: 1; }
    .zone-cams { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px 0; }
    /* Wider than quaddesk.html's 1280px: with no scorebar (and no sponsor plate) the reclaimed
       height goes into the cams. 1520px is the widest that still keeps BOTH rows (16:9 hole +
       name plate) and the lower third inside 1080 — wider clips the lower third. */
    .quad { display: grid; grid-template-columns: 1fr 1fr; gap: var(--cam-gap); width: min(1520px, 100%); align-content: center; }
    .zone-footer { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }

    .duo-stage:not(.show) .cam-card, .duo-stage:not(.show) .deck-strip { opacity: 0; }
    .duo-stage.show .cam-card:nth-child(1) { animation: camIn .6s cubic-bezier(.16,.84,.24,1) .14s forwards; }
    .duo-stage.show .cam-card:nth-child(2) { animation: camIn .6s cubic-bezier(.16,.84,.24,1) .20s forwards; }
    .duo-stage.show .cam-card:nth-child(3) { animation: camIn .6s cubic-bezier(.16,.84,.24,1) .26s forwards; }
    .duo-stage.show .cam-card:nth-child(4) { animation: camIn .6s cubic-bezier(.16,.84,.24,1) .32s forwards; }
    .duo-stage.show .deck-strip { animation: stripUp .6s cubic-bezier(.16,.84,.24,1) .42s forwards; }
    @keyframes camIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }
    @keyframes stripUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .cam-card { display: flex; flex-direction: column; min-height: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--duo-border); background: var(--duo-surface); box-shadow: 0 12px 34px rgba(0,0,0,.45); }
    .cam-card::before { content: ''; display: block; height: 3px; flex: 0 0 auto; background: linear-gradient(90deg, transparent, var(--duo-accent) 30%, var(--duo-accent2) 70%, transparent); }
    .cam-hole { position: relative; width: 100%; aspect-ratio: 16 / 9; flex: 0 0 auto; background: #0d0f14; overflow: hidden; }
    .cam-hole iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* ?cams=off framing: transparent holes so per-caster OBS sources show through. */
    .duo-stage.frames-only .cam-hole { background: transparent; }
    .duo-stage.frames-only .cam-card { background: transparent; box-shadow: none; border-color: transparent; }
    .duo-stage.frames-only .cam-card::before { display: none; }
    .cam-plate { display: flex; align-items: center; justify-content: center; gap: 11px; height: var(--cam-plate-h); flex: 0 0 var(--cam-plate-h); padding: 0 16px; background: linear-gradient(180deg, var(--duo-surface2), var(--duo-surface)); border-top: 1px solid var(--duo-border); }
    .cam-name { font-size: 19px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cam-handle { font-size: 13px; font-weight: 600; color: #9aa3b8; }
    .cam-handle::before { font-family: 'Font Awesome 6 Brands'; font-weight: 400; margin-right: 6px; }
    .cam-handle.twitch::before { content: "\f1e8"; color: #9146ff; } .cam-handle.youtube::before { content: "\f167"; color: #ff0033; }
    .cam-handle.x-twitter::before { content: "\e61b"; color: #e8eaf0; } .cam-handle.instagram::before { content: "\f16d"; color: #e1306c; }
    .cam-handle.tiktok::before { content: "\e07b"; color: #25f4ee; } .cam-handle.discord::before { content: "\f392"; color: #5865f2; }
    .cam-handle.facebook::before { content: "\f09a"; color: #1877f2; }
    .cam-handle.kick::before { content: "K"; font-family: 'Inter', sans-serif; font-weight: 900; color: #53fc18; }
    .cam-handle.link::before { content: "\f0c1"; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: var(--duo-muted); }

    .deck-strip { max-width: 900px; padding: 7px 28px; text-align: center; position: relative; background: linear-gradient(90deg, transparent, rgba(14,16,22,.92) 12%, rgba(14,16,22,.92) 88%, transparent); border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06); }
    .deck-strip::before, .deck-strip::after { content: ''; position: absolute; top: 50%; width: 48px; height: 1px; background: linear-gradient(90deg, transparent, var(--duo-accent)); opacity: .5; }
    .deck-strip::before { left: 12px; } .deck-strip::after { right: 12px; transform: scaleX(-1); }
    .deck-strip-text { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #c8ced8; white-space: nowrap; }
    .deck-strip.is-empty { display: none; }

    .preview .cam-hole { background: repeating-linear-gradient(45deg, #181b22, #181b22 16px, #20242e 16px, #20242e 32px); }
    .preview .cam-hole::after { content: 'CAM'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; letter-spacing: .3em; color: #4a5162; }
    .preview .cam-hole iframe { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div id="stage" class="duo-stage">
    <div class="zone-cams"><div class="quad" id="cams"></div></div>
    <div class="zone-footer">
      <div class="deck-strip is-empty" id="deck-strip"><span id="tagline" class="deck-strip-text">Live</span></div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    function el(id) { return document.getElementById(id); }
    const CAM_COUNT = 4;
    const NO_CAMS = new URLSearchParams(location.search).get('cams') === 'off';
    if (NO_CAMS) document.getElementById('stage')?.classList.add('frames-only');
    let _lastCamUrl = new Array(CAM_COUNT).fill(null);

    function applyBrandTheme(data) {
      const root = document.documentElement;
      const color = SceneBase.brandColor(data), accent2 = SceneBase.brandAccent(data);
      if (color) root.style.setProperty('--duo-accent', color);
      if (accent2) root.style.setProperty('--duo-accent2', accent2);
      if (data.fontFamily) root.style.fontFamily = `'${data.fontFamily}', 'Inter', system-ui, sans-serif`;
    }
    function buildCams() {
      const cams = el('cams'); cams.innerHTML = '';
      for (let i = 1; i <= CAM_COUNT; i++) {
        const card = document.createElement('div'); card.className = 'cam-card';
        card.innerHTML = `<div id="hole${i}" class="cam-hole"></div><div class="cam-plate"><span id="staffname${i}" class="cam-name">—</span><span id="socials${i}" class="cam-handle" style="display:none"></span></div>`;
        cams.appendChild(card);
      }
    }
    function renderCasters(casters) {
      if (NO_CAMS) return;
      const slots = SceneBase.castersBySlots(casters, CAM_COUNT);
      for (let i = 0; i < CAM_COUNT; i++) {
        const camUrl = ((slots[i] && slots[i].camUrl) || '').trim();
        if (camUrl === _lastCamUrl[i]) continue;
        _lastCamUrl[i] = camUrl;
        const hole = el('hole' + (i + 1)); if (!hole) continue;
        hole.querySelectorAll('iframe').forEach(f => f.remove());
        if (camUrl) { const iframe = document.createElement('iframe'); iframe.src = camUrl; iframe.setAttribute('allow', 'autoplay; encrypted-media; microphone; camera; fullscreen'); iframe.referrerPolicy = 'no-referrer'; hole.appendChild(iframe); }
      }
    }
    function renderCasterText(casters) {
      const slots = SceneBase.castersBySlots(casters, CAM_COUNT);
      for (let i = 0; i < CAM_COUNT; i++) {
        const c = slots[i] || {};
        const nameEl = el('staffname' + (i + 1)), socEl = el('socials' + (i + 1));
        if (!nameEl || !socEl) continue;
        nameEl.textContent = (c.name || '—').toString();
        const handle = SceneBase.formatCasterHandle(c), social = (c.social || 'none').toString().toLowerCase();
        if (handle) { socEl.className = 'cam-handle ' + SceneBase.socialPlatformClass(social); socEl.textContent = handle; socEl.style.display = ''; } else socEl.style.display = 'none';
      }
    }
    function renderDeckStrip(data) {
      const tag = ((data.casters && data.casters.lowerThird) || '').toString().trim();
      const strip = el('deck-strip'), tagEl = el('tagline');
      if (tag) { tagEl.textContent = tag; strip.classList.remove('is-empty'); } else { tagEl.textContent = ''; strip.classList.add('is-empty'); }
    }
    function render(data) {
      data = data || {};
      applyBrandTheme(data);
      const casters = data.casters || {};
      el('stage').classList.toggle('show', SceneBase.casterStageVisible(casters));
      renderCasters(casters); renderCasterText(casters);
      // No teams / series and no "presented by" plate here by design — this panel never touches
      // match state, and the footer carries the lower third only.
      renderDeckStrip(data);
    }
    buildCams();
    if (location.protocol === 'file:') {
      document.documentElement.classList.add('preview');
      render({ casters: { visible: true, lowerThird: 'Episode 12 — Roster Moves & Mid-Season Power Rankings', list: [
        { id: 'c1', name: 'Jordan', handle: 'jreyescasts', slot: 1, social: 'x' },
        { id: 'c2', name: 'Mia', handle: 'miaplays', slot: 2, social: 'twitch' },
        { id: 'c3', name: 'Sam', handle: 'samok', slot: 3, social: 'youtube' },
        { id: 'c4', name: 'Ash', handle: 'ashcasts', slot: 4, social: 'kick' } ] } });
      el('stage').classList.add('show');
    } else { SceneBase.connect(render); }
  </script>
</body>
</html>
