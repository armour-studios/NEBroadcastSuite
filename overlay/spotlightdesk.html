<!DOCTYPE html>
<!--
  spotlightdesk.html — player spotlight desk.
  Left: analyst cam (1-2 slots, 16:9). Right: player cam (16:9, always) + info bar below.
  Info = spotlight player + stats; when interviewee is set, info = guest name + team.
  Driven by full_state on WS :3001 via SceneBase.connect().
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <style>
    :root {
      --duo-surface: #1a1d24; --duo-surface2: #20242e; --duo-border: #2e3340;
      --duo-accent: #e83a8b; --duo-accent2: #8b5cf6; --duo-muted: #8b93a8;
      --team-a: #055fdb; --team-b: #e97139; --feat: var(--duo-accent);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: 'Inter', system-ui, sans-serif; color: #e8eaf0; -webkit-font-smoothing: antialiased; }

    .sp-stage { position: absolute; inset: 0; display: flex; flex-direction: column;
      padding: 32px 26px 16px; opacity: 0; transition: opacity .4s ease; }
    .sp-stage.show { opacity: 1; }

    /* ── Header — fixed height so OBS cam positions never shift ──────────── */
    .sp-header { flex: 0 0 58px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; margin-bottom: 16px; }
    .sp-eyebrow { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 700; font-size: 16px;
      letter-spacing: .46em; text-transform: uppercase; color: var(--feat); line-height: 1; }
    .sp-title { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 700; font-size: 36px;
      text-transform: uppercase; color: #fff; line-height: 1; opacity: 0; transition: opacity .3s; }
    .sp-title.has-text { opacity: 1; }

    /* ── Optional scorebar (?scorebar=1) ──────────────────────────────────── */
    .sp-scorebar { display: none; }
    .sp-stage.has-scorebar .sp-scorebar { display: flex; align-self: center; width: min(1200px, 100%);
      flex: 0 0 84px; height: 84px; margin-bottom: 14px; align-items: stretch;
      background: linear-gradient(180deg, rgba(24,27,34,.98), rgba(10,12,16,.99));
      border: 1px solid rgba(255,255,255,.07); border-radius: 12px; overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,.5); }
    .sp-scorebar .match-team { flex: 1 1 0; min-width: 0; position: relative; display: flex; align-items: center; gap: 8px; }
    .sp-scorebar .match-team--a { padding: 0 8px 0 16px; }
    .sp-scorebar .match-team--b { padding: 0 16px 0 8px; }
    .sp-scorebar .match-team::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; }
    .sp-scorebar .match-team--a::after { background: linear-gradient(90deg, var(--team-a), transparent 70%); }
    .sp-scorebar .match-team--b::after { background: linear-gradient(270deg, var(--team-b), transparent 70%); }
    .sp-scorebar .match-logo { width: 50px; height: 50px; object-fit: contain; flex: 0 0 50px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
    .sp-scorebar .match-logo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
    .sp-scorebar .match-name { flex: 1 1 0; min-width: 0; font-size: 22px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
    .sp-scorebar .match-team--b .match-name { text-align: right; }
    .sp-scorebar .match-score { flex: 0 0 auto; font-size: 38px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 24px; text-align: center; }
    .sp-scorebar .match-team--a .match-score { color: var(--team-a); }
    .sp-scorebar .match-team--b .match-score { color: var(--team-b); }
    .sp-scorebar .match-center { flex: 0 0 92px; display: flex; align-items: center; justify-content: center;
      background: rgba(6,8,12,.97); border-left: 1px solid rgba(255,255,255,.1); border-right: 1px solid rgba(255,255,255,.1);
      font-family: 'Rajdhani','Inter',sans-serif; font-weight: 900; font-size: 26px; color: #fff; }

    /* ── Body ─────────────────────────────────────────────────────────────── */
    .sp-body { flex: 1 1 0; min-height: 0; display: flex; align-items: center; gap: 20px; }

    /* ── Left: analyst cam column ─────────────────────────────────────────── */
    .sp-analyst { flex: 0 0 500px; align-self: flex-start; display: flex; flex-direction: column;
      gap: 14px; justify-content: flex-start; min-height: 0; }

    .sp-cam-card { display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--duo-border); background: var(--duo-surface);
      box-shadow: 0 18px 50px rgba(0,0,0,.55); opacity: 0; }
    .sp-stage.show .sp-cam-card:nth-child(1) { animation: inL .7s cubic-bezier(.16,.84,.24,1) .1s forwards; }
    .sp-stage.show .sp-cam-card:nth-child(2) { animation: inL .7s cubic-bezier(.16,.84,.24,1) .2s forwards; }
    @keyframes inL { from { opacity: 0; transform: translateX(-46px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes inR { from { opacity: 0; transform: translateX(46px) scale(.97); } to { opacity: 1; transform: none; } }

    /* Centered gradient stripe */
    .sp-cam-card::before { content: ''; display: block; height: 3px; flex: 0 0 3px;
      background: linear-gradient(90deg, transparent 5%, var(--duo-accent) 35%, var(--duo-accent2) 65%, transparent 95%); }

    .sp-cam-hole { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0d0f14; overflow: hidden; }
    .sp-cam-hole iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* ── Analyst nameplate — split: role chip left | name + handle right ─── */
    .sp-cam-plate { display: flex; align-items: stretch; height: 62px; flex: 0 0 62px;
      background: linear-gradient(180deg, var(--duo-surface2), var(--duo-surface));
      border-top: 1px solid var(--duo-border); }
    .sp-cam-chip { flex: 0 0 56px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 5px; border-right: 1px solid var(--duo-border); padding: 8px; }
    .sp-cam-chip-label { font-size: 8px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--duo-muted); }
    .sp-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--duo-accent);
      box-shadow: 0 0 8px var(--duo-accent), 0 0 16px var(--duo-accent); animation: livepulse 2.4s ease-in-out infinite; }
    @keyframes livepulse { 0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--duo-accent), 0 0 16px var(--duo-accent); }
      50% { opacity: .3; box-shadow: none; } }
    .sp-cam-main { flex: 1 1 0; display: flex; flex-direction: column; justify-content: center;
      gap: 3px; padding: 0 16px; min-width: 0; }
    .sp-cam-name { font-size: 22px; font-weight: 800; text-transform: uppercase; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
    .sp-cam-handle { font-size: 13px; font-weight: 600; color: var(--duo-muted); line-height: 1; }
    .sp-cam-handle::before { font-family: 'Font Awesome 6 Brands'; font-weight: 400; margin-right: 5px; font-size: 12px; }
    .sp-cam-handle.twitch::before  { content: "\f1e8"; color: #9146ff; }
    .sp-cam-handle.youtube::before { content: "\f167"; color: #ff0033; }
    .sp-cam-handle.x-twitter::before { content: "\e61b"; }
    .sp-cam-handle.instagram::before { content: "\f16d"; color: #e1306c; }
    .sp-cam-handle.tiktok::before  { content: "\e07b"; color: #25f4ee; }
    .sp-cam-handle.kick::before { content: "K"; font-family: 'Inter',sans-serif; font-weight: 900; color: #53fc18; }
    .sp-cam-handle.link::before { content: "\f0c1"; font-family: 'Font Awesome 6 Free'; font-weight: 900; }

    /* ?cams=off framing */
    .sp-stage.frames-only .sp-cam-hole { background: transparent; }
    .sp-stage.frames-only .sp-cam-card { background: transparent; box-shadow: none; border-color: transparent; }
    .sp-stage.frames-only .sp-cam-card::before { display: none; }

    /* ── Right: player card ───────────────────────────────────────────────── */
    .sp-player-card { flex: 1 1 0; min-width: 0; align-self: stretch;
      display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--duo-border); background: var(--duo-surface);
      box-shadow: 0 18px 50px rgba(0,0,0,.55); opacity: 0; }
    .sp-stage.show .sp-player-card { animation: inR .7s cubic-bezier(.16,.84,.24,1) .2s forwards; }

    /* Top accent stripe — feat colour set by JS on team resolve */
    .sp-player-card::before { content: ''; display: block; height: 4px; flex: 0 0 4px;
      background: linear-gradient(90deg, var(--feat), var(--duo-accent2) 55%, transparent); }

    /* 16:9 player cam hole — fills top of card, always this proportion */
    .sp-player-hole { position: relative; width: 100%; aspect-ratio: 16 / 9; flex: 0 0 auto;
      background: #0d0f14; overflow: hidden; }
    .sp-player-hole iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* frames-only */
    .sp-stage.frames-only .sp-player-card { background: transparent; box-shadow: none; border-color: transparent; }
    .sp-stage.frames-only .sp-player-card::before { display: none; }
    .sp-stage.frames-only .sp-player-hole { background: transparent; }

    /* ── Info bar — broadcast lower-third style ───────────────────────────── */
    .sp-info { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
      background: linear-gradient(180deg, #111520 0%, #0c0e13 100%);
      border-top: 1px solid var(--duo-border); position: relative; overflow: hidden; }

    /* Left accent column — feat colour */
    .sp-info::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: linear-gradient(180deg, var(--feat) 0%, color-mix(in srgb, var(--feat) 20%, transparent) 100%); }

    /* Identity row: logo + name stack */
    .sp-identity { flex: 1 1 0; min-height: 0; display: flex; align-items: center;
      gap: 18px; padding: 14px 20px 8px 22px; overflow: hidden; }
    .sp-plogo { width: 80px; height: 80px; object-fit: contain; flex: 0 0 80px;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,.7)); }
    .sp-plogo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 4px 14px rgba(0,0,0,.7)); }
    .sp-plogo.hidden { display: none; }
    .sp-pnames { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 0; }
    .sp-pname { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 800; font-size: 66px;
      line-height: .95; text-transform: uppercase; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-pteam { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--feat); }
    .sp-pteam.hidden { display: none; }
    /* Badge: shown in interviewee mode */
    .sp-badge { flex: 0 0 auto; display: none; padding: 5px 13px; border-radius: 6px;
      background: rgba(0,0,0,.35); border: 1px solid var(--feat);
      font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--feat); }
    .sp-info.interviewee-mode .sp-badge { display: block; }
    .sp-info.interviewee-mode .sp-stats-rail { display: none; }
    .sp-info.interviewee-mode .sp-empty { display: none !important; }

    /* Stats rail — full-width horizontal, numbers dominate */
    .sp-stats-rail { flex: 0 0 auto; display: flex; align-items: stretch;
      border-top: 1px solid rgba(255,255,255,.06); }
    .sp-stat { flex: 1 1 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 3px; padding: 10px 6px 12px; }
    .sp-stat + .sp-stat { border-left: 1px solid rgba(255,255,255,.06); }
    .sp-stat .v { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 900; font-size: 50px;
      line-height: 1; font-variant-numeric: tabular-nums; color: #fff; transition: color .3s; }
    .sp-stat .k { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--duo-muted); }
    .sp-stat.leading .v { color: var(--feat); }

    /* No-player placeholder */
    .sp-empty { color: var(--duo-muted); font-size: 20px; font-weight: 600;
      text-align: center; padding: 24px; margin: auto; }
    .sp-empty.hidden { display: none; }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .zone-footer { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; margin-top: 12px; }
    .deck-strip { max-width: 900px; padding: 7px 28px; text-align: center; position: relative;
      background: linear-gradient(90deg, transparent, rgba(14,16,22,.92) 12%, rgba(14,16,22,.92) 88%, transparent);
      border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06); }
    .deck-strip::before, .deck-strip::after { content: ''; position: absolute; top: 50%;
      width: 48px; height: 1px; background: linear-gradient(90deg, transparent, var(--duo-accent)); opacity: .5; }
    .deck-strip::before { left: 12px; } .deck-strip::after { right: 12px; transform: scaleX(-1); }
    .deck-strip-text { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #c8ced8; white-space: nowrap; }
    .deck-strip.is-empty { display: none; }

    /* ── Preview (file://) ────────────────────────────────────────────────── */
    .preview .sp-cam-hole { background: repeating-linear-gradient(45deg,#181b22,#181b22 16px,#20242e 16px,#20242e 32px); }
    .preview .sp-cam-hole::after { content: 'ANALYST'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; letter-spacing: .3em; color: #4a5162; }
    .preview .sp-player-hole { background: repeating-linear-gradient(45deg,#181b22,#181b22 16px,#20242e 16px,#20242e 32px); }
    .preview .sp-player-hole::after { content: 'PLAYER CAM'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; letter-spacing: .2em; color: #4a5162; }
  </style>
</head>
<body>
  <div id="stage" class="sp-stage">
    <div class="sp-header">
      <div class="sp-eyebrow">Player Spotlight</div>
      <div class="sp-title" id="title"></div>
    </div>
    <header class="sp-scorebar" id="scorebar">
      <div class="match-team match-team--a"><img id="teamlogo1" class="match-logo" alt=""><span id="teamname1" class="match-name">BLUE</span><span id="teamscore1" class="match-score">0</span></div>
      <div class="match-center">VS</div>
      <div class="match-team match-team--b"><span id="teamscore2" class="match-score">0</span><span id="teamname2" class="match-name">ORANGE</span><img id="teamlogo2" class="match-logo" alt=""></div>
    </header>
    <div class="sp-body">
      <!-- Left: analyst cam(s) — built dynamically -->
      <div class="sp-analyst" id="analyst-col"></div>
      <!-- Right: player card (cam hole always 16:9 + info bar) -->
      <div class="sp-player-card" id="player-card">
        <div class="sp-player-hole" id="player-hole"></div>
        <div class="sp-info" id="info-bar">
          <div class="sp-identity">
            <img id="plogo" class="sp-plogo hidden" alt="">
            <div class="sp-pnames">
              <div class="sp-pname" id="pname">—</div>
              <div class="sp-pteam hidden" id="pteam"></div>
            </div>
            <span class="sp-badge" id="role-badge">Guest</span>
          </div>
          <div class="sp-stats-rail" id="stats"></div>
          <div class="sp-empty hidden" id="empty">No player selected — pick a Player Spotlight on the Dashboard.</div>
        </div>
      </div>
    </div>
    <div class="zone-footer">
      <div class="deck-strip is-empty" id="deck-strip"><span class="deck-strip-text" id="tagline"></span></div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    function el(id) { return document.getElementById(id); }
    const QP = new URLSearchParams(location.search);
    const NO_CAMS = QP.get('cams') === 'off';
    if (NO_CAMS) el('stage').classList.add('frames-only');
    const QTITLE = QP.get('title');
    const SHOW_SCOREBAR = ['1','true','on','yes'].includes((QP.get('scorebar') || '').toLowerCase());
    if (SHOW_SCOREBAR) el('stage').classList.add('has-scorebar');
    const FORCED_COUNT = QP.has('casters') ? Math.max(1, Math.min(2, parseInt(QP.get('casters'), 10) || 1)) : null;
    let CAST_COUNT = FORCED_COUNT || 1;
    const STATS = [['goals','Goals'],['assists','Assists'],['saves','Saves'],['shots','Shots'],['score','Score']];
    let _lastCamUrl = [], _lastPlayerHole = null;

    function casterCount(casters) {
      if (FORCED_COUNT) return FORCED_COUNT;
      const slots = SceneBase.castersBySlots(casters, 2);
      const have = slots.filter(c => c && (c.name || '').toString().trim()).length;
      return Math.max(1, Math.min(2, have));
    }

    function buildAnalystCol() {
      const col = el('analyst-col'); col.innerHTML = '';
      _lastCamUrl = new Array(CAST_COUNT).fill(null);
      for (let i = 1; i <= CAST_COUNT; i++) {
        const card = document.createElement('div'); card.className = 'sp-cam-card';
        card.innerHTML = `
          <div id="ahole${i}" class="sp-cam-hole"></div>
          <div class="sp-cam-plate">
            <div class="sp-cam-chip">
              <div class="sp-live-dot"></div>
              <span class="sp-cam-chip-label">Analyst</span>
            </div>
            <div class="sp-cam-main">
              <span id="aname${i}" class="sp-cam-name">—</span>
              <span id="atag${i}" class="sp-cam-handle" style="display:none"></span>
            </div>
          </div>`;
        col.appendChild(card);
      }
    }

    function resolveTitle(data) {
      if (QTITLE != null) { const t = QTITLE.trim(); return /^(off|none|hide|0)$/i.test(t) ? '' : t; }
      return (data.eventName || '').toString().trim();
    }

    function renderScorebar(data) {
      if (!SHOW_SCOREBAR) return;
      [['1','blue','a'],['2','orange','b']].forEach(([idx, side, ab]) => {
        const t = SceneBase.teamSide(data, side);
        SceneBase.applyTeamLogo(el('teamlogo' + idx), t.customLogo, t.logo);
        // Head-to-head games (Smash singles, the FGC titles) print the COMPETITOR here, with their
        // org on a second line — the team record on those is just the entrant. See SceneBase.
        SceneBase.applyNamePlate(el('teamname' + idx), t, ab === 'b' ? 'ORANGE' : 'BLUE');
        el('teamscore' + idx).textContent = t.series != null ? t.series : 0;
        document.documentElement.style.setProperty(ab === 'b' ? '--team-b' : '--team-a', t.color || (ab === 'b' ? '#e97139' : '#055fdb'));
      });
    }

    function applyBrandTheme(data) {
      const root = document.documentElement;
      const color = SceneBase.brandColor(data), accent2 = SceneBase.brandAccent(data);
      if (color) root.style.setProperty('--duo-accent', color);
      if (accent2) root.style.setProperty('--duo-accent2', accent2);
      if (data.fontFamily) root.style.fontFamily = `'${data.fontFamily}', 'Inter', system-ui, sans-serif`;
    }

    function setFeat(color) {
      if (!color) return;
      document.documentElement.style.setProperty('--feat', color);
    }

    function renderAnalystCams(casters) {
      const want = casterCount(casters);
      if (want !== CAST_COUNT) { CAST_COUNT = want; buildAnalystCol(); }
      const slots = SceneBase.castersBySlots(casters, CAST_COUNT);
      for (let i = 0; i < CAST_COUNT; i++) {
        const c = slots[i] || {};
        const nameEl = el('aname' + (i + 1)), tagEl = el('atag' + (i + 1));
        if (nameEl) nameEl.textContent = (c.name || '—').toString();
        if (tagEl) {
          const handle = SceneBase.formatCasterHandle(c), social = (c.social || 'none').toString().toLowerCase();
          if (handle) { tagEl.className = 'sp-cam-handle ' + SceneBase.socialPlatformClass(social); tagEl.textContent = handle; tagEl.style.display = ''; }
          else tagEl.style.display = 'none';
        }
        if (NO_CAMS) continue;
        const camUrl = ((c.camUrl) || '').trim();
        if (camUrl === _lastCamUrl[i]) continue;
        _lastCamUrl[i] = camUrl;
        const hole = el('ahole' + (i + 1)); if (!hole) continue;
        hole.querySelectorAll('iframe').forEach(f => f.remove());
        if (camUrl) { const f = document.createElement('iframe'); f.src = camUrl; f.setAttribute('allow', 'autoplay; encrypted-media; microphone; camera; fullscreen'); f.referrerPolicy = 'no-referrer'; hole.appendChild(f); }
      }
    }

    function setPlayerHoleUrl(url) {
      const camUrl = (NO_CAMS ? '' : (url || '')).trim();
      if (camUrl === _lastPlayerHole) return;
      _lastPlayerHole = camUrl;
      const hole = el('player-hole');
      hole.querySelectorAll('iframe').forEach(f => f.remove());
      if (camUrl) { const f = document.createElement('iframe'); f.src = camUrl; f.setAttribute('allow', 'autoplay; encrypted-media; microphone; camera; fullscreen'); f.referrerPolicy = 'no-referrer'; hole.appendChild(f); }
    }

    function findPlayer(data, name) {
      if (!name) return null;
      const key = name.toString().trim().toLowerCase();
      return (Array.isArray(data.players) ? data.players : []).find(p => p && (p.name || '').toString().trim().toLowerCase() === key) || null;
    }

    function renderPlayerInfo(data) {
      const iv = (data.casters || {}).interviewee;
      const infoEl = el('info-bar');

      if (iv && iv.name) {
        infoEl.classList.add('interviewee-mode');
        setPlayerHoleUrl(iv.camUrl || '');
        setFeat(iv.color || null);
        el('pname').textContent = (iv.name || '—').toString().toUpperCase();
        const teamEl = el('pteam');
        if (iv.teamName) { teamEl.textContent = iv.teamName.toString().toUpperCase(); teamEl.classList.remove('hidden'); }
        else teamEl.classList.add('hidden');
        const side = iv.side, teamData = side && data.teams && data.teams[side] ? data.teams[side] : null;
        const logoEl = el('plogo');
        if (teamData) { SceneBase.applyTeamLogo(logoEl, teamData.customLogo, teamData.logo); logoEl.classList.remove('hidden'); }
        else logoEl.classList.add('hidden');
        el('role-badge').textContent = 'Guest';
        return;
      }

      infoEl.classList.remove('interviewee-mode');
      setPlayerHoleUrl('');
      const spot = data.spotlight || {};
      const name = (spot.playerName || data.spectatedPlayer || '').toString().trim();
      const p = findPlayer(data, name);
      const empty = el('empty'), statsEl = el('stats');

      if (!p && !name) {
        el('pname').textContent = '—';
        el('pteam').classList.add('hidden');
        el('plogo').classList.add('hidden'); el('plogo').removeAttribute('src');
        empty.classList.remove('hidden'); statsEl.innerHTML = '';
        return;
      }
      empty.classList.add('hidden');
      el('pname').textContent = (name || (p && p.name) || '—').toUpperCase();

      const teamIdx = p && (p.team === 1 || p.team === 'orange') ? 'orange' : (p && (p.team === 0 || p.team === 'blue') ? 'blue' : null);
      const t = teamIdx ? SceneBase.teamSide(data, teamIdx) : null;
      if (t) {
        setFeat(t.color || null);
        el('pteam').textContent = (t.name || '').toUpperCase(); el('pteam').classList.remove('hidden');
        SceneBase.applyTeamLogo(el('plogo'), t.customLogo, t.logo); el('plogo').classList.remove('hidden');
      } else {
        el('pteam').classList.add('hidden');
        el('plogo').classList.add('hidden'); el('plogo').removeAttribute('src');
      }

      statsEl.innerHTML = '';
      const vals = STATS.map(([k]) => p ? (p[k] != null ? Number(p[k]) : 0) : 0);
      const maxVal = Math.max(...vals);
      STATS.forEach(([, label], i) => {
        const v = vals[i];
        const tile = document.createElement('div');
        tile.className = 'sp-stat' + (v === maxVal && maxVal > 0 ? ' leading' : '');
        tile.innerHTML = `<span class="v">${v}</span><span class="k">${label}</span>`;
        statsEl.appendChild(tile);
      });
    }

    function render(data) {
      data = data || {};
      applyBrandTheme(data);
      const casters = data.casters || {};
      el('stage').classList.toggle('show', SceneBase.casterStageVisible(casters));
      renderAnalystCams(casters);
      renderScorebar(data);

      const ttl = resolveTitle(data);
      el('title').textContent = ttl.toUpperCase();
      el('title').classList.toggle('has-text', !!ttl);

      renderPlayerInfo(data);

      const tag = ((casters.lowerThird) || '').toString().trim();
      const strip = el('deck-strip'), tagEl = el('tagline');
      if (tag) { tagEl.textContent = tag; strip.classList.remove('is-empty'); }
      else { tagEl.textContent = ''; strip.classList.add('is-empty'); }
    }

    buildAnalystCol();
    if (location.protocol === 'file:') {
      document.documentElement.classList.add('preview');
      render({
        casters: { visible: true, lowerThird: 'Player of the Series',
          list: [{ id: 'c1', name: 'Jota', handle: 'jotacasts', slot: 1, social: 'twitch' }] },
        teams: { blue: { name: 'Velocity Gaming', color: '#3b82f6' }, orange: { name: 'Team Apex', color: '#f97316' } },
        spotlight: { playerName: 'Aqua' },
        players: [{ name: 'Aqua', team: 0, goals: 3, assists: 1, saves: 2, shots: 5, score: 612 }],
        eventName: 'Summer Showdown 2026', brand: { color: '#7c3aed', accent: '#22d3ee' }
      });
      el('stage').classList.add('show');
    } else {
      SceneBase.connect(render);
    }
  </script>
</body>
</html>
