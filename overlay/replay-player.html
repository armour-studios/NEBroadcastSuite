<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NE Broadcast Suite — Replay / Montage Player</title>
<!--
  REPLAY-TO-SCREEN browser source.
  Add ONE browser source pointing here (http://localhost:3000/replay-player.html)
  with audio enabled ("Control audio via OBS" off, or routed as you like). The
  REPLAYS page in the control panel pushes clip/montage video URLs here:
    replay_play  { url, name, loop, trimIn, trimOut, transition, transitionLogo }
                                      → plays the trimmed range fullscreen with sound,
                                        easing between clips (cut / fade / logo).
    replay_stop  {}                    → clears the source (transparent)
  The player reports playback back to the panel so producers see time remaining
  and the page can return to the prior scene when a replay ends:
    replay_progress { bus, currentTime, duration, remaining }   (relative to the trim range)
    replay_ended    { bus }
  Current selection is also carried in full_state.replay so a fresh load resumes
  whatever is live.
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; transition: background .32s ease; }
  #stage.idle { background: transparent; }
  /* Logo dip: a brand-tinted vignette instead of flat black — --brand-tint/--brand-accent are set
     from full_state's brand color so this reads as an actual "sting" instead of a plain fade-to-black. */
  #stage.logo-dip { background: radial-gradient(circle at 50% 50%, var(--brand-tint, rgba(124,58,237,.30)) 0%, #000 68%); }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000;
    opacity: 0; transition: opacity .26s ease; }
  video.show { opacity: 1; }
  /* Logo card: scale + fade with a slight overshoot (a broadcast "sting" ease, not a plain cross-fade),
     plus an accent underline that draws in beneath it. */
  #logo-wrap { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 16px;
    opacity: 0; transform: scale(.82); pointer-events: none;
    transition: opacity .32s cubic-bezier(.34,1.56,.64,1), transform .32s cubic-bezier(.34,1.56,.64,1); }
  #logo-wrap.show { opacity: 1; transform: scale(1); }
  #logo { max-width: 38vw; max-height: 30vh; object-fit: contain;
    filter: drop-shadow(0 10px 34px rgba(0,0,0,.6)); }
  #logo-bar { width: 0; height: 3px; border-radius: 2px; background: var(--brand-accent, #7C3AED);
    box-shadow: 0 0 14px 1px var(--brand-accent, #7C3AED); transition: width .3s ease .1s; }
  #logo-wrap.show #logo-bar { width: 110px; }
  /* Stinger transition video — covers the screen while the clip swaps underneath. */
  #stinger { object-fit: cover; z-index: 5; transition: opacity .1s ease; }
  #label { position: absolute; left: 28px; bottom: 24px; font-family: 'Rajdhani', system-ui, sans-serif;
    color: #fff; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.8);
    opacity: 0; transition: opacity .3s; pointer-events: none; }
  #label.show { opacity: .92; }
</style>
</head>
<body>
  <div id="stage" class="idle">
    <video id="vid" playsinline></video>
    <video id="vid2" playsinline></video>
    <video id="stinger" playsinline></video>
    <div id="logo-wrap"><img id="logo" alt=""><div id="logo-bar"></div></div>
    <div id="label"></div>
  </div>
  <!-- Hidden preloader: buffers the NEXT playlist clip while the current one plays, so the advance
       starts from a warm cache/decode instead of a cold fetch. Never shown or played. -->
  <video id="preload" muted playsinline preload="auto" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;"></video>

  <script>
    const WS = 'ws://' + (location.hostname || 'localhost') + ':3001';
    const HTTP_BASE = 'http://' + (location.hostname || 'localhost') + ':3000';
    // Bus routing: default (no params) = program — the ONE shared on-air source that every single clip
    // AND every playlist now plays through (the playlist just cuts OBS to its chosen scene). ?bus=preview
    // is the staging monitor. ?playlist=<id> is LEGACY (per-playlist dedicated sources) — no longer
    // pushed to; use the plain /replay-player.html source instead.
    const _QP = new URLSearchParams(location.search);
    const _PLAYLIST_ID = _QP.get('playlist');
    const BUS = _PLAYLIST_ID ? 'pl_' + _PLAYLIST_ID
      : (_QP.get('bus') === 'preview' ? 'preview' : 'program');
    const stage = document.getElementById('stage');
    const stinger = document.getElementById('stinger');
    const logoWrap = document.getElementById('logo-wrap');
    const logo = document.getElementById('logo');
    const label = document.getElementById('label');
    const preloadEl = document.getElementById('preload');
    let _preloadedUrl = '';
    // Buffer the next playlist clip in a hidden element so its eventual play() starts warm, not cold.
    function preloadNext(url) {
      if (!url || url === _preloadedUrl) return;
      _preloadedUrl = url;
      try { preloadEl.src = url; preloadEl.load(); } catch (e) {}
    }
    // Two stacked <video> elements so a 'fade' transition can be a true crossfade — the incoming
    // clip dissolves directly over the outgoing one — instead of dipping through black between
    // them. `activeVideo` is whichever is currently on screen; `idleVideo` is the other one,
    // available to preload the next clip into. They swap roles after each crossfade.
    let activeVideo = document.getElementById('vid');
    let idleVideo = document.getElementById('vid2');
    let ws = null;
    let currentUrl = null;
    let transToken = 0;       // cancels a stale transition if a new play() interrupts it
    // Active trim range + loop for the clip on screen (the player respects the producer's edit).
    let curIn = 0;
    let curOut = null;        // null → play to the natural end of the file
    let curLoop = false;
    let endedFired = false;

    function sendWS(obj) { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); } catch (e) {} }
    function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }
    // Stacking order for the crossfade — two fixed values swapped between the pair, never growing
    // unbounded (a long broadcast can run hundreds of replay switches), and always well under the
    // stinger overlay's z-index:5.
    function bringToFront(v, other) { v.style.zIndex = '2'; other.style.zIndex = '1'; }
    function waitReady(v) {
      return new Promise((res) => {
        let done = false; const f = () => { if (done) return; done = true; res(); };
        if (curIn > 0) {
          // resolve once we've landed on the in-point (avoids flashing frame 0)
          if (v.readyState >= 2 && Math.abs(v.currentTime - curIn) < 0.15) return f();
          v.addEventListener('seeked', f, { once: true });
          setTimeout(f, 1500);
        } else {
          if (v.readyState >= 2) return f();
          v.addEventListener('loadeddata', f, { once: true });
          setTimeout(f, 1500);
        }
      });
    }

    // Jump to the in-point once the file knows its dimensions/duration. Wired to both elements —
    // whichever one is actively loading a new src is the one this should apply to.
    function wireVideoEvents(v) {
      v.addEventListener('loadedmetadata', () => {
        if (v !== activeVideo) return;
        if (curIn > 0 && v.currentTime < curIn - 0.05) { try { v.currentTime = curIn; } catch (e) {} }
      });
      v.addEventListener('timeupdate', () => {
        if (v !== activeVideo) return;
        if (curOut != null && v.currentTime >= curOut - 0.02) {
          if (curLoop) { try { v.currentTime = curIn; } catch (e) {} }
          else { reachEnd(); return; }
        }
        const t = Date.now();
        if (t - lastSent < 400) return;
        lastSent = t;
        const outAt = (curOut != null ? curOut : (v.duration || 0));
        const cur = Math.max(0, (v.currentTime || 0) - curIn);
        const span = Math.max(0, outAt - curIn);
        sendWS({ type: 'replay_progress', data: { bus: BUS, currentTime: cur, duration: span, remaining: Math.max(0, outAt - (v.currentTime || 0)) } });
      });
      v.addEventListener('ended', () => {
        if (v !== activeVideo) return;
        if (curLoop) { endedFired = false; try { v.currentTime = curIn; } catch (e) {} const p = v.play(); if (p && p.catch) p.catch(() => {}); }
        else reachEnd();
      });
    }

    function loadInto(v, url, keepHidden) {
      currentUrl = url;
      stage.classList.remove('idle');
      v.loop = false;          // looping is handled manually so it respects the trim range
      v.src = url;
      v.muted = false; v.volume = 1;
      // Filename caption intentionally hidden on the program output.
      label.textContent = ''; label.classList.remove('show');
      const p = v.play();
      if (p && p.catch) p.catch(() => { /* autoplay blocked; OBS allows it */ });
      if (!keepHidden) {
        if (curIn > 0) {
          // Hold black until we land on the in-point, so frame 0 never flashes.
          let shown = false; const reveal = () => { if (shown) return; shown = true; requestAnimationFrame(() => v.classList.add('show')); };
          v.addEventListener('seeked', reveal, { once: true });
          setTimeout(reveal, 600);
        } else {
          requestAnimationFrame(() => v.classList.add('show'));
        }
      }
    }

    // Smoothly ramp a <video>'s audio volume to `to` over `ms`. A per-element generation id cancels
    // an in-flight ramp when a newer one starts on the same element, so a fade-out and fade-under-the
    // -stinger fade-in can't fight each other on the same tag.
    function fadeVolume(v, to, ms) {
      if (!v) return;
      const gen = (v._fadeGen = (v._fadeGen || 0) + 1);
      try { if (v.muted) v.muted = false; } catch (e) {}
      const from = (typeof v.volume === 'number') ? v.volume : 1;
      const start = performance.now();
      const step = (now) => {
        if (v._fadeGen !== gen) return;               // a newer fade took over this element
        const t = ms > 0 ? Math.min(1, (now - start) / ms) : 1;
        try { v.volume = Math.max(0, Math.min(1, from + (to - from) * t)); } catch (e) {}
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    async function play(url, name, loop, transition, logoUrl, trimIn, trimOut, stingerUrl) {
      if (!url) { stop(); return; }
      curIn = (typeof trimIn === 'number' && trimIn > 0) ? trimIn : 0;
      curOut = (typeof trimOut === 'number' && trimOut > curIn) ? trimOut : null;
      curLoop = !!loop;
      endedFired = false;
      const sameUrl = url === currentUrl;
      const wasLive = !stage.classList.contains('idle');
      transition = transition || 'cut';

      if (sameUrl && wasLive) {   // already up — just make sure it's rolling
        activeVideo.muted = false; activeVideo.volume = 1;
        const p = activeVideo.play(); if (p && p.catch) p.catch(() => {});
        return;
      }

      // Hard cut → swap straight in (with a quick fade-up).
      if (transition === 'cut') { loadInto(activeVideo, url); return; }

      // Stinger: play a short video over the top and swap the clip underneath at its midpoint.
      // It needs no outgoing clip, so it also works as an intro on the very first clip.
      if (transition === 'stinger' && stingerUrl) {
        const tok = ++transToken;
        let swapped = false;
        // Audio CROSSFADE under the stinger: fade the outgoing clip's audio OUT as the sting covers,
        // then fade the incoming clip's audio IN after the mid-point swap — instead of a hard cut.
        // (Producer feedback: "stinger audio fade out, fade in - crossfade".)
        if (wasLive) fadeVolume(activeVideo, 0, 550);
        const doSwap = () => {
          if (!swapped && tok === transToken) {
            swapped = true;
            loadInto(activeVideo, url);
            activeVideo.volume = 0;
            fadeVolume(activeVideo, 1, 550);
          }
        };
        const onTime = () => { if (stinger.duration && stinger.currentTime >= stinger.duration * 0.5) doSwap(); };
        const cleanup = () => {
          stinger.removeEventListener('timeupdate', onTime);
          stinger.removeEventListener('ended', cleanup);
          if (tok !== transToken) return;
          doSwap();
          stinger.classList.remove('show');
          setTimeout(() => { try { stinger.pause(); stinger.removeAttribute('src'); stinger.load(); } catch (e) {} }, 300);
        };
        stinger.onerror = () => { if (tok === transToken) { doSwap(); stinger.classList.remove('show'); } };
        stinger.addEventListener('timeupdate', onTime);
        stinger.addEventListener('ended', cleanup);
        stinger.src = stingerUrl; stinger.currentTime = 0;
        stinger.classList.add('show');
        const sp = stinger.play(); if (sp && sp.catch) sp.catch(() => { doSwap(); stinger.classList.remove('show'); });
        return;
      }

      // Fade / logo need an outgoing clip to ease from; on the very first clip just swap in.
      if (!wasLive) { loadInto(activeVideo, url); return; }

      if (transition === 'fade') {
        // True crossfade — dissolve directly into the next clip instead of dipping through black.
        // Preload the incoming clip into the currently-idle <video> (stacked, opacity 0), then fade
        // it in ON TOP of the still-fully-visible outgoing clip; the outgoing one never needs its
        // own opacity touched since the incoming one covers it completely once the fade completes.
        const tok = ++transToken;
        const incoming = idleVideo;
        const outgoing = activeVideo;
        loadInto(incoming, url, true);
        await waitReady(incoming);
        if (tok !== transToken) return;            // a newer play() took over
        bringToFront(incoming, outgoing);
        activeVideo = incoming;                     // progress/trim enforcement now tracks the new clip
        idleVideo = outgoing;
        requestAnimationFrame(() => incoming.classList.add('show'));
        await wait(300);                            // matches the .26s CSS opacity transition + margin
        if (tok === transToken) {                   // only clean up if a newer transition hasn't already claimed `outgoing`
          outgoing.pause();
          outgoing.classList.remove('show');
          outgoing.removeAttribute('src');
          outgoing.load();
        }
        return;
      }

      // Logo: dip to a brand-tinted vignette, sting the logo in (scale + accent underline), then
      // ease the new clip up. #stage.logo-dip / --brand-tint / --brand-accent are set from the
      // brand color cached off full_state (see handleBrand below) so this reads as an actual on-
      // brand sting instead of a plain fade to black.
      const tok = ++transToken;
      activeVideo.classList.remove('show');
      stage.classList.add('logo-dip');
      if (logoUrl) { logo.src = logoUrl; logoWrap.classList.add('show'); }
      await wait(340);
      if (tok !== transToken) return;            // a newer play() took over
      loadInto(activeVideo, url, true);           // load next, held at opacity 0
      await waitReady(activeVideo);
      if (tok !== transToken) return;
      await wait(260);
      logoWrap.classList.remove('show');
      stage.classList.remove('logo-dip');
      activeVideo.classList.add('show');
    }

    function stop() {
      const tok = ++transToken;
      currentUrl = null;
      curIn = 0; curOut = null; curLoop = false; endedFired = false;
      [activeVideo, idleVideo].forEach((v) => {
        v.pause();
        v.removeAttribute('src');
        v.load();
        v.classList.remove('show');
      });
      logoWrap.classList.remove('show');
      stage.classList.remove('logo-dip');
      label.classList.remove('show');
      // Delay idle (transparent background) until after the opacity fade completes — otherwise
      // the black stage disappears while the video is still fading, revealing OBS sources underneath.
      setTimeout(() => { if (transToken === tok) stage.classList.add('idle'); }, 320);
    }

    function reachEnd() {
      if (endedFired) return;
      endedFired = true;
      activeVideo.pause();
      label.classList.remove('show');
      sendWS({ type: 'replay_ended', data: { bus: BUS } });
    }

    // Enforce the out-point + report playback (time-remaining relative to the trim range).
    let lastSent = 0;
    wireVideoEvents(activeVideo);
    wireVideoEvents(idleVideo);

    // Brand-tinted logo-dip background + accent underline (see #stage.logo-dip / --brand-accent).
    // Falls back to the app's own default accent purple when no brand kit/color is configured.
    function hexToRgba(hex, alpha) {
      const h = (hex || '').trim().replace('#', '');
      if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
      const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }
    function applyBrandColors(brand) {
      const accent = (brand && (brand.accent || brand.color)) || '';
      if (!accent) return;
      stage.style.setProperty('--brand-accent', accent);
      const tint = hexToRgba(accent, 0.32);
      if (tint) stage.style.setProperty('--brand-tint', tint);
    }

    // The server strips heavy blobs (base64 logos/thumbnails) from most broadcasts and only re-sends
    // them on change — backfill from the last full payload so a light broadcast that omits `replay`/
    // `brand` doesn't get read as "stop" / "no brand configured".
    let _replayCache = null;
    let _brandCache = null;
    function handle(m) {
      if (m.type === 'replay_play') { const d = m.data || {}; if ((d.bus || 'program') === BUS) { play(d.url, d.name, d.loop, d.transition, d.transitionLogo, d.trimIn, d.trimOut, d.stinger); preloadNext(d.nextUrl); } }
      else if (m.type === 'replay_preload') { const d = m.data || {}; if ((d.bus || 'program') === BUS) preloadNext(d.url); }
      else if (m.type === 'replay_stop') { const d = m.data || {}; if ((d.bus || 'program') === BUS) stop(); }
      else if (m.type === 'full_state') {
        if (m.data && m.data.replay !== undefined) _replayCache = m.data.replay;
        else if (m.data) m.data.replay = _replayCache;
        if (m.data && m.data.brand !== undefined) _brandCache = m.data.brand;
        applyBrandColors(_brandCache);
        const r = m.data && m.data.replay && m.data.replay[BUS];
        if (r && r.playing && r.url) play(r.url, r.name, r.loop, r.transition, '', r.trimIn, r.trimOut);
        else stop();
      }
    }

    // The bridge requires a token when LAN-exposed (WS_HOST != loopback) — fetched once from the
    // HTTP API this page was loaded from and cached for reconnects; a no-op on the default loopback bridge.
    let _wsToken = null;
    async function connect() {
      if (!_wsToken) {
        try { _wsToken = (await (await fetch(HTTP_BASE + '/api/ws-token')).json()).token || ''; }
        catch (e) { _wsToken = ''; }
      }
      ws = new WebSocket(WS + (_wsToken ? ('?token=' + encodeURIComponent(_wsToken)) : ''));
      ws.onopen = () => ws.send(JSON.stringify({ type: 'request_state' }));
      ws.onmessage = ({ data }) => { let m; try { m = JSON.parse(data); } catch { return; } handle(m); };
      ws.onclose = () => setTimeout(connect, 800);
      ws.onerror = () => { try { ws.close(); } catch {} };
    }
    connect();
  </script>
</body>
</html>
