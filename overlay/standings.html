<!DOCTYPE html>
<!--
  standings.html — thematic leaderboard overlay. Resolves rows from (priority):
    1. manual override rows        (state.standings.rows — pushed from control panel)
    2. loaded bracket / start.gg   (state.bracket.standings — round-robin / swiss auto)
  Sources (start.gg event, in-app league, manual) all funnel into those rows via the
  control panel's Standings section.

  TWO layouts, chosen by state.standings.layout ('auto' | 'podium' | 'placement'):
    · podium    — the default board described below
    · placement — the SMASH top-8 finish wall: one card per finisher sized by rank (winner as a
                  full-height hero, 2-4 across the top, 5-8 underneath, 9+ on a chip strip), each
                  card carrying that entrant's CHARACTER art from row.character (resolved through
                  smash-fighters.js). Rows with no character fall back to their team/player logo.
                  ONLY drawn for Smash (the 'stocks' feature) — any other game gets the podium
                  board no matter what layout was pushed.
    · auto      — placement for Smash, podium for everything else.

  PODIUM redesign 2026-07: header (brand logo + title) → pedestal podium for the top 3
  (2nd | 1st | 3rd, medal-lit plinths, team logos/colors) → compact list of the next
  ranks underneath (up to 8 rows, "+N more" footnote beyond that). W/L is SERIES wins
  (one per set) and is labelled as such; game wins show separately when the data has
  them. Keeps: fit() scale-to-16:9, sig-guarded rendering, the standalone demo-flash
  guard, the sponsor rail, and the manual/startgg/league row-resolution rules.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NE Broadcast Suite — Standings</title>
<link rel="stylesheet" href="/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:    #055fdb;
  --accent-2:  #4d90ff;
  --gold:      #ffcf5c;
  --silver:    #d3dcec;
  --bronze:    #e0965a;
  --base-1:    #14181f;
  --base-2:    #0d1017;
  --main-font: 'Bourgeois', 'Inter', sans-serif;
  --disp:      'Rajdhani', 'Inter', sans-serif;
  --stage-w:   1920px;
  --stage-h:   1080px;
}

html, body {
  width: var(--stage-w); height: var(--stage-h);
  overflow: hidden; background: transparent;
  font-family: var(--main-font); -webkit-font-smoothing: antialiased;
}

/* ── Stage ── */
.st-stage {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 76px 78px;
  opacity: 0; transform: scale(1.015);
  transition: opacity 0.55s ease, transform 0.55s ease;
}
.st-stage.show { opacity: 1; transform: scale(1); }

/* ── Scale wrapper — natural size, scaled to fill ── */
.st-scale { display: flex; flex-direction: column; align-items: center; gap: 30px;
  width: 1760px; transform-origin: center center; }

/* ── Header: brand logo · title block · team count ── */
.st-header { width: 100%; display: flex; align-items: center; gap: 28px; }
.st-brand { height: 92px; max-width: 220px; object-fit: contain; flex: 0 0 auto;
  filter: drop-shadow(0 6px 18px rgba(0,0,0,.55)); }
.st-headtext { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.st-eyebrow {
  display: inline-flex; align-items: center; gap: 12px;
  font-size: 15px; font-weight: 800; letter-spacing: 7px; text-transform: uppercase; color: var(--accent-2);
}
.st-eyebrow::before { content: ''; width: 26px; height: 2px; background: currentColor; border-radius: 2px; }
.st-title {
  font-family: var(--disp);
  font-size: 58px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: #fff; line-height: 0.98; text-shadow: 0 8px 40px rgba(0,0,0,0.7);
  /* Whole event name, never truncated — wraps to two lines; fit() rescales if it grows */
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.st-subtitle { font-size: 21px; font-weight: 600; letter-spacing: 1px; color: rgba(255,255,255,.85); }
.st-subtitle:empty { display: none; }
.st-credit { margin: 2px 0 6px; font-size: 15px; font-weight: 600; letter-spacing: .06em;
  color: rgba(255,255,255,.62); text-transform: none; }
.st-credit:empty { display: none; }
.st-count { flex: 0 0 auto; display: flex; align-items: baseline; gap: 10px; line-height: 1; }
.st-count b {
  font-family: var(--disp); font-size: 64px; font-weight: 700;
  background: linear-gradient(180deg, #fff, #b9c2d6); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.st-count span { font-size: 13px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,.7); }
.st-count:empty { display: none; }

/* ── Podium: 2nd | 1st | 3rd ── */
.st-podium { display: flex; align-items: flex-end; justify-content: center; gap: 26px; width: 100%; }
.st-ped { flex: 0 0 400px; display: flex; flex-direction: column; align-items: center;
  opacity: 0; transform: translateY(34px);
  transition: opacity .5s cubic-bezier(.16,.84,.24,1), transform .5s cubic-bezier(.16,.84,.24,1); }
.st-ped.visible { opacity: 1; transform: translateY(0); }

/* Team block above the plinth */
.st-ped-team { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 16px; }
.st-ped-logo { width: 104px; height: 104px; object-fit: contain; filter: drop-shadow(0 8px 22px rgba(0,0,0,.65)); }
.st-ped-logo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 8px 22px rgba(0,0,0,.65)); }
.st-ped.p1 .st-ped-logo { width: 132px; height: 132px; }
.st-ped-name { font-family: var(--disp); font-size: 32px; font-weight: 700; color: #f2f4f8;
  text-transform: uppercase; letter-spacing: .4px; max-width: 380px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.st-ped.p1 .st-ped-name { font-size: 38px; color: #fff; }
.st-ped-record { display: flex; align-items: baseline; gap: 12px; }
.st-ped-wl { font-family: var(--disp); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.st-ped-wl .w { color: #6ff0a8; } .st-ped-wl .l { color: #f39191; }
.st-ped-wl .sep { color: rgba(255,255,255,.55); font-size: .8em; padding: 0 2px; }
.st-ped-sub { font-size: 11px; font-weight: 800; letter-spacing: 2.4px; text-transform: uppercase; color: rgba(255,255,255,.7); }
.st-ped-pts { font-family: var(--disp); font-size: 30px; font-weight: 700;
  background: linear-gradient(160deg, #ffe9a8, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 6px rgba(245,201,68,0.3)); }

/* The plinth itself */
.st-ped-block { position: relative; width: 100%; border-radius: 14px 14px 6px 6px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ped-accent, var(--accent)) 20%, var(--base-1)) 0%, var(--base-2) 90%);
  border: 1px solid color-mix(in srgb, var(--ped-medal, #fff) 30%, rgba(255,255,255,.06));
  box-shadow: 0 18px 44px rgba(0,0,0,.5); }
.st-ped-block::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
  background: var(--ped-medal, var(--accent));
  box-shadow: 0 0 24px color-mix(in srgb, var(--ped-medal, var(--accent)) 75%, transparent); }
.st-ped.p1 .st-ped-block { height: 190px; }
.st-ped.p2 .st-ped-block { height: 138px; }
.st-ped.p3 .st-ped-block { height: 108px; }
.st-ped.p1 { --ped-medal: var(--gold); }
.st-ped.p2 { --ped-medal: var(--silver); }
.st-ped.p3 { --ped-medal: var(--bronze); }
.st-ped-rank { font-family: var(--disp); font-weight: 700; line-height: 1;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ped-medal) 90%, #fff), var(--ped-medal));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 14px color-mix(in srgb, var(--ped-medal) 45%, transparent)); }
.st-ped.p1 .st-ped-rank { font-size: 120px; }
.st-ped.p2 .st-ped-rank { font-size: 92px; }
.st-ped.p3 .st-ped-rank { font-size: 76px; }

/* ── List: ranks 4+ ── */
.st-list { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.st-row {
  display: grid; grid-template-columns: var(--st-cols); align-items: center;
  column-gap: 10px; height: 64px; padding: 0 22px 0 0;
  border-radius: 11px; position: relative; overflow: hidden;
  background: linear-gradient(90deg, color-mix(in srgb, var(--row-accent, var(--accent)) 16%, var(--base-1)) 0%, var(--base-1) 42%, var(--base-2) 100%);
  border: 1px solid color-mix(in srgb, var(--row-accent, var(--accent)) 18%, rgba(255,255,255,0.05));
  box-shadow: 0 8px 22px rgba(0,0,0,0.38);
  opacity: 0; transform: translateX(-20px);
  transition: opacity 0.42s cubic-bezier(.16,.84,.24,1), transform 0.42s cubic-bezier(.16,.84,.24,1);
}
.st-row.visible { opacity: 1; transform: translateX(0); }
.st-row::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: var(--row-accent, var(--accent));
  box-shadow: 0 0 14px color-mix(in srgb, var(--row-accent, var(--accent)) 60%, transparent);
}
.st-head {
  height: 30px; padding: 0 22px 0 0; background: none; border: none; box-shadow: none;
  opacity: 1 !important; transform: none !important; overflow: visible;
}
.st-head::before { display: none; }
.st-head > div { font-size: 12px; font-weight: 800; letter-spacing: 2.2px; text-transform: uppercase; color: rgba(255,255,255,.75); }

.st-col-rank { display: flex; align-items: center; justify-content: center; }
.st-badge {
  width: 44px; height: 44px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--disp); font-size: 24px; font-weight: 700; color: #d6dcea; font-variant-numeric: tabular-nums;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
}
.st-col-logo { display: flex; align-items: center; justify-content: center; }
.st-team-logo { width: 42px; height: 42px; object-fit: contain; filter: drop-shadow(0 2px 7px rgba(0,0,0,0.6)); }
.st-team-logo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 2px 7px rgba(0,0,0,0.6)); }
.st-col-name { min-width: 0; padding-left: 4px; }
.st-name-txt { font-family: var(--disp); font-size: 27px; font-weight: 600; color: #f2f4f8; letter-spacing: 0.4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.st-col-stat { font-family: var(--disp); font-size: 26px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; color: #aeb6c6; }
.st-col-stat.wins   { color: #6ff0a8; }
.st-col-stat.losses { color: #f39191; }
.st-col-stat.pts .st-pts-num {
  font-size: 30px; font-weight: 700;
  background: linear-gradient(160deg, #ffe9a8, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 6px rgba(245,201,68,0.3));
}
.st-head .st-col-stat { color: rgba(255,255,255,.75); font-size: 12px; }
.st-col-grouplbl { display: block; font-size: 9px; font-weight: 700; letter-spacing: .12em; color: rgba(255,255,255,.65); opacity: .8; margin-bottom: 1px; }

/* "+N more" footnote when the field is bigger than the board */
.st-more { font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(255,255,255,.7); text-align: center; padding-top: 2px; }

/* ── PLACEMENT WALL (layout: 'placement') ────────────────────────────────────
   The FGC/Smash top-8 board: one card per finisher, character art filling the card, sized by
   rank — winner is a full-height hero on the left, 2-4 across the top, 5-8 underneath. Falls
   back to the team/player logo when a row has no fighter assigned. */
.st-place { display: flex; gap: 16px; width: 100%; align-items: stretch; }
.st-place-side { flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.st-pl-row { display: flex; gap: 16px; min-width: 0; }
/* Fixed basis, shrink-only (never grow): a partial row — say a top 5, where only one card lands
   on the bottom row — keeps its card at normal size and left-aligns, instead of stretching one
   entrant across the full width. The basis is the exact full-row share of the 1224px side column. */
.st-pl-row > * { flex: 0 1 auto; min-width: 0; }
.st-pl-row-a > * { width: 397px; }
.st-pl-row-b > * { width: 294px; }

/* NOTE: no color-mix() below. The app ships Electron 18 (Chrome 100), where color-mix is
   unsupported and silently computes to BLACK — every tint here is handed in as an explicit
   rgb/rgba var from buildPlacementCard() instead, so the board looks the same in the in-app
   preview and in OBS's newer CEF. */
.st-pl-card {
  position: relative; overflow: hidden; border-radius: 14px;
  background:
    radial-gradient(120% 90% at 50% 100%, var(--pl-glow), rgba(0,0,0,0) 68%),
    linear-gradient(180deg, #171b25, #0b0e15);
  border: 2px solid var(--pl-edge);
  box-shadow: 0 14px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  opacity: 0; transform: translateY(16px) scale(.98);
  transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.3,1);
}
.st-pl-card.visible { opacity: 1; transform: none; }
.st-pl-hero { width: 520px; flex: 0 0 520px; }
.st-pl-row-a .st-pl-card { height: 306px; }
.st-pl-row-b .st-pl-card { height: 238px; }

/* fighter art / logo — stands on the card floor so the name scrim reads over the legs */
.st-pl-art {
  position: absolute; inset: 0 0 0 0; display: flex; align-items: flex-end; justify-content: center;
  padding: 14px 10px 0;
}
.st-pl-art img { max-width: 100%; max-height: 100%; object-fit: contain; object-position: bottom center;
  filter: drop-shadow(0 8px 20px rgba(0,0,0,.6)); }
.st-pl-art.is-logo { align-items: center; padding: 28px; }
/* Square box, so a wide club banner and a square badge fill the same footprint on the wall.
   aspect-ratio sizes the BOX; object-fit: contain (inherited above) letterboxes the art in it. */
.st-pl-art.is-logo img { height: 62%; width: auto; aspect-ratio: 1 / 1; max-width: 100%; }
.st-pl-art.is-logo img.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 6px 16px rgba(0,0,0,.6)); }

/* rank plate, top-left */
.st-pl-rank {
  position: absolute; top: 0; left: 0; z-index: 3;
  min-width: 52px; padding: 4px 12px 7px; border-radius: 12px 0 12px 0;
  background: linear-gradient(150deg, var(--pl-accent-lit), var(--pl-accent));
  font-family: var(--disp); font-size: 34px; font-weight: 800; line-height: 1;
  /* The badge is painted in the entrant's accent, so the numeral has to follow it: a white or
     pastel brand colour left white-on-white and the rank simply disappeared. Ranks 1-3 override
     both background and colour below (medal tints), so they are unaffected. */
  color: var(--pl-rank-ink, #fff);
  font-variant-numeric: tabular-nums; text-align: center;
  text-shadow: var(--pl-rank-shadow, 0 2px 6px rgba(0,0,0,.45)); box-shadow: 0 4px 14px rgba(0,0,0,.45);
}
.st-pl-hero .st-pl-rank { min-width: 96px; font-size: 76px; padding: 8px 20px 14px; }
.st-pl-row-b .st-pl-rank { min-width: 44px; font-size: 27px; }
/* medal tints for the podium three — the accent still frames the card */
.st-pl-card[data-rank="1"] .st-pl-rank { background: linear-gradient(150deg, #fff0bd, var(--gold)); color: #2a1f00; text-shadow: none; }
.st-pl-card[data-rank="2"] .st-pl-rank { background: linear-gradient(150deg, #ffffff, var(--silver)); color: #1d2330; text-shadow: none; }
.st-pl-card[data-rank="3"] .st-pl-rank { background: linear-gradient(150deg, #ffd0a4, var(--bronze)); color: #2c1704; text-shadow: none; }

/* name plate along the bottom */
.st-pl-foot {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 30px 16px 12px;
  background: linear-gradient(180deg, transparent, rgba(6,8,13,.82) 46%, rgba(6,8,13,.95));
}
.st-pl-name {
  font-family: var(--disp); font-weight: 700; font-size: 27px; line-height: 1.05; color: #fff;
  letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 2px 8px rgba(0,0,0,.8);
}
.st-pl-hero .st-pl-name { font-size: 54px; }
.st-pl-row-b .st-pl-name { font-size: 21px; }
/* Squad list for a team / doubles entrant, under the team name. */
.st-pl-roster {
  margin-top: 4px; font-size: 15px; font-weight: 600; line-height: 1.15; color: rgba(255,255,255,.92);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 2px 6px rgba(0,0,0,.7);
}
.st-pl-hero .st-pl-roster { font-size: 24px; margin-top: 7px; }
.st-pl-row-b .st-pl-roster { font-size: 12px; }
.st-pl-meta {
  margin-top: 3px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--pl-accent-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.st-pl-hero .st-pl-meta { font-size: 16px; letter-spacing: .2em; }
.st-pl-meta:empty { display: none; }

/* ranks 9+ — a compact strip so a big field still gets named */
.st-pl-rest { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; width: 100%; }
.st-pl-chip {
  display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 8px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
}
.st-pl-chip img { width: 24px; height: 24px; object-fit: contain; }
.st-pl-chip b { font-family: var(--disp); font-size: 15px; font-weight: 800; color: var(--accent-2); font-variant-numeric: tabular-nums; }
.st-pl-chip span { font-size: 15px; font-weight: 600; color: #dfe4ee; }

/* ── Empty ── */
.st-empty { font-size: 30px; font-weight: 600; color: rgba(255,255,255,.85); text-align: center; }

/* ── Sponsor rail ── */
.st-sponsors { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 34px; padding: 9px 28px; border-radius: 12px;
  background: rgba(9,11,16,.74); border: 1px solid rgba(255,255,255,.07); }
.st-sponsors.is-empty { display: none; }
.st-sponsors-lbl { font-size: 10px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: #6a7080; }
.st-sponsor { height: 28px; max-width: 118px; object-fit: contain; opacity: .88; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
/* ── DIVISION BOARD (layout: 'divisions') ───────────────────────────────────
   A league with conferences drawn the way league broadcasts draw one: each division its own
   ranked table, side by side, with the playoff cut marked. The flat podium merged both
   conferences into a single order, which states a standing that does not exist. */
.st-divs { display: grid; gap: 40px; align-items: start; margin-top: 6px; }
.st-divs.cols-1 { grid-template-columns: minmax(0, 900px); }
.st-divs.cols-2 { grid-template-columns: repeat(2, minmax(0, 760px)); }
.st-divs.cols-3 { grid-template-columns: repeat(3, minmax(0, 540px)); }
.st-dv { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.st-dv-head { font-family: var(--disp, 'Rajdhani', sans-serif); font-weight: 800; font-size: 30px;
  letter-spacing: .14em; text-transform: uppercase; text-align: center; color: #fff;
  padding-bottom: 8px; position: relative; }
.st-dv-head::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--dv-c, #55b3ff), transparent); }
.st-dv-rows { display: flex; flex-direction: column; gap: 7px; }
.st-dv-row { display: grid; grid-template-columns: 60px 46px minmax(0, 1fr) auto; align-items: center;
  gap: 14px; padding: 10px 16px; border-radius: 6px; position: relative; overflow: hidden;
  background: linear-gradient(90deg, rgba(24,28,38,.96), rgba(14,17,24,.96));
  border: 1px solid rgba(255,255,255,.08); }
/* Division colour rides the left edge — the only place the two tables differ chromatically. */
.st-dv-row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--dv-c, #55b3ff); }
.st-dv-rank { font-family: var(--disp, 'Rajdhani', sans-serif); font-weight: 800; font-size: 28px;
  text-align: center; color: #fff; font-variant-numeric: tabular-nums; }
.st-dv-logo { width: 40px; height: 40px; object-fit: contain; }
.st-dv-name { font-family: var(--disp, 'Rajdhani', sans-serif); font-weight: 700; font-size: 27px;
  color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.st-dv-rec { font-family: var(--disp, 'Rajdhani', sans-serif); font-weight: 800; font-size: 27px;
  color: rgba(255,255,255,.9); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
/* Clinched a playoff spot: the rank cell becomes a marker, as in the reference board. */
.st-dv-row.qual .st-dv-rank { color: var(--dv-c, #55b3ff); }
.st-dv-row.qual { border-color: color-mix(in srgb, var(--dv-c, #55b3ff) 42%, transparent); }
.st-dv-row.out { opacity: .55; }
.st-dv-note { text-align: center; font-family: var(--disp, 'Rajdhani', sans-serif); font-weight: 600;
  font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.55);
  margin-top: 14px; }
</style>
</head>
<body>

<div id="st-stage" class="st-stage">
  <div class="st-scale" id="st-scale">
    <div class="st-header">
      <img class="st-brand" id="st-brand" alt="" style="display:none;">
      <div class="st-headtext">
        <div class="st-eyebrow" id="st-eyebrow">Standings</div>
        <div class="st-title" id="st-title">STANDINGS</div>
        <div class="st-subtitle" id="st-subtitle"></div>
      </div>
      <div class="st-count" id="st-count"></div>
    </div>
    <!-- Data-source credit. Liquipedia content is CC BY-SA 3.0, so when the rows come from
         there the credit is a LICENCE CONDITION and rides with the data — the producer cannot
         forget to enable it. Empty (and hidden) for every other source. -->
    <div class="st-credit" id="st-credit"></div>
    <div class="st-podium" id="st-podium"></div>
    <div class="st-place" id="st-place" style="display:none;"></div>
    <div class="st-pl-rest" id="st-place-rest" style="display:none;"></div>
      <div class="st-divs" id="st-divs" style="display:none;"></div>
  <div class="st-list" id="st-list"></div>
    <div class="st-more" id="st-more" style="display:none;"></div>
  </div>
  <div class="st-empty" id="st-empty" style="display:none;">No standings data — pull start.gg, a league, or add manual rows.</div>
  <div class="st-sponsors is-empty" id="st-sponsors"></div>
</div>

<script src="scene-base.js"></script>
<script src="smash-fighters.js"></script>
<script>
(function () {
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function svgFallback(letter, color) {
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="24" fill="${color}"/><text x="80" y="110" font-size="88" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold">${letter}</text></svg>`);
  }

  // Logo/colour lookups from EVERY source we have, cheapest-first at resolve time:
  // the row's own logo → saved teams DB → start.gg entrant logos (logoMap) →
  // Challonge/NXGEN logo maps → the bracket's embedded teams (manual imports).
  function teamMaps(data) {
    const logos = {}, colors = {};
    const put = (name, logo, color) => {
      if (!name) return;
      const k = String(name).toLowerCase();
      if (logo && !logos[k]) logos[k] = logo;
      if (color && !colors[k]) colors[k] = color;
    };
    (data.savedTeams || []).forEach(t => t && put(t.name, t.logo, t.color));
    const maps = [data.startgg && data.startgg.logoMap, data.challonge && data.challonge.logoMap, data.nxgen && data.nxgen.logoMap];
    maps.forEach((m) => { if (m) Object.keys(m).forEach((k) => { if (m[k] && !logos[k]) logos[k] = m[k]; }); });
    ((data.bracket && data.bracket.teams) || []).forEach(t => t && put(t.name, t.logo, t.color));
    return { logos, colors };
  }

  function resolveTeam(entry, maps, accent) {
    const nameKey = (entry.name || '').toLowerCase();
    const logo = entry.logo || maps.logos[nameKey] || svgFallback((entry.name || '?')[0].toUpperCase(), '#2a3050');
    return {
      logo,
      isDefaultLogo: SceneBase.isDefaultGameLogo(logo),
      color: entry.color || maps.colors[nameKey] || accent
    };
  }

  // ── Podium pedestal (ranks 1-3). W-L here is SERIES (one win per set). ──
  function buildPedestal(entry, rank, maps, accent, hasPoints, delay) {
    const t = resolveTeam(entry, maps, accent);
    const ped = document.createElement('div');
    ped.className = 'st-ped p' + rank;
    ped.style.setProperty('--ped-accent', t.color);
    const w = entry.wins ?? '–', l = entry.losses ?? '–';
    const games = (entry.gameWins != null || entry.gameLosses != null)
      ? `<span class="st-ped-sub">${stGamesLabel} ${entry.gameWins ?? 0}-${entry.gameLosses ?? 0}</span>` : '';
    const pts = (hasPoints && entry.points != null) ? `<span class="st-ped-pts">${esc(entry.points)}</span>` : '';
    ped.innerHTML = `
      <div class="st-ped-team">
        <img class="st-ped-logo${t.isDefaultLogo ? ' logo-on-dark' : ''}" src="${t.logo}" alt="">
        <div class="st-ped-name">${esc(entry.name || 'TBD')}</div>
        <div class="st-ped-record">
          <span class="st-ped-wl"><span class="w">${w}</span><span class="sep">–</span><span class="l">${l}</span></span>
          <span class="st-ped-sub">Series</span>
          ${pts}
        </div>
        ${games}
      </div>
      <div class="st-ped-block"><span class="st-ped-rank">${rank}</span></div>`;
    setTimeout(() => ped.classList.add('visible'), delay);
    return ped;
  }

  // ── Compact list rows (ranks 4+) ──
  function colStops(showRecord, hasGames, hasPoints) {
    // rank | logo | name | [W] | [L] | [Games] | [PTS]
    let cols = '72px 62px minmax(0,1fr)';
    if (showRecord) cols += ' 80px 80px';
    if (hasGames)   cols += ' 120px';
    if (hasPoints)  cols += ' 104px';
    return cols;
  }
  let stGamesLabel = 'Games';   // "Games" (RL/MOBA) or "Maps" (CS2/Valorant) — set per push from gamesLabel
  function buildHead(showRecord, hasGames, hasPoints) {
    const row = document.createElement('div');
    row.className = 'st-row st-head';
    let html = `<div class="st-col-rank">#</div><div class="st-col-logo"></div><div class="st-col-name">Team</div>`;
    if (showRecord) html += `<div class="st-col-stat" title="Set wins"><span class="st-col-grouplbl">Set</span>W</div><div class="st-col-stat" title="Set losses"><span class="st-col-grouplbl">Set</span>L</div>`;
    if (hasGames)   html += `<div class="st-col-stat">${stGamesLabel}</div>`;
    if (hasPoints)  html += `<div class="st-col-stat">PTS</div>`;
    row.innerHTML = html;
    return row;
  }
  function buildDataRow(entry, maps, idx, showRecord, hasGames, hasPoints, accent) {
    const noResult = entry.played === false && !(entry.wins || entry.losses);
    const rank = noResult ? '–' : (Number(entry.placement) || (idx + 1));
    const t = resolveTeam(entry, maps, accent);
    const row = document.createElement('div');
    row.className = 'st-row';
    row.style.setProperty('--row-accent', t.color);
    let html = `
      <div class="st-col-rank"><div class="st-badge">${rank}</div></div>
      <div class="st-col-logo"><img class="st-team-logo${t.isDefaultLogo ? ' logo-on-dark' : ''}" src="${t.logo}" alt=""></div>
      <div class="st-col-name"><span class="st-name-txt">${esc(entry.name || 'TBD')}</span></div>`;
    if (showRecord) {
      html += `<div class="st-col-stat wins">${entry.wins ?? '—'}</div>`;
      html += `<div class="st-col-stat losses">${entry.losses ?? '—'}</div>`;
    }
    if (hasGames) html += `<div class="st-col-stat">${entry.gameWins ?? 0}-${entry.gameLosses ?? 0}</div>`;
    if (hasPoints) html += `<div class="st-col-stat pts"><span class="st-pts-num">${entry.points ?? '—'}</span></div>`;
    row.innerHTML = html;
    setTimeout(() => row.classList.add('visible'), 360 + idx * 55);
    return row;
  }

  // ── Placement wall (layout 'placement') ────────────────────────────────────
  // One card per finisher with the entrant's CHARACTER art (row.character — a fighter name the
  // producer assigned when building the push). No character, or a game with no character art, and
  // the card falls back to the team/player logo, so this layout is safe for any game.
  // Tints for the placement cards, computed here rather than with CSS color-mix(): the app runs
  // Electron 18 / Chrome 100, where color-mix is unsupported and computes to black, so the cards
  // would lose every accent in the in-app preview.
  function hexRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
    const n = m ? parseInt(m[1], 16) : 0x2a3050;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgba(hex, a) { const c = hexRgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function mixHex(hex, towards, amount) {
    const a = hexRgb(hex), b = hexRgb(towards);
    return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * amount)).join(',')})`;
  }
  // Readable ink on a brand-coloured chip: flip to near-black only when white would fall under
  // ~3:1, so ordinary team colours keep white and only genuinely pale ones switch. Same rule as
  // overlay/fgc/fgc-adapter.js and the control panel's teamInk().
  // Takes an [r,g,b] triple, NOT a colour string: mixHex() returns "rgb(...)" notation while
  // hexRgb() only parses "#rrggbb", so feeding one to the other silently fell back to the default
  // dark and every badge came back white — the exact bug this is here to fix.
  function inkOnRgb(c) {
    const lin = c.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    const L = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
    return (1.05 / (L + 0.05)) < 3 ? '#0b0e17' : '#ffffff';
  }
  function applyCardTints(cardEl, color) {
    cardEl.style.setProperty('--pl-accent', color);
    cardEl.style.setProperty('--pl-accent-lit', mixHex(color, '#ffffff', 0.18));
    cardEl.style.setProperty('--pl-accent-text', mixHex(color, '#ffffff', 0.65));
    cardEl.style.setProperty('--pl-edge', rgba(color, 0.72));
    cardEl.style.setProperty('--pl-glow', rgba(color, 0.42));
    // Judge against the LIGHTER gradient stop — that is the end the numeral mostly sits on.
    const rankInk = inkOnRgb(hexRgb(color).map((v) => v + (255 - v) * 0.18));
    cardEl.style.setProperty('--pl-rank-ink', rankInk);
    cardEl.style.setProperty('--pl-rank-shadow', rankInk === '#ffffff'
      ? '0 2px 6px rgba(0,0,0,.45)' : '0 1px 0 rgba(255,255,255,.45)');
  }

  function characterArt(entry) {
    if (!entry || !entry.character || !window.SmashFighters) return null;
    const f = SmashFighters.resolve(entry.character);
    return f ? { url: SmashFighters.renderUrl(f.slug), name: f.name, icon: SmashFighters.stockUrl(f.slug) } : null;
  }
  function buildPlacementCard(entry, idx, maps, accent, showRecord, delay) {
    const t = resolveTeam(entry, maps, accent);
    const art = characterArt(entry);
    const rank = Number(entry.placement) || (idx + 1);
    const card = document.createElement('div');
    card.className = 'st-pl-card';
    card.dataset.rank = String(rank);
    applyCardTints(card, t.color);
    // The fighter NAME is deliberately not printed — the art already says who they played, and the
    // card is for the ENTRANT. Meta is the record only (when the producer has W/L switched on).
    const bits = [];
    if (showRecord && (entry.wins != null || entry.losses != null)) bits.push(`${entry.wins ?? 0}-${entry.losses ?? 0}`);
    if (!bits.length && entry.points != null) bits.push(`${entry.points} PTS`);
    // Team / doubles entrant: the headline is the team, and the squad is listed under it. Skipped
    // when the roster just restates the entrant name (start.gg names a doubles team "A / B"), so a
    // singles card never grows a redundant second line.
    const roster = Array.isArray(entry.players) ? entry.players.filter(Boolean) : [];
    const nameKey = String(entry.name || '').replace(/[^a-z0-9]+/gi, '').toLowerCase();
    const rosterKey = roster.join('').replace(/[^a-z0-9]+/gi, '').toLowerCase();
    const showRoster = roster.length > 1 && rosterKey !== nameKey;
    card.innerHTML = `
      <div class="st-pl-art${art ? '' : ' is-logo'}">
        <img src="${art ? art.url : t.logo}"${!art && t.isDefaultLogo ? ' class="logo-on-dark"' : ''} alt="">
      </div>
      <div class="st-pl-rank">${rank}</div>
      <div class="st-pl-foot">
        <div class="st-pl-name">${esc(entry.name || 'TBD')}</div>
        ${showRoster ? `<div class="st-pl-roster">${esc(roster.join(' · '))}</div>` : ''}
        <div class="st-pl-meta">${esc(bits.join(' · '))}</div>
      </div>`;
    setTimeout(() => card.classList.add('visible'), delay);
    return card;
  }
  function buildPlacementWall(wrap, restEl, rows, maps, accent, showRecord) {
    wrap.innerHTML = '';
    restEl.innerHTML = '';
    // hero (1st) | top row (2-4) | bottom row (5-8) — the standard top-8 finish board.
    const hero = rows[0];
    const rowA = rows.slice(1, 4);
    const rowB = rows.slice(4, 8);
    let n = 0;
    if (hero) {
      const card = buildPlacementCard(hero, 0, maps, accent, showRecord, 90);
      card.classList.add('st-pl-hero');
      wrap.appendChild(card);
      n++;
    }
    const side = document.createElement('div');
    side.className = 'st-place-side';
    [['st-pl-row-a', rowA], ['st-pl-row-b', rowB]].forEach(([cls, group]) => {
      if (!group.length) return;
      const row = document.createElement('div');
      row.className = 'st-pl-row ' + cls;
      group.forEach((entry) => {
        row.appendChild(buildPlacementCard(entry, rows.indexOf(entry), maps, accent, showRecord, 150 + (n++) * 90));
      });
      side.appendChild(row);
    });
    if (side.childElementCount) wrap.appendChild(side);

    // 9th and beyond: name them on a chip strip rather than dropping them silently.
    const rest = rows.slice(8, 24);
    rest.forEach((entry, i) => {
      const art = characterArt(entry);
      const chip = document.createElement('div');
      chip.className = 'st-pl-chip';
      chip.innerHTML = `${art ? `<img src="${art.icon}" alt="">` : ''}<b>${Number(entry.placement) || (9 + i)}</b><span>${esc(entry.name || 'TBD')}</span>`;
      restEl.appendChild(chip);
    });
    restEl.style.display = rest.length ? '' : 'none';
  }

  // ── Division board (layout 'divisions') ────────────────────────────────────
  // Groups rows by their `division` (set by the server's league mirror from lg.divisions) and
  // draws one ranked table per division. Division order follows first appearance in the rows,
  // which is the league's own order — not alphabetical, so "East" stays left of "West" if that
  // is how the producer arranged them.
  var DV_COLORS = ['#55b3ff', '#ff8c42', '#5fe39a', '#c98cff'];
  function buildDivisions(host, rows, maps, accent, showRecord) {
    host.innerHTML = '';
    const order = [];
    const byDiv = {};
    rows.forEach((r) => {
      const d = r.division || 'League';
      if (!byDiv[d]) { byDiv[d] = []; order.push(d); }
      byDiv[d].push(r);
    });
    host.className = 'st-divs cols-' + Math.min(order.length || 1, 3);
    let anyQual = false;
    order.forEach((name, di) => {
      const col = document.createElement('div'); col.className = 'st-dv';
      col.style.setProperty('--dv-c', DV_COLORS[di % DV_COLORS.length]);
      const head = document.createElement('div'); head.className = 'st-dv-head';
      head.textContent = name.toUpperCase();
      col.appendChild(head);
      const body = document.createElement('div'); body.className = 'st-dv-rows';
      byDiv[name].forEach((entry, i) => {
        const t = resolveTeam(entry, maps, accent);
        const row = document.createElement('div');
        const qual = !!entry.qualified;
        if (qual) anyQual = true;
        row.className = 'st-dv-row' + (qual ? ' qual' : '') + (entry.eliminated ? ' out' : '');
        const rank = Number(entry.placement) || (i + 1);
        const rec = showRecord
          ? ((entry.wins != null ? entry.wins : 0) + '-' + (entry.losses != null ? entry.losses : 0))
          : (entry.points != null ? String(entry.points) : '');
        row.innerHTML =
          '<div class="st-dv-rank">' + rank + '</div>' +
          '<div><img class="st-dv-logo' + (t.isDefaultLogo ? ' logo-on-dark' : '') + '" src="' + t.logo + '" alt=""></div>' +
          '<div class="st-dv-name">' + esc(entry.name || 'TBD') + '</div>' +
          '<div class="st-dv-rec">' + esc(rec) + '</div>';
        body.appendChild(row);
      });
      col.appendChild(body);
      host.appendChild(col);
    });
    if (anyQual) {
      const note = document.createElement('div'); note.className = 'st-dv-note';
      note.textContent = 'Highlighted = playoff position';
      host.appendChild(note);
      note.style.gridColumn = '1 / -1';
    }
  }

  // Scale the natural-size layout to fill the 16:9 canvas (matches bracket.html's fit()).
  function fit() {
    const scale = el('st-scale');
    if (!scale) return;
    scale.style.transform = 'scale(1)';
    const availW = 1920 - 152, availH = 1080 - 48 - 78 - 58;   // stage padding + sponsor rail
    const w = Math.max(scale.offsetWidth, scale.scrollWidth) || 1;
    const h = Math.max(scale.offsetHeight, scale.scrollHeight) || 1;
    const s = Math.min(availW / w, availH / h, 1.08);
    scale.style.transform = `scale(${s})`;
  }

  // Only rebuild the DOM (and replay animations) when CONTENT changes.
  let _sig = '';
  function render(data) {
    const stage = el('st-stage'), podium = el('st-podium'), list = el('st-list'), empty = el('st-empty');
    if (!stage || !podium || !list) return;

    // Suppress the scene-base standalone "demo" flash on refresh: real server state ALWAYS
    // includes a `standings` object; the demo does not — hold hidden until real WS state.
    if (!data.standings && !SceneBase.preview) { stage.classList.remove('show'); return; }

    const stState = data.standings || {};
    const bracket = data.bracket || {};
    stage.classList.add('show');

    const accent = SceneBase.brandColor(data) || '#e83a8b';
    const accent2 = SceneBase.brandAccent(data) || accent;

    // Full EVENT NAME preferred over the bracket's (often shortened) event title.
    const title = (stState.title || data.eventName || bracket.title || 'STANDINGS').toString().toUpperCase();
    const subtitle = (stState.subtitle || '').toString();

    // Resolve rows. Manual rows always win; start.gg-sourced rows defer to the live bracket
    // standings; stale league leftovers (no name overlap with the live event) lose to live.
    const live = bracket.standings || [];
    const frozen = (stState.rows && stState.rows.length > 0) ? stState.rows : [];
    const src = (stState.source || '').toString();
    const liveNames = new Set(live.map((r) => (r.name || '').toLowerCase()));
    const overlap = frozen.some((r) => liveNames.has((r.name || '').toLowerCase()));
    // 'league' is authoritative like 'manual': the producer explicitly pointed the board at one of
    // OUR leagues, and the server keeps those rows mirrored to its live points. Falling through to
    // the tournament's `live` rows here would quietly swap league standings for event standings.
    const rows = (src === 'manual' && frozen.length) ? frozen
               : (src === 'league') ? frozen
               : (src === 'startgg' && live.length) ? live
               : (src.indexOf('startgg') === 0 && live.length && frozen.length && !overlap) ? live
               : (frozen.length ? frozen : live);
    const maps = teamMaps(data);

    const showRecord = stState.showRecord !== false && rows.some(r => r.wins != null || r.losses != null);
    const hasPoints = rows.some(r => r.points != null);
    const hasGames = rows.some(r => r.gameWins != null || r.gameLosses != null);
    stGamesLabel = (stState.gamesLabel || 'Games').toString();
    const brandLogo = SceneBase.brandLogo(data) || '';

    // Sponsor rail — active brand kit, desk placement first (same rule as intro.html).
    const brand = data.brand || {};
    const anyTagged = (brand.deskSponsors || []).length || (brand.railSponsors || []).length || (brand.bannerSponsors || []).length;
    const sponsors = ((brand.deskSponsors || []).length ? brand.deskSponsors : (anyTagged ? [] : (brand.sponsors || [])))
      .filter((s) => s && s.logo);

    // Signature from ONLY the fields the board renders. start.gg-sourced rows come straight from
    // bracket.standings, which carry churning extras (seeds, entrant ids, per-fetch data) beyond
    // what we display — stringifying whole row objects flipped the sig on every ~20s fetch and tore
    // the board down + replayed every slide-in. Project to displayed fields so it only rebuilds when
    // something visible actually changes. (`lm` still catches logos that backfill from a later fetch.)
    const rowSig = rows.map((r) => [r.division, r.qualified,
      r.name, r.placement, r.wins, r.losses, r.points, r.gameWins, r.gameLosses, r.color, r.played, r.character,
      (Array.isArray(r.players) ? r.players.join('~') : ''), (r.logo ? 1 : 0)
    ].join('')).join('');
    // The placement wall is the SMASH board — it only ever draws for a game with the 'stocks'
    // feature. Gating here and not just on stState.layout matters: the layout is persisted, so a
    // board pushed during a Smash event would otherwise still draw as character cards after the
    // producer switched the active game. Within Smash, 'podium' opts back into the normal board.
    const gameDef = (data.games || {})[data.activeGame] || {};
    const smashGame = (gameDef.features || []).indexOf('stocks') >= 0;
    // Divisions win over the podium whenever the rows actually carry more than one: a podium
    // built across two conferences ranks teams against opponents they never played, which
    // states a standing that does not exist. An explicit 'podium' still forces the old board.
    const divCount = new Set(rows.map((r) => r && r.division).filter(Boolean)).size;
    const layout = (smashGame && stState.layout !== 'podium') ? 'placement'
                 : (divCount > 1 && stState.layout !== 'podium') ? 'divisions' : 'podium';
    const sig = JSON.stringify({ rowSig, title, subtitle, credit: stState.attribution || '', showRecord, hasPoints, hasGames, accent, accent2, layout,
      bl: brandLogo.slice(0, 40), f: data.fontFamily || '', sp: sponsors.map((s) => s.logo && s.logo.slice(0, 40)),
      lm: Object.keys(maps.logos).length });
    if (sig === _sig) return;
    _sig = sig;

    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-2', accent2);
    if (data.fontFamily) document.documentElement.style.setProperty('--main-font', `'${data.fontFamily}', 'Bourgeois', 'Inter', sans-serif`);
    el('st-title').textContent = title;
    el('st-subtitle').textContent = subtitle;
    el('st-credit').textContent = (stState.attribution || '').toString();

    const brandEl = el('st-brand');
    if (brandLogo) { if (brandEl.getAttribute('src') !== brandLogo) brandEl.src = brandLogo; brandEl.style.display = ''; }
    else brandEl.style.display = 'none';

    const sp = el('st-sponsors');
    sp.innerHTML = sponsors.length
      ? '<span class="st-sponsors-lbl">Presented by</span>' + sponsors.map((s) => `<img class="st-sponsor" src="${s.logo}" alt="">`).join('')
      : '';
    sp.classList.toggle('is-empty', !sponsors.length);

    podium.innerHTML = '';
    list.innerHTML = '';
    const placeEl = el('st-place'), placeRestEl = el('st-place-rest');
    placeEl.innerHTML = '';
    placeRestEl.innerHTML = '';
    const moreEl = el('st-more');
    if (rows.length === 0) {
      empty.style.display = '';
      el('st-count').innerHTML = '';
      moreEl.style.display = 'none';
      placeEl.style.display = 'none';
      placeRestEl.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    // The placement board is a TOP N graphic, so it says so — "TOP 8", not a field size. N is how
    // many cards actually get drawn (the wall holds 8; a short field says TOP 5), which is why it
    // is not just the row count: a 37-entrant league pushed here would have read "37 ENTRANTS"
    // over a board showing eight. Word first so it reads "TOP 8" left to right.
    el('st-count').innerHTML = layout === 'placement'
      ? `<span>Top</span><b>${Math.min(rows.length, 8)}</b>`
      : `<b>${rows.length}</b><span>Teams</span>`;

    // Division board — one ranked table per conference; podium/list/"+N more" are unused.
    const divsEl = el('st-divs');
    if (layout === 'divisions') {
      podium.style.display = 'none';
      moreEl.style.display = 'none';
      list.innerHTML = '';
      placeEl.style.display = 'none';
      placeRestEl.style.display = 'none';
      divsEl.style.display = '';
      buildDivisions(divsEl, rows, maps, accent, showRecord);
      requestAnimationFrame(fit);
      return;
    }
    divsEl.style.display = 'none';

    // Placement wall — the whole board is the card grid, so the podium/list/"+N more" are unused.
    if (layout === 'placement') {
      podium.style.display = 'none';
      moreEl.style.display = 'none';
      placeEl.style.display = '';
      buildPlacementWall(placeEl, placeRestEl, rows, maps, accent, showRecord);
      requestAnimationFrame(fit);
      return;
    }
    placeEl.style.display = 'none';
    placeRestEl.style.display = 'none';

    // Podium (2nd | 1st | 3rd) — only when the top teams have actual results; a pre-event
    // table (all rows played:false) renders as a plain list so nobody looks pre-crowned.
    const started = rows.slice(0, 3).some((r) => (r.wins || 0) + (r.losses || 0) > 0 || r.played !== false);
    const podiumRows = started ? rows.slice(0, 3) : [];
    if (podiumRows.length >= 2) {
      const order = [[podiumRows[1], 2, 120], [podiumRows[0], 1, 0], [podiumRows[2], 3, 240]];
      order.forEach(([entry, rank, delay]) => {
        if (entry) podium.appendChild(buildPedestal(entry, rank, maps, accent, hasPoints, 80 + delay));
      });
      podium.style.display = '';
    } else {
      podium.style.display = 'none';
    }

    // List: the next ranks under the podium (top 12 total: podium 3 + 9 rows), "+N more" beyond.
    const listStart = podiumRows.length >= 2 ? 3 : 0;
    const LIST_MAX = podiumRows.length >= 2 ? 9 : 12;
    const listRows = rows.slice(listStart, listStart + LIST_MAX);
    if (listRows.length) {
      list.style.setProperty('--st-cols', colStops(showRecord, hasGames, hasPoints));
      list.appendChild(buildHead(showRecord, hasGames, hasPoints));
      listRows.forEach((r, i) => list.appendChild(buildDataRow(r, maps, i, showRecord, hasGames, hasPoints, accent)));
    }
    const hidden = rows.length - listStart - listRows.length;
    moreEl.style.display = hidden > 0 ? '' : 'none';
    moreEl.textContent = hidden > 0 ? `+ ${hidden} more team${hidden === 1 ? '' : 's'}` : '';

    requestAnimationFrame(fit);
  }

  if (location.protocol === 'file:') {
    render({
      standings: { title: 'Summer Showdown', subtitle: 'Group Stage · Week 4', showRecord: true, rows: [
        { placement: 1, name: 'Velocity Gaming', color: '#3b82f6', wins: 8, losses: 1, points: 24, gameWins: 25, gameLosses: 9 },
        { placement: 2, name: 'Team Apex Esports', color: '#f97316', wins: 7, losses: 2, points: 21, gameWins: 22, gameLosses: 12 },
        { placement: 3, name: 'Nova Collective', color: '#a855f7', wins: 6, losses: 3, points: 18, gameWins: 20, gameLosses: 13 },
        { placement: 4, name: 'Iron Wolves', color: '#22c55e', wins: 5, losses: 4, points: 15, gameWins: 18, gameLosses: 15 },
        { placement: 5, name: 'Phantom Squad', color: '#ef4444', wins: 3, losses: 6, points: 9, gameWins: 13, gameLosses: 19 },
        { placement: 6, name: 'Echo Rising', color: '#14b8a6', wins: 1, losses: 8, points: 3, gameWins: 7, gameLosses: 24 },
        { placement: 7, name: 'Crimson Tide', color: '#f59e0b', wins: 1, losses: 8, points: 3, gameWins: 6, gameLosses: 24 },
        { placement: 8, name: 'Nightfall', color: '#6366f1', wins: 0, losses: 9, points: 0, gameWins: 3, gameLosses: 27 } ] }
    });
  } else {
    SceneBase.connect(render);
  }
})();
</script>
