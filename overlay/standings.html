<!DOCTYPE html>
<!--
  standings.html — thematic leaderboard overlay. Resolves rows from (priority):
    1. manual override rows        (state.standings.rows — pushed from control panel)
    2. loaded bracket / start.gg   (state.bracket.standings — round-robin / swiss auto)
  Sources (start.gg event, in-app league, manual) all funnel into those rows via the
  control panel's Standings section. W/L columns are optional (state.standings.showRecord);
  a PTS column appears automatically when any row carries points.
  Redesigned 2026-07: landscape 16:9 layout — a title/branding HERO on the left + the standings
  BOARD on the right (fills the widescreen); team-color row washes, medal-glow podium, per-team
  win-rate bar. Keeps fit()/split/sponsor/sig-guard + the standalone demo-flash guard.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NE Broadcast Suite — Standings</title>
<link rel="stylesheet" href="/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:    #055fdb;
  --accent-2:  #4d90ff;
  --gold:      #ffcf5c;
  --silver:    #d3dcec;
  --bronze:    #e0965a;
  --base-1:    #14181f;
  --base-2:    #0d1017;
  --main-font: 'Bourgeois', 'Inter', sans-serif;
  --stage-w:   1920px;
  --stage-h:   1080px;
}

html, body {
  width: var(--stage-w); height: var(--stage-h);
  overflow: hidden; background: transparent;
  font-family: var(--main-font); -webkit-font-smoothing: antialiased;
}

/* ── Stage ── */
.st-stage {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 60px 76px;
  background:
    radial-gradient(ellipse 70% 60% at 12% 0%, color-mix(in srgb, var(--accent) 30%, transparent) 0%, rgba(0,0,0,0) 55%),
    radial-gradient(ellipse 55% 45% at 100% 108%, color-mix(in srgb, var(--accent-2) 15%, transparent) 0%, rgba(0,0,0,0) 55%),
    linear-gradient(180deg, #090b10 0%, #0d1017 55%, #090b10 100%);
  opacity: 0; transform: scale(1.015);
  transition: opacity 0.55s ease, transform 0.55s ease;
}
.st-stage.show { opacity: 1; transform: scale(1); }

/* faint diagonal texture, masked toward the edges */
.st-stage::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: repeating-linear-gradient(120deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 52px);
  -webkit-mask-image: radial-gradient(120% 90% at 40% 40%, #000 0%, transparent 82%);
  mask-image: radial-gradient(120% 90% at 40% 40%, #000 0%, transparent 82%);
}

/* ── Landscape wrapper: [hero] [board] — sized natural, scaled to fill 16:9 ── */
/* min-height (not height): small fields still stretch to fill 900px, but a tall team list
   GROWS the wrapper so fit() sees the real size and downscales — fixed height used to clip
   overflowing rows at the top/bottom. */
.st-scale { display: flex; align-items: stretch; gap: 58px; width: 1808px; min-height: 900px; transform-origin: center center; }

/* ── Left hero — event branding, big title, team count ── */
.st-hero {
  flex: 0 0 500px; display: flex; flex-direction: column; justify-content: center; gap: 18px;
  position: relative; padding-left: 36px; min-width: 0;
}
.st-hero::before {
  content: ''; position: absolute; left: 0; top: 8%; bottom: 8%; width: 11px; border-radius: 6px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 68%, transparent);
}
.st-eyebrow {
  display: inline-flex; align-items: center; gap: 12px;
  font-size: 17px; font-weight: 800; letter-spacing: 8px; text-transform: uppercase; color: var(--accent-2);
}
.st-eyebrow::before { content: ''; width: 26px; height: 2px; background: currentColor; border-radius: 2px; }
.st-title {
  font-size: 76px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
  color: #fff; line-height: 0.92; text-shadow: 0 8px 40px rgba(0,0,0,0.7);
}
.st-subtitle { font-size: 25px; font-weight: 600; letter-spacing: 1px; color: #97a0b4; }
.st-subtitle:empty { display: none; }
.st-count {
  margin-top: 16px; display: flex; align-items: baseline; gap: 14px; line-height: 1;
  padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.09);
}
.st-count b {
  font-size: 92px; font-weight: 800; color: #fff;
  background: linear-gradient(180deg, #fff, #b9c2d6); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.st-count span { font-size: 15px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: #6a7080; }
.st-count:empty { display: none; }

/* ── Right board — the table(s), vertically centered ── */
.st-board { flex: 1 1 0; min-width: 0; display: flex; align-items: center; }
.st-cols { width: 100%; display: flex; gap: 22px; align-items: stretch; }
.st-table { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.st-cols.split .st-row { height: 68px; }
.st-cols.split .st-col-name .st-name-txt { font-size: 25px; }
.st-cols.split .st-badge { width: 46px; height: 46px; font-size: 23px; }
.st-cols.split .st-team-logo { width: 42px; height: 42px; }
.st-cols.split .st-wr { display: none; }
.st-cols.split .st-pts-num { font-size: 32px; }

/* ── Row ── */
.st-row {
  display: grid; grid-template-columns: var(--st-cols); align-items: center;
  column-gap: 10px; height: 96px; padding: 0 24px 0 0;
  border-radius: 13px; position: relative; overflow: hidden;
  background: linear-gradient(90deg, color-mix(in srgb, var(--row-accent, var(--accent)) 22%, var(--base-1)) 0%, var(--base-1) 46%, var(--base-2) 100%);
  border: 1px solid color-mix(in srgb, var(--row-accent, var(--accent)) 22%, rgba(255,255,255,0.05));
  box-shadow: 0 10px 26px rgba(0,0,0,0.42);
  opacity: 0; transform: translateX(-20px);
  transition: opacity 0.42s cubic-bezier(.16,.84,.24,1), transform 0.42s cubic-bezier(.16,.84,.24,1);
}
.st-row.visible { opacity: 1; transform: translateX(0); }
.st-row::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  background: var(--row-accent, var(--accent));
  box-shadow: 0 0 16px color-mix(in srgb, var(--row-accent, var(--accent)) 65%, transparent);
}

/* Header row */
.st-head {
  height: 38px; padding: 0 24px 0 0; background: none; border: none; box-shadow: none;
  opacity: 1 !important; transform: none !important; overflow: visible; flex: 0 0 auto;
}
.st-head::before { display: none; }
.st-head > div { font-size: 13px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: #5c6474; }

/* Podium — medal glow rings */
.st-row.rank-1 { box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 55%, transparent), 0 12px 34px rgba(0,0,0,0.5), 0 0 42px color-mix(in srgb, var(--gold) 22%, transparent); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.st-row.rank-2 { box-shadow: 0 0 0 1px color-mix(in srgb, var(--silver) 40%, transparent), 0 11px 30px rgba(0,0,0,0.48); border-color: color-mix(in srgb, var(--silver) 32%, transparent); }
.st-row.rank-3 { box-shadow: 0 0 0 1px color-mix(in srgb, var(--bronze) 42%, transparent), 0 11px 30px rgba(0,0,0,0.48); border-color: color-mix(in srgb, var(--bronze) 34%, transparent); }

/* Rank badge */
.st-col-rank { display: flex; align-items: center; justify-content: center; }
.st-badge {
  width: 58px; height: 58px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 29px; font-weight: 800; color: #d6dcea; font-variant-numeric: tabular-nums;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
}
.rank-1 .st-badge { background: linear-gradient(155deg, #ffe9a8, var(--gold)); color: #4a3708; border-color: color-mix(in srgb, var(--gold) 75%, #fff); box-shadow: 0 6px 22px color-mix(in srgb, var(--gold) 48%, transparent); }
.rank-2 .st-badge { background: linear-gradient(155deg, #f4f8ff, var(--silver)); color: #2b3140; border-color: #fff; box-shadow: 0 6px 22px color-mix(in srgb, var(--silver) 42%, transparent); }
.rank-3 .st-badge { background: linear-gradient(155deg, #f6bd8c, var(--bronze)); color: #442a12; border-color: color-mix(in srgb, var(--bronze) 75%, #fff); box-shadow: 0 6px 22px color-mix(in srgb, var(--bronze) 42%, transparent); }

/* Logo */
.st-col-logo { display: flex; align-items: center; justify-content: center; }
.st-team-logo { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 2px 7px rgba(0,0,0,0.6)); }
.st-team-logo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 2px 7px rgba(0,0,0,0.6)); }

/* Name + win-rate bar */
.st-col-name { display: flex; flex-direction: column; justify-content: center; gap: 8px; min-width: 0; padding-left: 4px; }
.st-name-txt { font-size: 33px; font-weight: 700; color: #f2f4f8; letter-spacing: 0.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-1 .st-name-txt { color: #fff; }
.st-wr { position: relative; width: 240px; max-width: 62%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
.st-wr > span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: linear-gradient(90deg, var(--row-accent, var(--accent)), color-mix(in srgb, var(--row-accent, var(--accent)) 55%, #fff)); box-shadow: 0 0 8px color-mix(in srgb, var(--row-accent, var(--accent)) 55%, transparent); }

/* Stat cells */
.st-col-stat { font-size: 31px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; color: #aeb6c6; }
.st-col-stat.wins   { color: #6ff0a8; }
.st-col-stat.losses { color: #f39191; }
.st-col-stat.pts { display: flex; align-items: center; justify-content: center; }
.st-pts-num {
  font-size: 42px; font-weight: 800; line-height: 1;
  background: linear-gradient(160deg, #ffe9a8, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 6px rgba(245,201,68,0.3));
}
.st-head .st-col-stat { color: #5c6474; font-size: 13px; }

/* ── Empty ── */
.st-empty { font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.22); text-align: center; }

/* ── Sponsor rail ── */
.st-sponsors { position: absolute; bottom: 26px; right: 76px;
  display: flex; align-items: center; gap: 34px; padding: 10px 28px; border-radius: 12px;
  background: rgba(9,11,16,.74); border: 1px solid rgba(255,255,255,.07); }
.st-sponsors.is-empty { display: none; }
.st-sponsors-lbl { font-size: 10px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: #6a7080; }
.st-sponsor { height: 30px; max-width: 120px; object-fit: contain; opacity: .88; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
</style>
</head>
<body>

<div id="st-stage" class="st-stage">
  <div class="st-scale" id="st-scale">
    <div class="st-hero">
      <div class="st-eyebrow" id="st-eyebrow">Standings</div>
      <div class="st-title" id="st-title">STANDINGS</div>
      <div class="st-subtitle" id="st-subtitle"></div>
      <div class="st-count" id="st-count"></div>
    </div>
    <div class="st-board">
      <div class="st-cols" id="st-cols"></div>
    </div>
  </div>
  <div class="st-empty" id="st-empty" style="display:none;">No standings data — pull start.gg, a league, or add manual rows.</div>
  <div class="st-sponsors is-empty" id="st-sponsors"></div>
</div>

<script src="scene-base.js"></script>
<script>
(function () {
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function svgFallback(letter, color) {
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="24" fill="${color}"/><text x="80" y="110" font-size="88" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold">${letter}</text></svg>`);
  }

  function teamMaps(savedTeams) {
    const logos = {}, colors = {};
    (savedTeams || []).forEach(t => {
      if (!t || !t.name) return;
      const k = t.name.toLowerCase();
      if (t.logo) logos[k] = t.logo;
      if (t.color) colors[k] = t.color;
    });
    return { logos, colors };
  }

  function colStops(showRecord, hasPoints, hasExtra) {
    // rank | logo | name | [W] | [L] | [Played] | [Games] | [PTS]
    let cols = '96px 80px minmax(0,1fr)';
    if (showRecord) cols += ' 92px 92px';
    if (hasExtra)   cols += ' 108px 128px';
    if (hasPoints)  cols += ' 120px';
    return cols;
  }

  function headCell(txt, cls) { return `<div class="st-col-${cls}">${txt}</div>`; }

  function buildHead(showRecord, hasPoints, hasExtra) {
    const row = document.createElement('div');
    row.className = 'st-row st-head';
    let html = headCell('#', 'rank') + headCell('', 'logo') + headCell('Team', 'name');
    if (showRecord) html += `<div class="st-col-stat">W</div><div class="st-col-stat">L</div>`;
    if (hasExtra)   html += `<div class="st-col-stat">Played</div><div class="st-col-stat">Games</div>`;
    if (hasPoints)  html += `<div class="st-col-stat">PTS</div>`;
    row.innerHTML = html;
    return row;
  }

  function buildDataRow(entry, maps, idx, showRecord, hasPoints, accent, hasExtra) {
    // played === false with no record = the event hasn't started for this team — show a
    // dash instead of implying a real placement (mirrors bracket.html's standings).
    const noResult = entry.played === false && !(entry.wins || entry.losses);
    const rank = noResult ? '–' : (Number(entry.placement) || (idx + 1));
    const nameKey = (entry.name || '').toLowerCase();
    const logo = entry.logo || maps.logos[nameKey] || svgFallback((entry.name || '?')[0].toUpperCase(), '#2a3050');
    const isDefaultLogo = SceneBase.isDefaultGameLogo(logo);
    const rowAccent = entry.color || maps.colors[nameKey] || accent;

    const row = document.createElement('div');
    row.className = 'st-row' + (!noResult && rank <= 3 ? ` rank-${rank}` : '');
    row.style.setProperty('--row-accent', rowAccent);

    // Win-rate bar (only when there's a real W/L record to show).
    const w = entry.wins || 0, l = entry.losses || 0;
    const wr = (showRecord && (w + l) > 0) ? Math.round((w / (w + l)) * 100) : null;
    const nameCell = `<div class="st-col-name"><span class="st-name-txt">${esc(entry.name || 'TBD')}</span>`
      + (wr != null ? `<span class="st-wr"><span style="width:${wr}%"></span></span>` : '') + `</div>`;

    let html = `
      <div class="st-col-rank"><div class="st-badge">${rank}</div></div>
      <div class="st-col-logo"><img class="st-team-logo${isDefaultLogo ? ' logo-on-dark' : ''}" src="${logo}" alt=""></div>
      ${nameCell}`;
    if (showRecord) {
      html += `<div class="st-col-stat wins">${entry.wins ?? '—'}</div>`;
      html += `<div class="st-col-stat losses">${entry.losses ?? '—'}</div>`;
    }
    if (hasExtra) {
      html += `<div class="st-col-stat">${entry.setsPlayed ?? 0}/${entry.setsTotal ?? 0}</div>`;
      html += `<div class="st-col-stat">${entry.gameWins ?? 0}-${entry.gameLosses ?? 0}</div>`;
    }
    if (hasPoints) {
      html += `<div class="st-col-stat pts"><span class="st-pts-num">${entry.points ?? '—'}</span></div>`;
    }
    row.innerHTML = html;

    setTimeout(() => row.classList.add('visible'), 100 + idx * 55);
    return row;
  }

  // Scale the natural-size landscape layout to fill the 16:9 canvas (matches bracket.html's fit()).
  function fit() {
    const scale = el('st-scale');
    if (!scale) return;
    scale.style.transform = 'scale(1)';
    const availW = 1920 - 152, availH = 1080 - 120;   // stage padding
    // scrollWidth/Height see content that overflows the wrapper's own box — offsetHeight
    // alone missed rows spilling past the min-height and let them clip.
    const w = Math.max(scale.offsetWidth, scale.scrollWidth) || 1;
    const h = Math.max(scale.offsetHeight, scale.scrollHeight) || 1;
    const s = Math.min(availW / w, availH / h, 1.06);
    scale.style.transform = `scale(${s})`;
  }

  // Only rebuild the DOM (and replay the row animations) when CONTENT changes.
  let _sig = '';
  function render(data) {
    const stage = el('st-stage'), cols = el('st-cols'), empty = el('st-empty');
    if (!stage || !cols) return;

    // Suppress the scene-base standalone "demo" flash on refresh: scene-base renders demoState()
    // (which carries a PRO INVITATIONAL bracket) once so a live source isn't blank while the WS
    // connects. Real server state ALWAYS includes a `standings` object; the demo does not — so on a
    // live OBS source (not the control-panel ?preview) hold the scene hidden until real WS state.
    if (!data.standings && !SceneBase.preview) { stage.classList.remove('show'); return; }

    const stState = data.standings || {};
    const bracket = data.bracket || {};
    stage.classList.add('show');

    const accent = SceneBase.brandColor(data) || '#e83a8b';
    const accent2 = SceneBase.brandAccent(data) || accent;

    const title = (stState.title || bracket.title || data.eventName || 'STANDINGS').toString().toUpperCase();
    const subtitle = (stState.subtitle || '').toString();

    // Resolve rows. Manual rows always win; start.gg-sourced rows defer to the live bracket
    // standings; stale league leftovers (no name overlap with the live event) lose to live.
    const live = bracket.standings || [];
    const frozen = (stState.rows && stState.rows.length > 0) ? stState.rows : [];
    const src = (stState.source || '').toString();
    const liveNames = new Set(live.map((r) => (r.name || '').toLowerCase()));
    const overlap = frozen.some((r) => liveNames.has((r.name || '').toLowerCase()));
    const rows = (src === 'manual' && frozen.length) ? frozen
               : (src === 'startgg' && live.length) ? live
               : (src.indexOf('startgg') === 0 && live.length && frozen.length && !overlap) ? live
               : (frozen.length ? frozen : live);
    const maps = teamMaps(data.savedTeams);

    const showRecord = stState.showRecord !== false && rows.some(r => r.wins != null || r.losses != null);
    const hasPoints = rows.some(r => r.points != null);
    const hasExtra = rows.some(r => r.setsTotal != null);

    // Sponsor rail — active brand kit, desk placement first (same rule as intro.html).
    const brand = data.brand || {};
    const anyTagged = (brand.deskSponsors || []).length || (brand.railSponsors || []).length || (brand.bannerSponsors || []).length;
    const sponsors = ((brand.deskSponsors || []).length ? brand.deskSponsors : (anyTagged ? [] : (brand.sponsors || [])))
      .filter((s) => s && s.logo);

    const sig = JSON.stringify({ rows, title, subtitle, showRecord, hasPoints, hasExtra, accent, accent2,
      f: data.fontFamily || '', sp: sponsors.map((s) => s.logo && s.logo.slice(0, 40)) });
    if (sig === _sig) return;
    _sig = sig;

    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-2', accent2);
    if (data.fontFamily) document.documentElement.style.setProperty('--main-font', `'${data.fontFamily}', 'Bourgeois', 'Inter', sans-serif`);
    el('st-title').textContent = title;
    el('st-subtitle').textContent = subtitle;

    const sp = el('st-sponsors');
    sp.innerHTML = sponsors.length
      ? '<span class="st-sponsors-lbl">Presented by</span>' + sponsors.map((s) => `<img class="st-sponsor" src="${s.logo}" alt="">`).join('')
      : '';
    sp.classList.toggle('is-empty', !sponsors.length);

    cols.innerHTML = '';
    if (rows.length === 0) {
      cols.style.display = 'none';
      empty.style.display = '';
      el('st-count').innerHTML = '';
      return;
    }
    cols.style.display = '';
    empty.style.display = 'none';
    el('st-count').innerHTML = `<b>${rows.length}</b><span>Teams</span>`;

    // Split the board into two side-by-side tables once the single list gets long.
    const split = rows.length > 10;
    cols.classList.toggle('split', split);
    const halves = split
      ? [rows.slice(0, Math.ceil(rows.length / 2)), rows.slice(Math.ceil(rows.length / 2))]
      : [rows];
    let idx = 0;
    halves.forEach((half) => {
      const table = document.createElement('div');
      table.className = 'st-table';
      table.style.setProperty('--st-cols', colStops(showRecord, hasPoints, hasExtra));
      table.appendChild(buildHead(showRecord, hasPoints, hasExtra));
      half.forEach((r) => table.appendChild(buildDataRow(r, maps, idx++, showRecord, hasPoints, accent, hasExtra)));
      cols.appendChild(table);
    });
    requestAnimationFrame(fit);
  }

  if (location.protocol === 'file:') {
    render({
      standings: { title: 'Summer Showdown', subtitle: 'Group Stage · Week 4', showRecord: true, rows: [
        { placement: 1, name: 'Velocity Gaming', color: '#3b82f6', wins: 8, losses: 1, points: 24 },
        { placement: 2, name: 'Team Apex Esports', color: '#f97316', wins: 7, losses: 2, points: 21 },
        { placement: 3, name: 'Nova Collective', color: '#a855f7', wins: 6, losses: 3, points: 18 },
        { placement: 4, name: 'Iron Wolves', color: '#22c55e', wins: 5, losses: 4, points: 15 },
        { placement: 5, name: 'Phantom Squad', color: '#ef4444', wins: 3, losses: 6, points: 9 },
        { placement: 6, name: 'Echo Rising', color: '#14b8a6', wins: 1, losses: 8, points: 3 } ] }
    });
  } else {
    SceneBase.connect(render);
  }
})();
</script>
</body>
</html>
