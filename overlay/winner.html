<!DOCTYPE html>
<html lang="en">
<!--
  winner.html — post-match WINNER reveal (duorow design language, 2026 depth redesign).
  Driven by full_state.winner: { visible, side:'blue'|'orange', name, logo, color, subtitle }
  If `side` is set the team's name/logo/colour resolve from full_state.teams; otherwise
  name/logo/color are used directly. No baked background — the Scenes page sets fill+opacity.
-->
<head>
  <meta charset="UTF-8">
  <title>NE Broadcast Suite — Winner</title>
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root {
      --duo-surface: #1a1d24; --duo-surface2: #20242e; --duo-border: #2e3340;
      --duo-muted: #8b93a8; --accent: #e83a8b; --accent2: #8b5cf6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: 'Inter', system-ui, sans-serif; color: #eef1f7; -webkit-font-smoothing: antialiased; }

    #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; opacity: 0; transition: opacity .5s ease; perspective: 1400px; }
    #stage.show { opacity: 1; }

    /* Ambient depth layers behind everything — a slow-rotating light-ray field + a soft breathing
       halo. Pure CSS, no assets, but this is what gives the scene actual depth instead of a flat
       fade: the backdrop has its own life independent of the logo/text reveal. */
    .w-rays { position: absolute; width: 2400px; height: 2400px; left: 50%; top: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      background: conic-gradient(from 0deg, transparent 0deg, color-mix(in srgb, var(--accent) 14%, transparent) 8deg,
        transparent 20deg, transparent 160deg, color-mix(in srgb, var(--accent) 10%, transparent) 168deg, transparent 180deg);
      opacity: 0; animation: raysSpin 40s linear infinite, raysFade 1.4s ease .1s forwards; }
    @keyframes raysSpin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes raysFade { to { opacity: 1; } }
    .w-halo { position: absolute; width: 980px; height: 980px; left: 50%; top: 46%; transform: translate(-50%, -50%);
      border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, color-mix(in srgb, var(--accent) 32%, transparent) 0%, transparent 62%);
      opacity: 0; animation: haloIn 1.1s .15s ease forwards, haloBreathe 4s 1.3s ease-in-out infinite; }
    @keyframes haloIn { to { opacity: 1; } }
    @keyframes haloBreathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } }

    /* Logo: depth-of-field reveal — starts blurred/small/receded, resolves into sharp focus with a
       layered near+far shadow and a glowing ring so it reads as sitting IN FRONT of the backdrop. */
    .w-logo-wrap { position: relative; width: 380px; height: 380px; margin-bottom: 8px;
      animation: logoIn 1s .25s cubic-bezier(.16,.84,.24,1) backwards; }
    @keyframes logoIn { 0% { opacity: 0; transform: translateY(50px) scale(.82); filter: blur(18px); }
      70% { filter: blur(0); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    .w-ring { position: absolute; inset: -22px; border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      box-shadow: 0 0 60px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 40px color-mix(in srgb, var(--accent) 25%, transparent);
      animation: ringPulse 2.6s 1.1s ease-in-out infinite; }
    @keyframes ringPulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
    .w-logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: radial-gradient(circle at 50% 35%, var(--duo-surface2), #0a0c11);
      box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.5); }
    .w-logo img { width: 66%; height: 66%; object-fit: contain; filter: drop-shadow(0 10px 26px rgba(0,0,0,.55)); }
    .w-logo img.on-dark { filter: brightness(0) invert(1) drop-shadow(0 10px 26px rgba(0,0,0,.55)); }
    .w-logo.is-empty { display: none; }

    /* Text block: perspective tilt settling to flat reads as genuine 3D depth, not just a slide. */
    .w-text { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 14px; }
    .w-eyebrow { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .5em;
      text-transform: uppercase; color: var(--accent); opacity: 0;
      animation: eyebrowIn .6s .55s cubic-bezier(.16,.84,.24,1) forwards; }
    @keyframes eyebrowIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .w-name { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 800; font-size: 6em; line-height: .95;
      text-transform: uppercase; color: #fff; letter-spacing: .01em; text-align: center; max-width: 1500px;
      text-shadow: 0 0 50px color-mix(in srgb, var(--accent) 65%, transparent), 0 0 110px color-mix(in srgb, var(--accent) 30%, transparent);
      opacity: 0; transform-style: preserve-3d;
      animation: nameIn .85s .68s cubic-bezier(.16,.84,.24,1) forwards; }
    @keyframes nameIn { 0% { opacity: 0; transform: translateY(46px) rotateX(35deg) scale(.94); }
      100% { opacity: 1; transform: translateY(0) rotateX(0) scale(1); } }
    .w-rule { width: 260px; height: 4px; border-radius: 2px; margin-top: -2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
      box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 60%, transparent);
      opacity: 0; animation: ruleIn .6s .95s cubic-bezier(.16,.84,.24,1) forwards; transform: scaleX(0); }
    @keyframes ruleIn { to { opacity: 1; transform: scaleX(1); } }
    .w-sub { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 600; font-size: 1.9em; color: var(--duo-muted);
      text-transform: uppercase; letter-spacing: .22em; opacity: 0;
      animation: subIn .6s 1.1s cubic-bezier(.16,.84,.24,1) forwards; }
    @keyframes subIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .w-sub.is-empty { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="w-rays"></div>
    <div class="w-halo"></div>
    <div class="w-logo-wrap">
      <div class="w-ring"></div>
      <div class="w-logo" id="w-logo"><img id="w-logo-img" alt=""></div>
    </div>
    <div class="w-text">
      <div class="w-eyebrow">CHAMPION</div>
      <div class="w-name" id="w-name">WINNER</div>
      <div class="w-rule"></div>
      <div class="w-sub is-empty" id="w-sub"></div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const stage = el('stage');
    const EMBED = SceneBase.qp('embed') === '1';   // ?embed=1 → force-show the live state (config preview)
    let _sig = '';

    function resolve(w, data) {
      let name = w.name, logo = w.logo, color = w.color;
      if (w.side === 'blue' || w.side === 'orange') {
        const t = SceneBase.teamSide(data, w.side);
        name = name || t.name;
        logo = logo || t.logo;
        color = color || t.color;
      }
      return { name: name || 'WINNER', logo: logo || null, color: color || null, subtitle: w.subtitle || '' };
    }

    // Restart every animation from scratch (used on real reveals + the preview loop) — otherwise a
    // second win with the same signature wouldn't replay the depth-reveal sequence.
    function replay() {
      document.querySelectorAll('#stage, .w-rays, .w-halo, .w-logo-wrap, .w-ring, .w-eyebrow, .w-name, .w-rule, .w-sub')
        .forEach((e) => { e.style.animation = 'none'; void e.offsetWidth; e.style.animation = ''; });
    }

    function render(data) {
      const w = data.winner || {};
      const visible = !!w.visible || EMBED;
      stage.classList.toggle('show', visible);
      if (!visible) { _sig = ''; return; }

      const r = resolve(w, data);
      const sig = JSON.stringify(r);
      if (sig === _sig) return;
      const first = !_sig;
      _sig = sig;

      if (r.color) document.documentElement.style.setProperty('--accent', r.color);
      el('w-name').textContent = (r.name + ' WINS!').toUpperCase();
      const sub = el('w-sub');
      sub.textContent = r.subtitle;
      sub.classList.toggle('is-empty', !r.subtitle);
      const logoBox = el('w-logo'), logoImg = el('w-logo-img');
      logoBox.classList.toggle('is-empty', !r.logo);
      if (r.logo) { logoImg.src = r.logo; logoImg.classList.toggle('on-dark', SceneBase.isDefaultGameLogo(r.logo)); }

      if (!first) replay();   // a fresh win while already visible — replay the reveal, don't just swap text
    }
    SceneBase.connect(render);

    // Preview: replay the full reveal sequence every ~7 s (2 s animation + 5 s pause).
    if (SceneBase.preview) {
      setTimeout(function _tick() { replay(); setTimeout(_tick, 7000); }, 7000);
    }

    if (location.protocol === 'file:') {
      document.documentElement.classList.add('preview');
      render({
        teams: { blue: { name: 'Frost Esports', color: '#3b82f6', logo: null } },
        winner: { visible: true, side: 'blue', subtitle: '2026 Spring Champions' }
      });
      stage.classList.add('show');
    }
  </script>
</body>
</html>
