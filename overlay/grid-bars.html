<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grid Bars — Multiview Overlay</title>
<!--
  GRID BARS — the same wall as grid.html with the video left out: a transparent 1920x1080 overlay
  carrying only the per-tile bars, the NOW bar and the ticker. Put it ON TOP of your own OBS sources
  (capture cards, NDI, media sources, Twitch browser sources) laid out in the same grid.

  Geometry comes from the shared grid-core.js/grid.css, so the empty tile rectangles here land on
  exactly the pixels grid.html would fill with video. Colour, type, logo and sponsors come from the
  active brand kit; the bottom strip is the app's own ticker.

  ALIGNING YOUR SOURCES — add ?guides=1 and the scene draws every tile rectangle with its OBS
  transform numbers (Position X/Y and Size) printed inside it. Type those into each source's
  Edit ▸ Transform, then drop the parameter for air.

  URL params
    ?tiles=2|3|4|6   pin a layout (recommended here — a fixed OBS layout wants a fixed wall)
    ?guides=1        show tile rectangles + their OBS transform numbers
    ?ticker=0        hide the bottom ticker strip
    ?nowbar=0        hide the NOW bar
-->
<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="grid.css" />
<style>
  /* Transparent everywhere the producer's own video shows through. */
  html,body{ background:transparent; }
  .vid{ background:transparent; }

  /* Alignment guides — never on air, only while you build the scene. */
  .guide{ position:absolute; inset:0; border:2px dashed rgba(var(--brand-rgb),.9);
    background:rgba(var(--brand-rgb),.10); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:calc(6px*var(--s)); text-align:center; }
  .guide .num{ font-size:calc(46px*var(--s)); font-weight:700; line-height:1; color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.8); }
  .guide .xy{ font-family:var(--ui-font); font-size:calc(13px*var(--s)); font-weight:800;
    letter-spacing:.1em; text-transform:uppercase; color:#fff; background:rgba(0,0,0,.62);
    padding:calc(5px*var(--s)) calc(11px*var(--s)); border-radius:4px; }
</style>
</head>
<body>
  <div class="scene">
    <div class="wall"><div class="grid" id="grid"></div></div>

    <div class="nowbar" id="nowbar">
      <div class="nowblk">
        <div class="now" id="nowLabel">STANDBY</div>
        <div class="phase" id="phase"></div>
      </div>
      <div class="title" id="title" hidden><span id="eventName"></span></div>
      <div class="meta">
        <div>
          <div class="lab">Current time</div>
          <div style="display:flex;align-items:baseline;gap:8px;">
            <span class="time" id="clock">--:--</span><span class="tz" id="tz"></span>
          </div>
        </div>
        <div class="logos">
          <span class="sponsors" id="sponsors" hidden></span>
          <img id="brandLogo" alt="" hidden />
        </div>
      </div>
    </div>

    <div class="ticker" id="ticker" hidden>
      <img class="tksponsor" id="tickerSponsor" alt="" hidden />
      <div class="tkmask"><div class="track" id="track"></div></div>
    </div>
  </div>

<script src="grid-core.js"></script>
<script>
(function(){
  var guides = GridCore.params.get('guides') === '1';

  // Print each tile's OBS transform numbers inside its rectangle. Positions are read off the live
  // layout (getBoundingClientRect), so they stay true whatever the tile count or canvas size —
  // just make sure the browser source is the same size as your canvas, with no scaling applied.
  function drawGuides(gridEl){
    Array.prototype.forEach.call(gridEl.querySelectorAll('.vid'), function(box, i){
      var r = box.getBoundingClientRect();
      var xy = 'X ' + Math.round(r.left) + '  Y ' + Math.round(r.top) +
               '   ·   ' + Math.round(r.width) + ' × ' + Math.round(r.height);
      var g = box.querySelector('.guide');
      if (!g){ g = document.createElement('div'); g.className = 'guide'; box.appendChild(g); }
      g.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="xy">' + xy + '</span>';
    });
  }

  GridCore.boot({
    video: false,
    // Re-measure after the wall lays out — the fit math sets the grid width on this same frame.
    onLayout: guides ? function(gridEl){ requestAnimationFrame(function(){ drawGuides(gridEl); }); } : null
  });
})();
</script>
</body>
</html>
