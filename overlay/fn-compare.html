<!DOCTYPE html>
<!--
  fn-compare.html — head-to-head comparison card (the "COMPARISON / DUO" graphic). Two
  competitors, a stack of stat rows between them, and a wedge that splits the frame.

  Reads state.br.compare. The rows are PRODUCER-DEFINED ({label, a, b}) rather than a fixed
  elims/damage/mats schema, so the same card serves a BR duo comparison, a Creative 1v1 and a
  Ballistic player duel without a code change — the panel just sends different labels.

  The winning side of each row is highlighted automatically when both values parse as numbers,
  and left neutral when they don't (so "Unreal" vs "Champion" doesn't get a bogus winner).

  Query params:
    ?side=light|dark   card treatment (default light, matching the reference card)
    ?nohl=1            never highlight a winning value
    ?preview=1         sample data
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NE Broadcast Suite — Comparison</title>
<link rel="stylesheet" href="/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent:    #12a594;
  --accent-2:  #0f766e;
  --disp:      'Rajdhani', 'Inter', sans-serif;
  --main-font: 'Bourgeois', 'Inter', sans-serif;
  --card:      #f2f4f8;
  --card-2:    #ffffff;
  --ink:       #0d1017;
  --ink-mute:  #5a6273;
  --rule:      rgba(13,16,23,.10);
}
body.dark {
  --card:     #12161e;
  --card-2:   #0b0e14;
  --ink:      #eef2f8;
  --ink-mute: #98a1b3;
  --rule:     rgba(255,255,255,.10);
}
html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
body { font-family: var(--main-font); color: var(--ink); }

#stage { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease; }
#stage.show { opacity: 1; }

/* ── card shell ─────────────────────────────────────────────────────────── */
#card { position: absolute; inset: 60px 90px; border-radius: 6px; overflow: hidden;
  background: var(--card); box-shadow: 0 30px 90px rgba(0,0,0,.55);
  animation: cardIn .5s cubic-bezier(.2,.9,.3,1) both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.985); } to { opacity: 1; } }

/* The two accent wedges behind each competitor. clip-path is what gives the reference card its
   angled split — the photo columns sit on top of these. */
.wedge { position: absolute; top: 0; bottom: 0; width: 40%;
  background: linear-gradient(160deg, var(--accent), var(--accent-2)); }
.wedge.l { left: 0;  clip-path: polygon(0 0, 100% 0, 74% 100%, 0 100%); }
.wedge.r { right: 0; clip-path: polygon(26% 0, 100% 0, 100% 100%, 0 100%); }

/* ── titles ─────────────────────────────────────────────────────────────── */
#top { position: absolute; top: 34px; left: 0; right: 0; text-align: center; z-index: 4; }
#eyebrow { display: flex; align-items: center; justify-content: center; gap: 12px;
  font-size: 13px; font-weight: 800; letter-spacing: .34em; text-transform: uppercase;
  color: var(--ink-mute); }
#eyebrow img { height: 22px; width: auto; object-fit: contain; }
#title { font-family: var(--disp); font-size: 88px; font-weight: 700; letter-spacing: -.01em;
  text-transform: uppercase; line-height: .95; margin-top: 6px; }
#kind { display: inline-block; margin-top: 10px; padding: 5px 20px;
  background: var(--accent); color: #06231f;
  font-size: 14px; font-weight: 800; letter-spacing: .28em; text-transform: uppercase; }

/* ── competitor columns ─────────────────────────────────────────────────── */
.who { position: absolute; top: 0; bottom: 0; width: 34%; z-index: 3;
  display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.who.l { left: 0; }  .who.r { right: 0; }
.who img.photo { max-height: 82%; width: auto; object-fit: contain; object-position: bottom;
  filter: drop-shadow(0 18px 44px rgba(0,0,0,.45));
  animation: photoIn .55s cubic-bezier(.2,.9,.3,1) both; }
.who.l img.photo { animation-name: photoInL; }
.who.r img.photo { animation-name: photoInR; }
@keyframes photoInL { from { opacity: 0; transform: translateX(-38px); } to { opacity: 1; } }
@keyframes photoInR { from { opacity: 0; transform: translateX(38px); } to { opacity: 1; } }
.who .nophoto { width: 190px; height: 190px; margin-bottom: 150px; border-radius: 50%;
  background: rgba(255,255,255,.16); border: 3px solid rgba(255,255,255,.3);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--disp); font-size: 66px; font-weight: 700; color: #fff; }

/* Name plate under each competitor — the holographic bar in the reference. */
.plate { position: absolute; bottom: 46px; z-index: 5; min-width: 420px; max-width: 520px;
  padding: 12px 26px 14px; text-align: center;
  background: linear-gradient(100deg, #e9edf6, #ffffff 40%, #dfe6f3 70%, #cfe3f0);
  box-shadow: 0 14px 34px rgba(0,0,0,.4);
  animation: plateIn .5s .12s cubic-bezier(.2,.9,.3,1) both; }
@keyframes plateIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; } }
.plate.l { left: 60px; }  .plate.r { right: 60px; }
.plate .nm { font-family: var(--disp); font-size: 42px; font-weight: 700; letter-spacing: .01em;
  text-transform: uppercase; line-height: 1; color: #0d1017;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate .sub { font-size: 13px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase;
  color: #5a6273; margin-top: 5px; }

/* ── stat rows ──────────────────────────────────────────────────────────── */
#rows { position: absolute; left: 50%; top: 300px; transform: translateX(-50%);
  width: 640px; z-index: 5; }
.row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 20px; padding: 15px 0; border-top: 1px solid var(--rule);
  animation: rowIn .4s cubic-bezier(.2,.9,.3,1) both; }
.row:last-child { border-bottom: 1px solid var(--rule); }
@keyframes rowIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
.row .v { font-family: var(--disp); font-size: 40px; font-weight: 700; line-height: 1;
  color: var(--ink); transition: color .2s ease; }
.row .v.a { text-align: right; }  .row .v.b { text-align: left; }
.row .v.win { color: var(--accent-2); }
body.dark .row .v.win { color: var(--accent-ink, var(--accent)); }
.row .lbl { font-size: 15px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-mute); white-space: nowrap; text-align: center; min-width: 200px; }

/* ── footnote ───────────────────────────────────────────────────────────── */
#foot { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 5;
  padding: 6px 22px; background: rgba(13,16,23,.08); border: 1px solid var(--rule);
  font-size: 12px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase;
  color: var(--ink-mute); }
body.dark #foot { background: rgba(255,255,255,.06); }
#empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  color: rgba(255,255,255,.34); }
</style>
</head>
<body>
  <div id="stage">
    <div id="card">
      <div class="wedge l"></div>
      <div class="wedge r"></div>

      <div class="who l" id="who-a"></div>
      <div class="who r" id="who-b"></div>

      <div id="top">
        <div id="eyebrow"><img id="eyebrow-logo" src="" alt="" style="display:none;"><span id="eyebrow-text"></span></div>
        <div id="title">Comparison</div>
        <div id="kind" style="display:none;"></div>
      </div>

      <div id="rows"></div>

      <div class="plate l" id="plate-a"><div class="nm">—</div><div class="sub"></div></div>
      <div class="plate r" id="plate-b"><div class="nm">—</div><div class="sub"></div></div>

      <div id="foot" style="display:none;"></div>
    </div>
    <div id="empty">No comparison set</div>
  </div>

<script src="/scene-base.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const NO_HL = Q.get('nohl') === '1';
  if (Q.get('side') === 'dark') document.body.classList.add('dark');
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Only call a winner when BOTH sides are genuinely numeric. "34" vs "24" has a winner;
  // "Unreal" vs "Champion" does not, and inventing one would be worse than showing neither.
  function winnerOf(a, b) {
    if (NO_HL) return 0;
    const na = Number(String(a).replace(/[,\s]/g, ''));
    const nb = Number(String(b).replace(/[,\s]/g, ''));
    if (!isFinite(na) || !isFinite(nb) || String(a).trim() === '' || String(b).trim() === '') return 0;
    if (na === nb) return 0;
    return na > nb ? -1 : 1;
  }

  function fillSide(hostId, plateId, side) {
    const host = el(hostId);
    const initial = (Array.from((side.name || '?').trim())[0] || '?').toUpperCase();   // whole code point, not half an emoji
    host.innerHTML = side.image
      ? '<img class="photo" src="' + esc(side.image) + '" alt="" onerror="this.outerHTML=&quot;<div class=\\&quot;nophoto\\&quot;>' + esc(initial) + '</div>&quot;">'
      : '<div class="nophoto">' + esc(initial) + '</div>';
    const plate = el(plateId);
    plate.querySelector('.nm').textContent = (side.name || '—').toUpperCase();
    const sub = [side.team, side.sub].filter(Boolean).join('  ·  ');
    const subEl = plate.querySelector('.sub');
    subEl.textContent = sub.toUpperCase();
    subEl.style.display = sub ? '' : 'none';
  }

  let _sig = '';
  function render(data) {
    const br = (data && data.br) || {};
    const c = br.compare || {};
    const rows = Array.isArray(c.rows) ? c.rows : [];
    const sig = JSON.stringify([c.title, c.label, c.kind, c.footnote, c.a, c.b, rows, br.event]);
    if (sig === _sig) return;
    _sig = sig;

    const hasAny = !!((c.a && c.a.name) || (c.b && c.b.name) || rows.length);
    el('empty').style.display = hasAny ? 'none' : 'flex';
    el('card').style.display = hasAny ? '' : 'none';
    el('stage').classList.add('show');
    if (!hasAny) return;

    // Brand accent drives the wedges, so the card matches the client's kit automatically.
    const root = document.documentElement;
    root.style.setProperty('--accent', SceneBase.brandColor(data));
    root.style.setProperty('--accent-2', SceneBase.brandAccent(data));

    const logo = SceneBase.brandLogo(data);
    const lg = el('eyebrow-logo');
    if (logo) { lg.src = logo; lg.style.display = ''; } else { lg.style.display = 'none'; }
    el('eyebrow-text').textContent = ((br.event && br.event.title) || '').toUpperCase();
    el('title').textContent = (c.title || 'Comparison').toUpperCase();

    const kind = el('kind');
    const kindText = c.label || c.kind || '';
    kind.textContent = kindText.toUpperCase();
    kind.style.display = kindText ? '' : 'none';

    fillSide('who-a', 'plate-a', c.a || {});
    fillSide('who-b', 'plate-b', c.b || {});

    el('rows').innerHTML = rows.map((r, i) => {
      const w = winnerOf(r.a, r.b);
      return '<div class="row" style="animation-delay:' + (0.14 + i * 0.06) + 's">'
        + '<div class="v a' + (w === -1 ? ' win' : '') + '">' + esc(r.a) + '</div>'
        + '<div class="lbl">' + esc(String(r.label || '').toUpperCase()) + '</div>'
        + '<div class="v b' + (w === 1 ? ' win' : '') + '">' + esc(r.b) + '</div>'
        + '</div>';
    }).join('');

    const foot = el('foot');
    foot.textContent = (c.footnote || '').toUpperCase();
    foot.style.display = c.footnote ? '' : 'none';
  }

  if (location.protocol === 'file:') {
    render({
      br: { event: { title: 'Nameless Fortnite Cup' }, compare: {
        visible: true, title: 'Comparison', label: 'Duo', footnote: 'Stats from Major 1 Final',
        a: { name: 'Falcon Peterbot', team: 'Team Falcons', sub: '', image: '' },
        b: { name: 'Falcon Pollo 10', team: 'Team Falcons', sub: '', image: '' },
        rows: [
          { label: 'Eliminations',   a: '34',    b: '24' },
          { label: 'Damage Dealt',   a: '11153', b: '7507' },
          { label: 'Mats Farmed',    a: '18871', b: '25935' },
          { label: 'Builds Placed',  a: '4447',  b: '3723' },
          { label: 'Solo Clutch Pts', a: '92',   b: '36' }
        ] } }
    });
  } else {
    SceneBase.connect((data) => { render(data); SceneBase.applySceneConfig('fn-compare', data); });
  }
})();
</script>
</body>
</html>
