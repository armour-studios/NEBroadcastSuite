<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NE Broadcast Suite — Overwatch 2 Scoreboard</title>
<style>
:root {
  --text:    #f0f4ff;
  --muted:   rgba(200,215,255,.45);
  --surface2:#161c2e;
  --good:    #4adf88;
  --bad:     #f56565;
  --main-font:'Rajdhani','Barlow Condensed','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;
  font-family:var(--main-font);color:var(--text)}

#ow-board{
  position:absolute;top:0;left:0;right:0;height:0;overflow:visible;
  transition:opacity .4s;
}
#ow-board.hidden{opacity:0;pointer-events:none}

/* ── Team panels — World Cup style. Box sizes are fixed (572x64 panels, 34px centre pill);
   only the dress changed. Outer edge -> inner edge (the right panel mirrors via row-reverse):
   [logo on a team-colour shield] [name + win pips] [BAN chip] [score box] [gold attack/defend tile] */
.ow-panel{
  position:absolute;top:0;
  width:572px;height:64px;
  background:linear-gradient(180deg,#2a2c33 0%,#1b1c21 55%,#141518 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:row;align-items:center;
  padding:0;gap:12px;
  overflow:hidden;
}
.ow-panel.left {left:0;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.ow-panel.right{right:0;flex-direction:row-reverse;clip-path:polygon(0 0,100% 0,100% 100%,16px 100%)}

/* Team colour as a slanted shield block at the OUTER edge; the logo sits on it. */
.ow-accent{position:absolute;top:0;bottom:0;width:74px;z-index:0}
.ow-panel.left  .ow-accent{left:0;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.ow-panel.right .ow-accent{right:0;clip-path:polygon(0 0,100% 0,100% 100%,14px 100%)}
.ow-accent::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,.25))}

/* ── Logo ─────────────────────────────────────────────────────────── */
.ow-logo-wrap{
  position:relative;z-index:1;
  width:44px;height:44px;margin:0 16px 0 12px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.55));
}
.ow-panel.right .ow-logo-wrap{margin:0 12px 0 16px}
.ow-logo-wrap img{width:44px;height:44px;object-fit:contain}
.ow-panel-sep{display:none}

/* ── Team identity column (name + win pips) ───────────────────────── */
.ow-team-col{
  display:flex;flex-direction:column;justify-content:center;
  gap:7px;flex:1;min-width:0;
}
.ow-team-bottom{display:flex;flex-direction:row;align-items:center;gap:5px;justify-content:flex-start;}
.ow-panel.right .ow-team-bottom{justify-content:flex-end;}
.ow-team-record{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.7);text-align:left;}
.ow-panel.right .ow-team-record{text-align:right;}
.ow-team-record.hidden{display:none;}
.ow-team-name{
  font-size:23px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  line-height:1;color:#fff;font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:0;text-align:left;padding-right:4px;
}
.ow-panel.right .ow-team-name{text-align:right;padding:0 0 0 4px}

/* Win pips — slanted bars in the team colour. */
.ow-map-history{display:flex;flex-direction:row;align-items:center;gap:3px;flex-shrink:0}
.ow-panel.right .ow-map-history{flex-direction:row-reverse}
.ow-map-dot{
  width:16px;height:5px;transform:skewX(-20deg);
  background:rgba(255,255,255,.16);
  transition:background .3s;
}
.ow-map-dot.win{background:var(--team-color,#4dc4ff);box-shadow:0 0 6px var(--team-color,#4dc4ff)}

/* ── Hero bans — full-height portrait(s) butted straight onto the score box (the negative margin
   cancels the panel's flex gap), each with a solid red BAN bar across the bottom: readable at
   stream size, and a lone portrait can't be mistaken for "their hero". */
.ow-bans-col{
  display:none;flex-direction:row;align-items:stretch;
  align-self:stretch;flex-shrink:0;
  margin-right:-12px;
}
.ow-bans-col.has-bans{display:flex}
.ow-panel.right .ow-bans-col{flex-direction:row-reverse;margin-right:0;margin-left:-12px}
.ow-bans-tag{display:none}
.ow-bans-tiles{display:flex;flex-direction:row;gap:2px}
.ow-panel.right .ow-bans-tiles{flex-direction:row-reverse}
.ow-ban-portrait{
  width:62px;height:64px;
  background:#2a2c33;
  overflow:hidden;position:relative;flex-shrink:0;
}
.ow-ban-img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;
  filter:grayscale(.45) brightness(.9)}
.ow-ban-role-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
/* Diagonal strike through the face, above the image, under the label. */
.ow-ban-portrait::after{
  content:'';position:absolute;left:-10px;right:-10px;top:42%;height:3px;margin-top:-1.5px;z-index:1;
  background:#e2323c;transform:rotate(-40deg);box-shadow:0 0 5px rgba(0,0,0,.5);
}
.ow-ban-portrait::before{
  content:'BAN';position:absolute;left:0;right:0;bottom:0;height:17px;z-index:2;
  display:flex;align-items:center;justify-content:center;
  background:#d9262f;color:#fff;
  font-size:12px;font-weight:900;letter-spacing:.2em;line-height:1;padding-left:.2em;
  box-shadow:0 -1px 0 rgba(0,0,0,.35);
}

/* ── Score — its own dark box ──────────────────────────────────────── */
.ow-score{
  align-self:stretch;display:flex;align-items:center;justify-content:center;
  width:64px;flex-shrink:0;
  font-size:40px;font-weight:900;font-style:italic;line-height:1;letter-spacing:-1px;color:#fff;
  background:linear-gradient(180deg,#121317,#0a0b0d);
  box-shadow:inset 1px 0 0 rgba(255,255,255,.06), inset -1px 0 0 rgba(255,255,255,.06);
}
/* No attack/defend tile: the score box runs to the slanted inner edge. */
.ow-panel.left.no-role  .ow-score{width:80px;padding-right:16px}
.ow-panel.right.no-role .ow-score{width:80px;padding-left:16px}

/* ── Attack / defend — gold tile at the inner edge ─────────────────── */
.ow-role-icon{
  flex-shrink:0;display:none;align-items:center;justify-content:center;
  width:50px;height:50px;margin:0 22px 0 0;border-radius:3px;
  color:#1b1406;background:linear-gradient(180deg,#e2c06b,#b18a37);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 8px rgba(0,0,0,.4);
}
.ow-panel.right .ow-role-icon{margin:0 0 0 22px}
.ow-role-icon.visible{display:flex}
.ow-role-icon svg{width:26px;height:26px}

/* ── Center pill — two-layer rotating ─────────────────────────────── */
#ow-center-group{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  display:grid;
  background:linear-gradient(180deg,#2a2c33 0%,#1b1c21 60%,#141518 100%);
  box-shadow:inset 0 -2px 0 rgba(255,255,255,.85);
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,14px 100%);
  height:34px;overflow:hidden;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.65));
  transition:left .5s cubic-bezier(.4,0,.2,1);
}
#ow-center-default,#ow-center-history{
  grid-row:1;grid-column:1;
  display:flex;align-items:center;justify-content:center;
  padding:0 32px;gap:0;white-space:nowrap;
  transition:opacity .4s cubic-bezier(.4,0,.2,1),transform .4s cubic-bezier(.4,0,.2,1);
}
#ow-center-history{opacity:0;transform:translateY(110%);gap:6px;}
#ow-center-group.show-history #ow-center-default{opacity:0;transform:translateY(-110%);}
#ow-center-group.show-history #ow-center-history{opacity:1;transform:translateY(0);}

#ow-map-box{display:flex;align-items:center;gap:7px;}
.ow-map-label{
  font-size:18px;font-weight:900;font-style:italic;text-transform:uppercase;
  letter-spacing:1px;color:#fff;line-height:1;
}
.ow-map-of{
  font-size:18px;font-weight:900;font-style:italic;text-transform:uppercase;
  letter-spacing:.5px;color:#fff;line-height:1;
}
.ow-map-ft{
  font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:#fff;line-height:1;
  padding-left:9px;margin-left:2px;border-left:1px solid rgba(255,255,255,.22);
}

/* ── Sponsor section ───────────────────────────────────────────────── */
#ow-sponsor-box{
  display:none;align-items:center;gap:10px;
  padding-left:14px;margin-left:14px;
  border-left:1px solid rgba(255,255,255,.18);
  height:20px;
}
#ow-sponsor-box.visible{display:flex}
.ow-sp-label{
  font-size:9px;font-weight:800;text-transform:uppercase;
  letter-spacing:1.5px;color:#fff;opacity:.75;
}
.ow-sp-sep{display:none}
.ow-sp-logo{max-height:20px;max-width:80px;object-fit:contain}

/* ── Map history pill cards ────────────────────────────────────────── */
.ow-hist-cards{display:flex;flex-direction:row;align-items:center;gap:7px;}
.ow-hist-card{display:flex;flex-direction:row;align-items:center;gap:4px;flex-shrink:0}
.ow-hist-logo{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.ow-hist-label{font-size:10px;font-weight:900;letter-spacing:.5px;flex-shrink:0}
.ow-hist-label.win {color:#4adf88}
.ow-hist-label.loss{color:#f56565}
.ow-hist-label.pick{color:rgba(77,196,255,.9)}
.ow-hist-label.dcr {color:rgba(255,220,80,.9)}
.ow-hist-current-dot{
  width:9px;height:9px;border-radius:50%;
  background:transparent;border:1.5px solid rgba(77,196,255,.8);
  animation:pulse-ring 1.8s ease-in-out infinite;
}
@keyframes pulse-ring{
  0%,100%{box-shadow:0 0 0 0 rgba(77,196,255,.4)}
  50%     {box-shadow:0 0 0 3px rgba(77,196,255,.1)}
}
.ow-hist-future-num{font-size:11px;font-weight:600;color:rgba(255,255,255,.22)}
.ow-hist-divider{width:1px;height:16px;background:rgba(255,255,255,.1);flex-shrink:0}
.ow-mode-icon{
  width:20px;height:20px;border-radius:2px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:rgba(255,255,255,.08);
}
.ow-mode-icon img{width:14px;height:14px;object-fit:contain}
/* ── Live heroes (Overwolf GEP): one icon per player, red ring = currently on a banned hero ── */
.ow-live { position: absolute; top: 72px; display: flex; gap: 6px; align-items: center; }
#ow-live-a { left: 14px; }
#ow-live-b { right: 14px; }
.ow-live img { width: 34px; height: 34px; border-radius: 7px; object-fit: cover;
  background: #10131a; border: 1px solid rgba(255,255,255,.28);
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
.ow-live img.is-banned { border-color: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,.65); }
#ow-live-b { flex-direction: row-reverse; }
</style>
</head>
<body>
<div id="ow-board" class="hidden">

  <!-- LEFT: [logo] [team-col: name + pips] [ban chip] [score] [attack/defend tile] -->
  <div class="ow-panel left" id="ow-panel-a">
    <div class="ow-accent" id="ow-accent-a"></div>
    <div class="ow-logo-wrap"><img id="ow-logo-a" src="" alt="" onerror="this.src='/assets/games/overwatch2.png'"></div>
    <div class="ow-team-col">
      <div class="ow-team-name" id="ow-name-a">TEAM A</div>
      <div class="ow-team-bottom">
        <div class="ow-map-history" id="ow-history-a"></div>
      </div>
      <div class="ow-team-record hidden" id="ow-record-a"></div>
    </div>
    <div class="ow-bans-col" id="ow-bans-col-a">
      <div class="ow-bans-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg><span id="ow-bans-tag-a">Ban</span></div>
      <div class="ow-bans-tiles">
        <div class="ow-ban-portrait" id="ow-ban-portrait-a0" style="display:none">
          <img class="ow-ban-img" id="ow-ban-img-a0" alt="" style="display:none"
               onerror="this.style.display='none';owShowIcon('ow-ban-icon-a0')">
          <span class="ow-ban-role-icon" id="ow-ban-icon-a0"></span>
        </div>
        <div class="ow-ban-portrait" id="ow-ban-portrait-a1" style="display:none">
          <img class="ow-ban-img" id="ow-ban-img-a1" alt="" style="display:none"
               onerror="this.style.display='none';owShowIcon('ow-ban-icon-a1')">
          <span class="ow-ban-role-icon" id="ow-ban-icon-a1"></span>
        </div>
      </div>
    </div>
    <div class="ow-score" id="ow-score-a">0</div>
    <div class="ow-role-icon" id="ow-role-a"></div>
  </div>

  <!-- CENTER pill — game counter; rotates with the map history once a map has been played -->
  <div id="ow-center-group">
    <div id="ow-center-default">
      <div id="ow-map-box">
        <span class="ow-map-label">Map</span>
        <span class="ow-map-of" id="ow-map-of">1</span>
        <span class="ow-map-ft" id="ow-map-ft">FT3</span>
      </div>
      <div id="ow-sponsor-box">
        <span class="ow-sp-label">Presented By</span>
      </div>
    </div>
    <div id="ow-center-history">
      <div class="ow-hist-cards" id="ow-hist-cards"></div>
    </div>
  </div>

  <!-- RIGHT (row-reverse, mirrors the left): [logo] [team-col] [ban chip] [score] [attack/defend tile] -->
  <div class="ow-panel right" id="ow-panel-b">
    <div class="ow-accent" id="ow-accent-b"></div>
    <div class="ow-logo-wrap"><img id="ow-logo-b" src="" alt="" onerror="this.src='/assets/games/overwatch2.png'"></div>
    <div class="ow-team-col">
      <div class="ow-team-name" id="ow-name-b">TEAM B</div>
      <div class="ow-team-bottom">
        <div class="ow-map-history" id="ow-history-b"></div>
      </div>
      <div class="ow-team-record hidden" id="ow-record-b"></div>
    </div>
    <div class="ow-bans-col" id="ow-bans-col-b">
      <div class="ow-bans-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg><span id="ow-bans-tag-b">Ban</span></div>
      <div class="ow-bans-tiles">
        <div class="ow-ban-portrait" id="ow-ban-portrait-b0" style="display:none">
          <img class="ow-ban-img" id="ow-ban-img-b0" alt="" style="display:none"
               onerror="this.style.display='none';owShowIcon('ow-ban-icon-b0')">
          <span class="ow-ban-role-icon" id="ow-ban-icon-b0"></span>
        </div>
        <div class="ow-ban-portrait" id="ow-ban-portrait-b1" style="display:none">
          <img class="ow-ban-img" id="ow-ban-img-b1" alt="" style="display:none"
               onerror="this.style.display='none';owShowIcon('ow-ban-icon-b1')">
          <span class="ow-ban-role-icon" id="ow-ban-icon-b1"></span>
        </div>
      </div>
    </div>
    <div class="ow-score" id="ow-score-b">0</div>
    <div class="ow-role-icon" id="ow-role-b"></div>
  </div>

</div>
<script src="scene-base.js"></script>
<script>
const HERO_ROLES = {
  dva:'tank',domina:'tank',doomfist:'tank','junker-queen':'tank',mauga:'tank',hazard:'tank',
  orisa:'tank',ramattra:'tank',reinhardt:'tank',roadhog:'tank',
  sigma:'tank',winston:'tank','wrecking-ball':'tank',zarya:'tank',
  anran:'damage',ashe:'damage',bastion:'damage',emre:'damage',shion:'damage',sierra:'damage',vendetta:'damage',cassidy:'damage',echo:'damage',freja:'damage',
  genji:'damage',hanzo:'damage',junkrat:'damage',mei:'damage',
  pharah:'damage',reaper:'damage',sojourn:'damage','soldier-76':'damage',
  sombra:'damage',symmetra:'damage',torbjorn:'damage',tracer:'damage',
  venture:'damage',widowmaker:'damage',
  ana:'support',baptiste:'support','jetpack-cat':'support',mizuki:'support',wuyang:'support',brigitte:'support',illari:'support',
  juno:'support',kiriko:'support',lifeweaver:'support',lucio:'support',
  mercy:'support',moira:'support',zenyatta:'support'
};
// Latest state — lets the hero helpers resolve heroes / role icons added via Custom content.
let owData = null;
const customHero = (n) => SceneBase.customCharacter(owData, 'overwatch', n);
const roleIconHtml = (role) => { const src = role && SceneBase.roleIcon('overwatch', role, owData); return src ? '<img src="' + src + '" width="16" height="16" alt="">' : ''; };

function heroSlug(n){
  return(n||'').toLowerCase().replace(/ö/g,'o').replace(/ú/g,'u').replace(/[.']/g,'').replace(/:\s*/g,'-').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
}
function heroRole(n){ const c=customHero(n); return (c&&c.role&&c.role.toLowerCase())||HERO_ROLES[heroSlug(n)]||null; }
function heroImgUrl(n){ const c=customHero(n); if(c&&c.image) return c.image; const s=heroSlug(n); return s?`/assets/overwatch/heroes/${s}.png`:''; }
function owShowIcon(id){ const e=document.getElementById(id); if(e) e.style.opacity='.55'; }

function applyBan(pId,imgId,iconId,name){
  const p=document.getElementById(pId), img=document.getElementById(imgId), icon=document.getElementById(iconId);
  if(!p) return;
  if(!name){
    p.style.display='none';
    // removeAttribute, not src='' — an empty src resolves to the document URL and fires
    // a bogus error event (which is what used to throw before owShowIcon was defined).
    if(img){img.removeAttribute('src');img.style.display='none';}
    if(icon){icon.innerHTML='';icon.style.opacity='';}
    return;
  }
  p.style.display='';
  const role=heroRole(name);
  const url=heroImgUrl(name);
  if(icon){icon.innerHTML=roleIconHtml(role);icon.style.opacity='0';}
  if(url&&img){
    img.style.display='block';
    img.onerror=function(){this.style.display='none';owShowIcon(iconId);};
    img.src=url;
  } else {
    if(img){img.style.display='none';}
    if(icon){icon.style.opacity='.55';}
  }
}

// Reads bans straight off the LIVE state.draft when it's the active Overwatch draft (always
// current — nothing to fall out of sync), falling back to the older per-map owMatch.bansByMap
// tracker only when no draft is running (e.g. bans entered via the old hero-ban-manager panel).
function getBanNames(state,idx,side){
  const draft=state.draft;
  if(draft && draft.game==='overwatch' && Array.isArray(draft.ops)){
    const bans=draft.ops.filter(function(o){ return o.by===side && o.action==='ban'; });
    return [bans[0]&&bans[0].name||'', bans[1]&&bans[1].name||''];
  }
  const bansByMap=Array.isArray(state.owMatch&&state.owMatch.bansByMap)?state.owMatch.bansByMap:[];
  const entry=(Array.isArray(bansByMap)?bansByMap[idx]:null)||{};
  const v=entry[side];
  if(Array.isArray(v)) return [v[0]&&v[0].hero||'', v[1]&&v[1].hero||''];
  if(v&&v.hero) return [v.hero, ''];
  return ['',''];
}

function applyTeamBans(team, state, idx){
  const names=getBanNames(state,idx,team);
  applyBan('ow-ban-portrait-'+team+'0','ow-ban-img-'+team+'0','ow-ban-icon-'+team+'0',names[0]);
  applyBan('ow-ban-portrait-'+team+'1','ow-ban-img-'+team+'1','ow-ban-icon-'+team+'1',names[1]);
}

function buildHistory(id, wins, target) {
  const w = document.getElementById(id); if (!w) return;
  w.innerHTML = '';
  for (let i = 0; i < target; i++) {
    const d = document.createElement('div');
    d.className = 'ow-map-dot' + (i < wins ? ' win' : '');
    w.appendChild(d);
  }
}

function renderSponsors(brand){
  const box=document.getElementById('ow-sponsor-box'); if(!box) return;
  const sponsors=(brand&&brand.railSponsors)||(brand&&brand.sponsors)||[];
  const logos=sponsors.filter(s=>s&&s.logo);
  box.innerHTML='';
  if(!logos.length){ box.classList.remove('visible'); return; }
  box.classList.add('visible');
  const lbl=document.createElement('div'); lbl.className='ow-sp-label';
  lbl.textContent='Presented by'; box.appendChild(lbl);
  logos.slice(0,3).forEach(s=>{
    const sep=document.createElement('div'); sep.className='ow-sp-sep'; box.appendChild(sep);
    const img=document.createElement('img'); img.className='ow-sp-logo';
    img.src=s.logo; img.alt=s.name||'';
    img.onerror=function(){this.previousSibling&&this.previousSibling.remove();this.remove();};
    box.appendChild(img);
  });
}

const MAP_MODES = {
  'dorado':'escort','havana':'escort','junkertown':'escort','rialto':'escort',
  'route 66':'escort','shambali monastery':'escort','watchpoint: gibraltar':'escort',
  'watchpoint: grimsvotn':'escort','watchpoint: grimsvötn':'escort',   // the game may report it with the ö
  'blizzard world':'hybrid','eichenwalde':'hybrid','hollywood':'hybrid',
  "king's row":'hybrid','midtown':'hybrid','numbani':'hybrid','paraíso':'hybrid',
  'antarctic peninsula':'control','busan':'control','ilios':'control',
  'lijiang tower':'control','nepal':'control','oasis':'control','samoa':'control',
  'colosseo':'push','esperança':'push','new queen street':'push','runasapi':'push',
  'new junk city':'flashpoint','suravasa':'flashpoint',
  'hanaoka':'clash','throne of anubis':'clash'
};
function getMapMode(mapName){
  return MAP_MODES[(mapName||'').toLowerCase().trim()]||null;
}
const MODE_IMG={
  escort:'/assets/overwatch/modes/Escort.webp',
  hybrid:'/assets/overwatch/modes/Hybrid.webp',
  control:'/assets/overwatch/modes/Control.webp',
  push:'/assets/overwatch/modes/Push.webp',
  flashpoint:'/assets/overwatch/modes/Flashpoint.webp',
  clash:'/assets/overwatch/modes/Clash.webp'
};

function buildHistoryBar(containerId,hist,tA,tB,fallbackMode,showLabels){
  const w=document.getElementById(containerId); if(!w) return;
  w.innerHTML='';
  hist.forEach(function(m,i){
    if(i>0){ const sep=document.createElement('div'); sep.className='ow-hist-divider'; w.appendChild(sep); }
    const card=document.createElement('div'); card.className='ow-hist-card';

    const mode=m.mode||getMapMode(m.name)||(m.current?fallbackMode:null)||'unknown';
    const icon=document.createElement('div'); icon.className='ow-mode-icon';
    const imgSrc=MODE_IMG[mode];
    if(imgSrc){const mi=document.createElement('img');mi.src=imgSrc;mi.alt=mode;icon.appendChild(mi);}
    card.appendChild(icon);

    const OW_FB='/assets/games/overwatch2.png';
    if(m.winner){
      const winTeam=m.winner==='a'?tA:tB;
      if(winTeam){
        const img=document.createElement('img'); img.className='ow-hist-logo';
        img.src=winTeam.logo||OW_FB; img.alt='';
        img.onerror=function(){this.src=OW_FB;};
        card.appendChild(img);
      }
      if(showLabels){
        const lbl=document.createElement('span'); lbl.className='ow-hist-label win'; lbl.textContent='WIN'; card.appendChild(lbl);
      }
    } else if(m.current){
      const dot=document.createElement('div'); dot.className='ow-hist-current-dot'; card.appendChild(dot);
    } else if(m.by){
      const pickTeam=m.by==='a'?tA:tB;
      if(pickTeam&&pickTeam.logo){
        const img=document.createElement('img'); img.className='ow-hist-logo';
        img.src=pickTeam.logo; img.alt='';
        img.onerror=function(){this.style.display='none';};
        card.appendChild(img);
      }
      if(showLabels){
        const isDecider=m.action==='decider';
        const lbl=document.createElement('span');
        lbl.className='ow-hist-label '+(isDecider?'dcr':'pick');
        lbl.textContent=isDecider?'DCR':'PICK';
        card.appendChild(lbl);
      }
    } else {
      const num=document.createElement('span'); num.className='ow-hist-future-num'; num.textContent=i+1; card.appendChild(num);
    }
    w.appendChild(card);
  });
}

const PREVIEW=new URLSearchParams(location.search).get('preview')==='1';
let _owHasHistory=false;   // set by render(); gates the centre-pill rotation below

function render(state){
  const ow=state.owMatch||{}, veto=state.veto||{}, teams=state.teams||{}, brand=state.brand||{};
  const board=document.getElementById('ow-board'); if(!board) return;
  board.classList.remove('hidden');

  const tA=teams.blue||{}, tB=teams.orange||{};
  setText('ow-name-a',(tA.name||'TEAM A').toUpperCase());
  setText('ow-name-b',(tB.name||'TEAM B').toUpperCase());
  const tr=state.teamRecords||{}, trOn=!!tr.enabled;
  const recA=document.getElementById('ow-record-a'), recB=document.getElementById('ow-record-b');
  if(recA){ const show=trOn&&tr.blue; recA.textContent=show?tr.blue:''; recA.classList.toggle('hidden',!show); }
  if(recB){ const show=trOn&&tr.orange; recB.textContent=show?tr.orange:''; recB.classList.toggle('hidden',!show); }
  const OW_FALLBACK='/assets/games/overwatch2.png';
  setSrc('ow-logo-a',tA.logo||OW_FALLBACK); setSrc('ow-logo-b',tB.logo||OW_FALLBACK);
  setStyle('ow-accent-a','background',tA.color||'#4dc4ff');
  setStyle('ow-accent-b','background',tB.color||'#ff6b35');
  const pA=document.getElementById('ow-panel-a'), pB=document.getElementById('ow-panel-b');
  if(pA) pA.style.setProperty('--team-color',tA.color||'#4dc4ff');
  if(pB) pB.style.setProperty('--team-color',tB.color||'#ff6b35');

  const vetoMaps=Array.isArray(veto.maps)?veto.maps:[];
  const bestOf=state.bestOf||5;
  const total=Math.ceil(bestOf/2)*2-1;
  const gameNum=((state.game&&state.game.number)||1);
  const curIdx=Math.max(0,gameNum-1);

  const series=state.series||{};
  setText('ow-score-a',String(series.blue||0));
  setText('ow-score-b',String(series.orange||0));

  const displayGame=Math.min(Math.max(1,gameNum),bestOf);
  setText('ow-map-of',String(displayGame));
  // FT3 = first to N map wins; BO5 = best of N maps (producer's pick on the scorecard).
  setText('ow-map-ft',ow.seriesLabel==='bo' ? 'BO'+bestOf : 'FT'+Math.ceil(bestOf/2));

  renderSponsors(brand);

  const mapWinners=Array.isArray(ow.mapWinners)?ow.mapWinners:[];
  const mapModes  =Array.isArray(ow.mapModes)  ?ow.mapModes  :[];
  const hist=[];
  for(let i=0;i<total;i++){
    const m=vetoMaps[i]||{};
    const winner=mapWinners[i]||m.winner||null;
    hist.push({
      name:m.name||'',mode:mapModes[i]||m.mode||null,
      winner:winner,by:m.by||null,action:m.action||'',
      current:!winner&&i===curIdx
    });
  }
  const winsNeeded=Math.ceil(bestOf/2);
  buildHistory('ow-history-a',series.blue||0,winsNeeded);
  buildHistory('ow-history-b',series.orange||0,winsNeeded);
  buildHistoryBar('ow-hist-cards',hist,tA,tB,ow.gameMode||'escort',ow.showMapLabels!==false);

  // Bans — per the CURRENT map (mirrors _owCurMapIdx in the control panel: game.number-1),
  // not always map 1 — otherwise a later game keeps showing game 1's bans forever. Prefers the
  // live Draft panel (state.draft) when that's what's actually running — see getBanNames().
  applyTeamBans('a',state,curIdx);
  applyTeamBans('b',state,curIdx);
  const namesA=getBanNames(state,curIdx,'a'), namesB=getBanNames(state,curIdx,'b');
  const hasBans=!!(namesA[0]||namesA[1]||namesB[0]||namesB[1]);
  const bColA=document.getElementById('ow-bans-col-a');
  const bColB=document.getElementById('ow-bans-col-b');
  // Each side shows its block only when IT has a ban (one-ban formats, or mid-draft before the
  // other team has locked theirs) and the tag is singular/plural to match.
  const sideHas=function(n){ return !!(n[0]||n[1]); };
  if(bColA) bColA.classList.toggle('has-bans',hasBans&&sideHas(namesA));
  if(bColB) bColB.classList.toggle('has-bans',hasBans&&sideHas(namesB));
  setText('ow-bans-tag-a',(namesA[0]&&namesA[1])?'Bans':'Ban');
  setText('ow-bans-tag-b',(namesB[0]&&namesB[1])?'Bans':'Ban');

  // The centre pill only rotates to the map-history strip once there IS history — a decided map,
  // or the series being past game 1. On game 1 the strip is a row of empty placeholders, so the
  // pill just holds on "GAME 1 OF 5".
  _owHasHistory=hist.some(function(m){ return !!m.winner; })||gameNum>1;
  if(!_owHasHistory){ const g=document.getElementById('ow-center-group'); if(g) g.classList.remove('show-history'); }

  // Attack / Defense role icons
  const atk = ow.showAttack ? (ow.attackSide || null) : null;
  applyRole('ow-role-a', atk==='a' ? 'attack' : atk==='b' ? 'defense' : null);
  applyRole('ow-role-b', atk==='b' ? 'attack' : atk==='a' ? 'defense' : null);
}

// Crossed daggers (attack)
const ROLE_ATTACK_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="21" x2="21" y2="3"/><line x1="3" y1="15" x2="9" y2="21"/><line x1="21" y1="9" x2="15" y2="3"/><line x1="21" y1="21" x2="3" y2="3"/><line x1="15" y1="21" x2="21" y2="15"/><line x1="3" y1="9" x2="9" y2="3"/></svg>';
// Shield (defense)
const ROLE_DEFENSE_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L4 5v6c0 5 3.6 9.7 8 11 4.4-1.3 8-6 8-11V5z"/><line x1="12" y1="7" x2="12" y2="17"/></svg>';

function applyRole(id, role){
  const el=document.getElementById(id); if(!el) return;
  el.classList.remove('visible');
  const panel=el.closest('.ow-panel'); if(panel) panel.classList.toggle('no-role',!role);
  if(!role){ el.innerHTML=''; return; }
  el.innerHTML = role==='attack' ? ROLE_ATTACK_SVG : ROLE_DEFENSE_SVG;
  el.classList.add('visible');
}

function setText(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
function setSrc(id,v) {const e=document.getElementById(id);if(e)e.src=v;}
function setStyle(id,p,v){const e=document.getElementById(id);if(e)e.style[p]=v;}

// ── Live heroes from the Overwolf GEP relay (/api/ow-gep) ──
// Orients the two GEP teams onto the broadcast sides by matching player names against
// each team's saved roster; falls back to first-seen team order when nothing matches.
function renderLiveHeroes(data){
  var gep = data.owMatch && data.owMatch.gepData;
  var fresh = gep && gep.gepConnected && Array.isArray(gep.roster) && gep.roster.length && (Date.now() - (gep.lastSeen || 0)) < 60000;
  var idx = (data.owMatch && data.owMatch.currentMapIdx) || 0;
  var bans = {};
  try {
    [].concat(getBanNames(data, idx, 'a'), getBanNames(data, idx, 'b')).forEach(function(n){ if (n) bans[String(n).toLowerCase()] = 1; });
  } catch (e) {}
  var rosterOf = function(side){
    var t = (data.teams || {})[side === 'a' ? 'blue' : 'orange'] || {};
    return (t.players || []).map(function(p){ return String(p.gamerTag || p.name || '').toLowerCase().split('#')[0]; }).filter(Boolean);
  };
  var known = { a: rosterOf('a'), b: rosterOf('b') };
  var teamVals = [];
  (fresh ? gep.roster : []).forEach(function(p){ var tv = String(p.team); if (teamVals.indexOf(tv) < 0) teamVals.push(tv); });
  var map = {}; // gep team value -> 'a' | 'b'
  if (teamVals.length) {
    var votes = { };
    teamVals.forEach(function(tv){ votes[tv] = { a: 0, b: 0 }; });
    gep.roster.forEach(function(p){
      var nm = String(p.player_name || p.name || '').toLowerCase().split('#')[0];
      if (!nm) return;
      var tv = String(p.team);
      ['a', 'b'].forEach(function(side){
        if (known[side].some(function(x){ return x === nm || x.indexOf(nm) > -1 || nm.indexOf(x) > -1; })) votes[tv][side]++;
      });
    });
    var first = teamVals[0], second = teamVals[1];
    var firstIsB = votes[first] && votes[first].b > votes[first].a;
    map[first] = firstIsB ? 'b' : 'a';
    if (second !== undefined) map[second] = firstIsB ? 'a' : 'b';
  }
  ['a', 'b'].forEach(function(side){
    var panel = document.getElementById('ow-panel-' + side);
    var host = document.getElementById('ow-live-' + side);
    // On the BOARD, not the panel: the panel clips its overflow, which hid this strip entirely.
    var boardEl = document.getElementById('ow-board');
    if (!host && boardEl) { host = document.createElement('div'); host.className = 'ow-live'; host.id = 'ow-live-' + side; boardEl.appendChild(host); }
    if (!host) return;
    if (!fresh) { host.innerHTML = ''; host.style.display = 'none'; return; }
    var players = gep.roster.filter(function(p){ return map[String(p.team)] === side; }).slice(0, 6);
    host.style.display = players.length ? 'flex' : 'none';
    host.innerHTML = players.map(function(p){
      var hero = p.hero_name || '';
      var url = hero ? heroImgUrl(hero) : '';
      if (!url) return '';
      var banned = bans[hero.toLowerCase()] ? ' is-banned' : '';
      var title = (p.player_name || '') + (hero ? ' — ' + hero : '') + (banned ? ' (BANNED HERO)' : '');
      return '<img class="' + banned.trim() + '" src="' + url + '" alt="" title="' + title.replace(/"/g, '&quot;') + '" onerror="this.remove()">';
    }).join('');
  });
}
SceneBase.connect(function(data){ owData = data; render(data); try { renderLiveHeroes(data); } catch (e) {} });

// Rotate center pill between game counter and map history every 5 seconds — only once the
// series has history to show (see _owHasHistory in render()).
(function(){
  let _timer=null;
  function start(){
    if(_timer) return;
    _timer=setInterval(function(){
      const g=document.getElementById('ow-center-group');
      if(!g) return;
      if(_owHasHistory) g.classList.toggle('show-history');
      else g.classList.remove('show-history');
    },5000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
