<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chat Highlight</title>
<style>
  /* Viewport-relative, NOT a fixed 1920 canvas: a browser source narrower than 1920 used to
     clip the card mid-sentence instead of letting the message wrap. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  :root {
    --c1: #7c3aed; --c2: #22d3ee;
    /* Plate ink — recomputed per brand kit so a light kit doesn't put white on white. */
    --ink: #fff; --ink-dim: rgba(255,255,255,.82);
    --ink-rule: rgba(255,255,255,.35); --ink-shadow: rgba(0,0,0,.35);
  }
  #wrap {
    position: absolute; left: 84px; bottom: 92px;
    max-width: min(980px, calc(100vw - 140px)); min-width: 420px;
    font-family: var(--scene-font, 'Rajdhani'), 'Segoe UI', sans-serif;
    opacity: 0; pointer-events: none;
  }
  #wrap.show { opacity: 1; }

  /* Kicker + name ride one skewed brand plate above the message card */
  .plate {
    display: inline-flex; align-items: center; gap: 14px;
    transform: skewX(-10deg) translateX(-60px);
    background-image: linear-gradient(100deg, var(--c1) 0%, var(--c2) 130%);
    border-radius: 6px 6px 0 6px;
    padding: 7px 26px 7px 20px;
    margin-left: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45);
    opacity: 0;
    transition: transform .38s cubic-bezier(.18,.9,.24,1.12), opacity .3s ease;
  }
  #wrap.show .plate { transform: skewX(-10deg) translateX(0); opacity: 1; }
  /* Split kit (one light end, one dark end): no single ink works, so darken the whole
     plate and keep white text. */
  .plate.dim {
    background-image:
      linear-gradient(rgba(0,0,0,.46), rgba(0,0,0,.52)),
      linear-gradient(100deg, var(--c1) 0%, var(--c2) 130%);
  }
  .plate > * { transform: skewX(10deg); }
  .kicker {
    font-size: 15px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink-dim);
    border-right: 2px solid var(--ink-rule);
    padding-right: 14px;
  }
  .user {
    font-size: 27px; font-weight: 800; letter-spacing: .02em; color: var(--ink);
    text-shadow: 0 2px 8px var(--ink-shadow);
    white-space: nowrap; max-width: min(560px, 46vw); overflow: hidden; text-overflow: ellipsis;
  }

  .card {
    position: relative;
    background: linear-gradient(180deg, rgba(16,17,26,.96), rgba(11,12,18,.96));
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 0 10px 10px 10px;
    box-shadow: 0 18px 48px rgba(0,0,0,.55);
    padding: 18px 30px 20px 26px;
    overflow: hidden;
    transform: translateY(24px); opacity: 0;
    transition: transform .42s cubic-bezier(.2,.9,.3,1.1) .07s, opacity .34s ease .07s;
  }
  #wrap.show .card { transform: translateY(0); opacity: 1; }
  /* brand edge + soft glow inside the card */
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(180deg, var(--c1), var(--c2));
  }
  .card::after {
    content: ''; position: absolute; left: -40px; top: -70px; width: 260px; height: 200px;
    background: radial-gradient(closest-side, var(--c1), transparent 72%);
    opacity: .16; pointer-events: none;
  }
  .text {
    position: relative;
    font-size: 30px; font-weight: 600; color: #f3f5fa; line-height: 1.3;
    /* `anywhere` so an unbroken link/emote spam string wraps instead of running under the
       card's overflow:hidden edge. */
    word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .text.long { font-size: 24px; }
  .text.verylong { font-size: 20px; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="plate">
      <span class="kicker" id="kicker">LIVE CHAT</span>
      <span class="user" id="user"></span>
    </div>
    <div class="card">
      <div class="text" id="text"></div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    (function () {
      var wrap = document.getElementById('wrap');
      var elUser = document.getElementById('user');
      var elText = document.getElementById('text');
      var elKicker = document.getElementById('kicker');
      var plate = wrap.querySelector('.plate');
      var lastTs = -1;

      // --- Plate legibility ------------------------------------------------------------
      // The plate is a c1->c2 gradient, so a single ink has to work at BOTH ends. Sample
      // the two ends plus the midpoint; if they all want the same ink, use it. If they
      // disagree (light kit fading into a dark one) no ink is safe, so dim the plate and
      // stay white.
      function rgb(c) {
        var s = String(c || '').trim(), m = s.match(/^#([0-9a-f]{3})$/i);
        if (m) return [parseInt(m[1][0] + m[1][0], 16), parseInt(m[1][1] + m[1][1], 16), parseInt(m[1][2] + m[1][2], 16)];
        if ((m = s.match(/^#([0-9a-f]{6})$/i))) return [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)];
        if ((m = s.match(/^rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/i))) return [+m[1], +m[2], +m[3]];
        return null;
      }
      function mix(a, b, t) {
        var x = rgb(a), y = rgb(b);
        if (!x || !y) return a;
        return 'rgb(' + Math.round(x[0] + (y[0] - x[0]) * t) + ',' +
                        Math.round(x[1] + (y[1] - x[1]) * t) + ',' +
                        Math.round(x[2] + (y[2] - x[2]) * t) + ')';
      }
      function applyInk(c1, c2) {
        var DARK = '#0a0c14';
        var inks = [c1, mix(c1, c2, .5), c2].map(function (c) { return SceneBase.onColor(c, DARK, '#ffffff'); });
        var split = inks.some(function (i) { return i !== inks[0]; });
        var dark = !split && inks[0] === DARK;
        plate.classList.toggle('dim', split);
        var s = document.documentElement.style;
        s.setProperty('--ink', dark ? DARK : '#fff');
        s.setProperty('--ink-dim', dark ? 'rgba(10,12,20,.72)' : 'rgba(255,255,255,.82)');
        s.setProperty('--ink-rule', dark ? 'rgba(10,12,20,.30)' : 'rgba(255,255,255,.35)');
        s.setProperty('--ink-shadow', dark ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.35)');
      }

      function render(st) {
        var ch = st.chatHighlight;
        if ((!ch || !ch.visible) && SceneBase.qp('preview') === '1') {
          ch = { visible: true, user: 'ChatFan_99',
                 text: 'That flip reset was UNREAL. Best goal of the season, easily.', ts: 1 };
        }
        if (!ch || !ch.visible) { wrap.classList.remove('show'); return; }

        // Brand theming: gradient plate + card edge from the active brand kit.
        var c1 = SceneBase.brandColor(st) || '#7c3aed';
        var c2 = (SceneBase.brandAccent && SceneBase.brandAccent(st)) || c1;
        document.documentElement.style.setProperty('--c1', c1);
        document.documentElement.style.setProperty('--c2', c2);
        applyInk(c1, c2);
        // Kicker: the message's own label wins (Q&A sends "QUESTION · INSTAGRAM"), then a
        // per-source override (?kicker=FAN%20REACTIONS), then plain LIVE CHAT.
        elKicker.textContent = ch.kicker || SceneBase.qp('kicker') || 'LIVE CHAT';

        elUser.textContent = ch.user || '';
        elText.textContent = ch.text || '';
        var len = (ch.text || '').length;
        elText.classList.toggle('long', len > 110 && len <= 220);
        elText.classList.toggle('verylong', len > 220);

        // Re-run the staged entrance when a NEW message replaces a live one.
        if (ch.ts !== lastTs && wrap.classList.contains('show')) {
          wrap.classList.remove('show');
          void wrap.offsetWidth;   // restart transitions
        }
        lastTs = ch.ts;
        requestAnimationFrame(function () { wrap.classList.add('show'); });
      }

      SceneBase.connect(render);
    })();
  </script>
</body>
</html>
