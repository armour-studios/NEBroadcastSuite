<!DOCTYPE html>
<!--
  intermission.html — compact horizontal card: logo | countdown | event title.
  Transparent background — layer over a map loop or b-roll in OBS.

  Driven by full_state:
    breakScreen.visible       — show / hide the card (standalone always shows)
    breakScreen.title         — label above the countdown (e.g. "NEXT MAP IN")
    breakScreen.endsAt        — epoch ms countdown target
    breakScreen.frozenSeconds — paused value overrides endsAt
    eventName                 — event title line
    brand.logo / brand.color  — logo image + accent colour

    compFeed.next            — UP NEXT strip (live competition; off via competition.feeds.brb or ?next=0)

  URL params:
    ?label=NEXT MAP IN  override label
    ?title=off          hide event title
    ?showTimer=0        hide countdown
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root { --accent: #e83a8b; --accent2: #8b5cf6; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
    }

    /* Card — content drives size; ambient glow behind it so it reads over b-roll */
    .im-card {
      position: relative;
      width: 1000px;
      opacity: 0; transition: opacity .5s ease;
    }
    .im-card.show {
      opacity: 1;
      animation: imFloat 6s ease-in-out .5s infinite;
    }
    .im-card::before {
      content: ''; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 1500px; height: 860px; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse 50% 50% at 50% 50%,
        color-mix(in srgb, var(--accent) 22%, transparent), transparent 66%);
      filter: blur(26px);
    }
    @keyframes imFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-9px); }
    }

    /* Panel — column: [body row] then [progress bar] */
    .im-panel {
      position: relative;
      width: 100%;
      background: linear-gradient(165deg,
        rgba(17, 19, 30, .95) 0%,
        rgba(9, 11, 19, .96) 55%,
        rgba(6, 7, 13, .97) 100%);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow:
        0 44px 120px rgba(0,0,0,.72),
        0 0 0 1px rgba(255,255,255,.04),
        0 0 70px -14px color-mix(in srgb, var(--accent) 42%, transparent);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
    }
    /* top accent line */
    .im-panel::before {
      content: ''; position: absolute; top: 0; left: 8%; right: 8%; height: 2px; z-index: 4;
      background: linear-gradient(to right, transparent, var(--accent), var(--accent2), transparent);
      border-radius: 0 0 4px 4px;
      animation: accentPulse 2.8s ease-in-out infinite;
    }
    /* faint top sheen */
    .im-panel::after {
      content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), transparent 26%);
    }
    @keyframes accentPulse {
      0%, 100% { opacity: .65; }
      50%       { opacity: 1; }
    }

    /* Corner brackets */
    .im-corner {
      position: absolute; width: 22px; height: 22px; z-index: 5; pointer-events: none;
      border: 2px solid color-mix(in srgb, var(--accent) 72%, transparent);
      opacity: .72;
    }
    .im-corner.tl { top: 13px; left: 13px; border-right: 0; border-bottom: 0; border-radius: 7px 0 0 0; }
    .im-corner.tr { top: 13px; right: 13px; border-left: 0; border-bottom: 0; border-radius: 0 7px 0 0; }
    .im-corner.bl { bottom: 15px; left: 13px; border-right: 0; border-top: 0; border-radius: 0 0 0 7px; }
    .im-corner.br { bottom: 15px; right: 13px; border-left: 0; border-top: 0; border-radius: 0 0 7px 0; }

    /* Body row */
    .im-body {
      display: flex; flex-direction: row; align-items: center;
      padding: 40px 50px;
      position: relative; z-index: 3;
    }

    /* Left: the brand logo itself, with an optional "presented by" sponsor below */
    .im-left {
      flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    /* Purely a sizing box now — the ringed disc it used to draw (radial fill, accent hairline,
       outer glow) is gone. Kept at 190px so the column width, the gap to the sponsor below and
       .im-presented's max-width all stay exactly where they were. */
    .im-logo-disc {
      width: 190px; height: 190px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .im-logo {
      width: 144px; height: 144px; object-fit: contain; display: block;
      animation: logoPulse 3s ease-in-out infinite;
    }

    /* Presented-by (title sponsor) under the brand logo */
    .im-presented {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      max-width: 190px;
    }
    .im-presented.is-empty { display: none; }
    .im-pb-label {
      font-size: 10px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase;
      color: #ffffff; line-height: 1;
    }
    .im-pb-logo {
      height: 34px; max-width: 180px; width: auto; object-fit: contain;
      opacity: .92; filter: drop-shadow(0 1px 6px rgba(0,0,0,.5));
    }
    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 4px 16px rgba(0,0,0,.6)) drop-shadow(0 0 0px var(--accent)); }
      50%       { filter: drop-shadow(0 4px 16px rgba(0,0,0,.6)) drop-shadow(0 0 22px var(--accent)); }
    }

    /* Vertical separator (accent-tinted) */
    .im-vsep {
      width: 1px; align-self: stretch; flex-shrink: 0;
      background: linear-gradient(to bottom,
        transparent,
        color-mix(in srgb, var(--accent) 45%, rgba(255,255,255,.14)),
        transparent);
      margin: 0 48px;
    }

    /* Right: countdown + event title */
    .im-right {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    .im-countdown { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .im-countdown.hidden { display: none; }
    /* Title-only: keep the label, drop the digits. The stack is already centred, so the label
       simply becomes the block — scaled up so it does not read as a caption with nothing under it. */
    .im-countdown.title-only .im-time { display: none; }
    .im-countdown.title-only .im-label { font-size: 34px; letter-spacing: .30em; }

    .im-label {
      font-size: 20px; font-weight: 800; letter-spacing: .42em; text-transform: uppercase;
      color: var(--accent-ink, var(--accent)); line-height: 1;
      display: flex; align-items: center; gap: 12px;
    }
    .im-label::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); box-shadow: 0 0 10px var(--accent);
      animation: dotPulse 1.5s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .35; transform: scale(.66); }
    }

    .im-time {
      font-size: 94px; font-weight: 900; letter-spacing: -.01em; line-height: 1;
      color: #fff; text-align: center;
      font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
      text-shadow: 0 0 70px rgba(255,255,255,.18),
        0 0 130px color-mix(in srgb, var(--accent) 32%, transparent);
    }
    .im-time.big { font-size: 112px; }

    /* Divider kept for JS compat — not rendered in horizontal layout */
    .im-divider { display: none; }

    .im-event {
      font-size: 19px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase;
      color: rgba(255,255,255,.68); text-align: center; line-height: 1.1;
      white-space: nowrap; overflow: hidden;
      width: 100%; max-width: 640px;
      margin-top: 18px; padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .im-event.hidden { display: none; }

    /* Progress bar — sits under the timer column only (not the full panel width) */
    .im-progress {
      width: 320px; max-width: 84%; height: 5px; margin-top: 20px;
      background: rgba(255,255,255,.08);
      border-radius: 3px;
      position: relative; overflow: hidden; flex-shrink: 0; z-index: 3;
    }
    .im-progress.hidden { display: none; }
    .im-progress-fill {
      height: 100%;
      background: linear-gradient(to right, var(--accent), var(--accent2), var(--accent));
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 80%, transparent);
      transition: width .9s linear;
      width: 100%;
      position: absolute; left: 50%; transform: translateX(-50%);
    }
    .im-progress-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 22%, rgba(255,255,255,.45) 50%, transparent 78%);
      background-size: 220% 100%;
      animation: imShimmer 2.4s linear infinite;
    }
    @keyframes imShimmer {
      0%   { background-position: 220% 0; }
      100% { background-position: -220% 0; }
    }

    /* UP NEXT — the live competition's next fixture, under the panel. Only drawn when a league is
       live and the producer left "BRB shows the next match" on (competition.feeds.brb). */
    .im-next {
      margin: 18px auto 0; width: 86%;
      display: flex; align-items: center; gap: 22px; padding: 16px 30px;
      background: rgba(9, 11, 19, .92); border: 1px solid rgba(255,255,255,.09); border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
    }
    .im-next.hidden { display: none; }
    .im-next-tag {
      flex-shrink: 0; font-size: 13px; font-weight: 800; letter-spacing: .3em; color: var(--accent-ink, var(--accent));
      padding-right: 22px; border-right: 1px solid rgba(255,255,255,.12); line-height: 1.2;
    }
    .im-next-tag.live { color: #22e06a; }
    .im-next-match { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 16px; }
    .im-next-team { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    /* Both names hug the VS: A is reversed (logo outermost), so its main-start is the RIGHT edge. */
    .im-next-team.a { flex-direction: row-reverse; justify-content: flex-start; }
    .im-next-team.b { justify-content: flex-start; }
    .im-next-name { font-size: 26px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .im-next-logo { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
    .im-next-vs { font-size: 16px; font-weight: 800; color: rgba(255,255,255,.4); letter-spacing: .2em; flex-shrink: 0; }
    .im-next-when { flex-shrink: 0; font-size: 17px; font-weight: 700; color: rgba(255,255,255,.62); letter-spacing: .12em; text-transform: uppercase; padding-left: 22px; border-left: 1px solid rgba(255,255,255,.12); }
    .im-next-when:empty { display: none; }
  </style>
</head>
<body>
  <div class="im-card" id="card">
    <div class="im-panel">
      <span class="im-corner tl"></span><span class="im-corner tr"></span>
      <span class="im-corner bl"></span><span class="im-corner br"></span>
      <div class="im-body">
        <div class="im-left">
          <div class="im-logo-disc">
            <img class="im-logo" id="logo" src="" alt="">
          </div>
          <div class="im-presented is-empty" id="presented-by">
            <span class="im-pb-label" id="pb-label">PRESENTED BY</span>
            <img class="im-pb-logo" id="pb-logo" alt="" style="display:none">
          </div>
        </div>
        <div class="im-vsep"></div>
        <div class="im-right">
          <div class="im-countdown hidden" id="countdown-wrap">
            <div class="im-label" id="label">INTERMISSION</div>
            <div class="im-time" id="time">—</div>
          </div>
          <div class="im-progress hidden" id="progress">
            <div class="im-progress-fill" id="progress-fill"></div>
          </div>
          <div class="im-divider hidden" id="divider"></div>
          <div class="im-event hidden" id="event-title"></div>
        </div>
      </div>
    </div>
    <div class="im-next hidden" id="next">
      <div class="im-next-tag" id="next-tag">UP NEXT</div>
      <div class="im-next-match">
        <div class="im-next-team a"><span class="im-next-name" id="next-a"></span><img class="im-next-logo" id="next-a-logo" alt=""></div>
        <span class="im-next-vs">VS</span>
        <div class="im-next-team b"><img class="im-next-logo" id="next-b-logo" alt=""><span class="im-next-name" id="next-b"></span></div>
      </div>
      <div class="im-next-when" id="next-when"></div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    const QP     = new URLSearchParams(location.search);
    const QLABEL = QP.get('label');
    const QTITLE = QP.get('title');
    const SHOW_TIMER = QP.get('showTimer') !== '0';
    const card = document.getElementById('card');

    function el(id) { return document.getElementById(id); }
    // Shrink the event title so the whole thing stays on ONE line within its column.
    function fitEventTitle() {
      const e = el('event-title');
      if (!e || !e.textContent) return;
      let size = 19;
      e.style.fontSize = size + 'px';
      let guard = 0;
      while (e.scrollWidth > e.clientWidth && size > 9 && guard++ < 60) {
        size -= 1; e.style.fontSize = size + 'px';
      }
    }
    function fmtTime(sec) {
      sec = Math.max(0, Math.round(sec));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      return m + ':' + String(s).padStart(2, '0');
    }

    let _endsAt = null, _frozen = null, _totalSec = null, _startedAt = null;
    let _tickTimer = null;

    function startTick() {
      clearInterval(_tickTimer);
      _tickTimer = setInterval(tick, 250);
    }
    function tick() {
      if (_frozen != null) { el('time').textContent = fmtTime(_frozen); updateProgress(_frozen); return; }
      if (!_endsAt) return;
      const rem = Math.max(0, (_endsAt - (typeof SceneBase !== 'undefined' ? SceneBase.now() : Date.now())) / 1000);
      el('time').textContent = fmtTime(rem);
      updateProgress(rem);
    }
    function updateProgress(remSec) {
      const prog = el('progress-fill');
      if (!prog || !_totalSec) return;
      const pct = Math.min(100, Math.max(0, (remSec / _totalSec) * 100));
      prog.style.width = pct + '%';
    }

    function render(data) {
      data = data || {};
      const b = data.breakScreen || {};
      const standalone = SceneBase.standalone;
      const visible = standalone || b.visible;
      card.classList.toggle('show', !!visible);
      if (!visible) return;

      const root = document.documentElement;
      const accent = SceneBase.brandColor(data);
      const accent2 = SceneBase.brandAccent(data);
      if (accent) root.style.setProperty('--accent', accent);
      if (accent2) root.style.setProperty('--accent2', accent2);

      const logoImg = el('logo');
      const brandLogo = (data.brand && data.brand.logo) ? data.brand.logo : '';
      SceneBase.applyTeamLogo(logoImg, brandLogo, '');

      // Presented-by (title sponsor) under the logo — same source as the other scenes (scoreboardAd).
      // Title-sponsor plate: with a brand kit active this shows ONLY a sponsor tagged
      // "Title" — no title sponsor labeled, no plate (a scoreboard-tagged sponsor stays
      // on the in-game scoreboard where it belongs). No kit -> manual upload as before.
      const _pbBrand = data.brand || {};
      const slot = _pbBrand.id
        ? { label: (data.scoreboardAd || {}).label, logo: (_pbBrand.spots && _pbBrand.spots.title) || '' }
        : (data.scoreboardAd || {});
      const pbWrap = el('presented-by');
      if (slot.logo) {
        el('pb-label').textContent = (_pbBrand.presentedLabel || slot.label || 'PRESENTED BY').toString().trim();
        const pbLogo = el('pb-logo'); pbLogo.src = slot.logo; pbLogo.style.display = '';
        pbWrap.classList.remove('is-empty');
      } else {
        pbWrap.classList.add('is-empty');
      }

      renderNext(data);

      let titleText = '';
      if (QTITLE != null) { titleText = /^(off|none|hide|0)$/i.test(QTITLE.trim()) ? '' : QTITLE.trim(); }
      else { titleText = (data.eventName || '').toString().trim(); }
      const titleEl = el('event-title');
      titleEl.textContent = titleText.toUpperCase();
      titleEl.classList.toggle('hidden', !titleText);
      el('divider').classList.toggle('hidden', !titleText);
      if (titleText) fitEventTitle();

      const labelText = QLABEL || b.title || 'INTERMISSION';
      el('label').textContent = labelText.toUpperCase();

      const hasEndsAt = !!b.endsAt;
      const hasFrozen = b.frozenSeconds != null;
      // Title-only (breakScreen.titleOnly, or the older ?showTimer=0 URL param): keep the label,
      // drop the digits and the progress bar. The block then depends on there BEING a title rather
      // than on a timer, or turning the clock off would hide the label along with it.
      const titleOnly = !!b.titleOnly || !SHOW_TIMER;
      const hasTimer  = SHOW_TIMER && (hasEndsAt || hasFrozen);
      const showBlock = titleOnly ? !!String(labelText || '').trim() : hasTimer;
      el('countdown-wrap').classList.toggle('title-only', titleOnly);
      el('countdown-wrap').classList.toggle('hidden', !showBlock);
      el('progress').classList.toggle('hidden', !hasTimer || titleOnly);
      el('time').classList.toggle('big', !titleText);

      if (hasTimer) {
        _frozen = hasFrozen ? Math.max(0, Math.round(b.frozenSeconds)) : null;
        _endsAt = hasEndsAt ? b.endsAt : null;
        if (!_startedAt && _endsAt) {
          const remNow = (_endsAt - (typeof SceneBase !== 'undefined' ? SceneBase.now() : Date.now())) / 1000;
          if (remNow > 0 && !_totalSec) { _totalSec = remNow; _startedAt = Date.now(); }
        }
        if (!_tickTimer) startTick();
        tick();
      } else {
        clearInterval(_tickTimer); _tickTimer = null;
      }
    }

    // "7:30 PM" today, "SAT 9/20 · 7:30 PM" otherwise.
    function fmtWhen(m, data) {
      if (!m || (!m.date && !m.time)) return '';
      if (m.postponed) return 'POSTPONED';
      const t24 = !!data.clock24h, intl = data.dateFormat === 'intl';
      const d = new Date((m.date || new Date().toISOString().slice(0, 10)) + 'T' + (m.time && /^\d{1,2}:\d{2}/.test(m.time) ? (m.time.length === 4 ? '0' + m.time : m.time) : '12:00'));
      if (isNaN(d.getTime())) return [m.date, m.time].filter(Boolean).join(' ');
      const h = d.getHours(), mi = String(d.getMinutes()).padStart(2, '0');
      const time = m.time ? (t24 ? String(h).padStart(2, '0') + ':' + mi : ((h % 12) || 12) + ':' + mi + (h < 12 ? ' AM' : ' PM')) : '';
      if (!m.date || d.toDateString() === new Date().toDateString()) return time;
      const day = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][d.getDay()];
      return day + ' ' + (intl ? d.getDate() + '/' + (d.getMonth() + 1) : (d.getMonth() + 1) + '/' + d.getDate()) + (time ? ' · ' + time : '');
    }
    function renderNext(data) {
      const box = el('next');
      const on = !(data.competition && data.competition.feeds && data.competition.feeds.brb === false);
      const f = data.compFeed;
      const m = f && f.next && f.next.id ? f.next : null;
      if (!on || !m || QP.get('next') === '0') { box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      el('next-tag').textContent = m.status === 'live' ? 'LIVE NOW' : 'UP NEXT';
      el('next-tag').classList.toggle('live', m.status === 'live');
      el('next-a').textContent = m.teamA || 'TBD';
      el('next-b').textContent = m.teamB || 'TBD';
      const saved = {};
      (data.savedTeams || []).forEach((t) => { if (t && t.name && t.logo) saved[t.name.toLowerCase()] = t.logo; });
      const logo = (name) => (f.logos && f.logos[name]) || saved[(name || '').toLowerCase()] || '';
      [['next-a-logo', m.teamA], ['next-b-logo', m.teamB]].forEach(([id, name]) => {
        const img = el(id), src = logo(name);
        if (src) { img.src = src; img.style.display = ''; } else { img.removeAttribute('src'); img.style.display = 'none'; }
      });
      el('next-when').textContent = m.status === 'live' ? '' : fmtWhen(m, data);
    }

    if (location.protocol === 'file:') {
      render({
        breakScreen: { visible: true, title: 'NEXT MAP IN', endsAt: Date.now() + 4 * 60 * 1000 + 22 * 1000 },
        eventName: 'Summer Showdown 2024',
        compFeed: { next: { id: 'm1', status: 'upcoming', teamA: 'Riverside', teamB: 'Lakeside North', date: '', time: '19:30' }, logos: {} },
        brand: { color: '#e83a8b', accent: '#8b5cf6', logo: '' },
        scoreboardAd: { label: 'PRESENTED BY', logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40"><rect width="160" height="40" rx="4" fill="#1a1d24"/><text x="80" y="27" font-size="18" fill="#e8eaf0" text-anchor="middle" font-family="Arial" font-weight="bold">SPONSOR</text></svg>') }
      });
    } else {
      SceneBase.connect(render);
    }
  </script>
</body>
</html>
