<!DOCTYPE html>
<!--
  vertical-break.html — 9:16 (1080x1920) break / "starting soon" card for TikTok &
  YouTube Shorts co-streams. A VERTICAL COMPANION to intermission.html /
  intermission2.html, not a replacement — same breakScreen bindings, same brand kit,
  restacked for a portrait canvas and kept inside the phone-UI safe area.

  Set the OBS browser source to 1080 x 1920.

  Driven by full_state:
    breakScreen.visible        — show / hide (a standalone OBS source always shows)
    breakScreen.title          — label above the countdown ("STARTING SOON")
    breakScreen.endsAt         — epoch ms countdown target
    breakScreen.frozenSeconds  — paused value, overrides endsAt
    breakScreen.message        — support line under the timer
    breakScreen.finalMessage   — replaces the timer at 0:00 ("WE'RE LIVE!")
    eventName                  — event title under the logo
    brand.logo / color / accent, scoreboardAd — logo, accents, title sponsor

  URL params:
    ?label=NEXT MAP IN   override the label
    ?title=off           hide the event title
    ?showTimer=0         hide the countdown
    ?fill=1              draw a branded backdrop (default: transparent, layer over b-roll)
    ?safe=0              use the full 1080x1920 frame (default: keep clear of phone UI)
    ?guides=1            outline the safe area while you position the source
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root {
      --accent: #e83a8b; --accent2: #8b5cf6;
      /* Safe area — TikTok/Shorts paint their own UI over the top strip, the bottom
         caption block and the right-hand action rail. Content lives inside these. */
      --pad-top: 150px; --pad-bottom: 400px; --pad-x: 70px;
      --time-size: 250px; --time-size-long: 168px;
    }
    .no-safe { --pad-top: 90px; --pad-bottom: 110px; --pad-x: 60px; --time-size: 300px; --time-size-long: 200px; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #fff;
    }

    /* ── Optional branded backdrop (?fill=1) ── */
    /* Base wash on the element, accent glows on ::before — kept in SEPARATE declarations so a
       browser without color-mix() drops only the glow, never the whole backdrop. */
    .vb-fill {
      position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; z-index: 0; display: none;
      background: linear-gradient(180deg, #10131f 0%, #090b14 50%, #05060c 100%);
    }
    .fill .vb-fill { display: block; }
    .vb-fill::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 105% 42% at 50% 26%, color-mix(in srgb, var(--accent) 46%, transparent), transparent 72%),
        radial-gradient(ellipse 95% 38% at 50% 88%, color-mix(in srgb, var(--accent2) 40%, transparent), transparent 74%);
    }
    .vb-fill::after {
      content: ''; position: absolute; inset: 0; opacity: .7;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 90px 90px;
      mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, #000 20%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, #000 20%, transparent 78%);
    }

    /* ── Stage ── */
    .vb-stage {
      /* Pinned to the 1080x1920 page, not the viewport, so the layout holds even when the
         source is previewed in a shorter window. */
      position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
      opacity: 0; transform: translateY(24px);
      transition: opacity .55s ease, transform .8s cubic-bezier(.22,1,.36,1);
    }
    .vb-stage.show { opacity: 1; transform: translateY(0); }

    /* Safe-area guide (?guides=1) */
    .vb-guide { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; z-index: 9; display: none; pointer-events: none; }
    .guides .vb-guide { display: block; }
    .vb-guide i {
      position: absolute; left: var(--pad-x); right: var(--pad-x); top: var(--pad-top); bottom: var(--pad-bottom);
      border: 2px dashed rgba(255,47,214,.85); border-radius: 18px;
    }
    .vb-guide span {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--pad-bottom) + 12px);
      font: 800 22px/1 ui-monospace, monospace; letter-spacing: .12em; color: #ff7fe6;
      background: rgba(0,0,0,.7); padding: 6px 12px; border-radius: 6px;
    }

    /* ── Top: brand disc + event title ── */
    .vb-top { display: flex; flex-direction: column; align-items: center; gap: 26px; flex: 0 0 auto; }
    .vb-logo-disc {
      width: 250px; height: 250px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 34%, rgba(36,40,52,.94), rgba(8,10,17,.97));
      border: 1px solid color-mix(in srgb, var(--accent) 34%, rgba(255,255,255,.10));
      box-shadow: inset 0 0 44px rgba(0,0,0,.6), 0 0 70px -16px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    .vb-logo { width: 186px; height: 186px; object-fit: contain; display: block; animation: logoPulse 3.2s ease-in-out infinite; }
    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 5px 18px rgba(0,0,0,.65)) drop-shadow(0 0 0 var(--accent)); }
      50%      { filter: drop-shadow(0 5px 18px rgba(0,0,0,.65)) drop-shadow(0 0 28px var(--accent)); }
    }
    .vb-event {
      max-width: 100%; text-align: center; line-height: 1.14;
      font-size: 38px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
      color: #fff; text-shadow: 0 3px 22px rgba(0,0,0,.85);
    }
    .vb-event.hidden { display: none; }

    /* ── Middle: label + countdown ── */
    .vb-mid {
      flex: 1 1 auto; min-height: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    }
    .vb-label {
      display: flex; align-items: center; gap: 16px;
      font-size: 28px; font-weight: 900; letter-spacing: .42em; text-transform: uppercase;
      color: var(--accent); line-height: 1;
      text-shadow: 0 3px 18px rgba(0,0,0,.95), 0 0 46px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    .vb-label::before {
      content: ''; width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); box-shadow: 0 0 14px var(--accent);
      animation: dotPulse 1.5s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.6); } }
    .vb-label.hidden { display: none; }

    .vb-time-wrap { position: relative; width: 100%; text-align: center; margin: 14px 0 4px; }
    .vb-time-wrap.hidden { display: none; }
    .vb-time-wrap::after {
      content: ''; position: absolute; inset: -40px -20px;
      background: radial-gradient(ellipse 80% 60% at 50% 50%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 72%);
      z-index: -1; pointer-events: none;
      animation: timerGlow 3.5s ease-in-out infinite;
    }
    @keyframes timerGlow { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
    .vb-time {
      display: block; white-space: nowrap;
      font-size: var(--time-size); font-weight: 900; line-height: .9;
      color: #fff; font-variant-numeric: tabular-nums;
      text-shadow: 0 0 90px rgba(255,255,255,.18), 0 0 150px color-mix(in srgb, var(--accent) 34%, transparent);
    }
    .vb-time.long-fmt { font-size: var(--time-size-long); }
    /* Fixed-width digit slots so the block never jitters between ticks. */
    .vb-time .d { display: inline-block; width: 1ch; text-align: center; }
    .vb-time .c { display: inline-block; width: .44ch; text-align: center; }
    .vb-time.is-final {
      font-size: 96px; letter-spacing: .06em; text-transform: uppercase;
      -webkit-text-stroke: 0; color: #fff;
      animation: finalPop .5s cubic-bezier(.22,1,.36,1);
    }
    @keyframes finalPop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }

    .vb-progress {
      width: 620px; max-width: 100%; height: 8px; border-radius: 4px; margin-top: 6px;
      background: rgba(255,255,255,.10); position: relative; overflow: hidden;
    }
    .vb-progress.hidden { display: none; }
    .vb-progress-fill {
      position: absolute; left: 50%; transform: translateX(-50%);
      height: 100%; width: 100%;
      background: linear-gradient(to right, var(--accent), var(--accent2), var(--accent));
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 80%, transparent);
      transition: width .9s linear;
    }
    .vb-progress-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 22%, rgba(255,255,255,.45) 50%, transparent 78%);
      background-size: 220% 100%; animation: vbShimmer 2.4s linear infinite;
    }
    @keyframes vbShimmer { 0% { background-position: 220% 0; } 100% { background-position: -220% 0; } }

    .vb-msg {
      margin-top: 26px; max-width: 860px; text-align: center;
      font-size: 30px; font-weight: 600; letter-spacing: .05em; line-height: 1.3;
      color: rgba(255,255,255,.78); text-shadow: 0 2px 14px rgba(0,0,0,.8);
    }
    .vb-msg.hidden { display: none; }

    /* ── Footer: title sponsor ── */
    .vb-footer { flex: 0 0 auto; margin-top: 24px; display: flex; justify-content: center; }
    .vb-pb {
      display: inline-flex; align-items: center; gap: 18px;
      padding: 12px 30px; border-radius: 12px;
      background: linear-gradient(180deg, rgba(20,23,30,.94), rgba(9,11,16,.96));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    .vb-pb.is-empty { display: none; }
    .vb-pb-label { font-size: 15px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.6); white-space: nowrap; }
    .vb-pb-logo { height: 48px; max-width: 320px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="vb-fill"></div>
  <div class="vb-guide"><i></i><span>SAFE AREA</span></div>

  <div class="vb-stage" id="stage">
    <div class="vb-top">
      <div class="vb-logo-disc"><img class="vb-logo" id="logo" src="" alt=""></div>
      <div class="vb-event hidden" id="event-title"></div>
    </div>

    <div class="vb-mid">
      <div class="vb-label" id="label">STARTING SOON</div>
      <div class="vb-time-wrap" id="time-wrap"><div class="vb-time" id="time">—</div></div>
      <div class="vb-progress hidden" id="progress"><div class="vb-progress-fill" id="progress-fill"></div></div>
      <div class="vb-msg hidden" id="message"></div>
    </div>

    <div class="vb-footer">
      <div class="vb-pb is-empty" id="presented-by">
        <span class="vb-pb-label" id="pb-label">PRESENTED BY</span>
        <img class="vb-pb-logo" id="pb-logo" alt="" style="display:none">
      </div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    const QP      = new URLSearchParams(location.search);
    const QLABEL  = QP.get('label');
    const QTITLE  = QP.get('title');
    const SHOW_TIMER = QP.get('showTimer') !== '0';
    const root = document.documentElement;
    if (QP.get('fill') === '1')   root.classList.add('fill');
    if (QP.get('safe') === '0')   root.classList.add('no-safe');
    if (QP.get('guides') === '1') root.classList.add('guides');

    function el(id) { return document.getElementById(id); }

    // Keep the event title on one line inside the safe column.
    function fitEventTitle() {
      const e = el('event-title');
      if (!e || !e.textContent) return;
      let size = 38, guard = 0;
      e.style.fontSize = size + 'px';
      while (e.scrollWidth > e.clientWidth && size > 18 && guard++ < 60) { size -= 1; e.style.fontSize = size + 'px'; }
    }
    function fmtTime(sec) {
      sec = Math.max(0, Math.round(sec));
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      return m + ':' + String(s).padStart(2, '0');
    }
    function setTime(str) {
      const t = el('time');
      t.classList.remove('is-final');
      t.innerHTML = str.split('').map(ch =>
        ch === ':' ? '<span class="c">:</span>' : '<span class="d">' + ch + '</span>').join('');
      t.classList.toggle('long-fmt', str.length > 5);
    }
    function setFinal(text) {
      const t = el('time');
      if (t.dataset.final === text) return;               // don't re-trigger the pop every tick
      t.dataset.final = text;
      t.classList.remove('long-fmt');
      t.classList.add('is-final');
      t.textContent = text;
    }

    let _endsAt = null, _frozen = null, _totalSec = null, _startedAt = null, _tickTimer = null;
    let _finalMessage = "WE'RE LIVE!";

    function startTick() { clearInterval(_tickTimer); _tickTimer = setInterval(tick, 250); }
    function tick() {
      if (_frozen != null) { setTime(fmtTime(_frozen)); updateProgress(_frozen); return; }
      if (!_endsAt) return;
      const rem = Math.max(0, (_endsAt - Date.now()) / 1000);
      if (rem <= 0 && _finalMessage) setFinal(_finalMessage);
      else { el('time').dataset.final = ''; setTime(fmtTime(rem)); }
      updateProgress(rem);
    }
    function updateProgress(remSec) {
      const fill = el('progress-fill');
      if (!fill || !_totalSec) return;
      fill.style.width = Math.min(100, Math.max(0, (remSec / _totalSec) * 100)) + '%';
    }

    function renderPresentedBy(data) {
      // Title-sponsor plate: with a brand kit active this shows ONLY a sponsor tagged
      // "Title"; no kit -> the manually uploaded scoreboard ad, same as the other scenes.
      const brand = data.brand || {};
      const slot = brand.id
        ? { label: (data.scoreboardAd || {}).label, logo: (brand.spots && brand.spots.title) || '' }
        : (data.scoreboardAd || {});
      const wrap = el('presented-by');
      if (slot.logo) {
        el('pb-label').textContent = (slot.label || 'PRESENTED BY').toString().trim();
        const logo = el('pb-logo'); logo.src = slot.logo; logo.style.display = '';
        wrap.classList.remove('is-empty');
      } else {
        el('pb-logo').removeAttribute('src'); el('pb-logo').style.display = 'none';
        wrap.classList.add('is-empty');
      }
    }

    function render(data) {
      data = data || {};
      const b = data.breakScreen || {};
      const visible = SceneBase.standalone || SceneBase.preview || b.visible;
      el('stage').classList.toggle('show', !!visible);
      if (!visible) return;

      const accent = SceneBase.brandColor(data), accent2 = SceneBase.brandAccent(data);
      if (accent)  root.style.setProperty('--accent', accent);
      if (accent2) root.style.setProperty('--accent2', accent2);
      if (data.fontFamily) root.style.fontFamily = `'${data.fontFamily}', 'Rajdhani', sans-serif`;

      SceneBase.applyTeamLogo(el('logo'), (data.brand && data.brand.logo) || '', '');

      let titleText = '';
      if (QTITLE != null) titleText = /^(off|none|hide|0)$/i.test(QTITLE.trim()) ? '' : QTITLE.trim();
      else titleText = (data.eventName || '').toString().trim();
      const titleEl = el('event-title');
      titleEl.textContent = titleText.toUpperCase();
      titleEl.classList.toggle('hidden', !titleText);
      if (titleText) fitEventTitle();

      el('label').textContent = (QLABEL || b.title || 'STARTING SOON').toUpperCase();
      _finalMessage = (b.finalMessage || "WE'RE LIVE!").toString();

      const msg = (b.message || '').toString().trim();
      el('message').textContent = msg;
      el('message').classList.toggle('hidden', !msg);

      const hasEndsAt = !!b.endsAt, hasFrozen = b.frozenSeconds != null;
      const hasTimer  = SHOW_TIMER && (hasEndsAt || hasFrozen);
      el('time-wrap').classList.toggle('hidden', !hasTimer);
      el('progress').classList.toggle('hidden', !hasTimer);
      el('label').classList.toggle('hidden', !hasTimer && !(QLABEL || b.title));

      if (hasTimer) {
        _frozen = hasFrozen ? Math.max(0, Math.round(b.frozenSeconds)) : null;
        _endsAt = hasEndsAt ? b.endsAt : null;
        if (!_startedAt && _endsAt) {
          const remNow = (_endsAt - Date.now()) / 1000;
          if (remNow > 0 && !_totalSec) { _totalSec = remNow; _startedAt = Date.now(); }
        }
        if (!_tickTimer) startTick();
        tick();
      } else {
        clearInterval(_tickTimer); _tickTimer = null;
      }

      renderPresentedBy(data);
    }

    if (location.protocol === 'file:') {
      root.classList.add('fill');
      render({
        breakScreen: { visible: true, title: 'STARTING SOON', message: 'Grab a snack — we go live shortly',
          endsAt: Date.now() + 8 * 60 * 1000 + 42 * 1000, finalMessage: "WE'RE LIVE!" },
        eventName: 'Summer Showdown 2026 — Grand Final',
        brand: { color: '#e83a8b', accent: '#8b5cf6', logo: '' },
        scoreboardAd: { label: 'PRESENTED BY', logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="220" height="52"><rect width="220" height="52" rx="5" fill="#1a1d24"/><text x="110" y="35" font-size="24" fill="#e8eaf0" text-anchor="middle" font-family="Arial" font-weight="bold">SPONSOR</text></svg>') }
      });
    } else {
      SceneBase.connect(render);
    }
  </script>
</body>
</html>
