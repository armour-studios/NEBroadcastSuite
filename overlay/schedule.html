<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>NE Broadcast Suite — Schedule</title>
<link rel="stylesheet" href="fonts.css">
<!--
  schedule.html — SCHEDULE overlay.
  Visual: mini duocaster match-hud style per row (team color wash + logos + dark VS center).
  Data:   data.upcoming.matches (manual) merged with data.startgg.queue (auto).
  Layout: 'cards' = 1 column | 'board' = 2 columns.
-->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #055fdb; --accent-2: #e97139;
  --muted: #8b93a8;
  --disp: 'Rajdhani', sans-serif; --body: 'Inter', sans-serif;
}
html { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--body); -webkit-font-smoothing: antialiased; color: #eef1f7; display: flex; align-items: center; justify-content: center; }

.sch-stage { width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 22px; opacity: 0; transition: opacity .45s ease; }
.sch-stage.show { opacity: 1; }
.sch-inner { display: contents; }

/* ── Header ── */
.sch-head { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sch-brand-logo { height: 80px; width: auto; max-width: 280px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
.sch-eyebrow { font-family: var(--disp); font-weight: 700; font-size: 20px; letter-spacing: .44em; text-transform: uppercase; color: var(--accent-ink, var(--accent)); }
.sch-title { font-family: var(--disp); font-weight: 700; font-size: 72px; line-height: .96; letter-spacing: .02em; text-transform: uppercase; color: #fff; text-shadow: 0 0 28px color-mix(in srgb, var(--accent) 35%, transparent); }
.sch-rule { width: 240px; height: 3px; border-radius: 2px; margin-top: 4px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent); }

/* ── Match list grid ── */
.sch-list { width: 1000px; display: grid; grid-template-columns: 1fr; gap: 22px; }
/* Two-column board needs a wider stage: cards have a ~730px minimum, so inside the
   1000px single-column stage the grid overflowed off-screen right instead of centering. */
.sch-list.dual { grid-template-columns: 1fr 1fr; width: 1560px; }
.sch-stage:has(.sch-list.dual) { width: 1560px; }
.sch-entry-wrap { display: flex; flex-direction: column; gap: 6px; }
/* An odd match count leaves the last card alone in the final row of the 2-column grid — span
   both columns and center it there instead of letting it sit left-aligned under column 1. */
.sch-list.dual .sch-entry-wrap:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 11px); }
.sch-entry-meta { display: flex; align-items: center; justify-content: center; gap: 10px; }
.sch-meta-date { font-family: var(--disp); font-size: 14px; font-weight: 800; letter-spacing: .07em; color: rgba(255,255,255,.85); white-space: nowrap; line-height: 1; text-transform: uppercase; }

/* ── Entry: mini match-hud row ── */
.sch-entry {
  position: relative;
  display: flex;
  align-items: stretch;
  height: 68px;
  border-radius: 10px;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(24,27,34,.98) 0%, rgba(10,12,16,.99) 100%);
  box-shadow: 0 8px 28px rgba(0,0,0,.55);
  opacity: 0;
}
.sch-stage.show .sch-entry { animation: entryIn .6s cubic-bezier(.16,.84,.24,1) both; }
/* Re-renders (poll updates shifting times/scores) update IN PLACE — only the first
   paint animates, so the date/time line stops endlessly sliding back in. Every render fully
   rebuilds the list (innerHTML = ''), so a match added AFTER the first paint is a brand-new
   .sch-entry that gets caught by this same "don't animate" rule — opacity is only ever set to 1
   by the entryIn animation's own end-state, so without an explicit opacity here that new card
   went from "no slide-in" to "invisible forever" (only its date/badge meta row, a separate
   sibling element, isn't affected and kept showing). Skip the slide but still show the card.
*/
.sch-list[data-animated] .sch-entry { animation: none !important; opacity: 1; }
@keyframes entryIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
/* top hairline */
.sch-entry::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent 4%, rgba(255,255,255,.28) 50%, transparent 96%); z-index: 3; pointer-events: none; }

/* ── Team sides ── */
.sch-side {
  flex: 1 1 0; min-width: 0;
  position: relative;
  display: flex; align-items: center;
  gap: 10px; overflow: hidden;
}
.sch-side.a { padding: 0 10px 0 14px; }
.sch-side.b { padding: 0 14px 0 10px; }

/* color wash from outer edge */
.sch-side.a::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 55%; background: linear-gradient(90deg, color-mix(in srgb, var(--col-a, var(--accent)) 22%, transparent), transparent); }
.sch-side.b::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 55%; background: linear-gradient(270deg, color-mix(in srgb, var(--col-b, var(--accent-2)) 20%, transparent), transparent); }

/* bottom accent bar */
.sch-side.a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--col-a, var(--accent)) 0%, color-mix(in srgb, var(--col-a, var(--accent)) 38%, transparent) 55%, transparent 100%); box-shadow: 0 0 12px color-mix(in srgb, var(--col-a, var(--accent)) 55%, transparent); }
.sch-side.b::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(270deg, var(--col-b, var(--accent-2)) 0%, color-mix(in srgb, var(--col-b, var(--accent-2)) 38%, transparent) 55%, transparent 100%); box-shadow: 0 0 12px color-mix(in srgb, var(--col-b, var(--accent-2)) 55%, transparent); }

/* logo */
.sch-logo { width: 54px; height: 54px; object-fit: contain; flex: 0 0 54px; position: relative; z-index: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,.55)); }
.sch-logo.logo-on-dark { filter: brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.55)); }

/* name */
.sch-name { flex: 1 1 0; min-width: 0; position: relative; z-index: 1; font-family: var(--disp); font-size: 25px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
.sch-side.a .sch-name { text-shadow: 0 0 16px color-mix(in srgb, var(--col-a, var(--accent)) 50%, transparent); }
.sch-side.b .sch-name { text-align: right; text-shadow: 0 0 16px color-mix(in srgb, var(--col-b, var(--accent-2)) 50%, transparent); }

/* ── Center column ── */
.sch-center {
  flex: 0 0 148px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px;
  position: relative; z-index: 2;
  background: rgba(6,8,12,.97);
  border-left: 1px solid rgba(255,255,255,.1);
  border-right: 1px solid rgba(255,255,255,.1);
}
.sch-list.dual .sch-center { flex: 0 0 120px; }

.sch-vs { font-family: var(--disp); font-size: 34px; font-weight: 900; letter-spacing: .1em; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.85); line-height: 1; }

/* ON AIR badge (above the card) */
.sch-onair { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; background: #22e07a; color: #04130a; border-radius: 999px; padding: 3px 12px; font-family: var(--disp); font-size: 13px; font-weight: 800; letter-spacing: .1em; line-height: 1; }
.sch-onair .pdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
/* finished match kept on the board: final series score + FINAL tag, loser dimmed */
.sch-score { font-family: var(--disp); font-size: 34px; font-weight: 900; letter-spacing: .04em; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.85); line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sch-final { display: inline-flex; align-items: center; align-self: flex-start; background: rgba(255,255,255,.15); color: rgba(255,255,255,.92); border-radius: 999px; padding: 3px 12px; font-family: var(--disp); font-size: 13px; font-weight: 800; letter-spacing: .12em; line-height: 1; }
.sch-entry.sch-done { opacity: .94; }
.sch-side.sch-lose { opacity: .44; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

.sch-empty { font-family: var(--disp); font-weight: 600; font-size: 28px; letter-spacing: .08em; color: rgba(255,255,255,.2); text-transform: uppercase; }
</style>
</head>
<body>
<div id="sch-stage" class="sch-stage">
  <div class="sch-inner">
    <div class="sch-head">
      <img id="sch-brand-logo" class="sch-brand-logo" src="" alt="" style="display:none;">
      <div class="sch-eyebrow" id="sch-eyebrow">On Deck</div>
      <div class="sch-title" id="sch-title">SCHEDULE</div>
      <div class="sch-rule"></div>
    </div>
    <div class="sch-list" id="sch-list"></div>
    <div class="sch-empty" id="sch-empty" style="display:none;">No upcoming matches</div>
  </div>
</div>

<script src="scene-base.js"></script>
<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var LAYOUT_QP = new URLSearchParams(location.search).get('layout');
  var _lastSig = null;

  // First CHARACTER of a name, as a whole code point. `name[0]` returns HALF of an emoji (a lone surrogate) for
  // a name like "🔥⚡🔥 | 1", and encodeURIComponent() throws URIError "URI malformed" on that — which aborted the
  // whole render (a live start.gg event with one emoji-leading entrant kept the top 8 from ever drawing).
  function firstGlyph(name) { const c = Array.from(String(name == null ? '' : name).trim())[0]; return c ? c.toUpperCase() : '?'; }
  function xmlText(s) { return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
  function svgFallback(name) {
    const letter = xmlText(firstGlyph(name));
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" rx="22" fill="#39415a"/><text x="60" y="84" font-size="68" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold">' + letter + '</text></svg>');
  }

  function logoFor(name, fallback, maps) {
    var k = (name || '').toLowerCase();
    return fallback || maps.saved[k] || maps.sgg[k] || '';
  }
  function colorFor(name, fallback, maps) {
    var k = (name || '').toLowerCase();
    return maps.color[k] || fallback;
  }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var _dateFmt = 'us';
  function fmtDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    if (!m) return d || '';   // legacy free-text dates pass through untouched
    var mon = MONTHS[+m[2] - 1] || m[2], day = +m[3];
    return _dateFmt === 'intl' ? (day + ' ' + mon) : (mon + ' ' + day);
  }
  function fmtTime(t) {
    var m = /^(\d{2}):(\d{2})/.exec(t || '');
    if (!m) return t || '';
    if (_dateFmt === 'intl') return m[1] + ':' + m[2];
    var h = +m[1], ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return h + ':' + m[2] + ' ' + ap;
  }
  function whenText(m) {
    var parts = [];
    if (m.date) parts.push(fmtDate(m.date));
    if (m.time) parts.push(fmtTime(m.time));
    return (parts.join(' · ') || m.scheduledTime || '').trim();
  }

  function buildEntry(m, idx, maps, accentA, accentB) {
    var wrap = document.createElement('div');
    wrap.className = 'sch-entry-wrap';

    // Meta row: ON AIR / FINAL badge + date, centered above the card
    var when = whenText(m);
    var isFinal = !!(m.done && !m.live);
    if ((m.live || m.stream) || when || isFinal) {
      var meta = document.createElement('div'); meta.className = 'sch-entry-meta';
      if (isFinal) {
        var fin = document.createElement('div'); fin.className = 'sch-final'; fin.textContent = 'FINAL';
        meta.appendChild(fin);
      } else if (m.live || m.stream) {
        var badge = document.createElement('div'); badge.className = 'sch-onair';
        var dot = document.createElement('span'); dot.className = 'pdot'; badge.appendChild(dot);
        badge.appendChild(document.createTextNode(m.live ? 'LIVE' : 'ON AIR'));
        meta.appendChild(badge);
      }
      if (when && !isFinal) {   // finished matches read FINAL, not a scheduled time
        var dt = document.createElement('span'); dt.className = 'sch-meta-date'; dt.textContent = when;
        meta.appendChild(dt);
      }
      wrap.appendChild(meta);
    }

    var entry = document.createElement('div');
    entry.className = 'sch-entry' + (isFinal ? ' sch-done' : '');
    entry.style.animationDelay = (0.07 + idx * 0.09) + 's';

    var colA = colorFor(m.teamA, accentA, maps);
    var colB = colorFor(m.teamB, accentB, maps);
    entry.style.setProperty('--col-a', colA);
    entry.style.setProperty('--col-b', colB);

    // Side A
    var sideA = document.createElement('div'); sideA.className = 'sch-side a';
    var srcA = logoFor(m.teamA, m.logoA, maps) || svgFallback(m.teamA);
    var imgA = document.createElement('img'); imgA.className = 'sch-logo'; imgA.src = srcA; imgA.alt = '';
    if (SceneBase.isDefaultGameLogo(srcA)) imgA.classList.add('logo-on-dark');
    imgA.onerror = function () { this.style.visibility = 'hidden'; };
    var nameA = document.createElement('span'); nameA.className = 'sch-name'; nameA.textContent = m.teamA || 'TBD';
    sideA.appendChild(imgA); sideA.appendChild(nameA);

    // Center — final series score for a completed match, otherwise VS
    var hasScore = isFinal && m.scoreA != null && m.scoreB != null;
    var center = document.createElement('div'); center.className = 'sch-center';
    if (hasScore) {
      var sc = document.createElement('span'); sc.className = 'sch-score';
      sc.textContent = m.scoreA + ' – ' + m.scoreB;
      center.appendChild(sc);
    } else {
      var vs = document.createElement('span'); vs.className = 'sch-vs'; vs.textContent = 'VS';
      center.appendChild(vs);
    }

    // Side B
    var sideB = document.createElement('div'); sideB.className = 'sch-side b';
    var nameB = document.createElement('span'); nameB.className = 'sch-name'; nameB.textContent = m.teamB || 'TBD';
    var srcB = logoFor(m.teamB, m.logoB, maps) || svgFallback(m.teamB);
    var imgB = document.createElement('img'); imgB.className = 'sch-logo'; imgB.src = srcB; imgB.alt = '';
    if (SceneBase.isDefaultGameLogo(srcB)) imgB.classList.add('logo-on-dark');
    imgB.onerror = function () { this.style.visibility = 'hidden'; };
    sideB.appendChild(nameB); sideB.appendChild(imgB);

    // Highlight the winner + dim the loser on a finished match
    if (hasScore && m.scoreA !== m.scoreB) {
      (m.scoreA > m.scoreB ? sideA : sideB).classList.add('sch-win');
      (m.scoreA > m.scoreB ? sideB : sideA).classList.add('sch-lose');
    }

    entry.appendChild(sideA); entry.appendChild(center); entry.appendChild(sideB);
    wrap.appendChild(entry);
    return wrap;
  }

  function _num(v) { return (typeof v === 'number' && isFinite(v)) ? v : (v != null && v !== '' && !isNaN(+v) ? +v : null); }
  function buildMatches(queue, manual, maps, source, showResults) {
    // TEAM mode: the board follows the searched team's own matches only — ignore the stream queue.
    // LEAGUE mode (the live competition) is the same shape: the server builds the rows from the
    // league, and they REPLACE the start.gg queue rather than being appended to it.
    if (source === 'team' || source === 'league') {
      var tm = (manual || []).filter(function (m) {
        var s = typeof m.state === 'number' ? m.state : 2;
        return s !== 3 || showResults;   // hide completed unless "keep finished (with score)" is on
      }).map(function (m) {
        var s = typeof m.state === 'number' ? m.state : 2;
        return { setId: m.setId, round: m.round || '', teamA: m.teamA || 'TBD', teamB: m.teamB || 'TBD',
          logoA: logoFor(m.teamA, m.teamALogo || m.logoA, maps), logoB: logoFor(m.teamB, m.teamBLogo || m.logoB, maps),
          stream: !!(m.stream), live: !!(m.state === 2 || m.live), done: s === 3, scoreA: _num(m.scoreA), scoreB: _num(m.scoreB),
          date: m.date || '', time: m.time || '', scheduledTime: m.scheduledTime || '' };
      });
      // The league rows arrive already in broadcast order (live, soonest next, latest results).
      if (source === 'team') tm.sort(function (a, b) { return (b.live ? 1 : 0) - (a.live ? 1 : 0) || (a.done ? 1 : 0) - (b.done ? 1 : 0); });
      return tm.slice(0, 12);
    }
    var auto = (queue || []).filter(function (m) {
      var s = typeof m.state === 'number' ? m.state : (m.status === 'upcoming' ? 1 : (m.status === 'done' ? 3 : 2));
      return s === 1 || s === 2 || (showResults && s === 3);
    }).map(function (m) {
      var s = typeof m.state === 'number' ? m.state : (m.status === 'done' ? 3 : (m.status === 'upcoming' ? 1 : 2));
      return { setId: m.setId, round: m.round || '', teamA: m.teamA || 'TBD', teamB: m.teamB || 'TBD',
        logoA: logoFor(m.teamA, m.logoA, maps), logoB: logoFor(m.teamB, m.logoB, maps),
        stream: !!(m.stream), live: !!(m.state === 2 || m.live), done: s === 3, scoreA: _num(m.scoreA), scoreB: _num(m.scoreB),
        date: m.date || '', time: m.time || '', scheduledTime: '' };
    });
    var overrideMap = {}, appends = [];
    (manual || []).forEach(function (m) {
      if (m.setId) { overrideMap[m.setId] = m; }
      else appends.push({ round: m.round || '', teamA: m.teamA || 'TBD', teamB: m.teamB || 'TBD',
        logoA: logoFor(m.teamA, m.teamALogo || m.logoA, maps), logoB: logoFor(m.teamB, m.teamBLogo || m.logoB, maps),
        stream: !!(m.stream), live: false, done: (m.state === 3), scoreA: _num(m.scoreA), scoreB: _num(m.scoreB),
        date: m.date || '', time: m.time || '', scheduledTime: m.scheduledTime || '' });
    });
    var merged = auto.map(function (m) {
      var ov = overrideMap[m.setId]; if (!ov) return m;
      var mm = Object.assign({}, m, ov);
      mm.logoA = logoFor(mm.teamA, ov.teamALogo || ov.logoA || m.logoA, maps);
      mm.logoB = logoFor(mm.teamB, ov.teamBLogo || ov.logoB || m.logoB, maps);
      return mm;
    });
    merged.sort(function (a, b) { return (b.live ? 1 : 0) - (a.live ? 1 : 0); });
    var _pair = function (m) { return (m.teamA || '').toLowerCase().trim() + '|' + (m.teamB || '').toLowerCase().trim(); };
    var _rev  = function (m) { return (m.teamB || '').toLowerCase().trim() + '|' + (m.teamA || '').toLowerCase().trim(); };
    var _have = new Set(merged.map(_pair));
    var dedupAppends = appends.filter(function (m) { return !_have.has(_pair(m)) && !_have.has(_rev(m)); });
    return merged.concat(dedupAppends).slice(0, 12);
  }

  function render(data) {
    var stage = el('sch-stage'), list = el('sch-list'), empty = el('sch-empty');
    if (!stage || !list) return;
    if (SceneBase.preview && !((data.startgg && data.startgg.queue || []).length) && !((data.upcoming && data.upcoming.matches || []).length)) {
      var demo = SceneBase.demoState();
      data = Object.assign({}, data, { upcoming: demo.upcoming, startgg: Object.assign({}, data.startgg, demo.startgg) });
    }
    var up = data.upcoming || {};
    _dateFmt = data.dateFormat === 'intl' ? 'intl' : 'us';   // region setting (Settings page)
    stage.classList.add('show');
    document.documentElement.style.setProperty('--accent', SceneBase.brandColor(data));
    document.documentElement.style.setProperty('--accent-2', SceneBase.brandAccent(data));
    if (data.fontFamily) document.documentElement.style.fontFamily = "'" + data.fontFamily + "', 'Inter', system-ui, sans-serif";
    el('sch-title').textContent = (up.title || 'SCHEDULE').toUpperCase();
    el('sch-eyebrow').textContent = (up.eyebrow || 'On Deck').toUpperCase();
    var brandLogo = (data.brand && data.brand.logo) || '';
    var logoEl = el('sch-brand-logo');
    if (brandLogo) { logoEl.src = brandLogo; logoEl.style.display = ''; } else { logoEl.style.display = 'none'; logoEl.removeAttribute('src'); }

    var accentA = SceneBase.brandColor(data);
    var accentB = SceneBase.brandAccent(data);
    var mapsData = { saved: {}, sgg: (data.startgg && data.startgg.logoMap) || {}, color: {} };
    (data.savedTeams || []).forEach(function (t) {
      if (!t || !t.name) return; var k = t.name.toLowerCase();
      if (t.logo) mapsData.saved[k] = t.logo;
      if (t.color) mapsData.color[k] = t.color;
    });

    var raw = LAYOUT_QP || up.layout || 'cards';
    var isDual = raw === 'board' || raw === 'dual';
    var all = buildMatches((data.startgg || {}).queue, up.matches, mapsData, up.source, !!up.showResults);
    // Brand colors are baked into each card (--col-a/--col-b at build time), and the
    // brand payload can arrive AFTER the first paint (it rides the on-change library
    // tier) — without the accents in the sig the cards kept default colors until the
    // match list happened to change.
    var sig = JSON.stringify({ d: isDual, m: all, a: accentA, b: accentB, c: mapsData.color });
    if (sig === _lastSig) return;
    _lastSig = sig;
    var animatedBefore = list.dataset.animated === '1';
    list.className = 'sch-list' + (isDual ? ' dual' : '');
    if (animatedBefore) list.dataset.animated = '1';
    else setTimeout(function(){ list.dataset.animated = '1'; }, 1200);
    list.innerHTML = '';
    empty.style.display = all.length ? 'none' : 'block';
    all.forEach(function (m, i) { list.appendChild(buildEntry(m, i, mapsData, accentA, accentB)); });
  }

  SceneBase.connect((data) => { SceneBase.applySceneConfig('schedule', data); render(data); });
})();
</script>
</body>
</html>
