<!DOCTYPE html>
<html lang="en">
<!--
  intro.html — team line-up / starting roster card.
  Driven by full_state.intro { visible, side:'blue'|'orange', title, style }.
  Each player row resolves a photo: player.photo/image → playerProfiles[tag].image → team logo → initials.
  Socials (twitter, twitch) and country come from start.gg via playerProfiles.
  Event stats (G/A/S/GPG) come from the start.gg historical import in the stats DB.
  ?side=blue|orange overrides the configured side.
-->
<head>
  <meta charset="UTF-8">
  <title>NE Broadcast Suite — Line-up</title>
  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root {
      --duo-surface: #1a1d24; --duo-surface2: #20242e; --duo-border: #2e3340;
      --duo-accent: #e83a8b; --duo-accent2: #8b5cf6; --duo-text: #e8eaf0; --duo-muted: #8b93a8;
      --team-color: #055fdb;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: 'Rajdhani', 'Inter', system-ui, sans-serif; color: var(--duo-text);
      -webkit-font-smoothing: antialiased; }

    /* ── Stage ────────────────────────────────────────────────────────────── */
    #stage { position: absolute; inset: 0; display: flex; flex-direction: row;
      opacity: 0; transition: opacity .4s ease; }
    #stage.show { opacity: 1; }

    /* ── Top band: brand logo + event name above the team panels ─────────── */
    .lh-head {
      /* Right column only — the team panel keeps its full-height identity look. */
      position: absolute; top: 0; left: 520px; right: 0; z-index: 20; height: 84px;
      display: flex; align-items: center; justify-content: center; gap: 22px;
      background: rgba(5,7,14,.88);
      border-bottom: 1px solid rgba(255,255,255,.07);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      opacity: 0;
    }
    #stage.show .lh-head { animation: headIn .55s cubic-bezier(.16,.84,.24,1) .05s both; }
    @keyframes headIn { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
    .lh-head.is-empty { display: none; }
    .lh-head-logo { height: 46px; max-width: 230px; object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.55)); }
    .lh-head-sep { width: 1px; height: 38px; background: rgba(255,255,255,.16); }
    .lh-head-event { font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 900; font-size: 30px;
      letter-spacing: .08em; text-transform: uppercase; color: #fff;
      max-width: 1150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 14px rgba(0,0,0,.7); }
        #stage.has-head .lh-right { padding-top: 116px; }

    /* ── LEFT PANEL ───────────────────────────────────────────────────────── */
    .lh-left {
      width: 520px; flex-shrink: 0; position: relative; overflow: hidden;
      background: #040810;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 44px;
    }
    .lh-wash {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: linear-gradient(155deg,
        color-mix(in srgb, var(--team-color) 55%, transparent) 0%,
        color-mix(in srgb, var(--team-color) 24%, transparent) 48%,
        transparent 100%);
    }
    .lh-glow {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 80% 72% at 50% 46%,
        color-mix(in srgb, var(--team-color) 22%, transparent), transparent);
    }
    .lh-logo-bg {
      position: absolute; z-index: 1; pointer-events: none;
      top: 50%; left: 50%; width: 700px; height: 700px; object-fit: contain;
      opacity: 0; transform: translate(-50%, -50%) scale(.82);
      transition: opacity .9s ease .2s, transform .95s cubic-bezier(.16,.84,.24,1) .2s;
    }
    #stage.show .lh-logo-bg { opacity: .12; transform: translate(-50%, -50%) scale(1); }

    .lh-content {
      position: relative; z-index: 2; width: 100%;
      display: flex; flex-direction: column; align-items: center;
      opacity: 0;
    }
    #stage.show .lh-content { animation: contentIn .55s cubic-bezier(.16,.84,.24,1) .08s both; }
    @keyframes contentIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }

    .lh-logo-wrap { width: 192px; height: 192px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
    .lh-logo { width: 88%; height: 88%; object-fit: contain;
      filter: drop-shadow(0 0 36px color-mix(in srgb, var(--team-color) 60%, transparent))
              drop-shadow(0 6px 24px rgba(0,0,0,.85)); }
    .lh-logo.on-dark { filter: brightness(0) invert(1)
              drop-shadow(0 0 36px color-mix(in srgb, var(--team-color) 50%, transparent))
              drop-shadow(0 6px 24px rgba(0,0,0,.85)); }
    .lh-logo-init { font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 700; font-size: 88px;
      color: rgba(255,255,255,.9); text-transform: uppercase; line-height: 1;
      text-shadow: 0 0 48px color-mix(in srgb, var(--team-color) 65%, transparent),
                   0 4px 28px rgba(0,0,0,.8); }
    .lh-tname { font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 900;
      font-size: 40px; text-transform: uppercase; letter-spacing: .03em; color: #fff;
      text-align: center; line-height: 1.1; margin-bottom: 8px;
      text-shadow: 0 0 60px color-mix(in srgb, var(--team-color) 65%, transparent),
        0 4px 20px rgba(0,0,0,.95), 0 1px 4px rgba(0,0,0,.9);
      overflow-wrap: break-word; word-break: break-word; }
    .lh-sub { font-size: 13px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase;
      color: rgba(255,255,255,.38); text-align: center; margin-bottom: 28px; }
    /* Structured info stack — label left, value right, team-color accent edge */
    .lh-tstats { display: flex; flex-direction: column; gap: 9px; width: 100%; }
    .lh-tstats:empty { display: none; }
    .lh-info-row { display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 11px 16px; border-radius: 8px;
      background: linear-gradient(90deg, rgba(0,0,0,.42), rgba(0,0,0,.22));
      border: 1px solid rgba(255,255,255,.09);
      border-left: 3px solid var(--team-color); }
    .lh-info-row .k { font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(255,255,255,.45); white-space: nowrap; }
    .lh-info-row .v { font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 800; font-size: 24px;
      line-height: 1; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap;
      display: flex; align-items: center; gap: 8px; }
    /* Series hero row — the one number a lineup card is really about mid-series */
    .lh-info-row.hero {
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--team-color) 30%, rgba(0,0,0,.5)),
        color-mix(in srgb, var(--team-color) 10%, rgba(0,0,0,.3)));
      border-color: color-mix(in srgb, var(--team-color) 45%, transparent); }
    .lh-info-row.hero .v { font-size: 34px; font-weight: 900;
      text-shadow: 0 0 24px color-mix(in srgb, var(--team-color) 70%, transparent); }
    .lh-info-flag { width: 26px; height: 18px; object-fit: cover; border-radius: 2px;
      border: 1px solid rgba(255,255,255,.2); }
    /* Next-opponent block */
    .lh-vs { display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; margin-top: 20px; padding: 12px 16px; border-radius: 8px;
      background: rgba(0,0,0,.3); border: 1px dashed rgba(255,255,255,.14); }
    .lh-vs.is-empty { display: none; }
    .lh-vs .vs-lbl { font-size: 13px; font-weight: 900; letter-spacing: .24em;
      color: rgba(255,255,255,.4); }
    .lh-vs .vs-logo { width: 34px; height: 34px; object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
    .lh-vs .vs-logo.on-dark { filter: brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
    .lh-vs .vs-name { font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 800; font-size: 21px;
      text-transform: uppercase; color: rgba(255,255,255,.85);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
    .lh-vsep {
      position: absolute; top: 8%; right: 0; bottom: 8%; z-index: 3;
      width: 2px; pointer-events: none;
      background: linear-gradient(180deg, transparent, var(--team-color) 50%, transparent);
      box-shadow: 0 0 22px var(--team-color), 0 0 8px var(--team-color);
    }

    /* ── RIGHT PANEL ──────────────────────────────────────────────────────── */
    .lh-right { flex: 1; min-width: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 52px 60px; }
    #stage.has-foot .lh-right { padding-bottom: 100px; }
    

    .lh-right-lbl { font-size: 18px; font-weight: 900; letter-spacing: .28em; text-transform: uppercase;
      color: #fff; text-align: center; margin-bottom: 28px; flex-shrink: 0;
      width: 100%; max-width: 860px;
      text-shadow: 0 0 40px color-mix(in srgb, var(--team-color) 55%, transparent),
                   0 1px 8px rgba(0,0,0,.8); }

    /* ── Card list — natural height; right panel justify-content:center handles vertical position */
    .lh-rows { display: flex; flex-direction: column; gap: 10px;
      width: 100%; max-width: 860px; }

    /* ── Card grid: accent | avatar | name+info | status ──────────────────── */
    .lh-hdr, .lh-row { display: grid;
      grid-template-columns: 6px 140px 1fr auto;
      align-items: center; }

    .lh-rows.has-stats .lh-hdr,
    .lh-rows.has-stats .lh-row {
      grid-template-columns: 6px 140px 1fr auto 70px 70px 70px 88px; }

    /* Header row */
    .lh-hdr { display: none; }
    .lh-rows.has-stats .lh-hdr { display: grid; height: 0; margin-bottom: 2px; align-items: end; }
    .lh-hdr-cell { display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
      padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .lh-hdr-cell.col-g   { color: rgba(244,208,64,.7); }
    .lh-hdr-cell.col-a   { color: rgba(147,197,253,.7); }
    .lh-hdr-cell.col-s   { color: rgba(110,231,183,.65); }
    .lh-hdr-cell.col-gpg { color: rgba(255,255,255,.35); }

    /* ── Player card ─────────────────────────────────────────────────────── */
    .lh-row {
      min-height: 140px;
      position: relative; overflow: hidden;
      background: linear-gradient(90deg, rgba(4,8,18,.96) 0%, rgba(8,12,24,.84) 60%, rgba(6,10,20,.78) 100%);
      border: 1px solid rgba(255,255,255,.07);
      border-left: none;
      border-radius: 8px;
      opacity: 0;
    }
    .lh-row.is-sub { border-color: rgba(246,173,85,.14); }
    #stage.show .lh-row { animation: rowIn .48s cubic-bezier(.16,.84,.24,1) both; }
    @keyframes rowIn { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }

    /* Left accent bar (col 1) — must stretch full card height regardless of align-items */
    .lh-accent {
      align-self: stretch;
      background: var(--team-color);
      border-radius: 8px 0 0 8px;
      box-shadow: 6px 0 28px color-mix(in srgb, var(--team-color) 65%, transparent);
    }
    .lh-row.is-cap .lh-accent {
      background: linear-gradient(180deg, var(--duo-accent), var(--duo-accent2));
      box-shadow: 6px 0 24px color-mix(in srgb, var(--duo-accent) 60%, transparent);
    }
    .lh-row.is-sub .lh-accent {
      background: rgba(246,173,85,.65);
      box-shadow: 6px 0 18px rgba(246,173,85,.28);
    }

    /* Avatar (col 2) — square: width and height both 140px */
    .lh-avatar-wrap { position: relative; width: 140px; height: 140px; align-self: center; flex-shrink: 0; }
    .lh-avatar { width: 100%; height: 100%; background: rgba(255,255,255,.04);
      border-right: 1px solid rgba(255,255,255,.07);
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      box-shadow: inset -24px 0 48px color-mix(in srgb, var(--team-color) 24%, transparent); }
    .lh-avatar img.face { position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: top center; }
    .lh-avatar .logo-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .lh-avatar .logo-ph img { width: 48%; height: 48%; object-fit: contain; opacity: .55; }
    .lh-avatar .logo-ph.on-dark img { filter: brightness(0) invert(1); opacity: .4; }
    .lh-avatar .init-text { font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 700;
      font-size: 36px; color: var(--team-color); text-transform: uppercase; }

    /* Name block (col 3) */
    .lh-name-block { display: flex; flex-direction: column; justify-content: center;
      gap: 8px; min-width: 0; padding: 16px 20px; align-self: center; }
    .lh-pname-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .lh-pname { font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 800;
      font-size: 32px; line-height: 1; text-transform: uppercase; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 14px rgba(0,0,0,.7),
                   0 0 28px color-mix(in srgb, var(--team-color) 38%, transparent); }
    .lh-role-badge { font-size: 9px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
      padding: 4px 9px; border-radius: 3px; color: rgba(255,255,255,.7); flex-shrink: 0;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); white-space: nowrap; }
    .lh-role-badge.is-cap { background: linear-gradient(135deg, var(--duo-accent), var(--duo-accent2)); color: #fff; border-color: transparent; }

    /* Real name line — shown when intro.showRealName is enabled */
    .lh-realname { font-size: 15px; font-weight: 500; letter-spacing: .03em;
      color: rgba(255,255,255,.4); text-transform: none; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; margin-top: -4px; }

    /* Country row */
    .lh-country-row { display: flex; align-items: center; gap: 8px; }
    .lh-flag-inline { width: 27px; height: 18px; border-radius: 2px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.22); flex-shrink: 0; }
    .lh-flag-inline img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lh-country-name { font-size: 15px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      color: rgba(255,255,255,.72); white-space: nowrap; }

    /* Socials — platform LOGOS (X / Twitch marks), not text pills */
    .lh-socials-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .lh-social { display: inline-flex; align-items: center; gap: 7px;
      font-size: 15px; font-weight: 700; white-space: nowrap; }
    .lh-social .icon { width: 17px; height: 17px; flex-shrink: 0; display: inline-flex; }
    .lh-social .icon svg { width: 100%; height: 100%; }
    .lh-social.tw .icon svg { fill: #e7e9ea; }
    .lh-social.tt .icon svg { fill: #9147ff; }
    .lh-social .handle { color: rgba(255,255,255,.65); }

    /* Status badge column (col 4) */
    .lh-status-col {
      align-self: stretch;
      display: flex; align-items: center; justify-content: center;
      padding: 0 20px 0 12px;
    }
    .lh-status-badge {
      font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
      padding: 6px 14px; border-radius: 4px; white-space: nowrap;
      flex-shrink: 0;
    }
    .lh-status-badge.badge-starter {
      background: color-mix(in srgb, var(--team-color) 28%, transparent);
      border: 1px solid color-mix(in srgb, var(--team-color) 50%, transparent);
      color: color-mix(in srgb, var(--team-color) 100%, #fff 60%);
    }
    .lh-row.is-cap .lh-status-badge.badge-starter {
      background: linear-gradient(135deg, color-mix(in srgb, var(--duo-accent) 30%, transparent), color-mix(in srgb, var(--duo-accent2) 30%, transparent));
      border-color: color-mix(in srgb, var(--duo-accent) 45%, transparent);
      color: var(--duo-accent);
    }
    .lh-status-badge.badge-sub {
      background: rgba(246,173,85,.12);
      border: 1px solid rgba(246,173,85,.3);
      color: #f6ad55;
    }
    .lh-status-badge.badge-alt {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.38);
    }

    /* ── Stat columns (hidden unless .has-stats) ─────────────────────────── */
    .lh-sc { display: none; align-self: stretch; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .lh-rows.has-stats .lh-sc { display: flex; }
    .lh-sc.col-g   { background: rgba(244,208,64,.08); border-left: 1px solid rgba(244,208,64,.12); }
    .lh-sc.col-a   { background: rgba(147,197,253,.07); border-left: 1px solid rgba(147,197,253,.1); }
    .lh-sc.col-s   { background: rgba(110,231,183,.07); border-left: 1px solid rgba(110,231,183,.1); }
    .lh-sc.col-gpg { background: rgba(255,255,255,.04); border-left: 1px solid rgba(255,255,255,.07); }
    .lh-sn { font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 900;
      font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
    .lh-sc.col-g   .lh-sn { color: #f4d060; text-shadow: 0 0 20px rgba(244,208,64,.5); }
    .lh-sc.col-a   .lh-sn { color: #93c5fd; text-shadow: 0 0 20px rgba(147,197,253,.4); }
    .lh-sc.col-s   .lh-sn { color: #6ee7b7; text-shadow: 0 0 20px rgba(110,231,183,.35); }
    .lh-sc.col-gpg .lh-sn { color: rgba(255,255,255,.8); font-size: 22px; }
    .lh-sl { font-size: 7px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(255,255,255,.28); }

    /* ── Sponsor footer ──────────────────────────────────────────────────── */
    .lh-foot {
      /* Right column only: starts past the 520px team panel so the sponsor rail
         is centered under the roster, not the whole scene. */
      position: absolute; bottom: 0; left: 520px; right: 0; z-index: 20;
      height: 68px;
      background: rgba(5,7,14,.88);
      border-top: 1px solid rgba(255,255,255,.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center; gap: 52px;
      padding: 0 80px;
      opacity: 0;
    }
    #stage.show .lh-foot { animation: footIn .6s cubic-bezier(.16,.84,.24,1) .5s both; }
    @keyframes footIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .lh-foot.is-empty { display: none; }
    .lh-sponsors { display: flex; align-items: center; gap: 52px; }
    .lh-sponsors.is-empty { display: none; }
    .lh-sponsor { height: 34px; max-width: 130px; object-fit: contain; opacity: .82;
      filter: drop-shadow(0 1px 6px rgba(0,0,0,.4)); }
  </style>
</head>
<body>
  <div id="stage">

    <!-- TOP BAND: brand logo + event name -->
    <div class="lh-head is-empty" id="lh-head">
      <img class="lh-head-logo" id="lh-head-logo" alt="" style="display:none">
      <div class="lh-head-sep" id="lh-head-sep" style="display:none"></div>
      <div class="lh-head-event" id="lh-head-event"></div>
    </div>

    <!-- LEFT: team identity panel -->
    <div class="lh-left">
      <div class="lh-wash" aria-hidden="true"></div>
      <div class="lh-glow" aria-hidden="true"></div>
      <img class="lh-logo-bg" id="lh-logo-bg" alt="" aria-hidden="true">

      <div class="lh-content">
        <div class="lh-logo-wrap">
          <img class="lh-logo" id="lh-logo" alt="" style="display:none">
          <span class="lh-logo-init" id="lh-logo-init">T</span>
        </div>
        <div class="lh-tname" id="lh-tname">TEAM</div>
        <div class="lh-sub" id="lh-sub">STARTING LINE-UP</div>
        <div class="lh-tstats" id="lh-tstats"></div>
        <div class="lh-vs is-empty" id="lh-vs">
          <span class="vs-lbl">VS</span>
          <img class="vs-logo" id="lh-vs-logo" alt="" style="display:none">
          <span class="vs-name" id="lh-vs-name"></span>
        </div>
      </div>

      <div class="lh-vsep" aria-hidden="true"></div>
    </div>

    <!-- RIGHT: roster cards -->
    <div class="lh-right">
      <div class="lh-right-lbl" id="lh-right-lbl">Starting Lineup</div>
      <div class="lh-rows" id="lh-rows"></div>
    </div>

    <!-- SPONSOR RAIL -->
    <div class="lh-foot is-empty" id="lh-foot">
      <div class="lh-sponsors is-empty" id="lh-sponsors"></div>
    </div>

  </div>

  <script src="scene-base.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    const stage = el('stage'), rows = el('lh-rows');
    const sideOverride = SceneBase.qp('side');
    let _sig = '';
    let _lastData = null;

    const _evCache = {};
    function _evKey(tag, evName) { return tag.toLowerCase() + '::' + evName.toLowerCase(); }
    function _evStat(tag, evName) { return evName && tag ? _evCache[_evKey(tag, evName)] : null; }
    function _fetchEventStats(players, evName) {
      if (!evName) return;
      let pending = 0;
      players.map((p) => (p.gamerTag || p.name || '').trim()).filter(Boolean).forEach((tag) => {
        const key = _evKey(tag, evName);
        if (key in _evCache) return;
        _evCache[key] = 'loading';
        pending++;
        fetch('http://localhost:3000/api/stats/player-event?name=' + encodeURIComponent(tag) + '&tournament=' + encodeURIComponent(evName))
          .then((r) => r.json())
          .then((d) => { _evCache[key] = (d && d.stats && d.stats.games > 0) ? d.stats : null; })
          .catch(() => { _evCache[key] = null; })
          .finally(() => { if (--pending === 0 && _lastData) { _sig = ''; render(_lastData); } });
      });
    }

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
    const SVG_X = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z"/></svg>';
    const SVG_TWITCH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>';
    function initials(name) { const w = (name || '?').trim().split(/\s+/); return ((w[0]||'?')[0] + (w[1] ? w[1][0] : '')).toUpperCase(); }
    const COUNTRY_NAMES = { US:'USA', CA:'Canada', GB:'UK', IE:'Ireland', AU:'Australia', NZ:'New Zealand',
      DE:'Germany', FR:'France', SE:'Sweden', NO:'Norway', DK:'Denmark', FI:'Finland', IS:'Iceland',
      NL:'Netherlands', BE:'Belgium', CH:'Switzerland', AT:'Austria', ES:'Spain', PT:'Portugal', IT:'Italy',
      GR:'Greece', PL:'Poland', CZ:'Czechia', HU:'Hungary', RO:'Romania', UA:'Ukraine', RU:'Russia', TR:'Turkey',
      IL:'Israel', ZA:'South Africa', NG:'Nigeria', BR:'Brazil', MX:'Mexico', AR:'Argentina', CL:'Chile',
      CO:'Colombia', PE:'Peru', VE:'Venezuela', EC:'Ecuador', JP:'Japan', KR:'Korea', CN:'China',
      TW:'Taiwan', HK:'Hong Kong', SG:'Singapore', ID:'Indonesia', MY:'Malaysia', PH:'Philippines',
      TH:'Thailand', VN:'Vietnam', IN:'India', PK:'Pakistan' };
    function countryName(cc) { return COUNTRY_NAMES[(cc || '').toUpperCase()] || ''; }
    function flagSrc(cc) { return 'https://flagcdn.com/w40/' + (cc || '').toLowerCase() + '.png'; }
    function profileFor(data, p) {
      const tag = (p.gamerTag || p.name || '').trim().toLowerCase();
      return (tag && data.playerProfiles && data.playerProfiles[tag]) || null;
    }
    function teamCountry(players, data) {
      const ccs = players.map((p) => { const pr = profileFor(data, p); return pr && pr.countryCode; }).filter(Boolean);
      if (!ccs.length) return '';
      const uniq = [...new Set(ccs.map((c) => c.toUpperCase()))];
      return uniq.length === 1 ? uniq[0] : '';
    }

    function render(data) {
      data = data || {};
      _lastData = data;
      const intro = data.intro || {};
      const root = document.documentElement;
      const color = SceneBase.brandColor(data), accent2 = SceneBase.brandAccent(data);
      if (color) root.style.setProperty('--duo-accent', color);
      if (accent2) root.style.setProperty('--duo-accent2', accent2);
      if (data.fontFamily) root.style.fontFamily = `'${data.fontFamily}', 'Rajdhani', 'Inter', system-ui, sans-serif`;

      stage.classList.add('show');

      const side = (sideOverride === 'blue' || sideOverride === 'orange') ? sideOverride : (intro.side || 'blue');
      const team = SceneBase.teamSide(data, side);
      const brand = data.brand || {};
      const ad = data.scoreboardAd || {};
      const _anyTagged = (brand.deskSponsors || []).length || (brand.railSponsors || []).length || (brand.bannerSponsors || []).length;
      const _rawSpons = (brand.deskSponsors || []).length ? brand.deskSponsors : (_anyTagged ? [] : (brand.sponsors || []));
      const _seenSp = new Set(ad.logo ? [ad.logo] : []);
      const _brandSpons = (Array.isArray(_rawSpons) ? _rawSpons : []).filter((s) => s && s.logo && !_seenSp.has(s.logo) && (_seenSp.add(s.logo), true));
      const spons = ad.logo ? [{ logo: ad.logo, name: ad.label || '' }, ..._brandSpons] : _brandSpons;
      const ev = data.activeEvent || {};
      const evName = (ev.name || '').trim();
      const standings = (data.bracket && Array.isArray(data.bracket.standings)) ? data.bracket.standings : [];
      const tnameLow = (team.name || '').toLowerCase().trim();
      const bst = tnameLow ? standings.find((s) => {
        const sn = (s.name || '').toLowerCase().trim();
        return sn && (sn.includes(tnameLow) || tnameLow.includes(sn));
      }) : null;
      const players = (team.players && team.players.length) ? team.players : [{ name: 'TBD' }];

      _fetchEventStats(players, evName);
      const evLoaded = evName ? players.filter((p) => {
        const t = (p.gamerTag || p.name || '').trim();
        return t && typeof _evStat(t, evName) === 'object' && _evStat(t, evName) !== null;
      }).length : 0;

      const sig = JSON.stringify({ side, name: team.name, logo: team.logo, color: team.color,
        players: team.players,
        pp: data.playerProfiles ? Object.values(data.playerProfiles).map(p => [(p.image || '').slice(20, 44), p.twitter||'', p.twitch||''].join('~')).join('|') : '',
        showRealName: !!intro.showRealName,
        sp: spons.map((s) => s && s.logo).join(','),
        foot: intro.showFooter === true,
        tr: (data.teamRecords || {}).enabled ? (data.teamRecords[side] || '') : '',
        ev: evName,
        hd: ((data.eventName || '') + '|' + (SceneBase.brandLogo(data) || '').slice(0, 48)),
        ser: (data.series ? (data.series.blue || 0) + '-' + (data.series.orange || 0) : '') + ':' + ((data.match || {}).seriesVisible !== false),
        fmt: ((data.match || {}).format || ''),
        opp: (() => { const o = SceneBase.teamSide(data, side === 'blue' ? 'orange' : 'blue') || {}; return (o.name || '') + '|' + ((o.customLogo || o.logo || '')).slice(0, 40); })(),
        bst: bst ? `${bst.wins||0}-${bst.losses||0}:${bst.placement||0}` : '',
        evL: evLoaded });
      if (sig === _sig) return;
      _sig = sig;

      root.style.setProperty('--team-color', team.color);

      // ── Left panel ──────────────────────────────────────────────────────
      const hasLogo = !!(team.customLogo || team.logo);
      const logoEl = el('lh-logo'), logoInitEl = el('lh-logo-init'), logoBgEl = el('lh-logo-bg');
      if (hasLogo) {
        SceneBase.applyTeamLogo(logoEl, team.customLogo, team.logo);
        SceneBase.applyTeamLogo(logoBgEl, team.customLogo, team.logo);
        logoEl.classList.toggle('on-dark', !!team.logoOnDark);
        logoEl.style.display = ''; logoInitEl.style.display = 'none'; logoBgEl.style.display = '';
      } else {
        logoEl.style.display = 'none'; logoBgEl.style.display = 'none';
        logoInitEl.style.display = '';
        logoInitEl.textContent = (team.name || 'T')[0].toUpperCase();
      }
      el('lh-tname').textContent = (team.name || 'TEAM').toUpperCase();
      el('lh-right-lbl').textContent = (intro.title || 'Starting Lineup');

      const tr = data.teamRecords || {};
      const record = tr.enabled ? (tr[side] || '') : '';
      el('lh-sub').textContent = (intro.title || 'STARTING LINE-UP').toUpperCase();

      const row = (k, v, cls) => `<div class="lh-info-row${cls ? ' ' + cls : ''}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
      const ts = [];
      // Series hero — the scoreboard series counter, this team's games first.
      // Hidden at 0-0 (nothing to say pre-series) and when the total is impossible
      // for the configured format (stale carry-over from a previous series).
      const ser = data.series || {};
      const sb = Number(ser.blue) || 0, so = Number(ser.orange) || 0;
      const serMine = side === 'blue' ? sb : so, serTheirs = side === 'blue' ? so : sb;
      const fmt = ((data.match || {}).format || '').trim();
      const fmtN = (() => { const m = fmt.match(/(\d+)/); return m ? parseInt(m[1], 10) : 0; })();
      const winsNeeded = fmtN ? Math.floor(fmtN / 2) + 1 : 0;
      const serOn = (data.match || {}).seriesVisible !== false && (sb + so) > 0
        && (!fmtN || (sb + so) <= fmtN);
      if (serOn) ts.push(row('Series', `${serMine} – ${serTheirs}`, 'hero'));
      if (fmt) ts.push(row('Format', esc(fmt.toUpperCase())));
      // Next Game only when it provably exists: format known, series undecided,
      // and the game number fits the format — never "Game 7" in a BO5.
      const nextGame = sb + so + 1;
      const decided = winsNeeded && Math.max(serMine, serTheirs) >= winsNeeded;
      if (serOn && winsNeeded && !decided && nextGame <= fmtN) ts.push(row('Next Game', 'Game ' + nextGame));
      if (bst && (bst.wins != null || bst.losses != null)) {
        ts.push(row('Event Record', `${bst.wins || 0} – ${bst.losses || 0}`));
        if (bst.placement) ts.push(row('Seed', '#' + bst.placement));
      }
      if (record) ts.push(row('Season', esc(record)));
      const cc = teamCountry(players, data);
      if (cc) ts.push(row('Country', `<img class="lh-info-flag" src="${flagSrc(cc)}" alt="" onerror="this.style.display='none'">${esc(countryName(cc) || cc)}`));
      el('lh-tstats').innerHTML = ts.join('');

      // Next opponent — the other side of the scoreboard, when it's a real team
      const opp = SceneBase.teamSide(data, side === 'blue' ? 'orange' : 'blue') || {};
      const oppReal = opp.name && !/^(blue|orange) team$/i.test(opp.name.trim()) && opp.name.trim().toLowerCase() !== tnameLow;
      const vsEl = el('lh-vs'), vsLogo = el('lh-vs-logo');
      if (oppReal) {
        el('lh-vs-name').textContent = opp.name.toUpperCase();
        if (opp.customLogo || opp.logo) {
          SceneBase.applyTeamLogo(vsLogo, opp.customLogo, opp.logo);
          vsLogo.classList.toggle('on-dark', !!opp.logoOnDark);
          vsLogo.style.display = '';
        } else vsLogo.style.display = 'none';
      }
      vsEl.classList.toggle('is-empty', !oppReal);

      // Top band: brand logo + full event name
      const brandLogo = SceneBase.brandLogo(data);
      const evTitle = ((data.eventName || '').trim()) || evName;
      const headEl = el('lh-head'), headLogo = el('lh-head-logo'), headSep = el('lh-head-sep');
      if (brandLogo) { headLogo.src = brandLogo; headLogo.style.display = ''; } else { headLogo.style.display = 'none'; }
      el('lh-head-event').textContent = evTitle.toUpperCase();
      headSep.style.display = (brandLogo && evTitle) ? '' : 'none';
      const hasHead = !!(brandLogo || evTitle);
      headEl.classList.toggle('is-empty', !hasHead);
      stage.classList.toggle('has-head', hasHead);

      if (intro.showFooter !== true) {
        el('lh-foot').style.display = 'none'; stage.classList.remove('has-foot');
      } else {
        el('lh-foot').style.display = ''; renderFooter(spons);
      }

      // ── Player cards ─────────────────────────────────────────────────────
      rows.innerHTML = '';

      const anyStats = evName && players.some((p) => {
        const t = (p.gamerTag || p.name || '').trim();
        const es = _evStat(t, evName);
        return es && typeof es === 'object' && es.games > 0;
      });
      rows.classList.toggle('has-stats', anyStats);

      if (anyStats) {
        const hdr = document.createElement('div');
        hdr.className = 'lh-hdr';
        hdr.innerHTML = '<div></div><div></div><div></div><div></div>'
          + '<div class="lh-hdr-cell col-g">G</div>'
          + '<div class="lh-hdr-cell col-a">A</div>'
          + '<div class="lh-hdr-cell col-s">S</div>'
          + '<div class="lh-hdr-cell col-gpg">GPG</div>';
        rows.appendChild(hdr);
      }

      players.forEach((p, i) => {
        const prof = profileFor(data, p) || {};
        const photo = p.photo || p.image || prof.image || '';
        const role = (p.role || '').toString().trim();

        // Status — p.status ('starter'|'sub') takes priority, fall back to role string
        const statusRaw = (p.status || '').toLowerCase();
        const roleLC = role.toLowerCase();
        const isCap = /cap|\(c\)|captain/.test(roleLC);
        const isSub = statusRaw === 'sub' || /\bsub\b|substitute|6th|reserve/.test(roleLC);
        const isAlt = /\balt\b|alternate|standin|stand-in/.test(roleLC);

        let statusLabel, statusClass;
        if (isCap) { statusLabel = 'Starter'; statusClass = 'badge-starter'; }   // CAPTAIN already badged by the name
        else if (isSub) { statusLabel = 'Sub'; statusClass = 'badge-sub'; }
        else if (isAlt) { statusLabel = 'Alternate'; statusClass = 'badge-alt'; }
        else { statusLabel = 'Starter'; statusClass = 'badge-starter'; }

        // Role badge next to name — only for non-trivial role labels
        const showRoleBadge = role && !/^(starter|sub|substitute|alternate|alt|reserve|stand-in|standin)$/i.test(role);
        const roleBadgeHtml = showRoleBadge
          ? `<span class="lh-role-badge${isCap ? ' is-cap' : ''}">${esc(role)}</span>`
          : '';

        // Country from start.gg via playerProfiles
        const pcc = ((prof.countryCode || p.country || '').toUpperCase()).slice(0, 2);

        // Avatar
        let avatarInner;
        if (photo) {
          avatarInner = `<img class="face" src="${esc(photo)}" alt="" onerror="this.remove()">`;
        } else if (team.logo) {
          avatarInner = `<div class="logo-ph ${team.logoOnDark ? 'on-dark' : ''}"><img src="${esc(team.logo)}" alt=""></div>`;
        } else {
          avatarInner = `<div class="init-text">${esc(initials(p.name || p.gamerTag))}</div>`;
        }

        const name = (p.name || p.gamerTag || ('Player ' + (i + 1))).toString();
        const showRealName = !!intro.showRealName;
        const realName = (p.realName || prof.realName || '').trim();

        // Real name line (optional, shown when intro.showRealName is on)
        const realNameHtml = showRealName && realName
          ? `<span class="lh-realname">${esc(realName)}</span>`
          : '';

        // Country row — flag + name (no rank)
        let countryHtml = '';
        if (pcc) {
          countryHtml = `<div class="lh-country-row">`
            + `<div class="lh-flag-inline"><img src="${flagSrc(pcc)}" alt="" onerror="this.parentNode.style.display='none'"></div>`
            + `<span class="lh-country-name">${esc(countryName(pcc) || pcc)}</span>`
            + `</div>`;
        }

        // Social handles — show whichever are available (Twitter, Twitch, or both)
        const tw = (p.twitter || prof.twitter || '').replace(/^@/, '').trim();
        const tt = (p.twitch  || prof.twitch  || '').replace(/^@/, '').trim();
        let socialsHtml = '';
        if (tw || tt) {
          socialsHtml = `<div class="lh-socials-row">`;
          if (tw) socialsHtml += `<span class="lh-social tw"><span class="icon">${SVG_X}</span><span class="handle">@${esc(tw)}</span></span>`;
          if (tt) socialsHtml += `<span class="lh-social tt"><span class="icon">${SVG_TWITCH}</span><span class="handle">${esc(tt)}</span></span>`;
          socialsHtml += `</div>`;
        }

        // Stat columns (from start.gg historical import)
        const evSt = _evStat((p.gamerTag || p.name || '').toString().trim(), evName);
        const hs = evSt && typeof evSt === 'object' && evSt.games > 0;
        function sc(cls, val, lbl) {
          return `<div class="lh-sc ${cls}"><span class="lh-sn">${val}</span><span class="lh-sl">${lbl}</span></div>`;
        }

        const cardCls = ['lh-row', isCap ? 'is-cap' : '', isSub ? 'is-sub' : ''].filter(Boolean).join(' ');
        const row = document.createElement('div');
        row.className = cardCls;
        row.style.animationDelay = (0.15 + i * 0.1) + 's';
        row.innerHTML =
          `<div class="lh-accent"></div>`
          + `<div class="lh-avatar-wrap"><div class="lh-avatar">${avatarInner}</div></div>`
          + `<div class="lh-name-block">`
            + `<div class="lh-pname-row"><span class="lh-pname">${esc(name)}</span>${roleBadgeHtml}</div>`
            + realNameHtml
            + countryHtml
            + socialsHtml
          + `</div>`
          + `<div class="lh-status-col"><span class="lh-status-badge ${statusClass}">${esc(statusLabel)}</span></div>`
          + sc('col-g',   hs ? evSt.goals   : '—', 'G')
          + sc('col-a',   hs ? evSt.assists : '—', 'A')
          + sc('col-s',   hs ? evSt.saves   : '—', 'S')
          + sc('col-gpg', hs ? evSt.gpg     : '—', 'GPG');
        rows.appendChild(row);
      });
    }

    function renderFooter(spons) {
      const sponsors = (spons || []).filter((s) => s && s.logo);
      const sp = el('lh-sponsors');
      sp.innerHTML = sponsors.map((s) => `<img class="lh-sponsor" src="${esc(s.logo)}" alt="${esc(s.name || '')}">`).join('');
      sp.classList.toggle('is-empty', !sponsors.length);
      el('lh-foot').classList.toggle('is-empty', !sponsors.length);
      stage.classList.toggle('has-foot', !!sponsors.length);
    }

    SceneBase.connect((data) => { SceneBase.applySceneConfig('intro', data); render(data); });

    if (location.protocol === 'file:') {
      document.documentElement.classList.add('preview');
      const _prevEv = 'rocket rush season 6';
      [['aqua', { games:8, wins:6, goals:14, assists:8, saves:11, gpg:1.8 }],
       ['nova', { games:8, wins:6, goals:9, assists:12, saves:18, gpg:1.1 }],
       ['rhythm', { games:7, wins:5, goals:7, assists:6, saves:14, gpg:1.0 }],
       ['echo', { games:6, wins:4, goals:5, assists:9, saves:16, gpg:0.8 }]].forEach(([t,s]) => {
        _evCache[_evKey(t, _prevEv)] = s;
      });
      render({
        teams: { orange: { name: 'Ember Rising', color: '#e97139', logo: null, players: [] },
          blue: { name: 'Frost Esports', color: '#3b82f6', logo: null, players: [
          { name: 'Aqua',   gamerTag: 'Aqua',   role: 'Captain', status: 'starter', realName: 'James Carter' },
          { name: 'Nova',   gamerTag: 'Nova',   role: '',        status: 'starter', realName: 'Lena Park' },
          { name: 'Rhythm', gamerTag: 'Rhythm', role: '',        status: 'starter', realName: '' },
          { name: 'Echo',   gamerTag: 'Echo',   role: '',        status: 'sub',     realName: 'Marco Silva' }
        ] } },
        playerProfiles: {
          aqua:   { gamerTag: 'Aqua',   countryCode: 'us', twitter: 'AquaRL',  twitch: 'aquarl' },
          nova:   { gamerTag: 'Nova',   countryCode: 'ca', twitter: 'NovaGG',  twitch: '' },
          rhythm: { gamerTag: 'Rhythm', countryCode: 'gb', twitter: '',        twitch: 'rhythmgg' },
          echo:   { gamerTag: 'Echo',   countryCode: 'de', twitter: '',        twitch: '' }
        },
        brand: { sponsors: [] },
        scoreboardAd: {},
        teamRecords: { enabled: true, blue: '14-3' },
        series: { blue: 2, orange: 1 },
        match: { seriesVisible: true, format: 'BO5' },
        activeEvent: { platform: 'startgg', name: 'Rocket Rush Season 6', numEntrants: 24 },
        bracket: { standings: [{ name: 'Frost Esports', wins: 3, losses: 1, placement: 2 }] },
        intro: { visible: true, side: 'blue', title: 'Starting Line-up', showFooter: false, showRealName: true }
      });
      stage.classList.add('show');
    }
  </script>
</body>
</html>
