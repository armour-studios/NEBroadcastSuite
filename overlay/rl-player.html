<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>RL Player HUD</title>
<!--
  PLAYER / IN-GAME Rocket League HUD (overlay/rl-player.html).

  A third RL layout, for a user running the overlay on their OWN gameplay PC (not a broadcast observer):
  - Follows the LOCAL player. While you're in a match the RL Stats API reports YOUR data as the "target",
    so state.spectatedPlayer resolves to you; teamOf(you) = "my team", the other side is the opponent.
  - Shows ONLY your team's boost — the opponent's boost is never drawn.
  - A LARGE bottom-right card (you + a teammate row) sized to blanket the in-game boost gauge / stat corner.

  Connects to the SAME WS bridge (:3001) and consumes the SAME full_state / state_update as rl-hud.html —
  no server changes, it's purely a different presentation. Preview with ?dev (no server needed).

  DATA NOTE: the Stats API only reports Boost for the player the camera is on — which, while you play, is
  YOU. Teammate SCORE/GOALS/etc are in every packet, but a teammate's live boost may be absent; the boost
  bar for a mate only draws when the feed actually carries it.
-->
<style>
:root{
  --blue:#2f8dff; --orange:#ff7a33;
  /* FULLY OPAQUE throughout — this HUD's job is to COVER Rocket League's own UI (boost gauge, timer),
     so nothing here may be see-through or the in-game HUD bleeds up through it. */
  --glass:rgb(16,20,31); --glass-2:rgb(21,26,40);
  --panel-1:rgb(20,23,31); --panel-2:rgb(11,13,19);
  --hair:rgba(255,255,255,.09); --txt:#f4f7ff; --muted:rgba(206,216,238,.6);
  --me:var(--blue);   /* accent for the local player's team, set from live colours */
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
body{position:relative;font-family:'Bourgeois','Segoe UI',system-ui,sans-serif;color:var(--txt);
  -webkit-font-smoothing:antialiased;}
img{display:block;}
.hidden{display:none !important;}

/* ── TOP SCOREBAR (compact, both teams; my side gets the accent underline) ─────── */
.scorebar{position:absolute;top:0;left:50%;transform:translateX(-50%);   /* flush to the very top */
  display:flex;align-items:stretch;height:74px;border-radius:0 0 14px 14px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel-1),var(--panel-2));
  border:1px solid var(--hair);border-top:none;box-shadow:0 12px 34px rgba(0,0,0,.55);
  animation:drop .5s cubic-bezier(.2,.7,.3,1) backwards;}
@keyframes drop{from{opacity:0;transform:translateX(-50%) translateY(-16px);}}
.team{position:relative;display:flex;align-items:center;gap:13px;padding:0 22px;width:340px;overflow:hidden;}
.team.orange{justify-content:flex-end;}
.team.blue{background:linear-gradient(90deg,color-mix(in srgb,var(--blue) 34%,transparent),transparent 82%);}
.team.orange{background:linear-gradient(270deg,color-mix(in srgb,var(--orange) 26%,transparent),transparent 82%);}
.team::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;opacity:.35;}
.team.blue::after{background:var(--blue);} .team.orange::after{background:var(--orange);}
.team.mine::after{opacity:1;height:5px;box-shadow:0 0 12px currentColor;}
.team.blue.mine::after{color:var(--blue);} .team.orange.mine::after{color:var(--orange);}
.tlogo{width:52px;height:52px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.55));}
.tmeta{display:flex;flex-direction:column;min-width:0;gap:3px;}
.tname{font-size:24px;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1;}
.you-chip{font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#0b0e16;
  background:currentColor;border-radius:4px;padding:2px 6px;width:max-content;}
.team.blue .you-chip{color:var(--blue);} .team.orange .you-chip{color:var(--orange);}
.series{display:flex;gap:5px;}
.team.orange .series{flex-direction:row-reverse;}
.pip{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.28);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);}
.pip.win-blue{background:var(--blue);box-shadow:0 0 8px color-mix(in srgb,var(--blue) 80%,transparent);}
.pip.win-orange{background:var(--orange);box-shadow:0 0 8px color-mix(in srgb,var(--orange) 80%,transparent);}
.score{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;line-height:.9;flex:none;}
.score.blue{color:var(--blue);text-shadow:0 0 18px color-mix(in srgb,var(--blue) 45%,transparent);}
.score.orange{color:var(--orange);text-shadow:0 0 18px color-mix(in srgb,var(--orange) 45%,transparent);}
.center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 24px;min-width:132px;background:rgba(0,0,0,.32);}
.center.ot{background:#e0202a;}
.timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
.ot-tag{font-size:10px;font-weight:900;letter-spacing:.3em;color:#ffd23c;margin-top:2px;display:none;}
.center.ot .ot-tag{display:block;color:#fff;}
.center.ot .timer{color:#fff;}

/* EVENT title — the React HUD's slanted banner treatment, hung as a tab UNDER the scorebar (angled
   BOTTOM corners so it reads as hanging down). Opaque so it still covers the game. Shown only when set. */
.event-line{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:0;box-sizing:border-box;
  max-width:820px;padding:6px 60px 8px;line-height:1.25;
  background:linear-gradient(180deg,rgb(20,23,31),rgb(11,13,19));
  clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,34px 100%);
  font-size:13px;font-weight:700;letter-spacing:3px;color:#d7dae0;text-transform:uppercase;
  text-align:center;white-space:nowrap;overflow:hidden;box-shadow:0 4px 9px rgba(0,0,0,.35);
  animation:drop .5s .05s cubic-bezier(.2,.7,.3,1) backwards;}
/* faint white sheen along the wider top edge (matches the React HUD banner) */
.event-line::before{content:'';position:absolute;left:34px;right:34px;top:0;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);}
.event-line:empty,.event-line.hidden{display:none;}

/* ── BOTTOM-RIGHT: the big player card (covers the in-game corner) ─────────────── */
.pcard{position:absolute;right:40px;bottom:40px;width:470px;z-index:2;
  background:linear-gradient(180deg,var(--glass),var(--glass-2));
  /* React HUD polygonal silhouette (angled left edge) + team-colour edge glow. clip-path clips a
     box-shadow, so the depth + glow use filter:drop-shadow, which follows the shape. Stays opaque. */
  clip-path:polygon(24px 0,100% 0,100% 100%,0 100%);
  filter:drop-shadow(0 22px 46px rgba(0,0,0,.6)) drop-shadow(0 0 16px color-mix(in srgb,var(--me) 42%,transparent));
  overflow:hidden;
  animation:rise .5s cubic-bezier(.2,.8,.25,1) backwards;}
/* bright team-colour accent along the top edge (after the slant) — the React HUD's edge highlight */
.pcard::before{content:'';position:absolute;top:0;left:24px;right:0;height:3px;z-index:3;
  background:var(--me);box-shadow:0 0 12px color-mix(in srgb,var(--me) 90%,transparent);}
.pcard.gone{opacity:0;transform:translateY(14px);transition:opacity .3s,transform .3s;pointer-events:none;}
@keyframes rise{from{opacity:0;transform:translateY(24px);}}

/* ── OCCASIONAL SPONSOR ROLL-OUT (RLCS-style) — a title-sponsor tab that rolls out horizontally
   from BEHIND the player card's left edge every so often, holds, then rolls back under it. Sits at
   a LOWER z-index than the opaque card, so retracted it is completely hidden beneath it. */
.spon-roll{position:absolute;right:96px;bottom:52px;z-index:1;
  display:flex;align-items:center;gap:12px;height:48px;max-width:340px;padding:0 18px 0 16px;border-radius:9px 0 0 9px;
  background:linear-gradient(180deg,#ffffff,#e9edf5);box-shadow:0 10px 26px rgba(0,0,0,.5);
  /* team-colour top edge — the only accent, kept on the visible (non-tucked) part */
  border-top:3px solid var(--me);
  transform:translateX(0);   /* retracted: fully tucked under the opaque card */
  transition:transform .62s cubic-bezier(.22,.9,.24,1);
  pointer-events:none;white-space:nowrap;}
/* rolled out: the whole tab clears the card's left edge, its right edge staying seamed under it */
.spon-roll.out{transform:translateX(-420px);}
.spon-roll.empty{display:none;}
.spon-roll .sr-lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#5a6474;}
.spon-roll img{max-height:32px;max-width:140px;object-fit:contain;display:block;}

/* ME row — big boost ring + name + stats */
.me{display:flex;align-items:center;gap:22px;padding:22px 22px 16px 32px;}   /* extra left pad clears the angled edge */
.boost{position:relative;width:150px;height:150px;flex:none;}
.boost canvas{position:absolute;inset:0;}
.boost .bcore{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.bval{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;line-height:.9;}
.blbl{font-size:11px;font-weight:800;letter-spacing:.28em;color:var(--muted);margin-top:4px;}
.me-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
.me-name{font-size:32px;font-weight:900;text-transform:uppercase;line-height:1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:#fff;}
.me-name small{display:block;font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--me);margin-top:5px;}
.me-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;}
.st{display:flex;flex-direction:column;align-items:center;gap:2px;}
.st b{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;}
.st span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.st.score-cell b{color:var(--me);}
/* genuine Rocket League HUD stat icons (from the React HUD) — CSS masks tinted to the team colour */
.st .stat-ic{width:22px;height:22px;margin-top:3px;display:inline-block;background-color:var(--me);
  -webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:contain;mask-size:contain;opacity:.92;}
.rlic-goal{-webkit-mask-image:url(/assets/rl/ball.png);mask-image:url(/assets/rl/ball.png);}
.rlic-assist{-webkit-mask-image:url(/assets/rl/assist.png);mask-image:url(/assets/rl/assist.png);}
.rlic-save{-webkit-mask-image:url(/assets/rl/save.png);mask-image:url(/assets/rl/save.png);}
.rlic-shot{-webkit-mask-image:url(/assets/rl/shot.png);mask-image:url(/assets/rl/shot.png);}
.rlic-demo{-webkit-mask-image:url(/assets/rl/demolition.png);mask-image:url(/assets/rl/demolition.png);}

/* TEAMMATES — compact rows under a divider */
.mates{border-top:1px solid var(--hair);background:rgba(0,0,0,.24);}
.mates:empty{display:none;}
.mate{display:flex;align-items:center;gap:12px;padding:11px 22px;position:relative;}
.mate+.mate{border-top:1px solid rgba(255,255,255,.05);}
.mate.demoed{opacity:.45;}
.mate-name{font-size:17px;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;min-width:0;}
.mate-mini{display:flex;gap:14px;flex:none;}
.mate-mini i{font-style:normal;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:#cfd6e6;}
.mate-mini i small{color:var(--muted);font-weight:700;margin-left:3px;font-size:11px;}
.mate-boost{flex:none;width:96px;display:flex;align-items:center;gap:8px;}
.mate-boost .bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;}
.mate-boost .fill{height:100%;background:var(--me);border-radius:5px;transition:width .25s ease;
  box-shadow:0 0 8px color-mix(in srgb,var(--me) 70%,transparent);}
.mate-boost .pct{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;width:30px;text-align:right;color:#e6ebf5;}
.mate-boost.nodata{opacity:.5;}
.mate-boost.nodata .fill{display:none;}
.mate-boost.nodata .pct{color:var(--muted);}

/* ── REPLAY TRANSITION — shutter slam (ported from the React HUD) ──────────────── */
.replay-wipe{position:absolute;top:0;bottom:0;left:-16%;right:-16%;z-index:80;pointer-events:none;overflow:hidden;
  --rp-dur:2.6s;display:flex;align-items:center;justify-content:center;}
.replay-wipe.logo-only{--rp-dur:1.9s;}
.rw-bars{position:absolute;inset:0;z-index:0;pointer-events:none;}
.rw-bars i{position:absolute;left:-30%;right:-30%;height:21%;display:block;
  background:linear-gradient(100deg,rgb(8,11,18) 0%,rgb(14,20,32) 55%,rgb(8,11,18) 100%);
  transform:translateX(var(--from)) skewX(-8deg);will-change:transform;backface-visibility:hidden;}
.rw-bars i:nth-child(1){top:0;   --from:-140%; --to:140%;}
.rw-bars i:nth-child(2){top:20%; --from:140%;  --to:-140%;}
.rw-bars i:nth-child(3){top:40%; --from:-140%; --to:140%;}
.rw-bars i:nth-child(4){top:60%; --from:140%;  --to:-140%;}
.rw-bars i:nth-child(5){top:80%; --from:-140%; --to:140%;}
.rw-bars i::after{content:'';position:absolute;top:0;bottom:0;width:4px;
  background:var(--replay-color,#fff);box-shadow:0 0 20px var(--replay-color,#fff);opacity:.92;}
.rw-bars i:nth-child(odd)::after{right:0;} .rw-bars i:nth-child(even)::after{left:0;}
.replay-wipe.play .rw-bars i{animation:rwBar var(--rp-dur) cubic-bezier(.5,.04,.28,1) both;}
.replay-wipe.play .rw-bars i:nth-child(2){animation-delay:45ms;}
.replay-wipe.play .rw-bars i:nth-child(3){animation-delay:90ms;}
.replay-wipe.play .rw-bars i:nth-child(4){animation-delay:135ms;}
.replay-wipe.play .rw-bars i:nth-child(5){animation-delay:180ms;}
@keyframes rwBar{0%{transform:translateX(var(--from)) skewX(-8deg);}20%{transform:translateX(0) skewX(-8deg);}
  80%{transform:translateX(0) skewX(-8deg);}100%{transform:translateX(var(--to)) skewX(-8deg);}}
@keyframes rwVeil{0%,14%{opacity:0;}26%{opacity:1;}76%{opacity:1;}90%,100%{opacity:0;}}
.replay-wipe.play .replay-scrim,.replay-wipe.play .replay-skin{animation:rwVeil var(--rp-dur) linear both;}
.replay-wipe::before{content:'';position:absolute;top:-10%;bottom:-10%;left:-30%;width:24%;z-index:3;pointer-events:none;
  background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.20) 46%,rgba(255,255,255,.32) 54%,transparent 100%);opacity:0;}
.replay-wipe.play::before{animation:rpStreak var(--rp-dur) ease;}
@keyframes rpStreak{0%,28%{opacity:0;left:-30%;}34%{opacity:.9;}56%{opacity:.9;left:120%;}62%,100%{opacity:0;left:120%;}}
.replay-skin{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);object-fit:cover;z-index:6;pointer-events:none;opacity:0;}
.replay-skin.hidden{display:none;}
.replay-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
  background:radial-gradient(58% 86% at 50% 50%,rgba(4,6,10,.66) 0%,rgba(4,6,10,.3) 48%,transparent 74%);}
.replay-stack{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:24px;}
.replay-logo{max-height:128px;max-width:600px;object-fit:contain;opacity:0;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));}
.replay-chevrons{display:flex;gap:9px;opacity:0;}
.replay-chevrons i{width:0;height:0;border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent var(--replay-color,#fff);}
.replay-text{position:relative;font-size:212px;font-weight:900;font-style:italic;letter-spacing:.05em;
  white-space:nowrap;text-transform:uppercase;line-height:1;padding:0 .16em;overflow:visible;
  color:transparent;-webkit-text-stroke:2.5px #f2f6ff;
  filter:drop-shadow(0 0 3px rgba(0,0,0,.8)) drop-shadow(0 0 30px color-mix(in srgb,var(--replay-color,#fff) 60%,transparent)) drop-shadow(0 8px 20px rgba(0,0,0,.5));opacity:0;}
.replay-text::after{content:'';position:absolute;left:6%;right:6%;bottom:-16px;height:5px;border-radius:3px;
  background:var(--replay-color,#fff);box-shadow:0 0 18px var(--replay-color,#fff);transform:scaleX(0);transform-origin:left;}
.replay-wipe.play .replay-text{animation:rpTextPunch var(--rp-dur) cubic-bezier(.2,.9,.25,1);}
.replay-wipe.play .replay-stack{animation:rpStackShake .5s cubic-bezier(.36,.07,.19,.97) calc(var(--rp-dur) * .28);}
.replay-wipe.play .replay-logo{animation:rpContent var(--rp-dur) ease .06s backwards;}
.replay-wipe.play .replay-chevrons{animation:rpContent var(--rp-dur) ease backwards;}
.replay-wipe.play .replay-text::after{animation:replayUnderline var(--rp-dur) cubic-bezier(.3,.6,.15,1);}
@keyframes rpContent{0%,20%{opacity:0;}32%{opacity:1;}74%{opacity:1;}84%,100%{opacity:0;}}
@keyframes rpTextPunch{0%,18%{opacity:0;transform:scale(1.4);}26%{opacity:1;transform:scale(.98);}30%{transform:scale(1.03);}35%{transform:scale(1);}76%{opacity:1;transform:scale(1);}86%,100%{opacity:0;transform:scale(1.08);}}
@keyframes rpStackShake{0%,100%{transform:translate(0,0);}15%{transform:translate(-4px,3px);}35%{transform:translate(4px,-2px);}55%{transform:translate(-3px,2px);}75%{transform:translate(2px,-1px);}}
@keyframes replayUnderline{0%,28%{transform:scaleX(0);}42%{transform:scaleX(1);}76%{transform:scaleX(1);}100%{transform:scaleX(1);}}
.replay-wipe.logo-only .replay-text,.replay-wipe.logo-only .replay-chevrons{display:none;}
.replay-wipe.logo-only .replay-logo{max-height:340px;max-width:1000px;}
.replay-wipe.logo-only .replay-scrim{background:radial-gradient(85% 105% at 50% 50%,rgba(2,4,8,.86) 0%,rgba(2,4,8,.74) 52%,rgba(2,4,8,.52) 100%);}
.replay-wipe.hidden{display:none;}
</style>
</head>
<body>

<!-- TOP SCOREBAR -->
<div id="scorebar" class="scorebar">
  <div id="team-blue" class="team blue">
    <img id="logo-blue" class="tlogo" src="/assets/rl.png" alt="">
    <div class="tmeta">
      <span id="name-blue" class="tname">BLUE</span>
      <div id="pips-blue" class="series"></div>
    </div>
    <span id="score-blue" class="score blue">0</span>
  </div>
  <div id="center" class="center">
    <span id="timer" class="timer">5:00</span>
    <span class="ot-tag">OVERTIME</span>
  </div>
  <div id="team-orange" class="team orange">
    <span id="score-orange" class="score orange">0</span>
    <div class="tmeta">
      <span id="name-orange" class="tname">ORANGE</span>
      <div id="pips-orange" class="series"></div>
    </div>
    <img id="logo-orange" class="tlogo" src="/assets/rl.png" alt="">
  </div>
</div>

<!-- EVENT title, hangs under the scorebar (only when one is set in the app) -->
<div id="event-line" class="event-line hidden"></div>

<!-- OCCASIONAL SPONSOR ROLL-OUT — tucked BEHIND the card (earlier in DOM + lower z-index), rolls out
     from the card's left edge every so often. -->
<div id="spon-roll" class="spon-roll empty" aria-hidden="true">
  <span class="sr-lbl">Presented by</span>
  <img id="spon-roll-logo" alt="">
</div>

<!-- BIG BOTTOM-RIGHT PLAYER CARD -->
<div id="pcard" class="pcard gone">
  <div class="me">
    <div class="me-info">
      <div id="me-name" class="me-name">PLAYER</div>
      <div class="me-stats">
        <div class="st score-cell"><b id="s-score">0</b><span>Score</span></div>
        <div class="st"><b id="s-goals">0</b><span class="stat-ic rlic-goal" title="Goals"></span></div>
        <div class="st"><b id="s-assists">0</b><span class="stat-ic rlic-assist" title="Assists"></span></div>
        <div class="st"><b id="s-saves">0</b><span class="stat-ic rlic-save" title="Saves"></span></div>
        <div class="st"><b id="s-shots">0</b><span class="stat-ic rlic-shot" title="Shots"></span></div>
        <div class="st"><b id="s-demos">0</b><span class="stat-ic rlic-demo" title="Bumps"></span></div>
      </div>
    </div>
    <div class="boost">
      <canvas id="boost-canvas" width="150" height="150"></canvas>
      <div class="bcore"><span id="boost-val" class="bval">0</span><span class="blbl">BOOST</span></div>
    </div>
  </div>
  <div id="mates" class="mates"></div>
</div>

<!-- REPLAY TRANSITION (shutter slam) — plays on a goal replay -->
<div id="replay-wipe" class="replay-wipe hidden">
  <div class="rw-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <img id="replay-skin" class="replay-skin hidden" alt="">
  <div class="replay-scrim"></div>
  <div class="replay-stack">
    <img id="replay-logo" class="replay-logo hidden" alt="">
    <div class="replay-chevrons"><i></i><i></i><i></i></div>
    <span id="replay-text" class="replay-text">REPLAY</span>
  </div>
</div>

<script>
'use strict';
const el = id => document.getElementById(id);
const teamOf = p => (Number(p && p.team) === 1 ? 1 : 0);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
let BLUE='#2f8dff', ORANGE='#ff7a33';

/* ── boost ring (270° arc, gap at the bottom) ─────────────────────────────────── */
const bctx = el('boost-canvas').getContext('2d');
function drawBoost(pct, color){
  const W=150,H=150,cx=W/2,cy=H/2,R=62,lw=13, start=Math.PI*0.75, total=Math.PI*1.5;
  bctx.clearRect(0,0,W,H); bctx.lineCap='round';
  bctx.beginPath(); bctx.arc(cx,cy,R,start,start+total);
  bctx.strokeStyle='rgba(255,255,255,.10)'; bctx.lineWidth=lw; bctx.stroke();
  const p=clamp(Number(pct)||0,0,100)/100;
  if(p>0){ bctx.beginPath(); bctx.arc(cx,cy,R,start,start+total*p);
    bctx.strokeStyle=color; bctx.lineWidth=lw; bctx.shadowColor=color; bctx.shadowBlur=18; bctx.stroke(); bctx.shadowBlur=0; }
}

/* ── colours from the active theme (server resolves team/brand/game mode) ──────── */
function applyColors(teams){
  const b=teams&&teams.blue&&teams.blue.color, o=teams&&teams.orange&&teams.orange.color;
  if(b){ BLUE=b; document.documentElement.style.setProperty('--blue',b); }
  if(o){ ORANGE=o; document.documentElement.style.setProperty('--orange',o); }
}
function setText(id,v){ const e=el(id); if(e) e.textContent=(v==null?'':v); }
function setImg(id,src,fb){ const e=el(id); if(!e) return; e.src=src||fb||'/assets/rl.png'; }
function renderPips(id,wins,bestOf,side){
  const c=el(id); if(!c) return; const need=Math.max(1,Math.ceil((bestOf||5)/2)); c.innerHTML='';
  for(let i=0;i<need;i++){ const d=document.createElement('div');
    d.className='pip'+(i<(wins||0)?(side==='blue'?' win-blue':' win-orange'):''); c.appendChild(d); }
}
function fmtTime(t){ if(t==null||isNaN(t)) return '0:00'; t=Math.max(0,Math.round(t));
  return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }

/* ── who is "me"? the local player = the reported target/spectated player ──────── */
let currentState = {};
function findMe(data){
  const players = data.players || [];
  const spec = data.spectatedPlayer;
  let me = players.find(p => p.name === spec);
  if(!me) me = players.find(p => p.boost != null);   // boost present = the reported (local) player
  return me || null;
}

/* ── main render ──────────────────────────────────────────────────────────────── */
function render(data){
  const teams = data.teams || {};
  const game = data.game || {};
  applyColors(teams);

  // scorebar
  const bs = game.blueScore ?? 0, os = game.orangeScore ?? 0;
  setText('name-blue', (teams.blue&&teams.blue.name)||'BLUE');
  setText('name-orange', (teams.orange&&teams.orange.name)||'ORANGE');
  setImg('logo-blue', teams.blue&&teams.blue.logo, '/assets/rl.png');
  setImg('logo-orange', teams.orange&&teams.orange.logo, '/assets/rl.png');
  setText('score-blue', bs); setText('score-orange', os);
  const ser = data.series || {blue:0,orange:0};
  renderPips('pips-blue', ser.blue, data.bestOf||5, 'blue');
  renderPips('pips-orange', ser.orange, data.bestOf||5, 'orange');
  const isOT = !!(game.isOT);
  el('center').classList.toggle('ot', isOT);
  setText('timer', data.formattedTime || game.formattedTime || fmtTime(game.time));

  // EVENT title under the bar — only when one is configured in the app
  const ev = (data.eventName || '').trim();
  const evEl = el('event-line');
  if(evEl){ evEl.textContent = ev; evEl.classList.toggle('hidden', !ev); }

  // perspective: my team (drives the card + boost colour; no on-bar "YOU" marker)
  const me = findMe(data);
  const myTeamNum = me ? teamOf(me) : null;
  el('team-blue').classList.toggle('mine', myTeamNum===0);
  el('team-orange').classList.toggle('mine', myTeamNum===1);
  const meColor = myTeamNum===1 ? ORANGE : BLUE;
  document.documentElement.style.setProperty('--me', meColor);

  const card = el('pcard');
  if(!me){ card.classList.add('gone'); drawBoost(0, meColor); return; }
  card.classList.remove('gone');

  // ME
  setText('me-name', me.name);
  setText('s-score', me.score||0); setText('s-goals', me.goals||0); setText('s-assists', me.assists||0);
  setText('s-saves', me.saves||0); setText('s-shots', me.shots||0); setText('s-demos', me.demos||0);
  const boost = me.boost==null ? 0 : me.boost;
  setText('boost-val', Math.round(boost)); drawBoost(boost, meColor);

  // TEAMMATES (my team, minus me) — stats always; boost only when the feed carries it
  const mates = (data.players||[]).filter(p => teamOf(p)===myTeamNum && p.name!==me.name);
  const wrap = el('mates'); wrap.innerHTML='';
  mates.forEach(p => {
    const row=document.createElement('div'); row.className='mate'+(p.isDemolished?' demoed':'');
    const nm=document.createElement('div'); nm.className='mate-name'; nm.textContent=p.name;
    const mini=document.createElement('div'); mini.className='mate-mini';
    mini.innerHTML = '<i>'+(p.score||0)+'<small>PTS</small></i><i>'+(p.goals||0)+'<small>G</small></i><i>'+(p.saves||0)+'<small>SV</small></i>';
    const bst=document.createElement('div');
    const hasBoost = p.boost!=null;
    bst.className='mate-boost'+(hasBoost?'':' nodata');
    const pct = hasBoost ? clamp(Math.round(p.boost),0,100) : 0;
    bst.innerHTML = '<div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><span class="pct">'+(hasBoost?pct:'--')+'</span>';
    row.appendChild(nm); row.appendChild(mini); row.appendChild(bst);
    wrap.appendChild(row);
  });

  // keep the sponsor roll-out's logo current (the title-tagged brand-kit sponsor)
  updateSponsorRoll();
}

/* ── OCCASIONAL SPONSOR ROLL-OUT (RLCS-style) ──────────────────────────────────────
   The title sponsor tab rolls out from behind the card every SPON_EVERY_MS for SPON_HOLD_MS, then
   rolls back. Only fires when a title sponsor is set and the card is on screen, and never over a
   goal replay. */
const SPON_EVERY_MS = 32000, SPON_HOLD_MS = 5200;
let sponCycleTimer = null, sponHideTimer = null;
function sponsorLogo(){ const b = currentState.brand || {}; return (b.spots && b.spots.title) || ''; }
function updateSponsorRoll(){
  const roll = el('spon-roll'); if(!roll) return;
  if(!currentState.rlSponsorRoll){ roll.classList.add('empty'); roll.classList.remove('out'); return; }   // producer toggle off
  const logo = sponsorLogo(), img = el('spon-roll-logo');
  if(logo){ if(img.getAttribute('src')!==logo) img.src = logo; roll.classList.remove('empty'); }
  else { roll.classList.add('empty'); roll.classList.remove('out'); }
}
function rollSponsorOut(){
  const roll = el('spon-roll'); if(!roll) return;
  if(!currentState.rlSponsorRoll) return;                 // producer disabled the sponsor roll-out
  if(!sponsorLogo()) return;                              // nothing to show
  if(goalCycleActive) return;                             // don't clash with a replay
  if(el('pcard').classList.contains('gone')) return;      // card not on screen
  roll.classList.add('out');
  clearTimeout(sponHideTimer);
  sponHideTimer = setTimeout(() => roll.classList.remove('out'), SPON_HOLD_MS);
}
function startSponsorCycle(){
  clearInterval(sponCycleTimer);
  setTimeout(rollSponsorOut, 6500);                        // first pass shortly after load
  sponCycleTimer = setInterval(rollSponsorOut, SPON_EVERY_MS);
}

/* ── REPLAY TRANSITION (shutter slam, ported from the React HUD) ───────────────────
   Event-driven: a goal replay starts (view_change 'goal') → the REPLAY slam plays; the API's
   'replay_will_end' cue + a hold → the logo outro slam; whichever of that or the ReplayEnd (view
   'hud') lands first wins. Replays vary ~9-14s, so nothing is predicted from an average. */
let replayTimer=null, outroPlayed=false, goalCycleActive=false, goalCycleTimer=null,
    introPlayed=false, outroSchedTimer=null;
const REPLAY_MAX_MS=15000, REPLAY_WILLEND_DELAY_MS=1800;

function applyReplayColor(side){ document.documentElement.style.setProperty('--replay-color', side===1?ORANGE:BLUE); }
function showReplay(mode){
  if(currentState.rlReplayTransitions===false) return;   // producer disabled the animated replay transitions
  const w=el('replay-wipe'); if(!w) return;
  const logoOnly = mode==='logo';
  w.classList.toggle('logo-only', logoOnly);
  const rp=currentState.replay||{}, brandLogo=currentState.brand && currentState.brand.logo, hasSkin=!!rp.skin;
  const logo = logoOnly ? (rp.outroLogo || (hasSkin?null:(rp.logo||brandLogo||null))) : (rp.logo||brandLogo||null);
  const im=el('replay-logo'); if(im){ if(logo){ im.src=logo; im.classList.remove('hidden'); } else im.classList.add('hidden'); }
  const sk=el('replay-skin'); if(sk){ if(rp.skin){ sk.src=rp.skin; sk.classList.remove('hidden'); } else { sk.removeAttribute('src'); sk.classList.add('hidden'); } }
  if(logoOnly && !logo && !hasSkin) return;   // nothing to show on the outro
  w.classList.remove('hidden','play'); void w.offsetWidth; w.classList.add('play');
  clearTimeout(replayTimer);
  replayTimer=setTimeout(()=>{ w.classList.add('hidden'); w.classList.remove('play'); }, logoOnly?2150:2850);
}
function fireIntroSwipe(){ if(!goalCycleActive || introPlayed) return; introPlayed=true; showReplay('full'); }
function playReplayOutro(){ if(!goalCycleActive || outroPlayed) return; outroPlayed=true; showReplay('logo'); }
function scheduleReplayOutro(){ clearTimeout(outroSchedTimer); outroSchedTimer=setTimeout(playReplayOutro, REPLAY_MAX_MS); }   // safety net only
function scheduleOutroAfterWillEnd(){ if(!goalCycleActive || outroPlayed) return; clearTimeout(outroSchedTimer); outroSchedTimer=setTimeout(playReplayOutro, REPLAY_WILLEND_DELAY_MS); }
function goalEvent(side){
  if(goalCycleActive) return;
  goalCycleActive=true; outroPlayed=false; introPlayed=false;
  // pull the sponsor tab back under the card so it never sits out during a replay
  const roll=el('spon-roll'); if(roll){ roll.classList.remove('out'); clearTimeout(sponHideTimer); }
  applyReplayColor(side);
  clearTimeout(goalCycleTimer); goalCycleTimer=setTimeout(endGoalCycle, 20000);   // hard backstop
  fireIntroSwipe();          // the replay is starting → play the REPLAY slam now
  scheduleReplayOutro();     // arm the safety-net outro
}
function endGoalCycle(){
  clearTimeout(goalCycleTimer); clearTimeout(outroSchedTimer);
  if(goalCycleActive && !outroPlayed) playReplayOutro();   // replay ended → make sure the outro fires
  goalCycleActive=false; introPlayed=false; outroPlayed=false;
}

/* ── message dispatch (full_state + live ticks + replay cycle) ─────────────────── */
function dispatch(msg){
  if(!msg || !msg.type) return;
  switch(msg.type){
    case 'full_state': currentState={...currentState,...msg.data}; render(currentState); break;
    case 'state_update':
      currentState={...currentState, game:msg.data.game, players:msg.data.players, spectatedPlayer:msg.data.spectatedPlayer};
      render(currentState); break;
    case 'view_change':
      if(msg.data.view==='goal'){ currentState._goal=msg.data.goal; goalEvent(msg.data.goal?Number(msg.data.goal.team):0); }
      else if(msg.data.view==='hud'){ endGoalCycle(); }
      break;
    case 'replay_will_end': scheduleOutroAfterWillEnd(); break;
    case 'game_reset': endGoalCycle(); render(currentState); break;
  }
}

/* ── WS bridge (:3001) — same token flow as rl-hud.html ───────────────────────── */
const HTTP_BASE='http://'+(location.hostname||'localhost')+':3000';
const WS_URL='ws://'+(location.hostname||'localhost')+':3001';
let _wsToken=null;
async function connect(){
  if(_wsToken==null){ try{ _wsToken=(await (await fetch(HTTP_BASE+'/api/ws-token')).json()).token||''; }catch(e){ _wsToken=''; } }
  const ws=new WebSocket(WS_URL+(_wsToken?('?token='+encodeURIComponent(_wsToken)):''));
  ws.onopen=()=>{ try{ ws.send(JSON.stringify({type:'register',role:'overlay',page:location.pathname})); ws.send(JSON.stringify({type:'request_state'})); }catch(e){} };
  // Contain render throws so the source keeps updating instead of freezing (see rl-hud.html).
  ws.onmessage=({data})=>{ let m; try{ m=JSON.parse(data); }catch{ return; }
    try { dispatch(m); } catch (e) { console.error('[rl-player] render error on ' + (m && m.type) + ':', e); } };
  ws.onclose=()=>setTimeout(connect,800);
  ws.onerror=()=>{ try{ ws.close(); }catch{} };
}

/* ── dev preview: ?dev with sample data, no server needed ─────────────────────── */
const DEV = {
  brand:{ spots:{ title:'/assets/rl.png' } },   // title sponsor, for the roll-out preview
  rlSponsorRoll:true,                            // preview the roll-out in ?dev
  teams:{ blue:{name:'MY TEAM',logo:'/assets/rl.png',color:'#2f8dff'}, orange:{name:'OPPONENT',logo:'/assets/rl.png',color:'#ff7a33'} },
  game:{ blueScore:2, orangeScore:1, isOT:false, time:134 }, series:{ blue:1, orange:0 }, bestOf:5,
  spectatedPlayer:'YOU',
  players:[
    {name:'YOU',team:0,score:512,goals:2,assists:1,saves:2,shots:5,demos:1,boost:73},
    {name:'MATE ONE',team:0,score:388,goals:1,assists:2,saves:1,shots:3,demos:0,boost:41},
    {name:'MATE TWO',team:0,score:264,goals:0,assists:1,saves:3,shots:2,demos:1,boost:88},
    {name:'RIVAL A',team:1,score:470,goals:2,saves:1,shots:4},
    {name:'RIVAL B',team:1,score:300,goals:0,saves:2,shots:1},
    {name:'RIVAL C',team:1,score:210,goals:1,saves:1,shots:2},
  ],
  formattedTime:'2:14'
};
if(/[?&]dev\b/.test(location.search)){ currentState=DEV; render(DEV); }
else { drawBoost(0, BLUE); connect(); }
startSponsorCycle();
</script>
