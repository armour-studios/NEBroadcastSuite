<!DOCTYPE html>
<!--
  interview-desk.html — one-on-one interview layout: host cam (left, 38%) + guest cam (right, 62%).
  Host = casters slot 1; guest = casters.interviewee (set via Match Control > Interviewee).
  Stage shows when casters.visible is true. Shares duorow.html design language.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
  <style>
    :root {
      --duo-surface: #1a1d24; --duo-surface2: #20242e; --duo-border: #2e3340;
      --duo-accent: #e83a8b; --duo-accent2: #8b5cf6; --duo-muted: #8b93a8;
      --feat: var(--duo-accent);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: 'Inter', system-ui, sans-serif; color: #e8eaf0; -webkit-font-smoothing: antialiased; }

    .id-stage { position: absolute; inset: 0; display: flex; flex-direction: column;
      padding: 28px 24px 16px; opacity: 0; transition: opacity .4s ease; }
    .id-stage.show { opacity: 1; }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .id-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
      gap: 16px; margin-bottom: 18px; min-height: 40px; }
    .id-eyebrow { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 700; font-size: 18px;
      letter-spacing: .42em; text-transform: uppercase; color: var(--duo-accent-ink, var(--duo-accent)); }
    .id-title { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 700; font-size: 40px;
      letter-spacing: .02em; text-transform: uppercase; color: #fff; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 1400px; }
    .id-title.is-empty { display: none; }
    /* separator dot between eyebrow and title */
    .id-sep { width: 5px; height: 5px; border-radius: 50%; background: var(--duo-accent); opacity: .5; flex: 0 0 auto; }
    .id-title.is-empty ~ .id-sep { display: none; }

    /* ── Body ─────────────────────────────────────────────────────────────── */
    .id-body { flex: 1 1 0; min-height: 0; display: flex; gap: 18px; align-items: center; }

    /* ── Cam card shared ──────────────────────────────────────────────────── */
    .cam-card { display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--duo-border); background: var(--duo-surface);
      box-shadow: 0 18px 50px rgba(0,0,0,.55); opacity: 0; }
    .id-stage.show .cam-card.host-card { animation: inL .7s cubic-bezier(.16,.84,.24,1) .1s forwards; }
    .id-stage.show .cam-card.guest-card { animation: inR .7s cubic-bezier(.16,.84,.24,1) .2s forwards; }
    @keyframes inL { from { opacity: 0; transform: translateX(-50px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes inR { from { opacity: 0; transform: translateX(50px) scale(.97); } to { opacity: 1; transform: none; } }

    .cam-card::before { content: ''; display: block; height: 4px; flex: 0 0 auto; }
    .host-card::before { background: linear-gradient(90deg, var(--duo-accent), transparent 70%); }
    .guest-card::before { background: linear-gradient(90deg, transparent 30%, var(--feat) 70%, var(--duo-accent2)); }

    .cam-hole { position: relative; width: 100%; background: #0d0f14; overflow: hidden; }
    .cam-hole iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* ?cams=off framing */
    .id-stage.frames-only .cam-hole { background: transparent; }
    .id-stage.frames-only .cam-card { background: transparent; box-shadow: none; border-color: transparent; }
    .id-stage.frames-only .cam-card::before { display: none; }

    /* ── Host cam (left, 38%) ─────────────────────────────────────────────── */
    .host-card { flex: 0 0 720px; }
    .host-card .cam-hole { aspect-ratio: 16 / 9; }
    .host-plate { display: flex; align-items: center; gap: 12px; height: 58px; flex: 0 0 58px;
      padding: 0 18px; background: linear-gradient(180deg, var(--duo-surface2), var(--duo-surface));
      border-top: 1px solid var(--duo-border); }
    .host-label { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
      color: var(--duo-accent-ink, var(--duo-accent)); flex: 0 0 auto; }
    .host-name { font-size: 22px; font-weight: 800; text-transform: uppercase; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; }
    .host-handle { font-size: 13px; font-weight: 600; color: var(--duo-muted); flex: 0 0 auto; }
    .host-handle::before { font-family: 'Font Awesome 6 Brands'; font-weight: 400; margin-right: 5px; }
    .host-handle.twitch::before  { content: "\f1e8"; color: #9146ff; }
    .host-handle.youtube::before { content: "\f167"; color: #ff0033; }
    .host-handle.x-twitter::before { content: "\e61b"; color: #e8eaf0; }
    .host-handle.instagram::before { content: "\f16d"; color: #e1306c; }
    .host-handle.tiktok::before  { content: "\e07b"; color: #25f4ee; }
    .host-handle.kick::before { content: "K"; font-family: 'Inter', sans-serif; font-weight: 900; color: #53fc18; }
    .host-handle.link::before { content: "\f0c1"; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: var(--duo-muted); }

    /* ── Guest cam (right, 62%) ───────────────────────────────────────────── */
    .guest-card { flex: 1 1 0; min-width: 0; }
    .guest-card .cam-hole { aspect-ratio: 16 / 9; }
    .guest-plate { display: flex; align-items: center; gap: 16px; min-height: 72px; flex: 0 0 72px;
      padding: 0 24px; background: linear-gradient(180deg, var(--duo-surface2), var(--duo-surface));
      border-top: 1px solid var(--duo-border); position: relative; overflow: hidden; }
    /* colour accent bar on the left of the guest plate, tinted to guest team colour */
    .guest-plate::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--feat); }
    .guest-team-logo { width: 48px; height: 48px; object-fit: contain; flex: 0 0 48px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
    .guest-team-logo.is-empty { display: none; }
    .guest-names { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 0; }
    .guest-name { font-family: 'Rajdhani','Inter',sans-serif; font-weight: 800; font-size: 44px;
      line-height: 1; text-transform: uppercase; color: #fff; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .guest-team { font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--feat); }
    .guest-team.is-empty { display: none; }
    /* placeholder shown when no interviewee is set */
    .guest-empty { display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 600; letter-spacing: .1em; color: rgba(139,147,168,.35); height: 100%; }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .id-footer { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 12px; }
    .deck-strip { max-width: 900px; padding: 7px 28px; text-align: center; position: relative;
      background: linear-gradient(90deg, transparent, rgba(14,16,22,.92) 12%, rgba(14,16,22,.92) 88%, transparent);
      border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06); }
    .deck-strip::before, .deck-strip::after { content: ''; position: absolute; top: 50%;
      width: 48px; height: 1px; background: linear-gradient(90deg, transparent, var(--duo-accent)); opacity: .5; }
    .deck-strip::before { left: 12px; } .deck-strip::after { right: 12px; transform: scaleX(-1); }
    .deck-strip-text { font-size: 12px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: #c8ced8; white-space: nowrap; }
    .deck-strip.is-empty { display: none; }

    /* ── Preview mode (file:// open directly) ─────────────────────────────── */
    .preview .cam-hole { background: repeating-linear-gradient(45deg, #181b22, #181b22 16px, #20242e 16px, #20242e 32px); }
    /* Preview prints the slot label in the hole; the live empty-state text would sit on top of it. */
    .preview .guest-empty { visibility: hidden; }
    .preview .cam-hole::after { content: attr(data-label); position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      font-weight: 800; letter-spacing: .25em; color: #4a5162; }
  </style>
</head>
<body>
  <div id="stage" class="id-stage">
    <div class="id-header">
      <span class="id-eyebrow" id="eyebrow">Interview</span>
      <span class="id-sep"></span>
      <span class="id-title is-empty" id="title"></span>
    </div>
    <div class="id-body">
      <!-- Host cam (left) -->
      <div class="cam-card host-card">
        <div class="cam-hole" id="host-hole" data-label="HOST"></div>
        <div class="host-plate">
          <span class="host-label">Host</span>
          <span class="host-name" id="host-name">—</span>
          <span class="host-handle" id="host-handle" style="display:none"></span>
        </div>
      </div>
      <!-- Guest / interviewee cam (right) -->
      <div class="cam-card guest-card">
        <div class="cam-hole" id="guest-hole" data-label="GUEST">
          <div class="guest-empty" id="guest-empty">No interviewee set</div>
        </div>
        <div class="guest-plate">
          <img class="guest-team-logo is-empty" id="guest-logo" alt="">
          <div class="guest-names">
            <div class="guest-name" id="guest-name">—</div>
            <div class="guest-team is-empty" id="guest-team"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="id-footer">
      <div class="deck-strip is-empty" id="deck-strip">
        <span class="deck-strip-text" id="tagline"></span>
      </div>
    </div>
  </div>

  <script src="scene-base.js"></script>
  <script>
    function el(id) { return document.getElementById(id); }
    const QP      = new URLSearchParams(location.search);
    const NO_CAMS = QP.get('cams') === 'off';
    const QEYEBROW = QP.get('eyebrow');
    const QTITLE   = QP.get('title');
    if (NO_CAMS) el('stage').classList.add('frames-only');

    let _hostCamUrl  = null;
    let _guestCamUrl = null;

    function resolveTitle(data) {
      if (QTITLE != null) { const t = QTITLE.trim(); return /^(off|none|hide|0)$/i.test(t) ? '' : t; }
      return (data.eventName || '').toString().trim();
    }

    function applyBrandTheme(data) {
      const root = document.documentElement;
      const color = SceneBase.brandColor(data), accent2 = SceneBase.brandAccent(data);
      if (color) root.style.setProperty('--duo-accent', color);
      if (accent2) root.style.setProperty('--duo-accent2', accent2);
      if (data.fontFamily) root.style.fontFamily = `'${data.fontFamily}', 'Inter', system-ui, sans-serif`;
    }

    function renderHost(casters) {
      const slots = SceneBase.castersBySlots(casters, 1);
      const c = slots[0] || {};
      el('host-name').textContent = (c.name || '—').toString();
      const handle = SceneBase.formatCasterHandle(c);
      const handleEl = el('host-handle');
      if (handle) {
        const social = (c.social || 'none').toString().toLowerCase();
        handleEl.className = 'host-handle ' + SceneBase.socialPlatformClass(social);
        handleEl.textContent = handle;
        handleEl.style.display = '';
      } else {
        handleEl.style.display = 'none';
      }
      if (NO_CAMS) return;
      const camUrl = ((c.camUrl) || '').trim();
      if (camUrl === _hostCamUrl) return;
      _hostCamUrl = camUrl;
      const hole = el('host-hole');
      hole.querySelectorAll('iframe').forEach(f => f.remove());
      if (camUrl) {
        const iframe = document.createElement('iframe');
        iframe.src = camUrl;
        iframe.setAttribute('allow', 'autoplay; encrypted-media; microphone; camera; fullscreen');
        iframe.referrerPolicy = 'no-referrer';
        hole.appendChild(iframe);
      }
    }

    function renderGuest(data) {
      const iv = (data.casters || {}).interviewee;
      const emptyEl = el('guest-empty');
      if (iv && iv.name) {
        emptyEl.style.display = 'none';
        el('guest-name').textContent = (iv.name || '—').toString().toUpperCase();
        const teamEl = el('guest-team');
        if (iv.teamName) { teamEl.textContent = iv.teamName.toString().toUpperCase(); teamEl.classList.remove('is-empty'); }
        else teamEl.classList.add('is-empty');
        if (iv.color) document.documentElement.style.setProperty('--feat', iv.color);
        // Logo: try team logo from teams state
        const logoEl = el('guest-logo');
        const side = iv.side;
        const teamData = side && data.teams && data.teams[side] ? data.teams[side] : null;
        if (teamData) {
          SceneBase.applyTeamLogo(logoEl, teamData.customLogo, teamData.logo);
          logoEl.classList.remove('is-empty');
        } else {
          logoEl.removeAttribute('src'); logoEl.classList.add('is-empty');
        }
      } else {
        emptyEl.style.display = '';
        el('guest-name').textContent = '—';
        el('guest-team').classList.add('is-empty');
        el('guest-logo').removeAttribute('src'); el('guest-logo').classList.add('is-empty');
      }
      if (NO_CAMS) return;
      const camUrl = ((iv && iv.camUrl) || '').trim();
      if (camUrl === _guestCamUrl) return;
      _guestCamUrl = camUrl;
      const hole = el('guest-hole');
      hole.querySelectorAll('iframe').forEach(f => f.remove());
      if (camUrl) {
        const iframe = document.createElement('iframe');
        iframe.src = camUrl;
        iframe.setAttribute('allow', 'autoplay; encrypted-media; microphone; camera; fullscreen');
        iframe.referrerPolicy = 'no-referrer';
        hole.appendChild(iframe);
      }
    }

    function render(data) {
      data = data || {};
      applyBrandTheme(data);
      const casters = data.casters || {};
      el('stage').classList.toggle('show', SceneBase.casterStageVisible(casters));

      const eyebrow = QEYEBROW != null ? QEYEBROW.trim() : 'Interview';
      el('eyebrow').textContent = eyebrow;

      const ttl = resolveTitle(data);
      el('title').textContent = ttl.toUpperCase();
      el('title').classList.toggle('is-empty', !ttl);

      renderHost(casters);
      renderGuest(data);

      const tag = ((casters.lowerThird) || '').toString().trim();
      const strip = el('deck-strip'), tagEl = el('tagline');
      if (tag) { tagEl.textContent = tag; strip.classList.remove('is-empty'); }
      else { tagEl.textContent = ''; strip.classList.add('is-empty'); }
    }

    if (location.protocol === 'file:') {
      document.documentElement.classList.add('preview');
      render({
        casters: { visible: true, lowerThird: 'Series MVP Interview',
          list: [{ id: 'c1', name: 'Jota', handle: 'jotacasts', slot: 1, social: 'twitch' }],
          interviewee: { name: 'Aqua', teamName: 'Velocity Gaming', color: '#3b82f6', side: 'blue' } },
        teams: { blue: { name: 'Velocity Gaming', color: '#3b82f6' }, orange: { name: 'Team Apex', color: '#f97316' } },
        eventName: 'Summer Showdown 2026',
      });
    } else {
      SceneBase.connect(render);
    }
  </script>
</body>
</html>
