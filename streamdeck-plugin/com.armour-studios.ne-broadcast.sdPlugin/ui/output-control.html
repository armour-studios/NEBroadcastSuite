<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Output">
    <sdpi-select setting="output" default="stream">
      <option value="stream">Stream (Go live)</option>
      <option value="record">Recording</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Safety">
    <sdpi-checkbox setting="hold" default="true" label="Hold key to start or stop (prevents stray taps)"></sdpi-checkbox>
  </sdpi-item>
</body>
</html>
